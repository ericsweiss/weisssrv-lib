---
# Local guardrails: run `pre-commit install` once, then these run on every
# commit. They mirror the fast CI lint-stage checks (secret scan, yamllint,
# whitespace/EOF, doc links); heavier tool-dependent jobs stay CI-only. This is
# lint/pre-commit-config.yaml, the copy consumers vendor, plus the doc-link
# hook — keep the two in step. Revs are pinned; bump them deliberately.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-yaml
        # --unsafe: syntax-only parse (no tag construction), so GitLab's
        # `!reference` and Ansible's `!vault` custom tags do not false-fail.
        args: [--allow-multiple-documents, --unsafe]

  - repo: local
    hooks:
      - id: check-doc-links
        name: Docs relative Markdown links resolve
        entry: python3 scripts/check-doc-links.py
        language: system
        files: \.md$
        pass_filenames: false
