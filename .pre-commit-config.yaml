---
# Local guardrails: run `pre-commit install` once, then these run on every
# commit. This is lint/pre-commit-config.yaml, the copy consumers vendor, with
# this repo's own local hooks; tests/test_lint_profiles.py holds the revs equal.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # The library's own profile. It cannot live at the repo root:
        # ansible-lint would discover it and lose its yaml[*] rules.
        args: [-c, lint/yamllint-self.yml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-yaml
        # --unsafe: syntax-only parse (no tag construction), so GitLab's
        # `!reference` and Ansible's `!vault` custom tags do not false-fail.
        args: [--allow-multiple-documents, --unsafe]

  - repo: local
    hooks:
      - id: check-doc-links
        name: Docs relative Markdown links resolve
        entry: python3 scripts/check-doc-links.py
        language: system
        files: \.md$
        pass_filenames: false
