---
# Proxmox VM provisioning with cloud-init

- name: Set VM ID
  ansible.builtin.set_fact:
    proxmox_vm_id: "{{ vmid | default(proxmox_vm_target_ip.split('.')[-1]) }}"

# Guest-type gate. Recomputed every run (never a persisted host fact), so a
# subsequent include of this role with a different proxmox_vm_guest_type re-evaluates
# cleanly. Every Linux-only task below guards on `not _proxmox_vm_is_windows`; the
# Windows-only tasks guard on `_proxmox_vm_is_windows`.
- name: Determine guest type
  ansible.builtin.set_fact:
    _proxmox_vm_is_windows: "{{ (proxmox_vm_guest_type | default('linux')) == 'windows' }}"

# Storage selection logic: auto-select based on Proxmox host role if not specified
- name: Determine Proxmox host role
  ansible.builtin.set_fact:
    _proxmox_vm_host_role: "{{ hostvars[proxmox_host]['proxmox_role'] | default('compute') }}"

- name: Auto-select storage based on Proxmox host role
  ansible.builtin.set_fact:
    _proxmox_vm_effective_storage: >-
      {{
        proxmox_storage |
        default(proxmox_storage_defaults[_proxmox_vm_host_role] | default('local-ssd'))
      }}

- name: Display storage selection
  ansible.builtin.debug:
    msg: "VM {{ inventory_hostname }} will use storage: {{ _proxmox_vm_effective_storage }} (host: {{ proxmox_host }}, role: {{ _proxmox_vm_host_role }})"

- name: Check if VM already exists
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    set -o errexit -o nounset -o pipefail
    # Check cluster-wide — VMs may be HA-migrated to a different node.
    resources_json="$(pvesh get /cluster/resources --type vm --output-format json)"
    python3 -c "import sys,json; vmids=[r['vmid'] for r in json.loads(sys.argv[1])]; sys.exit(0 if {{ proxmox_vm_id | int }} in vmids else 1)" "$resources_json"
  args:
    executable: /bin/bash
  register: proxmox_vm_exists
  changed_when: false
  failed_when: proxmox_vm_exists.rc not in [0, 1]
  check_mode: false

# Named here rather than as an undefined-variable error from inside the `qm
# create` shell command, where the failure points at the wrong thing. Windows
# guests take no cloud-init drive, so the gateway is Linux-only. Placed after
# the existence probe so it can carry the SAME gate as the cloud-init tasks —
# a run that only reconciles disks, HA or pool membership on an existing guest
# reads neither value and must not fail on them.
- name: Assert the required cloud-init inputs are set
  ansible.builtin.assert:
    that:
      - proxmox_vm_cloudinit_gateway | default('') | length > 0
      - proxmox_vm_cloudinit_dns | default([]) | length > 0
    fail_msg: >-
      proxmox_vm_cloudinit_gateway (the VM's default gateway — no generic
      default) and proxmox_vm_cloudinit_dns (alias: dns_servers) are required
      on the Linux create path.
    quiet: true
  when:
    - not _proxmox_vm_is_windows
    - proxmox_vm_exists.rc != 0
    - not (proxmox_vm_skip_create | default(false))

# An existing VM may have HA-migrated off the inventory proxmox_host, so
# reconcile tasks (qm config/set against a live VM) must run on its ACTUAL
# node. Look it up cluster-wide; a not-yet-created VM falls back to
# proxmox_host, where the create path below places it. (Mirrors proxmox_lxc's
# lxc_reconcile_host.)
- name: Look up the existing VM's current node
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.command:
    cmd: pvesh get /cluster/resources --type vm --output-format json
  register: proxmox_vm_cluster_resources
  changed_when: false
  check_mode: false
  when: proxmox_vm_exists.rc == 0

- name: Resolve the node to delegate VM reconcile tasks to
  ansible.builtin.set_fact:
    # For an existing VM, resolve its CURRENT node with NO proxmox_host
    # fallback: silently defaulting to proxmox_host could reconcile against
    # the wrong node if the lookup ever returned nothing. The assert below
    # fails loud instead. A not-yet-created VM uses proxmox_host (create path).
    proxmox_vm_reconcile_host: >-
      {{ (proxmox_vm_cluster_resources.stdout | from_json
          | selectattr('vmid', 'equalto', proxmox_vm_id | int)
          | map(attribute='node') | first | default(''))
         if proxmox_vm_exists.rc == 0 else proxmox_host }}

- name: Fail loud if an existing VM's current node could not be resolved
  ansible.builtin.assert:
    that:
      - proxmox_vm_reconcile_host | length > 0
    fail_msg: >-
      Could not resolve the current node for existing VM {{ proxmox_vm_id }}
      from /cluster/resources; refusing to fall back to the inventory
      proxmox_host ({{ proxmox_host }}), which may not hold the VM.
  when: proxmox_vm_exists.rc == 0

# Verify storage pool exists on target host before proceeding
# Only check when creating a new VM - existing VMs may be on different storage during migrations
- name: Get available storage pools on target host
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.command: pvesm status
  register: proxmox_vm_storage_list
  changed_when: false
  check_mode: false
  when: proxmox_vm_exists.rc != 0

- name: Check if required storage pool exists
  ansible.builtin.set_fact:
    _proxmox_vm_storage_exists: "{{ proxmox_vm_storage_list.stdout_lines | select('match', '^' + _proxmox_vm_effective_storage + '\\s') | list | length > 0 }}"
  when: proxmox_vm_exists.rc != 0

- name: Fail if required storage pool does not exist
  ansible.builtin.fail:
    msg: |
      Storage pool '{{ _proxmox_vm_effective_storage }}' not found on {{ proxmox_host }}.

      Create the pool on that node first (ZFS pools are never created by
      Ansible) or set proxmox_storage / proxmox_storage_defaults.

      Available storage pools on {{ proxmox_host }}:
      {{ proxmox_vm_storage_list.stdout | default('(unable to retrieve)') }}
  when:
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_storage_exists | default(true)
    - not ansible_check_mode

# errexit: without it the task rc is `echo`'s, so a failed `pvesh create /pools`
# reports success. The `pvesh get` probe is exempt as an `if` condition.
- name: Ensure standard resource pools exist
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      if ! pvesh get /pools/{{ item }} --output-format json 2>/dev/null; then
        pvesh create /pools --poolid {{ item }}
        echo "created"
      else
        echo "exists"
      fi
    executable: /bin/bash
  loop: "{{ proxmox_resource_pools | default([]) }}"
  register: proxmox_vm_pool_creation_result
  # Match the sentinel on its own line: the `pvesh get` JSON body can itself
  # contain the substring "created".
  changed_when: "'created' in (proxmox_vm_pool_creation_result.stdout_lines | default([]))"
  loop_control:
    label: "{{ item }}"
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - proxmox_resource_pools is defined

- name: Validate resource pool is in standard list
  ansible.builtin.fail:
    msg: |
      Resource pool '{{ proxmox_resource_pool }}' is not in the standard pools list.

      Standard pools: {{ proxmox_resource_pools | default([]) | join(', ') }}

      Either use one of the standard pools or add '{{ proxmox_resource_pool }}'
      to proxmox_resource_pools in group_vars/all.yml.
  when:
    - proxmox_vm_exists.rc != 0
    - proxmox_resource_pool is defined
    - proxmox_resource_pools is defined
    - proxmox_resource_pool not in proxmox_resource_pools

# Only reach out to cloud.debian.org when the image is genuinely missing.
# get_url does a conditional (timestamp) request to the URL even when dest
# already exists, so an unconditional get_url makes every VM provision depend on
# cloud.debian.org being reachable — which fails on this IPv4-only estate when
# the round-robin resolves to an IPv6-only (or egress-filtered) mirror. Stat
# first and skip the download when the image is already staged.
- name: Check whether the cloud image is already staged on the node
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.stat:
    path: "{{ proxmox_vm_cloud_image_dir }}/{{ proxmox_vm_cloud_image_name }}"
  register: proxmox_vm_cloud_image
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not (proxmox_vm_skip_create | default(false))

- name: Download cloud image if not present
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.get_url:
    url: "{{ proxmox_vm_cloud_image_url }}"
    dest: "{{ proxmox_vm_cloud_image_dir }}/{{ proxmox_vm_cloud_image_name }}"
    mode: "0644"
    checksum: "{{ proxmox_vm_cloud_image_checksum }}"
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
    - not (proxmox_vm_skip_create | default(false))
    - not (proxmox_vm_cloud_image.stat.exists | default(false))

- name: Create VM
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm create {{ proxmox_vm_id }} \
      --name {{ inventory_hostname }} \
      --memory {{ proxmox_vm_memory }}{{ ' --balloon ' + (proxmox_vm_balloon | string) if proxmox_vm_balloon is defined else '' }} \
      --cores {{ proxmox_vm_cores }} \
      --cpu {{ proxmox_vm_cpu_type }} \
      --net0 virtio,bridge={{ proxmox_vm_bridge }},firewall=1 \
      --ostype {{ proxmox_vm_ostype }} \
      --agent enabled={{ proxmox_vm_agent_enabled | ternary(1, 0) }}{{ ' --pool ' + proxmox_resource_pool if proxmox_resource_pool is defined else '' }}
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
  changed_when: true

# Windows guest: create the VM shell here (firmware/disk/media follow the Linux
# boot-order block below) so the shared NIC/agent reconciles see a created VM
# for both guest types. Media is validated and the VirtIO ISO fetched BEFORE
# `qm create`: create-path tasks gate on `proxmox_vm_exists.rc != 0`, so a media
# failure after create would strand a bare shell that every rerun skips.
- name: Assert the Windows install ISO is specified
  ansible.builtin.assert:
    that:
      - proxmox_vm_install_iso | default('') | length > 0
    fail_msg: >-
      proxmox_vm_install_iso is empty. Download the Windows 11 ISO from Microsoft to the
      ISO store ({{ proxmox_vm_iso_storage_path }}/) and set proxmox_vm_install_iso
      to its filename.
    success_msg: "Windows install ISO: {{ proxmox_vm_install_iso }}"
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - _proxmox_vm_is_windows

# The Windows boot disk is allocated as a bare GiB count (`<storage>:<N>`), so
# the size is stripped of its G suffix — a 512M or 1T would survive the strip
# and reach `qm set` as a nonsensical count. The Linux path hands the value to
# `qm resize`, which accepts all three units, so only this path is constrained.
- name: Assert the Windows boot-disk size is expressed in GiB
  ansible.builtin.assert:
    that:
      # `| string` first: the `match` test hands the value straight to re.match,
      # which raises an opaque templating TypeError on the unquoted-int form
      # (`proxmox_vm_disk_size: 64`) this assert's own fail_msg recommends.
      - proxmox_vm_disk_size | string is match('^[0-9]+[Gg]?$')
    fail_msg: >-
      proxmox_vm_disk_size ({{ proxmox_vm_disk_size }}) must be a GiB value
      (e.g. 64 or 64G) on the Windows create path.
    quiet: true
  when:
    - proxmox_vm_exists.rc != 0
    - _proxmox_vm_is_windows

- name: Stat the Windows install ISO on the Proxmox ISO store
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.stat:
    path: "{{ proxmox_vm_iso_storage_path }}/{{ proxmox_vm_install_iso }}"
  register: _proxmox_vm_windows_install_iso_stat
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - _proxmox_vm_is_windows
    - not (proxmox_vm_skip_create | default(false))

- name: Assert the Windows install ISO is present on the Proxmox ISO store
  ansible.builtin.assert:
    that:
      - _proxmox_vm_windows_install_iso_stat.stat.exists
      - _proxmox_vm_windows_install_iso_stat.stat.isreg
    fail_msg: >-
      Windows install ISO not found at
      {{ proxmox_vm_iso_storage_path }}/{{ proxmox_vm_install_iso }}. Download the Windows 11 ISO
      from Microsoft to the ISO store and name the file
      {{ proxmox_vm_install_iso }} (matching proxmox_vm_install_iso).
    success_msg: "Windows install ISO present on the ISO store: {{ proxmox_vm_install_iso }}"
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - _proxmox_vm_is_windows
    - not (proxmox_vm_skip_create | default(false))

# Download BEFORE create (see block header). Idempotent + checksum-verified
# against the caller's proxmox_vm_virtio_win_version/_checksum pins.
- name: Download the VirtIO driver ISO to the Proxmox ISO store
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.get_url:
    url: "{{ proxmox_vm_virtio_win_url }}"
    dest: "{{ proxmox_vm_iso_storage_path }}/{{ proxmox_vm_virtio_iso }}"
    mode: "0644"
    checksum: "{{ proxmox_vm_virtio_win_checksum }}"
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - _proxmox_vm_is_windows
    - not (proxmox_vm_skip_create | default(false))

- name: Create Windows VM
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm create {{ proxmox_vm_id }} \
      --name {{ inventory_hostname }} \
      --memory {{ proxmox_vm_memory }}{{ ' --balloon ' + (proxmox_vm_balloon | string) if proxmox_vm_balloon is defined else '' }} \
      --cores {{ proxmox_vm_cores }} \
      --machine {{ proxmox_vm_windows_machine }} \
      --bios ovmf \
      --cpu {{ proxmox_vm_cpu_type }} \
      --ostype {{ proxmox_vm_windows_ostype }} \
      --scsihw virtio-scsi-pci \
      --net0 virtio,bridge={{ proxmox_vm_bridge }},firewall=1 \
      --agent enabled={{ proxmox_vm_agent_enabled | ternary(1, 0) }}{{ ' --pool ' + proxmox_resource_pool if proxmox_resource_pool is defined else '' }}
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - _proxmox_vm_is_windows
  changed_when: true

# Per-guest .fw rules are only enforced when the NIC carries firewall=1;
# reconcile VMs created before the flag was added to qm create above.
- name: Ensure VM NIC has the guest firewall flag
  delegate_to: "{{ proxmox_vm_reconcile_host }}"
  ansible.builtin.shell: |
    set -euo pipefail
    current=$(qm config {{ proxmox_vm_id }} | sed -n 's/^net0: //p')
    if [ -n "$current" ] && ! printf '%s' "$current" | grep -Eq '(^|,)firewall=1($|,)'; then
      # Strip any existing firewall=<v> (e.g. firewall=0) first so the
      # repair cannot produce a duplicate key in the net0 string.
      cleaned=$(printf '%s' "$current" | sed -E 's/(^|,)firewall=[^,]*//g' | sed -E 's/^,//')
      qm set {{ proxmox_vm_id }} --net0 "${cleaned},firewall=1"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: proxmox_vm_net0_firewall
  changed_when: "'CHANGED' in (proxmox_vm_net0_firewall.stdout | default(''))"
  when: not ansible_check_mode

# Memory ballooning floor (proxmox_vm_balloon) is set at qm create above; reconcile VMs
# created before it was added, or when the floor changes. `qm set --balloon <min>`
# takes effect live on a running guest that has the balloon driver, so Proxmox
# starts reclaiming idle RAM down to the floor immediately (no reboot). Guarded on
# proxmox_vm_balloon being defined, so VMs without a floor (e.g. k3s nodes, whose kubelet
# accounts for the full node RAM) are never ballooned.
- name: Reconcile VM memory ballooning floor
  delegate_to: "{{ proxmox_vm_reconcile_host }}"
  ansible.builtin.shell: |
    set -euo pipefail
    current=$(qm config {{ proxmox_vm_id }} | sed -n 's/^balloon: //p')
    if [ "$current" != "{{ proxmox_vm_balloon }}" ]; then
      qm set {{ proxmox_vm_id }} --balloon {{ proxmox_vm_balloon }}
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: proxmox_vm_balloon_reconcile
  changed_when: "'CHANGED' in (proxmox_vm_balloon_reconcile.stdout | default(''))"
  when:
    - not ansible_check_mode
    - proxmox_vm_balloon is defined
    - proxmox_vm_exists.rc == 0 or not (proxmox_vm_skip_create | default(false))

# Without this, proxmox_vm_memory would only ever be applied by `qm create`, so
# changing it in inventory for an existing guest would reach nothing — not even
# a reboot, which restarts against the unchanged config. `qm set --memory` on a
# running guest writes the config and takes effect at its NEXT start; this task
# never restarts anything, so applying it stays an operator step.
#
# `proxmox_vm_memory is defined` is NOT a gate here: the role defaults it, so a
# guest that loses its inventory key would be reconciled DOWN to that default.
# A shrink therefore has to be named (proxmox_vm_memory_shrink_ok) — growth
# needs no ceremony, and the one thing that must not happen silently is a live
# guest being resized to less than it has.
- name: Reconcile VM memory allocation
  delegate_to: "{{ proxmox_vm_reconcile_host }}"
  ansible.builtin.shell: |
    set -euo pipefail
    current=$(qm config {{ proxmox_vm_id }} | sed -n 's/^memory: //p')
    desired={{ proxmox_vm_memory | int }}
    if [ "$current" = "$desired" ]; then exit 0; fi
    case "$current" in
      ''|*[!0-9]*) ;;
      *)
        if [ "$desired" -lt "$current" ] && [ "{{ 'yes' if (proxmox_vm_memory_shrink_ok | bool) else 'no' }}" = "no" ]; then
          echo "REFUSING to shrink VM {{ proxmox_vm_id }} from ${current} MiB to ${desired} MiB." >&2
          echo "Set proxmox_vm_memory_shrink_ok: true to accept it, or restore proxmox_vm_memory in inventory." >&2
          exit 1
        fi
        ;;
    esac
    qm set {{ proxmox_vm_id }} --memory "$desired"
    echo CHANGED
  args:
    executable: /bin/bash
  register: proxmox_vm_memory_reconcile
  changed_when: "'CHANGED' in (proxmox_vm_memory_reconcile.stdout | default(''))"
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc == 0 or not (proxmox_vm_skip_create | default(false))

- name: Import cloud image disk
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm importdisk {{ proxmox_vm_id }} \
      {{ proxmox_vm_cloud_image_dir }}/{{ proxmox_vm_cloud_image_name }} \
      {{ _proxmox_vm_effective_storage }}
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
  changed_when: true

- name: Attach disk to VM
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm set {{ proxmox_vm_id }} \
      --scsihw virtio-scsi-pci \
      --scsi0 {{ _proxmox_vm_effective_storage }}:vm-{{ proxmox_vm_id }}-disk-0
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
  changed_when: true

- name: Resize disk
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm resize {{ proxmox_vm_id }} scsi0 {{ proxmox_vm_disk_size }}
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
  changed_when: true

- name: Configure cloud-init drive
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm set {{ proxmox_vm_id }} --ide2 {{ _proxmox_vm_effective_storage }}:cloudinit
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
  changed_when: true

- name: Configure boot order
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm set {{ proxmox_vm_id }} --boot c --bootdisk scsi0
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
  changed_when: true

# PCI passthrough (VFIO). CREATE-TIME ONLY: attaching a PCI device requires the
# guest STOPPED, so this cannot be a live drift-reconcile. An existing guest that
# gains proxmox_vm_hostpci needs a manual `qm set <id> --hostpci0 …` in a
# stop/start window. Each list entry maps to --hostpci<index> verbatim, so it
# carries any Proxmox hostpci option (a whole multifunction device on i440fx is
# just `0000:01:00`, no pcie=1).
- name: Attach PCI passthrough devices (create-time)
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm set {{ proxmox_vm_id | quote }}{% for pci in proxmox_vm_hostpci %} --hostpci{{ loop.index0 }} {{ pci | quote }}{% endfor %}
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
    - proxmox_vm_hostpci | default([]) | length > 0
  changed_when: true

# Windows guest: firmware (EFI vars + TPM 2.0), empty boot disk, and the install
# + VirtIO driver CDROMs. Boot order is the install CD first so Windows setup
# runs; the post-install flip to `order=scsi0` is a manual step. Create-time only
# — an existing Windows VM is never re-clobbered.
- name: Configure Windows EFI vars disk, TPM 2.0, and boot disk
  delegate_to: "{{ proxmox_host }}"
  # efidisk0/tpmstate0 take `<storage>:1`: the size is a placeholder Proxmox
  # ignores, allocating the correct fixed size itself. pre-enrolled-keys=1 ships
  # Microsoft's Secure Boot keys so Win11's check passes. The boot disk is an
  # EMPTY zvol (no cloud image import).
  ansible.builtin.shell: |
    qm set {{ proxmox_vm_id }} \
      --efidisk0 {{ _proxmox_vm_effective_storage }}:1,efitype=4m,pre-enrolled-keys=1 \
      --tpmstate0 {{ _proxmox_vm_effective_storage }}:1,version=v2.0 \
      --scsi0 {{ _proxmox_vm_effective_storage }}:{{ proxmox_vm_disk_size | regex_replace('[Gg]$', '') }},discard=on,ssd=1
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - _proxmox_vm_is_windows
  changed_when: true

- name: Attach Windows install + VirtIO driver CDROMs and set VGA
  delegate_to: "{{ proxmox_host }}"
  # command + argv (not shell): the ISO filenames come from inventory / all.yml,
  # so each is passed as a single literal argv token. A filename containing a
  # space or a shell metacharacter can then neither break qm's argument parsing
  # nor inject a command on the delegated Proxmox host.
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ proxmox_vm_id }}"
      - --ide2
      - "{{ proxmox_vm_iso_storage }}:iso/{{ proxmox_vm_install_iso }},media=cdrom"
      - --ide0
      - "{{ proxmox_vm_iso_storage }}:iso/{{ proxmox_vm_virtio_iso }},media=cdrom"
      - --vga
      - "{{ proxmox_vm_windows_vga }}"
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - _proxmox_vm_is_windows
  changed_when: true

- name: Configure Windows boot order (install CD first)
  delegate_to: "{{ proxmox_host }}"
  # order=ide2;scsi0 is quoted so the shell doesn't split on the semicolon.
  # Post-install, flip to `qm set {{ proxmox_vm_id }} --boot order=scsi0` by hand
  # so the VM boots from disk instead of the installer.
  ansible.builtin.shell: |
    qm set {{ proxmox_vm_id }} --boot 'order=ide2;scsi0'
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - _proxmox_vm_is_windows
  changed_when: true

# An empty key would still "provision successfully" — and leave the VM
# unreachable over SSH.
- name: Assert SSH public key is available for cloud-init
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY') | length > 0
    fail_msg: >-
      SSH_PUBLIC_KEY is empty. Run via the task wrapper (op run) so
      cloud-init gets an authorized key.
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
    - not (proxmox_vm_skip_create | default(false))

# The key is staged in a private temp file (0600, random suffix — a predictable
# /tmp/ssh_key_<vmid>.pub on a shared Proxmox host is a race/clobber target),
# consumed by `qm set --sshkeys`, and removed in `always` so a failure between
# the two never leaves it behind.
- name: Stage and consume the cloud-init SSH public key
  delegate_to: "{{ proxmox_host }}"
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
  block:
    - name: Create private temp file for cloud-init SSH key
      ansible.builtin.tempfile:
        state: file
        prefix: "ssh_key_{{ proxmox_vm_id }}_"
        suffix: ".pub"
      register: _proxmox_vm_ci_ssh_key_tmp

    - name: Deploy SSH public key for cloud-init
      ansible.builtin.copy:
        content: "{{ ssh_public_key }}"
        dest: "{{ _proxmox_vm_ci_ssh_key_tmp.path }}"
        mode: "0600"
      vars:
        ssh_public_key: "{{ lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY') }}"

    - name: Configure cloud-init settings
      ansible.builtin.shell: |
        qm set {{ proxmox_vm_id }} \
          --ciuser {{ proxmox_vm_cloudinit_user }} \
          --sshkeys {{ _proxmox_vm_ci_ssh_key_tmp.path | quote }} \
          --ipconfig0 ip={{ proxmox_vm_target_ip }}/{{ proxmox_vm_cloudinit_prefix_len }},gw={{ proxmox_vm_cloudinit_gateway }} \
          --nameserver "{{ proxmox_vm_cloudinit_dns | join(' ') }}"
      # Needs a real guest to consume the key; stubbed runs skip it.
      when: not (proxmox_vm_skip_create | default(false))
      changed_when: true
  always:
    - name: Clean up the cloud-init SSH key temp file (even on failure)
      ansible.builtin.file:
        path: "{{ _proxmox_vm_ci_ssh_key_tmp.path }}"
        state: absent
      when:
        - _proxmox_vm_ci_ssh_key_tmp is defined
        - _proxmox_vm_ci_ssh_key_tmp.path is defined

# Reconcile the QEMU guest-agent flag on existing VMs too (it's metadata-only —
# controls host-side polling, never touches the running guest). Idempotent:
# re-sets only when live `qm config` differs from the desired flag.
- name: Ensure VM QEMU agent flag matches inventory
  delegate_to: "{{ proxmox_vm_reconcile_host }}"
  ansible.builtin.shell: |
    set -euo pipefail
    want="{{ proxmox_vm_agent_enabled | default(true) | ternary(1, 0) }}"
    # `agent:` may be "1", "0", or "enabled=1,..." — extract the leading enabled bit.
    cur=$(qm config {{ proxmox_vm_id }} | sed -n 's/^agent: //p' | sed -E 's/^enabled=//; s/,.*$//')
    cur=${cur:-0}
    if [ "$cur" != "$want" ]; then
      qm set {{ proxmox_vm_id }} --agent "$want"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: proxmox_vm_agent_reconcile
  changed_when: "'CHANGED' in (proxmox_vm_agent_reconcile.stdout | default(''))"
  when:
    - not ansible_check_mode
    # Drift reconcile for existing VMs only — new VMs get --agent at create time
    # (qm create above). Matches the onboot/startup reconcile's guard below.
    - proxmox_vm_exists.rc == 0

- name: Configure VM autostart and boot order
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm set {{ proxmox_vm_id }} \
      --onboot {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }} \
      --startup order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    # Skipped under skip_create with the cloud-init `qm set`. NOT every
    # create-path task honours the flag — `qm create`, the disk import/attach/
    # resize and the boot-order sets run against the molecule stubs on purpose.
    - not (proxmox_vm_skip_create | default(false))
  changed_when: true

# Reconcile onboot/startup on existing VMs too (metadata-only, applied at next
# boot — never disrupts a running guest). Idempotent: re-sets only on real drift.
# startup is normalized to a canonical order=/up=/down= form on BOTH sides before
# comparing, because Proxmox drops default fields (e.g. up=0) from the stored
# string — a raw string compare would see false drift and re-`qm set` every run.
- name: Reconcile VM autostart and boot order on existing VM
  delegate_to: "{{ proxmox_vm_reconcile_host }}"
  ansible.builtin.shell: |
    set -euo pipefail
    want_onboot="{{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}"
    # Canonicalize a Proxmox startup property-string to "order=O,up=U,down=D"
    # with absent fields defaulting to 0, so desired and stored compare equal
    # regardless of which default fields Proxmox omits.
    norm_startup() {
      local s="$1" order=0 up=0 down=0 kv k v
      local IFS=','
      for kv in $s; do
        k=${kv%%=*}; v=${kv#*=}
        case "$k" in order) order=$v ;; up) up=$v ;; down) down=$v ;; esac
      done
      echo "order=${order},up=${up},down=${down}"
    }
    want_startup=$(norm_startup "order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}")
    cfg=$(qm config {{ proxmox_vm_id }})
    # Default onboot when the key is absent from qm config is 0 (Proxmox default).
    cur_onboot=$(printf '%s\n' "$cfg" | sed -n 's/^onboot: //p'); cur_onboot=${cur_onboot:-0}
    cur_startup=$(norm_startup "$(printf '%s\n' "$cfg" | sed -n 's/^startup: //p')")
    changed=0
    [ "$cur_onboot" != "$want_onboot" ] && changed=1
    [ "$cur_startup" != "$want_startup" ] && changed=1
    if [ "$changed" = 1 ]; then
      qm set {{ proxmox_vm_id }} --onboot "$want_onboot" --startup "order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: proxmox_vm_startup_reconcile
  changed_when: "'CHANGED' in (proxmox_vm_startup_reconcile.stdout | default(''))"
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc == 0

# Additional persistent disks (ZFS zvols)
# Each disk pins an explicit, unique scsi_slot. Attaching by list position would
# remap a live data-bearing zvol onto the wrong device if the list is ever
# reordered or an entry removed, so the slot is required and validated here.
- name: Assert every additional disk pins a unique, explicit scsi_slot
  ansible.builtin.assert:
    that:
      - (proxmox_vm_additional_disks | selectattr('scsi_slot', 'defined') | list | length) == (proxmox_vm_additional_disks | length)
      - (proxmox_vm_additional_disks | selectattr('scsi_slot', 'defined') | map(attribute='scsi_slot') | unique | list | length) == (proxmox_vm_additional_disks | length)
      - (proxmox_vm_additional_disks | selectattr('scsi_slot', 'defined') | map(attribute='scsi_slot') | map('int') | select('lt', 1) | list | length) == 0
    fail_msg: >-
      Every proxmox_vm_additional_disks entry must set a unique 'scsi_slot' >= 1 (scsi0 is
      reserved for the VM boot disk). Slots pin a zvol to a stable SCSI device;
      assigning by list position would remap a live data-bearing zvol if the list
      is reordered or an entry removed.
    success_msg: "All {{ proxmox_vm_additional_disks | length }} additional disk(s) have unique scsi_slots."
  when:
    - proxmox_vm_additional_disks is defined
    - proxmox_vm_additional_disks | length > 0

# sparse: true creates a thin-provisioned zvol (`zfs create -s`), so volsize is
# reserved lazily as data is written — use it for large bulk data disks.
# Omitting the key keeps the zvol thick-provisioned; existing disks are
# unaffected either way.
- name: Create ZFS zvol for additional disks
  delegate_to: "{{ proxmox_host }}"
  # errexit: without it the task rc is `echo`'s, so a failed `zfs create` (pool
  # absent/full, quota refusal, typo) reports a CHANGED "created" for a zvol
  # that does not exist. The `zfs list` probe is exempt as an `if` condition.
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      if ! zfs list {{ item.zvol }} 2>/dev/null; then
        zfs create -p {{ '-s ' if (item.sparse | default(false) | bool) else '' }}-V {{ item.size }} {{ item.zvol }}
        echo "created"
      else
        echo "exists"
      fi
    executable: /bin/bash
  loop: "{{ proxmox_vm_additional_disks | default([]) }}"
  register: proxmox_vm_zvol_creation_result
  changed_when: "'created' in (proxmox_vm_zvol_creation_result.stdout_lines | default([]))"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - proxmox_vm_additional_disks is defined

# qm config/set must run where the VM resides (proxmox_vm_reconcile_host). The zvol
# create above stays on proxmox_host — that's the inventory-declared pool
# owner; zvol-bearing VMs are node-pinned, so the two only diverge if such a
# VM is migrated by hand, and then attaching a fresh zvol elsewhere would be
# wrong anyway.
- name: Attach additional disks to VM
  delegate_to: "{{ proxmox_vm_reconcile_host }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      EXPECTED_PATH="/dev/zvol/{{ item.zvol }}"
      SCSI_SLOT="scsi{{ item.scsi_slot }}"
      ALLOW_REMAP="{{ 1 if (item.allow_remap | default(false) | bool) else 0 }}"
      # vzdump_backup: false sets backup=0 so the nightly vzdump skips this
      # passthrough disk. Use it for app-data zvols already backed up by direct
      # ZFS replication (ssd/appdata -> archive); without it vzdump double-stores
      # them in the VM image backup (tank/proxmox).
      WANT_NOBACKUP="{{ 1 if not (item.vzdump_backup | default(true) | bool) else 0 }}"
      if [ "$WANT_NOBACKUP" = 1 ]; then DISK_SPEC="${EXPECTED_PATH},backup=0"; else DISK_SPEC="$EXPECTED_PATH"; fi
      CURRENT_CONFIG=$(qm config {{ proxmox_vm_id }} | grep "^${SCSI_SLOT}:" || true)
      # Drive value without the "scsiN: " prefix; the path is its first
      # comma-separated token. Compare the path EXACTLY — a substring grep would
      # treat .../data-old as a match for .../data and skip a needed correction.
      CURRENT_VALUE="${CURRENT_CONFIG#*: }"
      CURRENT_PATH="${CURRENT_VALUE%%,*}"
      HAS_NOBACKUP=0
      echo "$CURRENT_VALUE" | grep -qE '(^|,)backup=0(,|$)' && HAS_NOBACKUP=1

      # Idempotent on BOTH the zvol path and the backup= state: re-set if the disk
      # is absent, on the wrong path, or its backup flag differs from desired.
      if [ -z "$CURRENT_CONFIG" ]; then
        qm set {{ proxmox_vm_id }} --${SCSI_SLOT} "$DISK_SPEC"
        echo "CHANGED:attached"
      elif [ "$CURRENT_PATH" = "$EXPECTED_PATH" ] && [ "$HAS_NOBACKUP" = "$WANT_NOBACKUP" ]; then
        echo "OK:exists"
      else
        # Slot occupied by a DIFFERENT drive spec: refuse to remap ANY occupied
        # slot (not just zvols — an LVM/raw disk is just as destructive to
        # rebind) so a reorder/removal/typo can't silently overwrite it. A
        # matching path here is only a backup= flag change and is allowed.
        if [ "$CURRENT_PATH" != "$EXPECTED_PATH" ] && [ -n "$CURRENT_PATH" ] && [ "$CURRENT_PATH" != "none" ] && [ "$ALLOW_REMAP" != 1 ]; then
          echo "ERROR: ${SCSI_SLOT} maps $CURRENT_PATH, expected $EXPECTED_PATH." >&2
          echo "Refusing to remap an occupied slot; set allow_remap: true to override intentionally." >&2
          exit 1
        fi
        qm set {{ proxmox_vm_id }} --${SCSI_SLOT} "$DISK_SPEC"
        echo "CHANGED:updated"
      fi
    executable: /bin/bash
  loop: "{{ proxmox_vm_additional_disks | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: proxmox_vm_disk_attach_result
  changed_when: "'CHANGED:' in (proxmox_vm_disk_attach_result.stdout | default(''))"
  when:
    - not ansible_check_mode
    - proxmox_vm_additional_disks is defined

- name: Report disk attachment changes
  ansible.builtin.debug:
    msg: "Disk {{ item.item.name }}: {{ item.stdout | regex_replace('^(CHANGED:|OK:)', '') }}"
  loop: "{{ proxmox_vm_disk_attach_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('N/A') }}"
  when:
    - proxmox_vm_disk_attach_result.results is defined
    - item.stdout is defined
  changed_when: false

# Linux VMs are started + waited-on here. A Windows VM is deliberately created
# STOPPED: the operator boots it from the Proxmox console to run the interactive
# installer. Starting it is a runbook step, not part of provisioning.
- name: Start VM
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm start {{ proxmox_vm_id }}
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
  changed_when: true
  register: proxmox_vm_start

- name: Wait for VM to be reachable via SSH
  delegate_to: "{{ proxmox_vm_ssh_wait_delegate }}"
  ansible.builtin.wait_for:
    host: "{{ proxmox_vm_target_ip }}"
    port: 22
    delay: 30
    timeout: 300
  when:
    - not ansible_check_mode
    - proxmox_vm_exists.rc != 0
    - not _proxmox_vm_is_windows
    - not (proxmox_vm_skip_create | default(false))

- name: Display VM creation status
  vars:
    proxmox_vm_status_msg: >-
      VM {{ inventory_hostname }} (ID {{ proxmox_vm_id }})
      {% if ansible_check_mode and proxmox_vm_exists.rc != 0 %}
      would be created (check mode - no changes made)
      {% elif proxmox_vm_exists.rc != 0 and _proxmox_vm_is_windows %}
      created STOPPED — boot from the Proxmox console to install Windows
      {% elif proxmox_vm_exists.rc != 0 %}
      created and started
      {% else %}
      already exists
      {% endif %}
  ansible.builtin.debug:
    msg: "{{ proxmox_vm_status_msg }}"
