---
- name: Converge — exercise storage selection + pool validation
  hosts: all
  become: true
  # gather_facts deferred: under become + the molecule docker connector the
  # implicit gathering task fails to create remote_tmp. A raw `mkdir -p` then an
  # explicit ansible.builtin.setup avoids it.
  gather_facts: false
  vars:
    proxmox_host: "{{ inventory_hostname }}"
    proxmox_role: nas
    vmid: 999
    # Do not override ansible_host: molecule's docker connection plugin reads it
    # as the container name, and an IP makes `docker exec` fail. The role takes
    # the IP from proxmox_vm_target_ip, pinned to a stub value here.
    proxmox_vm_target_ip: "192.168.0.99"
  pre_tasks:
    - name: Pre-create Ansible remote_tmp (raw bypasses tmpdir setup)
      ansible.builtin.raw: |
        set -e
        mkdir -p /tmp/ansible-tmp
        chmod 1777 /tmp/ansible-tmp
      changed_when: false

    - name: Gather facts now that remote_tmp exists
      ansible.builtin.setup:

    - name: Result directory
      ansible.builtin.file:
        path: /tmp/molecule-results
        state: directory
        mode: "0755"

  tasks:
    # 1. NAS host with no override -> _proxmox_vm_effective_storage == "ssd".
    # No `vars:` block: leaving proxmox_storage undefined lets the role's
    # default() lookup resolve it, where an explicit null would render "None".
    - name: NAS-default run
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm

    - name: Capture NAS-default result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/01-nas-default.json
        mode: "0644"
        content: |
          {"effective_storage": "{{ _proxmox_vm_effective_storage | trim }}",
           "host_role": "{{ _proxmox_vm_host_role }}"}

    # 2. Override to local-ssd
    - name: Override run
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: local-ssd

    - name: Capture override result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/02-override.json
        mode: "0644"
        content: |
          {"effective_storage": "{{ _proxmox_vm_effective_storage | trim }}"}

    # 2w. Windows guest must assemble a Win11-capable VM (q35, OVMF, EFI vars,
    # TPM 2.0, win11 ostype, empty boot disk, install/VirtIO CDROMs, std VGA),
    # issue none of the Linux cloud-init path, and leave the VM stopped.
    - name: Reset qm.log for the Windows-guest case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Windows-guest run
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_guest_type: windows
        proxmox_vm_cpu_type: host
        proxmox_vm_disk_size: 250G
        proxmox_vm_iso_storage: isostore
        proxmox_vm_install_iso: Win11_Test.iso
        proxmox_vm_virtio_win_version: "0.1.285"
        # This run only validates the assembled qm commands, so the preflight
        # ISO stat and the external VirtIO get_url are skipped. The qm
        # create/EFI/TPM/CDROM/boot tasks are not skip_create-gated.
        proxmox_vm_skip_create: true

    - name: Scan the Windows-guest qm.log for the expected assembly
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/qm.log
        machine=$(grep -c -- '^qm create 999 .* --machine q35 ' "$log" || true)
        ovmf=$(grep -c -- '^qm create 999 .* --bios ovmf ' "$log" || true)
        ostype=$(grep -c -- '^qm create 999 .* --ostype win11 ' "$log" || true)
        efidisk=$(grep -c -- 'efidisk0 ssd:1,efitype=4m,pre-enrolled-keys=1' "$log" || true)
        tpm=$(grep -c -- 'tpmstate0 ssd:1,version=v2.0' "$log" || true)
        bootdisk=$(grep -c -- 'scsi0 ssd:250,discard=on,ssd=1' "$log" || true)
        install_iso=$(grep -c -- 'ide2 isostore:iso/Win11_Test.iso,media=cdrom' "$log" || true)
        virtio_iso=$(grep -c -- 'ide0 isostore:iso/virtio-win-0.1.285.iso,media=cdrom' "$log" || true)
        vga=$(grep -c -- '--vga std' "$log" || true)
        bootorder=$(grep -c -- 'boot order=ide2;scsi0' "$log" || true)
        cloudinit=$(grep -c -- 'ide2 ssd:cloudinit' "$log" || true)
        importdisk=$(grep -c -- '^qm importdisk ' "$log" || true)
        ciuser=$(grep -c -- '--ciuser ' "$log" || true)
        start=$(grep -c -- '^qm start ' "$log" || true)
        # Emitted as four printfs (stdout concatenates into the registered
        # result) so no single line exceeds the 160-char lint cap.
        printf '{"machine": %s, "ovmf": %s, "ostype": %s, "efidisk": %s,' "$machine" "$ovmf" "$ostype" "$efidisk"
        printf ' "tpm": %s, "bootdisk": %s, "install_iso": %s,' "$tpm" "$bootdisk" "$install_iso"
        printf ' "virtio_iso": %s, "vga": %s, "bootorder": %s,' "$virtio_iso" "$vga" "$bootorder"
        printf ' "cloudinit": %s, "importdisk": %s, "ciuser": %s, "start": %s}\n' "$cloudinit" "$importdisk" "$ciuser" "$start"
      args:
        executable: /bin/bash
      register: win_scan
      changed_when: false

    - name: Capture Windows-guest result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/11-windows-guest.json
        mode: "0644"
        content: "{{ win_scan.stdout }}"

    # 2wi. Same Windows path with the unquoted-int disk size the GiB assert's
    # fail_msg recommends. Without the assert's `| string` coercion the `match`
    # test dies with a templating TypeError instead of assembling `scsi0 ssd:250`.
    - name: Reset qm.log for the Windows-guest bare-int disk-size case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Windows-guest run with a bare-int disk size
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_guest_type: windows
        proxmox_vm_cpu_type: host
        proxmox_vm_disk_size: 250
        proxmox_vm_iso_storage: isostore
        proxmox_vm_install_iso: Win11_Test.iso
        proxmox_vm_virtio_win_version: "0.1.285"
        proxmox_vm_skip_create: true

    - name: Scan the bare-int Windows run for the assembled boot disk
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/qm.log
        bootdisk=$(grep -c -- 'scsi0 ssd:250,discard=on,ssd=1' "$log" || true)
        printf '{"bootdisk": %s}\n' "$bootdisk"
      args:
        executable: /bin/bash
      register: win_int_scan
      changed_when: false

    - name: Capture Windows-guest bare-int result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/13-windows-int-size.json
        mode: "0644"
        content: "{{ win_int_scan.stdout }}"

    # 2p. PCI passthrough — a create-time proxmox_vm_hostpci list must attach each device
    # as `qm set <id> --hostpci<index> <spec>` (Linux guest, VM-missing state, so
    # the create path runs). Verifies index derivation and verbatim spec passing.
    - name: Reset qm.log for the hostpci case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: HostPCI passthrough run
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_hostpci:
          - "0000:01:00"
          - "0000:01:00.1"

    - name: Scan the hostpci qm.log
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/qm.log
        # One `qm set` carries both flags, indexed by list position.
        both=$(grep -c -- '^qm set 999 --hostpci0 0000:01:00 --hostpci1 0000:01:00.1$' "$log" || true)
        any=$(grep -c -- '^qm set 999 --hostpci' "$log" || true)
        printf '{"indexed_pair": %s, "any_hostpci": %s}\n' "$both" "$any"
      args:
        executable: /bin/bash
      register: hostpci_scan
      changed_when: false

    - name: Capture hostpci result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/12-hostpci.json
        mode: "0644"
        content: "{{ hostpci_scan.stdout }}"

    # 3. Pool-validation failure path
    - name: Pool-validation failure (expect failure)
      block:
        - name: Run with nonexistent storage
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_vm
          vars:
            proxmox_storage: nonexistent-pool
        - name: Should not reach here
          ansible.builtin.copy:
            dest: /tmp/molecule-results/03-pool-validation.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Record expected failure
          ansible.builtin.copy:
            dest: /tmp/molecule-results/03-pool-validation.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}

    # 4. Resource-pool list rejection
    - name: Resource-pool list rejection (expect failure)
      block:
        - name: Run with non-standard resource pool
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_vm
          vars:
            proxmox_storage: ssd
            proxmox_resource_pool: not-a-real-pool
        - name: Should not reach here
          ansible.builtin.copy:
            dest: /tmp/molecule-results/04-pool-list.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Record expected failure
          ansible.builtin.copy:
            dest: /tmp/molecule-results/04-pool-list.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}

    # 5. Existence guard — when the VM exists and its NIC, agent, onboot and
    # startup already match inventory, the only qm activity allowed is read-only
    # `qm config` probes. No mutations.
    - name: Reset qm.log
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Flip stub to "VM exists"
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_exists_state
        content: "exists\n"
        mode: "0644"

    - name: Run role with existing VM
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd

    # HA-aware reconcile: the existence check returns the VM's current node (the
    # stub places it on this molecule host), so reconcile tasks delegate there
    # rather than to the inventory proxmox_host.
    - name: Assert reconcile host resolved to the VM's actual node
      ansible.builtin.assert:
        that:
          - proxmox_vm_reconcile_host == inventory_hostname
        fail_msg: >-
          proxmox_vm_reconcile_host resolved to
          '{{ proxmox_vm_reconcile_host | default("<undefined>") }}' but the VM is on
          '{{ inventory_hostname }}' — the existence check must capture the
          actual node so reconcile tasks delegate there.
        success_msg: "reconcile host = VM's actual node ({{ inventory_hostname }})"

    - name: Count qm calls after existing-VM run
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^qm ' /tmp/molecule-stub-state/qm.log || true)
        config=$(grep -c '^qm config ' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"qm_calls\": ${total}, \"qm_config_calls\": ${config}}"
      args:
        executable: /bin/bash
      register: qm_lines
      changed_when: false

    - name: Capture existence-guard result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/05-existence-guard.json
        mode: "0644"
        content: |
          {"qm_calls": {{ (qm_lines.stdout | from_json).qm_calls }},
           "qm_config_calls": {{ (qm_lines.stdout | from_json).qm_config_calls }},
           "reconcile_changed": {{ proxmox_vm_net0_firewall.changed | to_json }}}

    # 6. Firewall reconcile — existing VM whose NIC predates firewall=1
    # must get exactly one `qm set … --net0 …,firewall=1` repair call.
    - name: Reset qm.log for reconcile case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Stub NIC without a firewall key
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_net0_override
        content: "virtio=BC:24:11:AA:BB:CC,bridge=vmbr0"
        mode: "0644"

    - name: Run role against legacy-NIC VM
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd

    - name: Count reconcile qm calls
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^qm ' /tmp/molecule-stub-state/qm.log || true)
        config=$(grep -c '^qm config ' /tmp/molecule-stub-state/qm.log || true)
        repair=$(grep -c '^qm set 999 --net0 virtio=BC:24:11:AA:BB:CC,bridge=vmbr0,firewall=1$' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"qm_calls\": ${total}, \"qm_config_calls\": ${config}, \"repair_calls\": ${repair}}"
      args:
        executable: /bin/bash
      register: qm_reconcile_lines
      changed_when: false

    - name: Capture firewall-reconcile result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/06-firewall-reconcile.json
        mode: "0644"
        content: |
          {"qm_calls": {{ (qm_reconcile_lines.stdout | from_json).qm_calls }},
           "qm_config_calls": {{ (qm_reconcile_lines.stdout | from_json).qm_config_calls }},
           "repair_calls": {{ (qm_reconcile_lines.stdout | from_json).repair_calls }},
           "reconcile_changed": {{ proxmox_vm_net0_firewall.changed | to_json }}}

    # 7. Firewall reconcile with explicit firewall=0 — the stale key
    # must be REPLACED, not appended to (no duplicate firewall= keys
    # in the resulting net0 string).
    - name: Reset qm.log for firewall=0 case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Stub NIC with firewall=0
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_net0_override
        content: "virtio=BC:24:11:AA:BB:CC,bridge=vmbr0,firewall=0"
        mode: "0644"

    - name: Run role against firewall=0 VM
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd

    - name: Remove net0 override
      ansible.builtin.file:
        path: /tmp/molecule-stub-state/vm_net0_override
        state: absent

    - name: Count firewall=0 reconcile qm calls
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^qm ' /tmp/molecule-stub-state/qm.log || true)
        config=$(grep -c '^qm config ' /tmp/molecule-stub-state/qm.log || true)
        repair=$(grep -c '^qm set 999 --net0 virtio=BC:24:11:AA:BB:CC,bridge=vmbr0,firewall=1$' /tmp/molecule-stub-state/qm.log || true)
        dup=$(grep -c 'firewall=0' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"qm_calls\": ${total}, \"qm_config_calls\": ${config}, \"repair_calls\": ${repair}, \"stale_key_in_set\": ${dup}}"
      args:
        executable: /bin/bash
      register: qm_fwzero_lines
      changed_when: false

    - name: Capture firewall=0 reconcile result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/07-firewall-zero.json
        mode: "0644"
        content: |
          {"qm_calls": {{ (qm_fwzero_lines.stdout | from_json).qm_calls }},
           "qm_config_calls": {{ (qm_fwzero_lines.stdout | from_json).qm_config_calls }},
           "repair_calls": {{ (qm_fwzero_lines.stdout | from_json).repair_calls }},
           "stale_key_in_set": {{ (qm_fwzero_lines.stdout | from_json).stale_key_in_set }},
           "reconcile_changed": {{ proxmox_vm_net0_firewall.changed | to_json }}}

    # 7a. A guest whose config carries no net0 cannot have the flag
    # reconciled; reporting ok would leave every security group inert.
    - name: Stub a guest config with no net0 line
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_net0_absent
        content: ""
        mode: "0644"

    - name: Run the NIC firewall repair against a guest with no net0
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
        tasks_from: guest-nic-firewall
      vars:
        _pmx_cli: qm
        _pmx_id: 999
        _pmx_delegate: "{{ inventory_hostname }}"
      register: proxmox_vm_no_net0_repair
      ignore_errors: true

    - name: Remove the no-net0 stub
      ansible.builtin.file:
        path: /tmp/molecule-stub-state/vm_net0_absent
        state: absent

    - name: Capture the no-net0 result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/07a-no-net0.json
        mode: "0644"
        content: |
          {"failed": {{ proxmox_vm_no_net0_repair.failed | default(false) | to_json }},
           "stdout": {{ proxmox_vm_guest_nic_firewall_result.stdout | default('') | to_json }},
           "rc": {{ proxmox_vm_guest_nic_firewall_result.rc | default(0) | to_json }}}

    # 7b. Agent flag drift — existing VM whose `qm config` reports agent
    # enabled=0 must get exactly one `qm set 999 --agent 1` reconcile call.
    - name: Stub agent disabled (enabled=0)
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_agent_override
        content: "enabled=0"
        mode: "0644"

    - name: Reset qm.log for agent-drift case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role against agent-disabled VM
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd

    - name: Remove agent override
      ansible.builtin.file:
        path: /tmp/molecule-stub-state/vm_agent_override
        state: absent

    - name: Count agent-drift qm calls
      ansible.builtin.shell: |
        set -o pipefail
        applied=$(grep -c '^qm set 999 --agent 1$' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"agent_set\": ${applied}}"
      args:
        executable: /bin/bash
      register: agent_drift
      changed_when: false

    # 7b-ii. memory drift — an existing VM reporting a different memory must get
    # exactly one `qm set 999 --memory <desired>`. Growth needs no ceremony;
    # a SHRINK has to be named, so both arms are exercised here.
    - name: Stub memory drifted low (1024 against the role default 2048)
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_memory_override
        content: "1024"
        mode: "0644"

    - name: Reset qm.log for memory-drift case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role against memory-drifted VM
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd

    - name: Count memory-drift qm calls
      ansible.builtin.shell: |
        set -o pipefail
        applied=$(grep -c '^qm set 999 --memory 2048$' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"memory_set\": ${applied}}"
      args:
        executable: /bin/bash
      register: memory_drift
      changed_when: false

    # 7b-iii. shrink guard — a desired value below the live one must fail the
    # task unless proxmox_vm_memory_shrink_ok names it, or a guest that lost its
    # inventory memory key would be resized down to the role default.
    - name: Stub memory drifted high (8192 against the role default 2048)
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_memory_override
        content: "8192"
        mode: "0644"

    - name: Reset qm.log for the shrink-guard case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role against a VM with MORE memory than desired
      block:
        - name: Include the role with an unnamed shrink pending
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_vm
          vars:
            proxmox_storage: ssd

        - name: The unnamed shrink was not refused
          ansible.builtin.fail:
            msg: >-
              The memory reconcile lowered a live guest's allocation without
              proxmox_vm_memory_shrink_ok — a dropped inventory key silently
              downsizes the guest.
      rescue:
        - name: Count shrink-guard qm calls
          ansible.builtin.shell: |
            set -o pipefail
            applied=$(grep -c -- '^qm set 999 --memory' /tmp/molecule-stub-state/qm.log || true)
            echo "{\"memory_set\": ${applied}}"
          args:
            executable: /bin/bash
          register: memory_shrink_guard
          changed_when: false

        - name: Assert the refusal applied nothing
          ansible.builtin.assert:
            that:
              - (memory_shrink_guard.stdout | from_json).memory_set | int == 0
            fail_msg: "The refused shrink still issued a qm set --memory"
            success_msg: "A memory shrink is refused unless it is named"

    - name: Reset qm.log after the shrink-guard case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role with the shrink explicitly accepted
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_memory_shrink_ok: true

    - name: Count accepted-shrink qm calls
      ansible.builtin.shell: |
        set -o pipefail
        applied=$(grep -c '^qm set 999 --memory 2048$' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"memory_set\": ${applied}}"
      args:
        executable: /bin/bash
      register: memory_shrink_accepted
      changed_when: false

    - name: Assert a named shrink is applied
      ansible.builtin.assert:
        that:
          - (memory_shrink_accepted.stdout | from_json).memory_set | int == 1
        fail_msg: >-
          proxmox_vm_memory_shrink_ok did not let the reconcile lower the
          allocation.
        success_msg: "A named memory shrink is applied"

    - name: Remove memory override
      ansible.builtin.file:
        path: /tmp/molecule-stub-state/vm_memory_override
        state: absent

    # 7c. onboot + startup drift — existing VM reporting onboot:0 and a stale
    # startup string must get exactly one `qm set 999 --onboot 1 --startup ...`.
    - name: Stub onboot disabled
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_onboot_override
        content: "0"
        mode: "0644"

    - name: Stub stale startup order
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_startup_override
        content: "order=50,up=30"
        mode: "0644"

    - name: Reset qm.log for startup-drift case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role against onboot/startup-drift VM
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd

    - name: Remove onboot/startup overrides
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/molecule-stub-state/vm_onboot_override
        - /tmp/molecule-stub-state/vm_startup_override

    - name: Count startup-drift qm calls
      ansible.builtin.shell: |
        set -o pipefail
        applied=$(grep -c '^qm set 999 --onboot 1 --startup order=100,up=0$' /tmp/molecule-stub-state/qm.log || true)
        anyset=$(grep -c '^qm set 999 --onboot' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"startup_set\": ${applied}, \"any_onboot_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: startup_drift
      changed_when: false

    - name: Capture agent/onboot/startup drift result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/10-meta-drift.json
        mode: "0644"
        content: |
          {"agent_set": {{ (agent_drift.stdout | from_json).agent_set }},
           "memory_set": {{ (memory_drift.stdout | from_json).memory_set }},
           "startup_set": {{ (startup_drift.stdout | from_json).startup_set }},
           "any_onboot_set": {{ (startup_drift.stdout | from_json).any_onboot_set }}}

    # 8. Additional-disk vzdump_backup idempotency. The attach task must set
    # backup=0 exactly when a vzdump_backup:false disk lacks it, no-op when it
    # already matches, and never add it to a default disk.

    # 8a. Not attached + vzdump_backup:false -> one `qm set --scsi1 ...,backup=0`.
    - name: Remove scsi1 override (slot not attached)
      ansible.builtin.file:
        path: /tmp/molecule-stub-state/vm_scsi1_override
        state: absent

    - name: Reset qm.log for disk-attach (absent) case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role — attach absent vzdump_backup:false disk
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_additional_disks:
          - name: test-data
            size: 10G
            zvol: ssd/appdata/test/data
            mount_point: /mnt/test
            fstype: ext4
            scsi_slot: 1
            vzdump_backup: false

    - name: Count attach-absent qm scsi calls
      ansible.builtin.shell: |
        set -o pipefail
        applied=$(grep -c '^qm set 999 --scsi1 /dev/zvol/ssd/appdata/test/data,backup=0$' /tmp/molecule-stub-state/qm.log || true)
        anyset=$(grep -c '^qm set 999 --scsi1' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"applied_backup0\": ${applied}, \"any_scsi1_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: disk_absent
      changed_when: false

    # 8b. Attached WITHOUT backup=0 + vzdump_backup:false -> one re-set adding it.
    - name: Stub scsi1 attached without backup=0
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_scsi1_override
        content: "/dev/zvol/ssd/appdata/test/data,size=10G"
        mode: "0644"

    - name: Reset qm.log for disk-attach (missing-flag) case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role — re-set disk missing backup=0
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_additional_disks:
          - name: test-data
            size: 10G
            zvol: ssd/appdata/test/data
            mount_point: /mnt/test
            fstype: ext4
            scsi_slot: 1
            vzdump_backup: false

    - name: Count missing-flag qm scsi calls
      ansible.builtin.shell: |
        set -o pipefail
        applied=$(grep -c '^qm set 999 --scsi1 /dev/zvol/ssd/appdata/test/data,backup=0$' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"applied_backup0\": ${applied}}"
      args:
        executable: /bin/bash
      register: disk_missing
      changed_when: false

    # 8c. Attached WITH backup=0 + vzdump_backup:false -> no-op (the key
    # no-churn case: must NOT re-set the slot on every deploy).
    - name: Stub scsi1 attached with backup=0
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_scsi1_override
        content: "/dev/zvol/ssd/appdata/test/data,backup=0,size=10G"
        mode: "0644"

    - name: Reset qm.log for disk-attach (idempotent) case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role — already backup=0 (idempotent)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_additional_disks:
          - name: test-data
            size: 10G
            zvol: ssd/appdata/test/data
            mount_point: /mnt/test
            fstype: ext4
            scsi_slot: 1
            vzdump_backup: false

    - name: Count idempotent qm scsi calls
      ansible.builtin.shell: |
        set -o pipefail
        anyset=$(grep -c '^qm set 999 --scsi1' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"any_scsi1_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: disk_idempotent
      changed_when: false

    # 8d. Default disk (vzdump_backup unset) attached at correct path -> no-op,
    # and never adds backup=0 to a disk that should stay in vzdump.
    - name: Reset qm.log for disk-attach (default) case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Stub scsi1 attached without backup=0 (for default-disk case)
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_scsi1_override
        content: "/dev/zvol/ssd/appdata/test/data,size=10G"
        mode: "0644"

    - name: Run role — default disk (no vzdump_backup)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_additional_disks:
          - name: test-data
            size: 10G
            zvol: ssd/appdata/test/data
            mount_point: /mnt/test
            fstype: ext4
            scsi_slot: 1

    - name: Count default-disk qm scsi calls
      ansible.builtin.shell: |
        set -o pipefail
        anyset=$(grep -c '^qm set 999 --scsi1' /tmp/molecule-stub-state/qm.log || true)
        backup0=$(grep -c '^qm set 999 --scsi1 .*backup=0' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"any_scsi1_set\": ${anyset}, \"set_with_backup0\": ${backup0}}"
      args:
        executable: /bin/bash
      register: disk_default
      changed_when: false

    # 8e. Slot occupied by a different live zvol (data-old vs expected data) ->
    # the role must refuse to remap without allow_remap and issue no qm set.
    # Also exercises exact-path detection rather than a substring match.
    - name: Stub scsi1 attached to a different live zvol
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_scsi1_override
        content: "/dev/zvol/ssd/appdata/test/data-old,size=10G"
        mode: "0644"

    - name: Reset qm.log for disk-attach (remap-refusal) case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role — remap without allow_remap must be refused
      block:
        - name: Include proxmox_vm (expected to fail on the remap guard)
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_vm
          vars:
            proxmox_storage: ssd
            proxmox_vm_additional_disks:
              - name: test-data
                size: 10G
                zvol: ssd/appdata/test/data
                mount_point: /mnt/test
                fstype: ext4
                scsi_slot: 1
                vzdump_backup: false
        - name: Remap guard failed to trigger
          ansible.builtin.set_fact:
            remap_refused: false
      rescue:
        - name: Remap guard correctly refused
          ansible.builtin.set_fact:
            remap_refused: true

    - name: Count remap-refusal qm scsi calls
      ansible.builtin.shell: |
        set -o pipefail
        anyset=$(grep -c '^qm set 999 --scsi1' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"any_scsi1_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: disk_remap
      changed_when: false

    # 8f. Same different-zvol slot, but allow_remap: true -> the role DOES re-set
    # scsi1 to the correct EXACT path (proves data-old is not substring-matched).
    - name: Reset qm.log for disk-attach (allow_remap) case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role — remap WITH allow_remap re-sets to the correct path
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_additional_disks:
          - name: test-data
            size: 10G
            zvol: ssd/appdata/test/data
            mount_point: /mnt/test
            fstype: ext4
            scsi_slot: 1
            allow_remap: true
            vzdump_backup: false

    - name: Count allow_remap qm scsi calls
      ansible.builtin.shell: |
        set -o pipefail
        reset_correct=$(grep -c '^qm set 999 --scsi1 /dev/zvol/ssd/appdata/test/data,backup=0$' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"reset_to_correct_path\": ${reset_correct}}"
      args:
        executable: /bin/bash
      register: disk_allow_remap
      changed_when: false

    - name: Clean up scsi1 override
      ansible.builtin.file:
        path: /tmp/molecule-stub-state/vm_scsi1_override
        state: absent

    # 8g/8h. The scsi_slot assert is the precondition for the data-loss guard:
    # it must REJECT duplicate slots and missing slots. Both run the role
    # expecting the assert to fail (caught via rescue).
    - name: Run role — duplicate scsi_slot must be rejected
      block:
        - name: Include proxmox_vm with duplicate scsi_slots (expected to fail)
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_vm
          vars:
            proxmox_storage: ssd
            proxmox_vm_additional_disks:
              - {name: a, size: 1G, zvol: ssd/appdata/test/a, mount_point: /mnt/a, fstype: ext4, scsi_slot: 1}
              - {name: b, size: 1G, zvol: ssd/appdata/test/b, mount_point: /mnt/b, fstype: ext4, scsi_slot: 1}
        - name: Duplicate-slot assert did not trigger
          ansible.builtin.set_fact:
            slot_dup_rejected: false
      rescue:
        - name: Duplicate-slot assert correctly rejected
          ansible.builtin.set_fact:
            slot_dup_rejected: true

    - name: Run role — missing scsi_slot must be rejected
      block:
        - name: Include proxmox_vm with a missing scsi_slot (expected to fail)
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_vm
          vars:
            proxmox_storage: ssd
            proxmox_vm_additional_disks:
              - {name: a, size: 1G, zvol: ssd/appdata/test/a, mount_point: /mnt/a, fstype: ext4}
        - name: Missing-slot assert did not trigger
          ansible.builtin.set_fact:
            slot_missing_rejected: false
      rescue:
        - name: Missing-slot assert correctly rejected
          ansible.builtin.set_fact:
            slot_missing_rejected: true

    - name: Run role — scsi_slot 0 (boot-disk slot) must be rejected
      block:
        - name: Include proxmox_vm with scsi_slot 0 (expected to fail)
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_vm
          vars:
            proxmox_storage: ssd
            proxmox_vm_additional_disks:
              - {name: a, size: 1G, zvol: ssd/appdata/test/a, mount_point: /mnt/a, fstype: ext4, scsi_slot: 0}
        - name: Slot-zero assert did not trigger
          ansible.builtin.set_fact:
            slot_zero_rejected: false
      rescue:
        - name: Slot-zero assert correctly rejected
          ansible.builtin.set_fact:
            slot_zero_rejected: true

    - name: Capture scsi_slot assert result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/09-disk-slot-assert.json
        mode: "0644"
        content: |
          {"dup_rejected": {{ slot_dup_rejected | ternary('true', 'false') }},
           "missing_rejected": {{ slot_missing_rejected | ternary('true', 'false') }},
           "zero_rejected": {{ slot_zero_rejected | ternary('true', 'false') }}}

    - name: Capture disk-attach vzdump_backup result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/08-disk-vzdump-backup.json
        mode: "0644"
        content: |
          {"absent_applied_backup0": {{ (disk_absent.stdout | from_json).applied_backup0 }},
           "absent_any_set": {{ (disk_absent.stdout | from_json).any_scsi1_set }},
           "missing_flag_applied_backup0": {{ (disk_missing.stdout | from_json).applied_backup0 }},
           "idempotent_any_set": {{ (disk_idempotent.stdout | from_json).any_scsi1_set }},
           "default_any_set": {{ (disk_default.stdout | from_json).any_scsi1_set }},
           "default_set_with_backup0": {{ (disk_default.stdout | from_json).set_with_backup0 }},
           "remap_refused": {{ remap_refused | ternary('true', 'false') }},
           "remap_any_set": {{ (disk_remap.stdout | from_json).any_scsi1_set }},
           "allow_remap_reset_to_correct": {{ (disk_allow_remap.stdout | from_json).reset_to_correct_path }}}

    # 14. Cloud-init network reconcile on an existing VM, gated on `not
    # skip_create`, so these cases override the scenario default. Desired =
    # ip=192.168.0.99/24,gw=192.168.0.1 + nameserver "192.168.0.150 192.168.0.160".

    # 14a. Drift — stub reports an old-subnet ipconfig0/nameserver -> exactly one
    # `qm set … --ipconfig0 <desired> --nameserver <desired>`, task changed.
    - name: Stub cloud-init net on an old subnet (drift)
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: vm_ipconfig0_override, content: "ip=192.168.0.42/24,gw=192.168.0.254"}
        - {name: vm_nameserver_override, content: "192.168.0.1"}
      loop_control:
        label: "{{ item.name }}"

    - name: Reset qm.log for the cloud-init-net drift case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role against a VM with drifted cloud-init net
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_skip_create: false

    - name: Record whether the drift reconcile ran and mutated
      ansible.builtin.set_fact:
        ci_net_drift_changed: "{{ proxmox_vm_cloudinit_net_reconcile.changed }}"
        ci_net_drift_skipped: "{{ proxmox_vm_cloudinit_net_reconcile.skipped | default(false) }}"

    - name: Count cloud-init-net drift qm calls
      ansible.builtin.shell: |
        set -o pipefail
        applied=$(grep -c '^qm set 999 --ipconfig0 ip=192.168.0.99/24,gw=192.168.0.1 --nameserver 192.168.0.150 192.168.0.160$' /tmp/molecule-stub-state/qm.log || true)
        anyset=$(grep -c '^qm set 999 --ipconfig0' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"applied\": ${applied}, \"any_ipconfig0_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: ci_net_drift
      changed_when: false

    # 14b. NO-DRIFT — stub reports the desired ipconfig0/nameserver -> the
    # reconcile RUNS (skip_create:false, not skipped) but issues NO qm set and
    # reports not-changed. Proves the compare, not just the code path.
    - name: Stub cloud-init net already matching desired (no drift)
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: vm_ipconfig0_override, content: "ip=192.168.0.99/24,gw=192.168.0.1"}
        - {name: vm_nameserver_override, content: "192.168.0.150 192.168.0.160"}
      loop_control:
        label: "{{ item.name }}"

    - name: Reset qm.log for the cloud-init-net no-drift case
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm.log
        content: ""
        mode: "0644"

    - name: Run role against a VM whose cloud-init net already matches
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_skip_create: false

    - name: Record whether the no-drift reconcile ran and mutated
      ansible.builtin.set_fact:
        ci_net_nodrift_changed: "{{ proxmox_vm_cloudinit_net_reconcile.changed }}"
        ci_net_nodrift_skipped: "{{ proxmox_vm_cloudinit_net_reconcile.skipped | default(false) }}"

    - name: Count cloud-init-net no-drift qm calls
      ansible.builtin.shell: |
        set -o pipefail
        anyset=$(grep -c '^qm set 999 --ipconfig0' /tmp/molecule-stub-state/qm.log || true)
        echo "{\"any_ipconfig0_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: ci_net_nodrift
      changed_when: false

    - name: Remove cloud-init-net override files
      ansible.builtin.file:
        path: "/tmp/molecule-stub-state/{{ item }}"
        state: absent
      loop:
        - vm_ipconfig0_override
        - vm_nameserver_override

    - name: Capture cloud-init-net reconcile result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/14-cloudinit-net.json
        mode: "0644"
        content: |
          {"drift_applied": {{ (ci_net_drift.stdout | from_json).applied }},
           "drift_any_set": {{ (ci_net_drift.stdout | from_json).any_ipconfig0_set }},
           "drift_changed": {{ ci_net_drift_changed | to_json }},
           "drift_skipped": {{ ci_net_drift_skipped | to_json }},
           "nodrift_any_set": {{ (ci_net_nodrift.stdout | from_json).any_ipconfig0_set }},
           "nodrift_changed": {{ ci_net_nodrift_changed | to_json }},
           "nodrift_skipped": {{ ci_net_nodrift_skipped | to_json }}}

    # 15. zvol creation — the create branch. A sparse disk must carry `-s`, a
    # plain one must not, and a second run must create nothing.
    - name: Reset the zfs log and zvol state
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: zfs.log, content: ""}
        - {name: zvols, content: ""}
      loop_control:
        label: "{{ item.name }}"

    - name: Create two additional disks, one sparse and one thick
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_additional_disks:
          - name: test-data
            size: 10G
            zvol: ssd/appdata/test/data
            mount_point: /mnt/test
            fstype: ext4
            scsi_slot: 1
            sparse: true
          - name: test-logs
            size: 1G
            zvol: ssd/appdata/test/logs
            mount_point: /mnt/logs
            fstype: ext4
            scsi_slot: 2

    - name: Count first-run zfs creates
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/zfs.log
        sparse=$(grep -cxF 'zfs create -p -s -V 10G ssd/appdata/test/data' "$log" || true)
        thick=$(grep -cxF 'zfs create -p -V 1G ssd/appdata/test/logs' "$log" || true)
        echo "{\"sparse\": ${sparse}, \"thick\": ${thick}}"
      args:
        executable: /bin/bash
      register: zvol_first
      changed_when: false

    - name: Reset the zfs log, keeping the created zvols
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/zfs.log
        content: ""
        mode: "0644"

    - name: Re-run against the zvols that now exist
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
      vars:
        proxmox_storage: ssd
        proxmox_vm_additional_disks:
          - name: test-data
            size: 10G
            zvol: ssd/appdata/test/data
            mount_point: /mnt/test
            fstype: ext4
            scsi_slot: 1
            sparse: true
          - name: test-logs
            size: 1G
            zvol: ssd/appdata/test/logs
            mount_point: /mnt/logs
            fstype: ext4
            scsi_slot: 2

    - name: Count second-run zfs creates
      ansible.builtin.shell: |
        set -o pipefail
        made=$(grep -c '^zfs create ' /tmp/molecule-stub-state/zfs.log || true)
        echo "{\"creates\": ${made}}"
      args:
        executable: /bin/bash
      register: zvol_second
      changed_when: false

    - name: Capture zvol-creation result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/15-zvol-create.json
        mode: "0644"
        content: |
          {"sparse_creates": {{ (zvol_first.stdout | from_json).sparse }},
           "thick_creates": {{ (zvol_first.stdout | from_json).thick }},
           "second_run_creates": {{ (zvol_second.stdout | from_json).creates }}}

    # The backend seam: an unimplemented backend must be a named error, not a
    # file-not-found out of the dynamic include.
    - name: Drive the additional-disk backend guard with a backend that has no file
      block:
        - name: Include the role with an unimplemented disk backend
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_vm
          vars:
            proxmox_storage: ssd
            proxmox_vm_additional_disk_backend: lvm
            proxmox_vm_additional_disks:
              - name: test-data
                size: 10G
                zvol: ssd/appdata/test/data
                mount_point: /mnt/test
                fstype: ext4
                scsi_slot: 1

        - name: Record that the unimplemented backend was accepted
          ansible.builtin.set_fact:
            proxmox_vm_backend_rejected: false
      rescue:
        - name: Record that the unimplemented backend was rejected by name
          ansible.builtin.set_fact:
            proxmox_vm_backend_rejected: >-
              {{ 'has no tasks/disks-' in (ansible_failed_result.msg | default('')) }}

    - name: Capture the backend-guard result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/16-disk-backend.json
        mode: "0644"
        content: |
          {"rejected_by_name": {{ (proxmox_vm_backend_rejected | bool) | lower }}}

    # The cluster probe's negative arm: no host answers, so the entry point must
    # fail by name rather than hand the caller an empty answer.
    - name: Drive the cluster-resource probe with every delegate unreachable
      block:
        - name: Probe a Proxmox host that does not exist
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_vm
            tasks_from: probe-cluster-resources
          vars:
            _proxmox_vm_probe_hosts: [proxmox-vm-no-such-host]

        - name: Record that the empty probe was accepted
          ansible.builtin.set_fact:
            proxmox_vm_probe_rejected: false
      rescue:
        - name: Record that the empty probe failed by name
          ansible.builtin.set_fact:
            proxmox_vm_probe_rejected: >-
              {{ 'No Proxmox host answered' in (ansible_failed_result.msg | default('')) }}

    - name: Capture the cluster-probe result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/17-cluster-probe.json
        mode: "0644"
        content: |
          {"rejected_by_name": {{ (proxmox_vm_probe_rejected | bool) | lower }},
           "hosts_probed": {{ _proxmox_vm_probe_results | default([]) | length }}}
