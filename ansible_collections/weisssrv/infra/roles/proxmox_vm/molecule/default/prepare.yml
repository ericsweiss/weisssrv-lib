---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    - name: Stub state directory
      ansible.builtin.file:
        path: /tmp/molecule-stub-state
        state: directory
        mode: "0755"
      become: true

    - name: Default stubs to "VM does not exist"
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_exists_state
        content: "missing\n"
        mode: "0644"
      become: true

    - name: Install pvesh stub (cluster resources + pool create/get)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvesh
        mode: "0755"
        content: |
          #!/bin/bash
          if [[ "$1 $2" == "get /cluster/resources" ]]; then
            if grep -q "^exists$" /tmp/molecule-stub-state/vm_exists_state 2>/dev/null; then
              # node = this molecule host so the role's reconcile tasks delegate
              # back here (where qm is stubbed), exercising the HA-aware lookup.
              echo '[{"vmid": 999, "type": "qemu", "node": "{{ inventory_hostname }}"}]'
            else
              echo '[]'
            fi
            exit 0
          fi
          if [[ "$1" == "get" && "$2" == /pools/* ]]; then exit 1; fi
          exit 0
      become: true

    - name: Install pvesm stub (advertises ssd + local-ssd)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvesm
        mode: "0755"
        content: |
          #!/bin/bash
          echo "Name             Type     Status           Total            Used       Available        %"
          echo "ssd              zfspool  active      4000000000       100000000      3900000000    2.50%"
          echo "local-ssd        zfspool  active      1000000000       100000000       900000000   10.00%"
      become: true

    - name: Install qm stub (records calls, answers `config`)
      ansible.builtin.copy:
        dest: /usr/local/bin/qm
        mode: "0755"
        content: |
          #!/bin/bash
          echo "qm $*" >> /tmp/molecule-stub-state/qm.log
          # Default net0 already carries firewall=1 (no-op); the override file
          # supplies the net0 value verbatim for legacy variants.
          if [ "$1" = "config" ]; then
            # vm_net0_absent stubs an adopted guest whose NIC is not net0.
            if [ -f /tmp/molecule-stub-state/vm_net0_absent ]; then
              :
            elif [ -f /tmp/molecule-stub-state/vm_net0_override ]; then
              echo "net0: $(cat /tmp/molecule-stub-state/vm_net0_override)"
            else
              echo "net0: virtio=BC:24:11:AA:BB:CC,bridge=vmbr0,firewall=1"
            fi
            # Defaults match the role defaults (no-op reconciles). Default
            # startup omits up=0, as Proxmox does: the reconcile must normalize
            # both sides and treat it as equal to "order=100,up=0".
            if [ -f /tmp/molecule-stub-state/vm_agent_override ]; then
              echo "agent: $(cat /tmp/molecule-stub-state/vm_agent_override)"
            else
              echo "agent: enabled=1"
            fi
            if [ -f /tmp/molecule-stub-state/vm_onboot_override ]; then
              echo "onboot: $(cat /tmp/molecule-stub-state/vm_onboot_override)"
            else
              echo "onboot: 1"
            fi
            if [ -f /tmp/molecule-stub-state/vm_startup_override ]; then
              echo "startup: $(cat /tmp/molecule-stub-state/vm_startup_override)"
            else
              echo "startup: order=100"
            fi
            # Default matches proxmox_vm_memory (2048); omitting the line would
            # read as drift against any desired value.
            if [ -f /tmp/molecule-stub-state/vm_memory_override ]; then
              echo "memory: $(cat /tmp/molecule-stub-state/vm_memory_override)"
            else
              echo "memory: 2048"
            fi
            # scsi1 absent by default (slot not attached); the override file
            # supplies it verbatim, with or without backup=0.
            if [ -f /tmp/molecule-stub-state/vm_scsi1_override ]; then
              echo "scsi1: $(cat /tmp/molecule-stub-state/vm_scsi1_override)"
            fi
            # ipconfig0/nameserver absent by default: the reconcile is
            # skip_create-gated. Override files drive the drift/no-drift arms.
            if [ -f /tmp/molecule-stub-state/vm_ipconfig0_override ]; then
              echo "ipconfig0: $(cat /tmp/molecule-stub-state/vm_ipconfig0_override)"
            fi
            if [ -f /tmp/molecule-stub-state/vm_nameserver_override ]; then
              echo "nameserver: $(cat /tmp/molecule-stub-state/vm_nameserver_override)"
            fi
          fi
          exit 0
      become: true

    - name: Install zfs stub (argv log + zvol state)
      ansible.builtin.copy:
        dest: /usr/local/bin/zfs
        mode: "0755"
        content: |
          #!/bin/bash
          STATE=/tmp/molecule-stub-state
          echo "zfs $*" >> "$STATE/zfs.log"
          # `list <name>` answers from the zvol state file, so the create branch
          # is reachable; `create` records the new zvol there.
          if [ "$1" = "list" ]; then
            grep -qxF "${2:-}" "$STATE/zvols" 2>/dev/null || exit 1
            echo "${2} 10G - - - -"
            exit 0
          fi
          if [ "$1" = "create" ]; then
            echo "${@: -1}" >> "$STATE/zvols"
            exit 0
          fi
          exit 0
      become: true

    - name: Default zvol state to empty (nothing created yet)
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/zvols
        content: ""
        mode: "0644"
      become: true
