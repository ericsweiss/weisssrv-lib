---
# Alloy from the Grafana APT repo, shipping journald to Loki.

- name: Assert the required Alloy inputs are present
  ansible.builtin.assert:
    that:
      - alloy_host_version | default('') | length > 0
      - alloy_host_loki_url | default('') | length > 0
    fail_msg: >-
      alloy_host_version (the pinned apt package version) and
      alloy_host_loki_url (the Loki push endpoint) are required.
    quiet: true

# Empty credentials ship 401s and silently drop the fleet's journals, so fail
# at deploy time. The gate is on the URL scheme: an https endpoint sits behind
# an authenticating proxy, a plaintext fallback endpoint needs none.
- name: Assert Loki push credentials are present
  ansible.builtin.assert:
    that:
      - alloy_host_loki_user | trim | length > 0
      - alloy_host_loki_password | trim | length > 0
    fail_msg: >-
      alloy_host_loki_user / alloy_host_loki_password are empty, but
      alloy_host_loki_url is an https endpoint — supply the push credentials
      from the site's secret store.
    quiet: true
  when: alloy_host_loki_url is match('^https://')

# Shared stat -> download -> verify-fingerprint -> dearmor -> add-repo pipeline.
# This role has no meta dependency on base (which provisions gnupg), so the
# helper installs it when the keyring is first created.
- name: Add Grafana signed APT repository
  ansible.builtin.include_role:
    name: weisssrv.infra.apt_signed_repo
  vars:
    apt_signed_repo_key_url: https://apt.grafana.com/gpg.key
    apt_signed_repo_fingerprint: B53AE77BADB630A683046005963FA27710458545
    apt_signed_repo_keyring_path: /etc/apt/keyrings/grafana.gpg
    apt_signed_repo_repo_line: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    apt_signed_repo_filename: grafana
    apt_signed_repo_install_gnupg: true

- name: Install Alloy (pinned version)
  ansible.builtin.apt:
    name: "alloy={{ alloy_host_version }}"
    state: present
    # Refresh the index so a newly-pinned version resolves — the fleet has
    # APT periodic list updates disabled, so the cache is otherwise stale.
    update_cache: true
    cache_valid_time: 3600
    allow_downgrade: true
    allow_change_held_packages: true

# Hold the package so a manual `apt upgrade` can't move Alloy past the pin
# (the Grafana repo continuously serves newer builds).
- name: Hold Alloy package to prevent unintended upgrades
  ansible.builtin.dpkg_selections:
    name: alloy
    selection: hold

# The joined args land inside a double-quoted assignment: a `"` or trailing `\`
# closes it early, and whitespace splits one entry into words no guard below sees
# (so each entry must be exactly one argument).
- name: Assert no Alloy extra argument breaks the CUSTOM_ARGS assignment
  ansible.builtin.assert:
    that:
      - '''"'' not in item'
      - 'not item.endswith("\\")'
      - 'item is not search("\\s")'
    fail_msg: >-
      alloy_host_extra_args entry {{ item | to_json }} contains a double quote,
      ends with a backslash or contains whitespace. Each entry is one argument,
      joined into the double-quoted CUSTOM_ARGS assignment in /etc/default/alloy.
    quiet: true
  loop: "{{ alloy_host_extra_args }}"
  loop_control:
    label: "{{ item | truncate(40) }}"

# Alloy >= 1.21 rejects the loki.write wal block below experimental, so with the
# WAL on a site-supplied --stability.level must be exactly the experimental one.
- name: Assert a site stability level keeps the Alloy WAL loadable
  ansible.builtin.assert:
    that:
      - >-
        not (alloy_host_wal_enabled | bool)
        or (alloy_host_extra_args | select("search", "^--stability[.]level")
        | reject("equalto", "--stability.level=experimental") | list | length == 0)
    fail_msg: >-
      alloy_host_extra_args sets
      {{ alloy_host_extra_args | select("search", "^--stability[.]level") | list | to_json }}
      while alloy_host_wal_enabled is true; the loki.write wal block needs
      --stability.level=experimental (the role adds it), so drop the entry,
      write it as exactly --stability.level=experimental, or disable the WAL.
    quiet: true

# One managed CUSTOM_ARGS line: --disable-reporting, then with the WAL on the
# experimental level the wal block needs (site copies of it dropped, so it is
# written once), then alloy_host_extra_args in their own order and multiplicity.
- name: Set Alloy command-line arguments
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: >-
      CUSTOM_ARGS="{{ (["--disable-reporting"]
      + ((["--stability.level=experimental"]
      + (alloy_host_extra_args | reject("equalto", "--stability.level=experimental") | list))
      if (alloy_host_wal_enabled | bool) else alloy_host_extra_args)) | join(" ") }}"
  notify: Restart alloy

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    # Group-readable only: the config embeds the Loki push credential —
    # which is also why diffs are suppressed here.
    mode: "0640"
  notify: Restart alloy
  no_log: true

- name: Enable and start Alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true

# Flush the notified restart now (state: started is a no-op on a running
# service) so the readiness probe below validates the freshly deployed
# config, not the pre-change process — same pattern as prometheus_exporter.
- name: Apply pending restarts before health check
  ansible.builtin.meta: flush_handlers

- name: Verify Alloy is listening on its HTTP port
  ansible.builtin.uri:
    url: "http://localhost:{{ alloy_host_http_port }}/-/ready"
    return_content: false
    status_code: 200
  register: alloy_host_health
  retries: 5
  delay: 3
  until: alloy_host_health.status == 200
  when: not ansible_check_mode
