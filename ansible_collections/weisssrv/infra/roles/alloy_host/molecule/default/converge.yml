---
# Installs Alloy from the real Grafana APT repo (publicly available).
# The systemd test container runs journald, so Alloy starts and the role's
# /-/ready health check runs for real during converge.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - systemd
          - ca-certificates
          - gnupg
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: weisssrv.infra.alloy_host

  post_tasks:
    # Negative test for the Loki credentials assert: an https push URL with no
    # creds must fail fast, before anything mutates. Skipped on the idempotence
    # re-run so the guard fires once, as expected-junit-failures.txt declares.
    - name: Re-run alloy_host with https URL and empty creds (expect failure)
      tags: [molecule-idempotence-notest]
      block:
        - name: Include alloy_host with https URL and no credentials
          ansible.builtin.include_role:
            name: weisssrv.infra.alloy_host
          vars:
            alloy_host_loki_url: https://loki.test.local/loki/api/v1/push
            alloy_host_loki_user: ""
            alloy_host_loki_password: ""

        - name: Credentials assert failed to trigger
          ansible.builtin.copy:
            dest: /tmp/alloy-creds-assert.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Credentials assert correctly rejected empty creds
          ansible.builtin.copy:
            dest: /tmp/alloy-creds-assert.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}

    # Positive render of the production path (https + basic_auth). Rendered to
    # a scratch path: a full role re-run would overwrite /etc/alloy/config.alloy
    # and break both verify's NodePort assert and idempotence.
    - name: Render config.alloy with https URL and creds (production path)
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/config.alloy.j2') }}"
        dest: /tmp/alloy-https-render.alloy
        mode: "0644"
      vars:
        alloy_host_loki_url: https://loki.test.local/loki/api/v1/push
        alloy_host_loki_user: test-push-user
        alloy_host_loki_password: test-push-password
        alloy_host_wal_enabled: true
        alloy_host_wal_max_segment_age: "1h"
        alloy_host_journal_max_age: "3h"
