---
# Required, asserted in tasks/main.yml: alloy_host_version (the pinned
#   `alloy=<version>` apt version, undeclared here) and alloy_host_loki_url (the
#   Loki push endpoint, empty default below).
alloy_host_loki_url: ""

# Basic-auth credentials, asserted non-empty whenever the endpoint is https://
# (assumed to sit behind an authenticating proxy). A config rendered with empty
# credentials ships 401s and silently drops the fleet's journals.
alloy_host_loki_user: ""
alloy_host_loki_password: ""

# The loki.write WAL segment cut interval bounds replay lag and disk use.
alloy_host_wal_max_segment_age: "1h"

# How far back a restarted Alloy re-reads the journal. Must stay <= Loki's
# out-of-order accept window (ingester.max_chunk_age / 2), or re-read entries
# are pushed and rejected `too_far_behind`. Raise both together; see README.
alloy_host_journal_max_age: "3h"
