---
# Mount block devices attached to the guest as extra SCSI disks, addressed by
# zvol_mount_device_id_prefix + slot because /dev/sdX is not stable. Slot 0 is
# the root disk, so extra disks start at 1. See README.

# The role's one required input; the loop below is its first consumption, so
# without this the failure is a raw undefined-variable error.
- name: Assert the disk list is set
  ansible.builtin.assert:
    that:
      - zvol_mount_disks is defined
      - zvol_mount_disks | length > 0
    fail_msg: >-
      zvol_mount_disks is required: a list of {name, mount_point, fstype,
      scsi_slot} entries. It is conventionally the same list the guest's
      proxmox_vm_additional_disks names, so one inventory block feeds zvol
      creation on the host and mounting in the guest.
    quiet: true

- name: Reset zvol_mount_disk_devices for this invocation
  ansible.builtin.set_fact:
    zvol_mount_disk_devices: []

- name: Build disk device paths using stable QEMU SCSI IDs
  vars:
    # Use explicit scsi_slot if provided, else fall back to loop index + 1.
    # Explicit slots protect against SCSI reordering after VM hardware edits.
    scsi_slot: "{{ item.scsi_slot | default(idx + 1) }}"
    scsi_path: "{{ zvol_mount_device_id_prefix }}{{ scsi_slot }}"
    disk_entry:
      name: "{{ item.name }}"
      path: "{{ scsi_path }}"
      mount_point: "{{ item.mount_point }}"
      fstype: "{{ item.fstype }}"
  ansible.builtin.set_fact:
    zvol_mount_disk_devices: "{{ zvol_mount_disk_devices | default([]) + [disk_entry] }}"
  loop: "{{ zvol_mount_disks }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"

- name: Check if additional disk device exists
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ zvol_mount_disk_devices }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: zvol_mount_disk_exists

- name: Fail if disk device doesn't exist
  ansible.builtin.fail:
    msg: |
      Disk {{ item.item.name }} device {{ item.item.path }} does not exist!
      Check that the zvol is attached to the VM in Proxmox.
      Expected: {{ item.item.path }}
  loop: "{{ zvol_mount_disk_exists.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists

# lsblk over blkid: blkid can exit non-zero on a transient I/O error, which
# would read as "unformatted" and reformat. -d keeps the probe on the disk
# itself, so a child partition's filesystem never masks an empty disk.
- name: Detect filesystem type on additional disks
  ansible.builtin.command: "lsblk -dno FSTYPE {{ item.path }}"
  loop: "{{ zvol_mount_disk_devices }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: zvol_mount_disk_fstypes
  changed_when: false
  # Every read-only probe in this file runs in --check too, or its registered
  # results carry no stdout and the templating downstream breaks a dry-run.
  check_mode: false

# FSTYPE is empty on a disk that carries only a partition table, so PTTYPE is
# the second half of the "is this disk really blank" test.
- name: Detect partition table on additional disks
  ansible.builtin.command: "lsblk -dno PTTYPE {{ item.path }}"
  loop: "{{ zvol_mount_disk_devices }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: zvol_mount_disk_pttypes
  changed_when: false
  check_mode: false

- name: Assert a blank-looking disk carries no partition table either
  vars:
    zvol_mount_fstype_seen: "{{ zvol_mount_disk_fstypes.results[zvol_mount_idx].stdout | default('') | trim }}"
  ansible.builtin.assert:
    that:
      - (item.stdout | default('') | trim) == '' or zvol_mount_fstype_seen != ''
    fail_msg: >-
      Disk {{ item.item.name }} at {{ item.item.path }} has no filesystem but
      carries a '{{ item.stdout | trim }}' partition table, so it was used for
      something. Refusing to format it: wipe it deliberately
      (`wipefs -a {{ item.item.path }}`) if that is really intended.
    quiet: true
  loop: "{{ zvol_mount_disk_pttypes.results }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.path }})"
    index_var: zvol_mount_idx

# Without this the format step is skipped (the disk is "already formatted") and
# the mount is then attempted with the wrong fstype, which fails at boot.
- name: Assert existing filesystem matches expected type (or disk is empty)
  ansible.builtin.assert:
    that:
      - (item.stdout | default('') | trim) in ['', item.item.fstype]
    fail_msg: >-
      Disk {{ item.item.name }} at {{ item.item.path }} has filesystem
      '{{ item.stdout | trim }}' but expected '{{ item.item.fstype }}'.
      Refusing to continue to avoid unsafe mounts.
    quiet: true
  loop: "{{ zvol_mount_disk_fstypes.results }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.path }})"

- name: Format additional disks only when no filesystem exists
  community.general.filesystem:
    fstype: "{{ item.item.fstype }}"
    dev: "{{ item.item.path }}"
  loop: "{{ zvol_mount_disk_fstypes.results }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.path }})"
  when:
    - not ansible_check_mode  # Never format disks in check mode
    - (item.stdout | default('') | trim) == ''

- name: Get filesystem UUID for additional disks
  ansible.builtin.command: "blkid -s UUID -o value {{ item.path }}"
  loop: "{{ zvol_mount_disk_devices }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: zvol_mount_disk_uuids
  changed_when: false
  # blkid fails on an unformatted disk (formatting is skipped in check mode);
  # allow it and let the UUID validation below handle the empty result.
  failed_when: false
  check_mode: false

- name: Validate all additional disks have UUIDs
  ansible.builtin.assert:
    that:
      - item.stdout | length > 0
    fail_msg: |
      Disk {{ item.item.name }} ({{ item.item.path }}) has no filesystem UUID!
      This usually means the disk is not attached or not formatted.
    quiet: true
  loop: "{{ zvol_mount_disk_uuids.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode  # Skip validation in check mode (disks may not be formatted)

# CRITICAL: two attached disks sharing a filesystem UUID make `UUID=<x>` an
# ambiguous mount source, so the mount can bind the wrong device. A zvol cloned
# or received from a formatted snapshot inherits its source's UUID. Fail loud
# rather than mount the wrong filesystem. See README.
- name: Assert additional-disk filesystem UUIDs are unique
  vars:
    _zvol_mount_uuids: >-
      {{ zvol_mount_disk_uuids.results
         | map(attribute='stdout')
         | map('default', '')
         | map('trim')
         | reject('equalto', '')
         | list }}
  ansible.builtin.assert:
    that:
      - _zvol_mount_uuids | length == (_zvol_mount_uuids | unique | length)
    fail_msg: >-
      Duplicate filesystem UUID across attached zvols: {{ _zvol_mount_uuids }}.
      Mounting by UUID is ambiguous when two disks share one (common after a
      zvol clone or `zfs send|receive` from a formatted snapshot). Give the
      duplicate a new UUID on the Proxmox host before re-running: for example
      `tune2fs -U random <dev>` for ext4, `xfs_admin -U generate <dev>` for xfs.
    quiet: true
  when: not ansible_check_mode  # UUIDs may be absent in check mode (unformatted)

- name: Create mount points for additional disks
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    mode: "0755"
  loop: "{{ zvol_mount_disk_devices }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check current mount status of additional disks
  # head -1: a filesystem mounted at several targets makes findmnt print one
  # line each, and the whole multi-line string would be handed to `mount:` as a
  # single path below.
  ansible.builtin.shell: |
    set -o pipefail
    findmnt -n -o TARGET "UUID={{ item.1.stdout | default('') | trim }}" 2>/dev/null | head -1 \
      | grep . || echo "not-mounted"
  args:
    executable: /bin/bash
  loop: "{{ zvol_mount_disk_devices | zip(zvol_mount_disk_uuids.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  register: zvol_mount_current_mounts
  changed_when: false
  # An empty UUID from a disk that is still unformatted reports not-mounted.
  check_mode: false
  when: zvol_mount_fix_wrong_locations | bool

- name: Unmount disks mounted at wrong locations
  ansible.posix.mount:
    path: "{{ item.stdout | trim }}"
    state: unmounted
  loop: "{{ zvol_mount_current_mounts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.name }}: {{ item.stdout | trim }} (should be {{ item.item.0.mount_point }})"
  when:
    - zvol_mount_fix_wrong_locations | bool
    - item.stdout | trim != "not-mounted"
    - item.stdout | trim != item.item.0.mount_point

# Keyed on fstab, not on the live mount: a stale line for an unmounted disk
# would otherwise survive beside the new one and mount it twice at boot.
- name: Remove fstab entries that mount a disk anywhere but its mount point
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^UUID={{ item.1.stdout | trim }}\\s+(?!\\s|{{ item.0.mount_point | regex_escape }}\\s)"
    state: absent
  loop: "{{ zvol_mount_disk_devices | zip(zvol_mount_disk_uuids.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  when:
    - zvol_mount_fix_wrong_locations | bool
    - item.1.stdout | default('') | trim | length > 0

- name: Mount additional disks by UUID
  ansible.posix.mount:
    path: "{{ item.0.mount_point }}"
    src: "UUID={{ item.1.stdout | trim }}"
    fstype: "{{ item.0.fstype }}"
    # CRITICAL: no nofail. A disk that fails to mount must fail the boot, or
    # its services start and write into the empty mount point on the root disk.
    opts: defaults,noatime,x-systemd.device-timeout=30
    state: mounted
  loop: "{{ zvol_mount_disk_devices | zip(zvol_mount_disk_uuids.results) | list }}"
  loop_control:
    label: "{{ item.0.name }} (UUID={{ item.1.stdout | default('pending') }}) -> {{ item.0.mount_point }}"
  when: not ansible_check_mode or (item.1.stdout | default('') | length > 0)
