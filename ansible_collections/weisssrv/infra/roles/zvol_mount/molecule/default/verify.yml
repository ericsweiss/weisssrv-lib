---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check mount point directory exists
      ansible.builtin.stat:
        path: /mnt/test-data
      register: mount_dir
      failed_when: not mount_dir.stat.exists or not mount_dir.stat.isdir

    - name: Verify mount point permissions
      ansible.builtin.assert:
        that:
          - mount_dir.stat.mode == '0755'
        fail_msg: "Mount point /mnt/test-data has wrong permissions: {{ mount_dir.stat.mode }}"
        success_msg: "Mount point /mnt/test-data exists with correct permissions (0755)"

    - name: Check device filesystem type with blkid
      ansible.builtin.command: blkid -s TYPE -o value /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
      register: blkid_result
      changed_when: false
      failed_when: blkid_result.rc != 0

    - name: Verify filesystem is ext4
      ansible.builtin.assert:
        that:
          - blkid_result.stdout | trim == 'ext4'
        fail_msg: "Device is not ext4, got: {{ blkid_result.stdout | trim }}"
        success_msg: "Device is correctly formatted as ext4"

    - name: Check device is mounted with findmnt
      ansible.builtin.command: findmnt -n -o TARGET --source /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
      register: findmnt_result
      changed_when: false
      failed_when: findmnt_result.rc != 0

    - name: Verify mount target is correct
      ansible.builtin.assert:
        that:
          - findmnt_result.stdout | trim == '/mnt/test-data'
        fail_msg: "Device mounted at '{{ findmnt_result.stdout | trim }}', expected '/mnt/test-data'"
        success_msg: "Device is correctly mounted at /mnt/test-data"

    - name: Get filesystem UUID
      ansible.builtin.command: blkid -s UUID -o value /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
      register: disk_uuid
      changed_when: false
      failed_when: disk_uuid.rc != 0

    - name: Verify UUID is not empty
      ansible.builtin.assert:
        that:
          - disk_uuid.stdout | trim | length > 0
        fail_msg: "Device has no filesystem UUID"
        success_msg: "Device has UUID: {{ disk_uuid.stdout | trim }}"

    - name: Read fstab contents
      ansible.builtin.slurp:
        src: /etc/fstab
      register: fstab_content

    # One line carrying all three fields, and no second line for the same UUID:
    # converge plants a stale /mnt/stale-location entry the role must remove.
    - name: Verify fstab holds exactly one UUID-based entry for the disk
      vars:
        zvol_mount_fstab_text: "{{ fstab_content.content | b64decode }}"
        zvol_mount_uuid: "{{ disk_uuid.stdout | trim }}"
      ansible.builtin.assert:
        that:
          - zvol_mount_fstab_text is search('(?m)^UUID=' ~ zvol_mount_uuid ~ '\\s+/mnt/test-data\\s+ext4\\s')
          - zvol_mount_fstab_text | regex_findall('(?m)^UUID=' ~ zvol_mount_uuid ~ '\\s') | length == 1
          - "'/mnt/stale-location' not in zvol_mount_fstab_text"
        fail_msg: >-
          fstab does not carry exactly one `UUID=<uuid> /mnt/test-data ext4` line
          for the managed disk, or the stale /mnt/stale-location entry survived.
        success_msg: "fstab carries one UUID-based entry for /mnt/test-data and no stale one"

    - name: Read the partition-table guard disk
      ansible.builtin.command: lsblk -dno FSTYPE,PTTYPE /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi9
      register: pt_guard_probe
      changed_when: false

    # Converge only proves the role errored; this proves it errored before
    # touching the disk.
    - name: Verify the guard disk is unformatted and still only partitioned
      ansible.builtin.assert:
        that:
          - pt_guard_probe.stdout | trim == 'gpt'
          - "'/mnt/pt-guard' not in (fstab_content.content | b64decode)"
        fail_msg: >-
          The blank-but-partitioned disk reads
          '{{ pt_guard_probe.stdout | trim }}' and fstab mentions
          /mnt/pt-guard: the role formatted or mounted a disk it must refuse.
        success_msg: "Partition-table guard left the disk untouched"

    - name: Read the fstype and duplicate-UUID guard disks
      ansible.builtin.shell: |
        set -euo pipefail
        for slot in 10 11 12; do
          dev=/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi$slot
          printf '%s %s\n' "$(blkid -p -s TYPE -o value "$dev")" "$(findmnt -n -o TARGET --source "$dev" || true)"
        done
      args:
        executable: /bin/bash
      register: guard_disks_probe
      changed_when: false

    # Converge proves the guards fired; this proves they fired before the role
    # formatted, mounted or wrote fstab for any of these disks.
    - name: Verify the fstype and duplicate-UUID guards left their disks untouched
      vars:
        guard_disks: "{{ guard_disks_probe.stdout_lines | map('trim') | list }}"
      ansible.builtin.assert:
        that:
          - guard_disks == ['xfs', 'ext4', 'ext4']
          - "'/mnt/fstype-guard' not in (fstab_content.content | b64decode)"
          - "'/mnt/dup-guard-a' not in (fstab_content.content | b64decode)"
          - "'/mnt/dup-guard-b' not in (fstab_content.content | b64decode)"
        fail_msg: >-
          The guard disks read {{ guard_disks_probe.stdout_lines }} (type, mount
          target) or fstab names one of their mount points: the role formatted
          or mounted a disk its fstype or duplicate-UUID guard must refuse.
        success_msg: "The fstype and duplicate-UUID guards left their disks untouched"
