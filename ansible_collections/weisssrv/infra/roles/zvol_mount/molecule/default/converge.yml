---
- name: Converge
  hosts: all
  become: true
  roles:
    - role: weisssrv.infra.zvol_mount

  post_tasks:
    # Negative path: a disk with a partition table and no filesystem must be
    # refused, not reformatted. Tagged so the idempotence replay does not
    # re-fire the guard and record a second junit failure for it.
    - name: Run the role against a blank-but-partitioned disk
      tags: [molecule-idempotence-notest]
      block:
        - name: Include the role for the partition-table guard
          ansible.builtin.include_role:
            name: weisssrv.infra.zvol_mount
          vars:
            zvol_mount_disks:
              - name: pt-guard
                mount_point: /mnt/pt-guard
                fstype: ext4
                scsi_slot: 9

        - name: Record that the role accepted the partitioned disk
          ansible.builtin.set_fact:
            zvol_mount_pt_guard_refused: false
      rescue:
        - name: Record that the partition-table guard refused
          ansible.builtin.set_fact:
            zvol_mount_pt_guard_refused: true

    # Same tag: the replay skips the block above, so the marker fact it sets
    # would be undefined here.
    - name: Assert the partition-table guard refused the disk
      tags: [molecule-idempotence-notest]
      ansible.builtin.assert:
        that:
          - zvol_mount_pt_guard_refused
        fail_msg: >-
          zvol_mount accepted a disk carrying only a partition table; the PTTYPE
          guard regressed and the next converge would reformat it.
