---
# No real SCSI in Docker: a loop device plus a symlink at the by-id path
# (/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi<slot>) stands in for each zvol.
- name: Prepare
  hosts: all
  gather_facts: false
  vars:
    # Slot 1 is the managed disk; 9-12 back the converge negative cases.
    zvol_mount_test_disks:
      - {img: /tmp/test-disk.img, size: 64M, link: scsi-0QEMU_QEMU_HARDDISK_drive-scsi1}
      - {img: /tmp/test-disk-pt.img, size: 64M, link: scsi-0QEMU_QEMU_HARDDISK_drive-scsi9}
      - {img: /tmp/test-disk-xfs.img, size: 320M, link: scsi-0QEMU_QEMU_HARDDISK_drive-scsi10}
      - {img: /tmp/test-disk-dup-a.img, size: 64M, link: scsi-0QEMU_QEMU_HARDDISK_drive-scsi11}
      - {img: /tmp/test-disk-dup-b.img, size: 64M, link: scsi-0QEMU_QEMU_HARDDISK_drive-scsi12}
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    - name: Gather facts
      ansible.builtin.setup:

    # sfdisk ships in fdisk, not util-linux, on Debian 13.
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - e2fsprogs
          - fdisk
          - util-linux
          - xfsprogs
        state: present
        update_cache: true

    # The disk the role manages, then one disk per negative case. Sparse files:
    # mkfs.xfs refuses a filesystem under 300 MB.
    - name: Create test disk images
      ansible.builtin.command: "truncate -s {{ item.size }} {{ item.img }}"
      args:
        creates: "{{ item.img }}"
      loop: "{{ zvol_mount_test_disks }}"
      loop_control:
        label: "{{ item.img }}"

    - name: Attach the test disk images to loop devices
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/attach-loop.yml
      vars:
        molecule_loop_images: "{{ zvol_mount_test_disks | map(attribute='img') | list }}"

    - name: Create /dev/disk/by-id directory
      ansible.builtin.file:
        path: /dev/disk/by-id
        state: directory
        mode: "0755"

    - name: Create symlinks simulating SCSI device paths
      ansible.builtin.file:
        src: "{{ item.1.stdout | trim }}"
        dest: "/dev/disk/by-id/{{ item.0.link }}"
        state: link
        force: true
      loop: "{{ zvol_mount_test_disks | zip(molecule_loop_devices.results) | list }}"
      loop_control:
        label: "{{ item.0.link }}"

    # Blank disk carrying only a GPT label: FSTYPE is empty, PTTYPE is not.
    - name: Write a partition table with no filesystem on the guard disk
      ansible.builtin.shell: |
        set -euo pipefail
        dev=/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi9
        if [ -n "$(lsblk -dno PTTYPE "$dev")" ]; then
          printf 'already-labelled'
          exit 0
        fi
        printf 'label: gpt\n' | sfdisk --no-reread --no-tell-kernel "$dev" >/dev/null
        # lsblk reads PTTYPE from the udev db, so the new label has to be
        # processed before the role probes the disk.
        udevadm trigger --settle --action=change "$dev"
        printf 'labelled'
      args:
        executable: /bin/bash
      register: zvol_mount_pt_guard_label
      changed_when: zvol_mount_pt_guard_label.stdout | trim == 'labelled'

    - name: Read the staged guard disk
      ansible.builtin.command: lsblk -dno FSTYPE,PTTYPE /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi9
      register: zvol_mount_pt_guard_probe
      changed_when: false

    # The converge negative case is only negative while this holds, so stage
    # failures fail here instead of reading as a regressed guard.
    - name: Assert the guard disk carries a partition table and no filesystem
      ansible.builtin.assert:
        that:
          - zvol_mount_pt_guard_probe.stdout | trim == 'gpt'
        fail_msg: >-
          The guard disk reads FSTYPE/PTTYPE
          '{{ zvol_mount_pt_guard_probe.stdout | trim }}' instead of an empty
          FSTYPE with a gpt PTTYPE, so the role would not meet a
          blank-but-partitioned disk.
        quiet: true

    # The fstype guard meets a disk already holding xfs where ext4 is expected.
    - name: Format the fstype guard disk as xfs
      ansible.builtin.shell: |
        set -euo pipefail
        dev=/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi10
        if [ "$(blkid -p -s TYPE -o value "$dev" || true)" = xfs ]; then
          printf 'already-formatted'
          exit 0
        fi
        mkfs.xfs -f -q "$dev"
        udevadm trigger --settle --action=change "$dev"
        printf 'formatted'
      args:
        executable: /bin/bash
      register: zvol_mount_fstype_guard_format
      changed_when: zvol_mount_fstype_guard_format.stdout | trim == 'formatted'

    # Two ext4 disks carrying one UUID, as a zvol clone of a formatted disk does.
    - name: Format the duplicate-UUID guard disks with one shared UUID
      ansible.builtin.shell: |
        set -euo pipefail
        a=/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi11
        b=/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi12
        ua=$(blkid -p -s UUID -o value "$a" || true)
        ub=$(blkid -p -s UUID -o value "$b" || true)
        if [ -n "$ua" ] && [ "$ua" = "$ub" ]; then
          printf 'already-formatted'
          exit 0
        fi
        mkfs.ext4 -F -q "$a"
        ua=$(blkid -p -s UUID -o value "$a")
        mkfs.ext4 -F -q -U "$ua" "$b"
        udevadm trigger --settle --action=change "$a" "$b"
        printf 'formatted'
      args:
        executable: /bin/bash
      register: zvol_mount_uuid_guard_format
      changed_when: zvol_mount_uuid_guard_format.stdout | trim == 'formatted'

    - name: Read the staged fstype and duplicate-UUID guard disks
      ansible.builtin.shell: |
        set -euo pipefail
        for slot in 10 11 12; do
          dev=/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi$slot
          printf '%s %s\n' "$(lsblk -dno FSTYPE "$dev")" "$(blkid -p -s UUID -o value "$dev")"
        done
      args:
        executable: /bin/bash
      register: zvol_mount_guard_disks_probe
      changed_when: false

    # Same reason as the partition-table check: a staging failure must fail
    # here, not read as a regressed guard in converge.
    - name: Assert the fstype and duplicate-UUID guard disks are staged
      vars:
        zvol_mount_staged: "{{ zvol_mount_guard_disks_probe.stdout_lines | map('split') | list }}"
      ansible.builtin.assert:
        that:
          - zvol_mount_staged | length == 3
          - zvol_mount_staged[0][0] == 'xfs'
          - zvol_mount_staged[1][0] == 'ext4'
          - zvol_mount_staged[2][0] == 'ext4'
          - zvol_mount_staged[1][1] == zvol_mount_staged[2][1]
        fail_msg: >-
          The guard disks read {{ zvol_mount_guard_disks_probe.stdout_lines }}
          instead of xfs on slot 10 and one shared ext4 UUID on slots 11 and 12.
        quiet: true
