---
- name: Converge
  hosts: all
  become: true
  roles:
    - role: weisssrv.infra.zfs_encryption

  post_tasks:
    # Branch coverage for the secrets-backend seam. The default (1Password
    # Connect) script is asserted on the deployed copy; this side render covers
    # the zfs_encryption_key_command one without swapping the live unlock
    # script. The role template lives outside the scenario dir, so the relative
    # src is deliberate.
    - name: Render the unlock script with a key command  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/zfs-load-key.sh.j2"
        dest: /tmp/zfs-load-key-keycmd.sh
        mode: "0750"
      vars:
        zfs_encryption_key_command: >-
          printf '%s' "passphrase-for-$ZFS_ENCRYPTION_POOL"
