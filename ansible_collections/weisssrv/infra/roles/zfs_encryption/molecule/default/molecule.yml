---
platforms:
  - name: zfs-encryption-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        internal_domain: test.local
        zfs_encryption_connect_token: fake-test-token-must-be-non-empty
        zfs_encryption_pools:
          - name: testpool
            item: ZFS Pool testpool Passphrase
        # Exercise the guest-start half: the unit must be ENABLED (not just
        # deployed) and the script must render the cohort.
        zfs_encryption_guest_vmids: [999]
        zfs_encryption_install_zfsutils: false
        # Short deadlines so verify.yml can execute the rendered unlock script
        # through its timeout paths (exit 2 / exit 5) in seconds, not minutes.
        zfs_encryption_fetch_timeout_seconds: 3
        zfs_encryption_fetch_retry_seconds: 1
