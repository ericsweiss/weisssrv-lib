---
# Deploys the boot-time ZFS key-fetch mechanism. Idempotent; safe to
# re-run. Behaves as a no-op (script + unit template only) for hosts
# without zfs_encryption_pools set.

# Splits the package install into two tasks so the molecule test image
# (which doesn't carry the contrib repo where zfsutils-linux lives) can
# skip the zfs-specific package while still exercising the curl/jq path.
# On real Proxmox hosts both run; the role's later `zfs get` calls would
# fail if zfsutils-linux were truly missing, so this only relaxes the
# CI-side install — not the operational contract.
- name: Ensure base script dependencies are present
  ansible.builtin.apt:
    name:
      - curl
      - jq
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure zfsutils-linux is present
  ansible.builtin.apt:
    name: zfsutils-linux
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - zfs_encryption_install_zfsutils | default(true)

# Fail loudly when the operator forgets `op run --` on a host that has
# pools to unlock. Without the token the per-pool services silently exit
# 1 at boot with a misleading "missing token file"; this assert
# short-circuits with a clear pointer.
- name: Validate the Connect access point is set
  ansible.builtin.assert:
    that: zfs_encryption_connect_url | default('') | length > 0
    fail_msg: >-
      zfs_encryption_connect_url is empty — set it, or set
      zfs_encryption_internal_domain (alias: internal_domain) that it derives
      from. Without it every per-pool unlock unit curls an empty URL forever.
  when: zfs_encryption_pools | default([]) | length > 0

- name: Validate Connect token is present
  ansible.builtin.assert:
    that: zfs_encryption_connect_token | length > 0
    fail_msg: >-
      zfs_encryption_connect_token is empty. Run with `op run -- env
      ZFS_ENCRYPTION_CONNECT_TOKEN="$(op read 'op://Homelab/ZFS Encryption Connect Token/credential')"
      ansible-playbook ...`.
  when: zfs_encryption_pools | default([]) | length > 0

# Connect token deploy is gated on zfs_encryption_pools — there's no point
# placing a Connect token on a host that's never going to load a key
# (compute hosts in our cluster: local-ssd is intentionally unencrypted),
# and gating reduces blast radius if a compute host is ever compromised.
- name: Ensure /etc/onepassword-connect directory exists
  ansible.builtin.file:
    path: /etc/onepassword-connect
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: zfs_encryption_pools | default([]) | length > 0

- name: Deploy 1Password Connect access token
  ansible.builtin.copy:
    dest: /etc/onepassword-connect/token
    content: "{{ zfs_encryption_connect_token }}\n"
    owner: root
    group: root
    mode: "0400"
  when:
    - zfs_encryption_connect_token | length > 0
    - zfs_encryption_pools | default([]) | length > 0
  no_log: true

# Cleanup on hosts that previously had the token deployed but no longer
# should (e.g. host removed from zfs_encryption_pools). Fail-closed:
# the token is removed on any host whose zfs_encryption_pools is empty,
# since zfs_encryption is now the sole deployer/consumer of
# /etc/onepassword-connect/token.
- name: Remove stale Connect token on non-encryption hosts
  ansible.builtin.file:
    path: /etc/onepassword-connect/token
    state: absent
  when:
    - zfs_encryption_pools | default([]) | length == 0

- name: Ensure /etc/zfs/encryption/pools directory exists
  ansible.builtin.file:
    path: /etc/zfs/encryption/pools
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy per-pool environment files
  ansible.builtin.copy:
    dest: "/etc/zfs/encryption/pools/{{ item.name }}.conf"
    # systemd EnvironmentFile format: KEY=VALUE per line. Values with
    # spaces work as long as they aren't shell-quoted (systemd parses
    # the line, doesn't run a shell on it).
    content: |
      ZFS_ENCRYPTION_ITEM={{ item.item }}
      ZFS_ENCRYPTION_FIELD={{ item.field | default('passphrase') }}
    owner: root
    group: root
    mode: "0400"
  loop: "{{ zfs_encryption_pools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy zfs-load-key script
  ansible.builtin.template:
    src: zfs-load-key.sh.j2
    dest: /usr/local/sbin/zfs-load-key.sh
    owner: root
    group: root
    mode: "0750"

- name: Deploy zfs-load-key@.service systemd template
  ansible.builtin.template:
    src: zfs-load-key@.service.j2
    dest: /etc/systemd/system/zfs-load-key@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# Late, retrying pass that mounts the encrypted datasets once their keys are
# loaded — the single anchor nfsd + encrypted-storage guests order After=.
# (See the template header for why this is separate from the early stock
# zfs-mount.service.)
- name: Deploy zfs-mount-encrypted mount script
  ansible.builtin.template:
    src: zfs-mount-encrypted.sh.j2
    dest: /usr/local/sbin/zfs-mount-encrypted.sh
    owner: root
    group: root
    mode: "0750"

- name: Deploy zfs-mount-encrypted.service systemd unit
  ansible.builtin.template:
    src: zfs-mount-encrypted.service.j2
    dest: /etc/systemd/system/zfs-mount-encrypted.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# Starts the encrypted-storage guest cohort after the mount anchor is active.
# Script + unit are deployed on every Proxmox host (no-op when the guest
# lists are empty); the unit is only ENABLED below where a cohort exists.
- name: Deploy encrypted-storage guest-start script
  ansible.builtin.template:
    src: zfs-start-encrypted-guests.sh.j2
    dest: /usr/local/sbin/zfs-start-encrypted-guests.sh
    owner: root
    group: root
    mode: "0750"

- name: Deploy pve-start-encrypted-guests.service systemd unit
  ansible.builtin.template:
    src: pve-start-encrypted-guests.service.j2
    dest: /etc/systemd/system/pve-start-encrypted-guests.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Apply pending systemd reloads
  ansible.builtin.meta: flush_handlers

# Footgun guard: a listed pool that isn't actually encrypted would leave
# zfs-load-key@<pool>.service failing forever at every boot, so
# zfs-mount-encrypted.service never converges and its dependents (nfsd, the
# gated guests) stay queued. Fail the play up front instead.
#
# The check must be recursive: the encryption root may be the pool itself OR a
# child dataset (in which case the pool reports 'off'). A pool is acceptable iff
# at least one dataset under it has encryption != 'off' (and != '-', which is
# what snapshots report).
- name: Discover any encrypted dataset under each listed pool
  # awk deliberately reads ALL of stdin (never `exit`s early) because this runs
  # under `set -o pipefail`: any early-exit form (`head -n1`, `awk ... exit`)
  # races SIGPIPE — the producer's next write trips EPIPE, the pipeline returns
  # 141, and the `item.rc == 0` assert below misfires "pool has no encrypted
  # datasets" on a pool that has them. Scanning every dataset name costs
  # microseconds at any realistic pool size.
  ansible.builtin.shell: |
    set -o pipefail
    zfs get -r -H -o value encryption {{ item.name }} \
      | awk '$0 != "off" && $0 != "-" && !found { found = 1; print }'
  args:
    executable: /bin/bash
  register: zfs_encryption_pool_states
  changed_when: false
  failed_when: false
  # Read-only probe — must run under --check too, or the registered results
  # carry no rc and the assert below errors instead of validating.
  check_mode: false
  loop: "{{ zfs_encryption_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - zfs_encryption_pools | length > 0
    # Skip when ZFS isn't installed (molecule test image runs without
    # contrib repo / zfsutils-linux). The role's `zfs get` command would
    # fail and the assert would fire on a host that has no business
    # validating ZFS state in the first place.
    - zfs_encryption_install_zfsutils | default(true)

- name: Assert each listed pool has at least one encrypted dataset
  ansible.builtin.assert:
    that:
      # rc == 0 (pool exists) AND stdout is non-empty (some descendant
      # encryption root was found). rc != 0 means `zfs get` itself
      # failed — usually a non-existent pool name in inventory.
      - item.rc == 0
      - item.stdout | length > 0
    fail_msg: >-
      Pool '{{ item.item.name }}' has no encrypted datasets
      (recursive `zfs get encryption` returns only 'off' / '-';
      zfs get rc={{ item.rc | default('unknown') }}). Activating
      zfs-load-key@{{ item.item.name }}.service on a fully plaintext
      pool would fail forever at boot ('Key must be loaded'), so
      zfs-mount-encrypted.service would never reach active and the
      encrypted-storage guests/nfsd ordered after it would never start
      (boot itself is unaffected — these are off the critical path).
      Encrypt at least one dataset in the pool
      first, OR leave zfs_encryption_pools empty for
      {{ inventory_hostname }} until the pool is encrypted (deploys the
      mechanism without activating units), OR remove
      {{ item.item.name }} from zfs_encryption_pools in
      host_vars/{{ inventory_hostname }}.yml.
  loop: "{{ zfs_encryption_pool_states.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - zfs_encryption_pools | length > 0
    - zfs_encryption_install_zfsutils | default(true)

# Unconditional migration sweep (every host, every run — NOT gated on
# zfs_encryption_pools): remove the old
# zfs-mount.service.requires/zfs-load-key@*.service symlinks. `systemctl
# disable` only removes the CURRENT WantedBy link, so a lingering requires-link
# would fail zfs-mount.service (Before=local-fs.target) at next boot and hang
# the very boot path this ordering exists to free.
#
# It MUST run BEFORE the per-pool enable below: while the old symlink exists
# `systemctl is-enabled` reports "enabled", so the enable no-ops and the new
# .wants link is never created.
- name: Find stale zfs-load-key symlinks in the old zfs-mount.service.requires dir
  ansible.builtin.find:
    paths: /etc/systemd/system/zfs-mount.service.requires
    patterns: "zfs-load-key@*.service"
    file_type: link
  register: zfs_encryption_old_required_links
  changed_when: false
  failed_when: false   # directory absent on a clean/new host — fine

- name: Remove stale zfs-load-key RequiredBy symlinks (old early-boot fatal edge)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ zfs_encryption_old_required_links.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Reload systemd after sweeping stale requires-symlinks
  ansible.builtin.systemd:
    daemon_reload: true

# Enable the late mount anchor first: zfs-load-key@<pool> is now
# WantedBy=zfs-mount-encrypted.service, so the anchor must exist + be enabled
# (WantedBy=multi-user.target) for the per-pool .wants symlinks to be pulled
# into the boot transaction.
- name: Enable zfs-mount-encrypted.service (late encrypted-dataset mount anchor)
  ansible.builtin.systemd:
    name: zfs-mount-encrypted.service
    enabled: true
    daemon_reload: true
  when: zfs_encryption_pools | length > 0

- name: Disable zfs-mount-encrypted.service on hosts with no encrypted pools
  ansible.builtin.systemd:
    name: zfs-mount-encrypted.service
    enabled: false
  failed_when: false
  when: zfs_encryption_pools | length == 0

- name: Enable per-pool zfs-load-key services
  ansible.builtin.systemd:
    name: "zfs-load-key@{{ item.name }}.service"
    enabled: true
    daemon_reload: true
  loop: "{{ zfs_encryption_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when: zfs_encryption_pools | length > 0

- name: Enable pve-start-encrypted-guests.service (host has encrypted-storage guests)
  ansible.builtin.systemd:
    name: pve-start-encrypted-guests.service
    enabled: true
    daemon_reload: true
  when: (zfs_encryption_guest_vmids | length > 0) or (zfs_encryption_guest_ctids | length > 0)

- name: Disable pve-start-encrypted-guests.service where no such guests exist
  ansible.builtin.systemd:
    name: pve-start-encrypted-guests.service
    enabled: false
  failed_when: false
  when:
    - zfs_encryption_guest_vmids | length == 0
    - zfs_encryption_guest_ctids | length == 0

# Reconcile stale unit instances + env files. If the operator removes a
# pool from zfs_encryption_pools (or renames it), the previously-deployed
# /etc/zfs/encryption/pools/<old>.conf and the
# /etc/systemd/system/zfs-mount-encrypted.service.wants/zfs-load-key@<old>.service
# symlink would otherwise linger — at next boot the orphan unit would try to
# fetch a passphrase for a pool no longer in the inventory and fail. Because
# the unit is now WantedBy (best-effort), that failure is contained (it no
# longer drags a mount down), but we still clean it up for hygiene.
#
# We list both directories and remove anything not in the desired set.
# Idempotent: when the desired set matches what's on disk this is a no-op.

- name: Enumerate deployed pool env files
  ansible.builtin.find:
    paths: /etc/zfs/encryption/pools
    patterns: "*.conf"
    file_type: file
  register: zfs_encryption_pool_files_present
  changed_when: false

- name: Remove stale pool env files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ zfs_encryption_pool_files_present.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | regex_replace('\\.conf$', '')) not in (zfs_encryption_pools | map(attribute='name') | list)

- name: Enumerate enabled per-pool unit symlinks
  ansible.builtin.find:
    paths: /etc/systemd/system/zfs-mount-encrypted.service.wants
    patterns: "zfs-load-key@*.service"
    file_type: link
  register: zfs_encryption_unit_links_present
  changed_when: false
  failed_when: false   # directory may not exist if no pool was ever enabled

- name: Disable stale per-pool zfs-load-key services
  ansible.builtin.systemd:
    name: "{{ item.path | basename }}"
    enabled: false
  loop: "{{ zfs_encryption_unit_links_present.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  vars:
    # Extract `<pool>` from `zfs-load-key@<pool>.service` so we can test
    # membership against the desired set without overflowing the line-
    # length limit in the `when:` expression itself.
    _pool_name: >-
      {{ item.path | basename
         | regex_replace('^zfs-load-key@', '')
         | regex_replace('\.service$', '') }}
    _desired_pools: "{{ zfs_encryption_pools | map(attribute='name') | list }}"
  when:
    - _pool_name not in _desired_pools
