---
# Boot-time unlock of ZFS-native encrypted pools on bare-metal Proxmox hosts,
# fetching each pool's passphrase from a 1Password Connect instance. If Connect
# is unreachable the per-pool units retry forever; the operator fallback is
# `sudo zfs load-key <pool>` (README "Cold-cluster boot").

# Must be reachable at boot, before any encrypted pool is mounted. Derived from
# the inventory-wide `internal_domain` alias; set the URL directly to decouple.
zfs_encryption_internal_domain: "{{ internal_domain | default('') }}"
zfs_encryption_connect_url: "{{ ('https://connect.' ~ zfs_encryption_internal_domain) if zfs_encryption_internal_domain else '' }}"

# The token can read this WHOLE vault, so point it at one holding only the
# passphrases — README "Scoping the Connect token" for the re-scope ordering.
zfs_encryption_connect_vault: "Homelab"

# Connect access token, injected by the caller from 1Password (preferably a
# group_vars op:// reference run through `op run --`). Required on any host with
# a non-empty zfs_encryption_pools.
zfs_encryption_connect_token: ""

# Deployed 0400 root (parent dir 0700) and piped to curl on stdin.
zfs_encryption_token_path: /etc/onepassword-connect/token

# Secrets-backend seam. Empty = 1Password Connect. Set to a command PRINTING the
# passphrase on stdout for any other backend; the Connect code is then not
# rendered at all. Contract + exit mapping: README "Using a secrets backend".
zfs_encryption_key_command: ""

# Item shape: {name, item, field}. Empty = deploy the script + unit template
# only (no token, no anchor, no per-pool services). Anything left out of this
# list is unencrypted at rest — README "Threat model".
zfs_encryption_pools: []

# Proxmox guests (on THIS host) whose disks live on an encrypted pool and must
# start only AFTER zfs-mount-encrypted.service mounted it; they should carry
# onboot=0. Leave out any guest that must start early on its normal onboot
# path (README "Guest cohort"). Empty = the start unit is not enabled.
zfs_encryption_guest_vmids: []
zfs_encryption_guest_ctids: []

# Budget for ONE invocation; systemd's Restart=on-failure retries on top.
zfs_encryption_fetch_timeout_seconds: 120

# Sleep between Connect retries within a single fetch attempt.
zfs_encryption_fetch_retry_seconds: 5

# Install zfsutils-linux. Set false only for a CI image without it: that also
# skips the "every listed pool has an encrypted dataset" probe, which needs
# a working `zfs` binary.
zfs_encryption_install_zfsutils: true
