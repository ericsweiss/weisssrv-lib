---
# Scenario overrides; the rest comes from molecule-shared/base.yml.
platforms:
  - name: home-assistant-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /run/lock
provisioner:
  env:
    HA_OIDC_CLIENT_ID: test-oidc-client-id
    HA_OIDC_CLIENT_SECRET: test-oidc-client-secret
  inventory:
    group_vars:
      all:
        # Converge renders only; verify.yml drives the deploy/rollback paths
        # itself through local ssh/scp/ha shims.
        home_assistant_render_only: true
        # Pinned so verify.yml can assert on stable /tmp/ha-*.yaml paths
        # (production uses a private per-run tempdir).
        home_assistant_staging_dir: /tmp
        home_assistant_ssl_enabled: true
        home_assistant_oidc_configure_url: >-
          https://auth.example.com/application/o/home/.well-known/openid-configuration
        home_assistant_trusted_proxies:
          - 192.168.0.0/24
          - 10.42.0.0/16
          - 10.43.0.0/16
