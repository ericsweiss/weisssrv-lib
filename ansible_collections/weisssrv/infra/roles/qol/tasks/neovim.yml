---
# Neovim setup with Vundle

- name: Create neovim config directory
  ansible.builtin.file:
    path: "{{ qol_admin_home_resolved }}/.config/nvim"
    state: directory
    owner: "{{ qol_admin_user }}"
    group: "{{ qol_admin_user }}"
    mode: "0755"
  when: qol_admin_user != 'root'

- name: Create vim bundle directory for Vundle
  ansible.builtin.file:
    path: "{{ qol_admin_home_resolved }}/.vim/bundle"
    state: directory
    owner: "{{ qol_admin_user }}"
    group: "{{ qol_admin_user }}"
    mode: "0755"
  when: qol_admin_user != 'root'

- name: Clone Vundle plugin manager
  ansible.builtin.git:
    repo: https://github.com/VundleVim/Vundle.vim.git
    dest: "{{ qol_admin_home_resolved }}/.vim/bundle/Vundle.vim"
    version: "{{ qol_vundle_version }}"
    depth: 1
  become: true
  become_user: "{{ qol_admin_user }}"
  when: qol_admin_user != 'root'
  # GitHub git fetches intermittently reset from CI runners — retry before failing.
  register: qol_vundle_clone
  until: qol_vundle_clone is succeeded
  retries: 3
  delay: 5

- name: Deploy neovim init.vim configuration
  ansible.builtin.template:
    src: init.vim.j2
    dest: "{{ qol_admin_home_resolved }}/.config/nvim/init.vim"
    owner: "{{ qol_admin_user }}"
    group: "{{ qol_admin_user }}"
    mode: "0644"
  when: qol_admin_user != 'root'

# CRITICAL: Vundle clones the plugins itself and reports a failed clone only in
# its own buffer — nvim exits 0 with an empty bundle dir. Without the read-back
# below, one blip writes the marker and the `creates:` guard then skips the
# install forever, leaving a host that looks converged with no plugins.
# Vundle names each directory after the repo, minus any `.git` suffix.
- name: Install Vundle plugins
  ansible.builtin.shell:
    cmd: |
      set -eu
      nvim --headless +PluginInstall +qall
      for plugin in {{ qol_nvim_plugins | default([]) | map('regex_replace', '^.*/', '') | map('regex_replace', '[.]git$', '') | map('quote') | join(' ') }}; do
        test -d {{ qol_admin_home_resolved | quote }}/.vim/bundle/"$plugin" || {
          echo "PluginInstall left no .vim/bundle/$plugin — the clone failed" >&2
          exit 1
        }
      done
    # Sentinel keyed to the sha1 of the plugin LIST, not a fixed filename, so
    # editing qol_nvim_plugins re-runs PluginInstall instead of silently no-op'ing.
    # join(',') not '\n' — YAML would turn \n into a real newline here.
    creates: "{{ qol_admin_home_resolved }}/.vim/bundle/.vundle-installed-{{ (qol_nvim_plugins | default([]) | join(',')) | hash('sha1') }}"
  # A repo Vundle cannot read makes git ask for a username; with no terminal to
  # ask, the clone must fail rather than wait.
  environment:
    GIT_TERMINAL_PROMPT: "0"
  become: true
  become_user: "{{ qol_admin_user }}"
  register: qol_vundle_install
  # GitHub clones intermittently reset from CI runners — retry before failing.
  until: qol_vundle_install is succeeded
  retries: 3
  delay: 5
  when: qol_admin_user != 'root'

# Written only once the read-back above found every plugin, so the `creates:`
# guard skips the install until the plugin list changes (new hash → new marker).
- name: Mark Vundle plugins as installed (marker keyed to the plugin-list hash)
  ansible.builtin.copy:
    content: >-
      Vundle plugins installed by the qol role for plugin-list hash
      {{ (qol_nvim_plugins | default([]) | join(',')) | hash('sha1') }}.
      Delete this marker to force a reinstall.
    dest: "{{ qol_admin_home_resolved }}/.vim/bundle/.vundle-installed-{{ (qol_nvim_plugins | default([]) | join(',')) | hash('sha1') }}"
    owner: "{{ qol_admin_user }}"
    group: "{{ qol_admin_user }}"
    mode: "0644"
  when:
    - qol_admin_user != 'root'
    - qol_vundle_install is changed
