---
# QoL role: zsh, oh-my-zsh, neovim, vundle for admin user

- name: Install QoL packages
  ansible.builtin.apt:
    name: "{{ qol_packages }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"

# The user module is idempotent (reports changed only when the shell actually
# changes), so set it unconditionally rather than guarding on a getent lookup —
# the prior `== '/bin/zsh'` guard never matched when zsh resolved to
# /usr/bin/zsh and re-ran the task every play. Skip when qol_admin_user is root:
# the rest of the role's user-scoped tasks already guard on this, and the
# oh-my-zsh/.zshrc/init.vim config that makes the zsh shell useful is only
# deployed for non-root, so flipping root's login shell to zsh would leave it
# unconfigured.
- name: Set zsh as default shell for admin user
  ansible.builtin.user:
    name: "{{ qol_admin_user }}"
    shell: /bin/zsh
  when: qol_admin_user != 'root'

# Cloning the framework directly (instead of running tools/install.sh, which
# clones master HEAD) is what actually pins Oh My Zsh to qol_omz_commit. The
# installer's other steps are covered by the role itself: .zshrc is templated
# below and the login shell is set above.
- name: Check for a legacy shallow Oh My Zsh clone
  ansible.builtin.stat:
    path: "/home/{{ qol_admin_user }}/.oh-my-zsh/.git/shallow"
  register: qol_omz_shallow
  when: qol_admin_user != 'root'

# install.sh cloned with --depth=1, so the pinned commit may not be fetchable
# in place; re-clone once.
- name: Remove legacy shallow Oh My Zsh clone
  ansible.builtin.file:
    path: "/home/{{ qol_admin_user }}/.oh-my-zsh"
    state: absent
  when:
    - qol_admin_user != 'root'
    - qol_omz_shallow.stat.exists | default(false)

# Short-circuit the network on converged hosts: only clone/fetch when the repo
# is missing (empty stdout) or not at the pin. Keeps qol offline-safe after
# first install; a pin bump (HEAD != qol_omz_commit) re-triggers the fetch+checkout.
- name: Record current Oh My Zsh commit  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "git -C /home/{{ qol_admin_user }}/.oh-my-zsh rev-parse HEAD"
  register: qol_omz_head
  changed_when: false
  failed_when: false
  when: qol_admin_user != 'root'

- name: Install Oh My Zsh at the pinned commit
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "/home/{{ qol_admin_user }}/.oh-my-zsh"
    version: "{{ qol_omz_commit }}"
  become: true
  become_user: "{{ qol_admin_user }}"
  when:
    - qol_admin_user != 'root'
    - (qol_omz_head.stdout | default('')) != qol_omz_commit
  # GitHub git fetches intermittently reset from CI runners — retry before failing.
  register: qol_omz_clone
  until: qol_omz_clone is succeeded
  retries: 3
  delay: 5

- name: Deploy .zshrc configuration
  ansible.builtin.template:
    src: zshrc.j2
    dest: "/home/{{ qol_admin_user }}/.zshrc"
    owner: "{{ qol_admin_user }}"
    group: "{{ qol_admin_user }}"
    mode: "0644"
  when: qol_admin_user != 'root'

- name: Deploy .zprofile configuration
  ansible.builtin.copy:
    content: |
      export PATH="$HOME/.local/bin:$PATH"
    dest: "/home/{{ qol_admin_user }}/.zprofile"
    owner: "{{ qol_admin_user }}"
    group: "{{ qol_admin_user }}"
    mode: "0644"
  when: qol_admin_user != 'root'

- name: Deploy .alias.zsh configuration
  ansible.builtin.template:
    src: alias.zsh.j2
    dest: "/home/{{ qol_admin_user }}/.alias.zsh"
    owner: "{{ qol_admin_user }}"
    group: "{{ qol_admin_user }}"
    mode: "0644"
  when: qol_admin_user != 'root'

- name: Deploy .local.zsh configuration
  ansible.builtin.copy:
    content: |
      # Local environment overrides (not tracked in git)
    dest: "/home/{{ qol_admin_user }}/.local.zsh"
    owner: "{{ qol_admin_user }}"
    group: "{{ qol_admin_user }}"
    mode: "0644"
    force: false
  when: qol_admin_user != 'root'

- name: Include neovim setup tasks
  ansible.builtin.include_tasks: neovim.yml
