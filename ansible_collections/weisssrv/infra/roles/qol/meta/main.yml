galaxy_info:
  role_name: qol
  namespace: weisssrv
  author: Eric Weiss
  description: Quality of life shell and editor enhancements (zsh, Oh My Zsh, Neovim)
  license: MIT
  min_ansible_version: "2.18"
  platforms:
    - name: Debian
      versions:
        - trixie

# No meta dependency: running dotfiles must not pull in SSH hardening, fail2ban
# and resolv.conf management. `qol_admin_user` aliases the inventory-wide
# `admin_user`, which is what keeps this role and `base` on the same account.
dependencies: []
