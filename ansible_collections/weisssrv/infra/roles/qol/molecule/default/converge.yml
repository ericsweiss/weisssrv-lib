---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - sudo
          - curl
          - git
        state: present
      when: ansible_os_family == "Debian"

    - name: Check if test user exists
      ansible.builtin.getent:
        database: passwd
        key: testuser
      register: testuser_check
      failed_when: false

    - name: Create test user
      ansible.builtin.user:
        name: testuser
        state: present
        create_home: true
      when: testuser_check.ansible_facts.getent_passwd is not defined or testuser_check.ansible_facts.getent_passwd.testuser is not defined

  roles:
    - role: weisssrv.infra.qol
