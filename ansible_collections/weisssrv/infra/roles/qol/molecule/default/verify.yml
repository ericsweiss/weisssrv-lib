---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if qol packages are installed
      ansible.builtin.command: dpkg -l {{ item }}
      register: package_check
      changed_when: false
      failed_when: package_check.rc != 0
      loop:
        - zsh
        - neovim
        - fzf
        - ripgrep
        - htop
        - tmux

    - name: Check if Oh My Zsh is installed for testuser
      ansible.builtin.stat:
        path: /home/testuser/.oh-my-zsh
      register: omz_dir
      failed_when: not omz_dir.stat.exists or not omz_dir.stat.isdir

    - name: Check if .zshrc exists
      ansible.builtin.stat:
        path: /home/testuser/.zshrc
      register: zshrc_file
      failed_when: not zshrc_file.stat.exists

    - name: Read .zshrc content
      ansible.builtin.slurp:
        src: /home/testuser/.zshrc
      register: zshrc_content

    - name: Decode .zshrc content
      ansible.builtin.set_fact:
        zshrc_text: "{{ zshrc_content.content | b64decode }}"

    - name: Verify .zshrc has Oh My Zsh config
      ansible.builtin.assert:
        that:
          - "'ZSH=' in zshrc_text"
          - "'plugins=' in zshrc_text"
        fail_msg: ".zshrc missing Oh My Zsh configuration"
        success_msg: ".zshrc has Oh My Zsh configuration"

    - name: Verify .zshrc has plugins array configured
      ansible.builtin.assert:
        that:
          - "'plugins=(' in zshrc_text"
          - "'git' in zshrc_text"
        fail_msg: ".zshrc missing plugins configuration"
        success_msg: ".zshrc has plugins array configured"

    - name: Verify expected plugins are listed in .zshrc
      ansible.builtin.assert:
        that:
          - "'sudo' in zshrc_text"
          - "'history' in zshrc_text"
          - "'fzf' in zshrc_text"
          - "'docker' in zshrc_text"
        fail_msg: ".zshrc missing expected plugins from molecule config"
        success_msg: ".zshrc has expected plugins from molecule config"

    - name: Check Oh My Zsh plugins directory exists
      ansible.builtin.stat:
        path: /home/testuser/.oh-my-zsh/plugins
      register: omz_plugins_dir
      failed_when: not omz_plugins_dir.stat.exists or not omz_plugins_dir.stat.isdir

    - name: Check git plugin exists (built-in OMZ plugin)
      ansible.builtin.stat:
        path: /home/testuser/.oh-my-zsh/plugins/git
      register: git_plugin
      failed_when: not git_plugin.stat.exists or not git_plugin.stat.isdir

    - name: Check if neovim config directory exists
      ansible.builtin.stat:
        path: /home/testuser/.config/nvim
      register: nvim_dir
      failed_when: not nvim_dir.stat.exists

    - name: Check if init.vim exists
      ansible.builtin.stat:
        path: /home/testuser/.config/nvim/init.vim
      register: init_vim
      failed_when: not init_vim.stat.exists

    - name: Read init.vim content
      ansible.builtin.slurp:
        src: /home/testuser/.config/nvim/init.vim
      register: init_vim_content

    - name: Verify init.vim has Vundle configuration
      ansible.builtin.assert:
        that:
          - "'Vundle' in (init_vim_content.content | b64decode)"
        fail_msg: "init.vim missing Vundle configuration"
        success_msg: "init.vim has Vundle configuration"

    - name: Check if Vundle is installed
      ansible.builtin.stat:
        path: /home/testuser/.vim/bundle/Vundle.vim
      register: vundle_dir
      failed_when: not vundle_dir.stat.exists

    - name: Verify Vundle is a git repository
      ansible.builtin.stat:
        path: /home/testuser/.vim/bundle/Vundle.vim/.git
      register: vundle_git
      failed_when: not vundle_git.stat.exists

    # The sentinel is named for the sha1 of the plugin list, so editing
    # qol_nvim_plugins re-runs PluginInstall instead of silently no-op'ing.
    - name: Check the PluginInstall sentinel is named for the plugin list
      ansible.builtin.stat:
        path: >-
          /home/testuser/.vim/bundle/.vundle-installed-{{
          (qol_nvim_plugins | join(',')) | hash('sha1') }}
      register: vundle_sentinel

    - name: Check the configured plugin was actually installed
      ansible.builtin.stat:
        path: /home/testuser/.vim/bundle/vim-fugitive
      register: vundle_plugin_dir

    - name: Verify PluginInstall ran and left its list-keyed sentinel
      ansible.builtin.assert:
        that:
          - vundle_sentinel.stat.exists
          - vundle_plugin_dir.stat.isdir | default(false)
        fail_msg: "PluginInstall did not install the configured plugin or write its sentinel"
        success_msg: "PluginInstall installed the configured plugin and wrote the list-keyed sentinel"

    - name: Check if shell is set to zsh for testuser
      ansible.builtin.command: getent passwd testuser
      register: testuser_passwd
      changed_when: false

    - name: Verify testuser shell is zsh
      ansible.builtin.assert:
        that:
          - "'/bin/zsh' in testuser_passwd.stdout or '/usr/bin/zsh' in testuser_passwd.stdout"
        fail_msg: "testuser shell is not zsh"
        success_msg: "testuser shell is correctly set to zsh"

    - name: Check Oh My Zsh directory ownership
      ansible.builtin.stat:
        path: /home/testuser/.oh-my-zsh
      register: omz_ownership

    - name: Assert Oh My Zsh directory has correct ownership
      ansible.builtin.assert:
        that:
          - omz_ownership.stat.pw_name == 'testuser'
        fail_msg: "Oh My Zsh directory has incorrect ownership"
        success_msg: "Oh My Zsh directory has correct ownership"

    - name: Stat the remaining shipped dotfiles
      ansible.builtin.stat:
        path: "/home/testuser/{{ item }}"
      register: qol_dotfiles
      loop:
        - .zprofile
        - .alias.zsh
        - .local.zsh

    - name: Assert every shipped dotfile was deployed
      ansible.builtin.assert:
        that:
          - qol_dotfiles.results | selectattr('stat.exists') | list | length == 3
        fail_msg: ".zprofile, .alias.zsh or .local.zsh was not deployed"
        success_msg: "All shipped dotfiles are present"

    - name: Read .local.zsh content
      ansible.builtin.slurp:
        src: /home/testuser/.local.zsh
      register: qol_local_zsh

    # converge seeds this line and then re-runs the role: force: false means the
    # second pass must leave the operator's edit alone.
    - name: Assert the re-run did not overwrite .local.zsh
      ansible.builtin.assert:
        that:
          - "'QOL_LOCAL_SENTINEL' in (qol_local_zsh.content | b64decode)"
          - "'Local environment overrides' in (qol_local_zsh.content | b64decode)"
        fail_msg: >-
          .local.zsh lost its local edit (or its shipped header) — the
          never-overwrite contract is broken.
        success_msg: ".local.zsh keeps local edits across runs"

# Separate play so the role's own defaults can be loaded without shadowing the
# scenario's group_vars: the pin is what keeps Oh My Zsh off master HEAD.
- name: Verify the Oh My Zsh pin
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - ../../defaults/main.yml
  tasks:
    - name: Read the checked-out Oh My Zsh commit  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: git -C /home/testuser/.oh-my-zsh rev-parse HEAD
      become: true
      become_user: testuser
      register: qol_omz_checked_out
      changed_when: false

    - name: Assert Oh My Zsh is checked out at the pinned commit
      ansible.builtin.assert:
        that:
          - (qol_omz_checked_out.stdout | trim) == qol_omz_commit
        fail_msg: >-
          .oh-my-zsh is at {{ qol_omz_checked_out.stdout | trim }}, not
          qol_omz_commit ({{ qol_omz_commit }}) — the pin is not being applied.
        success_msg: "Oh My Zsh is checked out at qol_omz_commit"
