---
# Cert authority host only: this role issues the wildcard cert with acme.sh and
# pushes it to every entry in acme_certs_distribution_targets. Leave it false
# everywhere else — the role is a no-op there.
acme_certs_enabled: false

# Required when enabled, asserted in tasks/main.yml: acme_certs_domain (the
# cert covers it and *.<domain>), acme_certs_email, and the distribution
# keypair acme_certs_ssh_private_key / acme_certs_ssh_public_key.
acme_certs_domain: ""
acme_certs_email: ""

# Pin acme.sh to a release tag (never the mutable get.acme.sh redirect); the
# full release tarball is what ships dnsapi/. Bump both values together:
# https://github.com/acmesh-official/acme.sh/releases
acme_certs_sh_version: "3.1.2"
acme_certs_sh_tarball_sha256: "a51511ad0e2912be45125cf189401e4ae776ca1a29d5768f020a1e35a9560186"

# acme.sh dnsapi hook for DNS-01. Any hook the pinned tarball ships works; the
# operator exports the provider credentials at issuance time.
acme_certs_dns_hook: dns_cf

# ACME CA acme.sh is pinned to at install time and re-asserted every run. Any
# name acme.sh accepts (letsencrypt, zerossl, google, buypass, or a CA directory
# URL); unset, acme.sh 3.x would default to ZeroSSL.
acme_certs_ca_server: letsencrypt

# Root-owned 0700 staging dir for the acme.sh tarball; removed after the
# install. Must not sit under a world-writable parent.
acme_certs_stage_dir: /run/acme-certs-install

acme_certs_local_cert_dir: /etc/ssl/private
acme_certs_local_cert_group: root

acme_certs_textfile_dir: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}"

# Command run after a LOCAL cert change (for a service on the authority host
# that consumes the cert). Empty omits the local-reload block entirely.
acme_certs_local_reload_command: ""

# Login user on the distribution targets (authorized_keys + sudoers) and owner
# of the distribution key here. Override acme_certs_ssh_key_dir if that user's
# home is not the conventional one.
acme_certs_ssh_user: root
acme_certs_ssh_key_dir: "{{ '/root/.ssh' if acme_certs_ssh_user == 'root' else '/home/' ~ acme_certs_ssh_user ~ '/.ssh' }}"
acme_certs_ssh_key_path: "{{ acme_certs_ssh_key_dir }}/id_ed25519_certs"

# Source-IP restriction (from="...") applied to the distribution key in each
# target's authorized_keys. Shrinks the blast radius if this root-equivalent key
# leaks; needs a stable source address. Empty disables the clause.
acme_certs_key_from: ""

# Seed each target with the receiver + sudoers rule + pinned key. False renders
# locally without reaching out to the targets (molecule does this).
acme_certs_distribute_pubkeys: true

acme_certs_skip_distribution: false

# Daily probe of every distribution target, so the per-target gauges move
# between renewals. It pushes nothing, reloads nothing and leaves
# cert_renewal_last_run_success alone.
acme_certs_distribution_check_enabled: true
acme_certs_distribution_check_schedule: "*-*-* 05:40:00"
acme_certs_distribution_check_random_delay: 30m
acme_certs_distribution_check_nice: 10
acme_certs_distribution_check_timeout: 10m
# Retries, and the seconds between them, for a check-mode probe that fails. The
# gauge it writes holds until the next daily run, so one SSH blip must not read
# as a dead target for a day. 0 retries restores a single probe.
acme_certs_distribution_check_retries: 2
acme_certs_distribution_check_retry_delay: 10

# Forced-command receiver installed on each sudo target; the pinned key can only
# run this (see the template header). ssh_no_sudo targets keep the legacy push
# path and are not seeded.
acme_certs_receiver_path: /usr/local/sbin/cert-receive

# Distribution targets (per-entry schema: README). host_key is REQUIRED on every
# entry — the push runs with StrictHostKeyChecking=yes, so the key must be
# pinned before the first push.
acme_certs_distribution_targets: []
