---
platforms:
  - name: acme-certs-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /run/lock
provisioner:
  inventory:
    group_vars:
      all:
        acme_certs_ssh_private_key: '-----BEGIN OPENSSH PRIVATE KEY-----

          b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW

          QyNTUxOQAAACBtb2NrLWtleS1mb3ItdGVzdGluZy1vbmx5LWRvbnQtdXNlAAAAUm1vY2st

          a2V5LWZvci10ZXN0aW5nLW9ubHktZG9udC11c2Vtb2NrLWtleS1mb3ItdGVzdGluZy1v

          bmx5LWRvbnQtdXNlAAAAC3Rlc3RAbW9sZWN1bGUBAgMEBQ==

          -----END OPENSSH PRIVATE KEY-----

          '
        acme_certs_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGtlc3Qtc3NoLWtleS1mb3ItbW9sZWN1bGUtdGVzdGluZw==
          test@molecule
        acme_certs_email: test@molecule.local
        acme_certs_enabled: true
        acme_certs_domain: test.local
        acme_certs_local_cert_dir: /opt/AdGuardHome/certs
        acme_certs_local_cert_group: root
        acme_certs_ssh_user: eric
        acme_certs_local_reload_command: systemctl restart AdGuardHome
        acme_certs_distribute_pubkeys: false
        acme_certs_distribution_targets:
          - host: dns-02
            ip: 10.0.0.160
            host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMOLECULEPLACEHOLDERKEYFOROFFLINETESTONLY
            cert_dir: /opt/AdGuardHome/certs
            owner: root
            group: adguard
            cert_mode: '0644'
            key_mode: '0640'
            restart_service: AdGuardHome
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible-${USER}/tmp
