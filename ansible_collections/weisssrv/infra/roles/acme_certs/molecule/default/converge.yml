---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - sudo
          - curl
          - openssl
        state: present
      when: ansible_os_family == "Debian"

    - name: Create eric user for SSH key deployment
      ansible.builtin.user:
        name: eric
        state: present
        create_home: true
        shell: /bin/bash

    - name: Create certificate directory
      ansible.builtin.file:
        path: /opt/AdGuardHome/certs
        state: directory
        owner: root
        group: root
        mode: "0755"

  roles:
    - role: weisssrv.infra.acme_certs
