---
- name: Validate the required acme.sh inputs
  ansible.builtin.assert:
    that:
      - acme_certs_ssh_private_key is defined
      - acme_certs_ssh_private_key | length > 0
      - acme_certs_ssh_public_key is defined
      - acme_certs_ssh_public_key | length > 0
      - acme_certs_email is defined
      - acme_certs_email | length > 0
      - acme_certs_domain is defined
      - acme_certs_domain | length > 0
    fail_msg: >-
      acme_certs_{domain,email,ssh_private_key,ssh_public_key} are all required
      on the cert authority host — the key pair signs the distribution pushes,
      so supply it from the site's secret store.
    success_msg: "Required acme.sh variables are present"
  when: acme_certs_enabled | bool
  # Not tags: always — a tag-limited run elsewhere must not trip this assert.
  tags: [acme_certs, validation]

- name: Ensure the distribution key directory exists
  ansible.builtin.file:
    path: "{{ acme_certs_ssh_key_dir }}"
    state: directory
    owner: "{{ acme_certs_ssh_user }}"
    group: "{{ acme_certs_ssh_user }}"
    mode: "0700"
  when: acme_certs_enabled | bool

- name: Deploy the cert-distribution SSH private key
  ansible.builtin.copy:
    content: "{{ acme_certs_ssh_private_key }}\n"
    dest: "{{ acme_certs_ssh_key_path }}"
    owner: "{{ acme_certs_ssh_user }}"
    group: "{{ acme_certs_ssh_user }}"
    mode: "0600"
  when:
    - acme_certs_enabled | bool
    - acme_certs_ssh_private_key is defined
    - acme_certs_ssh_private_key != ''
  no_log: true

- name: Deploy the cert-distribution SSH public key
  ansible.builtin.copy:
    content: "{{ acme_certs_ssh_public_key }}\n"
    dest: "{{ acme_certs_ssh_key_path }}.pub"
    owner: "{{ acme_certs_ssh_user }}"
    group: "{{ acme_certs_ssh_user }}"
    mode: "0644"
  when:
    - acme_certs_enabled | bool
    - acme_certs_ssh_public_key is defined
    - acme_certs_ssh_public_key != ''

# Seed each target with the receiver, sudoers rule and pinned pubkey; delegate_to
# reaches targets outside the play's host scope. Looped include, not a looped
# delegate — see README § Unreachable targets. ssh_no_sudo targets are skipped.
- name: Reset the cert-distribution reachability results
  ansible.builtin.set_fact:
    acme_certs_unreachable_targets: []
  when: acme_certs_enabled | bool

- name: Seed the cert-distribution targets
  ansible.builtin.include_tasks: seed-target.yml
  loop: "{{ acme_certs_distribution_targets | default([]) }}"
  loop_control:
    loop_var: acme_certs_target
    label: "{{ acme_certs_target.host }}"
  when:
    - acme_certs_enabled | bool
    - not (acme_certs_target.ssh_no_sudo | default(false))
    - acme_certs_ssh_public_key | default('') | length > 0
    # False renders locally without reaching the targets (molecule does this).
    - acme_certs_distribute_pubkeys | default(true)

- name: Report cert-distribution targets that could not be seeded
  ansible.builtin.debug:
    msg: >-
      Unreachable, left unseeded: {{ acme_certs_unreachable_targets | join(', ') }}.
      Their next cert push will fail until they are back and this role re-runs.
  when:
    - acme_certs_enabled | bool
    - acme_certs_unreachable_targets | default([]) | length > 0

# cron is required by acme.sh --install-cronjob; without it renewals go
# unscheduled.
- name: Install acme.sh dependencies
  ansible.builtin.apt:
    name:
      - cron
      - curl
      - openssl
    state: present
  when:
    - acme_certs_enabled | bool
    - ansible_facts['os_family'] == "Debian"

- name: Check if acme.sh is installed
  ansible.builtin.stat:
    path: /root/.acme.sh/acme.sh
  register: acme_certs_installed
  when: acme_certs_enabled | bool

# Staged in a root-owned 0700 directory, never world-writable /tmp: the
# installer runs as root from what is on disk, so a local user must not be able
# to pre-create or swap a path in it.
- name: Create the acme.sh staging directory
  ansible.builtin.file:
    path: "{{ acme_certs_stage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - acme_certs_enabled | bool
    - not acme_certs_installed.stat.exists

# Must be the release tarball, never the raw acme.sh file: only the tarball
# ships dnsapi/, and a hook missing at install time is never fetched later.
- name: Download acme.sh release tarball
  ansible.builtin.get_url:
    url: "https://github.com/acmesh-official/acme.sh/archive/refs/tags/{{ acme_certs_sh_version }}.tar.gz"
    dest: "{{ acme_certs_stage_dir }}/acme.sh-{{ acme_certs_sh_version }}.tar.gz"
    checksum: "sha256:{{ acme_certs_sh_tarball_sha256 }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - acme_certs_enabled | bool
    - not acme_certs_installed.stat.exists

- name: Extract acme.sh release tarball
  ansible.builtin.unarchive:
    src: "{{ acme_certs_stage_dir }}/acme.sh-{{ acme_certs_sh_version }}.tar.gz"
    dest: "{{ acme_certs_stage_dir }}"
    remote_src: true
  when:
    - acme_certs_enabled | bool
    - not acme_certs_installed.stat.exists

# Pin the CA at install time so later `acme.sh --issue` runs without --server
# still hit it (acme.sh 3.x otherwise defaults to ZeroSSL). bash, not sh: the
# installer trips dash incompatibilities in containers.
- name: Install acme.sh (default CA pinned to {{ acme_certs_ca_server }})
  ansible.builtin.shell: |
    cd {{ acme_certs_stage_dir }}/acme.sh-{{ acme_certs_sh_version }} && \
    bash acme.sh --install --email {{ acme_certs_email | quote }} \
      --server {{ acme_certs_ca_server | quote }}
  args:
    creates: /root/.acme.sh/acme.sh
  when:
    - acme_certs_enabled | bool
    - not acme_certs_installed.stat.exists

- name: Check the DNS-01 hook is installed
  ansible.builtin.stat:
    path: "/root/.acme.sh/dnsapi/{{ acme_certs_dns_hook }}.sh"
  register: acme_certs_dnsapi_hook
  when: acme_certs_enabled | bool

- name: Assert acme.sh has the dnsapi hooks
  ansible.builtin.assert:
    that:
      - acme_certs_dnsapi_hook.stat.exists
    fail_msg: >-
      /root/.acme.sh/dnsapi/{{ acme_certs_dns_hook }}.sh is missing — this
      acme.sh install has no DNS hook for {{ acme_certs_dns_hook }}, so DNS-01
      issuance/renewal cannot work. Remove /root/.acme.sh and re-run this role
      to reinstall from the pinned release tarball (which ships dnsapi/), or
      set acme_certs_dns_hook to a hook that tarball provides.
    success_msg: "acme.sh dnsapi hooks are present ({{ acme_certs_dns_hook }})"
  when:
    - acme_certs_enabled | bool
    # In check mode on a fresh host the install above is skipped.
    - acme_certs_installed.stat.exists or (not ansible_check_mode)

# Ensure the renewal cron job exists regardless of install vintage; the && ties
# the task rc to --install-cronjob.
- name: Ensure acme.sh renewal cronjob exists
  ansible.builtin.shell: |
    set -o pipefail
    if ! crontab -l 2>/dev/null | grep -q '\.acme\.sh.*--cron'; then
      /root/.acme.sh/acme.sh --install-cronjob && echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: acme_certs_cron_ensure
  changed_when: "'CHANGED' in (acme_certs_cron_ensure.stdout | default(''))"
  when:
    - acme_certs_enabled | bool
    - not ansible_check_mode

# Re-asserted every run, so a host installed without the pin still renews from
# the configured CA.
- name: Ensure acme.sh default CA is {{ acme_certs_ca_server }}
  ansible.builtin.shell: |
    /root/.acme.sh/acme.sh --set-default-ca --server {{ acme_certs_ca_server | quote }}
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - acme_certs_enabled | bool
    - acme_certs_installed.stat.exists or (not ansible_check_mode)

- name: Remove the acme.sh staging directory
  ansible.builtin.file:
    path: "{{ acme_certs_stage_dir }}"
    state: absent
  when:
    - acme_certs_enabled | bool
    - not acme_certs_installed.stat.exists

- name: Deploy homelab-cert-reload script
  ansible.builtin.template:
    src: homelab-cert-reload.sh.j2
    dest: /usr/local/sbin/homelab-cert-reload.sh
    owner: root
    group: root
    mode: "0700"
  when: acme_certs_enabled | bool

- name: Manage the cert distribution check timer
  ansible.builtin.include_tasks: distribution-check.yml
  when: acme_certs_enabled | bool

# The push carries wildcard private-key material, so the channel runs with
# StrictHostKeyChecking=yes: every target's host_key is required.
- name: Pin cert distribution target host keys
  when:
    - acme_certs_enabled | bool
    - acme_certs_distribution_targets is defined
  block:
    - name: Assert every cert distribution target has a pinned host_key
      ansible.builtin.assert:
        that:
          - item.host_key is defined
          - item.host_key | length > 0
        fail_msg: |
          The acme_certs_distribution_targets entry for "{{ item.host }}"
          ({{ item.ip }}) has no host_key. Capture it with
              ssh-keyscan -p <port> <ip>
          paste the value into the entry, then re-run.
      loop: "{{ acme_certs_distribution_targets }}"
      loop_control:
        label: "{{ item.host }}"

    # With neither key set to a non-empty value the receiver bakes no reload,
    # and that only surfaces on the first run that pushes a cert.
    - name: Assert every cert distribution target declares a reload
      ansible.builtin.assert:
        that:
          - >-
            (item.restart_service | default('') | trim | length > 0) or
            (item.restart_command | default('') | trim | length > 0)
        fail_msg: |
          The acme_certs_distribution_targets entry for "{{ item.host }}"
          declares neither restart_service nor restart_command. See
          README.md § Target schema for the required keys.
      loop: "{{ acme_certs_distribution_targets }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Ensure root .ssh directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy pinned host keys to root known_hosts
      ansible.builtin.known_hosts:
        path: /root/.ssh/known_hosts
        # A non-standard port is looked up as `[ip]:port`; a bare IP entry
        # only matches port 22.
        name: >-
          {{ '[' ~ item.ip ~ ']:' ~ (item.ssh_port | int)
             if (item.ssh_port | default(22) | int) != 22
             else item.ip }}
        key: >-
          {{ '[' ~ item.ip ~ ']:' ~ (item.ssh_port | int) ~ ' ' ~ item.host_key
             if (item.ssh_port | default(22) | int) != 22
             else item.ip ~ ' ' ~ item.host_key }}
        state: present
      loop: "{{ acme_certs_distribution_targets }}"
      loop_control:
        label: "{{ item.host }} ({{ item.ip }})"

# Install into acme_certs_local_cert_dir when acme.sh holds a cert that never
# got installed there (manual issuance, rebuilt host).
- name: Check if certificates exist in acme.sh
  ansible.builtin.stat:
    path: "/root/.acme.sh/{{ acme_certs_domain }}_ecc/fullchain.cer"
  register: acme_certs_cert_exists
  when: acme_certs_enabled | bool

- name: Check if certificates are already installed locally
  ansible.builtin.stat:
    path: "{{ acme_certs_local_cert_dir }}/fullchain.pem"
  register: acme_certs_local_cert_exists
  when: acme_certs_enabled | bool

- name: Install certificates to local directory (if acme.sh has certs but local dir is empty)
  ansible.builtin.command:
    # --ecc: the cert is issued ec-256 and stored under <domain>_ecc/, which the
    # stat-check above and the issuance instructions below also assume.
    cmd: >
      /root/.acme.sh/acme.sh --install-cert -d "{{ acme_certs_domain }}" --ecc
      --cert-file {{ acme_certs_local_cert_dir }}/cert.pem
      --key-file {{ acme_certs_local_cert_dir }}/privkey.pem
      --fullchain-file {{ acme_certs_local_cert_dir }}/fullchain.pem
      --reloadcmd "/usr/local/sbin/homelab-cert-reload.sh"
  when:
    - acme_certs_enabled | bool
    - acme_certs_cert_exists.stat.exists | default(false)
    - not (acme_certs_local_cert_exists.stat.exists | default(false))
  register: acme_certs_install_result
  changed_when: true

# A cert that arrived by another route would renew with no Le_ReloadCmd and
# never distribute. Presence is the test, not the exact command: acme.sh
# base64-wraps Le_ReloadCmd.
- name: Check the acme.sh reload command is recorded for this domain
  ansible.builtin.shell: |
    set -o pipefail
    conf=/root/.acme.sh/{{ acme_certs_domain | quote }}_ecc/{{ acme_certs_domain | quote }}.conf
    [ -f "$conf" ] || { echo missing; exit 0; }
    val=$(sed -n 's/^Le_ReloadCmd=//p' "$conf" | tr -d "'\"" | tr -d '[:space:]')
    if [ -n "$val" ]; then echo present; else echo missing; fi
  args:
    executable: /bin/bash
  register: acme_certs_reloadcmd_check
  changed_when: false
  check_mode: false
  when:
    - acme_certs_enabled | bool
    - acme_certs_cert_exists.stat.exists | default(false)

- name: Re-install the certificate to restore the acme.sh reload command
  ansible.builtin.command:
    cmd: >
      /root/.acme.sh/acme.sh --install-cert -d "{{ acme_certs_domain }}" --ecc
      --cert-file {{ acme_certs_local_cert_dir }}/cert.pem
      --key-file {{ acme_certs_local_cert_dir }}/privkey.pem
      --fullchain-file {{ acme_certs_local_cert_dir }}/fullchain.pem
      --reloadcmd "/usr/local/sbin/homelab-cert-reload.sh"
  when:
    - acme_certs_enabled | bool
    - acme_certs_cert_exists.stat.exists | default(false)
    - not (acme_certs_install_result.changed | default(false))
    - (acme_certs_reloadcmd_check.stdout | default('') | trim) == 'missing'
  register: acme_certs_reloadcmd_repair
  changed_when: true

- name: Set proper ownership on installed certificates
  ansible.builtin.file:
    path: "{{ acme_certs_local_cert_dir }}/{{ item.name }}"
    owner: root
    group: "{{ acme_certs_local_cert_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: "fullchain.pem", mode: "0644" }
    - { name: "privkey.pem", mode: "0640" }
    - { name: "cert.pem", mode: "0644" }
  when:
    - acme_certs_enabled | bool
    - (acme_certs_install_result.changed | default(false))
      or (acme_certs_reloadcmd_repair.changed | default(false))

- name: Display acme.sh setup instructions (only if no certs exist yet)
  ansible.builtin.debug:
    msg: |
      ACME.sh is installed but no certificates have been issued yet.

      To issue certificates manually:

      1. Export the DNS provider credentials the acme.sh hook expects
         (for the default dns_cf hook: CF_Token / CF_Account_ID).

      2. Issue the wildcard certificate. --keylength ec-256 issues ECC,
         stored under {{ acme_certs_domain }}_ecc/ — the directory the
         stat-check and --install-cert (--ecc) expect. --server is passed
         explicitly so the command also works on an install this role did not pin:
         /root/.acme.sh/acme.sh --issue --dns {{ acme_certs_dns_hook }} --server {{ acme_certs_ca_server }} \
           --keylength ec-256 \
           -d "{{ acme_certs_domain }}" \
           -d "*.{{ acme_certs_domain }}"

      Then re-run this role: it installs and distributes the certs.
  when:
    - acme_certs_enabled | bool
    - not (acme_certs_cert_exists.stat.exists | default(false))

- name: Display certificate installation status
  ansible.builtin.debug:
    msg: "Certificates are installed at {{ acme_certs_local_cert_dir }} and configured for automatic renewal with distribution."
  when:
    - acme_certs_enabled | bool
    - acme_certs_cert_exists.stat.exists | default(false)
    - acme_certs_local_cert_exists.stat.exists | default(false) or (acme_certs_install_result.changed | default(false))

# Proactive distribution on every run; the script decides per target whether
# anything needs pushing.
- name: Check if local certificates exist for distribution
  ansible.builtin.stat:
    path: "{{ acme_certs_local_cert_dir }}/fullchain.pem"
  register: acme_certs_local_certs_for_dist
  when: acme_certs_enabled | bool

- name: Distribute certificates to remote hosts
  ansible.builtin.command:
    cmd: /usr/local/sbin/homelab-cert-reload.sh
  when:
    - acme_certs_enabled | bool
    - acme_certs_local_certs_for_dist.stat.exists | default(false)
    - acme_certs_distribution_targets is defined
    - acme_certs_distribution_targets | length > 0
    - not ansible_check_mode
    - not (acme_certs_skip_distribution | default(false))
    # Either --install-cert task above already ran this script via --reloadcmd.
    - not (acme_certs_install_result.changed | default(false))
    - not (acme_certs_reloadcmd_repair.changed | default(false))
  register: acme_certs_distribution_result
  # "OK:" is a real push, "unchanged:" a skip; rc 2 means at least one target
  # failed (see the script's exit codes).
  changed_when: "'OK:' in (acme_certs_distribution_result.stdout | default(''))"
