---
# The cap must be in the initramfs to bind at early boot when the pool imports;
# a bare /etc/modprobe.d write applies only at the next module load. This governs
# the next-boot cap only, while the sysfs task owns the running value.
- name: Rebuild initramfs for zfs arc cap
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  when: not (zfs_arc_cap_skip_initramfs | default(false))
