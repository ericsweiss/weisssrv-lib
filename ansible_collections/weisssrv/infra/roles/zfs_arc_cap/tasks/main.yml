---
# Do NOT run this on a host where nas_storage already owns the cap: both write
# /etc/modprobe.d/zfs.conf. That shared filename is deliberate, so this cleanly
# supersedes a hand-written zfs.conf cap — but a stale cap in a DIFFERENTLY
# named modprobe.d file must be removed by hand, or the load-time value is
# ambiguous (the running value is still made authoritative below).
- name: Cap ZFS ARC via modprobe.d
  ansible.builtin.template:
    src: zfs-arc.conf.j2
    dest: /etc/modprobe.d/zfs.conf
    owner: root
    group: root
    mode: "0644"
  when: zfs_arc_cap_max_bytes | default('') | string | length > 0
  notify: Rebuild initramfs for zfs arc cap

# The modprobe.d file + initramfs rebuild only take effect at the next boot.
# Apply the cap to the running kernel too so a changed zfs_arc_cap_max_bytes is
# live immediately (compare-then-set). Guarded on the sysfs param existing — the
# molecule container has no ZFS module, so the file is absent there.
- name: Check for the running ZFS ARC parameter
  ansible.builtin.stat:
    path: /sys/module/zfs/parameters/zfs_arc_max
  register: zfs_arc_cap_param
  when: zfs_arc_cap_max_bytes | default('') | string | length > 0

- name: Apply the ZFS ARC cap to the running kernel
  # set -euo pipefail so a REJECTED sysfs write (the kernel can refuse an
  # out-of-range zfs_arc_max) aborts the task instead of being masked green by
  # the trailing `echo CHANGED`; the read-back + compare then fails the task if
  # the live value did not actually take.
  ansible.builtin.shell: |
    set -euo pipefail
    current=$(cat /sys/module/zfs/parameters/zfs_arc_max)
    if [ "$current" != {{ zfs_arc_cap_max_bytes | quote }} ]; then
      echo {{ zfs_arc_cap_max_bytes | quote }} > /sys/module/zfs/parameters/zfs_arc_max
      applied=$(cat /sys/module/zfs/parameters/zfs_arc_max)
      if [ "$applied" != {{ zfs_arc_cap_max_bytes | quote }} ]; then
        echo "FAILED: kernel rejected the write (wanted {{ zfs_arc_cap_max_bytes }}, got $applied)" >&2
        exit 1
      fi
      echo "CHANGED"
    else
      echo "OK"
    fi
  args:
    executable: /bin/bash
  register: zfs_arc_cap_runtime
  changed_when: "'CHANGED' in zfs_arc_cap_runtime.stdout"
  # No check_mode:false — this writes /sys, so a dry-run (task infra:check) must
  # skip it rather than mutate the running kernel on a live host.
  when:
    - zfs_arc_cap_max_bytes | default('') | string | length > 0
    - zfs_arc_cap_param.stat.exists | default(false)
