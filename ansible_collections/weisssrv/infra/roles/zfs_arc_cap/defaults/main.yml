---
# Byte count for zfs_arc_max, rendered to /etc/modprobe.d/zfs.conf, baked into
# the initramfs and written live to sysfs. Empty ("") is a no-op. Aliases the
# inventory-wide zfs_arc_max_bytes; see the README.
zfs_arc_cap_max_bytes: "{{ zfs_arc_max_bytes | default('') }}"

# Skip the update-initramfs handler (molecule / check-mode). The modprobe.d file
# still renders; only the initramfs rebuild — which needs a real /boot kernel —
# is suppressed so the role converges inside a plain CI container.
zfs_arc_cap_skip_initramfs: false
