---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    # Render-only scenario: the role installs no apt packages, so prepare-base
    # is imported without prepare-apt-disable. /etc/modprobe.d is left unseeded
    # so a regression in the role's own directory creation stays visible.
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml
