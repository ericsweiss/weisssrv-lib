---
# The container has no ZFS module (so /sys/module/zfs/parameters/zfs_arc_max is
# absent — the live-apply task self-skips on that stat) and no real /boot kernel
# (so zfs_arc_cap_skip_initramfs suppresses the update-initramfs handler). What
# is exercised: the modprobe.d render + its exact content.
platforms:
  - name: zfs-arc-cap-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    # Role-specific prepare: seed /etc/modprobe.d (absent in the minimal image)
    # on top of the shared systemd-wait prep. Re-points playbooks.prepare off the
    # inherited prepare-common.yml (deep-merge keeps converge/verify from base).
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        # Set via the inventory-wide ALIAS, not zfs_arc_cap_max_bytes, so the
        # alias in defaults/main.yml is what the scenario proves (8 GiB).
        zfs_arc_max_bytes: 8589934592
        # No real /boot kernel in the container — render the file, skip the rebuild.
        zfs_arc_cap_skip_initramfs: true
