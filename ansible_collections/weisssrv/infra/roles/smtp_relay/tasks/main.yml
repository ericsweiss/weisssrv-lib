---
# SMTP relay server configuration
# Central postfix relay that forwards to Gmail

# Assert the EFFECTIVE config (defaults + smtp_relay_config merged), so a site
# override is checked too. An empty relayhost renders `relayhost = ` (postfix
# falls back to direct MX delivery from this host) and makes sasl_passwd.j2 emit
# a leading-whitespace line, which postmap reads as a continuation rather than a
# smarthost entry — both silent.
- name: Validate the relay identity and smarthost are set
  ansible.builtin.assert:
    that:
      - smtp_relay_effective_config.relayhost | default('') | length > 0
      - smtp_relay_effective_config.myhostname | default('') | length > 0
      - smtp_relay_effective_config.myorigin | default('') | length > 0
    fail_msg: >-
      The relay config needs a non-empty relayhost, myhostname and myorigin.
      On the defaults these come from smtp_relay_upstream and
      smtp_relay_hostname/_origin (which derive from smtp_relay_internal_domain,
      alias: internal_domain); a site can also set them in smtp_relay_config.
    success_msg: "SMTP relay identity and smarthost are set"

- name: Validate required SMTP Gmail credentials are set
  ansible.builtin.assert:
    that:
      - smtp_relay_upstream_user | default('') | length > 0
      - smtp_relay_upstream_password | default('') | length > 0
    fail_msg: >-
      SMTP Gmail credentials are not set. Ensure SMTP_GMAIL_USER and
      SMTP_GMAIL_PASSWORD environment variables are provided via 'op run'.
      Run deployment with: task infra:deploy (which injects 1Password secrets)
    success_msg: "SMTP Gmail credentials are present"
  no_log: true

# default('') guards the undef()-hinted lookups in all.yml so a missing env
# var fails the assert with fail_msg instead of an undefined-variable error.
- name: Validate required SMTP relay auth credentials are set
  ansible.builtin.assert:
    that:
      - smtp_relay_sasl_user | default('') | length > 0
      - smtp_relay_sasl_password | default('') | length > 0
    fail_msg: >-
      SMTP relay auth credentials are not set. Ensure SMTP_RELAY_USER and
      SMTP_RELAY_PASSWORD environment variables are provided via 'op run'.
      These are used for SASL authentication by null clients connecting to this relay.
      Run deployment with: task infra:deploy (which injects 1Password secrets)
    success_msg: "SMTP relay auth credentials are present"
  no_log: true

# Cert-distribution pubkey deployment is owned by acme_certs, for every target.

- name: Install postfix and dependencies
  ansible.builtin.apt:
    name:
      - postfix
      - libsasl2-modules
      - sasl2-bin
      - mailutils
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Configure mailname
  ansible.builtin.copy:
    content: "{{ smtp_relay_effective_config.myhostname }}\n"
    dest: /etc/mailname
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Create TLS certificate directory
  ansible.builtin.file:
    path: "{{ smtp_relay_tls_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy postfix main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Deploy postfix master.cf
  ansible.builtin.template:
    src: master.cf.j2
    dest: /etc/postfix/master.cf
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Deploy SASL password file for Gmail relay
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"
  notify:
    - Postmap sasl_passwd
    - Reload postfix
  no_log: true

- name: Create SASL configuration directory
  ansible.builtin.file:
    path: /etc/postfix/sasl
    state: directory
    owner: root
    group: postfix
    mode: "0750"

- name: Deploy SASL smtpd.conf for incoming authentication
  ansible.builtin.copy:
    content: |
      pwcheck_method: auxprop
      auxprop_plugin: sasldb
      mech_list: PLAIN LOGIN
    dest: /etc/postfix/sasl/smtpd.conf
    owner: root
    group: postfix
    mode: "0640"
  notify: Reload postfix

- name: Check if SASL user exists
  ansible.builtin.shell: |
    set -o pipefail
    sasldblistusers2 | grep -Fq -- "$SASL_USER@$SASL_REALM"
  args:
    executable: /bin/bash
  environment:
    SASL_USER: "{{ smtp_relay_sasl_user }}"
    SASL_REALM: "{{ smtp_relay_effective_config.myhostname }}"
  register: smtp_relay_sasl_user_check
  failed_when: false
  changed_when: false
  # The relay username is a credential half, so it reaches the probe through the
  # environment (never argv) and -F keeps a metacharacter in it from matching
  # something else.
  no_log: true

# sasldb stores no recoverable plaintext to compare against, so rotation is
# detected via this fingerprint: it changes exactly when the credentials do,
# which makes the always-rerun saslpasswd2 below report changed (and reload
# postfix) on rotation instead of silently claiming ok. The sentinel is
# read here but only (re)written AFTER saslpasswd2 succeeds, so a failed
# rotation leaves the old fingerprint and the next run still retries.
- name: Read existing SASL relay credential fingerprint
  ansible.builtin.slurp:
    src: /etc/postfix/.sasl_relay_user.sha256
  register: smtp_relay_sasl_existing_fingerprint
  failed_when: false
  no_log: true

- name: Compute expected SASL relay credential fingerprint
  ansible.builtin.set_fact:
    smtp_relay_sasl_expected_fingerprint: >-
      {{ (smtp_relay_sasl_user ~ '@' ~ smtp_relay_effective_config.myhostname
      ~ ':' ~ smtp_relay_sasl_password) | hash('sha256') }}
  no_log: true

# Secret reaches saslpasswd2 via the task environment, never the argv.
- name: Create/update relay user in SASL database
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s' "$SASL_PW" | saslpasswd2 -p -c -u "$SASL_REALM" "$SASL_USER"
  args:
    executable: /bin/bash
  environment:
    SASL_PW: "{{ smtp_relay_sasl_password }}"
    SASL_USER: "{{ smtp_relay_sasl_user }}"
    SASL_REALM: "{{ smtp_relay_effective_config.myhostname }}"
  no_log: true
  changed_when: >-
    smtp_relay_sasl_user_check.rc != 0
    or smtp_relay_sasl_expected_fingerprint != (smtp_relay_sasl_existing_fingerprint.content | default('') | b64decode | trim)
  notify: Reload postfix

# Written only after saslpasswd2 succeeds; a failure halts the play before
# this task, leaving the stale sentinel so the next run re-detects the change.
- name: Record SASL relay credential fingerprint
  ansible.builtin.copy:
    content: "{{ smtp_relay_sasl_expected_fingerprint }}\n"
    dest: /etc/postfix/.sasl_relay_user.sha256
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Set permissions on SASL database
  ansible.builtin.file:
    path: /etc/sasldb2
    owner: root
    group: postfix
    mode: "0640"

- name: Configure mail aliases
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  notify: Newaliases

# Both map sources are notify-only, so a lost handler leaves a correct source
# next to a stale compiled .db that postfix keeps reading. Placed before the
# service start so a first converge has a usable sasl_passwd.db without waiting
# for the handler flush. The task file is shared with postfix_null_client (same
# two maps, same hazard); that role's identically-named handlers come along with
# the include and are inert duplicates of this role's.
- name: Repair stale compiled postfix maps
  ansible.builtin.include_role:
    name: weisssrv.infra.postfix_null_client
    tasks_from: repair-compiled-maps.yml
  vars:
    postfix_null_client_maps_root_alias: "{{ smtp_relay_aliases.root | default('') }}"

- name: Ensure postfix is enabled and running
  ansible.builtin.service:
    name: postfix
    state: started
    enabled: true

# Postfix queue depth collector
# A wedged Gmail hop (expired app password, rate-limit) queues mail silently:
# postfix stays active and the LXC gauges stay green while the deferred queue
# grows. The collector feeds postfix_queue_depth / postfix_up to the
# node_exporter textfile collector already scraped on :9101 so
# PrometheusRules can fire on queue growth and collector staleness.
# Same attributes as node_exporter_host's textfile-dir task so the two roles
# never fight over ownership/mode; makes this role self-sufficient regardless
# of ordering and gives the sandboxed unit's ReadWritePaths an existing target.
- name: Create node_exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ smtp_relay_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install postfix queue collector script
  ansible.builtin.copy:
    src: postfix-queue-collector.sh
    dest: /usr/local/sbin/postfix-queue-collector.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy postfix queue collector unit + timer
  ansible.builtin.include_role:
    name: weisssrv.infra.textfile_collector
  vars:
    textfile_collector_name: postfix-queue-collector
    textfile_collector_service_description: Sample Postfix queue depth to node_exporter textfile collector
    textfile_collector_timer_description: Periodically sample the Postfix queue
    textfile_collector_script: /usr/local/sbin/postfix-queue-collector.sh
    textfile_collector_textfile_dir: "{{ smtp_relay_textfile_dir }}"
    textfile_collector_after:
      - postfix.service
    textfile_collector_extra_read_write_paths:
      - /var/spool/postfix/public

- name: Enable + start postfix queue collector timer
  ansible.builtin.systemd:
    name: postfix-queue-collector.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
