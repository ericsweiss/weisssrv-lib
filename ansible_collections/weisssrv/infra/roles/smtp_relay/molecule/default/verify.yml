---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if Postfix is installed
      ansible.builtin.command: postconf mail_version
      register: postfix_installed
      changed_when: false
      failed_when: postfix_installed.rc != 0

    - name: Check if Postfix service is running
      ansible.builtin.systemd:
        name: postfix
      register: postfix_service
      failed_when: postfix_service.status.ActiveState != 'active'

    - name: Check if main.cf exists
      ansible.builtin.stat:
        path: /etc/postfix/main.cf
      register: main_cf
      failed_when: not main_cf.stat.exists

    - name: Read main.cf
      ansible.builtin.slurp:
        src: /etc/postfix/main.cf
      register: main_cf_content

    - name: Verify main.cf contains relay settings
      ansible.builtin.assert:
        that:
          - "'relayhost = [smtp.gmail.com]:587' in (main_cf_content.content | b64decode)"
          - "'inet_interfaces = all' in (main_cf_content.content | b64decode)"
          - "'smtp_sasl_auth_enable = yes' in (main_cf_content.content | b64decode)"
          # Merge: the scenario's smtp_relay_config override wins on mynetworks,
          # while myhostname and the SASL map still come from the defaults.
          - "'mynetworks = 127.0.0.0/8, 192.0.2.0/24' in (main_cf_content.content | b64decode)"
          # A key that exists only in smtp_relay_config: the template renders
          # every key of the merged map, not a fixed list.
          - "'message_size_limit = 52428800' in (main_cf_content.content | b64decode)"
          - "'myhostname = smtp-relay.test.local' in (main_cf_content.content | b64decode)"
          - "'smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd' in (main_cf_content.content | b64decode)"
          # Prod hardening pins: outbound TLS verifies Gmail's cert, port-25
          # AUTH stays off (submission re-enables it behind mandatory TLS).
          - "'smtpd_sasl_auth_enable = no' in (main_cf_content.content | b64decode)"
          - "'smtpd_tls_auth_only = yes' in (main_cf_content.content | b64decode)"
          - "'smtpd_tls_security_level = may' in (main_cf_content.content | b64decode)"
          - "'smtp_tls_security_level = secure' in (main_cf_content.content | b64decode)"
          # Under `secure`, postfix reads the mandatory list, not smtp_tls_protocols.
          - >-
            'smtp_tls_mandatory_protocols = !SSLv2, !SSLv3, !TLSv1, !TLSv1.1'
            in (main_cf_content.content | b64decode)
        fail_msg: "main.cf missing expected relay settings"
        success_msg: "main.cf contains all expected relay settings"

    - name: Check if master.cf exists
      ansible.builtin.stat:
        path: /etc/postfix/master.cf
      register: master_cf
      failed_when: not master_cf.stat.exists

    - name: Read master.cf
      ansible.builtin.slurp:
        src: /etc/postfix/master.cf
      register: master_cf_content

    # Port 25 carries no AUTH; submission re-enables it behind mandatory TLS,
    # so the -o overrides are the security posture, not decoration.
    - name: Verify the submission service carries its overrides
      ansible.builtin.assert:
        that:
          - "'submission inet n' in (master_cf_content.content | b64decode)"
          - "'-o syslog_name=postfix/submission' in (master_cf_content.content | b64decode)"
          - "'-o smtpd_tls_security_level=encrypt' in (master_cf_content.content | b64decode)"
          - "'-o smtpd_sasl_auth_enable=yes' in (master_cf_content.content | b64decode)"
          - "'-o smtpd_recipient_restrictions=permit_sasl_authenticated,reject' in (master_cf_content.content | b64decode)"
          - "'-o milter_macro_daemon_name=ORIGINATING' in (master_cf_content.content | b64decode)"
        fail_msg: "master.cf is missing the submission service or one of its -o overrides"
        success_msg: "master.cf carries the submission service with its -o overrides"

    # The disabled branch is rendered to a scratch path: flipping it on the live
    # host would drop submission from the converged container.
    - name: Render master.cf with submission disabled
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir ~ '/../../templates/master.cf.j2') }}
        dest: /tmp/master.cf-submission-disabled
        mode: "0644"
      vars:
        smtp_relay_submission_enabled: false

    - name: Read the submission-disabled render
      ansible.builtin.slurp:
        src: /tmp/master.cf-submission-disabled
      register: master_cf_no_submission

    - name: Verify smtp_relay_submission_enabled false drops the whole stanza
      ansible.builtin.assert:
        that:
          - "'submission inet' not in (master_cf_no_submission.content | b64decode)"
          - "'-o syslog_name=postfix/submission' not in (master_cf_no_submission.content | b64decode)"
          - "'-o milter_macro_daemon_name=ORIGINATING' not in (master_cf_no_submission.content | b64decode)"
          - "'smtp      inet' in (master_cf_no_submission.content | b64decode)"
        fail_msg: "Disabling smtp_relay_submission_enabled did not remove the submission stanza"
        success_msg: "smtp_relay_submission_enabled false removes the submission stanza"

    # The role replaces Debian's whole service table, so a service the package
    # adds never reaches the relay unless templates/master.cf.j2 is re-synced.
    - name: Compare the rendered service table against Debian's packaged one
      ansible.builtin.command:
        argv:
          - python3
          - "-c"
          - |
            import os
            import sys

            def services(path):
                if not os.path.exists(path):
                    sys.exit("%s is missing; cannot check master.cf drift" % path)
                names = set()
                for line in open(path):
                    if not line.strip() or line.startswith("#") or line[0].isspace():
                        continue
                    names.add(line.split()[0])
                return names

            missing = services("/usr/share/postfix/master.cf.dist") - services("/etc/postfix/master.cf")
            if missing:
                sys.exit("Debian's master.cf gained %s; re-sync templates/master.cf.j2"
                         % ", ".join(sorted(missing)))
      register: master_cf_drift
      changed_when: false
      failed_when: master_cf_drift.rc != 0

    # Credential rotation: the sentinel is what makes an otherwise unchanged
    # saslpasswd2 report changed, so drive it from a stale value.
    - name: Rotation | check the SASL credential fingerprint sentinel
      ansible.builtin.stat:
        path: /etc/postfix/.sasl_relay_user.sha256
      register: smtp_relay_fingerprint
      failed_when: >-
        not smtp_relay_fingerprint.stat.exists
        or smtp_relay_fingerprint.stat.mode != '0600'

    - name: Rotation | read the sentinel
      ansible.builtin.slurp:
        src: /etc/postfix/.sasl_relay_user.sha256
      register: smtp_relay_fingerprint_before

    - name: Rotation | replace the sentinel with a stale fingerprint
      ansible.builtin.copy:
        content: "{{ 'stale' | hash('sha256') }}\n"
        dest: /etc/postfix/.sasl_relay_user.sha256
        owner: root
        group: root
        mode: "0600"

    - name: Rotation | re-run the role against the stale sentinel
      ansible.builtin.include_role:
        name: weisssrv.infra.smtp_relay

    - name: Rotation | read the sentinel after the re-run
      ansible.builtin.slurp:
        src: /etc/postfix/.sasl_relay_user.sha256
      register: smtp_relay_fingerprint_repaired

    - name: Rotation | a stale sentinel is re-recorded from the live credentials
      ansible.builtin.assert:
        that:
          - >-
            (smtp_relay_fingerprint_repaired.content | b64decode | trim)
            == (smtp_relay_fingerprint_before.content | b64decode | trim)
        fail_msg: "The SASL credential fingerprint was not re-recorded after saslpasswd2"
        success_msg: "A stale SASL credential fingerprint is re-recorded"

    - name: Rotation | re-run the role with a rotated relay password
      ansible.builtin.include_role:
        name: weisssrv.infra.smtp_relay
      vars:
        smtp_relay_sasl_password: rotated-testrelaypass

    - name: Rotation | read the sentinel after the rotation
      ansible.builtin.slurp:
        src: /etc/postfix/.sasl_relay_user.sha256
      register: smtp_relay_fingerprint_rotated

    - name: Rotation | rotating the credential changes the fingerprint
      ansible.builtin.assert:
        that:
          - >-
            (smtp_relay_fingerprint_rotated.content | b64decode | trim)
            != (smtp_relay_fingerprint_before.content | b64decode | trim)
        fail_msg: "Rotating smtp_relay_sasl_password left the fingerprint unchanged"
        success_msg: "Rotating the relay credential changes the recorded fingerprint"

    - name: Check if SASL password file has correct permissions
      ansible.builtin.stat:
        path: /etc/postfix/sasl_passwd
      register: sasl_passwd
      failed_when: not sasl_passwd.stat.exists or sasl_passwd.stat.mode != '0600'

    - name: Check if sasl_passwd.db was generated
      ansible.builtin.stat:
        path: /etc/postfix/sasl_passwd.db
      register: sasl_passwd_db
      failed_when: not sasl_passwd_db.stat.exists

    - name: Check if SASL smtpd.conf exists
      ansible.builtin.stat:
        path: /etc/postfix/sasl/smtpd.conf
      register: sasl_smtpd_conf
      failed_when: not sasl_smtpd_conf.stat.exists

    - name: Read SASL smtpd.conf
      ansible.builtin.slurp:
        src: /etc/postfix/sasl/smtpd.conf
      register: sasl_smtpd_content

    - name: Verify SASL smtpd.conf contains expected config
      ansible.builtin.assert:
        that:
          - "'pwcheck_method: auxprop' in (sasl_smtpd_content.content | b64decode)"
          - "'auxprop_plugin: sasldb' in (sasl_smtpd_content.content | b64decode)"
          - "'mech_list: PLAIN LOGIN' in (sasl_smtpd_content.content | b64decode)"
        fail_msg: "SASL smtpd.conf missing expected config"
        success_msg: "SASL smtpd.conf configured correctly"

    - name: Check if SASL database exists with correct permissions
      ansible.builtin.stat:
        path: /etc/sasldb2
      register: sasldb2
      failed_when: not sasldb2.stat.exists or sasldb2.stat.mode != '0640'

    - name: Check if TLS certificate directory exists
      ansible.builtin.stat:
        path: /etc/postfix/tls
      register: tls_dir
      failed_when: not tls_dir.stat.exists

    - name: Check mailname configuration
      ansible.builtin.slurp:
        src: /etc/mailname
      register: mailname_content

    - name: Verify mailname
      ansible.builtin.assert:
        that:
          - "'smtp-relay.test.local' in (mailname_content.content | b64decode)"
        fail_msg: "mailname not set correctly"
        success_msg: "mailname configured correctly"

    - name: Check if queue collector script is installed
      ansible.builtin.stat:
        path: /usr/local/sbin/postfix-queue-collector.sh
      register: queue_collector
      failed_when: not queue_collector.stat.exists or not queue_collector.stat.executable

    - name: Check queue collector timer status
      ansible.builtin.systemd:
        name: postfix-queue-collector.timer
      register: queue_timer
      failed_when:
        queue_timer.status.UnitFileState != 'enabled'
        or queue_timer.status.ActiveState != 'active'

    # Exercise the collector end-to-end: postfix_up computation, queue-depth
    # parsing, printf format, and atomic write. Run directly to sidestep the
    # systemd sandbox, then assert the emitted Prometheus text.
    - name: Run queue collector once
      ansible.builtin.command: /usr/local/sbin/postfix-queue-collector.sh /var/lib/node_exporter
      changed_when: false

    - name: Read generated postfix queue metrics
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/postfix_queue.prom
      register: postfix_queue_prom

    - name: Verify queue collector emitted expected metrics
      ansible.builtin.assert:
        that:
          - "'postfix_up 1' in (postfix_queue_prom.content | b64decode)"
          - "'postfix_queue_depth ' in (postfix_queue_prom.content | b64decode)"
          - "'postfix_queue_collector_last_success_seconds' in (postfix_queue_prom.content | b64decode)"
        fail_msg: "queue collector did not emit expected metrics"
        success_msg: "queue collector emitted expected Prometheus metrics"

    # Compiled-map repair (postfix_null_client/tasks/repair-compiled-maps.yml).
    # A converge rebuilds the .db files through notify, so build the opposite
    # shape: source correct, .db holding a retired value, handler not notified.
    - name: Stale db | compile both maps from retired values, then restore the sources
      ansible.builtin.shell: |
        set -eo pipefail
        cp -a /etc/aliases /tmp/aliases.managed
        printf 'root: retired@test.local\npostmaster: root\n' > /etc/aliases
        newaliases
        cp -a /tmp/aliases.managed /etc/aliases
        cp -a /etc/postfix/sasl_passwd /tmp/sasl_passwd.managed
        printf '[smtp.gmail.com]:587    retired:retired\n' > /etc/postfix/sasl_passwd
        postmap /etc/postfix/sasl_passwd
        cp -a /tmp/sasl_passwd.managed /etc/postfix/sasl_passwd
      args:
        executable: /bin/bash
      changed_when: true

    - name: Stale db | read both compiled maps before the repair
      ansible.builtin.command:
        cmd: "postmap -q {{ item.key }} hash:{{ item.map }}"
      register: smtp_relay_stale_before
      changed_when: false
      failed_when: false
      loop:
        - {key: root, map: /etc/aliases}
        - {key: '[smtp.gmail.com]:587', map: /etc/postfix/sasl_passwd}
      loop_control:
        label: "{{ item.map }}"

    # Both arms are asserted non-empty on purpose: that is precisely the state a
    # value-blind guard ("does root resolve to ANYTHING?") reads as healthy.
    - name: Stale db | the fixture must be stale, and stale in the value-blind way
      ansible.builtin.assert:
        that:
          - smtp_relay_stale_before.results[0].stdout | trim == 'retired@test.local'
          - smtp_relay_stale_before.results[1].stdout | trim == 'retired:retired'
        fail_msg: >-
          The stale-db fixture did not take, so the repair below is not being
          exercised against a stale database at all
        success_msg: "both compiled maps hold retired values while their sources are correct"

    - name: Stale db | drive the role's compiled-map repair
      ansible.builtin.include_role:
        name: weisssrv.infra.postfix_null_client
        tasks_from: repair-compiled-maps.yml
      vars:
        postfix_null_client_maps_root_alias: test@test.local

    - name: Stale db | read both compiled maps after the repair
      ansible.builtin.command:
        cmd: "postmap -q {{ item.key }} hash:{{ item.map }}"
      register: smtp_relay_stale_after
      changed_when: false
      failed_when: false
      loop:
        - {key: root, map: /etc/aliases}
        - {key: '[smtp.gmail.com]:587', map: /etc/postfix/sasl_passwd}
      loop_control:
        label: "{{ item.map }}"

    - name: Stale db | the repair must recompile both maps from their sources
      ansible.builtin.assert:
        that:
          - smtp_relay_stale_after.results[0].stdout | trim == 'test@test.local'
          - smtp_relay_stale_after.results[1].stdout | trim == 'testgmail@gmail.com:testgmailpass'
        # The SASL value is deliberately NOT echoed — on the real relay that
        # string is the upstream credential.
        fail_msg: >-
          A compiled map still holds a retired value after the repair
          (aliases='{{ smtp_relay_stale_after.results[0].stdout | trim }}',
          sasl map matched={{ smtp_relay_stale_after.results[1].stdout | trim == 'testgmail@gmail.com:testgmailpass' }})
          — a lost handler would leave the relay delivering root mail locally and
          authenticating upstream with a revoked credential, with nothing
          reporting changed
        success_msg: "the repair rebuilds a stale aliases.db and sasl_passwd.db"
