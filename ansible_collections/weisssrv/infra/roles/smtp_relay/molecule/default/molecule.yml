---
platforms:
  - name: smtp-relay-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        admin_user: root
        admin_email: test@test.local
        smtp_relay_upstream_user: testgmail@gmail.com
        smtp_relay_upstream_password: testgmailpass
        smtp_relay_sasl_user: testrelay
        smtp_relay_sasl_password: testrelaypass
        smtp_relay_tls_cert_dir: /etc/postfix/tls
        smtp_relay_internal_domain: test.local
        smtp_relay_upstream: '[smtp.gmail.com]:587'
        # Site deltas only: everything else comes from
        # smtp_relay_default_config, so the scenario exercises the merge and the
        # shipped hardening defaults rather than a scenario-local copy of them.
        smtp_relay_config:
          mynetworks: 127.0.0.0/8, 192.168.0.0/24
          smtpd_relay_restrictions: permit_mynetworks, permit_sasl_authenticated, reject_unauth_destination
          smtpd_tls_cert_file: /etc/postfix/tls/smtp-relay.test.local_ecc/fullchain.cer
          smtpd_tls_key_file: /etc/postfix/tls/smtp-relay.test.local_ecc/smtp-relay.test.local.key
