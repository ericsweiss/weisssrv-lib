---
# Host-side GPU VFIO codification; see defaults/main.yml for the gating and
# staged-not-applied contract.

- name: Assert PCI IDs are provided when passthrough is enabled
  ansible.builtin.assert:
    that:
      - vfio_passthrough_pci_ids | default([]) | length > 0
    fail_msg: >-
      vfio_passthrough_enabled is true but vfio_passthrough_pci_ids is empty.
      Set the GPU's PCI function IDs (vendor:device) so `options vfio-pci ids=`
      is well-formed — otherwise vfio-pci would bind nothing.
    success_msg: "vfio_passthrough_pci_ids provided ({{ vfio_passthrough_pci_ids | length }} function(s))"
  when: vfio_passthrough_enabled | default(false)

# The GRUB drop-in is only read by update-grub. A host whose cmdline comes from
# /etc/kernel/cmdline (systemd-boot / proxmox-boot-tool in UEFI mode) would stage
# nothing, report changed and never capture the card — refuse instead.
- name: Check for a systemd-boot kernel command line
  ansible.builtin.stat:
    path: /etc/kernel/cmdline
  register: vfio_passthrough_kernel_cmdline
  when: vfio_passthrough_enabled | default(false)

- name: Assert the host takes its kernel command line from GRUB
  ansible.builtin.assert:
    that:
      - not (vfio_passthrough_kernel_cmdline.stat.exists | default(false))
    fail_msg: >-
      {{ inventory_hostname }} carries /etc/kernel/cmdline, so its boot command
      line does not come from /etc/default/grub.d and these parameters would
      never reach the kernel. The role writes the GRUB drop-in only — see the
      role README, "Assumptions & scope".
    quiet: true
  when: vfio_passthrough_enabled | default(false)

# IOMMU kernel command line (GRUB drop-in)
- name: Ensure the GRUB drop-in directory exists
  ansible.builtin.file:
    path: /etc/default/grub.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: vfio_passthrough_enabled | default(false)

- name: Append the IOMMU kernel parameters via a GRUB drop-in
  ansible.builtin.template:
    src: grub-vfio.cfg.j2
    dest: /etc/default/grub.d/vfio-iommu.cfg
    owner: root
    group: root
    mode: "0644"
  when: vfio_passthrough_enabled | default(false)
  notify:
    - Update GRUB for VFIO
    - Warn that a VFIO reboot is required

# vfio-pci binding + host-driver blacklist (modprobe.d)
- name: Bind the GPU to vfio-pci and blacklist the host driver(s)
  ansible.builtin.template:
    src: vfio.conf.j2
    dest: /etc/modprobe.d/vfio.conf
    owner: root
    group: root
    mode: "0644"
  when: vfio_passthrough_enabled | default(false)
  notify:
    - Rebuild initramfs for VFIO
    - Warn that a VFIO reboot is required

# Force vfio-pci to load early — backup to the primary vfio-pci.ids= cmdline
# bind (README, "Binding mechanisms").
- name: Force vfio-pci to load early at boot
  ansible.builtin.template:
    src: modules-load-vfio.conf.j2
    dest: /etc/modules-load.d/vfio-pci.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - vfio_passthrough_enabled | default(false)
    - vfio_passthrough_force_load | default(true)
  notify:
    - Rebuild initramfs for VFIO
    - Warn that a VFIO reboot is required

- name: Remove the vfio-pci force-load when that knob is off
  ansible.builtin.file:
    path: /etc/modules-load.d/vfio-pci.conf
    state: absent
  when:
    - vfio_passthrough_enabled | default(false)
    - not (vfio_passthrough_force_load | default(true))
  notify:
    - Rebuild initramfs for VFIO
    - Warn that a VFIO reboot is required

# Turning the gate back off must release the device: left in place, the cmdline
# still captures the GPU and nouveau stays blacklisted forever. Removal is staged
# like the writes — the host releases the card on its next boot.
- name: Read the VFIO drop-ins before removing them
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ _vfio_passthrough_managed_paths }}"
  register: _vfio_passthrough_dropins
  failed_when: false
  when:
    - not (vfio_passthrough_enabled | default(false))
    - vfio_passthrough_manage_absent | default(true)

# CRITICAL: the three paths are the conventional VFIO names, not role-namespaced,
# so only a file carrying the role's marker is this role's to remove.
- name: Remove the role-written VFIO configuration when passthrough is disabled
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ _vfio_passthrough_dropins.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.content is defined
    - _vfio_passthrough_managed_marker in item.content | b64decode
  notify:
    - Update GRUB for VFIO
    - Rebuild initramfs for VFIO
    - Warn that a VFIO reboot is required

- name: Report a hand-written VFIO drop-in left in place
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} carries no '{{ _vfio_passthrough_managed_marker }}'
      marker, so it was written by hand
      and is left in place. The device stays captured until it is removed.
  loop: "{{ _vfio_passthrough_dropins.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.content is defined
    - _vfio_passthrough_managed_marker not in item.content | b64decode
