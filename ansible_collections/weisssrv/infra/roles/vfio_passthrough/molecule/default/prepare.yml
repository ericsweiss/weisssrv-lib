---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    # Render-only scenario: the role never installs apt packages, so import the
    # shared prepare-base (systemd-wait + temp-dir) WITHOUT prepare-apt-disable
    # (mirrors resolv_conf / home_assistant).
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    # Test fixture: the role does not create these directories, since kmod and
    # systemd ship them on a real host, but the minimal image lacks them.
    # /etc/default/grub.d is left out, because the role creates that one.
    - name: Ensure /etc/modprobe.d and /etc/modules-load.d exist (minimal test container may lack them)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/modprobe.d
        - /etc/modules-load.d
