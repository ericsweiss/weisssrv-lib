---
# Host-side GPU VFIO gate, reconciled both ways: true stages the IOMMU cmdline
# and vfio-pci binding, false removes them. A reboot applies either; the role
# warns rather than rebooting.
vfio_passthrough_enabled: false

# Lets the disabled arm remove the three VFIO drop-ins. Only a file carrying
# the role's own marker is removed; set false to leave every drop-in alone.
vfio_passthrough_manage_absent: true

# PCI IDs (vendor:device) bound to vfio-pci — one `ids=` list. REQUIRED when
# enabled (a preflight asserts it is non-empty). For a multifunction GPU list
# every function's ID so the whole device is captured.
vfio_passthrough_pci_ids: []

# Host kernel modules HARD-BLACKLISTED so they never claim their function of the
# device. A blacklisted module never loads, so it gets NO softdep — the softdep
# would never fire. vfio-pci claims the function via `ids=` instead.
vfio_passthrough_blacklist_modules:
  - nouveau
  # i2c_nvidia_gpu auto-loads on PCI match and claims the card's USB-C function
  # ahead of vfio-pci. Nothing else on a host uses it, so it is blacklisted
  # rather than softdep'd.
  - i2c_nvidia_gpu

# Host drivers that load at boot because they serve other devices, so they get
# `softdep <mod> pre: vfio-pci` instead of a blacklist. On a multifunction
# NVIDIA GPU these are the HD-audio and USB-C xHCI functions.
vfio_passthrough_softdep_modules:
  - snd_hda_intel
  - xhci_hcd

# Write /etc/modules-load.d/vfio-pci.conf so systemd-modules-load pulls vfio-pci
# in at real-root boot. Leave true: it backs up the primary cmdline bind
# (README, "Binding mechanisms").
vfio_passthrough_force_load: true

# Kernel command-line parameters appended via the GRUB drop-in. Swap
# intel_iommu=on for amd_iommu=on on an AMD host. The template also appends
# `vfio-pci.ids=`, so do not add an ids= entry here.
vfio_passthrough_cmdline_params:
  - "intel_iommu=on"
  - "iommu=pt"

# Skip the update-grub / update-initramfs handlers (molecule / check-mode): the
# config files still render, but the boot-artifact rebuilds — which need a real
# GRUB + /boot kernel — are suppressed so the role converges in a CI container.
vfio_passthrough_skip_boot_update: false
