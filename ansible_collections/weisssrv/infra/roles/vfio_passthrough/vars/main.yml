---
# The three drop-ins the role writes, shared by the write and removal arms.
_vfio_passthrough_managed_paths:
  - /etc/default/grub.d/vfio-iommu.cfg
  - /etc/modprobe.d/vfio.conf
  - /etc/modules-load.d/vfio-pci.conf

# The literal the three templates emit. It, not `ansible_managed`, marks a
# role-written drop-in, so a consumer's header change never orphans one.
_vfio_passthrough_managed_marker: managed by weisssrv.infra.vfio_passthrough
