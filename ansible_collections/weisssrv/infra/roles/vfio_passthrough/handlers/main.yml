---
# Regenerate the GRUB config so the appended IOMMU cmdline lands in the boot
# entries, refreshing the ESP copies too on a proxmox-boot-tool host. Skipped
# under molecule. Applies at the next reboot; the role never reboots.
- name: Update GRUB for VFIO
  ansible.builtin.shell: |
    set -euo pipefail
    update-grub
    if [ -e /etc/kernel/proxmox-boot-uuids ] && command -v proxmox-boot-tool >/dev/null 2>&1; then
      proxmox-boot-tool refresh
    fi
  args:
    executable: /bin/bash
  changed_when: true
  when: not (vfio_passthrough_skip_boot_update | default(false))

# vfio.conf is a load-time module config; the pools/drivers are decided during
# the initramfs at early boot, so bake it in there. Skipped under molecule.
- name: Rebuild initramfs for VFIO
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  when: not (vfio_passthrough_skip_boot_update | default(false))

# Print reboot-required; never auto-reboot. VFIO changes take effect only on the
# next boot, and the operator reboots in a maintenance window. Notified by the
# render tasks, so a no-op run stays quiet.
- name: Warn that a VFIO reboot is required
  ansible.builtin.debug:
    msg: >-
      VFIO passthrough config changed on {{ inventory_hostname }} — a HOST REBOOT
      is required to bind the GPU to vfio-pci (nouveau is now blacklisted and the
      IOMMU cmdline is staged). NOT rebooting automatically. Apply in a
      maintenance window.
