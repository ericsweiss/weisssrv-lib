---
# Verify the rendered Immich stack (render/contract scenario).
#
# The image-tag/digest literals below are an intentional contract test: they
# MUST be bumped in lockstep with this scenario's molecule.yml inventory, so a
# template that stops honouring a pin fails here.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    immich_compose_dir: /mnt/immich-app/compose
    immich_config_dir: /mnt/immich-app/config
  tasks:
    # docker-compose.yml
    - name: Slurp docker-compose.yml
      ansible.builtin.slurp:
        src: "{{ immich_compose_dir }}/docker-compose.yml"
      register: immich_compose

    - name: Verify compose pins images and wires metrics/config/network
      ansible.builtin.assert:
        that:
          - (immich_compose.content | b64decode) is search('immich-server:v3.0.3')
          - (immich_compose.content | b64decode) is search('immich-machine-learning:v3.0.3')
          - (immich_compose.content | b64decode) is search('immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357')
          - (immich_compose.content | b64decode) is search('valkey/valkey:9@sha256:4963247')
          - (immich_compose.content | b64decode) is search('IMMICH_CONFIG_FILE: /config/immich-config.json')
          - (immich_compose.content | b64decode) is search('IMMICH_TELEMETRY_INCLUDE: all')
          - (immich_compose.content | b64decode) is search('IMMICH_TRUSTED_PROXIES: 172.28.0.1')
          - (immich_compose.content | b64decode) is search('127.0.0.1:2283:2283')
          - (immich_compose.content | b64decode) is search('"8081:8081"')
          - (immich_compose.content | b64decode) is search('"8082:8082"')
          - (immich_compose.content | b64decode) is search('subnet: 172.28.0.0/16')
        fail_msg: "docker-compose.yml missing expected image pins / telemetry / network config"
        success_msg: "docker-compose.yml pins images and wires metrics, config, trusted proxy, network"

    - name: Verify the postgres exporter is absent by default
      ansible.builtin.assert:
        that:
          - (immich_compose.content | b64decode) is not search('postgres-exporter')
          - (immich_compose.content | b64decode) is not search('9187')
        fail_msg: "the opt-in postgres exporter leaked into the default compose file"
        success_msg: "docker-compose.yml carries no postgres exporter by default"

    # Enabled branch (side-rendered in converge).
    - name: Slurp the postgres-exporter compose render
      ansible.builtin.slurp:
        src: /tmp/immich-compose-pgexporter.yml
      register: immich_pgexporter_raw

    - name: Parse the postgres-exporter render as YAML (structural validity)
      ansible.builtin.set_fact:
        immich_pgexporter_doc: "{{ immich_pgexporter_raw.content | b64decode | from_yaml }}"

    - name: Verify the enabled branch adds a pinned exporter wired to the stack DB
      ansible.builtin.assert:
        that:
          - "'postgres-exporter' in immich_pgexporter_doc.services"
          - >-
            immich_pgexporter_doc.services['postgres-exporter'].image
            == 'quay.io/prometheuscommunity/postgres-exporter:0.19.0'
          - "'9187:9187' in immich_pgexporter_doc.services['postgres-exporter'].ports"
          # Credentials reuse the stack's .env, split across URI/USER/PASS.
          - >-
            immich_pgexporter_doc.services['postgres-exporter'].environment.DATA_SOURCE_URI
            == 'database:5432/immich?sslmode=disable'
          - >-
            immich_pgexporter_doc.services['postgres-exporter'].environment.DATA_SOURCE_USER
            == '${DB_USERNAME}'
          - >-
            immich_pgexporter_doc.services['postgres-exporter'].environment.DATA_SOURCE_PASS
            == '${DB_PASSWORD}'
          # The rest of the stack is unchanged by the toggle.
          - "'immich-server' in immich_pgexporter_doc.services"
          - "'database' in immich_pgexporter_doc.services"
        fail_msg: "the enabled postgres exporter did not render as a pinned, DB-wired service"
        success_msg: "enabling the postgres exporter adds a pinned service on 9187 using the stack's own credentials"

    # Compose .env (secret) — perms + content
    - name: Stat the compose .env
      ansible.builtin.stat:
        path: "{{ immich_compose_dir }}/.env"
      register: immich_env_stat

    - name: Verify .env perms
      ansible.builtin.assert:
        that:
          - immich_env_stat.stat.exists
          - immich_env_stat.stat.mode == '0640'
        fail_msg: ".env missing or not 0640 (holds DB_PASSWORD)"
        success_msg: ".env present with 0640 perms"

    - name: Slurp .env
      ansible.builtin.slurp:
        src: "{{ immich_compose_dir }}/.env"
      register: immich_env

    - name: Verify .env content
      ansible.builtin.assert:
        that:
          - (immich_env.content | b64decode) is search('UPLOAD_LOCATION=/mnt/immich-data/library')
          - (immich_env.content | b64decode) is search('DB_DATA_LOCATION=/mnt/immich-postgres')
          - (immich_env.content | b64decode) is search('DB_USERNAME=postgres')
          - (immich_env.content | b64decode) is search('TZ=America/Los_Angeles')
          # DB_PASSWORD is double-quoted + escaped for the compose-go dotenv
          # parser; the test secret has no special chars so it round-trips as-is.
          - (immich_env.content | b64decode) is search('DB_PASSWORD="testdbpassword123"')
          # Image tags are pinned in docker-compose.yml, so IMMICH_VERSION is
          # intentionally NOT set in .env — assert it stays absent.
          - (immich_env.content | b64decode) is not search('IMMICH_VERSION=')
        fail_msg: ".env missing expected storage/timezone/database keys"
        success_msg: ".env carries storage, timezone and database configuration"

    # System config file (SSO-only default state)
    - name: Slurp the rendered immich-config.json
      ansible.builtin.slurp:
        src: "{{ immich_config_dir }}/immich-config.json"
      register: immich_config_raw

    - name: Parse immich-config.json (asserts valid JSON)
      ansible.builtin.set_fact:
        immich_config: "{{ immich_config_raw.content | b64decode | from_json }}"

    - name: Verify SSO-only config (default state)
      ansible.builtin.assert:
        that:
          - immich_config.passwordLogin.enabled == false
          - immich_config.oauth.enabled == true
          - immich_config.oauth.autoLaunch == true
          - immich_config.oauth.autoRegister == true
          - immich_config.oauth.issuerUrl == 'https://auth.example.com/application/o/photos/'
          - immich_config.oauth.clientId == 'test-immich-client-id'
          - immich_config.oauth.clientSecret == 'test-immich-client-secret'
          - immich_config.oauth.scope == 'openid email profile'
          - immich_config.oauth.storageLabelClaim == 'preferred_username'
          # Unset quota renders as JSON null (unlimited), not 0 or "".
          - immich_config.oauth.defaultStorageQuota is none
          # ML endpoints: configured primary first, in-VM CPU failover second —
          # ORDER matters (upstream tries the urls sequentially).
          - immich_config.machineLearning.enabled == true
          - immich_config.machineLearning.urls == ['http://10.10.0.58:3003', 'http://immich-machine-learning:3003']
          - immich_config.backup.database.enabled == false
          - immich_config.server.externalDomain == 'https://photos.example.com'
        fail_msg: "immich-config.json is not in the expected SSO-only state"
        success_msg: "immich-config.json renders SSO-only (password login off, oauth on)"

    # System config file (bootstrap branch, side-rendered in converge)
    - name: Slurp the bootstrap-mode config
      ansible.builtin.slurp:
        src: /tmp/immich-config-bootstrap.json
      register: immich_bootstrap_raw

    - name: Parse bootstrap-mode config
      ansible.builtin.set_fact:
        immich_bootstrap_config: "{{ immich_bootstrap_raw.content | b64decode | from_json }}"

    - name: Verify bootstrap branch enables password login and disables oauth
      ansible.builtin.assert:
        that:
          - immich_bootstrap_config.passwordLogin.enabled == true
          - immich_bootstrap_config.oauth.enabled == false
          - immich_bootstrap_config.oauth.autoLaunch == false
        fail_msg: "bootstrap-mode config did not flip password login on / oauth off"
        success_msg: "bootstrap-mode config enables the admin-registration escape hatch"

    # nginx site
    - name: Slurp the nginx site
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/immich.conf
      register: immich_nginx

    - name: Verify nginx reverse-proxy config
      ansible.builtin.assert:
        that:
          - (immich_nginx.content | b64decode) is search('proxy_pass http://127.0.0.1:2283')
          - (immich_nginx.content | b64decode) is search('client_max_body_size 0')
          - (immich_nginx.content | b64decode) is search('ssl_certificate\s+/etc/nginx/ssl/fullchain.pem')
          - (immich_nginx.content | b64decode) is search('proxy_set_header Upgrade')
          - (immich_nginx.content | b64decode) is search('X-Forwarded-Proto')
          # TLS 1.3 floor: 1.2 dropped.
          - (immich_nginx.content | b64decode) is search('ssl_protocols TLSv1.3;')
          - (immich_nginx.content | b64decode) is not search('TLSv1.2')
        fail_msg: "nginx site missing proxy_pass / body-size / TLS1.3 / websocket / forwarded headers"
        success_msg: "nginx site terminates TLS and proxies to Immich with uploads + websockets"

    # Real-IP trust list: derived from the inventory groups, one entry per
    # member's ansible_host (the converge seeds two fixture proxies).
    - name: Verify the real-IP trust list came from the inventory groups
      ansible.builtin.assert:
        that:
          - (immich_nginx.content | b64decode) is search('set_real_ip_from 10.10.0.11;')
          - (immich_nginx.content | b64decode) is search('set_real_ip_from 10.10.0.21;')
          - (immich_nginx.content | b64decode) is search('real_ip_recursive on;')
          # The guest's own hostname is not a proxy and must never be trusted.
          - (immich_nginx.content | b64decode) is not search('set_real_ip_from immich-test')
        fail_msg: "nginx real_ip trust list was not derived from the k3s_servers/k3s_agents groups"
        success_msg: "nginx trusts exactly the addresses derived from the configured proxy groups"

    - name: Verify the default nginx site was removed
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: immich_default_site
      failed_when: immich_default_site.stat.exists

    - name: Verify the self-signed TLS placeholder was seeded
      ansible.builtin.stat:
        path: /etc/nginx/ssl/fullchain.pem
      register: immich_placeholder_cert
      failed_when: not immich_placeholder_cert.stat.exists

    # systemd units
    - name: Stat the systemd units
      ansible.builtin.stat:
        path: "{{ item }}"
      register: immich_units
      failed_when: not immich_units.stat.exists
      loop:
        - /etc/systemd/system/immich-compose.service
        - /etc/systemd/system/immich-backup.service
        - /etc/systemd/system/immich-backup.timer

    - name: Slurp the backup service unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/immich-backup.service
      register: immich_backup_unit

    - name: Verify the backup unit is ordered behind its landing mount
      ansible.builtin.assert:
        that:
          - (immich_backup_unit.content | b64decode) is search('RequiresMountsFor=/mnt/immich-app/backups')
          - (immich_backup_unit.content | b64decode) is search('After=docker.service immich-compose.service')
        fail_msg: "immich-backup.service lost its mount/compose ordering"
        success_msg: "immich-backup.service waits for the landing mount and the compose stack"

    # Backup wrapper — metric paths (mock docker from prepare.yml)
    - name: Stat the backup wrapper
      ansible.builtin.stat:
        path: /usr/local/sbin/immich-backup-run.sh
      register: immich_backup_wrapper

    - name: Verify the backup wrapper is present with correct perms
      ansible.builtin.assert:
        that:
          - immich_backup_wrapper.stat.exists
          - immich_backup_wrapper.stat.mode == '0755'
        fail_msg: "immich-backup-run.sh missing or wrong perms"
        success_msg: "immich-backup-run.sh present (0755)"

    # Fail-closed NFS guard contract (render-level: the scenario runs with
    # immich_backup_nfs_enabled=false, so the guard is present but inert).
    - name: Read the backup wrapper render
      ansible.builtin.slurp:
        src: /usr/local/sbin/immich-backup-run.sh
      register: immich_backup_raw

    - name: Assert the wrapper carries the fail-closed NFS mountpoint guard
      ansible.builtin.assert:
        that:
          - "'mountpoint -q' in (immich_backup_raw.content | b64decode)"
          - "'NFS-backed but not mounted' in (immich_backup_raw.content | b64decode)"
        fail_msg: "immich-backup-run.sh missing the fail-closed NFS mountpoint guard"
        success_msg: "immich-backup-run.sh carries the fail-closed NFS guard"

    # …and the guard must also report an EMPTY landing zone. A shadow dump left
    # under an unmounted mountpoint sits on the root disk and is not offsite:
    # sizing it would report a healthy artefact for a landing zone nothing can
    # reach and suppress BackupArtifactEmpty. Rendered copy with NFS_ENABLED=1
    # over a plain (non-mountpoint) directory holding exactly such a dump.
    - name: Seed a shadow dump under a non-mountpoint landing zone
      ansible.builtin.shell: |
        set -eo pipefail
        mkdir -p /tmp/immich-nfs-guard /tmp/immich-nfs-guard-prom
        dd if=/dev/zero of=/tmp/immich-nfs-guard/immich-20200101-000000.sql.gz bs=4096 count=1
        sed -e 's|^BACKUP_DIR=.*|BACKUP_DIR="/tmp/immich-nfs-guard"|' \
            -e 's|^PROM_DIR=.*|PROM_DIR="/tmp/immich-nfs-guard-prom"|' \
            -e 's|^NFS_ENABLED=.*|NFS_ENABLED="1"|' \
            /usr/local/sbin/immich-backup-run.sh > /tmp/immich-backup-run-nfs.sh
      args:
        executable: /bin/bash
      changed_when: false

    # Invoked via bash: /tmp is a noexec tmpfs here, and a bare rc != 0 check
    # would accept the 126 that direct execution returns. rc must be exactly 1.
    - name: Run the wrapper against an unmounted landing zone
      ansible.builtin.command: bash /tmp/immich-backup-run-nfs.sh
      register: immich_backup_nfs_run
      changed_when: false
      failed_when: immich_backup_nfs_run.rc != 1

    - name: Read the fail-closed guard's metric
      ansible.builtin.slurp:
        src: /tmp/immich-nfs-guard-prom/immich_backup.prom
      register: immich_backup_nfs_prom

    - name: Assert the unmounted abort reports success=0 AND size 0
      ansible.builtin.assert:
        that:
          - "'immich_backup_last_run_success 0' in (immich_backup_nfs_prom.content | b64decode)"
          - "'immich_backup_last_size_bytes 0' in (immich_backup_nfs_prom.content | b64decode)"
        fail_msg: >-
          The unmounted-landing-zone abort sized a shadow dump on the root disk
          instead of reporting 0 — BackupArtifactEmpty would stay green for a
          backup that is not offsite.
        success_msg: "The unmounted-landing-zone abort reports success=0 and size 0"

    - name: Run the backup wrapper (success path)
      ansible.builtin.command: /usr/local/sbin/immich-backup-run.sh
      changed_when: false

    - name: Read immich_backup.prom after success
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/immich_backup.prom
      register: immich_prom_ok

    - name: Assert all metrics present on success
      ansible.builtin.assert:
        that:
          - "'immich_backup_last_run_success 1' in (immich_prom_ok.content | b64decode)"
          - "'immich_backup_last_run_duration_seconds ' in (immich_prom_ok.content | b64decode)"
          - "'immich_backup_last_success_timestamp_seconds ' in (immich_prom_ok.content | b64decode)"
          - "'immich_backup_last_size_bytes ' in (immich_prom_ok.content | b64decode)"
        fail_msg: "immich_backup.prom missing expected metrics on success"
        success_msg: "immich_backup.prom emits all metrics on success"

    - name: Capture the success timestamp (to assert preservation on failure)
      ansible.builtin.shell: >-
        awk '/^immich_backup_last_success_timestamp_seconds/ {print $2}'
        /var/lib/node_exporter/immich_backup.prom
      register: immich_ts_ok
      changed_when: false

    # A failed dump must NOT report 0 bytes while good dumps sit in the landing
    # zone: 0 means "no artefact exists at all", whose runbook is a landing-path
    # fault, not "tonight's dump failed". Seeded at a known size (and newest by
    # mtime) so the fallback is asserted on an exact number.
    - name: Seed a known-size prior dump for the failure path
      ansible.builtin.command:
        cmd: dd if=/dev/zero of=/mnt/immich-app/backups/immich-20200101-000000.sql.gz bs=4096 count=1
        creates: /mnt/immich-app/backups/immich-20200101-000000.sql.gz

    - name: Arm the backup failure
      ansible.builtin.file:
        path: /tmp/immich-backup-fail
        state: touch
        mode: "0644"

    - name: Run the backup wrapper (failure path)
      ansible.builtin.command: /usr/local/sbin/immich-backup-run.sh
      register: immich_backup_fail
      changed_when: false
      failed_when: immich_backup_fail.rc == 0

    - name: Read immich_backup.prom after failure
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/immich_backup.prom
      register: immich_prom_fail

    - name: Assert failure records success=0 and preserves the prior timestamp
      ansible.builtin.assert:
        that:
          - "'immich_backup_last_run_success 0' in (immich_prom_fail.content | b64decode)"
          - >-
            'immich_backup_last_success_timestamp_seconds ' ~ immich_ts_ok.stdout
            in (immich_prom_fail.content | b64decode)
          # Sized from the seeded prior dump, not 0 — see the seed task above.
          - "'immich_backup_last_size_bytes 4096' in (immich_prom_fail.content | b64decode)"
        fail_msg: >-
          failure path did not record success=0, lost the prior success
          timestamp, or reported 0 bytes while a good dump was in the landing
          zone (a false "no artefact at all" page)
        success_msg: "failure path records success=0, keeps the timestamp, and sizes the newest existing dump"

    - name: Disarm the backup failure
      ansible.builtin.file:
        path: /tmp/immich-backup-fail
        state: absent

    # Atomic publication. The NAS artefact collector and the offsite file walk
    # key on the FINAL `immich-*.sql.gz` name, so a dump must never appear under
    # it before it is complete and validated. Run against a dedicated landing
    # zone (the assertions above pin the real one's contents) with the mock
    # docker snapshotting that directory mid-stream.
    - name: Stage a dedicated landing zone for the atomic-publish test
      ansible.builtin.shell: |
        set -eo pipefail
        rm -rf /tmp/immich-partial /tmp/immich-partial-prom /tmp/immich-inflight.txt
        rm -f /tmp/immich-inflight.txt.partial
        mkdir -p /tmp/immich-partial /tmp/immich-partial-prom
        sed -e 's|^BACKUP_DIR=.*|BACKUP_DIR="/tmp/immich-partial"|' \
            -e 's|^PROM_DIR=.*|PROM_DIR="/tmp/immich-partial-prom"|' \
            /usr/local/sbin/immich-backup-run.sh > /tmp/immich-backup-run-partial.sh
      args:
        executable: /bin/bash
      changed_when: false

    - name: Run the wrapper with the in-flight probe armed (success path)
      ansible.builtin.command: bash /tmp/immich-backup-run-partial.sh
      environment:
        IMMICH_INFLIGHT_PROBE: /tmp/immich-inflight.txt
        IMMICH_INFLIGHT_DIR: /tmp/immich-partial
      changed_when: false

    - name: Collect the in-flight and post-run landing-zone state
      ansible.builtin.shell: |
        set -o pipefail
        wc -l < /tmp/immich-inflight.txt | tr -d '[:space:]'
        echo
        wc -l < /tmp/immich-inflight.txt.partial | tr -d '[:space:]'
        echo
        find /tmp/immich-partial -maxdepth 1 -name 'immich-*.sql.gz' | wc -l | tr -d '[:space:]'
        echo
        find /tmp/immich-partial -maxdepth 1 -name '*.partial' | wc -l | tr -d '[:space:]'
        echo
      args:
        executable: /bin/bash
      register: immich_partial_state
      changed_when: false

    - name: Assert the dump was invisible under the final name while it streamed
      ansible.builtin.assert:
        that:
          # 0 final-name files mid-stream, 1 .partial being written…
          - immich_partial_state.stdout_lines[0] == '0'
          - immich_partial_state.stdout_lines[1] == '1'
          # …and exactly one COMPLETE dump afterwards, with no .partial litter.
          - immich_partial_state.stdout_lines[2] == '1'
          - immich_partial_state.stdout_lines[3] == '0'
        fail_msg: >-
          The dump was visible under its final name while pg_dumpall was still
          streaming (or a .partial was left behind) — the collector and the
          offsite walk would treat an in-progress dump as tonight's backup.
        success_msg: "The dump streams to .partial and is renamed in only after validation"

    # The destructive direction: a truncated dump (under the size floor) must
    # leave NOTHING behind — no final-name artefact for the collector to trust,
    # and no .partial litter.
    - name: Arm a truncated dump
      ansible.builtin.file:
        path: /tmp/immich-backup-tiny
        state: touch
        mode: "0644"

    - name: Run the wrapper with a truncated dump (must fail)
      ansible.builtin.command: bash /tmp/immich-backup-run-partial.sh
      register: immich_backup_tiny
      changed_when: false
      failed_when: immich_backup_tiny.rc == 0

    - name: Collect the landing-zone state after the truncated dump
      ansible.builtin.shell: |
        set -o pipefail
        find /tmp/immich-partial -maxdepth 1 -name 'immich-*.sql.gz' | wc -l | tr -d '[:space:]'
        echo
        find /tmp/immich-partial -maxdepth 1 -name '*.partial' | wc -l | tr -d '[:space:]'
        echo
      args:
        executable: /bin/bash
      register: immich_tiny_state
      changed_when: false

    - name: Assert the truncated dump was never published and left no litter
      ansible.builtin.assert:
        that:
          # Still only the earlier COMPLETE dump; the truncated one is gone.
          - immich_tiny_state.stdout_lines[0] == '1'
          - immich_tiny_state.stdout_lines[1] == '0'
        fail_msg: >-
          A truncated dump reached the final name (or its .partial survived) —
          the collector would size a dump that cannot restore.
        success_msg: "A truncated dump is never published and leaves no .partial behind"

    - name: Disarm the truncated dump
      ansible.builtin.file:
        path: /tmp/immich-backup-tiny
        state: absent
