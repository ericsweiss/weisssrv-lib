---
# Immich (docker compose) behind a host nginx TLS terminator.
#
# Required inputs (empty here, asserted in tasks/main.yml): the five image pins,
# immich_external_url, immich_oauth_issuer_url and the three credentials. Worked
# example and the SSO bootstrap procedure: README.md.

# Render-only escape hatch: gates every step that needs Docker, nginx or a
# systemd service, so a scenario can render + assert the templates without a
# container runtime. Mapped onto compose_app_skip_install at each include.
immich_skip_install: false

# Compose project layout. The database and the photo library get their own
# volumes; everything else sits under app_dir.
immich_app_dir: /mnt/immich-app
immich_compose_dir: "{{ immich_app_dir }}/compose"
immich_config_dir: "{{ immich_app_dir }}/config"
immich_model_cache_dir: "{{ immich_app_dir }}/model-cache"
immich_db_data_location: /mnt/immich-postgres
immich_data_dir: /mnt/immich-data
# Subdir, not the mount root; maps to the container's /data.
immich_upload_location: "{{ immich_data_dir }}/library"

# Block devices mounted before anything else (zvol_mount schema).
immich_additional_disks: "{{ vm_additional_disks | default([]) }}"

# Rendered as server.externalDomain. Required.
immich_external_url: ""

immich_timezone: "{{ timezone | default('UTC') }}"

# Image pins (required). Immich couples its Postgres image to each release, so
# the DB tag MUST come from the pinned release's own docker-compose.yml — never
# bump it independently.
immich_version: ""
immich_postgres_version: ""
immich_postgres_digest: ""
immich_valkey_version: ""
immich_valkey_digest: ""
immich_server_image: "ghcr.io/immich-app/immich-server:{{ immich_version }}"
immich_postgres_image: "ghcr.io/immich-app/postgres:{{ immich_postgres_version }}@{{ immich_postgres_digest }}"
immich_valkey_image: "docker.io/valkey/valkey:{{ immich_valkey_version }}@{{ immich_valkey_digest }}"
# In-VM CPU machine-learning container. Named apart from the immich_ml role's
# own immich_ml_image (the GPU variant) so an inventory-wide set cannot reach
# the other guest.
immich_machine_learning_image: "ghcr.io/immich-app/immich-machine-learning:{{ immich_version }}"

# Deterministic compose network so IMMICH_TRUSTED_PROXIES can name the bridge
# gateway the host nginx SNATs through. Must not collide with the site's LAN or
# any cluster pod/service CIDR.
immich_compose_subnet: "172.28.0.0/16"
immich_compose_gateway: "172.28.0.1"

# Matching Immich's own example.env lets pg_dumpall authenticate over the local
# socket with no password.
immich_db_username: postgres
immich_db_database_name: immich
immich_db_password: "{{ lookup('ansible.builtin.env', 'IMMICH_DB_PASSWORD') }}"

# machineLearning.urls, tried IN ORDER (upstream failover). Prepend a dedicated
# inference endpoint to make it primary and keep the CPU container as failover.
immich_ml_urls:
  - "http://immich-machine-learning:3003"

# IMMICH_TELEMETRY_INCLUDE=all exposes /metrics on both immich-server ports.
immich_telemetry_include: all
immich_api_metrics_port: 8081
immich_microservices_metrics_port: 8082

# Publish address for every metrics port. All of them are UNAUTHENTICATED, and
# the default publishes on every interface — pin it to 127.0.0.1, or to the
# scrape-facing address with the ports firewalled to the scrapers.
immich_metrics_bind: "0.0.0.0"

# Opt-in postgres_exporter sidecar (DB-level metrics). Reuses the stack's .env
# credentials; requires a pinned image.
immich_postgres_exporter_enabled: false
immich_postgres_exporter_version: ""
immich_postgres_exporter_digest: ""
immich_postgres_exporter_image: >-
  quay.io/prometheuscommunity/postgres-exporter:{{ immich_postgres_exporter_version
  }}{{ ('@' ~ immich_postgres_exporter_digest) if immich_postgres_exporter_digest else '' }}
# Host port, published on immich_metrics_bind like the metrics ports above.
immich_postgres_exporter_port: 9187

# SSO (OIDC). The issuer is the provider's application URL — Immich appends
# /.well-known/openid-configuration itself. Required.
immich_oauth_issuer_url: ""
immich_oauth_scope: "openid email profile"
immich_oauth_button_text: "Sign in with SSO"
# Claim used as the per-user storage label (folder naming).
immich_oauth_storage_label_claim: "preferred_username"
# autoRegister provisions an account on first OIDC login; gate WHO may reach the
# callback in the identity provider, not here.
immich_oauth_auto_register: true
immich_oauth_auto_launch: true
# Per-user default quota in GiB for auto-registered accounts. Empty = unlimited
# (rendered as JSON null); an integer caps new users.
immich_oauth_default_storage_quota: ""
immich_oauth_client_id: "{{ lookup('ansible.builtin.env', 'IMMICH_OAUTH_CLIENT_ID') }}"
immich_oauth_client_secret: "{{ lookup('ansible.builtin.env', 'IMMICH_OAUTH_CLIENT_SECRET') }}"

# One-time SSO bootstrap: enables password login and disables OIDC auto-launch
# so the FIRST (owner) account can be created — auto-register only ever mints
# regular users. Flip back to false and redeploy. Procedure: README.md.
immich_bootstrap_mode: false

# Off so the external pg_dump timer below is the single backup path. Verify the
# config key on major upgrades.
immich_builtin_db_backup_enabled: false

# Host nginx (TLS terminator in front of the compose stack)
immich_server_listen_port: 2283
immich_nginx_ssl_cert: /etc/nginx/ssl/fullchain.pem
immich_nginx_ssl_key: /etc/nginx/ssl/privkey.pem
# Placeholder until cert distribution delivers the real certificate. Set the
# subject/SAN to the name the fronting proxy uses for SNI.
immich_nginx_self_signed_subj: "/CN={{ inventory_hostname }}"
immich_nginx_self_signed_san: ""

# Only a genuine proxy hop may be trusted: a trusted range that can also connect
# DIRECTLY lets such a client forge the client IP. Derived from inventory; set
# immich_nginx_real_ip_from directly to bypass.
immich_nginx_real_ip_groups:
  - k3s_servers
  - k3s_agents
immich_nginx_real_ip_from: >-
  {{ immich_nginx_real_ip_groups | map('extract', groups) | select('defined')
     | flatten | map('extract', hostvars, 'ansible_host')
     | select('defined') | list }}
# An empty derivation is asserted, not accepted — every request would otherwise
# be attributed to the fronting proxy. True only where nginx is directly exposed.
immich_nginx_trust_no_proxy: false

# Backups: nightly pg_dumpall, with a node_exporter textfile freshness metric.
immich_backup_hour: "02"
immich_backup_minute: "30"
# Raise this when the dumps are the only copy.
immich_backup_keep_days: 3
immich_backup_metrics_dir: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}"
# Sourceable write_prom_metrics helper library (deployed by compose_app).
immich_backup_lib_path: /usr/local/lib/immich-backup-lib.sh

# Offsite backup landing zone: lands the dump on an NFS export so a file-walking
# offsite backup can see it (a file walk cannot read a zvol). Mount BY HOSTNAME
# when the export requires TLS — a wildcard cert has no IP SAN — and give the
# guest a tlshd (weisssrv.infra.nfs_tls).
immich_backup_nfs_enabled: false
immich_backup_nfs_server: ""
immich_backup_nfs_export: ""
immich_backup_mountpoint: /mnt/backups-offsite
immich_backup_nfs_options: "vers=4.2,rw,hard,noatime,_netdev,nofail,xprtsec=tls"
# Resolved from the toggle so enabling the offsite landing is a single flag.
immich_backup_dir: "{{ immich_backup_mountpoint if immich_backup_nfs_enabled else immich_app_dir + '/backups' }}"
