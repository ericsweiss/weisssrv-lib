---
# The compose-stack restart and nginx reload handlers live in compose_app
# ("Restart compose stack" / "Reload nginx (compose_app)"), notified by the
# config/.env/compose renders and by its nginx task flow. This role keeps only
# the reload for its own backup service + timer units; daemon_reload is safe
# anywhere systemd runs, so it is never gated.
- name: Reload systemd for immich-backup
  ansible.builtin.systemd:
    daemon_reload: true
