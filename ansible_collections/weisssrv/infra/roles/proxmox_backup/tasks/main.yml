---
# Declarative Proxmox storage entries (storage.cfg) + vzdump backup jobs
# (jobs.cfg), reconciled via pvesh. Both files live on the clustered /etc/pve
# filesystem, so wire this role into a play that targets a single node.

# Named here rather than as a Jinja undefined error from inside a pvesh
# argument list, which surfaces after the reads have already run and names a
# variable instead of the offending entry.
- name: Assert every storage entry carries its required keys
  ansible.builtin.assert:
    that:
      - item.id is defined and item.id | length > 0
      - item.type is defined and item.type | length > 0
      - item.content is defined and item.content | length > 0
    fail_msg: >-
      proxmox_backup_storage entry {{ item }} needs id, type and content
      (see README § Configuration).
    quiet: true
  loop: "{{ proxmox_backup_storage }}"
  loop_control:
    label: "{{ item.id | default('<no id>') }}"
  tags: [proxmox_backup, proxmox_backup_storage]

- name: Assert every vzdump job carries its required keys
  ansible.builtin.assert:
    that:
      - item.id is defined and item.id | length > 0
      - item.storage is defined and item.storage | length > 0
      - item.schedule is defined and item.schedule | length > 0
    fail_msg: >-
      proxmox_backup_vzdump_jobs entry {{ item }} needs id, storage and
      schedule (see README § Configuration).
    quiet: true
  loop: "{{ proxmox_backup_vzdump_jobs }}"
  loop_control:
    label: "{{ item.id | default('<no id>') }}"
  tags: [proxmox_backup, proxmox_backup_jobs]

# Storage entries (/storage)
- name: Manage Proxmox storage entries
  when: proxmox_backup_storage | length > 0
  tags: [proxmox_backup, proxmox_backup_storage]
  block:
    - name: Get current Proxmox storage entries
      ansible.builtin.command: pvesh get /storage --output-format json
      register: proxmox_backup_storage_current_raw
      changed_when: false
      check_mode: false

    - name: Parse current storage entries
      ansible.builtin.set_fact:
        _proxmox_backup_current_storage: "{{ proxmox_backup_storage_current_raw.stdout | from_json }}"
        _proxmox_backup_current_storage_ids: >-
          {{ proxmox_backup_storage_current_raw.stdout | from_json | map(attribute='storage') | list }}

    # argv, not a command string: a site value containing whitespace would
    # otherwise be re-split by the module into extra arguments.
    - name: Create missing Proxmox storage entries
      ansible.builtin.command:
        argv: >-
          {{ ['pvesh', 'create', '/storage',
              '--storage', item.id,
              '--type', item.type]
             + (['--server', item.server] if item.server is defined else [])
             + (['--export', item.export] if item.export is defined else [])
             + (['--path', item.path] if item.path is defined else [])
             + (['--pool', item.pool] if item.pool is defined else [])
             + ['--content', item.content]
             + (['--nodes', item.nodes] if item.nodes is defined else [])
             + (['--mountpoint', item.mountpoint] if item.mountpoint is defined else [])
             + (['--sparse', item.sparse | ternary('1', '0')] if item.sparse is defined else [])
             + (['--options', item.options] if item.options is defined else []) }}
      when: item.id not in _proxmox_backup_current_storage_ids
      loop: "{{ proxmox_backup_storage }}"
      loop_control:
        label: "{{ item.id }}"
      register: proxmox_backup_storage_create_result
      changed_when: proxmox_backup_storage_create_result.rc == 0

    # server/export/path/pool are create-fixed in Proxmox's storage plugins —
    # `pvesh set` cannot change them. Fail loud with the manual recreation
    # procedure instead of leaving the vars silently diverged from live state.
    # `pool` matters beyond drift bookkeeping: a zfspool id recreated against a
    # pool ROOT instead of the intended child dataset lands every new guest disk
    # on whatever that root's encryption property is, with no other signal.
    - name: Assert create-fixed storage properties have not drifted
      vars:
        _current: >-
          {{ _proxmox_backup_current_storage | selectattr('storage', 'equalto', item.id) | first }}
      ansible.builtin.assert:
        that:
          - item.server is not defined or (_current.server | default('')) == item.server
          - item.export is not defined or (_current.export | default('')) == item.export
          - item.path is not defined or (_current.path | default('')) == item.path
          - item.pool is not defined or (_current.pool | default('')) == item.pool
        fail_msg: >-
          Storage '{{ item.id }}' exists with different create-fixed properties
          (live: server={{ _current.server | default('-') }}
          export={{ _current.export | default('-') }}
          path={{ _current.path | default('-') }}
          pool={{ _current.pool | default('-') }};
          config: server={{ item.server | default('-') }}
          export={{ item.export | default('-') }}
          path={{ item.path | default('-') }}
          pool={{ item.pool | default('-') }}).
          Proxmox cannot update these in place — recreate the entry manually
          outside a backup window: `pvesh delete /storage/{{ item.id }}`
          (removes only the storage.cfg entry, never the data behind it),
          then re-run this role to create it from config.
        success_msg: "Storage '{{ item.id }}': fixed properties match."
      when: item.id in _proxmox_backup_current_storage_ids
      loop: "{{ proxmox_backup_storage }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Reconcile mutable storage properties (content, nodes, mountpoint, sparse, options)
      vars:
        _current: >-
          {{ _proxmox_backup_current_storage | selectattr('storage', 'equalto', item.id) | first }}
        # Proxmox normalizes/reorders comma lists — compare as sorted sets.
        _current_content: "{{ _current.content | default('') | split(',') | map('trim') | select() | sort | list }}"
        _desired_content: "{{ item.content | split(',') | map('trim') | select() | sort | list }}"
        _current_options: "{{ _current.options | default('') | split(',') | map('trim') | select() | sort | list }}"
        _desired_options: "{{ item.options | default(_current.options | default('')) | split(',') | map('trim') | select() | sort | list }}"
        # An undefined desired value inherits the live one, so a config that
        # does not express a property never registers as drift.
        _current_nodes: "{{ _current.nodes | default('') | split(',') | map('trim') | select() | sort | list }}"
        _desired_nodes: "{{ item.nodes | default(_current.nodes | default('')) | split(',') | map('trim') | select() | sort | list }}"
        _current_mountpoint: "{{ _current.mountpoint | default('') }}"
        _desired_mountpoint: "{{ item.mountpoint | default(_current.mountpoint | default('')) }}"
        # PVE omits `sparse` when it is off, so an absent live value reads as 0.
        _current_sparse: "{{ _current.sparse | default(0) | string }}"
        _desired_sparse: >-
          {{ (item.sparse | ternary('1', '0')) if item.sparse is defined else _current_sparse }}
        _has_drift: >-
          {{ _current_content != _desired_content or
             _current_options != _desired_options or
             _current_nodes != _desired_nodes or
             _current_mountpoint != _desired_mountpoint or
             _current_sparse != _desired_sparse }}
      ansible.builtin.command:
        argv: >-
          {{ ['pvesh', 'set', '/storage/' ~ item.id,
              '--content', item.content]
             + (['--nodes', item.nodes] if item.nodes is defined else [])
             + (['--mountpoint', item.mountpoint] if item.mountpoint is defined else [])
             + (['--sparse', item.sparse | ternary('1', '0')] if item.sparse is defined else [])
             + (['--options', item.options] if item.options is defined else []) }}
      when:
        - item.id in _proxmox_backup_current_storage_ids
        - _has_drift | bool
      loop: "{{ proxmox_backup_storage }}"
      loop_control:
        label: "{{ item.id }}"
      register: proxmox_backup_storage_set_result
      changed_when: proxmox_backup_storage_set_result.rc == 0

# vzdump backup jobs (/cluster/backup)
- name: Manage vzdump backup jobs
  when: proxmox_backup_vzdump_jobs | length > 0
  tags: [proxmox_backup, proxmox_backup_jobs]
  block:
    # The hookscript belongs to weisssrv.infra.node_exporter_host, which puts it
    # on EVERY Proxmox host (a cluster-wide `all` job runs on each node and
    # invokes the hook there). That role typically runs after this one, and
    # pvesh validates the --script path when the job is saved — so run its
    # hookscript task here first. Skipped unless a job sets `script`.
    - name: Ensure vzdump metrics hookscript exists before pvesh validates it
      ansible.builtin.include_role:
        name: weisssrv.infra.node_exporter_host
        tasks_from: vzdump_hook
        apply:
          tags: [proxmox_backup, proxmox_backup_jobs]
      when: proxmox_backup_vzdump_jobs | selectattr('script', 'defined') | list | length > 0

    - name: Get current vzdump backup jobs
      ansible.builtin.command: pvesh get /cluster/backup --output-format json
      register: proxmox_backup_current_raw
      changed_when: false
      check_mode: false

    - name: Parse current vzdump backup jobs
      ansible.builtin.set_fact:
        _proxmox_backup_current_jobs: "{{ proxmox_backup_current_raw.stdout | from_json }}"
        _proxmox_backup_current_job_ids: >-
          {{ proxmox_backup_current_raw.stdout | from_json | map(attribute='id') | list }}

    - name: Create missing vzdump backup jobs
      ansible.builtin.command:
        argv: >-
          {{ ['pvesh', 'create', '/cluster/backup',
              '--id', item.id,
              '--storage', item.storage,
              '--schedule', item.schedule,
              '--mode', item.mode | default('snapshot'),
              '--compress', item.compress | default('zstd'),
              '--enabled', item.enabled | default(true) | ternary('1', '0'),
              '--all', item.all | default('vmid' not in item) | ternary('1', '0')]
             + (['--vmid', item.vmid | join(',')] if item.vmid is defined else [])
             + (['--exclude', item.exclude | join(',')] if item.exclude is defined else [])
             + (['--prune-backups', item.prune_backups] if item.prune_backups is defined else [])
             + (['--bwlimit', item.bwlimit | string] if item.bwlimit is defined else [])
             + (['--notification-mode', item.notification_mode] if item.notification_mode is defined else [])
             + (['--mailnotification', item.mailnotification] if item.mailnotification is defined else [])
             + (['--mailto', item.mailto] if item.mailto is defined else [])
             + (['--script', item.script] if item.script is defined else []) }}
      when: item.id not in _proxmox_backup_current_job_ids
      loop: "{{ proxmox_backup_vzdump_jobs }}"
      loop_control:
        label: "{{ item.id }}"
      register: proxmox_backup_create_result
      changed_when: proxmox_backup_create_result.rc == 0

    - name: Reconcile drifted vzdump backup jobs
      vars:
        _current: >-
          {{ _proxmox_backup_current_jobs | selectattr('id', 'equalto', item.id) | first | default({}) }}
        # prune-backups may come back from `pvesh ... --output-format json` as a
        # dict ({'keep-daily': '7', ...}) rather than the legacy comma string
        # (and PVE may reorder either), so normalise BOTH sides to a sorted
        # "key=value" list before comparing — splitting a dict raised "descriptor
        # 'split' for 'str' objects doesn't apply to a 'dict' object". An
        # undefined desired value inherits the live one (via _current_prune) so
        # it never registers as drift.
        _current_prune: >-
          {{ (_current['prune-backups'].items() | map('join', '=') | sort | list)
             if (_current.get('prune-backups') is mapping)
             else (_current.get('prune-backups', '') | string | split(',') | map('trim') | select() | sort | list) }}
        _desired_prune: >-
          {{ (item.prune_backups | string | split(',') | map('trim') | select() | sort | list)
             if item.prune_backups is defined
             else _current_prune }}
        # Optional fields present on the LIVE job but removed from the desired
        # config must be explicitly cleared — `pvesh set` only updates the flags
        # it is given, so a stale `exclude`/`vmid` would keep silently skipping
        # guests from nightly backups. These map to `--delete <pve-field-name>`
        # (PVE uses hyphenated `notification-mode`). prune-backups is excluded on
        # purpose: an undefined desired value inherits the live one (above), a
        # documented "leave as-is" behaviour, not a removal.
        _delete_fields: >-
          {{ (['vmid'] if (item.vmid is not defined and (_current.vmid | default('') | string) != '') else [])
             + (['exclude'] if (item.exclude is not defined and (_current.exclude | default('') | string) != '') else [])
             + (['notification-mode'] if (item.notification_mode is not defined and _current.get('notification-mode', '') != '') else [])
             + (['mailnotification'] if (item.mailnotification is not defined and (_current.mailnotification | default('')) != '') else [])
             + (['mailto'] if (item.mailto is not defined and (_current.mailto | default('')) != '') else [])
             + (['script'] if (item.script is not defined and (_current.script | default('')) != '') else [])
             + (['bwlimit'] if (item.bwlimit is not defined and (_current.bwlimit | default('') | string) != '') else []) }}
        _has_drift: >-
          {{ (_current.storage | default('')) != item.storage or
             (_current.schedule | default('')) != item.schedule or
             (_current.mode | default('snapshot')) != (item.mode | default('snapshot')) or
             (_current.compress | default('')) != (item.compress | default('zstd')) or
             ((_current.enabled | default(1)) | string) != ((item.enabled | default(true)) | ternary('1', '0')) or
             ((_current.all | default(0)) | string) != ((item.all | default('vmid' not in item)) | ternary('1', '0')) or
             (item.vmid is defined and
              (_current.vmid | default('') | string) != (item.vmid | join(','))) or
             (item.exclude is defined and
              (_current.exclude | default('') | string) != (item.exclude | join(','))) or
             _current_prune != _desired_prune or
             (item.notification_mode is defined and
              _current.get('notification-mode', '') != item.notification_mode) or
             (item.mailnotification is defined and
              (_current.mailnotification | default('')) != item.mailnotification) or
             (item.mailto is defined and
              (_current.mailto | default('')) != item.mailto) or
             (item.script is defined and
              (_current.script | default('')) != item.script) or
             (item.bwlimit is defined and
              (_current.bwlimit | default('') | string) != (item.bwlimit | string)) or
             (_delete_fields | length > 0) }}
      ansible.builtin.command:
        argv: >-
          {{ ['pvesh', 'set', '/cluster/backup/' ~ item.id,
              '--storage', item.storage,
              '--schedule', item.schedule,
              '--mode', item.mode | default('snapshot'),
              '--compress', item.compress | default('zstd'),
              '--enabled', item.enabled | default(true) | ternary('1', '0'),
              '--all', item.all | default('vmid' not in item) | ternary('1', '0')]
             + (['--vmid', item.vmid | join(',')] if item.vmid is defined else [])
             + (['--exclude', item.exclude | join(',')] if item.exclude is defined else [])
             + (['--prune-backups', item.prune_backups] if item.prune_backups is defined else [])
             + (['--bwlimit', item.bwlimit | string] if item.bwlimit is defined else [])
             + (['--notification-mode', item.notification_mode] if item.notification_mode is defined else [])
             + (['--mailnotification', item.mailnotification] if item.mailnotification is defined else [])
             + (['--mailto', item.mailto] if item.mailto is defined else [])
             + (['--script', item.script] if item.script is defined else [])
             + (['--delete', _delete_fields | join(',')] if _delete_fields | length > 0 else []) }}
      when:
        - item.id in _proxmox_backup_current_job_ids
        - _has_drift | bool
      loop: "{{ proxmox_backup_vzdump_jobs }}"
      loop_control:
        label: "{{ item.id }}"
      register: proxmox_backup_set_result
      changed_when: proxmox_backup_set_result.rc == 0

    # Deliberately warn-only, mirroring proxmox_ha's orphaned-replication-job
    # handling: automatic deletion could remove a job someone created live
    # before it was codified.
    - name: Find unmanaged vzdump backup jobs
      ansible.builtin.set_fact:
        _proxmox_backup_unmanaged_job_ids: >-
          {{ _proxmox_backup_current_job_ids | difference(proxmox_backup_vzdump_jobs | map(attribute='id') | list) }}

    - name: Display unmanaged vzdump backup jobs
      ansible.builtin.debug:
        msg: |
          WARNING: {{ _proxmox_backup_unmanaged_job_ids | length }} vzdump job(s) exist in Proxmox
          but are not defined in proxmox_backup_vzdump_jobs: {{ _proxmox_backup_unmanaged_job_ids | join(', ') }}

          Codify them (add an entry with the SAME id so the role adopts the live job)
          or remove them manually: pvesh delete /cluster/backup/<id>
      when: _proxmox_backup_unmanaged_job_ids | length > 0
