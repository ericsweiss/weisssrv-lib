---
platforms:
  - name: proxmox-backup-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        proxmox_backup_storage: []
        proxmox_backup_vzdump_jobs: []
  config_options:
    defaults:
      remote_tmp: /tmp/ansible-tmp
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
