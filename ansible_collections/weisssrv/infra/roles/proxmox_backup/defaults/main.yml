---
# Declarative Proxmox storage entries (storage.cfg), reconciled via pvesh on ONE
# node (storage.cfg is cluster-wide): missing entries are created, mutable ones
# updated on drift, create-fixed ones fail loud. Schema: README.
proxmox_backup_storage: []

# Declarative vzdump backup jobs (jobs.cfg), reconciled via pvesh. A job's `id`
# must match the live jobs.cfg id to adopt an existing job; unmanaged live jobs
# are warned about, never deleted. `bwlimit` is per node, not per cluster.
proxmox_backup_vzdump_jobs: []
