---
# Skips the real-Proxmox-only tasks: `pveam download`, the SSH `wait_for`, and
# the reconciles against a missing CT. Create, idmap and conf writes gate on
# proxmox_lxc_exists.rc, so a test rig stubs `pvesh` to report it existing.
proxmox_lxc_skip_create: false

# IP handed to the role's pct-create and SSH-wait logic. Molecule overrides it
# so ansible_host can stay pointed at the container while --net0 still gets a
# realistic per-container address.
proxmox_lxc_target_ip: "{{ ansible_host }}"

# Container resource defaults
proxmox_lxc_cores: 2
proxmox_lxc_memory: 2048
proxmox_lxc_swap: 512
proxmox_lxc_disk_size: 8G  # GiB only — the G is stripped and pct takes a bare count
# proxmox_lxc_storage is NOT defined: the role auto-selects from
# the Proxmox host's `proxmox_role` via proxmox_storage_defaults. Set it in
# host_vars to pin one container.
proxmox_lxc_bridge: vmbr0
proxmox_lxc_unprivileged: true

# Proxmox rotates appliance builds out of the pveam index, so a new host needs a
# name the index still serves. Check `pveam available` when this 404s and bump.
proxmox_lxc_template: "debian-13-standard_13.6-1_amd64.tar.zst"
proxmox_lxc_template_storage: local

# proxmox_lxc_gateway has no default and is required on the create path.
# proxmox_lxc_netmask_bits is the --net0 prefix length: a LAN that is not a /24
# must set it, or on-link hosts outside the /24 route through the gateway.
proxmox_lxc_netmask_bits: 24
# The two below alias the conventional inventory-wide names; set the prefixed
# form directly to decouple.
proxmox_lxc_nameserver: "{{ dns_servers | default([]) | join(' ') }}"
proxmox_lxc_internal_domain: "{{ internal_domain | default('') }}"
proxmox_lxc_searchdomain: "{{ proxmox_lxc_internal_domain }}"

# Bind mounts and GPU passthrough (both create-time only).
proxmox_lxc_bind_mounts: []
proxmox_lxc_gpu_passthrough: false

# Unprivileged-container id shift. One uid and one gid map through 1:1 so
# bind-mounted host files stay accessible; the GPU variant also maps the host's
# video and render gids.
proxmox_lxc_idmap_uid: 1000
proxmox_lxc_idmap_gid: 2000
proxmox_lxc_idmap_base: 100000
proxmox_lxc_idmap_range: 65536

# User created inside the container with sudo + SSH key access. Aliased to the
# conventional inventory-wide `admin_user`.
proxmox_lxc_admin_user: "{{ admin_user | default('root') }}"
# root's home is /root, not /home/root — a consumer leaving the default above
# would otherwise have keys installed into a directory that does not exist.
proxmox_lxc_admin_home: >-
  {{ '/root' if proxmox_lxc_admin_user == 'root'
     else '/home/' + proxmox_lxc_admin_user }}
proxmox_lxc_ssh_public_keys: "{{ lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY', default='') }}"

# Startup configuration
proxmox_lxc_onboot: true
proxmox_lxc_startup_order: 100
proxmox_lxc_startup_delay: 0

# Features
proxmox_lxc_nesting: false
proxmox_lxc_keyctl: false

# Public resolver appended to the container's resolv.conf ONLY to complete the
# bootstrap `apt-get update` when internal DNS is not answering; the internal
# nameservers are restored immediately afterwards.
proxmox_lxc_bootstrap_fallback_dns: "1.1.1.1"
