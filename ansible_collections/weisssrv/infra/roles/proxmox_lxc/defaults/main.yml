---
# Skips the real-Proxmox-only tasks — the network-input assert, the `pveam
# download`, the final `wait_for` SSH probe — and, when the container does not
# exist, the reconciles that would `pct config` a missing CT. It does NOT bypass
# `pct create`/`pct exec`, idmap edits, or the /etc/pve/lxc/<id>.conf writes:
# those gate on `proxmox_lxc_exists.rc != 0`, so stubbing `pvesh` to report the
# container as existing is the supported way to no-op them in a test rig.
proxmox_lxc_skip_create: false

# IP address handed to the role's pct-create + SSH-wait logic. Defaults to
# ansible_host because production inventory routes traffic to each container
# via that field. Molecule scenarios override this so they can keep
# ansible_host pointing at the docker container (= connection target) while
# still feeding a realistic per-container IP into the pct create --net0 line.
proxmox_lxc_target_ip: "{{ ansible_host }}"

# Container resource defaults
proxmox_lxc_cores: 2
proxmox_lxc_memory: 2048
proxmox_lxc_swap: 512
proxmox_lxc_disk_size: 8G
# proxmox_lxc_storage is intentionally NOT defined: the role auto-selects from
# the Proxmox host's `proxmox_role` via proxmox_storage_defaults. Set it in
# host_vars to pin one container.
proxmox_lxc_bridge: vmbr0
proxmox_lxc_unprivileged: true

# Template settings. Proxmox rotates appliance builds out of the pveam index;
# the tasks probe the storage cache first, so an already-downloaded older build
# keeps working for recreation — but NEW hosts need a name the index actually
# serves. Check `pveam available | grep debian-13` when this 404s and bump.
proxmox_lxc_template: "debian-13-standard_13.6-1_amd64.tar.zst"
proxmox_lxc_template_storage: local

# Network. proxmox_lxc_gateway has no generic default and is REQUIRED on the
# create path — tasks/main.yml asserts it before `pct create`.
# proxmox_lxc_netmask_bits is the prefix length written into the container's
# --net0 address (proxmox_vm_cloudinit_prefix_len is the VM counterpart); a LAN
# that is not a /24 must set it, or on-link hosts outside the accidental /24 are
# routed through the gateway.
proxmox_lxc_netmask_bits: 24
# The two below alias the conventional inventory-wide names; set the prefixed
# form directly to decouple.
proxmox_lxc_nameserver: "{{ dns_servers | default([]) | join(' ') }}"
proxmox_lxc_internal_domain: "{{ internal_domain | default('') }}"
proxmox_lxc_searchdomain: "{{ proxmox_lxc_internal_domain }}"

# Bind mounts and GPU passthrough (both create-time only).
proxmox_lxc_bind_mounts: []
proxmox_lxc_gpu_passthrough: false

# Unprivileged-container id shift. One uid and one gid are mapped through 1:1
# so bind-mounted host files stay accessible from inside the container; the GPU
# variant additionally maps the host's video/render gids through.
proxmox_lxc_idmap_uid: 1000
proxmox_lxc_idmap_gid: 2000
proxmox_lxc_idmap_base: 100000
proxmox_lxc_idmap_range: 65536

# User created inside the container with sudo + SSH key access. Aliased to the
# conventional inventory-wide `admin_user`.
proxmox_lxc_admin_user: "{{ admin_user | default('root') }}"
# root's home is /root, not /home/root — a consumer leaving the default above
# would otherwise have keys installed into a directory that does not exist.
proxmox_lxc_admin_home: >-
  {{ '/root' if proxmox_lxc_admin_user == 'root'
     else '/home/' + proxmox_lxc_admin_user }}
proxmox_lxc_ssh_public_keys: "{{ lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY', default='') }}"

# Startup configuration
proxmox_lxc_onboot: true
proxmox_lxc_startup_order: 100
proxmox_lxc_startup_delay: 0

# Features
proxmox_lxc_nesting: false
proxmox_lxc_keyctl: false

# Public resolver appended to the container's resolv.conf ONLY to complete the
# bootstrap `apt-get update` when internal DNS is not answering; the internal
# nameservers are restored immediately afterwards.
proxmox_lxc_bootstrap_fallback_dns: "1.1.1.1"
