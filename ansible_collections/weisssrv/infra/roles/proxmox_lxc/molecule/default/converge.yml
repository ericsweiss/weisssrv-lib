---
- name: Converge — exercise storage selection + pool validation
  hosts: all
  become: true
  # See proxmox_vm/molecule/default/converge.yml for the rationale on
  # deferring gather_facts behind a raw mkdir.
  gather_facts: false
  vars:
    proxmox_host: "{{ inventory_hostname }}"
    proxmox_role: compute
    proxmox_lxc_id: 199
    # Do not override ansible_host: molecule's docker connection plugin reads
    # it as the container name. The role takes the IP from
    # proxmox_lxc_target_ip, pinned to a stub value here.
    proxmox_lxc_target_ip: "192.168.0.199"
    # Case 15 inputs: the key the role manages, and a cert-distribution entry
    # planted in the container by hand that the reconcile must not drop.
    lxc_authkeys_managed: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAMANAGED managed@test"
    lxc_authkeys_stale: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAASTALE stale@test"
    lxc_authkeys_foreign: 'command="/usr/local/bin/cert-receive",restrict ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAACERT cert@test'
  pre_tasks:
    - name: Pre-create Ansible remote_tmp (raw bypasses tmpdir setup)
      ansible.builtin.raw: |
        set -e
        mkdir -p /tmp/ansible-tmp
        chmod 1777 /tmp/ansible-tmp
      changed_when: false

    - name: Gather facts now that remote_tmp exists
      ansible.builtin.setup:

    - name: Result directory
      ansible.builtin.file:
        path: /tmp/molecule-results
        state: directory
        mode: "0755"

  tasks:
    # 1. Compute host with no override resolves to "local-ssd". No `vars:`
    # block, so proxmox_lxc_storage stays undefined and the role's default()
    # lookup applies; an explicit null would render as literal "None".
    - name: Compute-default run
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc

    - name: Capture compute-default result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/01-compute-default.json
        mode: "0644"
        content: |
          {"effective_storage": "{{ _proxmox_lxc_effective_storage | trim }}",
           "host_role": "{{ _proxmox_lxc_host_role }}"}

    # 2. proxmox_lxc_storage override
    - name: Override run
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: ssd

    - name: Capture override result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/02-override.json
        mode: "0644"
        content: |
          {"effective_storage": "{{ _proxmox_lxc_effective_storage | trim }}"}

    # 3. Pool-validation failure
    - name: Pool-validation failure (expect failure)
      tags: [molecule-idempotence-notest]
      block:
        - name: Run with nonexistent storage
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_lxc
          vars:
            proxmox_lxc_storage: nonexistent-pool
        - name: Should not reach here
          ansible.builtin.copy:
            dest: /tmp/molecule-results/03-pool-validation.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Record expected failure
          ansible.builtin.copy:
            dest: /tmp/molecule-results/03-pool-validation.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}

    # 4. Resource-pool list rejection
    - name: Resource-pool list rejection (expect failure)
      tags: [molecule-idempotence-notest]
      block:
        - name: Run with non-standard resource pool
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_lxc
          vars:
            proxmox_lxc_storage: local-ssd
            proxmox_resource_pool: not-a-real-pool
        - name: Should not reach here
          ansible.builtin.copy:
            dest: /tmp/molecule-results/04-pool-list.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Record expected failure
          ansible.builtin.copy:
            dest: /tmp/molecule-results/04-pool-list.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}

    # 5. Existence guard — when container exists, pct create should not run
    - name: Reset pct.log
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/pct.log
        content: ""
        mode: "0644"

    - name: Flip stub to "container exists"
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/ct_exists_state
        content: "exists\n"
        mode: "0644"

    - name: Run role with existing container
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd

    # HA-aware reconcile: the existence check returns the container's current
    # node, so reconcile tasks delegate there rather than to the inventory
    # proxmox_host, which would break any HA-migrated container.
    - name: Assert reconcile host resolved to the container's actual node
      ansible.builtin.assert:
        that:
          - proxmox_lxc_reconcile_host == inventory_hostname
        fail_msg: >-
          proxmox_lxc_reconcile_host resolved to
          '{{ proxmox_lxc_reconcile_host | default("<undefined>") }}' but the container
          is on '{{ inventory_hostname }}' — the existence check must capture the
          actual node so reconcile tasks delegate there.
        success_msg: "reconcile host = container's actual node ({{ inventory_hostname }})"

    - name: Count pct create/set lines
      ansible.builtin.shell: |
        set -o pipefail
        create=$(grep -c '^pct create' /tmp/molecule-stub-state/pct.log || true)
        setc=$(grep -c '^pct set' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"pct_create_calls\": ${create}, \"pct_set_calls\": ${setc}}"
      args:
        executable: /bin/bash
      register: pct_exist_lines
      changed_when: false

    - name: Capture existence-guard result
      ansible.builtin.copy:
        dest: /tmp/molecule-results/05-existence-guard.json
        mode: "0644"
        content: |
          {"pct_create_calls": {{ (pct_exist_lines.stdout | from_json).pct_create_calls }},
           "pct_set_calls": {{ (pct_exist_lines.stdout | from_json).pct_set_calls }}}

    # 6/7/8 — create-path rendering contracts: GPU idmap GID arithmetic in both
    # orderings, the standard idmap, and the bind-mount pct set. Each case seeds
    # a conf with Proxmox-default idmap lines and asserts the rewritten content.
    - name: 6 — reset stub state (container absent) and pct.log
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ct_exists_state, content: "missing\n"}
        - {name: pct.log, content: ""}
      loop_control:
        label: "{{ item.name }}"

    - name: 6 — seed conf with Proxmox default idmap entries
      ansible.builtin.copy:
        dest: /etc/pve/lxc/199.conf
        mode: "0644"
        content: |
          arch: amd64
          lxc.idmap: u 0 100000 65536
          lxc.idmap: g 0 100000 65536

    - name: 6 — run role with GPU passthrough + bind mount (video=44 < render=104)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_gpu_passthrough: true
        proxmox_lxc_bind_mounts:
          - host_path: /mnt/media
            container_path: /media
            options: "mp=/media,ro=0"

    - name: 6 — read rendered conf
      ansible.builtin.slurp:
        src: /etc/pve/lxc/199.conf
      register: conf_gpu

    - name: 6 — count bind-mount pct set calls
      ansible.builtin.shell: |
        set -o pipefail
        mp0=$(grep -c '^pct set 199 --mp0 /mnt/media,mp=/media,ro=0$' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"mp0_calls\": ${mp0}}"
      args:
        executable: /bin/bash
      register: gpu_mp_lines
      changed_when: false

    - name: 6 — capture GPU idmap artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/06-idmap-gpu.json
        mode: "0644"
        content: |
          {"conf": {{ conf_gpu.content | b64decode | to_json }},
           "mp0_calls": {{ (gpu_mp_lines.stdout | from_json).mp0_calls }}}

    # 7 — same GPU case with the GID ORDER inverted (video=104 > render=44).
    # The role sorts FIRST/SECOND_GPU_GID, so the rendered idmap must be
    # byte-identical to case 6.
    - name: 7 — invert video/render GIDs
      ansible.builtin.shell: |
        set -e
        groupmod -o -g 104 video
        groupmod -o -g 44 render
      changed_when: true

    - name: 7 — reset pct.log and re-seed conf
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {dest: /tmp/molecule-stub-state/pct.log, content: ""}
        - dest: /etc/pve/lxc/199.conf
          content: |
            arch: amd64
            lxc.idmap: u 0 100000 65536
            lxc.idmap: g 0 100000 65536
      loop_control:
        label: "{{ item.dest }}"

    - name: 7 — run role with GPU passthrough (inverted GID order)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_gpu_passthrough: true
        proxmox_lxc_bind_mounts:
          - host_path: /mnt/media
            container_path: /media
            options: "mp=/media,ro=0"

    - name: 7 — read rendered conf
      ansible.builtin.slurp:
        src: /etc/pve/lxc/199.conf
      register: conf_gpu_inverted

    - name: 7 — restore video/render GIDs
      ansible.builtin.shell: |
        set -e
        groupmod -o -g 44 video
        groupmod -o -g 104 render
      changed_when: true

    - name: 7 — capture inverted-GID idmap artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/07-idmap-gpu-inverted.json
        mode: "0644"
        content: |
          {"conf": {{ conf_gpu_inverted.content | b64decode | to_json }}}

    # 8 — standard (non-GPU) idmap: uid 1000 + gid 2000 passthrough.
    - name: 8 — reset pct.log and re-seed conf
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {dest: /tmp/molecule-stub-state/pct.log, content: ""}
        - dest: /etc/pve/lxc/199.conf
          content: |
            arch: amd64
            lxc.idmap: u 0 100000 65536
            lxc.idmap: g 0 100000 65536
      loop_control:
        label: "{{ item.dest }}"

    - name: 8 — run role with bind mount, no GPU
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_bind_mounts:
          - host_path: /mnt/media
            container_path: /media
            options: "mp=/media,ro=0"

    - name: 8 — read rendered conf
      ansible.builtin.slurp:
        src: /etc/pve/lxc/199.conf
      register: conf_standard

    - name: 8 — count bind-mount pct set calls
      ansible.builtin.shell: |
        set -o pipefail
        mp0=$(grep -c '^pct set 199 --mp0 /mnt/media,mp=/media,ro=0$' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"mp0_calls\": ${mp0}}"
      args:
        executable: /bin/bash
      register: std_mp_lines
      changed_when: false

    - name: 8 — capture standard idmap artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/08-idmap-standard.json
        mode: "0644"
        content: |
          {"conf": {{ conf_standard.content | b64decode | to_json }},
           "mp0_calls": {{ (std_mp_lines.stdout | from_json).mp0_calls }}}

    # 9/10 — reconcile contracts on an EXISTING container (mirrors the
    # proxmox_vm cases): the firewall=1 NIC repair (missing key + explicit
    # firewall=0 replacement) and the onboot/startup drift reconcile.
    - name: 9 — flip stub to "container exists", reset pct.log
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ct_exists_state, content: "exists\n"}
        - {name: pct.log, content: ""}
        - {name: ct_net0_override, content: "name=eth0,bridge=vmbr0,ip=192.168.0.199/24,gw=192.168.0.1"}
      loop_control:
        label: "{{ item.name }}"

    - name: 9 — run role against legacy NIC (no firewall key)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd

    - name: 9 — count legacy-NIC repair calls
      ansible.builtin.shell: |
        set -o pipefail
        repair=$(grep -c '^pct set 199 --net0 name=eth0,bridge=vmbr0,ip=192.168.0.199/24,gw=192.168.0.1,firewall=1$' /tmp/molecule-stub-state/pct.log || true)
        anyset=$(grep -c '^pct set' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"repair_calls\": ${repair}, \"any_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: lxc_fw_legacy
      changed_when: false

    - name: 9 — stub NIC with explicit firewall=0, reset pct.log
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pct.log, content: ""}
        - {name: ct_net0_override, content: "name=eth0,bridge=vmbr0,firewall=0,ip=192.168.0.199/24,gw=192.168.0.1"}
      loop_control:
        label: "{{ item.name }}"

    - name: 9 — run role against firewall=0 NIC
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd

    - name: 9 — remove net0 override
      ansible.builtin.file:
        path: /tmp/molecule-stub-state/ct_net0_override
        state: absent

    - name: 9 — count firewall=0 repair calls
      ansible.builtin.shell: |
        set -o pipefail
        repair=$(grep -c '^pct set 199 --net0 name=eth0,bridge=vmbr0,ip=192.168.0.199/24,gw=192.168.0.1,firewall=1$' /tmp/molecule-stub-state/pct.log || true)
        stale=$(grep -c '^pct set .*firewall=0' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"repair_calls\": ${repair}, \"stale_key_in_set\": ${stale}}"
      args:
        executable: /bin/bash
      register: lxc_fw_zero
      changed_when: false

    - name: 9 — capture firewall-reconcile artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/09-firewall-reconcile.json
        mode: "0644"
        content: |
          {"legacy_repair_calls": {{ (lxc_fw_legacy.stdout | from_json).repair_calls }},
           "legacy_any_set": {{ (lxc_fw_legacy.stdout | from_json).any_set }},
           "fw0_repair_calls": {{ (lxc_fw_zero.stdout | from_json).repair_calls }},
           "fw0_stale_key_in_set": {{ (lxc_fw_zero.stdout | from_json).stale_key_in_set }}}

    # 10 — onboot/startup drift on an existing container -> exactly one
    # combined `pct set --onboot --startup` with the canonical desired string.
    - name: 10 — stub onboot/startup drift, reset pct.log
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pct.log, content: ""}
        - {name: ct_onboot_override, content: "0"}
        - {name: ct_startup_override, content: "order=50,up=30"}
      loop_control:
        label: "{{ item.name }}"

    - name: 10 — run role against onboot/startup drift
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd

    - name: 10 — remove onboot/startup overrides
      ansible.builtin.file:
        path: "/tmp/molecule-stub-state/{{ item }}"
        state: absent
      loop:
        - ct_onboot_override
        - ct_startup_override

    - name: 10 — count startup-drift pct calls
      ansible.builtin.shell: |
        set -o pipefail
        applied=$(grep -c '^pct set 199 --onboot 1 --startup order=100,up=0$' /tmp/molecule-stub-state/pct.log || true)
        anyset=$(grep -c '^pct set 199 --onboot' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"startup_set\": ${applied}, \"any_onboot_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: lxc_meta_drift
      changed_when: false

    - name: 10 — capture meta-drift artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/10-meta-drift.json
        mode: "0644"
        content: |
          {"startup_set": {{ (lxc_meta_drift.stdout | from_json).startup_set }},
           "any_onboot_set": {{ (lxc_meta_drift.stdout | from_json).any_onboot_set }}}

    # 11 — GPU passthrough without bind mounts: the GPU idmap renders
    # byte-identical to case 6, since the video/render GID passthrough is what
    # lets a mount-less unprivileged guest open /dev/dri, and no pct set fires.
    - name: 11 — reset stub state (container absent), pct.log, and conf
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {dest: /tmp/molecule-stub-state/ct_exists_state, content: "missing\n"}
        - {dest: /tmp/molecule-stub-state/pct.log, content: ""}
        - dest: /etc/pve/lxc/199.conf
          content: |
            arch: amd64
            lxc.idmap: u 0 100000 65536
            lxc.idmap: g 0 100000 65536
      loop_control:
        label: "{{ item.dest }}"

    - name: 11 — run role with GPU passthrough and NO bind mounts
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_gpu_passthrough: true

    - name: 11 — read rendered conf
      ansible.builtin.slurp:
        src: /etc/pve/lxc/199.conf
      register: conf_gpu_nobind

    - name: 11 — count bind-mount pct set calls (must be zero)
      ansible.builtin.shell: |
        set -o pipefail
        mp=$(grep -c '^pct set 199 --mp' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"mp_calls\": ${mp}}"
      args:
        executable: /bin/bash
      register: gpu_nobind_mp_lines
      changed_when: false

    - name: 11 — capture GPU-without-bind-mounts idmap artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/11-idmap-gpu-nobind.json
        mode: "0644"
        content: |
          {"conf": {{ conf_gpu_nobind.content | b64decode | to_json }},
           "mp_calls": {{ (gpu_nobind_mp_lines.stdout | from_json).mp_calls }}}

    # 12 — the create-path address carries proxmox_lxc_netmask_bits, so a LAN
    # that is not a /24 provisions with the right prefix.
    - name: 12 — reset stub state (container absent) and pct.log
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ct_exists_state, content: "missing\n"}
        - {name: pct.log, content: ""}
      loop_control:
        label: "{{ item.name }}"

    - name: 12 — run role on a /22 LAN
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd
        proxmox_lxc_netmask_bits: 22

    - name: 12 — count create lines by rendered prefix
      ansible.builtin.shell: |
        set -o pipefail
        wanted=$(grep -c '^pct create 199 .*ip=192.168.0.199/22,gw=192.168.0.1' /tmp/molecule-stub-state/pct.log || true)
        hardcoded=$(grep -c '^pct create 199 .*ip=192.168.0.199/24' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"prefix22_calls\": ${wanted}, \"prefix24_calls\": ${hardcoded}}"
      args:
        executable: /bin/bash
      register: lxc_prefix_lines
      changed_when: false

    - name: 12 — capture netmask artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/12-netmask.json
        mode: "0644"
        content: |
          {"prefix22_calls": {{ (lxc_prefix_lines.stdout | from_json).prefix22_calls }},
           "prefix24_calls": {{ (lxc_prefix_lines.stdout | from_json).prefix24_calls }}}

    # 13 — per-container DNS reconcile on an existing container, with no
    # skip_create gate. 13a: a stale nameserver in the stub yields exactly one
    # `pct set 199 --nameserver <desired> --searchdomain <desired>`.
    - name: 13 — flip stub to "container exists", stub drifted nameserver, reset pct.log
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ct_exists_state, content: "exists\n"}
        - {name: pct.log, content: ""}
        - {name: ct_nameserver_override, content: "192.168.0.99"}
      loop_control:
        label: "{{ item.name }}"

    - name: 13 — run role against a container with drifted DNS
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd

    - name: 13 — record whether the drift reconcile ran and mutated
      ansible.builtin.set_fact:
        lxc_dns_drift_changed: "{{ proxmox_lxc_dns_reconcile.changed }}"
        lxc_dns_drift_skipped: "{{ proxmox_lxc_dns_reconcile.skipped | default(false) }}"

    - name: 13 — count DNS-drift pct calls
      ansible.builtin.shell: |
        set -o pipefail
        applied=$(grep -c '^pct set 199 --nameserver 192.168.0.150 192.168.0.160 --searchdomain example.test$' /tmp/molecule-stub-state/pct.log || true)
        anyset=$(grep -c '^pct set 199 --nameserver' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"applied\": ${applied}, \"any_ns_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: lxc_dns_drift
      changed_when: false

    # 13b. NO-DRIFT — stub reports the desired nameserver/searchdomain (the
    # default stub state) -> the reconcile RUNS but issues no pct set and reports
    # not-changed. Proves the compare, and that a matching container never churns.
    - name: 13 — remove nameserver override (stub back to desired), reset pct.log
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/pct.log
        content: ""
        mode: "0644"

    - name: 13 — clear the drifted-nameserver override
      ansible.builtin.file:
        path: /tmp/molecule-stub-state/ct_nameserver_override
        state: absent

    - name: 13 — run role against a container whose DNS already matches
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd

    - name: 13 — record whether the no-drift reconcile ran and mutated
      ansible.builtin.set_fact:
        lxc_dns_nodrift_changed: "{{ proxmox_lxc_dns_reconcile.changed }}"
        lxc_dns_nodrift_skipped: "{{ proxmox_lxc_dns_reconcile.skipped | default(false) }}"

    - name: 13 — count DNS-no-drift pct calls
      ansible.builtin.shell: |
        set -o pipefail
        anyset=$(grep -c '^pct set 199 --nameserver' /tmp/molecule-stub-state/pct.log || true)
        echo "{\"any_ns_set\": ${anyset}}"
      args:
        executable: /bin/bash
      register: lxc_dns_nodrift
      changed_when: false

    - name: 13 — capture DNS-reconcile artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/13-dns-reconcile.json
        mode: "0644"
        content: |
          {"drift_applied": {{ (lxc_dns_drift.stdout | from_json).applied }},
           "drift_any_set": {{ (lxc_dns_drift.stdout | from_json).any_ns_set }},
           "drift_changed": {{ lxc_dns_drift_changed | to_json }},
           "drift_skipped": {{ lxc_dns_drift_skipped | to_json }},
           "nodrift_any_set": {{ (lxc_dns_nodrift.stdout | from_json).any_ns_set }},
           "nodrift_changed": {{ lxc_dns_nodrift_changed | to_json }},
           "nodrift_skipped": {{ lxc_dns_nodrift_skipped | to_json }}}

    # 14. Create-input assert, gated on the container being absent rather than
    # on skip_create: `pct create` runs under skip_create too, and a run that
    # only reconciles an existing container must not demand those values.
    - name: 14 — stub the container as absent
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/ct_exists_state
        content: "missing\n"
        mode: "0644"

    - name: 14 — absent container with no gateway (expect failure)
      tags: [molecule-idempotence-notest]
      block:
        - name: 14 — run role with an empty gateway
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_lxc
          vars:
            proxmox_lxc_storage: local-ssd
            proxmox_lxc_gateway: ""
        - name: 14 — missing gateway did not fail
          ansible.builtin.set_fact:
            lxc_missing_gateway_failed: false
      rescue:
        - name: 14 — missing gateway failed as expected
          ansible.builtin.set_fact:
            lxc_missing_gateway_failed: true

    - name: 14 — absent container with a non-GiB disk size (expect failure)
      tags: [molecule-idempotence-notest]
      block:
        - name: 14 — run role with a megabyte disk size
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_lxc
          vars:
            proxmox_lxc_storage: local-ssd
            proxmox_lxc_disk_size: 512M
        - name: 14 — non-GiB disk size did not fail
          ansible.builtin.set_fact:
            lxc_bad_disk_size_failed: false
      rescue:
        - name: 14 — non-GiB disk size failed as expected
          ansible.builtin.set_fact:
            lxc_bad_disk_size_failed: true

    - name: 14 — stub the container as existing again
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/ct_exists_state
        content: "exists\n"
        mode: "0644"

    - name: 14 — existing container with no gateway (must NOT fail)
      tags: [molecule-idempotence-notest]
      block:
        - name: 14 — reconcile an existing container with an empty gateway
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_lxc
          vars:
            proxmox_lxc_storage: local-ssd
            proxmox_lxc_gateway: ""
        - name: 14 — reconcile-only run succeeded
          ansible.builtin.set_fact:
            lxc_reconcile_without_gateway_ok: true
      rescue:
        - name: 14 — reconcile-only run failed
          ansible.builtin.set_fact:
            lxc_reconcile_without_gateway_ok: false

    - name: 14 — capture create-input artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/14-create-inputs.json
        mode: "0644"
        content: |
          {"missing_gateway_failed": {{ lxc_missing_gateway_failed | to_json }},
           "bad_disk_size_failed": {{ lxc_bad_disk_size_failed | to_json }},
           "reconcile_without_gateway_ok": {{ lxc_reconcile_without_gateway_ok | to_json }}}

    # 15 — the authorized_keys reconcile is a merge: a forced-command entry the
    # role never wrote survives repeat runs, and prune makes the managed set
    # authoritative. pct exec runs for real here (see the prepare.yml stub).
    - name: 15 — stub the container as existing and let pct exec run for real
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ct_exists_state, content: "exists\n"}
        - {name: pct_exec_passthrough, content: "on\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: 15 — create the stand-in admin home
      ansible.builtin.file:
        path: /tmp/lxc-authkeys/.ssh
        state: directory
        mode: "0700"

    - name: 15 — seed authorized_keys with a foreign forced command and a stale key
      ansible.builtin.copy:
        dest: /tmp/lxc-authkeys/.ssh/authorized_keys
        mode: "0600"
        content: |
          {{ lxc_authkeys_foreign }}
          {{ lxc_authkeys_stale }}

    - name: 15 — reconcile the managed key over the seeded file
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd
        proxmox_lxc_admin_user: root
        proxmox_lxc_admin_home: /tmp/lxc-authkeys
        proxmox_lxc_ssh_public_keys: "{{ lxc_authkeys_managed }}"

    - name: 15 — record the first reconcile
      ansible.builtin.set_fact:
        lxc_authkeys_first_changed: "{{ proxmox_lxc_authkeys_reconcile.changed }}"

    - name: 15 — read the merged file
      ansible.builtin.slurp:
        src: /tmp/lxc-authkeys/.ssh/authorized_keys
      register: lxc_authkeys_after_first

    - name: 15 — reconcile the same key a second time
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd
        proxmox_lxc_admin_user: root
        proxmox_lxc_admin_home: /tmp/lxc-authkeys
        proxmox_lxc_ssh_public_keys: "{{ lxc_authkeys_managed }}"

    - name: 15 — record the second reconcile
      ansible.builtin.set_fact:
        lxc_authkeys_second_changed: "{{ proxmox_lxc_authkeys_reconcile.changed }}"

    - name: 15 — read the file after the replay
      ansible.builtin.slurp:
        src: /tmp/lxc-authkeys/.ssh/authorized_keys
      register: lxc_authkeys_after_second

    - name: 15 — reconcile once more with prune enabled
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_lxc
      vars:
        proxmox_lxc_storage: local-ssd
        proxmox_lxc_admin_user: root
        proxmox_lxc_admin_home: /tmp/lxc-authkeys
        proxmox_lxc_ssh_public_keys: "{{ lxc_authkeys_managed }}"
        proxmox_lxc_ssh_authorized_keys_prune: true

    - name: 15 — read the pruned file
      ansible.builtin.slurp:
        src: /tmp/lxc-authkeys/.ssh/authorized_keys
      register: lxc_authkeys_after_prune

    - name: 15 — record the file mode after the prune
      ansible.builtin.stat:
        path: /tmp/lxc-authkeys/.ssh/authorized_keys
      register: lxc_authkeys_stat

    - name: 15 — stop the pct exec passthrough
      ansible.builtin.file:
        path: /tmp/molecule-stub-state/pct_exec_passthrough
        state: absent

    - name: 15 — capture authorized-keys merge artifact
      ansible.builtin.copy:
        dest: /tmp/molecule-results/15-authorized-keys.json
        mode: "0644"
        content: |
          {"after_first": {{ lxc_authkeys_after_first.content | b64decode | to_json }},
           "after_second": {{ lxc_authkeys_after_second.content | b64decode | to_json }},
           "after_prune": {{ lxc_authkeys_after_prune.content | b64decode | to_json }},
           "first_changed": {{ lxc_authkeys_first_changed | to_json }},
           "second_changed": {{ lxc_authkeys_second_changed | to_json }},
           "mode": {{ lxc_authkeys_stat.stat.mode | to_json }}}
