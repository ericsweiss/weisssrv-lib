---
platforms:
  - name: proxmox-lxc-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
provisioner:
  playbooks:
    prepare: prepare.yml
  env:
    SSH_PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITESTKEYDONOTUSE molecule@test
  inventory:
    group_vars:
      all:
        # Site inputs the role's network/user defaults alias.
        internal_domain: example.test
        admin_user: eric
        dns_servers: [192.168.0.150, 192.168.0.160]
        proxmox_lxc_gateway: 192.168.0.1
        proxmox_lxc_skip_create: true
        proxmox_storage_defaults:
          nas: ssd
          compute: local-ssd
          general: local-ssd
        proxmox_resource_pools:
          - infra-core
          - apps-public
          - platform
          - apps-private
  config_options:
    defaults:
      remote_tmp: /tmp/ansible-tmp
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
