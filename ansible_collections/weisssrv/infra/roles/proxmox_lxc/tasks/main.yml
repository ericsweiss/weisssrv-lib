---
# Mirror proxmox_vm: an explicit inventory vmid wins; fall back to the
# IP last octet.
- name: Set container ID
  ansible.builtin.set_fact:
    proxmox_lxc_id: "{{ vmid | default(proxmox_lxc_target_ip.split('.')[-1]) }}"

# Comes first: the next task indexes hostvars[proxmox_host], so a missing input
# is named here instead of surfacing as a hostvars lookup error.
- name: Assert the delegate Proxmox host is set
  ansible.builtin.assert:
    that:
      - proxmox_host is defined
      - proxmox_host | length > 0
    fail_msg: >-
      proxmox_host (the node this container is created and reconciled on) is
      required — every pct/pvesh call in this role delegates to it.
    quiet: true

- name: Determine Proxmox host role
  ansible.builtin.set_fact:
    _proxmox_lxc_host_role: "{{ hostvars[proxmox_host]['proxmox_role'] | default('compute') }}"

- name: Auto-select storage based on Proxmox host role
  ansible.builtin.set_fact:
    _proxmox_lxc_effective_storage: >-
      {{
        proxmox_lxc_storage |
        default(proxmox_storage_defaults[_proxmox_lxc_host_role] | default('local-ssd'))
      }}

- name: Display storage selection
  ansible.builtin.debug:
    msg: >-
      Container {{ inventory_hostname }} will use storage:
      {{ _proxmox_lxc_effective_storage }} (host: {{ proxmox_host }},
      role: {{ _proxmox_lxc_host_role }})

- name: Check if container already exists
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    set -o errexit -o nounset -o pipefail
    # Check cluster-wide — containers may be HA-migrated to a different node.
    resources_json="$(pvesh get /cluster/resources --type vm --output-format json)"
    python3 -c "import sys,json; vmids=[r['vmid'] for r in json.loads(sys.argv[1])]; sys.exit(0 if {{ proxmox_lxc_id | int }} in vmids else 1)" "$resources_json"
  args:
    executable: /bin/bash
  register: proxmox_lxc_exists
  changed_when: false
  failed_when: proxmox_lxc_exists.rc not in [0, 1]
  check_mode: false

# An existing container may have HA-migrated off the inventory proxmox_host, so
# reconcile tasks must run on its actual node. A not-yet-created container falls
# back to proxmox_host, where the create path places it.
- name: Look up the existing container's current node
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.command:
    cmd: pvesh get /cluster/resources --type vm --output-format json
  register: proxmox_lxc_cluster_resources
  changed_when: false
  check_mode: false
  when: proxmox_lxc_exists.rc == 0

- name: Resolve the node to delegate container reconcile tasks to
  ansible.builtin.set_fact:
    # An existing container resolves to its CURRENT node with no proxmox_host
    # fallback, so a lookup returning nothing fails the assert below instead of
    # reconciling against the wrong node.
    proxmox_lxc_reconcile_host: >-
      {{ (proxmox_lxc_cluster_resources.stdout | from_json
          | selectattr('vmid', 'equalto', proxmox_lxc_id | int)
          | map(attribute='node') | first | default(''))
         if proxmox_lxc_exists.rc == 0 else proxmox_host }}

- name: Fail loud if an existing container's current node could not be resolved
  ansible.builtin.assert:
    that:
      - proxmox_lxc_reconcile_host | length > 0
    fail_msg: >-
      Could not resolve the current node for existing container {{ proxmox_lxc_id }}
      from /cluster/resources; refusing to fall back to the inventory proxmox_host
      ({{ proxmox_host }}), which may not hold the container.
  when: proxmox_lxc_exists.rc == 0

# Carries the same gate as `pct create`: a run that only reconciles an existing
# container reads none of these. Named here rather than as an undefined-variable
# error from inside the create shell.
- name: Assert the required LXC create inputs are set
  ansible.builtin.assert:
    that:
      - proxmox_lxc_gateway | default('') | length > 0
      - proxmox_lxc_nameserver | default('') | length > 0
      - proxmox_lxc_netmask_bits | int > 0
      - proxmox_lxc_netmask_bits | int <= 32
      - proxmox_lxc_searchdomain | default('') | length > 0
      # `| string` first: an unquoted integer has no `match`.
      - proxmox_lxc_disk_size | string is match('^[0-9]+[Gg]?$')
    fail_msg: >-
      proxmox_lxc_gateway (the container's default gateway — no generic
      default), proxmox_lxc_nameserver (alias: dns_servers) and
      proxmox_lxc_searchdomain (alias: internal_domain — `pct create` takes it
      verbatim, so an empty value writes an empty --searchdomain) are required
      on the create path; proxmox_lxc_netmask_bits
      ({{ proxmox_lxc_netmask_bits | default('<undefined>') }}) must be an IPv4
      prefix length; and proxmox_lxc_disk_size
      ({{ proxmox_lxc_disk_size | default('<undefined>') }}) must be a GiB value
      (8 or 8G) — `pct create` takes the rootfs size as a bare GiB count, so a
      `512M` or `8T` survives the unit strip and reaches it unchanged.
    quiet: true
  when: proxmox_lxc_exists.rc != 0

# Shared with proxmox_vm: the storage and resource-pool guards must not drift
# between guest types, so both roles run the same task file.
- name: Validate storage and resource pools on the target node
  ansible.builtin.include_role:
    name: weisssrv.infra.proxmox_vm
    tasks_from: assert-target-pools
  vars:
    _pmx_when: "{{ proxmox_lxc_exists.rc != 0 }}"
    _pmx_storage: "{{ _proxmox_lxc_effective_storage }}"
    _pmx_storage_hint: proxmox_lxc_storage
    _pmx_delegate: "{{ proxmox_host }}"

# An empty key creates a container Ansible can never SSH into: the keys
# reconcile skips while the SSH wait still passes. Fail fast on the create path.
- name: Assert SSH public key is available for the container
  ansible.builtin.assert:
    that:
      - proxmox_lxc_ssh_public_keys | length > 0
    fail_msg: >-
      proxmox_lxc_ssh_public_keys is empty. Run via the task wrapper (op run) so the
      container gets an authorized key.
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
    - not (proxmox_lxc_skip_create | default(false))

# `pveam download` validates the name against the freshly-updated appliance
# index before the local cache, so a rotated pin hard-fails even though `pct
# create` from the cached tarball works. Probe the cache first.
- name: Check for cached LXC template
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.command: pveam list {{ proxmox_lxc_template_storage }}
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
    - not (proxmox_lxc_skip_create | default(false))
  register: proxmox_lxc_template_cache
  changed_when: false

# The `pveam update` index refresh is best-effort: it must not block a
# from-scratch download during a transient mirror hiccup when the previous
# index is still serviceable; `pveam download` decides.
- name: Download LXC template if not present
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    set -o errexit -o pipefail
    pveam update || echo "WARN: pveam update failed (offline or mirror down); proceeding with cached appliance index" >&2
    pveam download {{ proxmox_lxc_template_storage }} {{ proxmox_lxc_template }}
  args:
    executable: /bin/bash
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
    - not (proxmox_lxc_skip_create | default(false))
    - proxmox_lxc_template not in (proxmox_lxc_template_cache.stdout | default(''))
  register: proxmox_lxc_template_download
  changed_when: "'downloading' in (proxmox_lxc_template_download.stdout | default(''))"

- name: Get host video group GID
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    getent group video | cut -d: -f3
  args:
    executable: /bin/bash
  register: proxmox_lxc_video_gid_result
  changed_when: false
  check_mode: false
  when:
    - proxmox_lxc_gpu_passthrough | default(false)

- name: Get host render group GID
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    getent group render | cut -d: -f3
  args:
    executable: /bin/bash
  register: proxmox_lxc_render_gid_result
  changed_when: false
  check_mode: false
  when:
    - proxmox_lxc_gpu_passthrough | default(false)

- name: Set GPU group GID facts
  ansible.builtin.set_fact:
    proxmox_lxc_video_gid: "{{ proxmox_lxc_video_gid_result.stdout | int }}"
    proxmox_lxc_render_gid: "{{ proxmox_lxc_render_gid_result.stdout | int }}"
  when:
    - proxmox_lxc_gpu_passthrough | default(false)
    - proxmox_lxc_video_gid_result.stdout is defined
    - proxmox_lxc_render_gid_result.stdout is defined

# Checked before anything is written: the idmap generator runs after `pct
# create`, so a bad value caught later leaves a container `pct start` refuses.
# Range membership binds every unprivileged container, GPU or not.
- name: Assert the idmap points fall inside the mapped range
  ansible.builtin.assert:
    that:
      # Numeric first: `int` coerces a malformed value to 0, which passes every
      # range test and still fails at pct start. The pattern also excludes 0,
      # whose map would reach container root to host root.
      - (proxmox_lxc_idmap_uid | string) is match('^[1-9][0-9]*$')
      - (proxmox_lxc_idmap_gid | string) is match('^[1-9][0-9]*$')
      # Strictly below range - 1: the generator emits a trailing range after
      # the point, and a point at range - 1 leaves it zero-length.
      - proxmox_lxc_idmap_uid | int < (proxmox_lxc_idmap_range | int) - 1
      - proxmox_lxc_idmap_gid | int < (proxmox_lxc_idmap_range | int) - 1
    fail_msg: >-
      proxmox_lxc_idmap_uid ({{ proxmox_lxc_idmap_uid }}) and
      proxmox_lxc_idmap_gid ({{ proxmox_lxc_idmap_gid }}) must both be
      integers between 1 and proxmox_lxc_idmap_range - 2
      ({{ proxmox_lxc_idmap_range | int - 2 }}) — a malformed value, 0, or a
      point at either end of the range produces an idmap the generator cannot
      express and pct start rejects the container.
    quiet: true
  when:
    - proxmox_lxc_unprivileged | default(true)

# The generator emits the passed-through GIDs in ascending order and fills the
# gaps between them, so the container GID must sort ABOVE both GPU GIDs; a
# lower one produces overlapping ranges.
- name: Assert the idmap points are consistent with the GPU GIDs
  ansible.builtin.assert:
    that:
      - proxmox_lxc_idmap_gid | int > proxmox_lxc_video_gid | int
      - proxmox_lxc_idmap_gid | int > proxmox_lxc_render_gid | int
    fail_msg: >-
      proxmox_lxc_idmap_gid ({{ proxmox_lxc_idmap_gid }}) must be greater than
      both proxmox_lxc_video_gid ({{ proxmox_lxc_video_gid }}) and
      proxmox_lxc_render_gid ({{ proxmox_lxc_render_gid }}) — otherwise the
      generated lxc.idmap ranges overlap and pct start rejects the container.
    quiet: true
  when:
    - proxmox_lxc_unprivileged | default(true)
    - proxmox_lxc_gpu_passthrough | default(false)

# Reconciled every run, not create-time only.
- name: Configure subuid/subgid for container UID/GID passthrough
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    CHANGED=false

    # The uid/gid mapped through 1:1 by the idmap tasks must also be delegated
    # to root in subuid/subgid, or `pct start` rejects the mapping.
    if ! grep -q "^root:{{ proxmox_lxc_idmap_uid }}:1" /etc/subuid; then
      echo "root:{{ proxmox_lxc_idmap_uid }}:1" >> /etc/subuid
      CHANGED=true
    fi

    if ! grep -q "^root:{{ proxmox_lxc_idmap_gid }}:1" /etc/subgid; then
      echo "root:{{ proxmox_lxc_idmap_gid }}:1" >> /etc/subgid
      CHANGED=true
    fi

    {% if proxmox_lxc_gpu_passthrough | default(false) %}
    VIDEO_GID="{{ proxmox_lxc_video_gid }}"
    RENDER_GID="{{ proxmox_lxc_render_gid }}"

    if ! grep -q "^root:${VIDEO_GID}:1" /etc/subgid; then
      echo "root:${VIDEO_GID}:1" >> /etc/subgid
      CHANGED=true
    fi
    if ! grep -q "^root:${RENDER_GID}:1" /etc/subgid; then
      echo "root:${RENDER_GID}:1" >> /etc/subgid
      CHANGED=true
    fi
    {% endif %}

    if [ "$CHANGED" = "true" ]; then echo "CHANGED"; fi
  when:
    - not ansible_check_mode
    - proxmox_lxc_unprivileged | default(true)
  register: proxmox_lxc_subuid_result
  changed_when: "'CHANGED' in (proxmox_lxc_subuid_result.stdout | default(''))"

- name: Set resource pool argument
  ansible.builtin.set_fact:
    _proxmox_lxc_pool_arg: "{{ ' --pool ' + proxmox_resource_pool if proxmox_resource_pool is defined else '' }}"
  when: proxmox_lxc_exists.rc != 0

- name: Create LXC container
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    pct create {{ proxmox_lxc_id }} \
      {{ (proxmox_lxc_template_storage ~ ':vztmpl/' ~ proxmox_lxc_template) | quote }} \
      --hostname {{ inventory_hostname | quote }} \
      --cores {{ proxmox_lxc_cores }} \
      --memory {{ proxmox_lxc_memory }} \
      --swap {{ proxmox_lxc_swap }} \
      --rootfs {{ _proxmox_lxc_effective_storage }}:{{ proxmox_lxc_disk_size | regex_replace('[Gg]$', '') }} \
      --net0 name=eth0,bridge={{ proxmox_lxc_bridge }},firewall=1,ip={{ proxmox_lxc_target_ip }}/{{ proxmox_lxc_netmask_bits }},gw={{ proxmox_lxc_gateway }} \
      --nameserver "{{ proxmox_lxc_nameserver }}" \
      --searchdomain "{{ proxmox_lxc_searchdomain }}" \
      --unprivileged {{ proxmox_lxc_unprivileged | ternary(1, 0) }} \
      --features nesting={{ proxmox_lxc_nesting | ternary(1, 0) }},keyctl={{ proxmox_lxc_keyctl | ternary(1, 0) }} \
      --onboot {{ proxmox_autostart_enabled | default(proxmox_lxc_onboot) | ternary(1, 0) }} \
      --startup order={{ proxmox_startup_order | default(proxmox_lxc_startup_order) }},up={{ proxmox_startup_delay | default(proxmox_lxc_startup_delay) }}{{ _proxmox_lxc_pool_arg }}
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
  changed_when: true

# Shared with proxmox_vm: the repair differs only in the CLI, so both roles run
# the same task file.
- name: Ensure LXC NIC has the guest firewall flag
  ansible.builtin.include_role:
    name: weisssrv.infra.proxmox_vm
    tasks_from: guest-nic-firewall
  vars:
    _pmx_cli: pct
    _pmx_id: "{{ proxmox_lxc_id }}"
    _pmx_delegate: "{{ proxmox_lxc_reconcile_host }}"
  when:
    - not ansible_check_mode
    # Same existence gate as the authorized-keys reconcile: don't `pct config`
    # a container that was never created on a skip-create run.
    - proxmox_lxc_exists.rc == 0 or not (proxmox_lxc_skip_create | default(false))

- name: Record the NIC firewall reconcile result
  ansible.builtin.set_fact:
    proxmox_lxc_net0_firewall: "{{ proxmox_vm_guest_nic_firewall_result }}"
  when: proxmox_vm_guest_nic_firewall_result is defined

# Reconcile nameserver/searchdomain on existing containers: `pct create` writes
# them only at create, and Proxmox rewrites resolv.conf from the stored value on
# every start. Guarded on a non-empty nameserver.
- name: Reconcile LXC nameserver and searchdomain
  delegate_to: "{{ proxmox_lxc_reconcile_host }}"
  become: true
  # Inventory-derived values are passed through the environment, never rendered
  # into the shell source: a value carrying a quote, backtick or $(...) must be
  # inert data on the reconcile host, not executable syntax.
  environment:
    CT_ID: "{{ proxmox_lxc_id }}"
    WANT_NS: "{{ proxmox_lxc_nameserver }}"
    WANT_SD: "{{ proxmox_lxc_searchdomain }}"
  ansible.builtin.shell: |
    set -euo pipefail
    cfg=$(pct config "$CT_ID")
    cur_ns=$(printf '%s\n' "$cfg" | sed -n 's/^nameserver: //p')
    cur_sd=$(printf '%s\n' "$cfg" | sed -n 's/^searchdomain: //p')
    if [ "$cur_ns" != "$WANT_NS" ] || [ "$cur_sd" != "$WANT_SD" ]; then
      pct set "$CT_ID" --nameserver "$WANT_NS" --searchdomain "$WANT_SD"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: proxmox_lxc_dns_reconcile
  changed_when: "'CHANGED' in (proxmox_lxc_dns_reconcile.stdout | default(''))"
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc == 0
    - proxmox_lxc_nameserver | default('') | length > 0

# Shared with proxmox_vm: the startup canonicalisation must not drift between
# guest types. (idmap, bind mounts and GPU passthrough below stay create-time
# only — see the NOTE there.)
- name: Reconcile LXC autostart and boot order on existing container
  ansible.builtin.include_role:
    name: weisssrv.infra.proxmox_vm
    tasks_from: guest-startup
  vars:
    _pmx_cli: pct
    _pmx_id: "{{ proxmox_lxc_id }}"
    _pmx_delegate: "{{ proxmox_lxc_reconcile_host }}"
    _pmx_onboot: "{{ proxmox_autostart_enabled | default(proxmox_lxc_onboot) | ternary(1, 0) }}"
    _pmx_startup: >-
      order={{ proxmox_startup_order | default(proxmox_lxc_startup_order) }},up={{ proxmox_startup_delay | default(proxmox_lxc_startup_delay) }}
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc == 0

- name: Record the startup reconcile result
  ansible.builtin.set_fact:
    proxmox_lxc_startup_reconcile: "{{ proxmox_vm_guest_startup_result }}"
  when: proxmox_vm_guest_startup_result is defined

# Create-time only, through "Configure GPU passthrough": bind mounts, lxc.idmap
# and /dev/dri gate on a non-existent container. Changing them for an existing
# one is a no-op — recreate it, or edit its conf and `pct restart` by hand.
- name: Configure bind mounts
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    pct set {{ proxmox_lxc_id }} --mp{{ idx }} {{ (item.host_path ~ ',' ~ item.options) | quote }}
  loop: "{{ proxmox_lxc_bind_mounts | default([]) }}"
  loop_control:
    index_var: idx
    label: "{{ item.container_path }}"
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
    - proxmox_lxc_bind_mounts is defined
    - proxmox_lxc_bind_mounts | length > 0
  changed_when: true

# An unprivileged container shifts every id by proxmox_lxc_idmap_base, with one
# uid and gid mapped 1:1 so bind-mounted host files stay accessible. The rewrite
# stages off pmxcfs and sanity-checks the staged file before publishing it.
- name: Configure UID/GID mapping (standard)
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      CONF_FILE="/etc/pve/lxc/{{ proxmox_lxc_id }}.conf"
      UID_PT={{ proxmox_lxc_idmap_uid | int }}
      GID_PT={{ proxmox_lxc_idmap_gid | int }}
      BASE={{ proxmox_lxc_idmap_base | int }}
      RANGE={{ proxmox_lxc_idmap_range | int }}

      [ -f "$CONF_FILE" ] && [ -r "$CONF_FILE" ] || {
        echo "ERROR: $CONF_FILE is missing or unreadable; refusing to rewrite it." >&2
        exit 1
      }

      STAGE=$(mktemp /tmp/lxc-idmap-{{ proxmox_lxc_id }}.XXXXXX)
      trap 'rm -f "$STAGE"' EXIT

      # grep exits 1 when EVERY line was an idmap line; that is a valid (if
      # unexpected) input, so tolerate it and let the sanity check below decide.
      grep -v "^lxc.idmap" "$CONF_FILE" > "$STAGE" || true
      grep -Eq '^(arch|hostname|ostype|rootfs|memory|cores|swap|net[0-9]+):' "$STAGE" || {
        echo "ERROR: $CONF_FILE has no recognizable LXC config keys after"        >&2
        echo "       stripping lxc.idmap; refusing to publish a gutted config."   >&2
        exit 1
      }

      {
        echo "lxc.idmap: u 0 ${BASE} ${UID_PT}"
        echo "lxc.idmap: u ${UID_PT} ${UID_PT} 1"
        echo "lxc.idmap: u $((UID_PT + 1)) $((BASE + UID_PT + 1)) $((RANGE - UID_PT - 1))"
        echo "lxc.idmap: g 0 ${BASE} ${GID_PT}"
        echo "lxc.idmap: g ${GID_PT} ${GID_PT} 1"
        echo "lxc.idmap: g $((GID_PT + 1)) $((BASE + GID_PT + 1)) $((RANGE - GID_PT - 1))"
      } >> "$STAGE"

      cp -- "$STAGE" "$CONF_FILE"
    executable: /bin/bash
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
    - proxmox_lxc_bind_mounts is defined
    - proxmox_lxc_bind_mounts | length > 0
    - proxmox_lxc_unprivileged | default(true)
    - not (proxmox_lxc_gpu_passthrough | default(false))
  changed_when: true

# Runs for every unprivileged GPU container, bind mounts or not: its root is not
# host root, so the passed-through GID is the only access path to the 0660
# root:video/render perms on /dev/dri.
- name: Configure UID/GID mapping (with GPU)
  delegate_to: "{{ proxmox_host }}"
  become: true
  vars:
    video_gid: "{{ proxmox_lxc_video_gid }}"
    render_gid: "{{ proxmox_lxc_render_gid }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      CONF_FILE="/etc/pve/lxc/{{ proxmox_lxc_id }}.conf"
      UID_PT={{ proxmox_lxc_idmap_uid | int }}
      GID_PT={{ proxmox_lxc_idmap_gid | int }}
      BASE={{ proxmox_lxc_idmap_base | int }}
      RANGE={{ proxmox_lxc_idmap_range | int }}
      VIDEO_GID={{ video_gid }}
      RENDER_GID={{ render_gid }}

      [ -f "$CONF_FILE" ] && [ -r "$CONF_FILE" ] || {
        echo "ERROR: $CONF_FILE is missing or unreadable; refusing to rewrite it." >&2
        exit 1
      }

      STAGE=$(mktemp /tmp/lxc-idmap-{{ proxmox_lxc_id }}.XXXXXX)
      trap 'rm -f "$STAGE"' EXIT

      # grep exits 1 when EVERY line was an idmap line; that is a valid (if
      # unexpected) input, so tolerate it and let the sanity check below decide.
      grep -v "^lxc.idmap" "$CONF_FILE" > "$STAGE" || true
      grep -Eq '^(arch|hostname|ostype|rootfs|memory|cores|swap|net[0-9]+):' "$STAGE" || {
        echo "ERROR: $CONF_FILE has no recognizable LXC config keys after"        >&2
        echo "       stripping lxc.idmap; refusing to publish a gutted config."   >&2
        exit 1
      }

      {
        echo "lxc.idmap: u 0 ${BASE} ${UID_PT}"
        echo "lxc.idmap: u ${UID_PT} ${UID_PT} 1"
        echo "lxc.idmap: u $((UID_PT + 1)) $((BASE + UID_PT + 1)) $((RANGE - UID_PT - 1))"

        if [ "$VIDEO_GID" -lt "$RENDER_GID" ]; then
          FIRST_GPU_GID="$VIDEO_GID"
          SECOND_GPU_GID="$RENDER_GID"
        else
          FIRST_GPU_GID="$RENDER_GID"
          SECOND_GPU_GID="$VIDEO_GID"
        fi

        echo "lxc.idmap: g 0 ${BASE} ${FIRST_GPU_GID}"
        echo "lxc.idmap: g ${FIRST_GPU_GID} ${FIRST_GPU_GID} 1"

        NEXT_GID=$((FIRST_GPU_GID + 1))
        GAP=$((SECOND_GPU_GID - NEXT_GID))
        if [ "$GAP" -gt 0 ]; then
          echo "lxc.idmap: g ${NEXT_GID} $((BASE + NEXT_GID)) ${GAP}"
        fi

        echo "lxc.idmap: g ${SECOND_GPU_GID} ${SECOND_GPU_GID} 1"

        NEXT_GID=$((SECOND_GPU_GID + 1))
        if [ "$NEXT_GID" -lt "$GID_PT" ]; then
          echo "lxc.idmap: g ${NEXT_GID} $((BASE + NEXT_GID)) $((GID_PT - NEXT_GID))"
        fi

        echo "lxc.idmap: g ${GID_PT} ${GID_PT} 1"
        echo "lxc.idmap: g $((GID_PT + 1)) $((BASE + GID_PT + 1)) $((RANGE - GID_PT - 1))"
      } >> "$STAGE"

      cp -- "$STAGE" "$CONF_FILE"
    executable: /bin/bash
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
    - proxmox_lxc_unprivileged | default(true)
    - proxmox_lxc_gpu_passthrough | default(false)
  changed_when: true

# Pass /dev/dri (DRM major 226) through for hardware transcoding.
- name: Configure GPU passthrough
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      CONF_FILE="/etc/pve/lxc/{{ proxmox_lxc_id }}.conf"
      # Each managed line is checked individually: an unrelated devices.allow
      # rule (e.g. USB passthrough) must not suppress the DRM entries.
      if ! grep -qF "lxc.cgroup2.devices.allow: c 226:* rwm" "$CONF_FILE"; then
        echo "lxc.cgroup2.devices.allow: c 226:* rwm" >> "$CONF_FILE"
        echo CHANGED
      fi
      if ! grep -qF "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir" "$CONF_FILE"; then
        echo "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir" >> "$CONF_FILE"
        echo CHANGED
      fi
    executable: /bin/bash
  register: proxmox_lxc_gpu_config
  changed_when: "'CHANGED' in (proxmox_lxc_gpu_config.stdout_lines | default([]))"
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
    - proxmox_lxc_gpu_passthrough | default(false)

- name: Start LXC container
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    pct start {{ proxmox_lxc_id }}
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
  changed_when: true

- name: Wait for container to initialize
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.pause:
    seconds: 5
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0

- name: Wait for container network connectivity
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    # 30 x 2s: a default route via the gateway, then either a TCP-22 probe of the
    # gateway or an assigned address on eth0. bash /dev/tcp rather than ping, which
    # needs iputils-ping on a minimal Debian container.
    for i in $(seq 1 30); do
      route_check='ip route show default 2>/dev/null | grep -q "via {{ proxmox_lxc_gateway }}"'
      if pct exec {{ proxmox_lxc_id }} -- bash -c "$route_check"; then
        tcp_check='timeout 2 bash -c "</dev/tcp/{{ proxmox_lxc_gateway }}/22" 2>/dev/null'
        ip_check='ip addr show eth0 2>/dev/null | grep -q "inet "'
        if pct exec {{ proxmox_lxc_id }} -- bash -c "$tcp_check || $ip_check"; then
          echo "Gateway reachable"
          exit 0
        fi
      fi
      sleep 2
    done
    echo "Gateway unreachable after 60 seconds"
    exit 1
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
  changed_when: false

# A public resolver is appended to the container's resolv.conf for the duration
# of the bootstrap apt-get. The `always` restore runs even on failure, so the
# container never persists on public DNS.
- name: Bootstrap container packages, with a temporary public-DNS fallback
  delegate_to: "{{ proxmox_host }}"
  become: true
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
  block:
    - name: Verify DNS resolution in container
      ansible.builtin.shell: |
        echo "Current resolv.conf:"
        pct exec {{ proxmox_lxc_id }} -- cat /etc/resolv.conf
        # apt-get update is the most representative DNS test for what follows.
        echo "Testing DNS with apt-get update..."
        if pct exec {{ proxmox_lxc_id }} -- apt-get update >/dev/null 2>&1; then
          echo "DNS working"
          exit 0
        fi
        echo "WARNING: internal DNS not answering apt-get; appending public DNS to complete bootstrap"
        echo "FALLBACK_DNS_APPLIED"
        pct exec {{ proxmox_lxc_id }} -- bash -c 'echo "nameserver {{ proxmox_lxc_bootstrap_fallback_dns }}" >> /etc/resolv.conf'
        if pct exec {{ proxmox_lxc_id }} -- apt-get update >/dev/null 2>&1; then
          echo "DNS working with public fallback"
          exit 0
        fi
        echo "DNS resolution failed even with public DNS"
        exit 1
      register: proxmox_lxc_dns_check
      # The task mutates resolv.conf on the fallback path; report that honestly
      # rather than declaring itself unconditionally unchanged.
      changed_when: "'FALLBACK_DNS_APPLIED' in (proxmox_lxc_dns_check.stdout_lines | default([]))"

    - name: Install required packages in container
      ansible.builtin.shell: |
        pct exec {{ proxmox_lxc_id }} -- bash -c 'apt-get update && apt-get install -y openssh-server sudo'
      changed_when: true
  always:
    - name: Restore configured nameservers after public-DNS bootstrap fallback
      ansible.builtin.shell:
        cmd: |
          pct exec {{ proxmox_lxc_id }} -- bash -c '
            sd="$1"
            shift
            printf "search %s\n" "$sd" > /etc/resolv.conf
            for ns in "$@"; do
              printf "nameserver %s\n" "$ns" >> /etc/resolv.conf
            done
          ' _ {{ proxmox_lxc_searchdomain | quote }} {{ (proxmox_lxc_nameserver | default('') | string).split() | map('quote') | join(' ') }}
        executable: /bin/bash
      # Machine-readable marker, not a log phrase: editing the message text must
      # not silently leave the container on public DNS.
      when: "'FALLBACK_DNS_APPLIED' in (proxmox_lxc_dns_check.stdout_lines | default([]))"
      changed_when: true

- name: Create the admin user with sudo group
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell:
    cmd: |
      pct exec {{ proxmox_lxc_id }} -- bash -c 'id "$1" >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo "$1"' _ {{ proxmox_lxc_admin_user | quote }}
    executable: /bin/bash
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
  changed_when: true

- name: Create SSH directory for the admin user
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell:
    cmd: |
      pct exec {{ proxmox_lxc_id }} -- bash -c 'mkdir -p "$1/.ssh" && chmod 700 "$1/.ssh"' _ {{ proxmox_lxc_admin_home | trim | quote }}
    executable: /bin/bash
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
  changed_when: true

# Reconciled on every run so a rotated SSH key propagates, preserving lines the
# role does not manage. `pct exec` forwards no env, so values reach the inner
# shell as positional arguments.
- name: Reconcile SSH authorized keys for the admin user
  delegate_to: "{{ proxmox_lxc_reconcile_host }}"
  become: true
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      pct exec {{ proxmox_lxc_id }} -- bash -c '
        set -euo pipefail
        user="$1"
        auth_dir="$2/.ssh"
        auth_file="${auth_dir}/authorized_keys"
        desired="$(printf "%s" "$3" | base64 -d)"
        prune="$4"
        install -d -m 700 -o "$user" -g "$user" "$auth_dir"
        # A blank managed set manages nothing, so leave the file as it stands
        # instead of merging every line against an empty pattern.
        if [ "$prune" != "true" ] && [ -z "${desired//[[:space:]]/}" ]; then
          exit 0
        fi
        tmp="$(mktemp "${auth_file}.XXXXXX")"
        printf "%s\n" "$desired" > "$tmp"
        # Every line outside the managed set is kept, so a forced-command or
        # from=-restricted key seeded outside Ansible survives the reconcile.
        if [ "$prune" != "true" ] && [ -f "$auth_file" ]; then
          foreign="$(grep -vxF -f "$tmp" "$auth_file" || true)"
          if [ -n "$foreign" ]; then
            printf "%s\n" "$foreign" >> "$tmp"
          fi
        fi
        chmod 600 "$tmp"
        # mktemp creates root-owned; sshd rejects authorized_keys not owned by the
        # user, so always chown before the move (whether or not content changed).
        chown "$user:$user" "$tmp"
        if [ -f "$auth_file" ] && cmp -s "$tmp" "$auth_file"; then
          rm -f "$tmp"
        else
          mv "$tmp" "$auth_file"
          echo CHANGED
        fi
      ' _ {{ proxmox_lxc_admin_user | quote }} {{ proxmox_lxc_admin_home | trim | quote }} \
        {{ proxmox_lxc_ssh_public_keys | b64encode | quote }} \
        {{ proxmox_lxc_ssh_authorized_keys_prune | bool | ternary('true', 'false') }}
  args:
    executable: /bin/bash
  register: proxmox_lxc_authkeys_reconcile
  changed_when: "'CHANGED' in (proxmox_lxc_authkeys_reconcile.stdout | default(''))"
  when:
    - not ansible_check_mode
    - proxmox_lxc_ssh_public_keys | length > 0
    # Reconcile existing containers (rc == 0) and freshly-created ones (creation
    # not skipped). If creation is intentionally skipped and the CT is absent,
    # don't pct exec a non-existent container (skip-create / molecule-stub runs).
    - proxmox_lxc_exists.rc == 0 or not (proxmox_lxc_skip_create | default(false))

# The reconcile above already owns .ssh and authorized_keys (install -d -m 700
# -o <user>, chmod 600 + chown before the atomic move). This only sweeps the
# rest of the freshly-created home directory.
- name: Set ownership on the admin home directory
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell:
    cmd: |
      pct exec {{ proxmox_lxc_id }} -- bash -c 'chown -R "$1:$1" "$2"' _ {{ proxmox_lxc_admin_user | quote }} {{ proxmox_lxc_admin_home | trim | quote }}
    executable: /bin/bash
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
  changed_when: true

# Staged, validated, then moved into place: a redirect straight into
# /etc/sudoers.d leaves an unparsable file that breaks sudo for every account.
# The username reaches the inner shell as a positional argument.
- name: Configure passwordless sudo for the admin user
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      pct exec {{ proxmox_lxc_id }} -- bash -c '
        set -euo pipefail
        user="$1"
        # mktemp name starts with a dot, which sudo skips while it is staged.
        tmp="$(mktemp /etc/sudoers.d/.staged.XXXXXX)"
        printf "%s ALL=(ALL) NOPASSWD: ALL\n" "$user" > "$tmp"
        chmod 440 "$tmp"
        # visudo is absent until the sudo package lands; validate when we can.
        if command -v visudo >/dev/null 2>&1; then
          visudo -cf "$tmp" >/dev/null
        fi
        mv "$tmp" "/etc/sudoers.d/${user}"
      ' _ {{ proxmox_lxc_admin_user | quote }}
    executable: /bin/bash
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
  changed_when: true

- name: Enable and start SSH service
  delegate_to: "{{ proxmox_host }}"
  become: true
  ansible.builtin.shell: |
    pct exec {{ proxmox_lxc_id }} -- bash -c 'systemctl enable ssh && systemctl start ssh'
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
  changed_when: true

- name: Wait for container to be reachable via SSH
  ansible.builtin.wait_for:
    host: "{{ proxmox_lxc_target_ip }}"
    port: 22
    delay: 5
    timeout: 120
  when:
    - not ansible_check_mode
    - proxmox_lxc_exists.rc != 0
    - not (proxmox_lxc_skip_create | default(false))

- name: Display container creation status
  vars:
    proxmox_lxc_status_msg: >-
      Container {{ inventory_hostname }} (ID {{ proxmox_lxc_id }})
      {% if ansible_check_mode and proxmox_lxc_exists.rc != 0 %}
      would be created (check mode - no changes made)
      {% elif proxmox_lxc_exists.rc != 0 %}
      created and started with user {{ proxmox_lxc_admin_user }}
      {% else %}
      already exists
      {% endif %}
  ansible.builtin.debug:
    msg: "{{ proxmox_lxc_status_msg }}"
