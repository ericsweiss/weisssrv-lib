---
platforms:
  - name: resolv-conf-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
    # In a privileged container chattr +i sticks on the bind-mounted
    # /etc/resolv.conf; cleanup.yml strips it before destroy so docker rm
    # doesn't fail with EPERM.
    cleanup: cleanup.yml
  inventory:
    group_vars:
      all:
        # Deliberately the unprefixed aliases: this is the contract base and
        # adguard_home pass in.
        host_dns_servers:
          - 192.0.2.10
          - 192.0.2.11
        internal_domain: test.local
        resolv_conf_unsafe_writes: true
        # Exercises the immutable wrap (strip -> write -> chattr +i). +i sticks
        # in this privileged container, unlike an unprivileged LXC guest, so
        # cleanup.yml strips it before destroy and the warning path is unused.
        resolv_conf_immutable: true
