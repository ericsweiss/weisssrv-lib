---
# Runs before destroy: this scenario converges with resolv_conf_immutable: true
# and +i sticks in a privileged container, which would make `docker rm` fail
# with EPERM.
- name: Cleanup
  hosts: all
  gather_facts: false
  # Cleanup also runs before create, so the container is often absent. A missing
  # container surfaces as a task failure on the docker connection (not as
  # unreachable), so failed_when covers it and ignore_unreachable covers runners
  # that classify it the other way.
  ignore_unreachable: true
  tasks:
    - name: Strip immutable attr off /etc/resolv.conf before destroy
      ansible.builtin.raw: chattr -i /etc/resolv.conf 2>/dev/null || true
      changed_when: false
      failed_when: false
