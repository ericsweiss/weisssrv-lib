---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read /etc/resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: resolv_conf_content

    - name: Decode resolv.conf
      ansible.builtin.set_fact:
        resolv_conf_text: "{{ resolv_conf_content.content | b64decode }}"

    - name: Verify nameservers are present
      ansible.builtin.assert:
        that:
          - "'nameserver 192.0.2.10' in resolv_conf_text"
          - "'nameserver 192.0.2.11' in resolv_conf_text"
        fail_msg: "resolv.conf is missing expected nameservers"

    # An empty list must leave both lines out entirely: a bare `search ` would
    # still be parsed by the resolver, so the check greps the rendered file.
    - name: Verify no `search` line is present
      ansible.builtin.assert:
        that:
          - "'search ' not in resolv_conf_text"
          - "not (resolv_conf_text | regex_search('^search', multiline=True))"
        fail_msg: "resolv.conf contains a `search` line; expected none for empty domain list"

    - name: Verify no `domain` line is present
      ansible.builtin.assert:
        that:
          - "'domain ' not in resolv_conf_text"
          - "not (resolv_conf_text | regex_search('^domain', multiline=True))"
        fail_msg: "resolv.conf contains a `domain` line; expected none for empty domain list"

    - name: Verify the custom options list renders as one line
      ansible.builtin.assert:
        that:
          - "'options rotate timeout:1' in resolv_conf_text"
          - (resolv_conf_text | regex_findall('(?m)^options ') | length) == 1
        fail_msg: "resolv.conf does not carry the configured options on a single line"

    # The empty-list branch cannot share this host's file with the case above,
    # so render it to a scratch path instead.
    - name: Render resolv.conf with an empty options list
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir ~ '/../../templates/resolv.conf.j2') }}
        dest: /tmp/resolv.conf-no-options
        mode: "0644"
      vars:
        resolv_conf_options: []

    - name: Read the empty-options render
      ansible.builtin.slurp:
        src: /tmp/resolv.conf-no-options
      register: resolv_conf_no_options

    - name: Verify an empty options list omits the line
      ansible.builtin.assert:
        that:
          - >-
            not ((resolv_conf_no_options.content | b64decode)
                 | regex_search('^options', multiline=True))
        fail_msg: "An empty resolv_conf_options still rendered an `options` line"

    - name: Check file mode
      ansible.builtin.stat:
        path: /etc/resolv.conf
      register: resolv_conf_stat
      failed_when: resolv_conf_stat.stat.mode != "0644"
