---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read /etc/resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: resolv_conf_content

    - name: Decode resolv.conf
      ansible.builtin.set_fact:
        resolv_conf_text: "{{ resolv_conf_content.content | b64decode }}"

    - name: Verify nameservers are present
      ansible.builtin.assert:
        that:
          - "'nameserver 192.0.2.10' in resolv_conf_text"
          - "'nameserver 192.0.2.11' in resolv_conf_text"
        fail_msg: "resolv.conf is missing expected nameservers"

    # An empty list must leave both lines out entirely: a bare `search ` would
    # still be parsed by the resolver, so the check greps the rendered file.
    - name: Verify no `search` line is present
      ansible.builtin.assert:
        that:
          - "'search ' not in resolv_conf_text"
          - "not (resolv_conf_text | regex_search('^search', multiline=True))"
        fail_msg: "resolv.conf contains a `search` line; expected none for empty domain list"

    - name: Verify no `domain` line is present
      ansible.builtin.assert:
        that:
          - "'domain ' not in resolv_conf_text"
          - "not (resolv_conf_text | regex_search('^domain', multiline=True))"
        fail_msg: "resolv.conf contains a `domain` line; expected none for empty domain list"

    - name: Check file mode
      ansible.builtin.stat:
        path: /etc/resolv.conf
      register: resolv_conf_stat
      failed_when: resolv_conf_stat.stat.mode != "0644"
