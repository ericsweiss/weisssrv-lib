---
# Covers the `resolv_conf_search_domains: []` branch (the default scenario
# covers the populated one): a regression that emits a bare `search ` or
# `domain ` line has to trip CI rather than reach a Kubernetes node.
dependency:
  name: galaxy
  options:
    # See molecule-shared/base.yml: one galaxy requirements file, resolved
    # against molecule's CWD (the role dir).
    role-file: ../../requirements.yml
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: resolv-conf-empty-search-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
    # Repo root (the dir holding ansible_collections/) so FQCNs resolve; see
    # molecule-shared/base.yml for why the depths differ.
    ANSIBLE_COLLECTIONS_PATH: ../../../../../../..:~/.ansible/collections:/usr/share/ansible/collections
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
    # Self-contained scenario (no -c base.yml): mirror the base's [connection]
    # pipelining — one docker exec per task instead of put-file + exec.
    connection:
      pipelining: true
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        # Canonical role-prefixed input here; the default scenario covers the
        # unprefixed `host_dns_servers` alias.
        resolv_conf_nameservers:
          - 192.0.2.10
          - 192.0.2.11
        # The feature under test.
        resolv_conf_search_domains: []
        # /etc/resolv.conf is bind-mounted in Docker containers; the atomic
        # rename returns EBUSY. Test-only.
        resolv_conf_unsafe_writes: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
