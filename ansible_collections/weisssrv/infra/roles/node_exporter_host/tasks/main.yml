---
# Node Exporter (host-level) -- hardware metrics from bare-metal Proxmox hosts
# Installs from Debian packages and runs on port 9101 to avoid conflicting
# with the k3s DaemonSet node-exporter on port 9100.

- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter
      # curl is the liveness gate's probe; not guaranteed on a minimal LXC.
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

# smartctl only makes sense on bare-metal hosts; a guest LXC/VM has no visible
# block devices, so the package would be dead weight there.
- name: Install smartmontools (bare-metal Proxmox hosts only)
  ansible.builtin.apt:
    name: smartmontools
    state: present
  when: node_exporter_host_proxmox | bool

# drivetemp is a kernel module exposing SATA drive temperatures via hwmon.
# Unprivileged LXCs that also get this role cannot load modules and have no
# local disks — without the gate the modprobe task fails there.
- name: Persist drivetemp kernel module load across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/drivetemp.conf
    content: "drivetemp\n"
    owner: root
    group: root
    mode: "0644"
  when: node_exporter_host_proxmox | bool

- name: Load drivetemp kernel module now (exposes SATA disk temps via hwmon)
  community.general.modprobe:
    name: drivetemp
    state: present
  when: node_exporter_host_proxmox | bool
  tags:
    - molecule-notest

- name: Create textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_host_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy node-exporter-host systemd override
  ansible.builtin.template:
    src: node-exporter-host.service.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter_host

- name: Enable and start prometheus-node-exporter service
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts before health check
  ansible.builtin.meta: flush_handlers

- name: Verify node_exporter is listening on port {{ node_exporter_host_port }}
  ansible.builtin.uri:
    url: "http://localhost:{{ node_exporter_host_port }}/metrics"
    return_content: false
    status_code: 200
  register: node_exporter_host_health
  retries: 5
  delay: 3
  until: node_exporter_host_health.status == 200
  when: not ansible_check_mode
  tags:
    - molecule-notest

# Liveness gate. The check above is deploy-time only; at RUNTIME the exporter can
# die in a way systemd cannot see — a zombie process keeps its listener bound and
# systemd keeps reporting "active (running)", so no Restart= policy ever fires.
# WatchdogSec cannot cover a Type=simple process that never sd_notifies, so probe
# /metrics the way Prometheus does and restart on a sustained failure.
- name: Install node_exporter healthcheck script
  ansible.builtin.copy:
    src: node-exporter-healthcheck.sh
    dest: /usr/local/sbin/node-exporter-healthcheck.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy node_exporter healthcheck unit + timer
  ansible.builtin.template:
    src: "node-exporter-healthcheck.{{ item }}.j2"
    dest: "/etc/systemd/system/node-exporter-healthcheck.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  notify: Restart node_exporter_host_healthcheck_timer

- name: Enable and start the node_exporter healthcheck timer
  ansible.builtin.systemd:
    name: node-exporter-healthcheck.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags:
    - molecule-notest

# Textfile collectors (Proxmox hosts only)
# One block so the proxmox-group gate lives in a single place; each collector
# keeps its own script + textfile_collector include.
- name: Deploy the Proxmox-host textfile collectors
  when: node_exporter_host_proxmox | bool
  block:
    # Corosync + pmxcfs health: detects the failure class where corosync is
    # alive (so a host-up alert stays green) but pinned at 99% CPU with
    # /etc/pve/ha/manager_status frozen. Writes three metrics so alert rules can
    # fire on either condition and on collector meta-failure.
    - name: Install corosync health collector script
      ansible.builtin.copy:
        src: corosync-health-collector.sh
        dest: /usr/local/sbin/corosync-health-collector.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy corosync health collector unit + timer
      ansible.builtin.include_role:
        name: weisssrv.infra.textfile_collector
      vars:
        textfile_collector_name: corosync-health-collector
        textfile_collector_service_description: Sample corosync + pmxcfs health to node_exporter textfile collector
        textfile_collector_timer_description: Periodically sample corosync + pmxcfs health
        textfile_collector_script: /usr/local/sbin/corosync-health-collector.sh
        textfile_collector_textfile_dir: "{{ node_exporter_host_textfile_dir }}"
        textfile_collector_after:
          - corosync.service

    # zpool status: a pool accumulating vdev checksum errors stays ONLINE, so
    # health-based monitoring (zfs_exporter, SMART) never fires. Exports
    # per-pool error counters + scrub age fleet-wide.
    - name: Install zpool status collector script
      ansible.builtin.copy:
        src: zpool-status-collector.sh
        dest: /usr/local/sbin/zpool-status-collector.sh
        owner: root
        group: root
        mode: "0755"
      when: node_exporter_host_zpool_collector | bool

    - name: Deploy zpool status collector unit + timer
      ansible.builtin.include_role:
        name: weisssrv.infra.textfile_collector
      when: node_exporter_host_zpool_collector | bool
      vars:
        textfile_collector_name: zpool-status-collector
        textfile_collector_service_description: Sample zpool status to node_exporter textfile collector
        textfile_collector_timer_description: Periodically sample zpool status
        textfile_collector_script: /usr/local/sbin/zpool-status-collector.sh
        textfile_collector_textfile_dir: "{{ node_exporter_host_textfile_dir }}"
        textfile_collector_after:
          - zfs-import.target
        textfile_collector_timeout_start_sec: 30s

    # vzdump backup metrics hookscript, referenced by the proxmox_backup job's
    # `script` property. jobs.cfg is clustered, so the `all` job runs on every
    # node and invokes this hook there — it must exist fleet-wide or that node's
    # run aborts. Hence deployed here, not in proxmox_backup (which reconciles
    # the single clustered config on one node). Each node writes its own .prom,
    # distinguished by the instance label at scrape time.
    - name: Install vzdump metrics hookscript
      ansible.builtin.copy:
        src: vzdump-metrics-hook.sh
        dest: /usr/local/bin/vzdump-metrics-hook.sh
        owner: root
        group: root
        mode: "0755"

    # SMART health: smartd emails on attribute failures but exports nothing to
    # Prometheus, leaving dashboards blind to reallocated/pending/uncorrectable
    # sectors and unable to attribute ZFS errors to a disk. Standby-aware
    # (`smartctl -n standby`)
    # so it never wakes drives or aborts long self-tests — the documented
    # reason DEVICESCAN left smartd.conf.
    - name: Install smartmon collector script
      ansible.builtin.copy:
        src: smartmon-collector.sh
        dest: /usr/local/sbin/smartmon-collector.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy smartmon collector unit + timer
      ansible.builtin.include_role:
        name: weisssrv.infra.textfile_collector
      vars:
        textfile_collector_name: smartmon-collector
        textfile_collector_service_description: Sample SMART device health to node_exporter textfile collector
        textfile_collector_timer_description: Periodically sample SMART device health
        textfile_collector_script: /usr/local/sbin/smartmon-collector.sh
        textfile_collector_textfile_dir: "{{ node_exporter_host_textfile_dir }}"
        textfile_collector_timeout_start_sec: 120s
        textfile_collector_on_boot_sec: 2min
        textfile_collector_on_unit_inactive_sec: 5min
        textfile_collector_accuracy_sec: 30s

    # The zpool timer is only in this list when its unit was rendered above:
    # with node_exporter_host_zpool_collector false the unit does not exist and
    # systemd would fail the whole play with "Could not find the requested
    # service zpool-status-collector.timer".
    - name: Enable + start the collector timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: >-
        {{ ['corosync-health-collector.timer', 'smartmon-collector.timer']
           + (['zpool-status-collector.timer']
              if node_exporter_host_zpool_collector | bool else []) }}
      when: not ansible_check_mode

# Deliberately no auto-clean when node_exporter_host_proxmox flips to false: a
# wrong cleanup on a real Proxmox host is worse than stale files on a demoted
# one. Remove them by hand in that rare case (the collector scripts under
# /usr/local/sbin plus their /etc/systemd/system units).
