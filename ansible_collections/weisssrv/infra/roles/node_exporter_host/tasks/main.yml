---
# Node Exporter (host-level) -- hardware metrics from bare-metal Proxmox hosts
# Installs from Debian packages and runs on port 9101 to avoid conflicting
# with the k3s DaemonSet node-exporter on port 9100.

- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter
      # curl is the liveness gate's probe; not guaranteed on a minimal LXC.
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

# smartctl only makes sense on bare-metal hosts; a guest LXC/VM has no visible
# block devices, so the package would be dead weight there.
- name: Install smartmontools (bare-metal Proxmox hosts only)
  ansible.builtin.apt:
    name: smartmontools
    state: present
  when: node_exporter_host_proxmox | bool

# drivetemp is a kernel module exposing SATA drive temperatures via hwmon.
# Unprivileged LXCs that also get this role cannot load modules and have no
# local disks — without the gate the modprobe task fails there.
- name: Persist drivetemp kernel module load across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/drivetemp.conf
    content: "drivetemp\n"
    owner: root
    group: root
    mode: "0644"
  when: node_exporter_host_proxmox | bool

- name: Load drivetemp kernel module now (exposes SATA disk temps via hwmon)
  community.general.modprobe:
    name: drivetemp
    state: present
  when: node_exporter_host_proxmox | bool
  tags:
    - molecule-notest

- name: Create textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_host_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy node-exporter-host systemd override
  ansible.builtin.template:
    src: node-exporter-host.service.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter_host

- name: Enable and start prometheus-node-exporter service
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts before health check
  ansible.builtin.meta: flush_handlers

- name: Verify node_exporter is listening on port {{ node_exporter_host_port }}
  ansible.builtin.uri:
    url: "http://{{ _node_exporter_host_probe_url_host }}:{{ node_exporter_host_port }}/metrics"
    # The body is needed by the collector assertion below; a 200 alone does not
    # prove a collector produced anything.
    return_content: true
    status_code: 200
  register: node_exporter_host_health
  retries: 5
  delay: 3
  until: node_exporter_host_health.status == 200
  when: not ansible_check_mode
  tags:
    - molecule-notest

# HTTP 200 is not a per-collector gate: node_exporter answers 200 with a
# collector's series absent. Assert the series the alerts key on is present.
# See README "Proving the collector actually ran".
- name: Assert the systemd collector actually emits node_systemd_unit_state
  ansible.builtin.assert:
    that:
      - "'node_systemd_unit_state{' in node_exporter_host_health.content"
    fail_msg: >-
      node_exporter answered 200 but exported no node_systemd_unit_state series,
      so every node_systemd_* alert is dead rather than quiet — see README
      "systemd collector" for the D-Bus diagnosis.
    success_msg: "systemd collector is exporting node_systemd_unit_state"
  when:
    - not ansible_check_mode
    - node_exporter_host_systemd_collector | bool
  tags:
    - molecule-notest

# Liveness gate: a zombie exporter keeps its listener bound and stays
# "active (running)", so no Restart= fires. See README "Liveness gate".
- name: Install node_exporter healthcheck script
  ansible.builtin.copy:
    src: node-exporter-healthcheck.sh
    dest: /usr/local/sbin/node-exporter-healthcheck.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy node_exporter healthcheck unit + timer
  ansible.builtin.template:
    src: "node-exporter-healthcheck.{{ item }}.j2"
    dest: "/etc/systemd/system/node-exporter-healthcheck.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  notify: Restart node_exporter_host_healthcheck_timer

- name: Enable and start the node_exporter healthcheck timer
  ansible.builtin.systemd:
    name: node-exporter-healthcheck.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags:
    - molecule-notest

# The slabinfo collector ships inside the Proxmox block below, so the flag alone
# installs nothing on any other host.
- name: Assert the slabinfo collector inputs are consistent
  ansible.builtin.assert:
    that:
      - not (node_exporter_host_slabinfo_collector | bool)
        or (node_exporter_host_proxmox | bool)
      # A cache named twice writes the same series twice into one .prom, which
      # the Prometheus registry rejects for the whole textfile set.
      - node_exporter_host_slab_caches | unique | length
        == node_exporter_host_slab_caches | length
      # An empty list publishes the success sentinel and no per-cache series,
      # which reads as "the leak stopped" instead of "nothing was measured".
      - not (node_exporter_host_slabinfo_collector | bool)
        or (node_exporter_host_slab_caches | default([]) | length) > 0
    fail_msg: >-
      node_exporter_host_slabinfo_collector is true but
      node_exporter_host_proxmox is false (the slabinfo collector ships inside
      the Proxmox-host textfile collectors and would install nothing here), or
      node_exporter_host_slab_caches lists a cache twice, or
      node_exporter_host_slab_caches is empty while the collector is enabled, so
      it would publish only its success sentinel and no per-cache series:
      {{ node_exporter_host_slab_caches | default([]) }}.
    success_msg: "The slabinfo collector's host gate and cache list are consistent"

# Textfile collectors (Proxmox hosts only)
# One block so the proxmox-group gate lives in a single place; each collector
# keeps its own script + textfile_collector include.
- name: Deploy the Proxmox-host textfile collectors
  when: node_exporter_host_proxmox | bool
  block:
    # Corosync + pmxcfs health: catches a corosync that is alive (host-up stays
    # green) but pinned at 99% CPU with a frozen manager_status. Three metrics,
    # so rules can fire on either condition and on collector meta-failure.
    - name: Install corosync health collector script
      ansible.builtin.copy:
        src: corosync-health-collector.sh
        dest: /usr/local/sbin/corosync-health-collector.sh
        owner: root
        group: root
        mode: "0755"
      when: node_exporter_host_corosync_collector | bool

    - name: Deploy corosync health collector unit + timer
      ansible.builtin.include_role:
        name: weisssrv.infra.textfile_collector
      when: node_exporter_host_corosync_collector | bool
      vars:
        textfile_collector_name: corosync-health-collector
        textfile_collector_service_description: Sample corosync + pmxcfs health to node_exporter textfile collector
        textfile_collector_timer_description: Periodically sample corosync + pmxcfs health
        textfile_collector_script: /usr/local/sbin/corosync-health-collector.sh
        textfile_collector_textfile_dir: "{{ node_exporter_host_textfile_dir }}"
        textfile_collector_after:
          - corosync.service

    # zpool status: a pool accumulating vdev checksum errors stays ONLINE, so
    # health-based monitoring (zfs_exporter, SMART) never fires. Exports
    # per-pool error counters + scrub age fleet-wide.
    - name: Install zpool status collector script
      ansible.builtin.copy:
        src: zpool-status-collector.sh
        dest: /usr/local/sbin/zpool-status-collector.sh
        owner: root
        group: root
        mode: "0755"
      when: node_exporter_host_zpool_collector | bool

    - name: Deploy zpool status collector unit + timer
      ansible.builtin.include_role:
        name: weisssrv.infra.textfile_collector
      when: node_exporter_host_zpool_collector | bool
      vars:
        textfile_collector_name: zpool-status-collector
        textfile_collector_service_description: Sample zpool status to node_exporter textfile collector
        textfile_collector_timer_description: Periodically sample zpool status
        textfile_collector_script: /usr/local/sbin/zpool-status-collector.sh
        textfile_collector_textfile_dir: "{{ node_exporter_host_textfile_dir }}"
        textfile_collector_after:
          - zfs-import.target
        textfile_collector_timeout_start_sec: 30s

    # Per-cache slab usage: node_memory_Slab_bytes only carries the total, so a
    # leak in one cache is invisible until the host runs out of memory.
    - name: Install slabinfo collector script
      ansible.builtin.copy:
        src: slabinfo-collector.sh
        dest: /usr/local/sbin/slabinfo-collector.sh
        owner: root
        group: root
        mode: "0755"
      when: node_exporter_host_slabinfo_collector | bool

    # The allowlist travels in a defaults file, not the ExecStart line: the
    # shared collector unit passes the textfile dir and nothing else. A
    # template, since ansible_managed resolves only inside that module.
    - name: Configure the slabinfo collector cache allowlist
      ansible.builtin.template:
        src: slabinfo-collector.defaults.j2
        dest: /etc/default/slabinfo-collector
        owner: root
        group: root
        mode: "0644"
      when: node_exporter_host_slabinfo_collector | bool

    - name: Deploy slabinfo collector unit + timer
      ansible.builtin.include_role:
        name: weisssrv.infra.textfile_collector
      when: node_exporter_host_slabinfo_collector | bool
      vars:
        textfile_collector_name: slabinfo-collector
        textfile_collector_service_description: Sample per-cache slab usage to node_exporter textfile collector
        textfile_collector_timer_description: Periodically sample per-cache slab usage
        textfile_collector_script: /usr/local/sbin/slabinfo-collector.sh
        textfile_collector_textfile_dir: "{{ node_exporter_host_textfile_dir }}"
        textfile_collector_on_unit_inactive_sec: 5min

    # CRITICAL: vzdump hookscript referenced by the clustered proxmox_backup
    # job. The `all` job runs on every node and invokes this hook there, so it
    # must exist fleet-wide or that node's backup run aborts. That is why it
    # ships here and not in proxmox_backup, which configures one node.
    - name: Install vzdump metrics hookscript
      ansible.builtin.include_tasks: vzdump_hook.yml

    # SMART health: smartd emails on attribute failures but exports nothing to
    # Prometheus. Standby-aware (`smartctl -n standby`), so it never wakes
    # drives or aborts long self-tests.
    - name: Install smartmon collector script
      ansible.builtin.copy:
        src: smartmon-collector.sh
        dest: /usr/local/sbin/smartmon-collector.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy smartmon collector unit + timer
      ansible.builtin.include_role:
        name: weisssrv.infra.textfile_collector
      vars:
        textfile_collector_name: smartmon-collector
        textfile_collector_service_description: Sample SMART device health to node_exporter textfile collector
        textfile_collector_timer_description: Periodically sample SMART device health
        textfile_collector_script: /usr/local/sbin/smartmon-collector.sh
        textfile_collector_textfile_dir: "{{ node_exporter_host_textfile_dir }}"
        textfile_collector_timeout_start_sec: 120s
        textfile_collector_on_boot_sec: 2min
        textfile_collector_on_unit_inactive_sec: 5min
        textfile_collector_accuracy_sec: 30s

    # A timer is only in this list when its unit was rendered above: with the
    # collector's seam false the unit does not exist and systemd would fail the
    # whole play with "Could not find the requested service ...".
    - name: Enable + start the collector timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: >-
        {{ ['smartmon-collector.timer']
           + (['corosync-health-collector.timer']
              if node_exporter_host_corosync_collector | bool else [])
           + (['zpool-status-collector.timer']
              if node_exporter_host_zpool_collector | bool else [])
           + (['slabinfo-collector.timer']
              if node_exporter_host_slabinfo_collector | bool else []) }}
      when: not ansible_check_mode

    # A host switched off ZFS must not keep the previously deployed timer
    # running or serve its stale zpool metrics.
    - name: Reconcile the zpool collector away when disabled
      when: not node_exporter_host_zpool_collector | bool
      block:
        - name: Check whether the zpool collector timer unit is still on disk
          ansible.builtin.stat:
            path: /etc/systemd/system/zpool-status-collector.timer
          register: node_exporter_host_zpool_leftover_timer

        # Gated on the unit file rather than failed_when: false, which would
        # also swallow a D-Bus error or a typo'd unit name and then delete the
        # files out from under a timer that is still running.
        - name: Stop + disable the zpool collector timer
          ansible.builtin.systemd:
            name: zpool-status-collector.timer
            enabled: false
            state: stopped
          when:
            - node_exporter_host_zpool_leftover_timer.stat.exists
            - not ansible_check_mode

        - name: Remove the zpool collector unit, timer, script and metrics
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/zpool-status-collector.timer
            - /etc/systemd/system/zpool-status-collector.service
            - /usr/local/sbin/zpool-status-collector.sh
            - "{{ node_exporter_host_textfile_dir }}/zfs_pool_status.prom"

        # systemd keeps a removed unit loaded until it is told to forget it.
        - name: Reload systemd after removing the zpool collector units
          ansible.builtin.systemd:
            daemon_reload: true
          when:
            - node_exporter_host_zpool_leftover_timer.stat.exists
            - not ansible_check_mode

    # Same for a host that is not clustered: an armed timer would keep
    # publishing the mtime-0 series PmxcfsStale fires on.
    - name: Reconcile the corosync collector away when disabled
      when: not node_exporter_host_corosync_collector | bool
      block:
        - name: Check whether the corosync collector timer unit is still on disk
          ansible.builtin.stat:
            path: /etc/systemd/system/corosync-health-collector.timer
          register: node_exporter_host_corosync_leftover_timer

        # Gated on the unit file rather than failed_when: false, which would
        # also swallow a D-Bus error or a typo'd unit name and then delete the
        # files out from under a timer that is still running.
        - name: Stop + disable the corosync collector timer
          ansible.builtin.systemd:
            name: corosync-health-collector.timer
            enabled: false
            state: stopped
          when:
            - node_exporter_host_corosync_leftover_timer.stat.exists
            - not ansible_check_mode

        - name: Remove the corosync collector unit, timer, script and metrics
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/corosync-health-collector.timer
            - /etc/systemd/system/corosync-health-collector.service
            - /usr/local/sbin/corosync-health-collector.sh
            - "{{ node_exporter_host_textfile_dir }}/corosync_health.prom"

        # systemd keeps a removed unit loaded until it is told to forget it.
        - name: Reload systemd after removing the corosync collector units
          ansible.builtin.systemd:
            daemon_reload: true
          when:
            - node_exporter_host_corosync_leftover_timer.stat.exists
            - not ansible_check_mode

    # A host that no longer needs the per-cache series must not keep the timer
    # running or serve its stale slab metrics.
    - name: Reconcile the slabinfo collector away when disabled
      when: not node_exporter_host_slabinfo_collector | bool
      block:
        - name: Check whether the slabinfo collector timer unit is still on disk
          ansible.builtin.stat:
            path: /etc/systemd/system/slabinfo-collector.timer
          register: node_exporter_host_slabinfo_leftover_timer

        - name: Stop + disable the slabinfo collector timer
          ansible.builtin.systemd:
            name: slabinfo-collector.timer
            enabled: false
            state: stopped
          when:
            - node_exporter_host_slabinfo_leftover_timer.stat.exists
            - not ansible_check_mode

        - name: Remove the slabinfo collector unit, timer, script and metrics
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/slabinfo-collector.timer
            - /etc/systemd/system/slabinfo-collector.service
            - /usr/local/sbin/slabinfo-collector.sh
            - /etc/default/slabinfo-collector
            - "{{ node_exporter_host_textfile_dir }}/node_slabinfo.prom"

        - name: Reload systemd after removing the slabinfo collector units
          ansible.builtin.systemd:
            daemon_reload: true
          when:
            - node_exporter_host_slabinfo_leftover_timer.stat.exists
            - not ansible_check_mode

# No auto-clean when node_exporter_host_proxmox flips to false: a wrong cleanup
# on a real Proxmox host is worse than stale files on a demoted one. Remove the
# collector scripts and their units by hand in that case.
