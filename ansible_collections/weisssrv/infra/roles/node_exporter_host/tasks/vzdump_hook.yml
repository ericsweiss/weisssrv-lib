---
# Entry point for `tasks_from: vzdump_hook`: installs only the vzdump metrics
# hookscript. weisssrv.infra.proxmox_backup includes it so the path exists
# before pvesh validates a backup job's `--script`.

- name: Install vzdump metrics hookscript
  ansible.builtin.copy:
    src: vzdump-metrics-hook.sh
    dest: /usr/local/bin/vzdump-metrics-hook.sh
    owner: root
    group: root
    mode: "0755"

# A template, since ansible_managed resolves only inside that module.
- name: Configure the vzdump hookscript textfile directory
  ansible.builtin.template:
    src: vzdump-metrics-hook.defaults.j2
    dest: /etc/default/vzdump-metrics-hook
    owner: root
    group: root
    mode: "0644"
