---
# 9101, not 9100: the in-cluster node-exporter DaemonSet owns 9100 on the k3s
# nodes, and both run on the same box in a converged deployment.
node_exporter_host_port: 9101

node_exporter_host_textfile_dir: /var/lib/node_exporter

# Keep well inside the `for:` of the exporter-down alert covering this job, so
# the self-heal lands before the alert (README "Liveness gate").
node_exporter_host_healthcheck_interval: 5min

# Bare-metal Proxmox host? Gates smartmontools, drivetemp and the
# corosync/zpool/SMART/vzdump collectors, which fail or are meaningless in an
# unprivileged LXC or a guest VM.
node_exporter_host_proxmox: false

# Follows the Proxmox flag; set false on a Proxmox host whose storage is not ZFS
# so the timer is never deployed (README "zpool-status collector").
node_exporter_host_zpool_collector: "{{ node_exporter_host_proxmox }}"

# Set false on a STANDALONE PVE host: with no corosync the collector publishes
# mtime 0, which PmxcfsStale treats as stale by design.
node_exporter_host_corosync_collector: "{{ node_exporter_host_proxmox }}"

# Default-OFF upstream, so node_systemd_* exists nowhere unless asked for. The
# include pattern bounds cardinality; series list in README "systemd collector".
#
# The patterns use `[.]` rather than `\.` on purpose: the value lands in a
# systemd ExecStart= line, where an unrecognised backslash escape makes systemd
# reject the whole command.
node_exporter_host_systemd_collector: true
node_exporter_host_systemd_unit_include: ".+[.](service|timer)"
node_exporter_host_systemd_unit_exclude: ".+[.](automount|device|mount|scope|slice)"
