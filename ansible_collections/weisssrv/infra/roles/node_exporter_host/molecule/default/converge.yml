---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"
  tasks:
    # Normal Proxmox state (zpool collector on). The off-state toggle — the
    # Ceph/LVM-thin regression test AND the reconcile-away cleanup — lives in
    # side_effect.yml, which molecule runs AFTER the idempotence check: a
    # state toggle inside converge can never be idempotent.
    - name: Apply the role
      ansible.builtin.include_role:
        name: weisssrv.infra.node_exporter_host
      vars:
        node_exporter_host_zpool_collector: true
