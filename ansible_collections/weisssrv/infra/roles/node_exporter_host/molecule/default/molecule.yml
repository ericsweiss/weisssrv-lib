---
platforms:
  - name: node-exporter-host-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
# side_effect runs the collector state toggles AFTER the idempotence check —
# a toggle inside converge can never be idempotent.
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
provisioner:
  playbooks:
    prepare: prepare.yml
    side_effect: side_effect.yml
  inventory:
    group_vars:
      all:
        # Exercise the bare-metal path: without it the collectors self-skip and
        # nothing below the package install would be covered.
        node_exporter_host_proxmox: true
        # Off by default, so it is set scenario-wide rather than per include:
        # any include_role that left it unset would reconcile it away.
        node_exporter_host_slabinfo_collector: true
        # The default list is empty and the role rejects that with the collector
        # on, so the scenario names caches to cover the allowlist render.
        node_exporter_host_slab_caches:
          - skbuff_ext_cache
          - dentry
        # Pinned at the default so verify.yml, which loads no role defaults,
        # can assert the rendered files carry the configured directory.
        node_exporter_host_textfile_dir: /var/lib/node_exporter
