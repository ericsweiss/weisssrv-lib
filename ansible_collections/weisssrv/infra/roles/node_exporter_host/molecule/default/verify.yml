---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Check prometheus-node-exporter package is installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' prometheus-node-exporter
      register: ne_pkg
      changed_when: false
      failed_when: "'install ok installed' not in ne_pkg.stdout"

    - name: Verify textfile collector directory exists
      ansible.builtin.stat:
        path: /var/lib/node_exporter
      register: textfile_dir
      failed_when: not textfile_dir.stat.exists or not textfile_dir.stat.isdir

    - name: Verify systemd override is present
      ansible.builtin.stat:
        path: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
      register: override_file
      failed_when: not override_file.stat.exists

    - name: Read systemd override content
      ansible.builtin.slurp:
        src: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
      register: override_content

    - name: Verify override pins port 9101 and textfile collector
      ansible.builtin.assert:
        that:
          - "':9101' in (override_content.content | b64decode)"
          - "'--collector.textfile' in (override_content.content | b64decode)"
          - "'--collector.textfile.directory=/var/lib/node_exporter' in (override_content.content | b64decode)"
        fail_msg: "systemd override is missing required listen-address or textfile flags"
        success_msg: "systemd override pins port 9101 and textfile collector"

    # The systemd collector is default-OFF upstream: without these flags
    # node_systemd_* is emitted by nothing and any "unit X failed" alert is dead
    # on arrival. enable-restarts-metrics is the separate flag that produces
    # node_systemd_service_restart_total (the crash-loop series).
    - name: Verify the override enables the systemd collector with unit filters
      ansible.builtin.assert:
        that:
          - "'--collector.systemd ' in (override_content.content | b64decode)"
          - "'--collector.systemd.unit-include=' in (override_content.content | b64decode)"
          - "'--collector.systemd.unit-exclude=' in (override_content.content | b64decode)"
          - "'--collector.systemd.enable-restarts-metrics' in (override_content.content | b64decode)"
        fail_msg: "systemd override does not enable the systemd collector — node_systemd_* has no emitter"
        success_msg: "systemd override enables the filtered systemd collector"

    - name: Scrape /metrics for the systemd collector series
      ansible.builtin.uri:
        url: "http://localhost:9101/metrics"
        return_content: true
      register: node_exporter_host_metrics

    # collector_success is asserted first so the two failure modes stay
    # distinguishable: 0 means the collector errored (usually no D-Bus system
    # bus), 1 with no series means the unit filter matched nothing.
    - name: Assert the systemd collector emits the series the alerts select
      ansible.builtin.assert:
        that:
          - "'node_scrape_collector_success{collector=\"systemd\"} 1' in node_exporter_host_metrics.content"
          - "'node_systemd_unit_state{' in node_exporter_host_metrics.content"
          - "'node_systemd_service_restart_total{' in node_exporter_host_metrics.content"
          - "'state=\"failed\"' in node_exporter_host_metrics.content"
        fail_msg: >-
          The systemd collector produced nothing usable — node_systemd_unit_state
          / node_systemd_service_restart_total are absent from /metrics, so the
          NodeSystemdServiceFailed and NodeSystemdServiceCrashlooping alerts have
          no emitter. Check node_scrape_collector_success{collector="systemd"}
          and `journalctl -u prometheus-node-exporter`.
        success_msg: "node_systemd_unit_state + node_systemd_service_restart_total are exported"

    - name: Verify service is enabled
      ansible.builtin.systemd:
        name: prometheus-node-exporter
      register: ne_status

    - name: Assert service is enabled
      ansible.builtin.assert:
        that:
          - ne_status.status.UnitFileState == 'enabled'
        fail_msg: "prometheus-node-exporter is not enabled"
        success_msg: "prometheus-node-exporter is enabled"

    # corosync collector — deploy contract + end-to-end run (proxmox gate on)

    - name: Verify corosync health collector script is present and executable
      ansible.builtin.stat:
        path: /usr/local/sbin/corosync-health-collector.sh
      register: corosync_script

    - name: Assert corosync collector script is mode 0755 root:root
      ansible.builtin.assert:
        that:
          - corosync_script.stat.exists
          - corosync_script.stat.mode == "0755"
          - corosync_script.stat.pw_name == "root"
          - corosync_script.stat.gr_name == "root"
        fail_msg: "corosync-health-collector.sh missing or has wrong perms"

    - name: Verify corosync collector service unit is present
      ansible.builtin.stat:
        path: /etc/systemd/system/corosync-health-collector.service
      register: corosync_svc

    - name: Assert corosync collector service unit is mode 0644 root:root
      ansible.builtin.assert:
        that:
          - corosync_svc.stat.exists
          - corosync_svc.stat.mode == "0644"
        fail_msg: "corosync-health-collector.service missing or has wrong perms"

    - name: Verify corosync collector timer unit is present
      ansible.builtin.stat:
        path: /etc/systemd/system/corosync-health-collector.timer
      register: corosync_timer

    - name: Assert corosync collector timer unit is mode 0644 root:root
      ansible.builtin.assert:
        that:
          - corosync_timer.stat.exists
          - corosync_timer.stat.mode == "0644"
        fail_msg: "corosync-health-collector.timer missing or has wrong perms"

    # The role's enable+start step runs for real here (converge.yml's first pass
    # is what proves the timer list follows node_exporter_host_zpool_collector
    # instead of naming a unit that was never rendered), so all three timers
    # must be enabled.
    - name: Check the collector timers are enabled  # noqa command-instead-of-module
      ansible.builtin.command: "systemctl is-enabled {{ item }}"
      register: node_exporter_host_timer_enabled
      changed_when: false
      failed_when: node_exporter_host_timer_enabled.stdout | trim != 'enabled'
      loop:
        - corosync-health-collector.timer
        - zpool-status-collector.timer
        - smartmon-collector.timer

    # End-to-end smoke: run the script directly rather than waiting out the
    # timer. corosync is absent in CI, but the script's `set +e` guard handles
    # that and still emits a well-formed .prom file with cpu=0 + last_success
    # sentinel.
    - name: Invoke corosync collector once to produce textfile metric
      ansible.builtin.command: /usr/local/sbin/corosync-health-collector.sh
      changed_when: false

    - name: Verify .prom file was written
      ansible.builtin.stat:
        path: /var/lib/node_exporter/corosync_health.prom
      register: corosync_prom

    - name: Assert .prom file exists and has content
      ansible.builtin.assert:
        that:
          - corosync_prom.stat.exists
          - corosync_prom.stat.size > 0
        fail_msg: "corosync_health.prom missing or empty"

    - name: Read .prom file
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/corosync_health.prom
      register: corosync_prom_content

    - name: Assert .prom file contains all three expected metrics
      ansible.builtin.assert:
        that:
          - "'proxmox_corosync_cpu_percent ' in (corosync_prom_content.content | b64decode)"
          - "'proxmox_pmxcfs_manager_status_mtime_seconds ' in (corosync_prom_content.content | b64decode)"
          - "'proxmox_corosync_health_collector_last_success_seconds ' in (corosync_prom_content.content | b64decode)"
        fail_msg: "corosync_health.prom missing one or more metrics"

    # zpool collector — no zpool binary in CI, so the run exercises the
    # no-ZFS path: only the last_success sentinel is emitted.

    - name: Verify zpool collector script is present and executable
      ansible.builtin.stat:
        path: /usr/local/sbin/zpool-status-collector.sh
      register: zpool_script

    - name: Assert zpool collector script is mode 0755 root:root
      ansible.builtin.assert:
        that:
          - zpool_script.stat.exists
          - zpool_script.stat.mode == "0755"
          - zpool_script.stat.pw_name == "root"
          - zpool_script.stat.gr_name == "root"
        fail_msg: "zpool-status-collector.sh missing or has wrong perms"

    - name: Verify zpool collector service unit is present
      ansible.builtin.stat:
        path: /etc/systemd/system/zpool-status-collector.service
      register: zpool_svc

    - name: Assert zpool collector service unit is mode 0644
      ansible.builtin.assert:
        that:
          - zpool_svc.stat.exists
          - zpool_svc.stat.mode == "0644"
        fail_msg: "zpool-status-collector.service missing or has wrong perms"

    - name: Verify zpool collector timer unit is present
      ansible.builtin.stat:
        path: /etc/systemd/system/zpool-status-collector.timer
      register: zpool_timer

    - name: Assert zpool collector timer unit is mode 0644
      ansible.builtin.assert:
        that:
          - zpool_timer.stat.exists
          - zpool_timer.stat.mode == "0644"
        fail_msg: "zpool-status-collector.timer missing or has wrong perms"

    - name: Invoke zpool collector once to produce textfile metric
      ansible.builtin.command: /usr/local/sbin/zpool-status-collector.sh
      changed_when: false

    - name: Read zpool .prom file
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/zfs_pool_status.prom
      register: zpool_prom_content

    - name: Assert zpool .prom emits the sentinel (no-ZFS host path)
      ansible.builtin.assert:
        that:
          - "'zfs_pool_status_collector_last_success_seconds ' in (zpool_prom_content.content | b64decode)"
        fail_msg: "zfs_pool_status.prom missing the collector sentinel"

    # smartmon collector — no SMART-capable devices in CI, so the run
    # exercises the degraded path: only the last_success sentinel is required.

    - name: Verify smartmon collector script is present and executable
      ansible.builtin.stat:
        path: /usr/local/sbin/smartmon-collector.sh
      register: smartmon_script

    - name: Assert smartmon collector script is mode 0755 root:root
      ansible.builtin.assert:
        that:
          - smartmon_script.stat.exists
          - smartmon_script.stat.mode == "0755"
          - smartmon_script.stat.pw_name == "root"
          - smartmon_script.stat.gr_name == "root"
        fail_msg: "smartmon-collector.sh missing or has wrong perms"

    - name: Verify smartmon collector service unit is present
      ansible.builtin.stat:
        path: /etc/systemd/system/smartmon-collector.service
      register: smartmon_svc

    - name: Assert smartmon collector service unit is mode 0644
      ansible.builtin.assert:
        that:
          - smartmon_svc.stat.exists
          - smartmon_svc.stat.mode == "0644"
        fail_msg: "smartmon-collector.service missing or has wrong perms"

    - name: Verify smartmon collector timer unit is present
      ansible.builtin.stat:
        path: /etc/systemd/system/smartmon-collector.timer
      register: smartmon_timer

    - name: Assert smartmon collector timer unit is mode 0644
      ansible.builtin.assert:
        that:
          - smartmon_timer.stat.exists
          - smartmon_timer.stat.mode == "0644"
        fail_msg: "smartmon-collector.timer missing or has wrong perms"

    - name: Invoke smartmon collector once to produce textfile metric
      ansible.builtin.command: /usr/local/sbin/smartmon-collector.sh
      changed_when: false

    - name: Read smartmon .prom file
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/smartmon.prom
      register: smartmon_prom_content

    - name: Assert smartmon .prom emits the sentinel
      ansible.builtin.assert:
        that:
          - "'smartmon_collector_last_success_seconds ' in (smartmon_prom_content.content | b64decode)"
        fail_msg: "smartmon.prom missing the collector sentinel"

    # vzdump metrics hookscript — deployment plus the job-end / backup-abort
    # verdict; a cluster-wide vzdump job runs on every node.
    - name: Verify vzdump metrics hookscript is present and executable
      ansible.builtin.stat:
        path: /usr/local/bin/vzdump-metrics-hook.sh
      register: vzdump_hook

    - name: Assert vzdump hookscript is mode 0755 root:root
      ansible.builtin.assert:
        that:
          - vzdump_hook.stat.exists
          - vzdump_hook.stat.mode == "0755"
        fail_msg: "vzdump-metrics-hook.sh missing or has wrong perms"

    - name: Invoke hookscript job-end (clean run)
      ansible.builtin.command: /usr/local/bin/vzdump-metrics-hook.sh job-end
      changed_when: false
      environment:
        VZDUMP_JOBID: molecule-clean

    - name: Read vzdump_backup.prom after clean run
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/vzdump_backup.prom
      register: vzdump_prom_clean

    - name: Assert a clean job-end reports success
      ansible.builtin.assert:
        that:
          - "'vzdump_backup_last_run_success 1' in (vzdump_prom_clean.content | b64decode)"
        fail_msg: "clean job-end did not report vzdump_backup_last_run_success 1"

    - name: Invoke hookscript backup-abort then job-end (guest failed)
      ansible.builtin.command: "/usr/local/bin/vzdump-metrics-hook.sh {{ item }}"
      changed_when: false
      environment:
        VZDUMP_JOBID: molecule-fail
      loop:
        - backup-abort
        - job-end

    - name: Read vzdump_backup.prom after failed run
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/vzdump_backup.prom
      register: vzdump_prom_fail

    - name: Assert a per-guest backup-abort downgrades job-end to failure
      ansible.builtin.assert:
        that:
          - "'vzdump_backup_last_run_success 0' in (vzdump_prom_fail.content | b64decode)"
        fail_msg: "backup-abort did not downgrade job-end to vzdump_backup_last_run_success 0"

    # liveness gate — guards a zombie exporter systemd still reports active, so
    # the probe must be able to FAIL as well as pass; both directions run here.

    - name: Verify healthcheck script is present and executable
      ansible.builtin.stat:
        path: /usr/local/sbin/node-exporter-healthcheck.sh
      register: healthcheck_script

    - name: Assert healthcheck script is mode 0755 root:root
      ansible.builtin.assert:
        that:
          - healthcheck_script.stat.exists
          - healthcheck_script.stat.mode == "0755"
          - healthcheck_script.stat.pw_name == "root"
          - healthcheck_script.stat.gr_name == "root"
        fail_msg: "node-exporter-healthcheck.sh missing or has wrong perms"

    - name: Verify healthcheck unit + timer are present
      ansible.builtin.stat:
        path: "/etc/systemd/system/node-exporter-healthcheck.{{ item }}"
      register: healthcheck_units
      loop:
        - service
        - timer

    - name: Assert healthcheck units are mode 0644
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == "0644"
        fail_msg: "node-exporter-healthcheck unit missing or has wrong perms"
      loop: "{{ healthcheck_units.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read healthcheck service unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/node-exporter-healthcheck.service
      register: healthcheck_svc_content

    - name: Assert the unit probes the configured port
      ansible.builtin.assert:
        that:
          - "'node-exporter-healthcheck.sh 9101' in (healthcheck_svc_content.content | b64decode)"
        fail_msg: "healthcheck unit does not probe port 9101"

    - name: Probe-only run against the live exporter reports healthy
      ansible.builtin.command: /usr/local/sbin/node-exporter-healthcheck.sh --probe-only 9101
      changed_when: false

    # The negative case: a port nothing is listening on must be detected, not
    # silently passed. Without this, a probe that always succeeds (wrong URL,
    # swallowed curl error) would look identical to a working gate.
    - name: Probe-only run against a dead port must fail
      ansible.builtin.command: /usr/local/sbin/node-exporter-healthcheck.sh --probe-only 19999
      register: healthcheck_dead_port
      changed_when: false
      failed_when: healthcheck_dead_port.rc == 0

    - name: Record the exporter's main PID before the restart path runs
      ansible.builtin.systemd:
        name: prometheus-node-exporter
      register: exporter_state_before

    # Full run against the dead port with the unit still "active" reproduces the
    # zombie signature (systemd says up, nothing answers) and must restart it.
    - name: Full run against a dead port restarts the exporter
      ansible.builtin.command: /usr/local/sbin/node-exporter-healthcheck.sh 19999
      changed_when: true

    - name: Record the exporter's main PID after the restart path ran
      ansible.builtin.systemd:
        name: prometheus-node-exporter
      register: exporter_state_after

    - name: Assert the exporter was actually restarted
      ansible.builtin.assert:
        that:
          - exporter_state_before.status.MainPID != exporter_state_after.status.MainPID
          - exporter_state_after.status.MainPID | int > 0
        fail_msg: >-
          healthcheck did not restart prometheus-node-exporter
          (MainPID {{ exporter_state_before.status.MainPID }} unchanged)

    - name: Read the restart marker the healthcheck writes
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/node_exporter_healthcheck.prom
      register: healthcheck_prom

    - name: Assert the restart is visible as a scrapable metric
      ansible.builtin.assert:
        that:
          - "'node_exporter_healthcheck_last_restart_timestamp_seconds ' in (healthcheck_prom.content | b64decode)"
        fail_msg: "healthcheck restart did not emit its timestamp metric"

    - name: Stopped exporter must be left alone (no fighting a deliberate stop)
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: stopped

    - name: Full run against a stopped exporter exits clean without restarting
      ansible.builtin.command: /usr/local/sbin/node-exporter-healthcheck.sh 9101
      changed_when: false

    - name: Confirm the exporter is still stopped
      ansible.builtin.systemd:
        name: prometheus-node-exporter
      register: exporter_state_stopped
      failed_when: exporter_state_stopped.status.ActiveState == "active"

    - name: Restore the exporter for any later checks
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: started
