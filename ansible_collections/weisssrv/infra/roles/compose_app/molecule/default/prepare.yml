---
# Shared systemd/apt prep plus one-time nginx fixture seeding. The seeds live
# here rather than in converge.yml because the role removes or retightens them,
# so re-seeding every converge would report changed forever.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    # nginx is not installed under skip_install, so its sites-*/ssl dirs are
    # created here, with a sentinel cert and key the placeholder task's
    # `creates:` guard leaves alone and a default vhost verify expects removed.
    - name: Pre-create the nginx sites + ssl layout (nginx not installed under skip)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/nginx/sites-available
        - /etc/nginx/sites-enabled
        - /etc/nginx/ssl

    - name: Seed a packaged default vhost (to assert the flow removes it)
      ansible.builtin.copy:
        dest: /etc/nginx/sites-enabled/default
        content: "# packaged default vhost\n"
        mode: "0644"

    - name: Seed sentinel cert + key so the creates guard leaves them untouched
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "SENTINEL-PRESEEDED-{{ item | basename }}\n"
        mode: "0644"
      loop:
        - /etc/nginx/ssl/fullchain.pem
        - /etc/nginx/ssl/privkey.pem
