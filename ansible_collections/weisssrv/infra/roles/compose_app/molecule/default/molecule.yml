---
# Render/contract scenario: compose_app_skip_install skips the service-touching
# steps, so the compose unit (both RequiresMountsFor shapes), the
# write_prom_metrics library (exercised end to end) and the host-nginx task flow
# are rendered + asserted without a container runtime or the nginx binary.
provisioner:
  playbooks:
    prepare: prepare.yml
platforms:
  - name: compose-app-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
