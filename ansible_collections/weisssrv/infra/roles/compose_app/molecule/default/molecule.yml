---
# Contract scenario. Under compose_app_skip_install the compose unit, the
# write_prom_metrics library and the host-nginx flow are asserted with no
# container runtime; converge then re-runs the nginx flow with validation on.
provisioner:
  playbooks:
    prepare: prepare.yml
platforms:
  - name: compose-app-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
