---
# Verify the shared compose unit (both shapes) + the write_prom_metrics library.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # Compose unit — RequiresMountsFor present
    - name: Slurp the mounts-present compose unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/mounts-present.service
      register: compose_app_unit_a

    - name: Verify the mounts-present unit body
      ansible.builtin.assert:
        that:
          - (compose_app_unit_a.content | b64decode) is search('Description=Test app \(mounts\)')
          - (compose_app_unit_a.content | b64decode) is search('Requires=docker.service')
          - (compose_app_unit_a.content | b64decode) is search('RequiresMountsFor=/mnt/testapp-a /mnt/testapp-b')
          - (compose_app_unit_a.content | b64decode) is search('# Mount-ordering comment line one.')
          - (compose_app_unit_a.content | b64decode) is search('WorkingDirectory=/opt/testapp/compose')
          - (compose_app_unit_a.content | b64decode) is search('RemainAfterExit=yes')
          - (compose_app_unit_a.content | b64decode) is search('# Reconcile comment line one.')
          - (compose_app_unit_a.content | b64decode) is search('ExecStart=/usr/bin/docker compose up -d --remove-orphans')
          - (compose_app_unit_a.content | b64decode) is search('ExecStop=/usr/bin/docker compose down')
        fail_msg: "mounts-present compose unit missing expected lines"
        success_msg: "mounts-present compose unit renders description, mounts, reconcile comment, lifecycle"

    # Compose unit — RequiresMountsFor absent
    - name: Slurp the mounts-absent compose unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/mounts-absent.service
      register: compose_app_unit_b

    - name: Verify the mounts-absent unit omits RequiresMountsFor + its comment
      ansible.builtin.assert:
        that:
          - (compose_app_unit_b.content | b64decode) is search('WorkingDirectory=/opt/testapp2/compose')
          - (compose_app_unit_b.content | b64decode) is search('RemainAfterExit=yes')
          - (compose_app_unit_b.content | b64decode) is search('# Reconcile-only comment line.')
          # Empty requires_mounts_for => no RequiresMountsFor line AND no mount comment.
          - (compose_app_unit_b.content | b64decode) is not search('RequiresMountsFor')
          - (compose_app_unit_b.content | b64decode) is not search('Mount-ordering')
        fail_msg: "mounts-absent unit must omit RequiresMountsFor and its comment"
        success_msg: "mounts-absent unit omits RequiresMountsFor (empty list)"

    # write_prom_metrics helper library — content + end-to-end behaviour
    - name: Stat the helper library
      ansible.builtin.stat:
        path: /usr/local/lib/testapp-backup-lib.sh
      register: compose_app_lib_stat

    - name: Slurp the helper library
      ansible.builtin.slurp:
        src: /usr/local/lib/testapp-backup-lib.sh
      register: compose_app_lib

    - name: Verify the helper library defines the runtime-prefixed metric series
      ansible.builtin.assert:
        that:
          - compose_app_lib_stat.stat.exists
          - (compose_app_lib.content | b64decode) is search('write_prom_metrics\(\)')
          - (compose_app_lib.content | b64decode) is search('require_mounted_landing_zone\(\)')
          # Metric names are runtime-prefixed (${prefix}) so the logic is shared.
          - (compose_app_lib.content | b64decode) is search('\$\{prefix\}_last_run_success')
          - (compose_app_lib.content | b64decode) is search('\$\{prefix\}_last_success_timestamp_seconds')
          # The size-gauge HELP noun is set per app at render time.
          - (compose_app_lib.content | b64decode) is search('Size of the most recent database dump in bytes')
        fail_msg: "helper library missing write_prom_metrics / prefixed metrics / size noun"
        success_msg: "helper library defines write_prom_metrics with runtime-prefixed metrics"

    - name: Exercise the helper library (success path)
      ansible.builtin.shell: |
        set -euo pipefail
        source /usr/local/lib/testapp-backup-lib.sh
        write_prom_metrics test_backup 1 42 12345 /tmp/compose-app-verify.prom
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read the metric file after success
      ansible.builtin.slurp:
        src: /tmp/compose-app-verify.prom
      register: compose_app_prom_ok

    - name: Assert all metrics present on success
      ansible.builtin.assert:
        that:
          - "'test_backup_last_run_success 1' in (compose_app_prom_ok.content | b64decode)"
          - "'test_backup_last_run_duration_seconds 42' in (compose_app_prom_ok.content | b64decode)"
          - "'test_backup_last_size_bytes 12345' in (compose_app_prom_ok.content | b64decode)"
          - "'test_backup_last_success_timestamp_seconds ' in (compose_app_prom_ok.content | b64decode)"
        fail_msg: "helper library did not emit the full metric series on success"
        success_msg: "helper library emits the full metric series on success"

    - name: Capture the success timestamp (to assert preservation on failure)
      ansible.builtin.shell: >-
        awk '/^test_backup_last_success_timestamp_seconds/ {print $2}'
        /tmp/compose-app-verify.prom
      register: compose_app_ts_ok
      changed_when: false

    - name: Exercise the helper library (failure path)
      ansible.builtin.shell: |
        set -euo pipefail
        source /usr/local/lib/testapp-backup-lib.sh
        write_prom_metrics test_backup 0 7 0 /tmp/compose-app-verify.prom
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read the metric file after failure
      ansible.builtin.slurp:
        src: /tmp/compose-app-verify.prom
      register: compose_app_prom_fail

    - name: Assert failure records success=0 and preserves the prior timestamp
      ansible.builtin.assert:
        that:
          - "'test_backup_last_run_success 0' in (compose_app_prom_fail.content | b64decode)"
          - >-
            'test_backup_last_success_timestamp_seconds ' ~ compose_app_ts_ok.stdout
            in (compose_app_prom_fail.content | b64decode)
        fail_msg: "failure path did not record success=0 or lost the prior success timestamp"
        success_msg: "failure path records success=0 and preserves the last success timestamp"

    # Newest-artefact fallback: *_last_size_bytes 0 must mean "no artefact
    # exists", never "this run failed" — that is carried by *_last_run_success.
    # Exercised both ways from one call site.
    - name: Exercise the newest-artefact fallback (failure with a prior artefact)
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/compose-app-artifacts
        mkdir -p /tmp/compose-app-artifacts
        head -c 4096 /dev/zero > /tmp/compose-app-artifacts/dump-20200101-000000.sql.gz
        source /usr/local/lib/testapp-backup-lib.sh
        write_prom_metrics test_backup 0 7 0 /tmp/compose-app-fallback.prom \
          '/tmp/compose-app-artifacts/dump-*.sql.gz'
        awk '/^test_backup_last_size_bytes/ {print $2}' /tmp/compose-app-fallback.prom
        rm -f /tmp/compose-app-artifacts/*.sql.gz
        write_prom_metrics test_backup 0 7 0 /tmp/compose-app-fallback.prom \
          '/tmp/compose-app-artifacts/dump-*.sql.gz'
        awk '/^test_backup_last_size_bytes/ {print $2}' /tmp/compose-app-fallback.prom
      args:
        executable: /bin/bash
      register: compose_app_fallback
      changed_when: false

    - name: Assert 0 bytes means "no artefact", not "this run failed"
      ansible.builtin.assert:
        that:
          - compose_app_fallback.stdout_lines == ['4096', '0']
        fail_msg: >-
          write_prom_metrics reported {{ compose_app_fallback.stdout_lines }}
          for (artefact present, artefact absent); expected ['4096', '0'].
        success_msg: "size falls back to the newest existing artefact, and is 0 only when there is none"

    # A .prom the helper cannot write must not fail the backup and must leave no
    # temp file behind.
    - name: Exercise an unwritable metrics path
      ansible.builtin.shell: |
        set -uo pipefail
        rm -rf /tmp/compose-app-nodir
        source /usr/local/lib/testapp-backup-lib.sh
        write_prom_metrics test_backup 1 1 999 /tmp/compose-app-nodir/x.prom
        echo "rc=$?"
        ls -A /tmp/compose-app-nodir 2>/dev/null || echo "no-prom-dir"
      args:
        executable: /bin/bash
      register: compose_app_prom_nodir
      changed_when: false

    - name: Assert an unwritable metrics path does not fail the caller
      ansible.builtin.assert:
        that:
          - "'rc=0' in compose_app_prom_nodir.stdout"
          - "'no-prom-dir' in compose_app_prom_nodir.stdout"
        fail_msg: >-
          write_prom_metrics must return 0 and leave nothing behind when the
          textfile path cannot be written.
        success_msg: "an unwritable metrics path is non-fatal and leaves no temp file"

    # The shared fail-closed landing-zone guard: pass-through when the zone is
    # not NFS-backed or is mounted, refusal with success=0 when it is not.
    - name: Exercise require_mounted_landing_zone on all three arms
      ansible.builtin.shell: |
        set -uo pipefail
        rm -rf /tmp/compose-app-lz && mkdir -p /tmp/compose-app-lz
        source /usr/local/lib/testapp-backup-lib.sh
        require_mounted_landing_zone test_backup /tmp/compose-app-lz 0 /tmp/compose-app-lz/x.prom
        echo "not-nfs-rc=$?"
        require_mounted_landing_zone test_backup /tmp/compose-app-lz 1 /tmp/compose-app-lz/x.prom
        echo "unmounted-rc=$?"
        require_mounted_landing_zone test_backup / 1 /tmp/compose-app-lz/root.prom
        echo "mounted-rc=$?"
        cat /tmp/compose-app-lz/x.prom
        ls /tmp/compose-app-lz/root.prom 2>/dev/null || echo "no-root-prom"
      args:
        executable: /bin/bash
      register: compose_app_landing_zone
      changed_when: false

    - name: Assert the landing-zone guard fails closed only on an unmounted NFS zone
      ansible.builtin.assert:
        that:
          - "'not-nfs-rc=0' in compose_app_landing_zone.stdout"
          - "'unmounted-rc=1' in compose_app_landing_zone.stdout"
          - "'mounted-rc=0' in compose_app_landing_zone.stdout"
          - "'test_backup_last_run_success 0' in compose_app_landing_zone.stdout"
          - "'no-root-prom' in compose_app_landing_zone.stdout"
        fail_msg: >-
          require_mounted_landing_zone must return 1 and publish
          <prefix>_last_run_success 0 for an unmounted NFS landing zone, and
          return 0 without writing metrics otherwise — got
          {{ compose_app_landing_zone.stdout_lines }}
        success_msg: "require_mounted_landing_zone fails closed only on an unmounted NFS landing zone"

    # Host-nginx task flow (Case C) — cert untouched via creates:, site deployed,
    # packaged default vhost removed.
    - name: Read the pre-seeded cert's subject after the nginx flow
      ansible.builtin.command: openssl x509 -noout -subject -in /etc/nginx/ssl/fullchain.pem
      register: compose_app_nginx_cert
      changed_when: false

    - name: Stat the pre-seeded key after the nginx flow
      ansible.builtin.stat:
        path: /etc/nginx/ssl/privkey.pem
      register: compose_app_nginx_key

    - name: Assert the openssl placeholder left the pre-seeded cert untouched (creates guard)
      ansible.builtin.assert:
        that:
          - "'sentinel-preseeded.invalid' in compose_app_nginx_cert.stdout"
          - compose_app_nginx_key.stat.mode == '0600'
        fail_msg: >-
          the openssl self-signed seed clobbered the pre-seeded cert (subject
          "{{ compose_app_nginx_cert.stdout }}") or the key was left at
          {{ compose_app_nginx_key.stat.mode }} instead of 0600.
        success_msg: "the creates: guard left the pre-seeded cert untouched and the key is 0600"

    - name: Stat the deployed nginx site
      ansible.builtin.stat:
        path: /etc/nginx/sites-available/testapp.conf
      register: compose_app_nginx_site
      failed_when: not compose_app_nginx_site.stat.exists

    - name: Stat the enabled-site symlink
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/testapp.conf
      register: compose_app_nginx_symlink
      failed_when: >-
        not compose_app_nginx_symlink.stat.exists
        or not compose_app_nginx_symlink.stat.islnk

    - name: Stat the packaged default vhost (must be removed)
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: compose_app_nginx_default
      failed_when: compose_app_nginx_default.stat.exists

    - name: Report the nginx-flow result
      ansible.builtin.debug:
        msg: "host-nginx flow: cert untouched (creates:), site deployed + enabled, default vhost removed"

    # Host-nginx flow with validation ON (case D) and the broken-candidate
    # rejection (case E) — the property compose_app_skip_install gates off.
    - name: Slurp nginx.conf after the fixture patch
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: compose_app_nginx_conf

    - name: Assert the http opener carries the trailing comment the awk must tolerate
      ansible.builtin.assert:
        # The ` #` needs the scalar quoted or YAML takes the rest of the line as
        # a comment; `[{]` keeps the brace out of Jinja's string-escape path.
        that:
          - "(compose_app_nginx_conf.content | b64decode) is search('http [{]  # trailing comment')"
        fail_msg: >-
          The converge fixture did not patch nginx.conf's http opener, so the
          trailing-comment regression is not being covered.

    - name: Slurp the validated site
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/testapp-live.conf
      register: compose_app_nginx_live

    - name: Assert the validated site is installed and the broken one never replaced it
      ansible.builtin.assert:
        that:
          - (compose_app_nginx_live.content | b64decode) is search('server_name testapp-live.local;')
          - (compose_app_nginx_live.content | b64decode) is not search('this_directive_does_not_exist')
        fail_msg: >-
          sites-available/testapp-live.conf must hold the validated site; a
          rejected candidate must never reach it.
        success_msg: "the validated site is installed and survived the broken candidate"

    - name: Stat the validated site's enabled symlink
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/testapp-live.conf
      register: compose_app_nginx_live_link
      failed_when: >-
        not compose_app_nginx_live_link.stat.exists
        or not compose_app_nginx_live_link.stat.islnk

    - name: Read the broken-candidate negative-test result
      ansible.builtin.slurp:
        src: /tmp/compose-app-nginx-validate.json
      register: compose_app_nginx_validate

    - name: Assert a broken candidate fails the flow
      ansible.builtin.assert:
        that:
          - (compose_app_nginx_validate.content | b64decode | from_json).failed
        fail_msg: >-
          Candidate validation accepted a site with an unknown directive — a
          broken .conf would be installed and enabled, and the next nginx start
          would fail. Check tasks/nginx.yml.
        success_msg: "a broken candidate fails the flow before it is installed"

    - name: Read the partial-merge negative marker
      ansible.builtin.slurp:
        src: /tmp/compose-app-nginx-merge.json
      register: compose_app_nginx_merge

    - name: Assert a sites-enabled set that cannot be staged fails the flow
      ansible.builtin.assert:
        that:
          - (compose_app_nginx_merge.content | b64decode | from_json).failed
        fail_msg: >-
          Candidate validation ran over a partial copy of sites-enabled, so a
          server_name or listen collision with the site that failed to copy
          would be missed and surface at the next nginx start.
        success_msg: "a sites-enabled set that cannot be staged fails the flow"

    # Also covers the seeded TLS material: nginx loads the cert and key named by
    # the sites, so an unloadable pair fails here and in candidate validation.
    - name: Assert the merged nginx configuration is valid
      ansible.builtin.command: nginx -t
      changed_when: false
