---
# Deploy the write_prom_metrics helper library a caller's backup wrapper sources.
# Prefix, .prom path and artefact glob are call args; only the size-gauge HELP
# noun is rendered. Sourced not executed, so 0644; ungated for render-only runs.
- name: Deploy the shared backup-metrics helper library
  ansible.builtin.template:
    src: write_prom_metrics.sh.j2
    dest: "{{ compose_app_backup_lib_dest }}"
    owner: root
    group: root
    mode: "0644"
