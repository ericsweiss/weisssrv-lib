---
# Shared host-nginx TLS-terminator flow for compose app guests: install nginx,
# seed a placeholder cert, validate and deploy the caller's site template, drop
# the packaged default vhost, reload. Per-app values are compose_app_nginx_*.

# Resolved by the CALLER (README § nginx: validated before install): an unresolved or
# relative value reaches the template module as an opaque "src is empty".
- name: Assert the nginx site template is an absolute path
  ansible.builtin.assert:
    that:
      - compose_app_nginx_site_template | default('') | length > 0
      - compose_app_nginx_site_template is match('^/')
    fail_msg: >-
      compose_app_nginx_site_template must be a non-empty ABSOLUTE path to the
      caller's site template (got
      "{{ compose_app_nginx_site_template | default('') }}") — resolve it in the
      caller with role_path or a lookup before including this role.
    quiet: true

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: not (compose_app_skip_install | default(false))

- name: Ensure the nginx TLS material directory exists
  ansible.builtin.file:
    path: "{{ compose_app_nginx_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "{{ compose_app_nginx_cert_dir_mode }}"

# acme_certs pushes the real cert here after every renewal. Seed a self-signed
# placeholder so a fresh guest starts nginx and is reachable for that first
# push; the `creates` guard keeps it one-shot and umask 077 protects the key.
- name: Seed a self-signed TLS placeholder until the real cert is distributed
  ansible.builtin.shell:
    cmd: >-
      umask 077 && openssl req -x509 -newkey rsa:2048 -nodes
      -keyout {{ compose_app_nginx_ssl_key | quote }}
      -out {{ compose_app_nginx_ssl_cert | quote }}
      -days {{ compose_app_nginx_self_signed_days | quote }}
      -subj {{ compose_app_nginx_self_signed_subj | quote }}
      {% if compose_app_nginx_self_signed_san %}-addext {{ ('subjectAltName=' ~ compose_app_nginx_self_signed_san) | quote }}{% endif %}
  args:
    executable: /bin/bash
    creates: "{{ compose_app_nginx_ssl_cert }}"
  when: compose_app_nginx_bootstrap_cert | default(true)

- name: Secure the nginx private key
  ansible.builtin.file:
    path: "{{ compose_app_nginx_ssl_key }}"
    owner: root
    group: root
    mode: "0600"
  when: compose_app_nginx_bootstrap_cert | default(true)

# CRITICAL: validate the site BEFORE installing it — render a candidate into a
# temp dir, `nginx -t` against it, then copy it into place. Validating after
# install leaves a broken .conf enabled, and the next nginx start cannot bring
# the guest back.
- name: Create temp dir for nginx site validation
  ansible.builtin.tempfile:
    state: directory
    suffix: nginx-validate
  register: compose_app_nginx_validate_dir
  changed_when: false
  check_mode: false

- name: Validate the nginx site, then install it
  block:
    - name: Render the nginx site candidate
      ansible.builtin.template:
        src: "{{ compose_app_nginx_site_template }}"
        dest: "{{ compose_app_nginx_validate_dir.path }}/candidate.conf"
        owner: root
        group: root
        mode: "0644"
      changed_when: false
      check_mode: false

    - name: Validate the candidate against the merged nginx configuration
      ansible.builtin.shell: |
        set -euo pipefail
        tmp={{ compose_app_nginx_validate_dir.path | quote }}
        site={{ compose_app_nginx_site_name | quote }}
        mkdir -p "$tmp/sites-enabled"
        # A partial copy would validate a subset, so a dangling link fails here.
        if [ -d /etc/nginx/sites-enabled ]; then
          if ! cp -aL /etc/nginx/sites-enabled/. "$tmp/sites-enabled/" 2>"$tmp/cp.err"; then
            echo "could not stage the existing sites-enabled set for validation:" >&2
            cat "$tmp/cp.err" >&2
            exit 1
          fi
        fi
        rm -f "$tmp/sites-enabled/default"
        cp "$tmp/candidate.conf" "$tmp/sites-enabled/$site"
        awk -v inc="$tmp/sites-enabled" '
          /^[[:space:]]*include[[:space:]]+\/etc\/nginx\/sites-enabled\// { next }
          { print }
          !seen && /^[[:space:]]*http[[:space:]]*\{/ { print "    include " inc "/*;"; seen = 1 }
        ' /etc/nginx/nginx.conf > "$tmp/nginx.conf"
        grep -q "include $tmp/sites-enabled/\*;" "$tmp/nginx.conf" \
          || { echo "nginx.conf has no http{} block to inject the candidate into" >&2; exit 1; }
        nginx -t -c "$tmp/nginx.conf"
      args:
        executable: /bin/bash
      changed_when: false
      check_mode: false
      when: not (compose_app_skip_install | default(false))

    - name: Install the validated nginx site
      ansible.builtin.copy:
        src: "{{ compose_app_nginx_validate_dir.path }}/candidate.conf"
        dest: "/etc/nginx/sites-available/{{ compose_app_nginx_site_name }}"
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      notify: Reload nginx (compose_app)
  always:
    - name: Clean up the nginx validation temp dir
      ansible.builtin.file:
        path: "{{ compose_app_nginx_validate_dir.path }}"
        state: absent
      changed_when: false
      check_mode: false

- name: Enable the nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ compose_app_nginx_site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ compose_app_nginx_site_name }}"
    state: link
  notify: Reload nginx (compose_app)

# This is the only site on the guest; the packaged default vhost would otherwise
# shadow it as the default_server on :80.
- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx (compose_app)

# Whole-config backstop: the pre-install check covers the candidate, this covers
# everything else on the guest before the reload handler fires.
- name: Validate the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  when: not (compose_app_skip_install | default(false))

- name: Ensure nginx is enabled + started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: not (compose_app_skip_install | default(false))
