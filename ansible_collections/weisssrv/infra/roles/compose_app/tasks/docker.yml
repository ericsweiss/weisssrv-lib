---
# Install Docker Engine and the compose plugin via the shared docker_engine
# role. Gated on the caller's skip flag so the render-only molecule scenarios
# stay container-runtime-free.
- name: Install Docker Engine + compose plugin
  ansible.builtin.include_role:
    name: weisssrv.infra.docker_engine
  when: not (compose_app_skip_install | default(false))
