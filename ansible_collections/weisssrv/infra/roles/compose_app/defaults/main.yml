---
# Shared scaffolding for single-project docker-compose app guests. Nothing here
# is app-specific; every value a caller diverges on is a parameter.

# Render-only escape hatch mirrored from each caller's own skip flag: gates the
# service-touching steps so a molecule scenario can render + assert without a
# container runtime. Callers pass compose_app_skip_install: "{{ <their flag> }}".
compose_app_skip_install: false

# Compose systemd unit (tasks/main.yml + templates/compose.service.j2)
compose_app_service_name: compose            # unit basename (<name>.service)
compose_app_description: "Docker Compose stack"
compose_app_working_directory: /opt/compose
# Empty list => the unit omits the RequiresMountsFor line AND its comment.
compose_app_requires_mounts_for: []
compose_app_requires_mounts_comment: []
compose_app_reconcile_comment: []
compose_app_remain_after_exit: "yes"

# Backup-metrics helper library (tasks/backup_lib.yml)
compose_app_backup_lib_dest: /usr/local/lib/compose-app-backup-lib.sh
# Noun in the size-gauge HELP line ("Size of the most recent <object> in bytes").
compose_app_backup_size_help_object: dump

# Host nginx TLS terminator (tasks/nginx.yml). The site template stays in the
# caller's role and is passed by an eagerly-resolved ABSOLUTE path.
compose_app_nginx_cert_dir: /etc/nginx/ssl
compose_app_nginx_cert_dir_mode: "0750"
compose_app_nginx_ssl_cert: /etc/nginx/ssl/fullchain.pem
compose_app_nginx_ssl_key: /etc/nginx/ssl/privkey.pem
compose_app_nginx_site_name: site.conf
compose_app_nginx_site_template: ""
compose_app_nginx_self_signed_days: 3650
# Placeholder identity only — it is replaced by the real cert on first
# distribution, so the default is deliberately generic rather than a site name.
compose_app_nginx_self_signed_subj: "/CN={{ inventory_hostname }}"
# Falsy => no -addext; a value => -addext "subjectAltName=<value>".
compose_app_nginx_self_signed_san: ""
# Whether to seed the self-signed placeholder + secure its key. Independent of
# skip_install: a caller may want the placeholder seeded in a render-only run,
# or only on a real deploy.
compose_app_nginx_bootstrap_cert: true
