---
# daemon_reload is safe in a plain systemd container, so it is never gated. The
# service-touching handlers are gated on compose_app_skip_install so render-only
# callers can notify them without the compose stack or nginx present.
- name: Reload systemd (compose_app)
  ansible.builtin.systemd:
    daemon_reload: true

# A restart is `down` then `up`, so the images are pulled first: a registry
# failure then fails the play while the old stack is still running, instead of
# after `down` has already removed it.
- name: Pull compose images
  listen: Restart compose stack
  ansible.builtin.command:
    cmd: docker compose pull --quiet
    chdir: "{{ compose_app_working_directory }}"
  changed_when: false
  when: not (compose_app_skip_install | default(false))

# `docker compose up -d` reconciles the running stack to the rendered compose,
# .env and config. The caller's render tasks notify this same handler, so a
# config change and a unit change coalesce into a single restart.
- name: Restart compose stack
  ansible.builtin.systemd:
    name: "{{ compose_app_service_name }}.service"
    state: restarted
  when: not (compose_app_skip_install | default(false))

- name: Reload nginx (compose_app)
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: not (compose_app_skip_install | default(false))
