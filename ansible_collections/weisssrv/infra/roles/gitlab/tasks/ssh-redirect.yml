---
# One NAT chain's gitlab_ssh_port -> 22 REDIRECT rule, included per chain from
# main.yml (loop_var: gitlab_ssh_redirect). Invariant: exactly one managed rule
# per chain. Cleanup deletes by line number so drifted variants go too.

# An iptables that could not run must not read as "no managed rule": that
# skips the drift cleanup below and appends a second REDIRECT. Only a missing
# chain counts as zero.
- name: Count SSH redirect rules in {{ gitlab_ssh_redirect.chain }}
  ansible.builtin.shell: |
    set -uo pipefail
    out=$(iptables -w 5 -t nat -S {{ gitlab_ssh_redirect.chain }} 2>&1) || {
      case "$out" in
        *"No chain/target/match by that name"*) echo 0; exit 0 ;;
        *) printf '%s\n' "$out" >&2; exit 1 ;;
      esac
    }
    printf '%s\n' "$out" | grep -c -- '--dport {{ gitlab_ssh_port }} .* REDIRECT --to-ports 22' || true
  args:
    executable: /bin/bash
  register: gitlab_ssh_redirect_count
  changed_when: false

- name: Check the managed SSH redirect rule in {{ gitlab_ssh_redirect.chain }}
  ansible.builtin.command: >-
    iptables -t nat -C {{ gitlab_ssh_redirect.chain }}
    {% if gitlab_ssh_redirect.out_interface is defined %}-o {{ gitlab_ssh_redirect.out_interface }}{% endif %}
    -p tcp --dport {{ gitlab_ssh_port }} -j REDIRECT --to-ports 22
  register: gitlab_ssh_redirect_managed
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Remove drifted SSH redirect rules (re-added below) from {{ gitlab_ssh_redirect.chain }}
  ansible.builtin.shell: |
    set -euo pipefail
    iptables -t nat -L {{ gitlab_ssh_redirect.chain }} --line-numbers -n 2>/dev/null \
      | awk '/dpt:{{ gitlab_ssh_port }} / && /REDIR/ {print $1}' \
      | sort -rn \
      | while IFS= read -r n; do
          iptables -t nat -D {{ gitlab_ssh_redirect.chain }} "$n" || exit 1
        done
  args:
    executable: /bin/bash
  when:
    - not ansible_check_mode
    - gitlab_ssh_redirect_count.stdout | int > 0
    - >-
      (gitlab_ssh_redirect_count.stdout | int > 1)
      or (gitlab_ssh_redirect_managed.rc | default(1) != 0)
  changed_when: true

- name: Add the managed GitLab SSH redirect rule to {{ gitlab_ssh_redirect.chain }}
  ansible.builtin.iptables:
    table: nat
    chain: "{{ gitlab_ssh_redirect.chain }}"
    protocol: tcp
    destination_port: "{{ gitlab_ssh_port }}"
    jump: REDIRECT
    to_ports: "22"
    out_interface: "{{ gitlab_ssh_redirect.out_interface | default(omit) }}"
    state: present
  when: not ansible_check_mode
