---
- name: Reconfigure gitlab
  ansible.builtin.command: /opt/gitlab/bin/gitlab-ctl reconfigure
  changed_when: true

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ gitlab_ssh_service_name }}"
    state: restarted

# Applies the knob the sysctl drop-in sets at runtime, so a fresh guest does
# not wait for a reboot; idempotent against that file.
- name: Reload sysctl gitlab-redis
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-gitlab-redis.conf
    reload: true

- name: Reload systemd for gitlab-backup
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload systemd for gitlab-ssh-redirect
  ansible.builtin.systemd:
    name: gitlab-ssh-redirect.service
    daemon_reload: true

# `state: restarted` (not started) is required: RemainAfterExit makes `started`
# a no-op for an already-active oneshot, so a changed ExecStart would not run
# until next boot.
- name: Reload systemd for THP unit
  ansible.builtin.systemd:
    name: disable-transparent-hugepages.service
    daemon_reload: true
    state: restarted

# Reuses the presence probe registered in tasks/main.yml. When that task did not
# run (tag-limited play), the default skips the restart rather than failing.
- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: gitlab_fail2ban_service_file.stat.exists | default(false)
