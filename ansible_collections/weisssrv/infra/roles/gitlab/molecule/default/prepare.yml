---
# Prepare: mock enough of an installed GitLab (users, tree, gitlab-ctl,
# gitlab-backup) that the role's config, backup and firewall paths converge
# without the Omnibus package, and seed the drift the role must clean up.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    - name: Wait for apt locks to be released
      ansible.builtin.raw: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      changed_when: false

    # The image ships fail2ban disabled; iptables is what the NAT redirect
    # tasks and their verification need.
    - name: Install fail2ban + iptables for the jail and NAT coverage  # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: |
          apt-get update -q
          apt-get install -y fail2ban iptables
          mkdir -p /etc/fail2ban/jail.d /etc/fail2ban/filter.d
      args:
        executable: /bin/bash
      changed_when: false

    # Drifted variants a fixed `iptables -C` can never match: a legacy
    # -m comment rule in PREROUTING, and an OUTPUT rule missing -o lo. Converge
    # must remove both and leave exactly one managed rule per chain.
    - name: Seed legacy SSH redirect rules for drift-cleanup coverage
      ansible.builtin.shell: |
        iptables -t nat -A PREROUTING -p tcp --dport {{ gitlab_ssh_port }} \
          -m comment --comment "GitLab SSH port redirect {{ gitlab_ssh_port }}->22" \
          -j REDIRECT --to-ports 22
        iptables -t nat -A OUTPUT -p tcp --dport {{ gitlab_ssh_port }} \
          -m comment --comment "GitLab SSH local redirect" \
          -j REDIRECT --to-ports 22
      args:
        executable: /bin/bash
      changed_when: false

    # Omnibus creates git:git on install; gitlab_skip_install means the scenario
    # must. IDs are system-allocated — a hardcoded one collides in the image and
    # makes the role's ownership guard read permanent drift.
    - name: Create the mock git group
      ansible.builtin.group:
        name: git
        system: true

    - name: Create the mock git user
      ansible.builtin.user:
        name: git
        group: git
        system: true
        home: /var/opt/gitlab
        create_home: false
        shell: /bin/sh

    # The gitlab-shell log dir is what the fail2ban jail path expects to exist.
    # Keep apostrophes out of this block: raw args are shlex-split, so a single
    # unbalanced quote (even in a comment) fails the task at parse time.
    - name: Create mock GitLab environment
      ansible.builtin.raw: |
        mkdir -p /etc/gitlab
        mkdir -p /opt/gitlab/bin
        mkdir -p /var/opt/gitlab/backups
        mkdir -p /mnt/gitlab-repos/git-data/repositories
        mkdir -p /var/log/gitlab/gitlab-shell

        chown -R git:git /var/opt/gitlab/backups
        chown -R git:git /mnt/gitlab-repos
        chown -R git:git /var/log/gitlab
        chmod 700 /var/opt/gitlab/backups
        chmod 700 /mnt/gitlab-repos/git-data
        chmod 700 /mnt/gitlab-repos/git-data/repositories

        # Seed the drift the ownership guard exists for: a git-data tree that
        # predates the git user. Converge must chown it once (reporting changed,
        # as a multi-thousand-inode rewrite should) and then leave it alone,
        # which the idempotence re-run proves.
        chown root:root /mnt/gitlab-repos/git-data

        cat > /opt/gitlab/bin/gitlab-ctl << 'EOF'
        #!/bin/bash
        case "$1" in
          status) echo "run: puma: (pid 1234) 123s"; echo "All services running"; exit 0 ;;
          start|restart|stop|reconfigure) echo "Mock: $1 executed"; exit 0 ;;
          *) echo "Usage: gitlab-ctl {status|start|stop|restart|reconfigure}"; exit 1 ;;
        esac
        EOF
        chmod +x /opt/gitlab/bin/gitlab-ctl

        id git || { echo "ERROR: Failed to create git user"; exit 1; }
      changed_when: false

    # Mock gitlab-backup: drops a fake tarball, honours a fault file so verify
    # can exercise the failure metric path, and records every invocation's
    # arguments so verify can assert the SKIP contract. Installed via copy (not
    # the raw heredoc above) to keep the script out of raw's Jinja parsing.
    - name: Install mock gitlab-backup
      ansible.builtin.copy:
        dest: /opt/gitlab/bin/gitlab-backup
        mode: "0755"
        content: |
          #!/bin/bash
          echo "$@" >> /tmp/gitlab-backup-args
          if [ "$1" = "create" ]; then
            if [ -f /tmp/gitlab-backup-fail ]; then
              echo "Mock: gitlab-backup create FAILED"
              exit 1
            fi
            # Non-empty: the metrics library sizes the newest tarball, and a
            # zero-byte file would make the size assertion vacuous.
            echo "mock tarball" > "/var/opt/gitlab/backups/$(date +%s)_2026_01_01_19.2.1_gitlab_backup.tar"
            echo "Mock: gitlab-backup create OK"
            exit 0
          fi
          echo "Usage: gitlab-backup create"
          exit 1

    # The wrapper copies these on a successful backup.
    - name: Create mock GitLab secrets/config files
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "molecule fixture\n"
        mode: "0600"
      loop:
        - /etc/gitlab/gitlab-secrets.json
        - /etc/gitlab/gitlab.rb

    # node_exporter_host is not in this scenario, so create the textfile
    # collector dir the wrapper writes into.
    - name: Ensure node_exporter textfile collector dir exists
      ansible.builtin.file:
        path: /var/lib/node_exporter
        state: directory
        mode: "0755"

    # The role's fresh-deploy guard requires the cert pair whenever
    # registry/pages are enabled (they always terminate TLS), regardless of
    # gitlab_nginx_listen_https. Nothing reads their content here.
    - name: Create /etc/gitlab/ssl for the cert fixtures
      ansible.builtin.file:
        path: /etc/gitlab/ssl
        state: directory
        mode: "0750"

    - name: Stage dummy TLS cert fixtures for the fresh-deploy guard
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: |
          # molecule dummy cert fixture
        mode: "0640"
      loop:
        - /etc/gitlab/ssl/fullchain.pem
        - /etc/gitlab/ssl/privkey.pem
