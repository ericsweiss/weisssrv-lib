---
# Converge: run the role in skip-install mode, then side-render the template
# branches the converged file cannot cover in one pass.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait out apt locks and refresh the cache
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install minimal prerequisites for testing
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - cron
          # The role installs and validates an sshd AllowUsers drop-in
          # (sshd -t), which needs sshd and its host keys present.
          - openssh-server
        state: present

  tasks:
    # public: the side renders below read role defaults (cert paths, TLS floor,
    # backup knobs) that the scenario's group_vars does not repeat.
    - name: Run the gitlab role
      ansible.builtin.include_role:
        name: weisssrv.infra.gitlab
        public: true

  post_tasks:
    # The converged file covers the plain-HTTP branch; this side render covers
    # the TLS half without flip-flopping /etc/gitlab/gitlab.rb, which would break
    # the idempotence run. The role template lives outside the scenario dir.
    - name: Render gitlab.rb with nginx TLS enabled (branch coverage)  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/gitlab.rb.j2"
        dest: /tmp/gitlab.rb.tls
        mode: "0600"
      vars:
        gitlab_nginx_listen_https: true
        gitlab_nginx_listen_port: 443

    # The opt-in postgres_exporter overrides. The converged file covers the
    # default (both empty -> no lines, Omnibus defaults stand).
    - name: Render gitlab.rb with the postgres exporter published  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/gitlab.rb.j2"
        dest: /tmp/gitlab.rb.pgexporter
        mode: "0600"
      vars:
        gitlab_postgres_exporter_enabled: true
        gitlab_postgres_exporter_listen_address: "0.0.0.0:9187"

    # The bundled monitoring stack. The converged file covers the default
    # (both empty -> no lines, Omnibus defaults stand).
    - name: Render gitlab.rb with the bundled monitoring stack disabled  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/gitlab.rb.j2"
        dest: /tmp/gitlab.rb.bundled
        mode: "0600"
      vars:
        gitlab_bundled_prometheus_enabled: false
        gitlab_bundled_alertmanager_enabled: false

    # Whitespace-stripping contract: an overridden gitlab_backup_skip containing
    # spaces must render to a single comma-separated SKIP value.
    - name: Render backup wrapper with a spaced SKIP override  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/gitlab-backup-run.sh.j2"
        dest: /tmp/gitlab-backup-run-spaced.sh
        mode: "0755"
      vars:
        gitlab_backup_skip: "registry, artifacts"

    # NFS-backed render (fail-closed guard). BACKUP_PATH points at a
    # non-mountpoint and the textfile dir at a temp path, so verify can run it
    # and assert it aborts with success=0 without clobbering the main metric.
    - name: Render backup wrapper with NFS-backed landing (fail-closed guard)  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/gitlab-backup-run.sh.j2"
        dest: /tmp/gitlab-backup-run-nfs.sh
        mode: "0755"
      vars:
        gitlab_backup_nfs_enabled: true
        gitlab_backup_path: /tmp/gitlab-nfs-not-a-mount
        gitlab_textfile_dir: /tmp/gitlab-nfs-guard

    # The systemd unit's RequiresMountsFor branch, which the converged unit
    # (NFS off) cannot cover.
    - name: Render the backup service with the NFS landing zone  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/gitlab-backup.service.j2"
        dest: /tmp/gitlab-backup-nfs.service
        mode: "0644"
      vars:
        gitlab_backup_nfs_enabled: true
        gitlab_backup_path: /mnt/backups-offsite

    # Negative test: an empty real-IP trust list must fail the role. Accepting
    # it would attribute every request to the fronting proxy instead of the
    # client, silently.
    - name: Re-run gitlab with an empty real-IP trust list (expect failure)
      tags: [molecule-idempotence-notest]
      block:
        - name: Include gitlab with no trusted proxy addresses
          ansible.builtin.include_role:
            name: weisssrv.infra.gitlab
          vars:
            gitlab_skip_install: true
            gitlab_nginx_trust_no_proxy: false
            gitlab_nginx_real_ip_trusted_addresses: []
        - name: Real-IP assert failed to trigger
          ansible.builtin.copy:
            dest: /tmp/gitlab-realip-assert.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Real-IP assert correctly rejected an empty trust list
          ansible.builtin.copy:
            dest: /tmp/gitlab-realip-assert.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}
          # Test-result marker, not convergence.
          changed_when: false

    # gitlab_nginx_trust_no_proxy must get an empty trust list past the real-IP
    # assert. An empty SMTP user then stops the run at the next validation, so
    # the arm never re-renders gitlab.rb and the marker names which assert fired.
    - name: Re-run gitlab with the no-proxy escape hatch (expect a later failure)
      tags: [molecule-idempotence-notest]
      block:
        - name: Include gitlab with the trust-list assert waived
          ansible.builtin.include_role:
            name: weisssrv.infra.gitlab
          vars:
            gitlab_skip_install: true
            gitlab_nginx_trust_no_proxy: true
            gitlab_nginx_real_ip_trusted_addresses: []
            gitlab_smtp_user: ""
        - name: The sentinel validation did not fire
          ansible.builtin.copy:
            dest: /tmp/gitlab-realip-nofail.json
            content: '{"stopped_at": "none"}'
            mode: "0644"
      rescue:
        - name: Record which validation stopped the escape-hatch run
          ansible.builtin.copy:
            dest: /tmp/gitlab-realip-nofail.json
            mode: "0644"
            content: |
              {"stopped_at": {{ ansible_failed_result.msg | to_json }}}
          changed_when: false
