---
# Render/contract scenario: gitlab_skip_install skips the Omnibus package (far
# too heavy for CI), so gitlab.rb (both nginx branches), the backup wrapper and
# its metrics, the NAT redirect cleanup, the sshd drop-in and the fail2ban jail
# are converged and asserted against a mocked GitLab tree.
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        gitlab_version: 19.2.1-ee.0
        gitlab_skip_install: true
        gitlab_root_password: molecule-root-password
        gitlab_external_url: https://git.test.local
        gitlab_ssh_host: git.test.local
        gitlab_ssh_port: 2222
        gitlab_timezone: Etc/UTC
        gitlab_registry_enabled: true
        gitlab_registry_external_url: https://registry.git.test.local
        gitlab_pages_enabled: true
        gitlab_pages_external_url: https://pages.git.test.local
        gitlab_smtp_enabled: true
        gitlab_smtp_address: smtp-relay.test.local
        gitlab_smtp_port: 587
        gitlab_smtp_user: testsmtp@test.local
        gitlab_smtp_password: testsmtppassword
        gitlab_smtp_domain: test.local
        gitlab_smtp_authentication: login
        gitlab_smtp_enable_starttls_auto: true
        gitlab_email_from: gitlab@test.local
        gitlab_email_display_name: GitLab
        gitlab_email_reply_to: noreply@test.local
        gitlab_saml_enabled: true
        gitlab_saml_label: Authentik
        gitlab_saml_idp_cert_fingerprint: AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD
        gitlab_saml_idp_sso_url: https://auth.test.local/application/saml/git/sso/binding/redirect/
        gitlab_saml_groups_attribute: http://schemas.xmlsoap.org/claims/Group
        # Empty required_groups is only legal with the explicit opt-in; both
        # halves of that contract are exercised here.
        gitlab_saml_required_groups: []
        gitlab_saml_allow_all_users: true
        gitlab_saml_admin_groups:
          - gitlab-admins
        gitlab_saml_external_groups: []
        gitlab_nginx_listen_https: false
        gitlab_nginx_listen_port: 80
        gitlab_nginx_real_ip_trusted_addresses:
          - 10.99.0.0/24
          - 10.42.0.0/16
        gitlab_monitoring_whitelist:
          - 127.0.0.1
        gitlab_ssh_allowusers_enabled: true
        gitlab_ssh_allowed_users:
          - git
          - molecule@10.99.0.0/24
          - molecule@100.64.0.0/10
        gitlab_backup_path: /var/opt/gitlab/backups
        gitlab_backup_keep_time: 604800
        gitlab_puma_workers: 2
        gitlab_sidekiq_concurrency: 10
        gitlab_git_data_dir: /mnt/gitlab-repos/git-data
        # Exercises the registry_path template branch. The Omnibus default store
        # is absent in the container, so the stop/mv relocation correctly skips.
        gitlab_registry_data_dir: /mnt/gitlab-repos/registry
        gitlab_kernel_tuning_enabled: false
platforms:
  - name: gitlab-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - NET_ADMIN
      - NET_RAW
    tmpfs:
      - /run
      - /tmp
