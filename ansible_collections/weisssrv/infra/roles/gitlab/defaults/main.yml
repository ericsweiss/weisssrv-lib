---
# GitLab EE (Omnibus) on a dedicated Debian guest.
#
# Required inputs (empty here — the site supplies them, and tasks/main.yml
# asserts each one where it is used):
#   gitlab_version         pinned gitlab-ee package version
#   gitlab_external_url    canonical https:// URL
#   gitlab_root_password   initial root password (secret; install-time only)
# Every optional feature block (registry, pages, SMTP, SAML, Web IDE, the
# NFS-backed backup landing, the sshd AllowUsers restriction) is OFF by default
# and asserts its own inputs when switched on.
gitlab_version: ""
gitlab_external_url: ""

# Skip the apt package install/upgrade while still converging host config.
# It covers the Omnibus package and its prerequisites only: iptables-persistent
# is host config for the Git-SSH redirect and installs either way.
gitlab_skip_install: false

# Host shown in clone URLs. Derived from gitlab_external_url, which is right
# whenever web and Git-SSH share a name; override when SSH has its own.
gitlab_ssh_host: "{{ gitlab_external_url | urlsplit('hostname') | default('', true) }}"
# Port advertised in clone URLs. The role REDIRECTs it to 22 in nat/PREROUTING
# and nat/OUTPUT, so Git SSH terminates on the system sshd.
gitlab_ssh_port: 2222

# Repository storage. The default is the Omnibus path on the root disk; point
# it at a dedicated volume to isolate repo I/O.
gitlab_git_data_dir: "/var/opt/gitlab/git-data"

# Extra block devices to mount before anything else (zvol_mount schema).
gitlab_additional_disks: "{{ vm_additional_disks | default([]) }}"

# Container Registry. gitlab_registry_data_dir defaults to the Omnibus path on
# the root disk; when it points elsewhere the role relocates an existing blob
# store there once and gitlab.rb emits gitlab_rails['registry_path'].
gitlab_registry_enabled: false
gitlab_registry_external_url: ""
gitlab_registry_data_dir: "/var/opt/gitlab/gitlab-rails/shared/registry"

gitlab_pages_enabled: false
gitlab_pages_external_url: ""

# Web IDE extension host. MUST be a different origin from gitlab_external_url
# (CVE-2026-5816) and a bare hostname, no wildcard — the Application Settings
# API rejects one. Empty skips the settings pass. DNS/cert/ingress are the
# site's to provide.
gitlab_web_ide_extension_host_domain: ""
gitlab_web_ide_settings_enabled: "{{ gitlab_web_ide_extension_host_domain | length > 0 }}"
gitlab_web_ide_marketplace_enabled: true
gitlab_web_ide_single_origin_fallback: false
# Admin PAT with `api` scope, used only for the settings above.
gitlab_api_token: ""

gitlab_smtp_enabled: false
gitlab_smtp_address: ""
gitlab_smtp_port: 587
gitlab_smtp_user: ""
gitlab_smtp_password: ""
gitlab_smtp_domain: ""
gitlab_smtp_authentication: "login"
gitlab_smtp_enable_starttls_auto: true

# Notification identities. Empty values omit their gitlab.rb line.
gitlab_email_from: ""
gitlab_email_display_name: "GitLab"
gitlab_email_reply_to: ""

gitlab_saml_enabled: false
gitlab_saml_label: "SAML"
gitlab_saml_icon_url: ""
gitlab_saml_idp_cert_fingerprint: ""
gitlab_saml_idp_sso_url: ""
gitlab_saml_groups_attribute: "http://schemas.xmlsoap.org/claims/Group"
# Auto-created users are unblocked and SAML auto sign-in is on, so an empty
# required_groups list auto-provisions every IdP user. The role refuses that
# unless gitlab_saml_allow_all_users is set, so a dropped group_var fails closed
# instead of silently opening sign-up.
gitlab_saml_required_groups: []
gitlab_saml_admin_groups: []
gitlab_saml_external_groups: []
gitlab_saml_allow_all_users: false

# NGINX. Omnibus's Let's Encrypt client stays off; the cert below comes from an
# external distributor. Registry and pages nginx ALWAYS terminate TLS with the
# same cert, so a certless bring-up needs both of those disabled too.
gitlab_nginx_listen_https: true
gitlab_nginx_listen_port: 443
gitlab_nginx_ssl_certificate: /etc/gitlab/ssl/fullchain.pem
gitlab_nginx_ssl_certificate_key: /etc/gitlab/ssl/privkey.pem
# TLS 1.3-only floor for all three nginxes; lower it only for a client that
# cannot speak 1.3.
gitlab_nginx_ssl_protocols: "TLSv1.3"
# Proxy CIDRs whose X-Forwarded-For is trusted. Empty omits the directive.
gitlab_nginx_real_ip_trusted_addresses: []

# Sources allowed to reach the unauthenticated /-/metrics, /-/readiness and
# /-/liveness endpoints (/-/health is unrestricted). Matched on the real_ip from
# X-Forwarded-For, so a proxied probe needs its OWN source range listed.
gitlab_monitoring_whitelist:
  - 127.0.0.1

# Omnibus's bundled postgres_exporter. Empty omits the gitlab.rb lines and keeps
# the Omnibus default (running, bound to localhost:9187). The endpoint is
# unauthenticated, so scope any published listen address with the guest firewall.
gitlab_postgres_exporter_enabled: ""
gitlab_postgres_exporter_listen_address: ""

# Backup landing zone. The default is a local path on the root disk (host-image
# snapshots are then the only DR copy).
gitlab_backup_path: "/var/opt/gitlab/backups"

# NFS-backed landing. When enabled, gitlab_backup_path must BE
# gitlab_backup_mountpoint — the unit and the wrapper fail closed by testing
# that exact path. Mount by hostname when the export requires TLS: a wildcard
# cert has no IP SAN.
gitlab_backup_nfs_enabled: false
gitlab_backup_nfs_server: ""
gitlab_backup_nfs_export: ""
gitlab_backup_nfs_options: "vers=4.2,rw,hard,noatime,_netdev,nofail,xprtsec=tls"
gitlab_backup_mountpoint: "/mnt/backups-offsite"

# The Rails config `gitlab-ctl reconfigure` renders from gitlab.rb; the role
# reads it back because gitlab.rb alone is inert — a lost reconfigure would
# leave the two disagreeing with every backup metric still green.
gitlab_effective_rails_config: "/var/opt/gitlab/gitlab-rails/etc/gitlab.yml"

# Components excluded from the tarball (gitlab-backup SKIP=); the defaults are
# both reproducible. Set to "" to back up everything — only with a dedicated,
# off-root-disk landing zone.
gitlab_backup_skip: "registry,artifacts"
# Retention. Prune only runs after a SUCCESSFUL backup.
gitlab_backup_keep_time: 259200  # 3 days in seconds

# Backup schedule (gitlab-backup.timer / .service).
gitlab_backup_oncalendar: "*-*-* 02:00:00"
gitlab_backup_timer_random_delay: "0"
gitlab_backup_service_timeout: "3h"

# Where the shared write_prom_metrics library lands, and where the wrapper
# writes its node_exporter textfile metrics.
gitlab_backup_lib_path: /usr/local/lib/gitlab-backup-lib.sh
gitlab_textfile_dir: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}"

# Sized for a ~16GB guest; re-tune with the guest's RAM.
gitlab_puma_workers: 3
gitlab_sidekiq_concurrency: 15

# Used by the package's first install only.
gitlab_root_password: ""

# Local jail for Git SSH brute force. The role writes the jail only when
# fail2ban is already installed (by the base role or the image).
gitlab_fail2ban_enabled: true

# sshd AllowUsers restriction. gitlab_ssh_port is WAN-facing and REDIRECTs to
# the system sshd, so without it every local account accepts internet pubkey
# attempts regardless of the firewall's rules on 22. Supply the FULL list when
# enabling; disabling REMOVES the drop-in.
gitlab_ssh_allowusers_enabled: false
gitlab_ssh_allowed_users: []
# sshd unit restarted after the drop-in changes. Keep it in step with the base
# role's own service name if that was overridden.
gitlab_ssh_service_name: ssh

# vm.overcommit_memory + THP off, required by Omnibus Redis (see
# tasks/main.yml). A test container that must not mutate the host kernel sets
# this false.
gitlab_kernel_tuning_enabled: true

gitlab_timezone: "{{ timezone | default('UTC') }}"
