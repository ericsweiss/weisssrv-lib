# The delegate seam: the role serializes the cluster-wide reconcile itself with
# run_once + a reachability probe, so the calling play needs no serial: 1.
- name: Converge — delegate selection
  hosts: proxmox-ha-test
  become: true
  gather_facts: false
  pre_tasks:
    # add_host runs after `hosts:` is resolved, so neither group re-enters a
    # play. 192.0.2.1 is TEST-NET-1 and never answers.
    - name: Register a mixed reachable/unreachable probe group
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        ansible_host: "{{ item.host | default(omit) }}"
        ansible_connection: "{{ item.connection | default(omit) }}"
        ansible_ssh_common_args: >-
          -o ConnectTimeout=2 -o StrictHostKeyChecking=no
      loop:
        - {name: proxmox-ha-unreachable, groups: "ha_probe_mixed,ha_probe_dead",
           host: 192.0.2.1, connection: ssh}
        - {name: proxmox-ha-test, groups: ha_probe_mixed}
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

  tasks:
    - name: W — an unreachable host is skipped and the reachable one is chosen
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_host_group: ha_probe_mixed

    - name: W — record the resolved delegate
      ansible.builtin.set_fact:
        delegate_mixed: "{{ _proxmox_ha_delegate | trim }}"

    - name: W2 — assume the non-member host did not fail
      ansible.builtin.set_fact:
        nonmember_failed: false

    # The host group is the role's own membership guard, so the dead group (which
    # this host is NOT in) drives it rather than the delegate seam below.
    - name: W2 — a host outside the HA group must fail loudly
      tags: [molecule-idempotence-notest]
      block:
        - name: W2 — run the whole role from outside the host group
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_ha
          vars:
            proxmox_ha_host_group: ha_probe_dead

        - name: W2 — the non-member host did NOT fail
          ansible.builtin.fail:
            msg: >-
              The role reconciled cluster-wide HA state from a host outside its
              own group, so a non-Proxmox host would write /etc/pve.
      rescue:
        - name: W2 — record that the non-member host failed
          ansible.builtin.set_fact:
            nonmember_failed: true
          when: >-
            ansible_failed_task.name ==
            "Ensure we're running on a Proxmox VE cluster"

    - name: X — assume the empty probe result did not fail
      ansible.builtin.set_fact:
        dead_group_failed: false

    # tasks_from: delegate drives the seam on its own: the membership guard above
    # fires first in a full include, so it would mask this assert.
    - name: X — no reachable host must fail loudly
      tags: [molecule-idempotence-notest]
      block:
        - name: X — resolve a delegate from a group that never answers
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_ha
            tasks_from: delegate
          vars:
            proxmox_ha_host_group: ha_probe_dead

        - name: X — the empty probe result did NOT fail
          ansible.builtin.fail:
            msg: >-
              The role resolved a delegate with no host answering the probe, so
              a whole-cluster outage would reconcile green.
      rescue:
        - name: X — record that the empty probe result failed
          ansible.builtin.set_fact:
            dead_group_failed: true
          when: >-
            ansible_failed_task.name ==
            'Assert a reachable Proxmox node was found for the reconcile'

    - name: Y — an explicit delegate pin wins over an empty probe result
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: delegate
      vars:
        proxmox_ha_host_group: ha_probe_dead
        proxmox_ha_delegate_host: proxmox-ha-test

    - name: Y — record the pinned delegate
      ansible.builtin.set_fact:
        delegate_pinned: "{{ _proxmox_ha_delegate | trim }}"

    - name: Capture delegate-selection results
      ansible.builtin.copy:
        dest: /tmp/molecule-results/ha-delegate.json
        mode: "0644"
        content: |
          {"delegate_mixed": {{ delegate_mixed | to_json }},
           "nonmember_failed": {{ nonmember_failed | default(false) | ternary('true', 'false') }},
           "dead_group_failed": {{ dead_group_failed | default(false) | ternary('true', 'false') }},
           "delegate_pinned": {{ delegate_pinned | to_json }}}
