---
- name: Converge — exercise HA resource + replication contracts
  hosts: all
  become: true
  # See proxmox_vm/molecule/default/converge.yml for the rationale on
  # deferring gather_facts behind a raw mkdir.
  gather_facts: false
  vars:
    # Fixtures exercised across the cases below. The role gates each task
    # file behind `<var> | length > 0`, so non-empty lists activate them.
    # proxmox_ha_rules is present (representative) and, with the stubs' empty
    # current-state, drives the rule "add" path too.
    test_ha_rules:
      - name: dns-affinity
        type: node-affinity
        resources: [vm:150]
        nodes: [pve-opt-01, pve-opt-02]
        strict: false
    # Real-inventory shape: nodes carry EXPLICIT priorities and the rule sets a
    # comment + strict. Exercises the priority-preservation path (the role only
    # appends ":0" to bare nodes, so "pve-opt-01:2" must round-trip unchanged).
    test_ha_rules_prio:
      - name: dns-affinity
        type: node-affinity
        resources: [vm:150]
        nodes: ["pve-opt-01:2", "pve-opt-02:1"]
        strict: true
        comment: "keep dns off nas"
    test_ha_resources:
      - type: vm
        vmid: 150
        state: started
        max_restart: 3
        max_relocate: 3
    test_replication_jobs:
      - id: "150-0"
        source_node: "{{ inventory_hostname }}"
        target_node: pve-opt-02
        schedule: "*/15"
        enabled: true
    # Two jobs for the same VMID — used by the permuted-ID case (L), where the
    # live jobs carry the same TARGET SET but swapped job-ID assignments (what
    # Proxmox does after a guest migration round-trip).
    test_replication_jobs_multi:
      - id: "150-0"
        source_node: "{{ inventory_hostname }}"
        target_node: pve-opt-02
        schedule: "*/15"
        enabled: true
      - id: "150-1"
        source_node: "{{ inventory_hostname }}"
        target_node: pve-opt-03
        schedule: "*/15"
        enabled: true
    # `ha-manager config` index exactly matching test_ha_resources[0] — the
    # idempotency case (no `ha-manager set` expected). Indentation is spaces,
    # not Proxmox's tabs: the role matches with `\s+`/substring checks, so
    # spaces are equivalent and sidestep YAML tab-in-block ambiguity.
    ha_index_match: |
      vm:150
        state started
        max_restart 3
        max_relocate 3
    # Index with a drifted state (started -> stopped) — one `set` expected.
    ha_index_drift: |
      vm:150
        state stopped
        max_restart 3
        max_relocate 3
    # Index whose comment/max_restart/max_relocate were REMOVED from the
    # desired config — the removal-convergence case (one `ha-manager set` with
    # `--comment ""` + `--delete` expected).
    ha_index_removal: |
      vm:150
        state started
        comment legacy note
        max_restart 3
        max_relocate 3
    # Two resources in one index: vm:150 matches its desired entry, ct:151 has
    # a drifted state. Guards the per-SID attribution of the single index read
    # — a parser that leaks one resource's block into another's drift check
    # would either miss ct:151 or churn vm:150.
    ha_index_two_resources: |
      vm:150
        state started
        max_restart 3
        max_relocate 3
      ct:151
        state stopped
  pre_tasks:
    - name: Pre-create Ansible remote_tmp (raw bypasses tmpdir setup)
      ansible.builtin.raw: |
        set -e
        mkdir -p /tmp/ansible-tmp
        chmod 1777 /tmp/ansible-tmp
      changed_when: false

    - name: Gather facts now that remote_tmp exists
      ansible.builtin.setup:

    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Result directory
      ansible.builtin.file:
        path: /tmp/molecule-results
        state: directory
        mode: "0755"

  tasks:
    # CASE A — absent HA resource triggers `ha-manager add`.
    # Stub state: index empty (resource not present in HA).
    - name: A — reset stub logs and set "resource absent"
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: ""}
      loop_control:
        label: "{{ item.name }}"

    - name: A — run role with resource absent
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules }}"
        proxmox_ha_resources: "{{ test_ha_resources }}"

    - name: A — count ha-manager calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        add=$(grep -c '^ha-manager add vm:150 ' "$log" || true)
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        echo "{\"add_calls\": ${add}, \"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_a
      changed_when: false

    # CASE B — already-correct HA resource triggers NO `ha-manager set`.
    # Stub state: index lists the resource with matching properties.
    - name: B — reset log, seed a matching index
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "{{ ha_index_match }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: B — run role with resource already correct
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources: "{{ test_ha_resources }}"

    - name: B — count ha-manager calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        add=$(grep -c '^ha-manager add vm:150 ' "$log" || true)
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        echo "{\"add_calls\": ${add}, \"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_b
      changed_when: false

    # CASE C — drifted HA resource triggers exactly one `ha-manager set`.
    # Stub state: index lists the resource with the wrong state (stopped).
    - name: C — reset log, seed a drifted index
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "{{ ha_index_drift }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: C — run role with drifted resource
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources: "{{ test_ha_resources }}"

    - name: C — count ha-manager calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        add=$(grep -c '^ha-manager add vm:150 ' "$log" || true)
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        echo "{\"add_calls\": ${add}, \"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_c
      changed_when: false

    # CASE C2 — fields REMOVED from config (comment/max_restart/max_relocate
    # still set live) trigger exactly one `ha-manager set` that clears the
    # comment (--comment "") and --deletes the numeric keys — the removal
    # must CONVERGE, not re-fire every run.
    - name: C2 — reset log, seed a removal-drift index
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "{{ ha_index_removal }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: C2 — run role with the trimmed resource (no comment/max_*)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources:
          - type: vm
            vmid: 150
            state: started

    - name: C2 — count ha-manager calls and the removal arguments
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        # The stub logs "$*", so the empty --comment argument collapses to
        # nothing between spaces — match the flags, not the empty string.
        removal=$(grep -c -- '--comment .*--delete max_restart,max_relocate' "$log" || true)
        echo "{\"set_calls\": ${set_calls}, \"removal_calls\": ${removal}}"
      args:
        executable: /bin/bash
      register: case_c2
      changed_when: false

    # CASE C2b — post-clear convergence: with the fields gone from the live
    # detail too, the trimmed config must trigger NO further `set` (drives
    # all three "not defined and empty current" arms false — the one
    # convergence path no other case covers; tests role drift logic, not
    # real Proxmox `--comment ""` behavior, which a stub cannot model).
    - name: C2b — reset log, seed the post-clear clean index
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "vm:150\n  state started\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: C2b — re-run role with the same trimmed resource
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources:
          - type: vm
            vmid: 150
            state: started

    - name: C2b — count ha-manager calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_c2b
      changed_when: false

    # CASE N — two resources in one `ha-manager config` index: the matching
    # one must not be touched, the drifted one gets exactly one `set`. The
    # index is the ONLY source of per-resource state (real PVE rejects
    # `ha-manager config <sid>`), so this pins the per-SID attribution.
    - name: N — reset log, seed a two-resource index (one matching, one drifted)
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "{{ ha_index_two_resources }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: N — run role with both resources desired
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources:
          - type: vm
            vmid: 150
            state: started
            max_restart: 3
            max_relocate: 3
          - type: ct
            vmid: 151
            state: started

    - name: N — count ha-manager calls per resource
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        vm_set=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        ct_set=$(grep -c '^ha-manager set ct:151 ' "$log" || true)
        adds=$(grep -c '^ha-manager add ' "$log" || true)
        echo "{\"vm_set\": ${vm_set}, \"ct_set\": ${ct_set}, \"add_calls\": ${adds}}"
      args:
        executable: /bin/bash
      register: case_n
      changed_when: false

    # CASE D — replication job absent triggers `pvesr create-local-job`.
    # Stub state: pvesr list empty + VMID 150 resides locally (qm).
    # Replication tasks are not in main.yml; include them directly, exactly
    # as playbooks/proxmox-ha.yml does (tasks_from: replication).
    - name: D — reset log, empty replication list, VMID local
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: pvesr_list, content: "[]\n"}
        - {name: qm_vmids, content: "150\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: D — run replication tasks with job absent
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs }}"

    - name: D — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        create=$(grep -c '^pvesr create-local-job 150-0 pve-opt-02 ' "$log" || true)
        update=$(grep -c '^pvesr update 150-0 ' "$log" || true)
        echo "{\"create_calls\": ${create}, \"update_calls\": ${update}}"
      args:
        executable: /bin/bash
      register: case_d
      changed_when: false

    # CASE J — REAL target drift (desired target set differs) with the VM
    # local: exactly one `pvesr delete` + one `pvesr create-local-job`.
    - name: J — reset log, seed a job on the wrong target, VMID local
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: qm_vmids, content: "150\n"}
        - name: pvesr_list
          content: |
            [{"id": "150-0", "source": "{{ inventory_hostname }}",
              "target": "pve-opt-99", "schedule": "*/15"}]
      loop_control:
        label: "{{ item.name }}"

    - name: J — run replication tasks with target drift (VM local)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs }}"

    - name: J — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        delete=$(grep -c '^pvesr delete 150-0$' "$log" || true)
        create=$(grep -c '^pvesr create-local-job 150-0 pve-opt-02 ' "$log" || true)
        echo "{\"delete_calls\": ${delete}, \"create_calls\": ${create}}"
      args:
        executable: /bin/bash
      register: case_j
      changed_when: false

    # CASE K — same target drift but the VM is NOT local: the live job must
    # NOT be deleted (it could never be recreated here — deleting it would
    # silently drop a replication target). Source-drift warning only.
    - name: K — reset log, same drifted job, NO local VMIDs
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: qm_vmids, content: ""}
        - name: pvesr_list
          content: |
            [{"id": "150-0", "source": "{{ inventory_hostname }}",
              "target": "pve-opt-99", "schedule": "*/15"}]
      loop_control:
        label: "{{ item.name }}"

    - name: K — run replication tasks with target drift (VM not local)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs }}"

    - name: K — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        delete=$(grep -c '^pvesr delete ' "$log" || true)
        create=$(grep -c '^pvesr create-local-job ' "$log" || true)
        echo "{\"delete_calls\": ${delete}, \"create_calls\": ${create}}"
      args:
        executable: /bin/bash
      register: case_k
      changed_when: false

    # CASE L — permuted job-ID<->target assignments with an IDENTICAL target
    # set (what Proxmox leaves behind after a migration round-trip): NOT
    # drift. No delete/create/update — a delete+recreate here would force a
    # full ZFS resync per touched target.
    - name: L — reset log, seed permuted-ID jobs (same target set), VMID local
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: qm_vmids, content: "150\n"}
        - name: pvesr_list
          content: |
            [{"id": "150-0", "source": "{{ inventory_hostname }}",
              "target": "pve-opt-03", "schedule": "*/15"},
             {"id": "150-1", "source": "{{ inventory_hostname }}",
              "target": "pve-opt-02", "schedule": "*/15"}]
      loop_control:
        label: "{{ item.name }}"

    - name: L — run replication tasks with permuted assignments
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs_multi }}"

    - name: L — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        delete=$(grep -c '^pvesr delete ' "$log" || true)
        create=$(grep -c '^pvesr create-local-job ' "$log" || true)
        update=$(grep -c '^pvesr update ' "$log" || true)
        echo "{\"delete_calls\": ${delete}, \"create_calls\": ${create}, \"update_calls\": ${update}}"
      args:
        executable: /bin/bash
      register: case_l
      changed_when: false

    # CASE M — orphaned job (exists on this node, absent from config) next
    # to an already-correct configured job: warning only, ZERO mutations.
    # Orphan cleanup is deliberately manual (see tasks/replication.yml).
    - name: M — reset log, seed a matching job + an orphan, VMID local
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: qm_vmids, content: "150\n"}
        - name: pvesr_list
          content: |
            [{"id": "150-0", "source": "{{ inventory_hostname }}",
              "target": "pve-opt-02", "schedule": "*/15"},
             {"id": "151-0", "source": "{{ inventory_hostname }}",
              "target": "pve-opt-03", "schedule": "*/15"}]
      loop_control:
        label: "{{ item.name }}"

    - name: M — run replication tasks with an orphaned job present
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs }}"

    - name: M — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        delete=$(grep -c '^pvesr delete ' "$log" || true)
        create=$(grep -c '^pvesr create-local-job ' "$log" || true)
        update=$(grep -c '^pvesr update ' "$log" || true)
        echo "{\"delete_calls\": ${delete}, \"create_calls\": ${create}, \"update_calls\": ${update}}"
      args:
        executable: /bin/bash
      register: case_m
      changed_when: false

    # CASE E — already-correct node-affinity RULE triggers NO `rules set`.
    # PVE9 `ha-manager rules list --output-format=json` returns nodes/resources
    # as HASHES; the stub serves a rule matching test_ha_rules[0] exactly (node
    # priority 0 == the desired unprioritised nodes), so drift must be false.
    - name: E — reset log, pre-seed a matching node-affinity rule (PVE9 hash form)
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 0}, "pve-opt-02": {"priority": 0}},
               "resources": {"vm:150": {}}, "strict": 0}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: E — run role with rule already correct
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules }}"

    - name: E — count rules add/set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        add_calls=$(grep -c '^ha-manager rules add node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}, \"add_calls\": ${add_calls}}"
      args:
        executable: /bin/bash
      register: case_e
      changed_when: false

    # CASE F — drifted node-affinity RULE (a node removed) triggers exactly
    # one `rules set`.
    - name: F — reset log, pre-seed a drifted node-affinity rule
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 0}},
               "resources": {"vm:150": {}}, "strict": 0}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: F — run role with rule drifted
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules }}"

    - name: F — count rules set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_f
      changed_when: false

    # CASE E2 — already-correct rule whose nodes carry EXPLICIT priorities
    # (the real inventory shape) triggers NO `rules set`. Pre-seeded PVE9 hash
    # matches the priorities/strict/comment exactly. Locks in the priority-
    # preservation contract production rules depend on.
    - name: E2 — reset log, pre-seed a matching prioritised rule (PVE9 hash form)
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}}, "strict": 1,
               "comment": "keep dns off nas"}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: E2 — run role with prioritised rule already correct
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_prio }}"

    - name: E2 — count rules add/set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        add_calls=$(grep -c '^ha-manager rules add node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}, \"add_calls\": ${add_calls}}"
      args:
        executable: /bin/bash
      register: case_e2
      changed_when: false

    # CASE G — strict drift (current strict=0, desired strict=1) triggers
    # exactly one `rules set`. Nodes/resources match so strict is the sole driver.
    - name: G — reset log, pre-seed a rule that differs only in strict
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}}, "strict": 0,
               "comment": "keep dns off nas"}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: G — run role with strict drift
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_prio }}"

    - name: G — count rules set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_g
      changed_when: false

    # CASE H — comment drift (current comment differs) triggers exactly one
    # `rules set`. Nodes/resources/strict match so the comment is the sole driver.
    - name: H — reset log, pre-seed a rule that differs only in comment
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}}, "strict": 1,
               "comment": "stale comment"}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: H — run role with comment drift
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_prio }}"

    - name: H — count rules set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_h
      changed_when: false

    # CASE I — resource drift (current carries an extra resource) triggers
    # exactly one `rules set`. Nodes/strict/comment match so resources alone drive.
    - name: I — reset log, pre-seed a rule that differs only in resources
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}, "vm:151": {}}, "strict": 1,
               "comment": "keep dns off nas"}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: I — run role with resource drift
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_prio }}"

    - name: I — count rules set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_i
      changed_when: false

    # NOTE on the string-form fallback branch (tasks/rules.yml `else` arms of
    # _current_nodes/_current_resources): it only fires if a future PVE returns
    # nodes/resources as comma-STRINGS instead of hashes. PVE9 always emits
    # hashes and the stub mirrors that, so that branch isn't reachable from
    # molecule without seeding a non-PVE9 JSON shape the role would never see in
    # prod. Left untested deliberately — it's a defensive fallback, not a path.

    # CASE P — datacenter.cfg carries no migration key at all (the cluster is
    # inheriting PVE's default rather than declaring one): exactly one
    # `pvesh set /cluster/options --migration type=secure`.
    - name: P — reset pvesh log, seed datacenter options with no migration key
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - {name: pvesh_cluster_options, content: "{\"keyboard\": \"en-us\"}\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: P — run role with the migration channel unpinned
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha

    - name: P — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesh.log
        pin=$(grep -cxF 'pvesh set /cluster/options --migration type=secure' "$log" || true)
        total=$(grep -c '^pvesh ' "$log" || true)
        echo "{\"pin_calls\": ${pin}, \"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_p
      changed_when: false

    # CASE P2 — a live `insecure` channel (cleartext guest RAM on 60000-60050)
    # is reverted, and the dedicated migration network is carried through
    # rather than cleared by the wholesale property-string replacement.
    - name: P2 — reset pvesh log, seed an insecure channel with a network
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - name: pvesh_cluster_options
          content: |
            {"keyboard": "en-us",
             "migration": {"type": "insecure", "network": "10.0.0.0/24"}}
      loop_control:
        label: "{{ item.name }}"

    - name: P2 — run role against the insecure channel
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha

    - name: P2 — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesh.log
        exp='pvesh set /cluster/options --migration type=secure,network=10.0.0.0/24'
        revert=$(grep -cxF "$exp" "$log" || true)
        total=$(grep -c '^pvesh ' "$log" || true)
        echo "{\"revert_calls\": ${revert}, \"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_p2
      changed_when: false

    # CASE P3 — already pinned: ZERO mutations.
    - name: P3 — reset pvesh log, seed the pinned channel
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - name: pvesh_cluster_options
          content: |
            {"keyboard": "en-us", "migration": {"type": "secure"}}
      loop_control:
        label: "{{ item.name }}"

    - name: P3 — run role with the channel already pinned
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha

    - name: P3 — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^pvesh ' /tmp/molecule-stub-state/pvesh.log || true)
        echo "{\"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_p3
      changed_when: false

    - name: Capture HA contract results
      ansible.builtin.copy:
        dest: /tmp/molecule-results/ha-contract.json
        mode: "0644"
        content: |
          {"a_add": {{ (case_a.stdout | from_json).add_calls }},
           "a_set": {{ (case_a.stdout | from_json).set_calls }},
           "b_add": {{ (case_b.stdout | from_json).add_calls }},
           "b_set": {{ (case_b.stdout | from_json).set_calls }},
           "c_add": {{ (case_c.stdout | from_json).add_calls }},
           "c_set": {{ (case_c.stdout | from_json).set_calls }},
           "c2_set": {{ (case_c2.stdout | from_json).set_calls }},
           "c2_removal": {{ (case_c2.stdout | from_json).removal_calls }},
           "c2b_set": {{ (case_c2b.stdout | from_json).set_calls }},
           "n_vm_set": {{ (case_n.stdout | from_json).vm_set }},
           "n_ct_set": {{ (case_n.stdout | from_json).ct_set }},
           "n_add": {{ (case_n.stdout | from_json).add_calls }},
           "d_create": {{ (case_d.stdout | from_json).create_calls }},
           "d_update": {{ (case_d.stdout | from_json).update_calls }},
           "j_delete": {{ (case_j.stdout | from_json).delete_calls }},
           "j_create": {{ (case_j.stdout | from_json).create_calls }},
           "k_delete": {{ (case_k.stdout | from_json).delete_calls }},
           "k_create": {{ (case_k.stdout | from_json).create_calls }},
           "l_delete": {{ (case_l.stdout | from_json).delete_calls }},
           "l_create": {{ (case_l.stdout | from_json).create_calls }},
           "l_update": {{ (case_l.stdout | from_json).update_calls }},
           "m_delete": {{ (case_m.stdout | from_json).delete_calls }},
           "m_create": {{ (case_m.stdout | from_json).create_calls }},
           "m_update": {{ (case_m.stdout | from_json).update_calls }},
           "e_set": {{ (case_e.stdout | from_json).set_calls }},
           "e_add": {{ (case_e.stdout | from_json).add_calls }},
           "f_set": {{ (case_f.stdout | from_json).set_calls }},
           "e2_set": {{ (case_e2.stdout | from_json).set_calls }},
           "e2_add": {{ (case_e2.stdout | from_json).add_calls }},
           "g_set": {{ (case_g.stdout | from_json).set_calls }},
           "h_set": {{ (case_h.stdout | from_json).set_calls }},
           "i_set": {{ (case_i.stdout | from_json).set_calls }},
           "p_pin": {{ (case_p.stdout | from_json).pin_calls }},
           "p_total": {{ (case_p.stdout | from_json).total }},
           "p2_revert": {{ (case_p2.stdout | from_json).revert_calls }},
           "p2_total": {{ (case_p2.stdout | from_json).total }},
           "p3_total": {{ (case_p3.stdout | from_json).total }}}
