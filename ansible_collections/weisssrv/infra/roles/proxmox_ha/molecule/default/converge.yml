---
- name: Converge — exercise HA resource + replication contracts
  hosts: all
  become: true
  # See proxmox_vm/molecule/default/converge.yml for the rationale on
  # deferring gather_facts behind a raw mkdir.
  gather_facts: false
  vars:
    # Fixtures for the cases below. The role gates each task file behind
    # `<var> | length > 0`, so a non-empty list activates it; with the stubs'
    # empty current state, proxmox_ha_rules also drives the rule "add" path.
    test_ha_rules:
      - name: dns-affinity
        type: node-affinity
        resources: [vm:150]
        nodes: [pve-opt-01, pve-opt-02]
        strict: false
    # Real-inventory shape: nodes carry EXPLICIT priorities and the rule sets a
    # comment + strict. Exercises the priority-preservation path (the role only
    # appends ":0" to bare nodes, so "pve-opt-01:2" must round-trip unchanged).
    test_ha_rules_prio:
      - name: dns-affinity
        type: node-affinity
        resources: [vm:150]
        nodes: ["pve-opt-01:2", "pve-opt-02:1"]
        strict: true
        comment: "keep dns off nas"
    test_ha_resources:
      - type: vm
        vmid: 150
        state: started
        max_restart: 3
        max_relocate: 3
    # `enabled: false` is how inventory says "unmanage this": the removal paths
    # are the ones that delete production HA state, so they are driven too.
    test_ha_resources_disabled:
      - type: vm
        vmid: 150
        state: started
        enabled: false
    test_ha_rules_disabled:
      - name: dns-affinity
        type: node-affinity
        resources: [vm:150]
        nodes: ["pve-opt-01:2", "pve-opt-02:1"]
        strict: true
        comment: "keep dns off nas"
        enabled: false
      - name: web-affinity
        type: node-affinity
        resources: [vm:160]
        nodes: [pve-opt-02]
        strict: false
    # Only node-affinity is implemented; any other type must fail loud rather
    # than be silently skipped by the type-gated create/update tasks.
    test_ha_rules_bad_type:
      - name: db-together
        type: resource-affinity
        resources: [vm:150, vm:151]
        nodes: [pve-opt-01]
    test_replication_jobs_disabled:
      - id: "150-0"
        source_node: "{{ inventory_hostname }}"
        target_node: pve-opt-02
        schedule: "*/15"
        enabled: false
    test_replication_jobs_disabled_remote:
      - id: "150-0"
        source_node: pve-opt-09
        target_node: pve-opt-02
        schedule: "*/15"
        enabled: false
    test_replication_jobs:
      - id: "150-0"
        source_node: "{{ inventory_hostname }}"
        target_node: pve-opt-02
        schedule: "*/15"
        enabled: true
    # Matches the live 150-0 of the real-shape index exactly (target, schedule
    # and comment), so parsing that index must mutate nothing.
    test_replication_jobs_shape:
      - id: "150-0"
        source_node: "{{ inventory_hostname }}"
        target_node: pve-opt-02
        schedule: "*/15"
        comment: "guest-150 -> pve-opt-02"
        enabled: true
    # Two jobs for the same VMID — used by the permuted-ID case (L), where the
    # live jobs carry the same TARGET SET but swapped job-ID assignments (what
    # Proxmox does after a guest migration round-trip).
    test_replication_jobs_multi:
      - id: "150-0"
        source_node: "{{ inventory_hostname }}"
        target_node: pve-opt-02
        schedule: "*/15"
        enabled: true
      - id: "150-1"
        source_node: "{{ inventory_hostname }}"
        target_node: pve-opt-03
        schedule: "*/15"
        enabled: true
    # `ha-manager config` index matching test_ha_resources[0]: the idempotency
    # case, no `ha-manager set` expected. Indentation is spaces, not Proxmox's
    # tabs; the role matches with `\s+`, so the two are equivalent.
    ha_index_match: |
      vm:150
        state started
        max_restart 3
        max_relocate 3
    # Index with a drifted state (started -> stopped) — one `set` expected.
    ha_index_drift: |
      vm:150
        state stopped
        max_restart 3
        max_relocate 3
    # Index whose comment/max_restart/max_relocate were REMOVED from the
    # desired config — the removal-convergence case (one `ha-manager set` with
    # `--comment ""` + `--delete` expected).
    ha_index_removal: |
      vm:150
        state started
        comment legacy note
        max_restart 3
        max_relocate 3
    # Two resources in one index: vm:150 matches, ct:151 has a drifted state.
    # Guards per-SID attribution of the single index read, where a leaking
    # parser would miss ct:151 or churn vm:150.
    ha_index_two_resources: |
      vm:150
        state started
        max_restart 3
        max_relocate 3
      ct:151
        state stopped
  pre_tasks:
    - name: Pre-create Ansible remote_tmp (raw bypasses tmpdir setup)
      ansible.builtin.raw: |
        set -e
        mkdir -p /tmp/ansible-tmp
        chmod 1777 /tmp/ansible-tmp
      changed_when: false

    - name: Gather facts now that remote_tmp exists
      ansible.builtin.setup:

    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Result directory
      ansible.builtin.file:
        path: /tmp/molecule-results
        state: directory
        mode: "0755"

  tasks:
    # CASE A — absent HA resource triggers `ha-manager add`.
    # Stub state: index empty (resource not present in HA).
    - name: A — reset stub logs and set "resource absent"
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: ""}
      loop_control:
        label: "{{ item.name }}"

    - name: A — run role with resource absent
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules }}"
        proxmox_ha_resources: "{{ test_ha_resources }}"

    - name: A — count ha-manager calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        add=$(grep -c '^ha-manager add vm:150 ' "$log" || true)
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        echo "{\"add_calls\": ${add}, \"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_a
      changed_when: false

    # CASE B — already-correct HA resource triggers NO `ha-manager set`.
    # Stub state: index lists the resource with matching properties.
    - name: B — reset log, seed a matching index
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "{{ ha_index_match }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: B — run role with resource already correct
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources: "{{ test_ha_resources }}"

    - name: B — count ha-manager calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        add=$(grep -c '^ha-manager add vm:150 ' "$log" || true)
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        echo "{\"add_calls\": ${add}, \"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_b
      changed_when: false

    # CASE C — drifted HA resource triggers exactly one `ha-manager set`.
    # Stub state: index lists the resource with the wrong state (stopped).
    - name: C — reset log, seed a drifted index
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "{{ ha_index_drift }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: C — run role with drifted resource
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources: "{{ test_ha_resources }}"

    - name: C — count ha-manager calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        add=$(grep -c '^ha-manager add vm:150 ' "$log" || true)
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        echo "{\"add_calls\": ${add}, \"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_c
      changed_when: false

    # CASE C2 — fields removed from config while still set live trigger
    # exactly one `ha-manager set` that clears the comment and deletes the
    # numeric keys. The removal must converge, not re-fire every run.
    - name: C2 — reset log, seed a removal-drift index
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "{{ ha_index_removal }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: C2 — run role with the trimmed resource (no comment/max_*)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources:
          - type: vm
            vmid: 150
            state: started

    - name: C2 — count ha-manager calls and the removal arguments
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        # The stub logs "$*", so the empty --comment argument collapses to
        # nothing between spaces — match the flags, not the empty string.
        removal=$(grep -c -- '--comment .*--delete max_restart,max_relocate' "$log" || true)
        echo "{\"set_calls\": ${set_calls}, \"removal_calls\": ${removal}}"
      args:
        executable: /bin/bash
      register: case_c2
      changed_when: false

    # CASE C2b — post-clear convergence: with the fields gone from the live
    # detail too, the trimmed config triggers no further `set`. It drives all
    # three "not defined and empty current" arms false.
    - name: C2b — reset log, seed the post-clear clean index
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "vm:150\n  state started\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: C2b — re-run role with the same trimmed resource
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources:
          - type: vm
            vmid: 150
            state: started

    - name: C2b — count ha-manager calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_c2b
      changed_when: false

    # CASE N — two resources in one index: the matching one is untouched, the
    # drifted one gets exactly one `set`. The index is the only source of
    # per-resource state, so this pins per-SID attribution.
    - name: N — reset log, seed a two-resource index (one matching, one drifted)
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "{{ ha_index_two_resources }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: N — run role with both resources desired
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources:
          - type: vm
            vmid: 150
            state: started
            max_restart: 3
            max_relocate: 3
          - type: ct
            vmid: 151
            state: started

    - name: N — count ha-manager calls per resource
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        vm_set=$(grep -c '^ha-manager set vm:150 ' "$log" || true)
        ct_set=$(grep -c '^ha-manager set ct:151 ' "$log" || true)
        adds=$(grep -c '^ha-manager add ' "$log" || true)
        echo "{\"vm_set\": ${vm_set}, \"ct_set\": ${ct_set}, \"add_calls\": ${adds}}"
      args:
        executable: /bin/bash
      register: case_n
      changed_when: false

    # CASE D — an absent replication job triggers `pvesr create-local-job`.
    # Stub state: an empty API index, VMID 150 local. Replication tasks are not
    # in main.yml, so they are included directly as the playbook does.
    - name: D — reset log, empty replication index, VMID local
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: pvesh_replication, content: "[]\n"}
        - {name: qm_vmids, content: "150\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: D — run replication tasks with job absent
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs }}"

    - name: D — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        create=$(grep -c '^pvesr create-local-job 150-0 pve-opt-02 ' "$log" || true)
        update=$(grep -c '^pvesr update 150-0 ' "$log" || true)
        echo "{\"create_calls\": ${create}, \"update_calls\": ${update}}"
      args:
        executable: /bin/bash
      register: case_d
      changed_when: false

    # CASE D2 — the live index parses in the shape the API returns: the extra
    # keys (guest, jobnum, type, rate) and a `disable` flag are carried without
    # churn, and a job sourced elsewhere is neither an orphan nor a mutation.
    - name: D2 — reset log, seed the API-shape index, VMID local
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: qm_vmids, content: "150\n"}
        - name: pvesh_replication
          content: |
            [{"id": "150-0", "guest": 150, "jobnum": 0, "type": "local",
              "source": "{{ inventory_hostname }}", "target": "pve-opt-02",
              "schedule": "*/15", "comment": "guest-150 -> pve-opt-02"},
             {"id": "150-1", "guest": 150, "jobnum": 1, "type": "local",
              "source": "{{ inventory_hostname }}", "target": "pve-opt-03",
              "schedule": "*/30", "rate": 10, "disable": 1},
             {"id": "160-0", "guest": 160, "jobnum": 0, "type": "local",
              "source": "pve-opt-09", "target": "pve-opt-02",
              "schedule": "*/15"}]
      loop_control:
        label: "{{ item.name }}"

    - name: D2 — run replication tasks against the API-shape index
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs_shape }}"

    - name: D2 — record the parsed index
      ansible.builtin.set_fact:
        shape_ids: "{{ proxmox_ha_current_replication_job_ids | default([]) }}"
        shape_detail: "{{ proxmox_ha_current_jobs_detail | default({}) }}"
        shape_drifted: "{{ proxmox_ha_drifted_job_ids | default([]) }}"
        shape_orphans: "{{ proxmox_ha_orphaned_job_ids | default([]) }}"

    - name: D2 — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^pvesr ' /tmp/molecule-stub-state/pvesr.log || true)
        echo "{\"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_d2
      changed_when: false

    # CASE J — REAL target drift (desired target set differs) with the VM
    # local: exactly one `pvesr delete` + one `pvesr create-local-job`.
    - name: J — reset log, seed a job on the wrong target, VMID local
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: qm_vmids, content: "150\n"}
        - name: pvesh_replication
          content: |
            [{"id": "150-0", "guest": 150, "jobnum": 0, "type": "local",
              "source": "{{ inventory_hostname }}", "target": "pve-opt-99",
              "schedule": "*/15"}]
      loop_control:
        label: "{{ item.name }}"

    - name: J — run replication tasks with target drift (VM local)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs }}"

    - name: J — record the detected drift
      ansible.builtin.set_fact:
        j_drifted: "{{ proxmox_ha_drifted_job_ids | default([]) }}"

    - name: J — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        delete=$(grep -c '^pvesr delete 150-0$' "$log" || true)
        create=$(grep -c '^pvesr create-local-job 150-0 pve-opt-02 ' "$log" || true)
        echo "{\"delete_calls\": ${delete}, \"create_calls\": ${create}}"
      args:
        executable: /bin/bash
      register: case_j
      changed_when: false

    # CASE K — same target drift but the VM is NOT local: the live job must
    # NOT be deleted (it could never be recreated here — deleting it would
    # silently drop a replication target). Source-drift warning only.
    - name: K — reset log, same drifted job, NO local VMIDs
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: qm_vmids, content: ""}
        - name: pvesh_replication
          content: |
            [{"id": "150-0", "guest": 150, "jobnum": 0, "type": "local",
              "source": "{{ inventory_hostname }}", "target": "pve-opt-99",
              "schedule": "*/15"}]
      loop_control:
        label: "{{ item.name }}"

    - name: K — run replication tasks with target drift (VM not local)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs }}"

    - name: K — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        delete=$(grep -c '^pvesr delete ' "$log" || true)
        create=$(grep -c '^pvesr create-local-job ' "$log" || true)
        echo "{\"delete_calls\": ${delete}, \"create_calls\": ${create}}"
      args:
        executable: /bin/bash
      register: case_k
      changed_when: false

    # CASE L — permuted job-ID/target assignments over an identical target set
    # are not drift, so no delete, create or update fires. A delete and
    # recreate here would force a full ZFS resync per touched target.
    - name: L — reset log, seed permuted-ID jobs (same target set), VMID local
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: qm_vmids, content: "150\n"}
        - name: pvesh_replication
          content: |
            [{"id": "150-0", "guest": 150, "jobnum": 0, "type": "local",
              "source": "{{ inventory_hostname }}", "target": "pve-opt-03",
              "schedule": "*/15"},
             {"id": "150-1", "guest": 150, "jobnum": 1, "type": "local",
              "source": "{{ inventory_hostname }}", "target": "pve-opt-02",
              "schedule": "*/15"}]
      loop_control:
        label: "{{ item.name }}"

    - name: L — run replication tasks with permuted assignments
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs_multi }}"

    - name: L — record the detected drift
      ansible.builtin.set_fact:
        l_drifted: "{{ proxmox_ha_drifted_job_ids | default([]) }}"

    - name: L — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        delete=$(grep -c '^pvesr delete ' "$log" || true)
        create=$(grep -c '^pvesr create-local-job ' "$log" || true)
        update=$(grep -c '^pvesr update ' "$log" || true)
        echo "{\"delete_calls\": ${delete}, \"create_calls\": ${create}, \"update_calls\": ${update}}"
      args:
        executable: /bin/bash
      register: case_l
      changed_when: false

    # CASE M — orphaned job (exists on this node, absent from config) next
    # to an already-correct configured job: warning only, ZERO mutations.
    # Orphan cleanup is manual (see tasks/replication.yml).
    - name: M — reset log, seed a matching job + an orphan, VMID local
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: qm_vmids, content: "150\n"}
        - name: pvesh_replication
          content: |
            [{"id": "150-0", "guest": 150, "jobnum": 0, "type": "local",
              "source": "{{ inventory_hostname }}", "target": "pve-opt-02",
              "schedule": "*/15"},
             {"id": "151-0", "guest": 151, "jobnum": 0, "type": "local",
              "source": "{{ inventory_hostname }}", "target": "pve-opt-03",
              "schedule": "*/15"}]
      loop_control:
        label: "{{ item.name }}"

    - name: M — run replication tasks with an orphaned job present
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs }}"

    - name: M — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        delete=$(grep -c '^pvesr delete ' "$log" || true)
        create=$(grep -c '^pvesr create-local-job ' "$log" || true)
        update=$(grep -c '^pvesr update ' "$log" || true)
        echo "{\"delete_calls\": ${delete}, \"create_calls\": ${create}, \"update_calls\": ${update}}"
      args:
        executable: /bin/bash
      register: case_m
      changed_when: false

    # CASE E — an already-correct node-affinity rule triggers no `rules set`.
    # PVE9 returns nodes and resources as hashes, and the stub serves a rule
    # matching test_ha_rules[0] exactly, so drift must be false.
    - name: E — reset log, pre-seed a matching node-affinity rule (PVE9 hash form)
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 0}, "pve-opt-02": {"priority": 0}},
               "resources": {"vm:150": {}}, "strict": 0}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: E — run role with rule already correct
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules }}"

    - name: E — count rules add/set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        add_calls=$(grep -c '^ha-manager rules add node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}, \"add_calls\": ${add_calls}}"
      args:
        executable: /bin/bash
      register: case_e
      changed_when: false

    # CASE F — drifted node-affinity RULE (a node removed) triggers exactly
    # one `rules set`.
    - name: F — reset log, pre-seed a drifted node-affinity rule
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 0}},
               "resources": {"vm:150": {}}, "strict": 0}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: F — run role with rule drifted
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules }}"

    - name: F — count rules set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_f
      changed_when: false

    # CASE E2 — an already-correct rule whose nodes carry explicit priorities
    # triggers no `rules set`. The pre-seeded PVE9 hash matches the priorities,
    # strict flag and comment, locking in priority preservation.
    - name: E2 — reset log, pre-seed a matching prioritised rule (PVE9 hash form)
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}}, "strict": 1,
               "comment": "keep dns off nas"}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: E2 — run role with prioritised rule already correct
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_prio }}"

    - name: E2 — count rules add/set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        add_calls=$(grep -c '^ha-manager rules add node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}, \"add_calls\": ${add_calls}}"
      args:
        executable: /bin/bash
      register: case_e2
      changed_when: false

    # CASE G — strict drift (current strict=0, desired strict=1) triggers
    # exactly one `rules set`. Nodes/resources match so strict is the sole driver.
    - name: G — reset log, pre-seed a rule that differs only in strict
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}}, "strict": 0,
               "comment": "keep dns off nas"}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: G — run role with strict drift
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_prio }}"

    - name: G — count rules set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_g
      changed_when: false

    # CASE H — comment drift (current comment differs) triggers exactly one
    # `rules set`. Nodes/resources/strict match so the comment is the sole driver.
    - name: H — reset log, pre-seed a rule that differs only in comment
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}}, "strict": 1,
               "comment": "stale comment"}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: H — run role with comment drift
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_prio }}"

    - name: H — count rules set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_h
      changed_when: false

    # CASE I — resource drift (current carries an extra resource) triggers
    # exactly one `rules set`. Nodes/strict/comment match so resources alone drive.
    - name: I — reset log, pre-seed a rule that differs only in resources
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}, "vm:151": {}}, "strict": 1,
               "comment": "keep dns off nas"}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: I — run role with resource drift
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_prio }}"

    - name: I — count rules set calls for dns-affinity
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        set_calls=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        echo "{\"set_calls\": ${set_calls}}"
      args:
        executable: /bin/bash
      register: case_i
      changed_when: false

    # The string-form fallback in tasks/rules.yml fires only if PVE returns
    # nodes and resources as comma-strings. PVE9 emits hashes and the stub
    # mirrors that, so that defensive branch is untested here.

    # CASE P — datacenter.cfg carries no migration key at all (the cluster is
    # inheriting PVE's default rather than declaring one): exactly one
    # `pvesh set /cluster/options --migration type=secure`.
    - name: P — reset pvesh log, seed datacenter options with no migration key
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - {name: pvesh_cluster_options, content: "{\"keyboard\": \"en-us\"}\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: P — run role with the migration channel unpinned
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha

    - name: P — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesh.log
        pin=$(grep -cxF 'pvesh set /cluster/options --migration type=secure' "$log" || true)
        total=$(grep -c '^pvesh ' "$log" || true)
        echo "{\"pin_calls\": ${pin}, \"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_p
      changed_when: false

    # CASE P2 — a live `insecure` channel (cleartext guest RAM on 60000-60050)
    # is reverted, and the dedicated migration network is carried through
    # rather than cleared by the wholesale property-string replacement.
    - name: P2 — reset pvesh log, seed an insecure channel with a network
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - name: pvesh_cluster_options
          content: |
            {"keyboard": "en-us",
             "migration": {"type": "insecure", "network": "10.0.0.0/24"}}
      loop_control:
        label: "{{ item.name }}"

    - name: P2 — run role against the insecure channel
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha

    - name: P2 — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesh.log
        exp='pvesh set /cluster/options --migration type=secure,network=10.0.0.0/24'
        revert=$(grep -cxF "$exp" "$log" || true)
        total=$(grep -c '^pvesh ' "$log" || true)
        echo "{\"revert_calls\": ${revert}, \"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_p2
      changed_when: false

    # CASE P3 — already pinned: ZERO mutations.
    - name: P3 — reset pvesh log, seed the pinned channel
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - name: pvesh_cluster_options
          content: |
            {"keyboard": "en-us", "migration": {"type": "secure"}}
      loop_control:
        label: "{{ item.name }}"

    - name: P3 — run role with the channel already pinned
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha

    - name: P3 — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^pvesh ' /tmp/molecule-stub-state/pvesh.log || true)
        echo "{\"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_p3
      changed_when: false

    # CASE Q — a resource marked `enabled: false` while live is REMOVED, with
    # no add/set alongside it.
    - name: Q — reset log, seed the resource as live
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_config_list, content: "{{ ha_index_match }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: Q — run role with the resource disabled
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_resources: "{{ test_ha_resources_disabled }}"

    - name: Q — count ha-manager calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        remove=$(grep -cxF 'ha-manager remove vm:150' "$log" || true)
        mutate=$(grep -cE '^ha-manager (add|set) ' "$log" || true)
        echo "{\"remove_calls\": ${remove}, \"mutate_calls\": ${mutate}}"
      args:
        executable: /bin/bash
      register: case_q
      changed_when: false

    # CASE R — a rule marked `enabled: false` is removed, and the removal runs
    # BEFORE the add of the second rule (a resource in two node-affinity rules
    # mid-run can fail PVE's feasibility check).
    - name: R — reset log, seed the rule as live
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}}, "strict": 1,
               "comment": "keep dns off nas"}
            ]
      loop_control:
        label: "{{ item.name }}"

    - name: R — run role with one rule disabled and one absent
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_disabled }}"

    - name: R — count rule mutations and their order
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/ha-manager.log
        remove=$(grep -cxF 'ha-manager rules remove dns-affinity' "$log" || true)
        add=$(grep -c '^ha-manager rules add node-affinity web-affinity ' "$log" || true)
        dns_set=$(grep -c '^ha-manager rules set node-affinity dns-affinity ' "$log" || true)
        remove_line=$(grep -nxF 'ha-manager rules remove dns-affinity' "$log" | head -1 | cut -d: -f1)
        add_line=$(grep -n '^ha-manager rules add node-affinity web-affinity ' "$log" | head -1 | cut -d: -f1)
        order=0
        if [ -n "$remove_line" ] && [ -n "$add_line" ] && [ "$remove_line" -lt "$add_line" ]; then
          order=1
        fi
        echo "{\"remove_calls\": ${remove}, \"add_calls\": ${add}, \"set_calls\": ${dns_set}, \"remove_before_add\": ${order}}"
      args:
        executable: /bin/bash
      register: case_r
      changed_when: false

    # CASE S — a replication job marked `enabled: false` is deleted while the
    # guest is local; the same job sourced from ANOTHER node is left alone
    # (a job that could not be recreated here is never deleted).
    - name: S — reset log, seed the job as live
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - name: pvesh_replication
          content: |
            [{"id": "150-0", "guest": 150, "jobnum": 0, "type": "local",
              "source": "{{ inventory_hostname }}", "target": "pve-opt-02",
              "schedule": "*/15"}]
        - {name: qm_vmids, content: "150\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: S — run replication tasks with the job disabled
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs_disabled }}"

    - name: S — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesr.log
        delete=$(grep -cxF 'pvesr delete 150-0' "$log" || true)
        create=$(grep -c '^pvesr create-local-job ' "$log" || true)
        echo "{\"delete_calls\": ${delete}, \"create_calls\": ${create}}"
      args:
        executable: /bin/bash
      register: case_s
      changed_when: false

    - name: S2 — reset log, same live job but sourced from another node
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - name: pvesh_replication
          content: |
            [{"id": "150-0", "guest": 150, "jobnum": 0, "type": "local",
              "source": "pve-opt-09", "target": "pve-opt-02",
              "schedule": "*/15"}]
        - {name: qm_vmids, content: "150\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: S2 — run replication tasks for a job this node does not source
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      vars:
        proxmox_ha_replication_jobs: "{{ test_replication_jobs_disabled_remote }}"

    - name: S2 — count pvesr calls
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^pvesr ' /tmp/molecule-stub-state/pvesr.log || true)
        echo "{\"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_s2
      changed_when: false

    # CASE T — an unsupported rule type must fail the play, not be skipped.
    - name: T — reset log and empty the live rule list
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - {name: ha_rules_list, content: "[]\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: T — run role with an unsupported rule type
      tags: [molecule-idempotence-notest]
      block:
        - name: T — include proxmox_ha (expected to fail)
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_ha
          vars:
            proxmox_ha_rules: "{{ test_ha_rules_bad_type }}"
        - name: T — unsupported rule type did not fail
          ansible.builtin.set_fact:
            bad_rule_type_failed: false
            bad_rule_type_msg: ""
      rescue:
        - name: T — unsupported rule type failed as expected
          ansible.builtin.set_fact:
            bad_rule_type_failed: true
            bad_rule_type_msg: "{{ ansible_failed_result | default({}) | to_json }}"

    - name: T — count ha-manager mutations
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^ha-manager ' /tmp/molecule-stub-state/ha-manager.log || true)
        echo "{\"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_t
      changed_when: false

    # CASE U — live rules/resources absent from inventory are REPORTED, never
    # touched: zero mutations, and the unmanaged facts name them.
    - name: U — reset log, seed a matching rule plus an uncodified one
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: ha-manager.log, content: ""}
        - name: ha_rules_list
          content: |
            [
              {"rule": "dns-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 2}, "pve-opt-02": {"priority": 1}},
               "resources": {"vm:150": {}}, "strict": 1,
               "comment": "keep dns off nas"},
              {"rule": "legacy-affinity", "type": "node-affinity",
               "nodes": {"pve-opt-01": {"priority": 0}},
               "resources": {"vm:900": {}}, "strict": 0}
            ]
        - name: ha_config_list
          content: |
            vm:150
              state started
              max_restart 3
              max_relocate 3
            ct:900
              state started
      loop_control:
        label: "{{ item.name }}"

    - name: U — run role against uncodified live state
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
      vars:
        proxmox_ha_rules: "{{ test_ha_rules_prio }}"
        proxmox_ha_resources: "{{ test_ha_resources }}"

    - name: U — record the unmanaged reports
      ansible.builtin.set_fact:
        unmanaged_rule_ids: "{{ proxmox_ha_unmanaged_rule_ids | default([]) }}"
        unmanaged_resource_sids: "{{ proxmox_ha_unmanaged_resource_sids | default([]) }}"

    - name: U — count ha-manager mutations
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^ha-manager ' /tmp/molecule-stub-state/ha-manager.log || true)
        echo "{\"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_u
      changed_when: false

    # CASE V — a failed `pvesr list` must ABORT: read as "no jobs exist" it
    # would fire create-local-job for every job, and the tolerated
    # "already exists" would hide that behind a green play.
    - name: V — reset log and make the pvesr read fail
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesr.log, content: ""}
        - {name: pvesh_replication_fail, content: "1\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: V — run replication tasks against a failing read
      tags: [molecule-idempotence-notest]
      block:
        - name: V — include replication (expected to fail)
          ansible.builtin.include_role:
            name: weisssrv.infra.proxmox_ha
            tasks_from: replication
          vars:
            proxmox_ha_replication_jobs: "{{ test_replication_jobs }}"
        - name: V — failed read did not abort
          ansible.builtin.set_fact:
            pvesr_read_failure_aborted: false
      rescue:
        - name: V — failed read aborted as expected
          ansible.builtin.set_fact:
            pvesr_read_failure_aborted: true

    - name: V — count pvesr mutations and restore the stub
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^pvesr ' /tmp/molecule-stub-state/pvesr.log || true)
        rm -f /tmp/molecule-stub-state/pvesh_replication_fail
        echo "{\"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_v
      changed_when: false

    - name: Capture HA contract results
      ansible.builtin.copy:
        dest: /tmp/molecule-results/ha-contract.json
        mode: "0644"
        content: |
          {"a_add": {{ (case_a.stdout | from_json).add_calls }},
           "a_set": {{ (case_a.stdout | from_json).set_calls }},
