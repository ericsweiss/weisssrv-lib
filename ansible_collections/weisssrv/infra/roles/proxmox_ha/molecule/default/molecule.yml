---
platforms:
  - name: proxmox-ha-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
    groups:
      - proxmox
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        proxmox_ha_rules: []
        proxmox_ha_replication_jobs: []
        proxmox_ha_resources: []
  config_options:
    defaults:
      remote_tmp: /tmp/ansible-tmp
scenario:
  # No `idempotence` step: converge deliberately drives add/set/delete paths
  # case by case, so a second converge is expected to report changes. The
  # no-churn contract is asserted in-scenario instead (cases B, C2b, E, E2,
  # L, M all require ZERO stub mutations).
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
