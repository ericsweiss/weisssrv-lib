---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    # Contract-test harness, modelled on proxmox_vm/molecule/default. The
    # Proxmox CLIs (ha-manager, pvesr, qm, pct, pvecm) are stubbed in
    # /usr/local/bin. Mutating subcommands LOG every invocation to a log file
    # under /tmp/molecule-stub-state; read-only subcommands answer from
    # configurable state files in the same directory so converge can simulate
    # "absent" / "already correct" / "drifted" without real Proxmox state.
    - name: Stub state directory
      ansible.builtin.file:
        path: /tmp/molecule-stub-state
        state: directory
        mode: "0755"
      become: true

    # Configurable current state (defaults: nothing present)
    # Full `ha-manager config` index: a "<type>:<vmid>" line per resource plus
    # that resource's indented properties. Empty => every resource is absent
    # and `ha-manager add` is expected. Converge overwrites this per case.
    - name: Default HA resource index to empty
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/ha_config_list
        content: ""
        mode: "0644"
      become: true

    # `pvesr list --output-format json` payload. Empty array => no jobs exist
    # so a desired job triggers `pvesr create-local-job`.
    - name: Default replication job list to empty JSON array
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/pvesr_list
        content: "[]\n"
        mode: "0644"
      become: true

    # VMIDs reported by `qm list` (one per line). Replication job creation is
    # gated on the VMID residing locally, so this must list the configured
    # source VMIDs for the create/update paths to fire.
    - name: Default local VMID list (qm) to the replication source VMID
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm_vmids
        content: "150\n"
        mode: "0644"
      become: true

    # `pvesh get /cluster/options` payload. Defaults to an already-pinned
    # migration channel so the cases that assert "no mutations" are not
    # perturbed; the datacenter cases overwrite it.
    - name: Default datacenter options to a pinned secure migration channel
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/pvesh_cluster_options
        content: |
          {"keyboard": "en-us", "migration": {"type": "secure"}}
        mode: "0644"
      become: true

    # Stub binaries
    - name: Pvecm stub (always quorate)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvecm
        mode: "0755"
        content: |
          #!/bin/bash
          if [ "$1" = "status" ]; then
            echo "Cluster information"
            echo "Name:             weisssrv"
            echo "Quorate:          Yes"
            exit 0
          fi
          exit 0
      become: true

    # ha-manager: logs every mutating call (add/set/remove/rules *) to
    # ha-manager.log; answers read-only subcommands from state files.
    - name: Ha-manager stub (logs mutations, answers from state)
      ansible.builtin.copy:
        dest: /usr/local/bin/ha-manager
        mode: "0755"
        content: |
          #!/bin/bash
          STATE=/tmp/molecule-stub-state
          LOG="$STATE/ha-manager.log"
          if [ "$1" = "config" ]; then
            # Real PVE `config` takes NO positional resource id — it prints the
            # whole index and rejects an argument. Model that so a role that
            # asks per-SID fails the contract instead of silently no-op'ing.
            if [ -n "$2" ]; then
              echo "Unknown option: $2" >&2
              exit 255
            fi
            cat "$STATE/ha_config_list" 2>/dev/null
            exit 0
          fi
          if [ "$1 $2" = "rules list" ]; then
            # rules.yml passes `--output-format=json`; emit configurable rules.
            cat "$STATE/ha_rules_list" 2>/dev/null || echo "[]"
            exit 0
          fi
          # Everything else (add/set/remove/rules add/rules set/rules remove)
          # is a mutation: record it.
          echo "ha-manager $*" >> "$LOG"
          exit 0
      become: true

    # pvesr: logs every mutating call; answers `list` from state.
    - name: Pvesr stub (logs mutations, answers list from state)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvesr
        mode: "0755"
        content: |
          #!/bin/bash
          STATE=/tmp/molecule-stub-state
          LOG="$STATE/pvesr.log"
          if [ "$1" = "list" ]; then
            cat "$STATE/pvesr_list" 2>/dev/null || echo "[]"
            exit 0
          fi
          echo "pvesr $*" >> "$LOG"
          exit 0
      become: true

    # qm: `list` reports configurable local VMIDs (header + one row per id).
    - name: Qm stub (configurable local VMIDs)
      ansible.builtin.copy:
        dest: /usr/local/bin/qm
        mode: "0755"
        content: |
          #!/bin/bash
          STATE=/tmp/molecule-stub-state
          if [ "$1" = "list" ]; then
            echo "      VMID NAME                 STATUS"
            while read -r vmid; do
              [ -z "$vmid" ] && continue
              printf '       %s test-vm             running\n' "$vmid"
            done < "$STATE/qm_vmids" 2>/dev/null
            exit 0
          fi
          exit 0
      become: true

    # pvesh: answers `get /cluster/options` from state; logs every mutation.
    - name: Pvesh stub (logs mutations, answers cluster options from state)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvesh
        mode: "0755"
        content: |
          #!/bin/bash
          STATE=/tmp/molecule-stub-state
          if [ "$1" = "get" ] && [ "$2" = "/cluster/options" ]; then
            cat "$STATE/pvesh_cluster_options" 2>/dev/null || echo "{}"
            exit 0
          fi
          echo "pvesh $*" >> "$STATE/pvesh.log"
          exit 0
      become: true

    - name: Pct stub (no containers locally)
      ansible.builtin.copy:
        dest: /usr/local/bin/pct
        mode: "0755"
        content: |
          #!/bin/bash
          if [ "$1" = "list" ]; then
            echo "VMID       Status     Name"
            exit 0
          fi
          exit 0
      become: true
