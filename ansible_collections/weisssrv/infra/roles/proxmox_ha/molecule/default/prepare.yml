---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    # Contract-test harness: the Proxmox CLIs are stubbed in /usr/local/bin.
    # Mutating subcommands log to /tmp/molecule-stub-state; read-only ones
    # answer from state files there, so converge can simulate any state.
    - name: Stub state directory
      ansible.builtin.file:
        path: /tmp/molecule-stub-state
        state: directory
        mode: "0755"
      become: true

    # Full `ha-manager config` index: a "<type>:<vmid>" line per resource plus
    # its indented properties. Empty means every resource is absent. Converge
    # overwrites this per case.
    - name: Default HA resource index to empty
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/ha_config_list
        content: ""
        mode: "0644"
      become: true

    # `pvesh get /cluster/replication` payload. Empty array => no jobs exist
    # so a desired job triggers `pvesr create-local-job`.
    - name: Default replication job index to empty JSON array
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/pvesh_replication
        content: "[]\n"
        mode: "0644"
      become: true

    # VMIDs reported by `qm list` (one per line). Replication job creation is
    # gated on the VMID residing locally, so this must list the configured
    # source VMIDs for the create/update paths to fire.
    - name: Default local VMID list (qm) to the replication source VMID
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/qm_vmids
        content: "150\n"
        mode: "0644"
      become: true

    # `pvesh get /cluster/options` payload. Defaults to an already-pinned
    # migration channel so the cases that assert "no mutations" are not
    # perturbed; the datacenter cases overwrite it.
    - name: Default datacenter options to a pinned secure migration channel
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/pvesh_cluster_options
        content: |
          {"keyboard": "en-us", "migration": {"type": "secure"}}
        mode: "0644"
      become: true

    # Stub binaries
    - name: Pvecm stub (always quorate)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvecm
        mode: "0755"
        content: |
          #!/bin/bash
          if [ "$1" = "status" ]; then
            echo "Cluster information"
            echo "Name:             weisssrv"
            echo "Quorate:          Yes"
            exit 0
          fi
          exit 0
      become: true

    # ha-manager: logs every mutating call (add/set/remove/rules *) to
    # ha-manager.log; answers read-only subcommands from state files.
    - name: Ha-manager stub (logs mutations, answers from state)
      ansible.builtin.copy:
        dest: /usr/local/bin/ha-manager
        mode: "0755"
        content: |
          #!/bin/bash
          STATE=/tmp/molecule-stub-state
          LOG="$STATE/ha-manager.log"
          if [ "$1" = "config" ]; then
            # Real PVE `config` takes NO positional resource id — it prints the
            # whole index and rejects an argument. Model that so a role that
            # asks per-SID fails the contract instead of silently no-op'ing.
            if [ -n "$2" ]; then
              echo "Unknown option: $2" >&2
              exit 255
            fi
            cat "$STATE/ha_config_list" 2>/dev/null
            exit 0
          fi
          if [ "$1 $2" = "rules list" ]; then
            # rules.yml passes `--output-format=json`; emit configurable rules.
            cat "$STATE/ha_rules_list" 2>/dev/null || echo "[]"
            exit 0
          fi
          # Everything else (add/set/remove/rules add/rules set/rules remove)
          # is a mutation: record it.
          echo "ha-manager $*" >> "$LOG"
          exit 0
      become: true

    # pvesr: logs every mutating call; `list` models the real CLI's options.
    # pvesr_create_reject holds the stderr a logged create-local-job fails with.
    # A delete only marks a job for removal, so a create of an indexed id fails.
    - name: Pvesr stub (logs mutations, rejects --output-format on list)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvesr
        mode: "0755"
        content: |
          #!/bin/bash
          STATE=/tmp/molecule-stub-state
          LOG="$STATE/pvesr.log"
          if [ "$1" = "list" ]; then
            # Real `pvesr list` has NO --output-format on any PVE release, so a
            # role asking it for JSON fails the contract instead of reading an
            # empty index out of a text table.
            for arg in "$@"; do
              case "$arg" in
                --output-format*)
                  echo "Unknown option: output-format" >&2
                  exit 255
                  ;;
              esac
            done
            echo "JobID            Target            Schedule"
            exit 0
          fi
          echo "pvesr $*" >> "$LOG"
          if [ "$1" = "create-local-job" ] && [ -f "$STATE/pvesr_create_reject" ]; then
            cat "$STATE/pvesr_create_reject" >&2
            exit 255
          fi
          if [ "$1" = "create-local-job" ] && python3 -c '
          import json, sys
          ids = {job["id"] for job in json.load(open(sys.argv[2]))}
          sys.exit(0 if sys.argv[1] in ids else 1)
          ' "$2" "$STATE/pvesh_replication" 2>/dev/null; then
            echo "replication job '$2' already exists" >&2
            exit 255
          fi
          exit 0
      become: true

    # qm: `list` reports configurable local VMIDs (header + one row per id).
    # qm_list_fail makes it fail as it does with pve-cluster down.
    - name: Qm stub (configurable local VMIDs)
      ansible.builtin.copy:
        dest: /usr/local/bin/qm
        mode: "0755"
        content: |
          #!/bin/bash
          STATE=/tmp/molecule-stub-state
          if [ "$1" = "list" ] && [ -f "$STATE/qm_list_fail" ]; then
            echo "ipcc_send_rec[1] failed: Connection refused" >&2
            exit 1
          fi
          if [ "$1" = "list" ]; then
            echo "      VMID NAME                 STATUS"
            while read -r vmid; do
              [ -z "$vmid" ] && continue
              printf '       %s test-vm             running\n' "$vmid"
            done < "$STATE/qm_vmids" 2>/dev/null
            exit 0
          fi
          exit 0
      become: true

    # pvesh: answers the cluster-options and replication reads from state;
    # logs every mutation.
    - name: Pvesh stub (logs mutations, answers reads from state)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvesh
        mode: "0755"
        content: |
          #!/bin/bash
          STATE=/tmp/molecule-stub-state
          if [ "$1" = "get" ] && [ "$2" = "/cluster/options" ]; then
            cat "$STATE/pvesh_cluster_options" 2>/dev/null || echo "{}"
            exit 0
          fi
          if [ "$1" = "get" ] && [ "$2" = "/cluster/replication" ]; then
            # A read failure (non-quorate cluster, API error) must abort the
            # reconcile, never read as "no jobs exist".
            if [ -f "$STATE/pvesh_replication_fail" ]; then
              echo "cluster not ready - no quorum?" >&2
              exit 2
            fi
            cat "$STATE/pvesh_replication" 2>/dev/null || echo "[]"
            exit 0
          fi
          echo "pvesh $*" >> "$STATE/pvesh.log"
          exit 0
      become: true

    - name: Pct stub (no containers locally)
      ansible.builtin.copy:
        dest: /usr/local/bin/pct
        mode: "0755"
        content: |
          #!/bin/bash
          if [ "$1" = "list" ]; then
            echo "VMID       Status     Name"
            exit 0
          fi
          exit 0
      become: true
