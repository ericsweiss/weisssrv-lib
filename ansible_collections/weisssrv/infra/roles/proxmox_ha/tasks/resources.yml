---
# `ha-manager config` takes NO resource argument — it prints the whole index:
# one unindented `<type>:<vmid>` line per resource, followed by that resource's
# indented `key value` properties. Everything below reads that single capture.

# A failed read must abort: treating it as an empty index would fire `add` for
# every resource, whose tolerated "already exists" then hides real drift behind
# a green play.
- name: Get the current HA resource configuration
  ansible.builtin.command: ha-manager config
  register: proxmox_ha_config_raw
  changed_when: false
  failed_when: proxmox_ha_config_raw.rc != 0
  check_mode: false  # Must run to determine current state
  tags: [proxmox_ha_resources]

- name: Index the current HA resources by SID
  vars:
    _blocks: "{{ proxmox_ha_config_raw.stdout | default('') | regex_findall('(?m)^(?:vm|ct):\\S+[^\\n]*(?:\\n[ \\t]+[^\\n]*)*') }}"
  ansible.builtin.set_fact:
    # {"vm:150": "vm:150\n\tstate started\n\tmax_restart 3", ...}
    proxmox_ha_current_resource_config: >-
      {{ dict(_blocks | map('regex_search', '^[^\n]+') | map('trim') | zip(_blocks)) }}
  tags: [proxmox_ha_resources]

- name: Add HA resources
  ansible.builtin.command: >-
    ha-manager add {{ item.type }}:{{ item.vmid }}
    --state {{ item.state | default('started') }}
    {% if item.max_restart is defined %}--max_restart {{ item.max_restart }}{% endif %}
    {% if item.max_relocate is defined %}--max_relocate {{ item.max_relocate }}{% endif %}
    {% if item.comment is defined %}--comment "{{ item.comment }}"{% endif %}
  when:
    - item.type + ':' + (item.vmid | string) not in proxmox_ha_current_resource_config
    - item.enabled | default(true)
  loop: "{{ proxmox_ha_resources }}"
  loop_control:
    label: "{{ item.type }}:{{ item.vmid }}"
  register: proxmox_ha_resource_add_result
  changed_when: proxmox_ha_resource_add_result.rc == 0
  failed_when:
    - proxmox_ha_resource_add_result.rc != 0
    - "'already exists' not in proxmox_ha_resource_add_result.stderr | default('')"
  tags: [proxmox_ha_resources]

- name: Update HA resources
  ansible.builtin.command: >-
    ha-manager set {{ item.type }}:{{ item.vmid }}
    --state {{ item.state | default('started') }}
    {% if item.max_restart is defined %}--max_restart {{ item.max_restart }}{% endif %}
    {% if item.max_relocate is defined %}--max_relocate {{ item.max_relocate }}{% endif %}
    {% if _needs_comment_arg %}--comment "{{ _comment_value }}"{% endif %}
    {% if _delete_keys | length > 0 %}--delete {{ _delete_keys | join(',') }}{% endif %}
  vars:
    _sid: "{{ item.type }}:{{ item.vmid }}"
    # This resource's block from the index above.
    _stdout: "{{ proxmox_ha_current_resource_config[_sid] | default('') }}"
    # state compared as an exact field: a substring search over the whole block
    # would let a comment containing "state started" mask a real state drift.
    _current_state_match: "{{ _stdout | regex_search('(?m)^\\s*state\\s+(\\S+)\\s*$', '\\1') }}"
    _current_state: "{{ _current_state_match[0] | default('') if _current_state_match else '' }}"
    # Numeric values, matched to a whitespace/end-of-line boundary.
    _current_max_restart_match: "{{ _stdout | regex_search('max_restart\\s+(\\d+)(?:\\s|$)', '\\1') }}"
    _current_max_restart: "{{ _current_max_restart_match[0] | default('') if _current_max_restart_match else '' }}"
    _current_max_relocate_match: "{{ _stdout | regex_search('max_relocate\\s+(\\d+)(?:\\s|$)', '\\1') }}"
    _current_max_relocate: "{{ _current_max_relocate_match[0] | default('') if _current_max_relocate_match else '' }}"
    # A comment REMOVED from config is cleared with an explicit --comment ""
    # instead of persisting and re-firing drift forever (same pattern as
    # rules.yml / replication.yml).
    _current_comment_match: "{{ _stdout | regex_search('(?m)^\\s*comment\\s+(.*?)\\s*$', '\\1') }}"
    _current_comment: "{{ _current_comment_match[0] if _current_comment_match else '' }}"
    _needs_comment_arg: "{{ (item.comment is defined) or (_current_comment | length > 0) }}"
    _comment_value: "{{ item.comment | default('') }}"
    # max_restart/max_relocate removed from config but still set live must be
    # unset with --delete; `ha-manager set` only writes options it is given.
    _delete_keys: >-
      {{ (['max_restart'] if (item.max_restart is not defined and _current_max_restart | length > 0) else [])
         + (['max_relocate'] if (item.max_relocate is not defined and _current_max_relocate | length > 0) else []) }}
  when:
    - _sid in proxmox_ha_current_resource_config
    - item.enabled | default(true)
    # Only update on real drift — including a field REMOVED from config that is
    # still set live (comment / max_restart / max_relocate).
    - >-
      _current_state != (item.state | default('started') | string)
      or (item.max_restart is defined and _current_max_restart != (item.max_restart | string))
      or (item.max_relocate is defined and _current_max_relocate != (item.max_relocate | string))
      or _current_comment != (item.comment | default('') | string)
      or (item.max_restart is not defined and _current_max_restart | length > 0)
      or (item.max_relocate is not defined and _current_max_relocate | length > 0)
  loop: "{{ proxmox_ha_resources }}"
  loop_control:
    label: "{{ item.type }}:{{ item.vmid }}"
  register: proxmox_ha_resource_update_result
  changed_when: proxmox_ha_resource_update_result.rc == 0
  tags: [proxmox_ha_resources]

- name: Remove HA resources
  ansible.builtin.command: ha-manager remove {{ item.type }}:{{ item.vmid }}
  when:
    - item.type + ':' + (item.vmid | string) in proxmox_ha_current_resource_config
    - not (item.enabled | default(true))
  loop: "{{ proxmox_ha_resources }}"
  loop_control:
    label: "{{ item.type }}:{{ item.vmid }}"
  register: proxmox_ha_resource_remove_result
  changed_when: proxmox_ha_resource_remove_result.rc == 0
  # Tolerate a removal that raced the index read (cf. rules.yml, replication.yml).
  failed_when:
    - proxmox_ha_resource_remove_result.rc != 0
    - "'does not exist' not in (proxmox_ha_resource_remove_result.stderr | default(''))"
    - "'not found' not in (proxmox_ha_resource_remove_result.stderr | default(''))"
  tags: [proxmox_ha_resources]

# Warn-only, matching replication.yml and rules.yml: automatic removal could
# delete a resource someone registered live before it was codified.
- name: Find HA resources present in Proxmox but absent from inventory
  ansible.builtin.set_fact:
    proxmox_ha_unmanaged_resource_sids: >-
      {{ proxmox_ha_current_resource_config.keys() | list
         | difference(proxmox_ha_resources
                      | map(attribute='type') | zip(proxmox_ha_resources | map(attribute='vmid') | map('string'))
                      | map('join', ':') | list) }}
  tags: [proxmox_ha_resources]

- name: Display unmanaged HA resources
  ansible.builtin.debug:
    msg: |
      WARNING: {{ proxmox_ha_unmanaged_resource_sids | length }} HA resource(s) exist in Proxmox
      but are not defined in proxmox_ha_resources: {{ proxmox_ha_unmanaged_resource_sids | join(', ') }}

      Codify them (add an entry with the SAME type/vmid so the role adopts the live
      resource) or remove them manually: ha-manager remove <sid>
  when: proxmox_ha_unmanaged_resource_sids | length > 0
  tags: [proxmox_ha_resources]
