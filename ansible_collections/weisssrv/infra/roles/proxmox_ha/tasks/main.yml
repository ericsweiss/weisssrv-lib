---
- name: Ensure we're running on a Proxmox VE cluster
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups[proxmox_ha_host_group] | default([])
    fail_msg: "This role can only run on hosts in the '{{ proxmox_ha_host_group }}' inventory group"
  tags: [proxmox_ha]

- name: Check if Proxmox cluster is configured
  ansible.builtin.command: pvecm status
  register: proxmox_ha_cluster_status
  changed_when: false
  failed_when: false
  check_mode: false  # Must run even in check mode to validate cluster state
  tags: [proxmox_ha]

- name: Parse quorum status from cluster output
  ansible.builtin.set_fact:
    # Extracts the quorum status from "Quorate:          Yes". YAML 1.1
    # round-trips "Yes" to a bool, so the assert below uses `| bool` to coerce
    # either form back to a real boolean.
    proxmox_ha_cluster_quorate: >-
      {{
        (proxmox_ha_cluster_status.stdout_lines
        | select('search', 'Quorate:')
        | first
        | default('Quorate:'))
        .split(':')[1]
        | trim
      }}
  when: proxmox_ha_cluster_status.rc == 0
  tags: [proxmox_ha]

- name: Ensure Proxmox cluster exists and is quorate
  ansible.builtin.assert:
    that:
      - proxmox_ha_cluster_status.rc == 0
      - proxmox_ha_cluster_quorate | default(false) | bool
    fail_msg: |
      Proxmox cluster is not configured or not quorate.
      Cluster command return code: {{ proxmox_ha_cluster_status.rc }}
      Quorum status: {{ proxmox_ha_cluster_quorate | default('unknown') }}

      HA operations require a quorate cluster (majority of nodes online).
      Check cluster health with: pvecm status
  tags: [proxmox_ha]

# CRITICAL: /etc/pve and the HA config are clustered, so everything below is
# ONE reconcile for the whole cluster, delegated to a node proved reachable.
# Concurrent writes surface as pmxcfs lock failures. run_once + delegate_to is
# the seam, not a done-fact: a per-guest play would skip all but the first.
# Every reconcile below delegates to the result, so each of their tags selects
# this too — `apply` is what carries them onto the included tasks.
- name: Resolve a reachable node for the cluster-wide reconcile
  ansible.builtin.include_tasks:
    file: delegate.yml
    apply:
      tags: [proxmox_ha, proxmox_ha_datacenter, proxmox_ha_rules, proxmox_ha_resources]
  tags: [proxmox_ha, proxmox_ha_datacenter, proxmox_ha_rules, proxmox_ha_resources]

- name: Pin cluster-wide migration options
  ansible.builtin.include_tasks:
    file: datacenter.yml
    apply:
      delegate_to: "{{ _proxmox_ha_delegate }}"
      tags: [proxmox_ha, proxmox_ha_datacenter]
  run_once: true
  when: proxmox_ha_migration_type | default('') | length > 0
  tags: [proxmox_ha, proxmox_ha_datacenter]

- name: Manage HA rules (node-affinity)
  ansible.builtin.include_tasks:
    file: rules.yml
    apply:
      delegate_to: "{{ _proxmox_ha_delegate }}"
      tags: [proxmox_ha, proxmox_ha_rules]
  run_once: true
  when: proxmox_ha_rules is defined and proxmox_ha_rules | length > 0
  tags: [proxmox_ha, proxmox_ha_rules]

- name: Manage HA resources
  ansible.builtin.include_tasks:
    file: resources.yml
    apply:
      delegate_to: "{{ _proxmox_ha_delegate }}"
      tags: [proxmox_ha, proxmox_ha_resources]
  run_once: true
  when: proxmox_ha_resources is defined and proxmox_ha_resources | length > 0
  tags: [proxmox_ha, proxmox_ha_resources]

# Replication is not included here - it must run per source node (tasks_from: replication); see README.
