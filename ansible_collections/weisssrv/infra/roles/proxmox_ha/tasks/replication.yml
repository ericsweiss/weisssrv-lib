---
# ZFS storage replication jobs for Proxmox HA failover, with ids of the form
# <VMID>-<n>. A job's identity is (VMID, target): Proxmox permutes the
# id<->target pairing on migration. The README carries the full policy.

# A failed or empty read aborts the reconcile; the README says why. A cluster
# with no jobs answers `[]`.
- name: Get current storage replication jobs
  ansible.builtin.command: pvesh get /cluster/replication --output-format json
  register: proxmox_ha_current_replication_jobs_raw
  changed_when: false
  failed_when: >-
    proxmox_ha_current_replication_jobs_raw.rc != 0
    or proxmox_ha_current_replication_jobs_raw.stdout | trim | length == 0
  check_mode: false
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Parse current replication jobs
  ansible.builtin.set_fact:
    proxmox_ha_current_replication_jobs: "{{ proxmox_ha_current_replication_jobs_raw.stdout | from_json }}"
    proxmox_ha_current_replication_job_ids: "{{ (proxmox_ha_current_replication_jobs_raw.stdout | from_json) | map(attribute='id') | list }}"
  tags: [proxmox_ha, proxmox_ha_replication]

# The API index also carries guest, jobnum, type and rate; only the keys
# reconciled here are kept. `disable` is present only on a disabled job.
- name: Build detailed current jobs lookup
  ansible.builtin.set_fact:
    proxmox_ha_current_jobs_detail: >-
      {{
        dict(
          proxmox_ha_current_replication_jobs | default([])
          | map(attribute='id')
          | zip(
              proxmox_ha_current_replication_jobs | default([])
              | map('dict2items')
              | map('selectattr', 'key', 'in', ['source', 'target', 'schedule', 'comment', 'disable'])
              | map('items2dict')
            )
        )
      }}
  tags: [proxmox_ha, proxmox_ha_replication]

# `enabled` defaults to true, so the enabled arm is "explicitly enabled" plus
# "no enabled key".
- name: Select the enabled and disabled jobs sourced from this node
  ansible.builtin.set_fact:
    proxmox_ha_desired_jobs: >-
      {{
        (proxmox_ha_replication_jobs | default([])
          | selectattr('source_node', 'equalto', inventory_hostname)
          | selectattr('enabled', 'defined')
          | selectattr('enabled')
          | list)
        +
        (proxmox_ha_replication_jobs | default([])
          | selectattr('source_node', 'equalto', inventory_hostname)
          | rejectattr('enabled', 'defined')
          | list)
      }}
    proxmox_ha_disabled_jobs: >-
      {{
        proxmox_ha_replication_jobs | default([])
        | selectattr('source_node', 'equalto', inventory_hostname)
        | selectattr('enabled', 'defined')
        | rejectattr('enabled')
        | list
      }}
  tags: [proxmox_ha, proxmox_ha_replication]

# A failed qm or pct read aborts: read as "no local guests" it would skip
# every create and update. An empty node is a successful empty read.
- name: Get list of local VMIDs on this node
  ansible.builtin.shell: |
    set -euo pipefail
    qm list | awk 'NR>1 {print $1}'
    pct list | awk 'NR>1 {print $1}'
  args:
    executable: /bin/bash
  register: proxmox_ha_local_vmids_raw
  changed_when: false
  failed_when: proxmox_ha_local_vmids_raw.rc != 0
  check_mode: false
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Parse local VMIDs
  ansible.builtin.set_fact:
    proxmox_ha_local_vmids: "{{ proxmox_ha_local_vmids_raw.stdout_lines | default([]) | map('trim') | select() | list }}"
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Initialize the reconcile tracking
  ansible.builtin.set_fact:
    proxmox_ha_disabled_live_job_ids: []
    proxmox_ha_drifted_job_ids: []
    proxmox_ha_permuted_jobs: []
    proxmox_ha_stale_source_job_ids: []
    proxmox_ha_create_plan: []
    proxmox_ha_reenabled_job_ids: []
    proxmox_ha_orphaned_job_ids: []
    proxmox_ha_misplaced_guest_jobs: []
  tags: [proxmox_ha, proxmox_ha_replication]

# A disabled entry names the live job serving its (VMID, target), whatever id
# that job carries. A target an enabled entry also wants is never removed.
- name: Resolve disabled entries to the live jobs serving their targets
  vars:
    _vmid: "{{ item.id.split('-')[0] }}"
    _enabled_targets: >-
      {{ proxmox_ha_desired_jobs | selectattr('id', 'match', _vmid ~ '-') | map(attribute='target_node') | list }}
    _serving_ids: >-
      {{
        proxmox_ha_current_replication_jobs | default([])
        | selectattr('id', 'match', _vmid ~ '-')
        | selectattr('target', 'defined')
        | selectattr('target', 'equalto', item.target_node)
        | map(attribute='id') | list
      }}
    _removable_ids: "{{ [] if (_enabled_targets | select('equalto', item.target_node) | list) else _serving_ids }}"
  ansible.builtin.set_fact:
    proxmox_ha_disabled_live_job_ids: "{{ (proxmox_ha_disabled_live_job_ids + _removable_ids) | unique }}"
  loop: "{{ proxmox_ha_disabled_jobs }}"
  loop_control:
    label: "{{ item.id }} -> {{ item.target_node }}"
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Drop the disabled entries' jobs from the live index
  ansible.builtin.set_fact:
    proxmox_ha_live_jobs: >-
      {{
        proxmox_ha_current_replication_jobs | default([])
        | rejectattr('id', 'in', proxmox_ha_disabled_live_job_ids)
        | list
      }}
  tags: [proxmox_ha, proxmox_ha_replication]

# A live id on another target is drift only when that target is no longer
# wanted for the guest. A wanted one is a permutation and the job is kept.
# `pvesr update` cannot change a job's target, so drift is deleted and recreated.
- name: Detect target drift and id permutation for each desired job
  vars:
    _vmid: "{{ item.id.split('-')[0] }}"
    _live_matches: "{{ proxmox_ha_live_jobs | selectattr('id', 'equalto', item.id) | list }}"
    _live_target: "{{ (_live_matches | first).target | default('') if (_live_matches | length > 0) else '' }}"
    _desired_vmid_targets: >-
      {{ proxmox_ha_desired_jobs | selectattr('id', 'match', _vmid ~ '-') | map(attribute='target_node') | list }}
    _id_mismatch: >-
      {{
        _vmid in proxmox_ha_local_vmids and
        _live_target | length > 0 and
        _live_target != item.target_node
      }}
  ansible.builtin.set_fact:
    proxmox_ha_drifted_job_ids: >-
      {{
        proxmox_ha_drifted_job_ids + (
          [item.id] if (_id_mismatch | bool and _live_target not in _desired_vmid_targets) else []
        )
      }}
    proxmox_ha_permuted_jobs: >-
      {{
        proxmox_ha_permuted_jobs + (
          [{'id': item.id, 'live_target': _live_target, 'inventory_target': item.target_node}]
          if (_id_mismatch | bool and _live_target in _desired_vmid_targets) else []
        )
      }}
  loop: "{{ proxmox_ha_desired_jobs }}"
  loop_control:
    label: "{{ item.id }}"
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Display jobs with target drift
  ansible.builtin.debug:
    msg: >-
      TARGET DRIFT on {{ inventory_hostname }}: jobs
      {{ proxmox_ha_drifted_job_ids | join(', ') }} point at a target no entry
      wants and will be deleted; each missing target is then created.
  when: proxmox_ha_drifted_job_ids | length > 0
  tags: [proxmox_ha, proxmox_ha_replication]

# Reported once per run: the ids swapped targets but each target is still
# wanted, so every job is kept and its schedule and comment follow its target.
- name: Display permuted replication job ids
  vars:
    _triples: >-
      {{
        proxmox_ha_permuted_jobs | map(attribute='id')
        | zip(proxmox_ha_permuted_jobs | map(attribute='live_target'),
              proxmox_ha_permuted_jobs | map(attribute='inventory_target'))
        | map('join', ' -> ') | list
      }}
  ansible.builtin.debug:
    msg: >-
      ID PERMUTATION on {{ inventory_hostname }} (id -> live target -> inventory
      target): {{ _triples | join(', ') }}. Each target is still wanted, so no job
      is deleted or recreated; schedule and comment follow the live target. See
      proxmox_ha README, "Behaviour worth knowing".
  when: proxmox_ha_permuted_jobs | length > 0
  tags: [proxmox_ha, proxmox_ha_replication]

# A live job sourced elsewhere while the guest is here is reported and kept: the
# PVE runner already runs it from the guest's node, and deleting it would purge
# the replica on its target.
- name: Detect live jobs whose source names another node
  vars:
    _live_matches: "{{ proxmox_ha_live_jobs | selectattr('id', 'equalto', item.id) | list }}"
    _live_source: "{{ (_live_matches | first).source | default('') if (_live_matches | length > 0) else '' }}"
  ansible.builtin.set_fact:
    proxmox_ha_stale_source_job_ids: >-
      {{
        proxmox_ha_stale_source_job_ids + (
          [item.id] if (
            _live_source | length > 0 and
            _live_source != inventory_hostname and
            item.id not in proxmox_ha_drifted_job_ids and
            item.id.split('-')[0] in proxmox_ha_local_vmids
          ) else []
        )
      }}
  loop: "{{ proxmox_ha_desired_jobs }}"
  loop_control:
    label: "{{ item.id }}"
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Display jobs with source drift
  ansible.builtin.debug:
    msg: >-
      STALE SOURCE on {{ inventory_hostname }}: jobs
      {{ proxmox_ha_stale_source_job_ids | join(', ') }} name another node as
      their source while the guest is here. The PVE runner already runs them
      from the guest's node, so they are kept.
  when: proxmox_ha_stale_source_job_ids | length > 0
  tags: [proxmox_ha, proxmox_ha_replication]

# One delete pass for every reason, before the create pass: job ids are
# cluster-unique.
- name: Delete the disabled and target-drifted replication jobs
  ansible.builtin.command:
    argv: [pvesr, delete, "{{ item[0] }}"]
  loop: >-
    {{ (proxmox_ha_disabled_live_job_ids | product(['disabled entry']) | list)
       + (proxmox_ha_drifted_job_ids | product(['target drift']) | list) }}
  loop_control:
    label: "{{ item[0] }} ({{ item[1] }})"
  register: proxmox_ha_replication_job_delete_result
  changed_when: proxmox_ha_replication_job_delete_result.rc == 0
  failed_when:
    - proxmox_ha_replication_job_delete_result.rc != 0
    - "'does not exist' not in proxmox_ha_replication_job_delete_result.stderr | default('')"
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Keep the live jobs the delete pass left
  ansible.builtin.set_fact:
    proxmox_ha_kept_jobs: >-
      {{
        proxmox_ha_live_jobs
        | rejectattr('id', 'in', proxmox_ha_drifted_job_ids)
        | list
      }}
  tags: [proxmox_ha, proxmox_ha_replication]

# One create per wanted target no kept job serves. The entry's id is used when
# free, otherwise the lowest free <VMID>-<n>. `pvesr delete` only marks a job
# for removal, so every id in the pre-delete index counts as taken.
- name: Plan the replication jobs to create
  vars:
    _vmid: "{{ item.id.split('-')[0] }}"
    _served: >-
      {{
        (proxmox_ha_kept_jobs | selectattr('id', 'match', _vmid ~ '-')
          | selectattr('target', 'defined') | map(attribute='target') | list)
        + (proxmox_ha_create_plan | selectattr('id', 'match', _vmid ~ '-')
          | map(attribute='target_node') | list)
      }}
    _taken: >-
      {{ proxmox_ha_current_replication_job_ids + (proxmox_ha_create_plan | map(attribute='id') | list) }}
    _free_ids: >-
      {{ range(0, 100) | map('string') | map('regex_replace', '^', _vmid ~ '-') | reject('in', _taken) | list }}
    _id: "{{ (_free_ids | first) if (_taken | select('equalto', item.id) | list) else item.id }}"
    _needs_create: >-
      {{ (proxmox_ha_local_vmids | select('equalto', _vmid) | list | length > 0)
         and (_served | select('equalto', item.target_node) | list | length == 0) }}
    _planned: "{{ [item | combine({'id': _id})] if (_needs_create | bool) else [] }}"
  ansible.builtin.set_fact:
    proxmox_ha_create_plan: "{{ proxmox_ha_create_plan + _planned }}"
  loop: "{{ proxmox_ha_desired_jobs }}"
  loop_control:
    label: "{{ item.id }} -> {{ item.target_node }}"
  tags: [proxmox_ha, proxmox_ha_replication]

# `pvesr create-local-job` only runs on the node the guest is on. A create
# never reuses an id pending removal, so only a concurrent run's same-id create
# is tolerated; a create blocked by another job to the same target fails.
- name: Create storage replication jobs
  ansible.builtin.command:
    argv: >-
      {{
        ['pvesr', 'create-local-job', item.id, item.target_node, '--schedule', item.schedule]
        + (['--comment', item.comment] if item.comment is defined else [])
        + (['--disable', '1'] if item.paused | default(false) | bool else [])
      }}
  loop: "{{ proxmox_ha_create_plan }}"
  loop_control:
    label: "{{ item.id }} ({{ item.source_node }} -> {{ item.target_node }})"
  register: proxmox_ha_replication_job_add_result
  changed_when: proxmox_ha_replication_job_add_result.rc == 0
  failed_when:
    - proxmox_ha_replication_job_add_result.rc != 0
    - ("replication job '" ~ item.id ~ "' already exists") not in proxmox_ha_replication_job_add_result.stderr | default('')
  tags: [proxmox_ha, proxmox_ha_replication]

# A live-disabled job whose entry lacks `paused: true` is re-enabled by the
# update pass below; the banner names each one first.
- name: Detect disabled jobs the update pass re-enables
  vars:
    _vmid: "{{ item.id.split('-')[0] }}"
    _serving: >-
      {{
        proxmox_ha_kept_jobs | selectattr('id', 'match', _vmid ~ '-')
        | selectattr('target', 'defined')
        | selectattr('target', 'equalto', item.target_node) | list
      }}
    _job_id: "{{ (_serving | first).id if (_serving | length > 0) else '' }}"
    _is_disabled: "{{ (proxmox_ha_current_jobs_detail.get(_job_id, {}).disable | default(0) | int) != 0 }}"
  ansible.builtin.set_fact:
    proxmox_ha_reenabled_job_ids: >-
      {{
        proxmox_ha_reenabled_job_ids + (
          [_job_id] if (
            _job_id | length > 0 and
            _vmid in proxmox_ha_local_vmids and
            _is_disabled | bool and
            not (item.paused | default(false) | bool)
          ) else []
        )
      }}
  loop: "{{ proxmox_ha_desired_jobs }}"
  loop_control:
    label: "{{ item.id }}"
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Display jobs the update pass re-enables
  ansible.builtin.debug:
    msg: >-
      RE-ENABLE on {{ inventory_hostname }}: jobs
      {{ proxmox_ha_reenabled_job_ids | join(', ') }} are disabled live, but their
      entries carry no `paused: true`, so they get `--disable 0`. Set
      `paused: true` on an entry to keep its job disabled.
  when: proxmox_ha_reenabled_job_ids | length > 0
  tags: [proxmox_ha, proxmox_ha_replication]

# Each entry reconciles the kept job serving its target, whatever id it has, so
# a comment never names a node its job does not replicate to. An empty
# --comment clears a live one; `--disable` follows the entry's `paused`.
- name: Update storage replication jobs
  vars:
    _vmid: "{{ item.id.split('-')[0] }}"
    _serving: >-
      {{
        proxmox_ha_kept_jobs | selectattr('id', 'match', _vmid ~ '-')
        | selectattr('target', 'defined')
        | selectattr('target', 'equalto', item.target_node) | list
      }}
    _job_id: "{{ (_serving | first).id if (_serving | length > 0) else '' }}"
    _current: "{{ proxmox_ha_current_jobs_detail.get(_job_id, {}) }}"
    _desired_comment: "{{ item.comment | default('') }}"
    _current_comment: "{{ _current.comment | default('') }}"
    _needs_comment_arg: "{{ (item.comment is defined) or (_current_comment | length > 0) }}"
    _is_disabled: "{{ (_current.disable | default(0) | int) != 0 }}"
    _want_disabled: "{{ item.paused | default(false) | bool }}"
    _has_drift: >-
      {{ item.schedule != (_current.schedule | default('')) or
         _desired_comment != _current_comment or
         _is_disabled | bool != _want_disabled | bool }}
  ansible.builtin.command:
    argv: >-
      {{
        ['pvesr', 'update', _job_id, '--schedule', item.schedule]
        + (['--comment', _desired_comment] if _needs_comment_arg | bool else [])
        + (['--disable', _want_disabled | bool | ternary('1', '0')]
           if _is_disabled | bool != _want_disabled | bool else [])
      }}
  when:
    - _job_id | length > 0
    - _vmid in proxmox_ha_local_vmids
    - _has_drift | bool
  loop: "{{ proxmox_ha_desired_jobs }}"
  loop_control:
    label: "{{ item.id }} ({{ item.source_node }} -> {{ item.target_node }})"
  register: proxmox_ha_replication_job_update_result
  changed_when: proxmox_ha_replication_job_update_result.rc == 0
  tags: [proxmox_ha, proxmox_ha_replication]

# An orphan is a job sourced here whose (VMID, target) no enabled entry names.
- name: Find orphaned replication jobs on this node
  vars:
    _vmid: "{{ item.id.split('-')[0] }}"
    _wanted: >-
      {{
        proxmox_ha_desired_jobs | selectattr('id', 'match', _vmid ~ '-')
        | selectattr('target_node', 'equalto', item.target | default('')) | list
      }}
  ansible.builtin.set_fact:
    proxmox_ha_orphaned_job_ids: "{{ proxmox_ha_orphaned_job_ids + ([item.id] if _wanted | length == 0 else []) }}"
  loop: >-
    {{ proxmox_ha_kept_jobs | selectattr('source', 'defined') | selectattr('source', 'equalto', inventory_hostname) | list }}
  loop_control:
    label: "{{ item.id }}"
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Display orphaned jobs (if any)
  ansible.builtin.debug:
    msg: >-
      ORPHANED JOBS on {{ inventory_hostname }}:
      {{ proxmox_ha_orphaned_job_ids | join(', ') }} exist in Proxmox but not in
      proxmox_ha_replication_jobs — see proxmox_ha README, "Behaviour worth knowing".
  when: proxmox_ha_orphaned_job_ids | length > 0
  tags: [proxmox_ha, proxmox_ha_replication]

# A job configured here whose guest lives elsewhere cannot run: report only.
- name: Detect source drift for jobs configured on this node
  ansible.builtin.set_fact:
    proxmox_ha_misplaced_guest_jobs: >-
      {{
        proxmox_ha_misplaced_guest_jobs + (
          [{'id': item.id, 'vmid': item.id.split('-')[0], 'configured_source': item.source_node, 'target': item.target_node}]
          if item.id.split('-')[0] not in proxmox_ha_local_vmids else []
        )
      }}
  loop: "{{ proxmox_ha_desired_jobs }}"
  loop_control:
    label: "{{ item.id }}"
  tags: [proxmox_ha, proxmox_ha_replication]

- name: Display source drift warning
  ansible.builtin.debug:
    msg: >-
      SOURCE DRIFT: guests
      {{ proxmox_ha_misplaced_guest_jobs | map(attribute='vmid') | unique | join(', ') }}
      are not on {{ inventory_hostname }}; jobs
      {{ proxmox_ha_misplaced_guest_jobs | map(attribute='id') | join(', ') }}
      cannot run — see proxmox_ha README, "Behaviour worth knowing".
  when: proxmox_ha_misplaced_guest_jobs | length > 0
  tags: [proxmox_ha, proxmox_ha_replication]
