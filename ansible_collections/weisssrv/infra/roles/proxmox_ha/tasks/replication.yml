---
# Manage ZFS storage replication jobs (IDs are <VMID>-<job_number>) for Proxmox
# HA failover. Each guest may replicate to several targets so it can fail over
# to any available node.
#
# Drift handling turns on one Proxmox behaviour: it PERMUTES job-ID<->target
# pairings when a guest migrates.
# 1. Target drift = the desired target SET differs from the live set; only then
#    are the per-ID mismatches deleted+recreated, and only while the guest is
#    local so a job that can't be recreated here is never deleted. Equal sets
#    with permuted IDs are NOT drift — churning those forces a full ZFS resync
#    per target for nothing.
# 2. Source drift (guest migrated, jobs left on the old node) is flagged, not
#    corrected.
#
# For the same reason a job's --comment may name a stale target: read the live
# target from `pvesr list`, never from the comment.

- name: Get current storage replication jobs
  ansible.builtin.shell: pvesr list --output-format json 2>/dev/null || echo '[]'
  register: proxmox_ha_current_replication_jobs_raw
  changed_when: false
  failed_when: false
  check_mode: false  # Must run to determine current state
  tags: [proxmox_ha_replication]

- name: Parse current replication jobs
  ansible.builtin.set_fact:
    proxmox_ha_current_replication_jobs: "{{ proxmox_ha_current_replication_jobs_raw.stdout | from_json }}"
    proxmox_ha_current_replication_job_ids: "{{ (proxmox_ha_current_replication_jobs_raw.stdout | from_json) | map(attribute='id') | list }}"
  when: proxmox_ha_current_replication_jobs_raw.stdout != '' and proxmox_ha_current_replication_jobs_raw.rc == 0
  tags: [proxmox_ha_replication]

- name: Set empty list if no jobs exist
  ansible.builtin.set_fact:
    proxmox_ha_current_replication_jobs: []
    proxmox_ha_current_replication_job_ids: []
  when: proxmox_ha_current_replication_jobs_raw.stdout == '' or proxmox_ha_current_replication_jobs_raw.rc != 0
  tags: [proxmox_ha_replication]

- name: Build detailed current jobs lookup
  ansible.builtin.set_fact:
    proxmox_ha_current_jobs_detail: >-
      {{
        dict(
          proxmox_ha_current_replication_jobs | default([])
          | map(attribute='id')
          | zip(
              proxmox_ha_current_replication_jobs | default([])
              | map('dict2items')
              | map('selectattr', 'key', 'in', ['source', 'target', 'schedule', 'comment'])
              | map('items2dict')
            )
        )
      }}
  tags: [proxmox_ha_replication]

# The enabled jobs sourced from this node, selected once and reused by every
# pass below. `enabled` defaults to true, so the two arms are "explicitly
# enabled" plus "no enabled key".
- name: Select the enabled jobs sourced from this node
  ansible.builtin.set_fact:
    proxmox_ha_desired_jobs: >-
      {{
        (proxmox_ha_replication_jobs | default([])
          | selectattr('source_node', 'equalto', inventory_hostname)
          | selectattr('enabled', 'defined')
          | selectattr('enabled')
          | list)
        +
        (proxmox_ha_replication_jobs | default([])
          | selectattr('source_node', 'equalto', inventory_hostname)
          | rejectattr('enabled', 'defined')
          | list)
      }}
  tags: [proxmox_ha_replication]

- name: Build list of desired job IDs for this node
  ansible.builtin.set_fact:
    proxmox_ha_desired_job_ids: "{{ proxmox_ha_desired_jobs | map(attribute='id') | list }}"
  tags: [proxmox_ha_replication]

- name: Get list of local VMIDs on this node
  ansible.builtin.shell: |
    set -o pipefail
    (qm list 2>/dev/null | awk 'NR>1 {print $1}') || true
    (pct list 2>/dev/null | awk 'NR>1 {print $1}') || true
  args:
    executable: /bin/bash
  register: proxmox_ha_local_vmids_raw
  changed_when: false
  failed_when: false
  check_mode: false  # Must run to determine current state
  tags: [proxmox_ha_replication]

- name: Parse local VMIDs
  ansible.builtin.set_fact:
    proxmox_ha_local_vmids: "{{ proxmox_ha_local_vmids_raw.stdout_lines | default([]) | map('trim') | select() | list }}"
  tags: [proxmox_ha_replication]

# `pvesr update` cannot change a job's target: delete and recreate.
- name: Initialize target-drift tracking
  ansible.builtin.set_fact:
    proxmox_ha_drifted_job_ids: []
  tags: [proxmox_ha_replication]

- name: Detect target drift for each desired job
  vars:
    _vmid: "{{ item.id.split('-')[0] }}"
    # Desired vs live target SETS for this job's VMID: a per-ID mismatch is
    # only real drift when the sets differ (see the file header).
    _desired_vmid_targets: >-
      {{
        proxmox_ha_desired_jobs
        | selectattr('id', 'match', _vmid ~ '-')
        | map(attribute='target_node') | sort | list
      }}
    _current_vmid_targets: >-
      {{
        proxmox_ha_current_replication_jobs | default([])
        | selectattr('id', 'match', _vmid ~ '-')
        | selectattr('target', 'defined')
        | map(attribute='target')
        | map('regex_replace', '^.+/', '')
        | sort | list
      }}
  ansible.builtin.set_fact:
    proxmox_ha_drifted_job_ids: >-
      {{
        proxmox_ha_drifted_job_ids | default([]) + (
          [item.id] if (
            item.id in proxmox_ha_current_replication_job_ids and
            item.source_node == inventory_hostname and
            (item.enabled | default(true)) and
            item.id.split('-')[0] in proxmox_ha_local_vmids and
            proxmox_ha_current_jobs_detail[item.id] is defined and
            proxmox_ha_current_jobs_detail[item.id].target is defined and
            proxmox_ha_current_jobs_detail[item.id].target | regex_replace('^.+/', '') != item.target_node and
            _desired_vmid_targets != _current_vmid_targets
          ) else []
        )
      }}
  loop: "{{ proxmox_ha_replication_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  tags: [proxmox_ha_replication]

- name: Display jobs with target drift
  ansible.builtin.debug:
    msg: |
      Found {{ proxmox_ha_drifted_job_ids | length }} replication job(s) with TARGET DRIFT on {{ inventory_hostname }}:
      {% for job_id in proxmox_ha_drifted_job_ids %}
      {% set desired = (proxmox_ha_replication_jobs | selectattr('id', 'equalto', job_id) | first).target_node %}
      - {{ job_id }}: current={{ proxmox_ha_current_jobs_detail[job_id].target }}, desired={{ desired }}
      {% endfor %}

      These jobs will be deleted and recreated to correct the target node.
  when: proxmox_ha_drifted_job_ids | length > 0
  tags: [proxmox_ha_replication]

- name: Delete replication jobs with target drift
  ansible.builtin.command: pvesr delete {{ item }}
  loop: "{{ proxmox_ha_drifted_job_ids | default([]) }}"
  loop_control:
    label: "{{ item }} (target drift correction)"
  register: proxmox_ha_drift_delete_result
  changed_when: proxmox_ha_drift_delete_result.rc == 0
  failed_when:
    - proxmox_ha_drift_delete_result.rc != 0
    - "'does not exist' not in proxmox_ha_drift_delete_result.stderr | default('')"
  tags: [proxmox_ha_replication]

- name: Initialize source drift tracking
  ansible.builtin.set_fact:
    proxmox_ha_source_drifted_job_ids: []
  tags: [proxmox_ha_replication]

- name: Detect source drift requiring job deletion
  ansible.builtin.set_fact:
    proxmox_ha_source_drifted_job_ids: >-
      {{
        proxmox_ha_source_drifted_job_ids | default([]) + (
          [item.id] if (
            item.id in proxmox_ha_current_replication_job_ids and
            item.source_node == inventory_hostname and
            (item.enabled | default(true)) and
            proxmox_ha_current_jobs_detail[item.id] is defined and
            proxmox_ha_current_jobs_detail[item.id].source is defined and
            proxmox_ha_current_jobs_detail[item.id].source != item.source_node and
            item.id.split('-')[0] in proxmox_ha_local_vmids
          ) else []
        )
      }}
  loop: "{{ proxmox_ha_replication_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  tags: [proxmox_ha_replication]

- name: Display jobs with source drift
  ansible.builtin.debug:
    msg: |
      Found {{ proxmox_ha_source_drifted_job_ids | length }} replication job(s) with SOURCE DRIFT on {{ inventory_hostname }}:
      {% for job_id in proxmox_ha_source_drifted_job_ids %}
      {% set old_source = proxmox_ha_current_jobs_detail[job_id].source %}
      - {{ job_id }}: currently on {{ old_source }}, should be on {{ inventory_hostname }}
      {% endfor %}

      These old jobs will be deleted so new jobs can be created on this node.
  when: proxmox_ha_source_drifted_job_ids | default([]) | length > 0
  tags: [proxmox_ha_replication]

# Must run BEFORE the create pass: job IDs are cluster-unique.
- name: Delete stale replication jobs with source drift
  ansible.builtin.command: pvesr delete {{ item }}
  loop: "{{ proxmox_ha_source_drifted_job_ids | default([]) }}"
  loop_control:
    label: "{{ item }} (source drift correction)"
  register: proxmox_ha_source_drift_delete_result
  changed_when: proxmox_ha_source_drift_delete_result.rc == 0
  failed_when:
    - proxmox_ha_source_drift_delete_result.rc != 0
    - "'does not exist' not in proxmox_ha_source_drift_delete_result.stderr | default('')"
  tags: [proxmox_ha_replication]

# Creates jobs that are absent cluster-wide plus the ones the drift passes above
# just deleted. Gated on the guest residing here: `pvesr create-local-job` can
# only be run from the node the guest is on.
- name: Create storage replication jobs
  ansible.builtin.command: >-
    pvesr create-local-job {{ item.id }} {{ item.target_node }}
    --schedule "{{ item.schedule }}"
    {% if item.comment is defined %}--comment "{{ item.comment }}"{% endif %}
  when:
    - >-
      (item.id not in proxmox_ha_current_replication_job_ids) or
      (item.id in proxmox_ha_drifted_job_ids | default([])) or
      (item.id in proxmox_ha_source_drifted_job_ids | default([]))
    - item.enabled | default(true)
    - inventory_hostname == item.source_node
    - item.id.split('-')[0] in proxmox_ha_local_vmids
  loop: "{{ proxmox_ha_replication_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }} ({{ item.source_node }} -> {{ item.target_node }})"
  register: proxmox_ha_replication_job_add_result
  changed_when: proxmox_ha_replication_job_add_result.rc == 0
  failed_when:
    - proxmox_ha_replication_job_add_result.rc != 0
    - "'already exists' not in proxmox_ha_replication_job_add_result.stderr | default('')"
  tags: [proxmox_ha_replication]

- name: Update storage replication jobs
  vars:
    _current: "{{ proxmox_ha_current_jobs_detail.get(item.id, {}) }}"
    _desired_schedule: "{{ item.schedule }}"
    _desired_comment: "{{ item.comment | default('') }}"
    _current_schedule: "{{ _current.schedule | default('') }}"
    _current_comment: "{{ _current.comment | default('') }}"
    # Only schedule and comment are updatable in place.
    _has_drift: >-
      {{ _desired_schedule != _current_schedule or
         _desired_comment != _current_comment }}
    # An empty --comment is required to CLEAR a comment; omitting it keeps
    # the old one and the drift check never converges.
    _needs_comment_arg: "{{ (item.comment is defined) or (_current_comment | length > 0) }}"
    _comment_value: "{{ item.comment | default('') }}"
  ansible.builtin.command: >-
    pvesr update {{ item.id }}
    --schedule "{{ item.schedule }}"
    {% if _needs_comment_arg %}--comment "{{ _comment_value }}"{% endif %}
  when:
    - item.id in proxmox_ha_current_replication_job_ids
    - item.id not in proxmox_ha_drifted_job_ids | default([])
    - item.id not in proxmox_ha_source_drifted_job_ids | default([])
    - item.enabled | default(true)
    - inventory_hostname == item.source_node
    - item.id.split('-')[0] in proxmox_ha_local_vmids
    - _has_drift | bool
  loop: "{{ proxmox_ha_replication_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }} ({{ item.source_node }} -> {{ item.target_node }})"
  register: proxmox_ha_replication_job_update_result
  changed_when: proxmox_ha_replication_job_update_result.rc == 0
  tags: [proxmox_ha_replication]

- name: Remove disabled storage replication jobs
  ansible.builtin.command: pvesr delete {{ item.id }}
  when:
    - item.id in proxmox_ha_current_replication_job_ids
    - not (item.enabled | default(true))
    - inventory_hostname == item.source_node
  loop: "{{ proxmox_ha_replication_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  register: proxmox_ha_replication_job_remove_result
  changed_when: proxmox_ha_replication_job_remove_result.rc == 0
  failed_when:
    - proxmox_ha_replication_job_remove_result.rc != 0
    - "'does not exist' not in proxmox_ha_replication_job_remove_result.stderr | default('')"
  tags: [proxmox_ha_replication]

# `pvesr list` is cluster-wide; orphan detection considers only jobs this node sources.
- name: Build list of current job IDs originating from this node
  ansible.builtin.set_fact:
    proxmox_ha_current_local_job_ids: >-
      {{
        proxmox_ha_current_replication_jobs | default([])
        | selectattr('source', 'defined')
        | selectattr('source', 'equalto', inventory_hostname)
        | map(attribute='id')
        | list
      }}
  tags: [proxmox_ha_replication]

- name: Find orphaned replication jobs on this node
  ansible.builtin.set_fact:
    proxmox_ha_orphaned_job_ids: "{{ proxmox_ha_current_local_job_ids | default([]) | difference(proxmox_ha_desired_job_ids | default([])) }}"
  tags: [proxmox_ha_replication]

- name: Display orphaned jobs (if any)
  ansible.builtin.debug:
    msg: |
      Found {{ proxmox_ha_orphaned_job_ids | length }} orphaned replication job(s) originating from {{ inventory_hostname }}:
      {{ proxmox_ha_orphaned_job_ids | join(', ') }}

      These jobs exist in Proxmox but are not defined in proxmox_ha_replication_jobs for this node.
      To clean up, manually run: pvesr delete <job_id>
  when: proxmox_ha_orphaned_job_ids | length > 0
  tags: [proxmox_ha_replication]

# Orphan cleanup stays manual on purpose: an incomplete config would otherwise
# delete jobs nobody has codified yet.

# A job configured here whose guest lives elsewhere (post-failover/migration)
# cannot run — report it so the inventory or the guest gets moved back. Job IDs
# are "<VMID>-<n>", so the VMID is the part before the first dash.
- name: Initialize migrated-guest reporting
  ansible.builtin.set_fact:
    proxmox_ha_source_drift_jobs: []
  tags: [proxmox_ha_replication]

- name: Detect source drift for jobs configured on this node
  ansible.builtin.set_fact:
    proxmox_ha_source_drift_jobs: >-
      {{
        proxmox_ha_source_drift_jobs | default([]) + (
          [{'id': item.id, 'vmid': item.id.split('-')[0], 'configured_source': item.source_node, 'target': item.target_node}]
          if (
            item.source_node == inventory_hostname and
            (item.enabled | default(true)) and
            item.id.split('-')[0] not in proxmox_ha_local_vmids
          ) else []
        )
      }}
  loop: "{{ proxmox_ha_replication_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  tags: [proxmox_ha_replication]

- name: Display source drift warning
  ansible.builtin.debug:
    msg: |
      WARNING: SOURCE DRIFT DETECTED on {{ inventory_hostname }}

      The following replication jobs are configured for this node, but the VMs/CTs
      are NOT present here. This typically happens after HA failover or manual migration.

      {% for job in proxmox_ha_source_drift_jobs %}
      - Job {{ job.id }}: VMID {{ job.vmid }} is NOT on {{ inventory_hostname }}
        Configured: {{ job.configured_source }} -> {{ job.target }}
      {% endfor %}

      ACTION REQUIRED:
      1. Determine where VMID(s) {{ proxmox_ha_source_drift_jobs | map(attribute='vmid') | unique | join(', ') }} currently reside
      2. In the inventory's proxmox_ha_replication_jobs:
         - Change source_node to the node where the VM currently runs
         - OR migrate the VM back to the configured source_node
      3. Re-run this role to reconcile

      NOTE: Replication jobs can only be created/managed on the node where the VM resides.
  when: proxmox_ha_source_drift_jobs | length > 0
  tags: [proxmox_ha_replication]

- name: Detect jobs running from unexpected source nodes
  ansible.builtin.set_fact:
    proxmox_ha_unexpected_source_jobs: >-
      {{
        proxmox_ha_current_replication_jobs | default([])
        | selectattr('source', 'defined')
        | selectattr('source', 'ne', inventory_hostname)
        | map(attribute='id')
        | select('in', proxmox_ha_desired_job_ids)
        | list
      }}
  tags: [proxmox_ha_replication]

- name: Display unexpected source warning
  ansible.builtin.debug:
    msg: |
      INFO: Found {{ proxmox_ha_unexpected_source_jobs | length }} job(s) that are configured for {{ inventory_hostname }}
      but are currently running from a DIFFERENT source node:

      {% for job_id in proxmox_ha_unexpected_source_jobs %}
      {% set actual = (proxmox_ha_current_replication_jobs | selectattr('id', 'equalto', job_id) | first).source %}
      - {{ job_id }}: Running from {{ actual }}, configured for {{ inventory_hostname }}
      {% endfor %}

      This indicates the VM has migrated. The jobs are working but config is out of sync.
      Consider updating proxmox_ha_replication_jobs source_node to match reality.
  when: proxmox_ha_unexpected_source_jobs | length > 0
  tags: [proxmox_ha_replication]
