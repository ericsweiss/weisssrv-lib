---
# Scoped to the docker platform: the rendered cluster.fw / host.fw / guest
# <vmid>.fw files live on its filesystem, which the local-connection inventory
# entries cannot see.
- name: Verify
  hosts: proxmox-firewall-test
  become: true
  gather_facts: true
  vars:
    cluster_fw: /tmp/pve-firewall-test/firewall/cluster.fw
    host_fw: /tmp/pve-firewall-test/nodes/proxmox-firewall-test/host.fw
    # vmid 100 matches the docker platform's host_vars in molecule.yml.
    guest_fw: /tmp/pve-firewall-test/firewall/100.fw
  tasks:
    - name: Cluster.fw exists
      ansible.builtin.stat:
        path: "{{ cluster_fw }}"
      register: cluster_fw_stat
      failed_when: not cluster_fw_stat.stat.exists

    - name: Read cluster.fw
      ansible.builtin.slurp:
        src: "{{ cluster_fw }}"
      register: cluster_fw_content

    - name: Decode cluster.fw
      ansible.builtin.set_fact:
        cluster_fw_text: "{{ cluster_fw_content.content | b64decode }}"

    # Index cluster.fw by section header ("group sg-dns", "IPSET pve_hosts", …)
    # so a rule or address is asserted to be in the RIGHT section: a bare
    # substring test passes even when every rule inside a group is gone.
    - name: Index cluster.fw sections by header
      ansible.builtin.set_fact:
        cluster_fw_sections: >-
          {{ dict(cluster_fw_text | regex_findall('^\[([^\]]+)\]\n([\s\S]*?)(?=^\[|\Z)', multiline=True)) }}

    - name: Cluster.fw has [OPTIONS] + default policies + built-in IPSets
      ansible.builtin.assert:
        that:
          - "'[OPTIONS]' in cluster_fw_text"
          - "'enable: 1' in cluster_fw_text"
          - "'policy_in: DROP' in cluster_fw_text"
          - "'policy_out: ACCEPT' in cluster_fw_text"
          - "'[IPSET admin_lan]' in cluster_fw_text"
          - "'[IPSET admin_ts]' in cluster_fw_text"
          - "'[IPSET smb_clients]' in cluster_fw_text"

    # Line-anchored, not substring: a glued `[ALIASES]dns-01 …` line satisfies
    # every substring test while pve-firewall will not parse it. Asserting each
    # alias is a whole line of the section also catches two glued aliases.
    - name: Cluster.fw renders inventory-derived and extra aliases, each on its own line
      vars:
        alias_lines: "{{ (cluster_fw_sections.get('ALIASES', '') | trim).splitlines() | map('trim') | list }}"
      ansible.builtin.assert:
        that:
          - "'ALIASES' in cluster_fw_sections"
          - "cluster_fw_text | regex_findall('^\\[ALIASES\\]$', multiline=True) | length == 1"
          - "'dns-01 192.168.0.150 # Primary DNS server' in alias_lines"
          - "'api-vip 192.168.0.161 # k3s API VIP' in alias_lines"
        fail_msg: >-
          [ALIASES] must be a parsable section — the header alone on its own
          line — carrying the alias derived from dns-01's firewall_alias and the
          non-host entry from proxmox_firewall_extra_aliases, one per line.

    # Role-owned groups: assert the RULE LINES, not just the headers. Emptying a
    # group, or widening a source to 0.0.0.0/0, must fail here.
    - name: Cluster.fw role-owned groups carry their rules
      vars:
        sg_dns: "{{ cluster_fw_sections.get('group sg-dns', '') }}"
        sg_host_admin: "{{ cluster_fw_sections.get('group sg-host-admin', '') }}"
        sg_metrics: "{{ cluster_fw_sections.get('group sg-metrics', '') }}"
        sg_ingress_int: "{{ cluster_fw_sections.get('group sg-k3s-ingress-int', '') }}"
        sg_ingress_pub: "{{ cluster_fw_sections.get('group sg-k3s-ingress-pub', '') }}"
        sg_pve_cluster: "{{ cluster_fw_sections.get('group sg-pve-cluster', '') }}"
        sg_smtp_relay: "{{ cluster_fw_sections.get('group sg-smtp-relay', '') }}"
      ansible.builtin.assert:
        that:
          # sg-smtp-relay ships with the library and is source-scoped to
          # proxmox_firewall_smtp_relay_sources, never open.
          - "'IN ACCEPT -source +dc/core-cluster -p tcp -dport 25 -log nolog' in sg_smtp_relay"
          - "'IN ACCEPT -source +dc/core-cluster -p tcp -dport 587 -log nolog' in sg_smtp_relay"
          - "'IN ACCEPT -source +dc/admin_ts -p tcp -dport 25 -log nolog' in sg_smtp_relay"
          - "'IN ACCEPT -source +dc/admin_ts -p tcp -dport 587 -log nolog' in sg_smtp_relay"
          - "'IN ACCEPT -p tcp -dport 25 -log nolog' not in sg_smtp_relay"
          - "'OUT ACCEPT -p tcp -dport 587 -log nolog' in sg_smtp_relay"
          # Admin access is source-scoped to the two admin sets, never open.
          - "'IN ACCEPT -source +dc/admin_ts -p tcp -dport 8006 -log nolog' in sg_host_admin"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 8006 -log nolog' in sg_host_admin"
          - "'IN ACCEPT -source +dc/admin_ts -p tcp -dport 22 -log nolog' in sg_host_admin"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 22 -log nolog' in sg_host_admin"
          - "'IN ACCEPT -p tcp -dport 22 -log nolog' not in sg_host_admin"
          # sg-dns: DoT and the resolver ports are built in; the admin surfaces
          # come from proxmox_firewall_dns_admin_ports. Asserted as an ordered
          # LIST — `in` hides an extra rule, a duplicate and a reordering.
          - >-
            sg_dns | regex_findall('^IN ACCEPT .*$', multiline=True) ==
            ['IN ACCEPT -source +dc/admin_ts -p udp -dport 853 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p udp -dport 853 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 853 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 853 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog # resolver HTTPS admin UI',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog # resolver HTTPS admin UI',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 3000 -log nolog # resolver plaintext admin API',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 3000 -log nolog # resolver plaintext admin API',
             'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 3000 -log nolog # resolver plaintext admin API',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 53 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p udp -dport 53 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 53 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p udp -dport 53 -log nolog']
          - >-
            sg_ingress_int | regex_findall('^IN ACCEPT .*$', multiline=True) ==
            ['IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 80 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 80 -log nolog']
          # sg-metrics: the collection's own exporters are built in, app ports
          # only arrive via proxmox_firewall_metrics_scrape_ports, and every
          # scrape target stays source-scoped.
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9100 -log nolog' in sg_metrics"
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9101 -log nolog' in sg_metrics"
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 32400 -log nolog' in sg_metrics"
          - "'IN ACCEPT -source +dc/core-cluster -p tcp -dport 31100 -log nolog' in sg_metrics"
          # An entry with two sources fans out to one rule per source, the same
          # way the sg-dns list does — the two seams share one schema.
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9993 -log nolog' in sg_metrics"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 9993 -log nolog' in sg_metrics"
          - "'-dport 8123' not in sg_metrics"
          # The cleartext live-migration range is not pre-authorised while the
          # cluster runs the secure channel.
          - "'-dport 60000:60050' not in sg_pve_cluster"
          # The WAN WireGuard rule is -dest-scoped to the VIP, so the node's own
          # :51820/udp (flannel) is never opened to the WAN.
          - "'IN ACCEPT -dest 192.168.0.99 -p udp -dport 51820 -log nolog' in sg_ingress_pub"
          - "'IN ACCEPT -p udp -dport 51820 -log nolog' not in sg_ingress_pub"
        fail_msg: >-
          A role-owned security group lost or widened a rule — check the
          [group …] blocks in templates/cluster.fw.j2.

    # The two hand-authored port lists share one schema, and `sources` must be a
    # list: a scalar has a length, so a length-only guard passes it and the
    # template iterates it per character into rules naming nonexistent IPSets.

    # Every block below drives one malformed shape, with the other three
    # variables set valid in the same `vars:`, so a rescue can only mean the
    # shape under test was rejected. verify.yml carries no roles:.

    # The driven includes run task files outside the role, so the role's own
    # vars/ is not in scope: load it rather than restate the reserved names.
    - name: Load the role's vars for the driven guard includes
      ansible.builtin.include_vars:
        file: ../../vars/main.yml

    - name: Drive the port-list schema guard — a scalar `sources`
      block:
        - name: Include the schema guard with a scalar sources value
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports:
              - {port: 3000, sources: k3s_nodes, comment: scalar not a list}
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      rescue:
        - name: Record that the scalar sources value was rejected
          ansible.builtin.set_fact:
            firewall_scalar_sources_rejected: true

    - name: Drive the port-list schema guard — an entry with no sources key
      block:
        - name: Include the schema guard with a sources-less entry
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports:
              - {port: 3000, comment: no sources key}
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      rescue:
        - name: Record that the sources-less entry was rejected
          ansible.builtin.set_fact:
            firewall_missing_sources_rejected: true

    # `port:` with the value omitted on the next line is `defined` and null, so
    # a presence-only test passes it and the template renders `-dport None`.
    - name: Drive the port-list schema guard — a valueless `port`
      block:
        - name: Include the schema guard with a null port
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports:
              - {port: null, sources: [k3s_nodes], comment: value omitted}
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      rescue:
        - name: Record that the valueless port was rejected
          ansible.builtin.set_fact:
            firewall_null_port_rejected: true

    # A mapping is a sequence and is not a string, so the list test admitted it;
    # the template then iterates its KEYS, which happens to render — the assert
    # must reject what it advertises.
    - name: Drive the port-list schema guard — a mapping `sources`
      block:
        - name: Include the schema guard with a mapping sources value
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports:
              - {port: 3000, sources: {admin_ts: null}}
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      rescue:
        - name: Record that the mapping sources value was rejected
          ansible.builtin.set_fact:
            firewall_mapping_sources_rejected: true

    # The client-scope lists are the seam a segmented site hand-edits, and the
    # singular/plural slip renders one rule per CHARACTER of the name.
    - name: Drive the client-scope schema guard — a scalar list
      block:
        - name: Include the schema guard with a scalar client-scope value
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: dns_clients
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      rescue:
        - name: Record that the scalar client-scope value was rejected
          ansible.builtin.set_fact:
            firewall_scalar_client_scope_rejected: true

    # An empty list renders a syntactically perfect cluster.fw with the surface
    # it scopes closed — DNS for every VLAN, or the whole internal ingress.
    - name: Drive the client-scope schema guard — an empty DNS client list
      block:
        - name: Include the schema guard with an empty DNS client list
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: []
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      rescue:
        - name: Record that the empty DNS client list was rejected
          ansible.builtin.set_fact:
            firewall_empty_dns_scope_rejected: true

    # sg-smtp-relay fails closed: an empty scope is a legal "no rule at all",
    # while a scalar still renders one rule per CHARACTER of the name.
    - name: Drive the client-scope schema guard — an empty smtp-relay scope
      block:
        - name: Include the schema guard with an empty smtp-relay scope
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
            proxmox_firewall_smtp_relay_sources: []

        - name: Record that the empty smtp-relay scope was accepted
          ansible.builtin.set_fact:
            firewall_empty_smtp_relay_scope_accepted: true

    - name: Drive the client-scope schema guard — a scalar smtp-relay scope
      block:
        - name: Include the schema guard with a scalar smtp-relay scope
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
            proxmox_firewall_smtp_relay_sources: core-cluster
      rescue:
        - name: Record that the scalar smtp-relay scope was rejected
          ansible.builtin.set_fact:
            firewall_scalar_smtp_relay_scope_rejected: true

    - name: Drive the port-schema guard — a relay egress entry with no port
      block:
        - name: Include the schema guard with a portless relay egress entry
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
            proxmox_firewall_smtp_relay_extra_egress_ports:
              - {proto: tcp}
      rescue:
        - name: Record that the portless relay egress entry was rejected
          ansible.builtin.set_fact:
            firewall_portless_relay_egress_rejected: true

    - name: Drive the client-scope schema guard — an empty ingress client list
      block:
        - name: Include the schema guard with an empty ingress client list
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, dns_clients]
            proxmox_firewall_k3s_ingress_int_sources: []
      rescue:
        - name: Record that the empty ingress client list was rejected
          ansible.builtin.set_fact:
            firewall_empty_ingress_scope_rejected: true

    # The container tests above say nothing about what is in the list, and the
    # template interpolates each element into `+dc/{{ src }}`. A valueless entry
    # is a null element and renders `+dc/None`, naming a nonexistent IPSet.
    - name: Drive the client-scope schema guard — a null element
      block:
        - name: Include the schema guard with a null element in the list
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [null]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      rescue:
        - name: Record that the null element was rejected
          ansible.builtin.set_fact:
            firewall_null_client_element_rejected: true

    # An empty string renders a bare `+dc/` with no set name, which pve-firewall
    # refuses to compile — and it sits NEXT TO a valid entry, so the list is a
    # non-empty list of strings and every container test passes it.
    - name: Drive the client-scope schema guard — an empty-string element
      block:
        - name: Include the schema guard with an empty-string element
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: ["", admin_ts]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      rescue:
        - name: Record that the empty-string element was rejected
          ansible.builtin.set_fact:
            firewall_empty_client_element_rejected: true

    # `/` is a non-whitespace character, so a whitespace-only test admits it —
    # and `+dc/admin/ts` is not an IPSet reference pve-firewall can resolve, by
    # which time the role has already written cluster.fw.
    - name: Drive the client-scope schema guard — a punctuated set name
      block:
        - name: Include the schema guard with a `/` in a set name
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin/ts]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      rescue:
        - name: Record that the punctuated set name was rejected
          ansible.builtin.set_fact:
            firewall_punctuated_set_name_rejected: true

    # pve-firewall's ipset grammar is a leading LETTER then 1-63 more, i.e. a
    # minimum of two characters: a single-character name and a digit-leading one
    # are both refused by the schema, and neither is whitespace.
    - name: Drive the client-scope schema guard — a name outside the ipset grammar
      block:
        - name: Include the schema guard with a one-character set name
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, a]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      rescue:
        - name: Record that the too-short set name was rejected
          ansible.builtin.set_fact:
            firewall_short_set_name_rejected: true

    # A site group named like one the template renders itself puts two
    # `[group <name>]` sections in cluster.fw, and pve-firewall keeps one.
    - name: Drive the group-name guard — a name the role already renders
      block:
        - name: Include the schema guard with a colliding group name
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
            proxmox_firewall_security_groups:
              - name: sg-metrics
                rules: ["IN ACCEPT -p tcp -dport 9999 -log nolog"]
      rescue:
        - name: Record that the colliding group name was rejected
          ansible.builtin.set_fact:
            firewall_colliding_group_name_rejected: true

    # pve-firewall's group grammar caps the name at 18 characters, so a longer
    # one is refused after the role has written cluster.fw.
    - name: Drive the group-name guard — a name outside pve-firewall's grammar
      block:
        - name: Include the schema guard with an over-long group name
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
            proxmox_firewall_security_groups:
              - name: sg-application-group-too-long
                rules: ["IN ACCEPT -p tcp -dport 9999 -log nolog"]
      rescue:
        - name: Record that the over-long group name was rejected
          ansible.builtin.set_fact:
            firewall_long_group_name_rejected: true

    # pve-firewall's grammar opens on a letter, so a leading digit is refused
    # once the file is written, with nothing before that to show it.
    - name: Drive the group-name guard — a name opening on a digit
      block:
        - name: Include the schema guard with a leading-digit group name
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
            proxmox_firewall_security_groups:
              - name: 9sg-example
                rules: ["IN ACCEPT -p tcp -dport 9999 -log nolog"]
      rescue:
        - name: Record that the leading-digit group name was rejected
          ansible.builtin.set_fact:
            firewall_digit_group_name_rejected: true

    - name: Drive the group-name guard — two groups sharing one name
      block:
        - name: Include the schema guard with a duplicated group name
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
            proxmox_firewall_security_groups:
              - name: sg-example-dup
                rules: ["IN ACCEPT -p tcp -dport 9998 -log nolog"]
              - name: sg-example-dup
                rules: ["IN ACCEPT -p tcp -dport 9999 -log nolog"]
      rescue:
        - name: Record that the duplicated group name was rejected
          ansible.builtin.set_fact:
            firewall_duplicate_group_name_rejected: true

    # host.fw renders each extra entry as `GROUP <name>`, so a mapping there
    # renders a group reference no node resolves.
    - name: Drive the extra-group guard — an entry that is not a name
      block:
        - name: Include the schema guard with a mapping in the extra groups
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
            proxmox_firewall_host_extra_groups:
              - name: sg-example-web
      rescue:
        - name: Record that the mapping extra group was rejected
          ansible.builtin.set_fact:
            firewall_mapping_extra_group_rejected: true

    - name: Assert the group-name guards fail closed
      ansible.builtin.assert:
        that:
          - firewall_colliding_group_name_rejected | default(false)
          - firewall_long_group_name_rejected | default(false)
          - firewall_digit_group_name_rejected | default(false)
          - firewall_duplicate_group_name_rejected | default(false)
          - firewall_mapping_extra_group_rejected | default(false)
        fail_msg: >-
          The group-name guard accepted a name the template renders itself, a
          duplicate, a name outside pve-firewall's grammar (too long, or opening
          on a digit), or an extra-group entry that is not a name. The first two
          render two `[group <name>]` sections and pve-firewall keeps one rule
          set of the two, silently closing either the site's app ports or a
          built-in allow.
        success_msg: >-
          group-name guards fail closed on a reserved name, a duplicate, an
          ungrammatical name and a non-name extra-group entry

    - name: Assert the hand-authored list guards fail closed on every shape
      ansible.builtin.assert:
        that:
          - firewall_scalar_sources_rejected | default(false)
          - firewall_missing_sources_rejected | default(false)
          - firewall_null_port_rejected | default(false)
          - firewall_mapping_sources_rejected | default(false)
          - firewall_scalar_client_scope_rejected | default(false)
          - firewall_empty_dns_scope_rejected | default(false)
          - firewall_empty_ingress_scope_rejected | default(false)
          - firewall_empty_smtp_relay_scope_accepted | default(false)
          - firewall_scalar_smtp_relay_scope_rejected | default(false)
          - firewall_portless_relay_egress_rejected | default(false)
          - firewall_null_client_element_rejected | default(false)
          - firewall_empty_client_element_rejected | default(false)
          - firewall_punctuated_set_name_rejected | default(false)
          - firewall_short_set_name_rejected | default(false)
        fail_msg: >-
          A hand-authored list guard accepted a scalar or mapping `sources`, an
          entry with no `sources` key, a `port:` with no value, an empty DNS or
          ingress client scope, or an ELEMENT that is null, empty, punctuated or
          outside pve-firewall's ipset grammar — each writes a cluster.fw that
          either refuses to compile or silently closes a whole service surface,
          after the role has already written it. An empty smtp-relay scope is
          the one legal emptiness and must be accepted.
        success_msg: >-
          hand-authored list guards fail closed on scalar/mapping/missing
          sources, on a valueless port, on an empty DNS or ingress client scope,
          and on a null, empty or ungrammatical set name inside one, while the
          fail-closed smtp-relay scope may be empty

    # Per-application groups come from proxmox_firewall_security_groups, with a
    # stand-in site list in molecule.yml. One entry's `rules` is an expression
    # that must evaluate to a list; a string would iterate character by character.
    - name: Cluster.fw renders the supplied per-application groups verbatim
      vars:
        sg_web: "{{ cluster_fw_sections.get('group sg-example-web', '') }}"
        sg_noauth: "{{ cluster_fw_sections.get('group sg-example-noauth', '') }}"
      ansible.builtin.assert:
        that:
          - "'# ingress -> app TLS' in sg_web"
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog' in sg_web"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog' in sg_web"
          - "'IN ACCEPT -source 192.168.0.157 -p tcp -dport 3003 -log nolog' in sg_noauth"
        fail_msg: >-
          proxmox_firewall_security_groups did not render its groups verbatim,
          or a `rules` expression did not evaluate to a list of rule lines.

    # Default case: with no site list, the role must render NO per-application
    # group — never another deployment's rules — while its own groups stand.
    - name: Render cluster.fw with the default (empty) security-group list
      vars:
        # Role templates dir, derived without '../' (playbook_dir is
        # <role>/molecule/default).
        firewall_role_templates: "{{ playbook_dir | dirname | dirname }}/templates"
        # verify.yml carries no roles:, so role defaults are out of scope.
        proxmox_firewall_admin_ts_cidrs: ["100.64.0.0/10"]
        proxmox_firewall_smb_client_cidrs: ["192.168.0.0/24"]
        proxmox_firewall_cluster_rules: []
        proxmox_firewall_security_groups: []
        proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
        proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      ansible.builtin.template:
        src: "{{ firewall_role_templates }}/cluster.fw.j2"
        dest: /tmp/cluster.fw.no-app-groups
        mode: "0644"

    - name: Read the default-list render
      ansible.builtin.slurp:
        src: /tmp/cluster.fw.no-app-groups
      register: cluster_fw_default

    - name: Assert an empty list emits no per-application group
      vars:
        default_text: "{{ cluster_fw_default.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'[group sg-example-web]' not in default_text"
          - "'[group sg-example-noauth]' not in default_text"
          # Role-owned groups are unaffected by the site list.
          - "'[group sg-dns]' in default_text"
          - "'[group sg-host-admin]' in default_text"
          - "'[group sg-metrics]' in default_text"
        fail_msg: >-
          proxmox_firewall_security_groups is not the sole source of the
          per-application groups — an empty list must emit none of them and
          leave the role-owned groups in place.

    # Segmented-site case: the two service surfaces move to site-declared IPSets
    # while admin_lan shrinks to the management plane. The move must be surgical
    # — admin_lan leaves :53 and the internal ingress and stays everywhere else.
    - name: Render cluster.fw with overridden client scopes
      vars:
        firewall_role_templates: "{{ playbook_dir | dirname | dirname }}/templates"
        proxmox_firewall_admin_ts_cidrs: ["100.64.0.0/10"]
        proxmox_firewall_smb_client_cidrs: ["192.168.0.0/24"]
        proxmox_firewall_cluster_rules: []
        proxmox_firewall_security_groups: []
        proxmox_firewall_dns_client_sources: [admin_ts, dns_clients]
        proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      ansible.builtin.template:
        src: "{{ firewall_role_templates }}/cluster.fw.j2"
        dest: /tmp/cluster.fw.custom-client-scopes
        mode: "0644"

    - name: Read the overridden-scope render
      ansible.builtin.slurp:
        src: /tmp/cluster.fw.custom-client-scopes
      register: cluster_fw_custom

    - name: Assert the overridden client scopes render +dc/<custom> and nothing wider
      vars:
        custom_text: "{{ cluster_fw_custom.content | b64decode }}"
        custom_sections: >-
          {{ dict(custom_text | regex_findall('^\[([^\]]+)\]\n([\s\S]*?)(?=^\[|\Z)', multiline=True)) }}
        c_dns: "{{ custom_sections.get('group sg-dns', '') }}"
        c_ingress_int: "{{ custom_sections.get('group sg-k3s-ingress-int', '') }}"
        c_host_admin: "{{ custom_sections.get('group sg-host-admin', '') }}"
      ansible.builtin.assert:
        that:
          # :53 now answers the site's dns_clients set, one rule per protocol.
          - "'IN ACCEPT -source +dc/dns_clients -p tcp -dport 53 -log nolog' in c_dns"
          - "'IN ACCEPT -source +dc/dns_clients -p udp -dport 53 -log nolog' in c_dns"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 53 -log nolog' not in c_dns"
          - "'IN ACCEPT -source +dc/admin_lan -p udp -dport 53 -log nolog' not in c_dns"
          # admin_ts stays: dropping the overlay from DNS is a DR lockout.
          - "'IN ACCEPT -source +dc/admin_ts -p tcp -dport 53 -log nolog' in c_dns"
          # DoT and the credentialed admin surfaces keep the admin sets — the
          # client scope must not leak into proxmox_firewall_dns_admin_ports.
          - "'IN ACCEPT -source +dc/admin_lan -p udp -dport 853 -log nolog' in c_dns"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 3000 -log nolog' in c_dns"
          - "'IN ACCEPT -source +dc/dns_clients -p tcp -dport 3000 -log nolog' not in c_dns"
          # The internal ingress fans out per source, port-major, in list order.
          - >-
            c_ingress_int | regex_findall('^IN ACCEPT .*$', multiline=True) ==
            ['IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog',
             'IN ACCEPT -source +dc/lan_clients -p tcp -dport 443 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 80 -log nolog',
             'IN ACCEPT -source +dc/lan_clients -p tcp -dport 80 -log nolog']
          # The management plane is untouched by either override.
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 8006 -log nolog' in c_host_admin"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 22 -log nolog' in c_host_admin"
        fail_msg: >-
          proxmox_firewall_dns_client_sources /
          proxmox_firewall_k3s_ingress_int_sources did not move ONLY the two
          service surfaces — check the loops in templates/cluster.fw.j2.

    # Referential integrity: every `+dc/<name>` must have a matching [IPSET
    # <name>] or pve-firewall refuses to compile the datacenter ruleset. Client
    # scopes and per-app groups are site strings, so a typo reaches the file.
    - name: Every +dc/ reference resolves to a declared IPSet
      vars:
        referenced: "{{ cluster_fw_text | regex_findall('\\+dc/(\\S+)') | unique | sort }}"
        declared: "{{ cluster_fw_text | regex_findall('^\\[IPSET (\\S+)\\]', multiline=True) | unique | sort }}"
        custom_referenced: "{{ (cluster_fw_custom.content | b64decode) | regex_findall('\\+dc/(\\S+)') | unique | sort }}"
        custom_declared: "{{ (cluster_fw_custom.content | b64decode) | regex_findall('^\\[IPSET (\\S+)\\]', multiline=True) | unique | sort }}"
      ansible.builtin.assert:
        that:
          - referenced | length > 0
          - referenced | difference(declared) | length == 0
          - custom_referenced | difference(custom_declared) | length == 0
          # The overridden-scope render is the one that exercises site-supplied
          # set names, so it must actually carry them.
          - "'dns_clients' in custom_referenced"
          - "'lan_clients' in custom_referenced"
        fail_msg: >-
          A rule names an IPSet that cluster.fw never declares — pve-firewall
          refuses to compile the whole datacenter ruleset after the role has
          written the file. Check
          proxmox_firewall_dns_client_sources,
          proxmox_firewall_k3s_ingress_int_sources,
          proxmox_firewall_security_groups and the site's
          firewall_ipsets / firewall_ipset_special_entries.

    - name: Dynamic IPSets carry each inventory IP in its own set
      vars:
        pve_hosts: "{{ cluster_fw_sections.get('IPSET pve_hosts', '') }}"
        core_cluster: "{{ cluster_fw_sections.get('IPSET core-cluster', '') }}"
        k3s_nodes: "{{ cluster_fw_sections.get('IPSET k3s_nodes', '') }}"
        admin_lan: "{{ cluster_fw_sections.get('IPSET admin_lan', '') }}"
      ansible.builtin.assert:
        that:
          - "'192.168.0.102' in pve_hosts"
          - "'192.168.0.103' in pve_hosts"
          - "'192.168.0.150' in core_cluster"
          - "'192.168.0.151' in core_cluster"
          # Guests are not Proxmox hosts, and the special entry lands in k3s_nodes.
          - "'192.168.0.150' not in pve_hosts"
          - "'192.168.0.161' in k3s_nodes"          # API VIP (special entry)
          - "'192.168.0.0/24' in admin_lan"
        fail_msg: >-
          An inventory address rendered into the wrong IPSet — check
          firewall_ipsets / firewall_ipset_special_entries and templates/ipsets.j2.

    # The IPSet header comment comes from a built-in map describing only the
    # sets this collection ships. A site-declared scope has no entry, so the
    # header line must be omitted rather than rendering an empty `# `.
    - name: Site-declared IPSets render no empty header comment
      vars:
        dns_clients: "{{ cluster_fw_sections.get('IPSET dns_clients', '') }}"
        empty_comment_lines: >-
          {{ cluster_fw_text | regex_findall('^#[ \t]*$', multiline=True) }}
      ansible.builtin.assert:
        that:
          - empty_comment_lines | length == 0
          - "'192.168.0.0/24' in dns_clients"
          - "'# K3s cluster nodes + API VIP' in cluster_fw_text"
        fail_msg: >-
          cluster.fw carries a bare `# ` line, or a described set lost its
          header comment — check the ipset_comments lookup in
          templates/ipsets.j2.

    - name: Host.fw exists
      ansible.builtin.stat:
        path: "{{ host_fw }}"
      register: host_fw_stat
      failed_when: not host_fw_stat.stat.exists

    - name: Read host.fw
      ansible.builtin.slurp:
        src: "{{ host_fw }}"
      register: host_fw_content

    - name: Host.fw enables the firewall and references the right groups
      vars:
        host_fw_text: "{{ host_fw_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'enable: 1' in host_fw_text"
          - "'log_level_in: nolog' in host_fw_text"
          - "'GROUP sg-pve-cluster' in host_fw_text"
          - "'GROUP sg-host-admin' in host_fw_text"
          - "'GROUP sg-metrics' in host_fw_text"
          # proxmox_role: nas on this platform adds the file-server groups.
          - "'GROUP sg-nfs-server' in host_fw_text"
          - "'GROUP sg-smb-server' in host_fw_text"
          # Egress filtering is off by default: no allowlist, no trailing DROP.
          - "'GROUP sg-host-egress' not in host_fw_text"
          - "'OUT DROP' not in host_fw_text"
          # nftables is off by default, and the option is omitted rather than
          # written as 0, so the node keeps its current implementation.
          - "'nftables' not in host_fw_text"
        fail_msg: >-
          host.fw is missing a base group reference, or rendered the egress
          default-deny or the nftables option while
          proxmox_firewall_egress_filtering / proxmox_firewall_nftables are
          false.

    - name: Read the storage-seam host.fw
      ansible.builtin.slurp:
        src: /tmp/pve-firewall-test/nodes-seam/proxmox-firewall-test/host.fw
      register: host_fw_seam_content

    - name: Host.fw takes the file-server groups from the storage-role variable
      vars:
        seam_text: "{{ host_fw_seam_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'GROUP sg-nfs-server' in seam_text"
          - "'GROUP sg-smb-server' in seam_text"
          - "'GROUP sg-example-web' in seam_text"
        fail_msg: >-
          A node whose proxmox_role matches proxmox_firewall_storage_role_name
          rendered no file-server groups, or
          proxmox_firewall_host_extra_groups rendered no `GROUP` reference — a
          storage node not named `nas` then converges with :111, :2049 and :445
          closed to every client and nothing saying why.

    - name: Per-guest 100.fw exists
      ansible.builtin.stat:
        path: "{{ guest_fw }}"
      register: guest_fw_stat
      failed_when: not guest_fw_stat.stat.exists

    - name: Read 100.fw
      ansible.builtin.slurp:
        src: "{{ guest_fw }}"
      register: guest_fw_content

    - name: Per-guest 100.fw has expected GROUP refs
      ansible.builtin.assert:
        that:
          - "'[OPTIONS]' in (guest_fw_content.content | b64decode)"
          - "'enable: 1' in (guest_fw_content.content | b64decode)"
          - "'GROUP sg-vm-admin' in (guest_fw_content.content | b64decode)"
          - "'GROUP sg-dns' in (guest_fw_content.content | b64decode)"
          - "'GROUP sg-metrics' in (guest_fw_content.content | b64decode)"

    # Each guest must render to its OWN <vmid>.fw: the platform uses vmid 100 so
    # it never shares a file with dns-01 (150) or smtp-relay (151), where two
    # hosts would overwrite each other's render every converge.
    - name: Verify per-vmid file separation (vmid-collision regression guard)
      ansible.builtin.stat:
        path: "/tmp/pve-firewall-test/firewall/150.fw"
      register: dns01_guest_fw_stat

    - name: Assert dns-01's 150.fw rendered to its own file
      ansible.builtin.assert:
        that:
          - dns01_guest_fw_stat.stat.exists
        fail_msg: >-
          /tmp/pve-firewall-test/firewall/150.fw missing — dns-01's
          guest firewall didn't render. If the molecule platform's
          vmid was bumped to 150, the docker-platform render would
          have overwritten dns-01's file path. Check
          molecule.yml host_vars.proxmox-firewall-test.vmid.

    - name: Read dns-01's 150.fw
      ansible.builtin.slurp:
        src: "/tmp/pve-firewall-test/firewall/150.fw"
      register: dns01_guest_fw_content

    - name: Assert 100.fw and 150.fw carry their respective inventory_hostname
      ansible.builtin.assert:
        that:
          - "'Guest: proxmox-firewall-test' in (guest_fw_content.content | b64decode)"
          - "'Guest: dns-01' in (dns01_guest_fw_content.content | b64decode)"
        fail_msg: >-
          Per-vmid files don't carry the matching inventory_hostname
          comment line — most likely the molecule platform reused a
          vmid from another platform entry and the renders
          collided. 100.fw should mention proxmox-firewall-test;
          150.fw should mention dns-01.

    # Coverage for the guest_firewall_policy_out egress-DROP branch: smtp-relay
    # (151) sets it in molecule.yml and must render the default-deny policy;
    # dns-01 (150) leaves it unset and must omit policy_out.
    - name: Read smtp-relay's 151.fw
      ansible.builtin.slurp:
        src: "/tmp/pve-firewall-test/firewall/151.fw"
      register: smtp_guest_fw_content

    - name: Assert policy_out DROP renders when enforced and is omitted otherwise
      ansible.builtin.assert:
        that:
          - "'policy_out: DROP' in (smtp_guest_fw_content.content | b64decode)"
          - "'policy_out:' not in (dns01_guest_fw_content.content | b64decode)"
        fail_msg: >-
          guest_firewall_policy_out rendering wrong — 151.fw (smtp-relay)
          should carry 'policy_out: DROP' and 150.fw (dns-01) should omit
          policy_out. Check the conditional in guest.fw.j2.

    # This play must stay scoped to proxmox-firewall-test: a `hosts: all` picks
    # up the local-connection placeholder hosts, which cannot see files written
    # via docker exec. The assertion below requires exactly one host.
    - name: Assert verify play is scoped to the docker platform only
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - ansible_play_hosts_all | first == 'proxmox-firewall-test'
        fail_msg: >-
          verify.yml ran against {{ ansible_play_hosts_all | length }}
          hosts ({{ ansible_play_hosts_all | join(', ') }}); should be
          just 'proxmox-firewall-test'. The local-connection placeholder
          hosts can't see files written via docker-exec to the container.

    # Cross-play run-once guard: the second converge play captured
    # _proxmox_firewall_cluster_done before re-including the role, so it must
    # already be true — later plays read it from hostvars and skip cluster.fw.
    - name: Read cross-play guard capture
      ansible.builtin.slurp:
        src: /tmp/pve-firewall-test/cross-play-guard.json
      register: cross_play_guard

    - name: Assert run-once fact was already set when the second play started
      ansible.builtin.assert:
        that:
          - (cross_play_guard.content | b64decode | from_json).cluster_done_before_second_include
        fail_msg: >-
          _proxmox_firewall_cluster_done was not visible to the second play —
          the cross-play run-once guard would re-deploy cluster.fw on
          every including play. Check the delegate_facts set_fact on
          groups['proxmox'][0] in tasks/main.yml.

    # Production runs with egress filtering on, and the default-off case above
    # only asserts the lines are absent. Render the enabled branch and assert the
    # ordered rule list: host rules, base groups, allowlist, trailing DROP.
    - name: Render host.fw with egress filtering, a host rule and info logging
      vars:
        firewall_role_templates: "{{ playbook_dir | dirname | dirname }}/templates"
        proxmox_firewall_log_level_in: info
        proxmox_firewall_egress_filtering: true
        proxmox_firewall_host_rules:
          - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 9999 -log nolog"
        proxmox_role: compute
        proxmox_firewall_storage_role_name: nas
      ansible.builtin.template:
        src: "{{ firewall_role_templates }}/host.fw.j2"
        dest: /tmp/host.fw.egress
        mode: "0644"

    - name: Read the egress-filtering host.fw render
      ansible.builtin.slurp:
        src: /tmp/host.fw.egress
      register: host_fw_egress

    - name: Assert the egress branch renders the allowlist before the trailing DROP
      vars:
        egress_text: "{{ host_fw_egress.content | b64decode }}"
        rule_lines: >-
          {{ (egress_text.split('[RULES]') | last).splitlines()
             | map('trim') | select() | reject('match', '^#') | list }}
      ansible.builtin.assert:
        that:
          - >-
            rule_lines ==
            ['IN ACCEPT -source +dc/admin_lan -p tcp -dport 9999 -log nolog',
             'GROUP sg-pve-cluster',
             'GROUP sg-host-admin',
             'GROUP sg-metrics',
             'GROUP sg-host-egress',
             'OUT DROP -log info']
          - "'log_level_in: info' in egress_text"
        fail_msg: >-
          host.fw's egress branch must render the host rules first, then the
          three base groups, then GROUP sg-host-egress, then `OUT DROP -log
          info` LAST — anything after the DROP, or a DROP without the
          allowlist above it, cuts the node off.

    # The nftables implementation switch, which the default render asserts is
    # absent. The option selects proxmox-firewall over pve-firewall, so a render
    # that drops it leaves the node on iptables with no sign of it.
    - name: Render host.fw with the nftables implementation selected
      vars:
        firewall_role_templates: "{{ playbook_dir | dirname | dirname }}/templates"
        proxmox_firewall_nftables: true
        proxmox_firewall_log_level_in: nolog
        proxmox_role: compute
        proxmox_firewall_storage_role_name: nas
      ansible.builtin.template:
        src: "{{ firewall_role_templates }}/host.fw.j2"
        dest: /tmp/host.fw.nftables
        mode: "0644"

    - name: Read the nftables host.fw render
      ansible.builtin.slurp:
        src: /tmp/host.fw.nftables
      register: host_fw_nftables

    - name: Assert the nftables option renders inside [OPTIONS]
      vars:
        nftables_text: "{{ host_fw_nftables.content | b64decode }}"
        option_lines: >-
          {{ (nftables_text.split('[RULES]') | first).splitlines()
             | map('trim') | select() | reject('match', '^#') | list }}
      ansible.builtin.assert:
        that:
          - "'nftables: 1' in option_lines"
          - "'[OPTIONS]' in option_lines"
          - "'enable: 1' in option_lines"
        fail_msg: >-
          host.fw must carry `nftables: 1` in [OPTIONS] when
          proxmox_firewall_nftables is true, alongside the options it always
          renders — the node otherwise stays on the iptables implementation.

    # The site-port seam and the cleartext migration range, both off by default.
    - name: Render cluster.fw with the migration range and site egress ports open
      vars:
        firewall_role_templates: "{{ playbook_dir | dirname | dirname }}/templates"
        proxmox_firewall_admin_ts_cidrs: ["100.64.0.0/10"]
        proxmox_firewall_smb_client_cidrs: ["192.168.0.0/24"]
        proxmox_firewall_cluster_rules: []
        proxmox_firewall_security_groups: []
        proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
        proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
        proxmox_firewall_insecure_migration_ports: true
        proxmox_firewall_host_egress_extra_ports:
          - {port: 2222, proto: tcp, comment: forge SSH}
          - {port: 31100, proto: tcp}
      ansible.builtin.template:
        src: "{{ firewall_role_templates }}/cluster.fw.j2"
        dest: /tmp/cluster.fw.egress-extra
        mode: "0644"

    - name: Read the migration/egress-port render
      ansible.builtin.slurp:
        src: /tmp/cluster.fw.egress-extra
      register: cluster_fw_egress_extra

    - name: Assert the site egress ports and migration range render only when asked
      vars:
        extra_text: "{{ cluster_fw_egress_extra.content | b64decode }}"
        extra_sections: >-
          {{ dict(extra_text | regex_findall('^\[([^\]]+)\]\n([\s\S]*?)(?=^\[|\Z)', multiline=True)) }}
        e_egress: "{{ extra_sections.get('group sg-host-egress', '') }}"
        e_cluster: "{{ extra_sections.get('group sg-pve-cluster', '') }}"
        default_egress: "{{ cluster_fw_sections.get('group sg-host-egress', '') }}"
      ansible.builtin.assert:
        that:
          - "'OUT ACCEPT -p tcp -dport 2222 -log nolog  # forge SSH' in e_egress"
          - "'OUT ACCEPT -p tcp -dport 31100 -log nolog' in e_egress"
          - "'IN ACCEPT -source +dc/pve_hosts -p tcp -dport 60000:60050 -log nolog' in e_cluster"
          - "'OUT ACCEPT -p tcp -dport 60000:60050 -log nolog' in e_egress"
          # Nothing site-specific is built in: the default render carries
          # neither port, and no application group the site did not supply.
          - "'-dport 2222' not in default_egress"
          - "'-dport 31100' not in default_egress"
        fail_msg: >-
          sg-host-egress must take site ports from
          proxmox_firewall_host_egress_extra_ports and build in none of them,
          and the cleartext migration range must stay closed unless
          proxmox_firewall_insecure_migration_ports is true.

    # `comment` is optional on an IPSet special entry: molecule.yml's k3s_nodes
    # entry omits it, so the member must render as a bare address.
    - name: Assert a comment-less IPSet entry renders without a trailing comment
      vars:
        k3s_lines: >-
          {{ (cluster_fw_sections.get('IPSET k3s_nodes', '') | trim).splitlines()
             | map('trim') | select() | list }}
      ansible.builtin.assert:
        that:
          - "'192.168.0.161' in k3s_lines"
        fail_msg: >-
          An IPSet entry without `comment` must render as the bare address —
          got {{ k3s_lines }}.

    - name: Drive the IPSet special-entry guard — an entry with no ip
      block:
        - name: Include the schema guard with an ip-less special entry
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
            firewall_ipset_special_entries:
              k3s_nodes:
                - comment: no ip key
      rescue:
        - name: Record that the ip-less special entry was rejected
          ansible.builtin.set_fact:
            firewall_ipset_missing_ip_rejected: true

    - name: Drive the host-egress port guard — an entry with no proto
      block:
        - name: Include the schema guard with a proto-less egress port
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
            proxmox_firewall_host_egress_extra_ports:
              - {port: 2222, comment: no proto key}
      rescue:
        - name: Record that the proto-less egress port was rejected
          ansible.builtin.set_fact:
            firewall_egress_missing_proto_rejected: true

    - name: Assert the IPSet and egress-port guards fail closed
      ansible.builtin.assert:
        that:
          - firewall_ipset_missing_ip_rejected | default(false)
          - firewall_egress_missing_proto_rejected | default(false)
        fail_msg: >-
          The schema guard accepted an IPSet special entry with no `ip` (which
          renders `None` into a cluster IPSet) or an egress port with no
          `proto` (which renders `-p None`).

    # cluster.fw renders from the play's first host, so an input the delegate
    # sees differently would be overwritten with this play's value. The guard
    # must reject that and stay quiet when the scopes agree.
    - name: Drive the cluster-scope guard — an input the delegate sees differently
      block:
        - name: Include the cluster-scope guard with a play-scoped override
          ansible.builtin.include_tasks: ../../tasks/assert_cluster_scope.yml
          vars:
            _proxmox_firewall_delegate: dns-01
            proxmox_firewall_metrics_scrape_ports: []
      rescue:
        - name: Record that the play-scoped override was rejected
          ansible.builtin.set_fact:
            firewall_cluster_scope_rejected: true

    - name: Include the cluster-scope guard with scopes that agree
      ansible.builtin.include_tasks: ../../tasks/assert_cluster_scope.yml
      vars:
        _proxmox_firewall_delegate: dns-01

    - name: Assert the cluster-scope guard fails closed
      ansible.builtin.assert:
        that:
          - firewall_cluster_scope_rejected | default(false)
        fail_msg: >-
          assert_cluster_scope.yml accepted a cluster-scope input that differs
          from the delegate's scope — a guest play would then overwrite
          cluster.fw with its own role defaults.

    # proxmox_firewall_enabled false must deploy nothing: the third converge
    # play redirected the config dirs, so their absence proves the guest .fw and
    # the pmxcfs directory tasks all honour the flag.
    - name: Stat the drained guest's .fw
      ansible.builtin.stat:
        path: /tmp/pve-firewall-test/firewall/152.fw
      register: drained_guest_fw

    - name: Assert an emptied group list removed the guest .fw
      ansible.builtin.assert:
        that:
          - not drained_guest_fw.stat.exists
        fail_msg: >-
          152.fw survived an emptied guest_security_groups — the guest keeps
          filtering on rules inventory no longer declares.

    # The fifth converge play rendered with proxmox_firewall_smtp_relay_sources
    # empty: sg-smtp-relay must still exist and carry no IN rule at all.
    - name: Read the empty-relay-scope cluster.fw
      ansible.builtin.slurp:
        src: /tmp/pve-firewall-smtp-empty/firewall/cluster.fw
      register: smtp_empty_cluster_fw

    - name: Index the empty-relay-scope cluster.fw by section header
      ansible.builtin.set_fact:
        smtp_empty_sections: >-
          {{ dict((smtp_empty_cluster_fw.content | b64decode)
             | regex_findall('^\[([^\]]+)\]\n([\s\S]*?)(?=^\[|\Z)', multiline=True)) }}

    - name: Assert an empty relay client scope renders no inbound relay rule
      vars:
        sg_smtp_relay_empty: "{{ smtp_empty_sections.get('group sg-smtp-relay', '') }}"
      ansible.builtin.assert:
        that:
          - "'group sg-smtp-relay' in smtp_empty_sections"
          - sg_smtp_relay_empty | regex_findall('^IN ACCEPT .*$', multiline=True) | length == 0
          - "'-dport 25' not in sg_smtp_relay_empty"
          - sg_smtp_relay_empty | regex_findall('^OUT ACCEPT .*$', multiline=True) | length > 0
        fail_msg: >-
          An empty proxmox_firewall_smtp_relay_sources rendered an IN rule in
          sg-smtp-relay, or dropped the group's egress allowlist — the default
          must open :25 and :587 to nobody until the site names its client sets.

    - name: Read the relay-scope guard result
      ansible.builtin.slurp:
        src: /tmp/molecule-results/fw-relay-scope.json
      register: fw_relay_scope

    - name: Assert a relay guest with no client scope fails the play
      ansible.builtin.assert:
        that:
          - (fw_relay_scope.content | b64decode | from_json).guard_fired
        fail_msg: >-
          A guest carrying sg-smtp-relay converged with an empty
          proxmox_firewall_smtp_relay_sources, so the relay's :25 and :587
          close with nothing reporting it.
        success_msg: "a relay guest with no client scope fails the play"

    # The sixth converge play carried a relay guest with no client scope: the
    # cluster-scope guard must fail the run before cluster.fw is published.
    - name: Read the cluster-scope relay guard result
      ansible.builtin.slurp:
        src: /tmp/molecule-results/fw-relay-cluster-scope.json
      register: fw_relay_cluster_scope

    - name: Stat the guarded render's cluster.fw
      ansible.builtin.stat:
        path: /tmp/pve-firewall-smtp-guard/firewall/cluster.fw
      register: fw_relay_cluster_guard_file

    - name: Assert the relay guard fires before cluster.fw is published
      ansible.builtin.assert:
        that:
          - (fw_relay_cluster_scope.content | b64decode | from_json).guard_fired
          - not fw_relay_cluster_guard_file.stat.exists
        fail_msg: >-
          cluster.fw was published with an empty sg-smtp-relay while an
          inventory guest carries the group, so the relay's :25 and :587 close
          and the guard only reports it plays later.
        success_msg: "the relay guard fires before cluster.fw is published"

    - name: Stat the disabled render's config tree
      ansible.builtin.stat:
        path: /tmp/pve-firewall-disabled
      register: disabled_render_dir

    - name: Assert a disabled render wrote nothing
      ansible.builtin.assert:
        that:
          - not disabled_render_dir.stat.exists
        fail_msg: >-
          proxmox_firewall_enabled: false still wrote into
          /tmp/pve-firewall-disabled — a guest firewall enabled while the
          operator believes the role is off.

    # The compile gate is the last thing between a ruleset the node will not
    # compile and a green deploy, and pve-firewall can exit 0 on a parse error,
    # so the publish task's own failed_when has to catch it.
    - name: Read the compile-gate result
      ansible.builtin.slurp:
        src: /tmp/molecule-results/fw-compile-gate.json
      register: fw_compile_gate

    - name: Assert a parse error that exits 0 fails the publish
      ansible.builtin.assert:
        that:
          - (fw_compile_gate.content | b64decode | from_json).gate_fired
        fail_msg: >-
          pve-firewall printed a line-numbered parse error and exited 0, and the
          role's publish reported success, so the cluster stops converging on a
          ruleset nothing reports as broken.
        success_msg: "a parse error that exits 0 fails the publish"

    - name: Read the delegate-selection results
      ansible.builtin.slurp:
        src: /tmp/molecule-results/fw-delegate.json
      register: firewall_delegate_artifact

    # The probe is what keeps an unreachable Proxmox host from taking the
    # cluster-scope tasks: a group where nothing answered must fail the run, and
    # an explicit pin must win over an empty probe result.
    - name: Assert delegate selection skips an unreachable host
      vars:
        delegates: "{{ firewall_delegate_artifact.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - delegates.delegate_mixed == 'proxmox-firewall-test'
          - delegates.dead_group_failed
          - delegates.delegate_pinned == 'proxmox-firewall-test'
        fail_msg: >-
          Delegate selection chose {{ delegates.delegate_mixed }} from a mixed
          group (expected the reachable host), resolved a delegate for a group
          where nothing answered instead of failing there, or ignored an
          explicit proxmox_firewall_delegate_host.
        success_msg: >-
          delegate selection skips an unreachable host, fails when nothing
          answered, and honours an explicit pin
