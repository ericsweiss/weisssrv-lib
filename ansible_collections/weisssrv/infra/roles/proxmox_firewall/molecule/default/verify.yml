---
# Scoped to the docker platform because the rendered cluster.fw / host.fw /
# guest <vmid>.fw files live on its filesystem (the role's delegate_to
# targets it). The local-connection inventory entries can't see those files
# — they're on the CI runner pod's filesystem, not the container's.
- name: Verify
  hosts: proxmox-firewall-test
  become: true
  gather_facts: true
  vars:
    cluster_fw: /tmp/pve-firewall-test/firewall/cluster.fw
    host_fw: /tmp/pve-firewall-test/nodes/proxmox-firewall-test/host.fw
    # vmid 100 matches the docker platform's host_vars in molecule.yml.
    guest_fw: /tmp/pve-firewall-test/firewall/100.fw
  tasks:
    - name: Cluster.fw exists
      ansible.builtin.stat:
        path: "{{ cluster_fw }}"
      register: cluster_fw_stat
      failed_when: not cluster_fw_stat.stat.exists

    - name: Read cluster.fw
      ansible.builtin.slurp:
        src: "{{ cluster_fw }}"
      register: cluster_fw_content

    - name: Decode cluster.fw
      ansible.builtin.set_fact:
        cluster_fw_text: "{{ cluster_fw_content.content | b64decode }}"

    # Index cluster.fw by section header ("group sg-dns", "IPSET pve_hosts", …)
    # so a rule or address is asserted to be in the RIGHT section: a bare
    # substring test passes even when every rule inside a group is gone.
    - name: Index cluster.fw sections by header
      ansible.builtin.set_fact:
        cluster_fw_sections: >-
          {{ dict(cluster_fw_text | regex_findall('^\[([^\]]+)\]\n([\s\S]*?)(?=^\[|\Z)', multiline=True)) }}

    - name: Cluster.fw has [OPTIONS] + default policies + built-in IPSets
      ansible.builtin.assert:
        that:
          - "'[OPTIONS]' in cluster_fw_text"
          - "'enable: 1' in cluster_fw_text"
          - "'policy_in: DROP' in cluster_fw_text"
          - "'policy_out: ACCEPT' in cluster_fw_text"
          - "'[IPSET admin_lan]' in cluster_fw_text"
          - "'[IPSET admin_ts]' in cluster_fw_text"
          - "'[IPSET smb_clients]' in cluster_fw_text"

    # LINE-ANCHORED, not substring. `[ALIASES]dns-01 192.168.0.150 # Primary DNS
    # server` — one line, produced by a whitespace-stripping `{#-` on the aliases
    # preamble — satisfies every substring test in this file while being a
    # section header pve-firewall will not parse. Both anchors below reject it:
    # the section index requires `[HEADER]\n`, so a glued header drops ALIASES
    # from cluster_fw_sections entirely, and the standalone-header count goes to
    # zero. Asserting each alias is a whole LINE of that section also catches two
    # aliases being glued to each other.
    - name: Cluster.fw renders inventory-derived and extra aliases, each on its own line
      vars:
        alias_lines: "{{ (cluster_fw_sections.get('ALIASES', '') | trim).splitlines() | map('trim') | list }}"
      ansible.builtin.assert:
        that:
          - "'ALIASES' in cluster_fw_sections"
          - "cluster_fw_text | regex_findall('^\\[ALIASES\\]$', multiline=True) | length == 1"
          - "'dns-01 192.168.0.150 # Primary DNS server' in alias_lines"
          - "'api-vip 192.168.0.161 # k3s API VIP' in alias_lines"
        fail_msg: >-
          [ALIASES] must be a parsable section — the header alone on its own
          line — carrying the alias derived from dns-01's firewall_alias and the
          non-host entry from proxmox_firewall_extra_aliases, one per line.

    # Role-owned groups: assert the RULE LINES, not just the headers. Emptying a
    # group, or widening a source to 0.0.0.0/0, must fail here.
    - name: Cluster.fw role-owned groups carry their rules
      vars:
        sg_dns: "{{ cluster_fw_sections.get('group sg-dns', '') }}"
        sg_host_admin: "{{ cluster_fw_sections.get('group sg-host-admin', '') }}"
        sg_metrics: "{{ cluster_fw_sections.get('group sg-metrics', '') }}"
        sg_ingress_int: "{{ cluster_fw_sections.get('group sg-k3s-ingress-int', '') }}"
        sg_ingress_pub: "{{ cluster_fw_sections.get('group sg-k3s-ingress-pub', '') }}"
        sg_pve_cluster: "{{ cluster_fw_sections.get('group sg-pve-cluster', '') }}"
      ansible.builtin.assert:
        that:
          # Admin access is source-scoped to the two admin sets, never open.
          - "'IN ACCEPT -source +dc/admin_ts -p tcp -dport 8006 -log nolog' in sg_host_admin"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 8006 -log nolog' in sg_host_admin"
          - "'IN ACCEPT -source +dc/admin_ts -p tcp -dport 22 -log nolog' in sg_host_admin"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 22 -log nolog' in sg_host_admin"
          - "'IN ACCEPT -p tcp -dport 22 -log nolog' not in sg_host_admin"
          # sg-dns: DoT and the resolver ports are built in; the admin
          # surfaces come from proxmox_firewall_dns_admin_ports, whose sources
          # this scenario extends with k3s_nodes on :3000 only. Both client
          # scopes (proxmox_firewall_dns_client_sources and
          # proxmox_firewall_k3s_ingress_int_sources) are left at their role
          # defaults here, so both surfaces must render exactly what they did
          # before the seams existed — same sources, same order. Asserted as an
          # ordered LIST, not membership: an extra rule, a duplicated one and a
          # reordering are all invisible to `in`.
          - >-
            sg_dns | regex_findall('^IN ACCEPT .*$', multiline=True) ==
            ['IN ACCEPT -source +dc/admin_ts -p udp -dport 853 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p udp -dport 853 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 853 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 853 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog # resolver HTTPS admin UI',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog # resolver HTTPS admin UI',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 3000 -log nolog # resolver plaintext admin API',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 3000 -log nolog # resolver plaintext admin API',
             'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 3000 -log nolog # resolver plaintext admin API',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 53 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p udp -dport 53 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 53 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p udp -dport 53 -log nolog']
          - >-
            sg_ingress_int | regex_findall('^IN ACCEPT .*$', multiline=True) ==
            ['IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 80 -log nolog',
             'IN ACCEPT -source +dc/admin_lan -p tcp -dport 80 -log nolog']
          # sg-metrics: the collection's own exporters are built in, app ports
          # only arrive via proxmox_firewall_metrics_scrape_ports, and every
          # scrape target stays source-scoped.
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9100 -log nolog' in sg_metrics"
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9101 -log nolog' in sg_metrics"
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 32400 -log nolog' in sg_metrics"
          - "'IN ACCEPT -source +dc/core-cluster -p tcp -dport 31100 -log nolog' in sg_metrics"
          # An entry with two sources fans out to one rule per source, the same
          # way the sg-dns list does — the two seams share one schema.
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9993 -log nolog' in sg_metrics"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 9993 -log nolog' in sg_metrics"
          - "'-dport 8123' not in sg_metrics"
          # The cleartext live-migration range is not pre-authorised while the
          # cluster runs the secure channel.
          - "'-dport 60000:60050' not in sg_pve_cluster"
          # The WAN WireGuard rule is -dest-scoped to the VIP, so the node's own
          # :51820/udp (flannel) is never opened to the WAN.
          - "'IN ACCEPT -dest 192.168.0.99 -p udp -dport 51820 -log nolog' in sg_ingress_pub"
          - "'IN ACCEPT -p udp -dport 51820 -log nolog' not in sg_ingress_pub"
        fail_msg: >-
          A role-owned security group lost or widened a rule — check the
          [group …] blocks in templates/cluster.fw.j2.

    # The two hand-authored port lists share one schema, and `sources` must be a
    # LIST: a scalar has a length, so a length-only guard passes it and the
    # template iterates it per character into rules naming IPSets that do not
    # exist. Singular-vs-plural is the likely author error, since the metrics
    # seam's key was a scalar `source` before this release.
    # Every block below drives ONE malformed shape: the other three variables
    # the guard covers are set to a valid value in the same `vars:`, so a rescue
    # can only mean the shape under test was rejected. verify.yml carries no
    # roles:, so role defaults are out of scope and an omitted variable would
    # fail the include for the wrong reason.
    - name: Drive the port-list schema guard — a scalar `sources`
      block:
        - name: Include the schema guard with a scalar sources value
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports:
              - {port: 3000, sources: k3s_nodes, comment: scalar not a list}
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      rescue:
        - name: Record that the scalar sources value was rejected
          ansible.builtin.set_fact:
            firewall_scalar_sources_rejected: true

    - name: Drive the port-list schema guard — an entry with no sources key
      block:
        - name: Include the schema guard with a sources-less entry
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports:
              - {port: 3000, comment: no sources key}
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      rescue:
        - name: Record that the sources-less entry was rejected
          ansible.builtin.set_fact:
            firewall_missing_sources_rejected: true

    # `port:` with the value omitted on the next line is `defined` and null, so
    # a presence-only test passes it and the template renders `-dport None`.
    - name: Drive the port-list schema guard — a valueless `port`
      block:
        - name: Include the schema guard with a null port
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports:
              - {port: null, sources: [k3s_nodes], comment: value omitted}
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      rescue:
        - name: Record that the valueless port was rejected
          ansible.builtin.set_fact:
            firewall_null_port_rejected: true

    # A mapping is a sequence and is not a string, so the list test admitted it;
    # the template then iterates its KEYS, which happens to render — the assert
    # must reject what it advertises.
    - name: Drive the port-list schema guard — a mapping `sources`
      block:
        - name: Include the schema guard with a mapping sources value
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports:
              - {port: 3000, sources: {admin_ts: null}}
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      rescue:
        - name: Record that the mapping sources value was rejected
          ansible.builtin.set_fact:
            firewall_mapping_sources_rejected: true

    # The client-scope lists are the seam a segmented site hand-edits, and the
    # singular/plural slip renders one rule per CHARACTER of the name.
    - name: Drive the client-scope schema guard — a scalar list
      block:
        - name: Include the schema guard with a scalar client-scope value
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: dns_clients
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      rescue:
        - name: Record that the scalar client-scope value was rejected
          ansible.builtin.set_fact:
            firewall_scalar_client_scope_rejected: true

    # An empty list renders a syntactically perfect cluster.fw with the surface
    # it scopes closed — DNS for every VLAN, or the whole internal ingress.
    - name: Drive the client-scope schema guard — an empty DNS client list
      block:
        - name: Include the schema guard with an empty DNS client list
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: []
            proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      rescue:
        - name: Record that the empty DNS client list was rejected
          ansible.builtin.set_fact:
            firewall_empty_dns_scope_rejected: true

    - name: Drive the client-scope schema guard — an empty ingress client list
      block:
        - name: Include the schema guard with an empty ingress client list
          ansible.builtin.include_tasks: ../../tasks/assert_port_lists.yml
          vars:
            proxmox_firewall_dns_admin_ports: []
            proxmox_firewall_metrics_scrape_ports: []
            proxmox_firewall_dns_client_sources: [admin_ts, dns_clients]
            proxmox_firewall_k3s_ingress_int_sources: []
      rescue:
        - name: Record that the empty ingress client list was rejected
          ansible.builtin.set_fact:
            firewall_empty_ingress_scope_rejected: true

    - name: Assert the hand-authored list guards fail closed on every shape
      ansible.builtin.assert:
        that:
          - firewall_scalar_sources_rejected | default(false)
          - firewall_missing_sources_rejected | default(false)
          - firewall_null_port_rejected | default(false)
          - firewall_mapping_sources_rejected | default(false)
          - firewall_scalar_client_scope_rejected | default(false)
          - firewall_empty_dns_scope_rejected | default(false)
          - firewall_empty_ingress_scope_rejected | default(false)
        fail_msg: >-
          A hand-authored list guard accepted a scalar or mapping `sources`, an
          entry with no `sources` key, a `port:` with no value, or an empty
          client-scope list — each writes a cluster.fw that either refuses to
          compile or silently closes a whole service surface, AFTER the role
          wrote it and notified the reload handler.
        success_msg: >-
          hand-authored list guards fail closed on scalar/mapping/missing
          sources, on a valueless port, and on an empty client scope

    # Per-application groups come from proxmox_firewall_security_groups
    # (molecule.yml supplies a stand-in site list). One entry's `rules` is an
    # expression that must evaluate to a LIST — a string would iterate
    # character-by-character into the file.
    - name: Cluster.fw renders the supplied per-application groups verbatim
      vars:
        sg_web: "{{ cluster_fw_sections.get('group sg-example-web', '') }}"
        sg_authless: "{{ cluster_fw_sections.get('group sg-example-authless', '') }}"
      ansible.builtin.assert:
        that:
          - "'# ingress -> app TLS' in sg_web"
          - "'IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog' in sg_web"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog' in sg_web"
          - "'IN ACCEPT -source 192.168.0.157 -p tcp -dport 3003 -log nolog' in sg_authless"
        fail_msg: >-
          proxmox_firewall_security_groups did not render its groups verbatim,
          or a `rules` expression did not evaluate to a list of rule lines.

    # Default case: with no site list, the role must render NO per-application
    # group — never another deployment's rules — while its own groups stand.
    - name: Render cluster.fw with the default (empty) security-group list
      vars:
        # Role templates dir, derived without '../' (playbook_dir is
        # <role>/molecule/default).
        firewall_role_templates: "{{ playbook_dir | dirname | dirname }}/templates"
        # verify.yml carries no roles:, so role defaults are out of scope.
        proxmox_firewall_admin_ts_cidrs: ["100.64.0.0/10"]
        proxmox_firewall_smb_client_cidrs: ["192.168.0.0/24"]
        proxmox_firewall_cluster_rules: []
        proxmox_firewall_security_groups: []
        proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
        proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]
      ansible.builtin.template:
        src: "{{ firewall_role_templates }}/cluster.fw.j2"
        dest: /tmp/cluster.fw.no-app-groups
        mode: "0644"

    - name: Read the default-list render
      ansible.builtin.slurp:
        src: /tmp/cluster.fw.no-app-groups
      register: cluster_fw_default

    - name: Assert an empty list emits no per-application group
      vars:
        default_text: "{{ cluster_fw_default.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'[group sg-example-web]' not in default_text"
          - "'[group sg-example-authless]' not in default_text"
          # Role-owned groups are unaffected by the site list.
          - "'[group sg-dns]' in default_text"
          - "'[group sg-host-admin]' in default_text"
          - "'[group sg-metrics]' in default_text"
        fail_msg: >-
          proxmox_firewall_security_groups is not the sole source of the
          per-application groups — an empty list must emit none of them and
          leave the role-owned groups in place.

    # Segmented-site case: the client scopes of the two SERVICE surfaces move to
    # site-declared IPSets while admin_lan shrinks to the management plane. What
    # this must prove is not just that the custom names appear, but that the
    # move is SURGICAL — admin_lan leaves :53 and the internal ingress and stays
    # everywhere else, and the resolver's credentialed admin ports do not
    # inherit the wider client scope.
    - name: Render cluster.fw with overridden client scopes
      vars:
        firewall_role_templates: "{{ playbook_dir | dirname | dirname }}/templates"
        proxmox_firewall_admin_ts_cidrs: ["100.64.0.0/10"]
        proxmox_firewall_smb_client_cidrs: ["192.168.0.0/24"]
        proxmox_firewall_cluster_rules: []
        proxmox_firewall_security_groups: []
        proxmox_firewall_dns_client_sources: [admin_ts, dns_clients]
        proxmox_firewall_k3s_ingress_int_sources: [admin_ts, lan_clients]
      ansible.builtin.template:
        src: "{{ firewall_role_templates }}/cluster.fw.j2"
        dest: /tmp/cluster.fw.custom-client-scopes
        mode: "0644"

    - name: Read the overridden-scope render
      ansible.builtin.slurp:
        src: /tmp/cluster.fw.custom-client-scopes
      register: cluster_fw_custom

    - name: Assert the overridden client scopes render +dc/<custom> and nothing wider
      vars:
        custom_text: "{{ cluster_fw_custom.content | b64decode }}"
        custom_sections: >-
          {{ dict(custom_text | regex_findall('^\[([^\]]+)\]\n([\s\S]*?)(?=^\[|\Z)', multiline=True)) }}
        c_dns: "{{ custom_sections.get('group sg-dns', '') }}"
        c_ingress_int: "{{ custom_sections.get('group sg-k3s-ingress-int', '') }}"
        c_host_admin: "{{ custom_sections.get('group sg-host-admin', '') }}"
      ansible.builtin.assert:
        that:
          # :53 now answers the site's dns_clients set, one rule per protocol.
          - "'IN ACCEPT -source +dc/dns_clients -p tcp -dport 53 -log nolog' in c_dns"
          - "'IN ACCEPT -source +dc/dns_clients -p udp -dport 53 -log nolog' in c_dns"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 53 -log nolog' not in c_dns"
          - "'IN ACCEPT -source +dc/admin_lan -p udp -dport 53 -log nolog' not in c_dns"
          # admin_ts stays: dropping the overlay from DNS is a DR lockout.
          - "'IN ACCEPT -source +dc/admin_ts -p tcp -dport 53 -log nolog' in c_dns"
          # DoT and the credentialed admin surfaces keep the admin sets — the
          # client scope must not leak into proxmox_firewall_dns_admin_ports.
          - "'IN ACCEPT -source +dc/admin_lan -p udp -dport 853 -log nolog' in c_dns"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 3000 -log nolog' in c_dns"
          - "'IN ACCEPT -source +dc/dns_clients -p tcp -dport 3000 -log nolog' not in c_dns"
          # The internal ingress fans out per source, port-major, in list order.
          - >-
            c_ingress_int | regex_findall('^IN ACCEPT .*$', multiline=True) ==
            ['IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog',
             'IN ACCEPT -source +dc/lan_clients -p tcp -dport 443 -log nolog',
             'IN ACCEPT -source +dc/admin_ts -p tcp -dport 80 -log nolog',
             'IN ACCEPT -source +dc/lan_clients -p tcp -dport 80 -log nolog']
          # The management plane is untouched by either override.
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 8006 -log nolog' in c_host_admin"
          - "'IN ACCEPT -source +dc/admin_lan -p tcp -dport 22 -log nolog' in c_host_admin"
        fail_msg: >-
          proxmox_firewall_dns_client_sources /
          proxmox_firewall_k3s_ingress_int_sources did not move ONLY the two
          service surfaces — check the loops in templates/cluster.fw.j2.

    # Referential integrity. Every `+dc/<name>` names an IPSet, and pve-firewall
    # refuses to compile a datacenter-wide ruleset naming one that is not
    # declared. That used to be structural — the template emitted the reference
    # and the `[IPSET …]` next to it — but the two client scopes and every
    # per-application group are now site-supplied strings, so a typo (or a set
    # nobody declared) reaches the file. This one assertion covers all of them,
    # in both renders.
    - name: Every +dc/ reference resolves to a declared IPSet
      vars:
        referenced: "{{ cluster_fw_text | regex_findall('\\+dc/(\\S+)') | unique | sort }}"
        declared: "{{ cluster_fw_text | regex_findall('^\\[IPSET (\\S+)\\]', multiline=True) | unique | sort }}"
        custom_referenced: "{{ (cluster_fw_custom.content | b64decode) | regex_findall('\\+dc/(\\S+)') | unique | sort }}"
        custom_declared: "{{ (cluster_fw_custom.content | b64decode) | regex_findall('^\\[IPSET (\\S+)\\]', multiline=True) | unique | sort }}"
      ansible.builtin.assert:
        that:
          - referenced | length > 0
          - referenced | difference(declared) | length == 0
          - custom_referenced | difference(custom_declared) | length == 0
          # The overridden-scope render is the one that exercises site-supplied
          # set names, so it must actually carry them.
          - "'dns_clients' in custom_referenced"
          - "'lan_clients' in custom_referenced"
        fail_msg: >-
          A rule names an IPSet that cluster.fw never declares — pve-firewall
          refuses to compile the whole datacenter ruleset, at handler time,
          after the file is written. Check
          proxmox_firewall_dns_client_sources,
          proxmox_firewall_k3s_ingress_int_sources,
          proxmox_firewall_security_groups and the site's
          firewall_ipsets / firewall_ipset_special_entries.

    - name: Dynamic IPSets carry each inventory IP in its own set
      vars:
        pve_hosts: "{{ cluster_fw_sections.get('IPSET pve_hosts', '') }}"
        core_cluster: "{{ cluster_fw_sections.get('IPSET core-cluster', '') }}"
        k3s_nodes: "{{ cluster_fw_sections.get('IPSET k3s_nodes', '') }}"
        admin_lan: "{{ cluster_fw_sections.get('IPSET admin_lan', '') }}"
      ansible.builtin.assert:
        that:
          - "'192.168.0.102' in pve_hosts"          # pve-nas-01
          - "'192.168.0.103' in pve_hosts"          # pve-laptop-01
          - "'192.168.0.150' in core_cluster"       # dns-01 (LXC)
          - "'192.168.0.151' in core_cluster"       # smtp-relay (LXC)
          # Guests are not Proxmox hosts, and the special entry lands in k3s_nodes.
          - "'192.168.0.150' not in pve_hosts"
          - "'192.168.0.161' in k3s_nodes"          # API VIP (special entry)
          - "'192.168.0.0/24' in admin_lan"
        fail_msg: >-
          An inventory address rendered into the wrong IPSet — check
          firewall_ipsets / firewall_ipset_special_entries and templates/ipsets.j2.

    # The IPSet header comment comes from a built-in map that only describes the
    # sets this collection ships. A site-declared scope (dns_clients,
    # lan_clients, …) has no entry, and the header line must then be omitted
    # entirely rather than rendering an empty `# `.
    - name: Site-declared IPSets render no empty header comment
      vars:
        dns_clients: "{{ cluster_fw_sections.get('IPSET dns_clients', '') }}"
        empty_comment_lines: >-
          {{ cluster_fw_text | regex_findall('^#[ \t]*$', multiline=True) }}
      ansible.builtin.assert:
        that:
          - empty_comment_lines | length == 0
          - "'192.168.0.0/24' in dns_clients"
          - "'# K3s cluster nodes + API VIP' in cluster_fw_text"
        fail_msg: >-
          cluster.fw carries a bare `# ` line, or a described set lost its
          header comment — check the ipset_comments lookup in
          templates/ipsets.j2.

    - name: Host.fw exists
      ansible.builtin.stat:
        path: "{{ host_fw }}"
      register: host_fw_stat
      failed_when: not host_fw_stat.stat.exists

    - name: Read host.fw
      ansible.builtin.slurp:
        src: "{{ host_fw }}"
      register: host_fw_content

    - name: Host.fw enables the firewall and references the right groups
      vars:
        host_fw_text: "{{ host_fw_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'enable: 1' in host_fw_text"
          - "'log_level_in: nolog' in host_fw_text"
          - "'GROUP sg-pve-cluster' in host_fw_text"
          - "'GROUP sg-host-admin' in host_fw_text"
          - "'GROUP sg-metrics' in host_fw_text"
          # proxmox_role: nas on this platform adds the file-server groups.
          - "'GROUP sg-nfs-server' in host_fw_text"
          - "'GROUP sg-smb-server' in host_fw_text"
          # Egress filtering is off by default: no allowlist, no trailing DROP.
          - "'GROUP sg-host-egress' not in host_fw_text"
          - "'OUT DROP' not in host_fw_text"
        fail_msg: >-
          host.fw is missing a base group reference, or rendered the egress
          default-deny while proxmox_firewall_egress_filtering is false.

    - name: Per-guest 100.fw exists
      ansible.builtin.stat:
        path: "{{ guest_fw }}"
      register: guest_fw_stat
      failed_when: not guest_fw_stat.stat.exists

    - name: Read 100.fw
      ansible.builtin.slurp:
        src: "{{ guest_fw }}"
      register: guest_fw_content

    - name: Per-guest 100.fw has expected GROUP refs
      ansible.builtin.assert:
        that:
          - "'[OPTIONS]' in (guest_fw_content.content | b64decode)"
          - "'enable: 1' in (guest_fw_content.content | b64decode)"
          - "'GROUP sg-vm-admin' in (guest_fw_content.content | b64decode)"
          - "'GROUP sg-dns' in (guest_fw_content.content | b64decode)"
          - "'GROUP sg-metrics' in (guest_fw_content.content | b64decode)"

    # Each guest must render to its OWN <vmid>.fw: the platform uses vmid 100 so
    # it never shares a file with dns-01 (150) or smtp-relay (151), where two
    # hosts would overwrite each other's render every converge.
    - name: Verify per-vmid file separation (vmid-collision regression guard)
      ansible.builtin.stat:
        path: "/tmp/pve-firewall-test/firewall/150.fw"
      register: dns01_guest_fw_stat

    - name: Assert dns-01's 150.fw rendered to its own file
      ansible.builtin.assert:
        that:
          - dns01_guest_fw_stat.stat.exists
        fail_msg: >-
          /tmp/pve-firewall-test/firewall/150.fw missing — dns-01's
          guest firewall didn't render. If the molecule platform's
          vmid was bumped to 150, the docker-platform render would
          have overwritten dns-01's file path. Check
          molecule.yml host_vars.proxmox-firewall-test.vmid.

    - name: Read dns-01's 150.fw
      ansible.builtin.slurp:
        src: "/tmp/pve-firewall-test/firewall/150.fw"
      register: dns01_guest_fw_content

    - name: Assert 100.fw and 150.fw carry their respective inventory_hostname
      ansible.builtin.assert:
        that:
          - "'Guest: proxmox-firewall-test' in (guest_fw_content.content | b64decode)"
          - "'Guest: dns-01' in (dns01_guest_fw_content.content | b64decode)"
        fail_msg: >-
          Per-vmid files don't carry the matching inventory_hostname
          comment line — most likely the molecule platform reused a
          vmid from another platform entry and the renders
          collided. 100.fw should mention proxmox-firewall-test;
          150.fw should mention dns-01.

    # Coverage for the guest_firewall_policy_out egress-DROP branch:
    # smtp-relay (151) sets guest_firewall_policy_out: DROP in molecule.yml,
    # so its .fw must render the enforced default-deny egress policy; dns-01
    # (150) leaves it unset, so its .fw must omit policy_out entirely.
    - name: Read smtp-relay's 151.fw
      ansible.builtin.slurp:
        src: "/tmp/pve-firewall-test/firewall/151.fw"
      register: smtp_guest_fw_content

    - name: Assert policy_out DROP renders when enforced and is omitted otherwise
      ansible.builtin.assert:
        that:
          - "'policy_out: DROP' in (smtp_guest_fw_content.content | b64decode)"
          - "'policy_out:' not in (dns01_guest_fw_content.content | b64decode)"
        fail_msg: >-
          guest_firewall_policy_out rendering wrong — 151.fw (smtp-relay)
          should carry 'policy_out: DROP' and 150.fw (dns-01) should omit
          policy_out. Check the conditional in guest.fw.j2.

    # This play MUST stay scoped to proxmox-firewall-test: a `hosts: all` here
    # picks up the local-connection placeholder hosts, which cannot see files
    # written via docker exec. The assertion below catches a future broadening
    # by requiring the recap to cover exactly one host.
    - name: Assert verify play is scoped to the docker platform only
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - ansible_play_hosts_all | first == 'proxmox-firewall-test'
        fail_msg: >-
          verify.yml ran against {{ ansible_play_hosts_all | length }}
          hosts ({{ ansible_play_hosts_all | join(', ') }}); should be
          just 'proxmox-firewall-test'. The local-connection placeholder
          hosts can't see files written via docker-exec to the container.

    # Cross-play run-once guard: the second converge play captured
    # _proxmox_firewall_cluster_done BEFORE re-including the role, so it must
    # already be true — later plays read it from hostvars and skip cluster.fw.
    # (Its pveum twin is untestable here: molecule forces skip_pveum true.)
    - name: Read cross-play guard capture
      ansible.builtin.slurp:
        src: /tmp/pve-firewall-test/cross-play-guard.json
      register: cross_play_guard

    - name: Assert run-once fact was already set when the second play started
      ansible.builtin.assert:
        that:
          - (cross_play_guard.content | b64decode | from_json).cluster_done_before_second_include
        fail_msg: >-
          _proxmox_firewall_cluster_done was not visible to the second play —
          the cross-play run-once guard would re-deploy cluster.fw on
          every including play. Check the delegate_facts set_fact on
          groups['proxmox'][0] in tasks/main.yml.
