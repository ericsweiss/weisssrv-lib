---
platforms:
  - name: proxmox-firewall-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
    groups:
      - proxmox
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        proxmox_firewall_config_dir: /tmp/pve-firewall-test/firewall
        proxmox_firewall_node_dir: /tmp/pve-firewall-test/nodes
        proxmox_firewall_skip_pveum: true
        proxmox_firewall_admin_lan_cidrs:
          - 192.168.0.0/24
        proxmox_firewall_wan_wireguard_vips:
          - 192.168.0.99
        # Stands in for a site's per-application groups (the role default is
        # empty). Exercises verbatim rule/comment emission and a `rules` value
        # supplied as an expression, which must evaluate to a LIST.
        molecule_authless_api_clients:
          - 192.168.0.157
        proxmox_firewall_security_groups:
          - name: sg-example-web
            rules:
              - "# ingress -> app TLS"
              - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
              - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog"
          - name: sg-example-authless
            # Escaped as `$$`: molecule runs this whole file (comments included)
            # through a string.Template pass — the one that resolves
            # ${MOLECULE_TEST_IMAGE} above — BEFORE the YAML parse, and a bare
            # dollar there is an invalid placeholder that aborts the scenario.
            # The escape collapses back to the single end-of-string anchor the
            # regex_replace needs.
            rules: >-
              {{ molecule_authless_api_clients
                 | map('regex_replace', '^', 'IN ACCEPT -source ')
                 | map('regex_replace', '$$', ' -p tcp -dport 3003 -log nolog')
                 | list }}
        proxmox_firewall_extra_aliases:
          - name: api-vip
            cidr: 192.168.0.161
            comment: k3s API VIP
        firewall_ipset_special_entries:
          k3s_nodes:
            - ip: 192.168.0.161
              comment: k3s API VIP
    host_vars:
      proxmox-firewall-test:
        proxmox_firewall_node_ip: 192.168.0.102
        proxmox_role: nas
        firewall_ipsets:
          - pve_hosts
          - core-cluster
          - nfs_clients
        vmid: 100
        guest_security_groups:
          - sg-vm-admin
          - sg-dns
          - sg-metrics
    hosts:
      proxmox:
        hosts:
          pve-nas-01:
            ansible_host: 192.168.0.102
            ansible_connection: local
            proxmox_role: nas
            firewall_ipsets:
              - pve_hosts
              - core-cluster
              - nfs_clients
          pve-laptop-01:
            ansible_host: 192.168.0.103
            ansible_connection: local
            proxmox_role: compute
            firewall_ipsets:
              - pve_hosts
              - core-cluster
              - nfs_clients
          pve-opt-01:
            ansible_host: 192.168.0.104
            ansible_connection: local
            proxmox_role: compute
            firewall_ipsets:
              - pve_hosts
              - core-cluster
              - nfs_clients
      dns:
        hosts:
          dns-01:
            ansible_host: 192.168.0.150
            ansible_connection: local
            vmid: 150
            firewall_alias: dns-01
            firewall_alias_comment: Primary DNS server
            firewall_ipsets:
              - core-cluster
            guest_security_groups:
              - sg-vm-admin
              - sg-dns
              - sg-metrics
          smtp-relay:
            ansible_host: 192.168.0.151
            ansible_connection: local
            vmid: 151
            firewall_ipsets:
              - core-cluster
            guest_firewall_policy_out: "DROP"
            guest_security_groups:
              - sg-vm-admin
              - sg-smtp-relay
              - sg-metrics
