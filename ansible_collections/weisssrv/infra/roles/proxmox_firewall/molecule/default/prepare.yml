---
- name: Prepare
  # Only target the real Docker-backed molecule platform. The scenario's other
  # inventory hosts are `ansible_connection: local` hostvar fixtures, and
  # `systemctl is-system-running` against the molecule pod hangs the retry loop.
  hosts: proxmox-firewall-test
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    # Pre-create the per-node parent dir; the role's "ensure firewall dir"
    # task only handles the firewall subdir.
    - name: Create stub Proxmox config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/pve-firewall-test/firewall
        - /tmp/pve-firewall-test/nodes/proxmox-firewall-test
      become: true
