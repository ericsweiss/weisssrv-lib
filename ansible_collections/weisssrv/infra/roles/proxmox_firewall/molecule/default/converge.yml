---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"
  roles:
    - role: weisssrv.infra.proxmox_firewall

# Second play in the SAME invocation, proving the cross-play run-once guard: the
# first play must have set _proxmox_firewall_cluster_done on the delegate (the
# docker platform here, which is also what lets verify slurp cluster.fw), so this
# play captures the fact's pre-include value before re-including the role.
- name: Cross-play guard — second include must see the run-once fact already set
  hosts: proxmox-firewall-test
  become: true
  tasks:
    # Self-contained: don't rely on the first play's role run having created the
    # dir (the copy below would fail if proxmox_firewall_config_dir ever changes).
    - name: Ensure the cross-play guard output directory exists
      ansible.builtin.file:
        path: /tmp/pve-firewall-test
        state: directory
        mode: "0755"

    - name: Capture _proxmox_firewall_cluster_done as seen at the start of a later play
      ansible.builtin.copy:
        dest: /tmp/pve-firewall-test/cross-play-guard.json
        mode: "0644"
        content: |
          {"cluster_done_before_second_include":
           {{ hostvars[groups['proxmox'] | first]['_proxmox_firewall_cluster_done']
              | default(false) | to_json }}}

    - name: Re-include proxmox_firewall in a second play (guard should skip cluster.fw)
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_firewall
