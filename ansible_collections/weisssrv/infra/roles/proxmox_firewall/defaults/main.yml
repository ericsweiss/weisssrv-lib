---
proxmox_firewall_enabled: true

# host.fw inbound drop logging. policy_in is DROP, so flipping this to "info"
# (per host_vars or globally) makes dropped-inbound packets visible in the
# kernel log for triage — pve-firewall rate-limits its own logging
# (log_ratelimit), so "info" is safe to leave on during an incident.
proxmox_firewall_log_level_in: nolog

# Host-originated egress filtering (default-deny OUT on the node itself, NOT
# guests). OFF by default because a missing allowlist entry breaks the host
# (and possibly remote access). When enabled, host.fw applies the sg-host-egress
# allowlist (cluster.fw.j2) and appends an explicit `OUT DROP -log info` rule —
# pve-firewall ignores the host-level policy_out option, so the trailing DROP
# rule (not a policy setting) is what enforces default-deny. ENABLE PER HOST AND
# VERIFY with `pve-firewall compile` — see the role README "Egress filtering"
# section. Override per-host in host_vars to roll out gradually (one node first).
proxmox_firewall_egress_filtering: false

# Filesystem paths for the Proxmox firewall config. Defaults match the real
# clustered FUSE filesystem; molecule scenarios override these to redirect
# template writes to a stub directory.
proxmox_firewall_config_dir: /etc/pve/firewall
proxmox_firewall_node_dir: /etc/pve/nodes
# Staging directory on the node's NORMAL root filesystem (never /etc/pve). The
# .fw configs are rendered here first, then published into pmxcfs with a plain
# `cp` — pmxcfs rejects the metadata syscalls (utime/chmod/chown) that
# template/copy's atomic_move performs, so a direct template write to /etc/pve
# false-fails on first create. See tasks/deploy-pmxcfs-config.yml.
proxmox_firewall_staging_dir: /var/lib/pve-firewall-ansible
# When true, skip pveum / pve-firewall systemd tasks so the role can run in
# a container without the real Proxmox CLI.
proxmox_firewall_skip_pveum: false

# Inventory group holding the Proxmox nodes.
proxmox_firewall_host_group: proxmox

# Address sets are derived from inventory: each host's `firewall_ipsets` list,
# plus `firewall_ipset_special_entries` for addresses that are not inventory
# hosts (VIPs). [ALIASES] works the same way — a host sets `firewall_alias`
# (and optionally `firewall_alias_comment`).
#
# proxmox_firewall_admin_lan_cidrs is REQUIRED and deliberately has no default:
# an empty admin set locks :22 and :8006 out on every node, so the render must
# fail loudly rather than quietly produce that.
proxmox_firewall_admin_ts_cidrs:
  - 100.64.0.0/10  # Tailscale CGNAT range
proxmox_firewall_smb_client_cidrs: "{{ proxmox_firewall_admin_lan_cidrs }}"

# Aliases for addresses that are not inventory hosts. An entry here overrides a
# derived alias of the same name. Each item: {name, cidr, comment?}.
proxmox_firewall_extra_aliases: []

# Sources admitted to the authless Immich ML inference port (sg-immich-ml).
proxmox_firewall_immich_ml_clients: []
# Load-balancer VIPs the WAN WireGuard endpoint is scoped to (sg-k3s-ingress-pub).
proxmox_firewall_wan_wireguard_vips: []

# Per-application security groups, rendered into cluster.fw after the
# infrastructure groups the role owns itself (sg-dns, sg-host-admin,
# sg-vm-admin, sg-k3s-*, sg-nfs-server, sg-metrics, sg-pve-cluster,
# sg-smb-server, sg-smtp-relay, sg-host-egress). This is the extension point:
# a site adds, removes or replaces whole groups here without forking the
# template, then references them from its guests' .fw entries.
#
# Each entry is {name, rules}. `rules` is a list of raw cluster.fw lines,
# comments included, emitted verbatim in order — pve-firewall is first-match-
# wins within a group, so order is load-bearing.
#
# EXAMPLE SET / OVERRIDE ME: the default below is weisssrv's own inventory,
# kept so the shipped rendering is unchanged. The applications it describes
# (GitLab, Nextcloud, Immich, Home Assistant, Plex, a Windows guest) are NOT
# part of this collection — replace the whole list with the site's own groups.
proxmox_firewall_security_groups:
  - name: sg-gitlab
    rules:
      - "# GitLab Web — Traefik connects to the guest's nginx on 443 with the"
      - "# distributed wildcard cert."
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog"
      - "# Port 80 — Omnibus nginx still listens on it for the HTTP->HTTPS"
      - "# redirect. Admin sources only; k3s_nodes goes straight to 443."
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 80 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 80 -log nolog"
      - "# GitLab Container Registry (port 5050, routed via Traefik)"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 5050 -log nolog"
      - "# GitLab Pages (pages_nginx TLS on 8443, routed via Traefik)"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 8443 -log nolog"
      - "# GitLab SSH (Git protocol on port 2222) - INTENTIONALLY open to WAN for external Git access"
      - "# Security: Protected by fail2ban (gitlab-ssh jail) with aggressive sshd filter"
      - "# Monitoring: SSH auth failures logged to systemd journal, banned after 5 failures for 1 hour"
      - "IN ACCEPT -p tcp -dport 2222 -log nolog"
      - "# GitLab SSH (Git protocol on port 22 for internal LAN access)"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 22 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 22 -log nolog"

  - name: sg-nextcloud
    rules:
      - "# Nextcloud web — host nginx terminates 443 with the distributed wildcard cert;"
      - "# Traefik (k3s_nodes) proxies to it, admin sources allowed for direct debug."
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog"
      - "# nextcloud-exporter (:9205), scraped by the in-cluster Prometheus."
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9205 -log nolog"

  - name: sg-immich
    rules:
      - "# Immich web — host nginx terminates 443 with the distributed wildcard cert;"
      - "# Traefik connects to it with serversTransport vm-tls-wildcard."
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog"
      - "# Immich native Prometheus telemetry (immich-server): API 8081 + microservices"
      - "# 8082, scraped by the in-cluster ServiceMonitor. k3s SNATs pod traffic to node"
      - "# IPs, so k3s_nodes is the scrape source. (sg-metrics covers node_exporter :9101.)"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 8081 -log nolog"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 8082 -log nolog"

  - name: sg-immich-ml
    # The ML API is AUTHLESS by upstream design — anyone who can reach :3003 can
    # run inference against it — so this group IS the security boundary: admit
    # ONLY proxmox_firewall_immich_ml_clients. No admin/LAN debug access on
    # purpose (SSH/ICMP admin comes from sg-vm-admin). Empty list = admits
    # nothing, which is the safe default. Prefix-then-suffix rather than a
    # backreference so no escaping is involved.
    rules: >-
      {{ proxmox_firewall_immich_ml_clients
         | map('regex_replace', '^', 'IN ACCEPT -source ')
         | map('regex_replace', '$', ' -p tcp -dport 3003 -log nolog')
         | list }}

  - name: sg-haos
    rules:
      - "IN ACCEPT -source +dc/admin_lan -p udp -dport 1900 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p udp -dport 5353 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 8123 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 8123 -log nolog"
      - "# SSH add-on (port 22222)"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 22222 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 22222 -log nolog"
      - "# ICMP from admin sources for ping/traceroute during triage (a conntrack"
      - "# incident is materially harder to diagnose without it)."
      - "IN ACCEPT -source +dc/admin_ts -p icmp -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p icmp -log nolog"

  - name: sg-plex
    rules:
      - "# DLNA/GDM discovery + companion ports stay LAN-only (no remote use case)."
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 32469 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p udp -dport 32410:32414 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p udp -dport 1900 -log nolog"
      - "# Plex media port 32400 - INTENTIONALLY open to WAN for direct remote streaming."
      - "# Accepted risk: the router forwards 32400/tcp to the Plex guest, so"
      - "# remote clients stream directly instead of via the bandwidth-limited plex.tv"
      - "# relay. Plex authenticates every remote session against plex.tv before serving"
      - "# media, so this is an authenticated endpoint, not an open share. Restricting the"
      - "# source here would force all remote playback through the relay (degraded quality)"
      - "# or require a per-client VPN. Revisit if direct remote access is dropped."
      - "IN ACCEPT -p tcp -dport 32400 -log nolog"

  - name: sg-windows
    rules:
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 3389 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 3389 -log nolog"
