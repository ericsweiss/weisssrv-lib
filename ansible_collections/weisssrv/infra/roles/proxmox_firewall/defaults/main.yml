---
proxmox_firewall_enabled: true

# host.fw inbound drop logging. policy_in is DROP, so flipping this to "info"
# (per host or globally) makes dropped-inbound packets visible in the kernel log
# for triage — pve-firewall rate-limits its own logging, so "info" is safe to
# leave on during an incident.
proxmox_firewall_log_level_in: nolog

# Host-originated egress filtering (default-deny OUT on the node itself, NOT
# guests). OFF by default because a missing allowlist entry can cut the node off.
# When enabled, host.fw applies the sg-host-egress allowlist and appends an
# explicit `OUT DROP -log info` — pve-firewall ignores the host-level policy_out
# option, so that trailing rule is what enforces default-deny. Verify with
# `pve-firewall compile`; rollout steps are in the role README.
proxmox_firewall_egress_filtering: false

# Filesystem paths for the Proxmox firewall config. Defaults match the real
# clustered FUSE filesystem; molecule scenarios override these to redirect
# template writes to a stub directory.
proxmox_firewall_config_dir: /etc/pve/firewall
proxmox_firewall_node_dir: /etc/pve/nodes
# Staging directory on the node's NORMAL root filesystem (never /etc/pve). The
# .fw configs are rendered here first, then published into pmxcfs with a plain
# `cp` — see tasks/deploy-pmxcfs-config.yml.
proxmox_firewall_staging_dir: /var/lib/pve-firewall-ansible
# When true, skip pveum / pve-firewall systemd tasks so the role can run in
# a container without the real Proxmox CLI.
proxmox_firewall_skip_pveum: false

# Inventory group holding the Proxmox nodes.
proxmox_firewall_host_group: proxmox

# Address sets are derived from inventory: each host's `firewall_ipsets` list,
# plus `firewall_ipset_special_entries` for addresses that are not inventory
# hosts (VIPs). [ALIASES] works the same way — a host sets `firewall_alias`
# (and optionally `firewall_alias_comment`).
#
# proxmox_firewall_admin_lan_cidrs is REQUIRED and deliberately has no default:
# an empty admin set locks :22 and :8006 out on every node, so the render must
# fail loudly rather than quietly produce that.
proxmox_firewall_admin_ts_cidrs:
  - 100.64.0.0/10  # Tailscale CGNAT range
proxmox_firewall_smb_client_cidrs: "{{ proxmox_firewall_admin_lan_cidrs }}"

# Aliases for addresses that are not inventory hosts. An entry here overrides a
# derived alias of the same name. Each item: {name, cidr, comment?}.
proxmox_firewall_extra_aliases: []

# Load-balancer VIPs the WAN WireGuard endpoint is scoped to
# (sg-k3s-ingress-pub). Empty = no WAN WireGuard rule at all.
proxmox_firewall_wan_wireguard_vips: []

# Admin surfaces of the DNS appliances, rendered into sg-dns. Entry schema is
# shared with proxmox_firewall_metrics_scrape_ports below and asserted in
# tasks/main.yml: {port, sources[], comment?}, where `sources` names IPSets or
# aliases and must be non-empty. The default keeps the resolver UI/API on the
# two admin sets only — the plaintext :3000 API carries a reusable admin
# credential, so any in-cluster scraper that needs it must be added here
# deliberately.
proxmox_firewall_dns_admin_ports:
  - port: 443
    sources: [admin_ts, admin_lan]
    comment: resolver HTTPS admin UI
  - port: 3000
    sources: [admin_ts, admin_lan]
    comment: resolver plaintext admin API

# Application scrape targets appended to sg-metrics. Same entry schema as
# proxmox_firewall_dns_admin_ports above — {port, sources[], comment?} — so the
# two hand-authored lists a site writes next to each other take the same shape.
# sg-metrics is applied on EVERY node, so only the exporters this collection's
# own roles bind are built in; an app's port here opens fleet-wide, which is why
# its scrapers are named rather than defaulted.
proxmox_firewall_metrics_scrape_ports: []

# Open the cleartext Proxmox live-migration channel (TCP 60000-60050) in
# sg-pve-cluster and sg-host-egress. Off: the cluster runs the secure
# SSH-tunnelled channel (weisssrv.infra.proxmox_ha pins `migration: type=secure`
# in datacenter.cfg), so the range carries nothing and pre-authorising it would
# make a flip to `insecure` invisible at the packet filter.
proxmox_firewall_insecure_migration_ports: false

# Per-application security groups, rendered into cluster.fw after the
# infrastructure groups the role owns itself (sg-dns, sg-host-admin,
# sg-vm-admin, sg-k3s-*, sg-nfs-server, sg-metrics, sg-pve-cluster,
# sg-smb-server, sg-smtp-relay, sg-host-egress). This is the extension point:
# a site adds, removes or replaces whole groups here without forking the
# template, then references them from its guests' guest_security_groups.
#
# Each entry is {name, rules}; `rules` is a list of raw cluster.fw lines,
# comments included, emitted verbatim in order (pve-firewall is first-match-wins
# within a group). Empty by default so a site that has not supplied its groups
# renders none — never another deployment's rules. Worked example: role README.
proxmox_firewall_security_groups: []
