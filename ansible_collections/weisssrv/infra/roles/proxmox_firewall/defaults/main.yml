---
# Render and deploy the firewall config: cluster.fw, host.fw and the guest
# <vmid>.fw files. proxmox_firewall_skip_pveum additionally gates everything
# needing the Proxmox CLI: the service, `pve-firewall compile`, monitoring@pve.
proxmox_firewall_enabled: true

# host.fw inbound drop logging. policy_in is DROP, so "info" (per host or
# globally) makes dropped-inbound packets visible for triage; pve-firewall
# rate-limits its own logging, so it is safe to leave on during an incident.
proxmox_firewall_log_level_in: nolog

# Select the nftables firewall implementation (the proxmox-firewall package) on
# this host instead of the iptables pve-firewall. PVE 9, and omitted from
# host.fw when false, so a node keeps whichever implementation it runs today.
proxmox_firewall_nftables: false

# Host-originated egress filtering (default-deny OUT on the node itself, NOT
# guests). OFF by default because a missing allowlist entry can cut the node off.
# Rollout steps and the trailing-DROP mechanics are in the role README.
proxmox_firewall_egress_filtering: false

# Filesystem paths for the Proxmox firewall config. Defaults match the real
# clustered FUSE filesystem; molecule scenarios override these to redirect
# template writes to a stub directory.
proxmox_firewall_config_dir: /etc/pve/firewall
proxmox_firewall_node_dir: /etc/pve/nodes
# Staging directory on the node's NORMAL root filesystem (never /etc/pve): the
# .fw configs are rendered here, then published into pmxcfs with a plain `cp`.
proxmox_firewall_staging_dir: /var/lib/pve-firewall-ansible
# When true, skip pveum / pve-firewall systemd tasks so the role can run in
# a container without the real Proxmox CLI.
proxmox_firewall_skip_pveum: false

# pve-firewall can exit 0 on a parse error, so the compile check tests stderr
# too. Patterns match case-insensitively, and a `(line N)` complaint is a parse
# error whatever its wording. Healthy hosts emit notices, so never match all.
proxmox_firewall_compile_error_patterns:
  - error
  - unable to
  - skip line
  - "no such "
  - "invalid "
  - "unknown "
proxmox_firewall_compile_fail_on_line_errors: true
# Shared predicate for both compile checks; each registers proxmox_firewall_compile.
proxmox_firewall_compile_failed: >-
  {{ (proxmox_firewall_compile.rc | default(0)) != 0
     or (proxmox_firewall_compile_error_patterns
         | select('in', proxmox_firewall_compile.stderr | default('') | lower)
         | list | length) > 0
     or ((proxmox_firewall_compile_fail_on_line_errors | bool)
         and (proxmox_firewall_compile.stderr | default('')) is search('\(line [0-9]+\)')) }}

# Inventory group holding the Proxmox nodes.
proxmox_firewall_host_group: proxmox

# CRITICAL: proxmox_firewall_admin_lan_cidrs is REQUIRED and has no default —
# an empty admin set locks :22 and :8006 out on every node.

# Address sets derive from inventory: each host's `firewall_ipsets`, plus
# `firewall_ipset_special_entries` for non-inventory addresses. [ALIASES]
# works the same way, from `firewall_alias`. See README.
proxmox_firewall_admin_ts_cidrs:
  - 100.64.0.0/10  # Tailscale CGNAT range
proxmox_firewall_smb_client_cidrs: "{{ proxmox_firewall_admin_lan_cidrs }}"

# Aliases for addresses that are not inventory hosts. An entry here overrides a
# derived alias of the same name. Each item: {name, cidr, comment?}.
proxmox_firewall_extra_aliases: []

# Load-balancer VIPs the WAN WireGuard endpoint is scoped to
# (sg-k3s-ingress-pub). Empty = no WAN WireGuard rule at all.
proxmox_firewall_wan_wireguard_vips: []

# Admin surfaces of the DNS appliances, rendered into sg-dns. Entry schema
# {port, sources[], comment?}, asserted in tasks/assert_port_lists.yml. The
# default keeps the credentialed resolver UI/API on the two admin sets only.
proxmox_firewall_dns_admin_ports:
  - port: 443
    sources: [admin_ts, admin_lan]
    comment: resolver HTTPS admin UI
  - port: 3000
    sources: [admin_ts, admin_lan]
    comment: resolver plaintext admin API
# IPSet names scoping the two SERVICE surfaces: :53 (sg-dns) and :80/:443
# (sg-k3s-ingress-int). Non-empty lists of IPSet names, one `+dc/<name>` rule
# each — a segmented site points them at its own client sets, see README.
proxmox_firewall_dns_client_sources: [admin_ts, admin_lan]
proxmox_firewall_k3s_ingress_int_sources: [admin_ts, admin_lan]

# Application scrape targets appended to sg-metrics, same {port, sources[],
# comment?} schema. sg-metrics applies on EVERY node, so a port here opens
# fleet-wide — only this collection's own exporters are built in.
proxmox_firewall_metrics_scrape_ports: []

# Client scope for sg-smtp-relay's :25 and :587. Empty renders no IN rule, so
# the relay is unreachable until the site names its client sets. The extra
# egress ports ({port, proto, comment?}) are inert until the guest drops OUT.
proxmox_firewall_smtp_relay_sources: []
proxmox_firewall_smtp_relay_extra_egress_ports: []

# Site services the nodes themselves reach, appended to the sg-host-egress
# allowlist in cluster.fw (cluster scope). Each item: {port, proto, comment?};
# only enforced on hosts where proxmox_firewall_egress_filtering is true.
proxmox_firewall_host_egress_extra_ports: []

# Open the cleartext Proxmox live-migration channel (TCP 60000-60050) in
# sg-pve-cluster and sg-host-egress. Off: the cluster runs the SSH-tunnelled
# channel, and pre-authorising the range would hide a flip to `insecure`.
proxmox_firewall_insecure_migration_ports: false

# Per-application security groups, rendered into cluster.fw after the
# infrastructure groups the role owns. Each entry is {name, rules}; `rules` is a
# list of raw cluster.fw lines emitted verbatim, in order. Example: role README.
proxmox_firewall_security_groups: []

# The proxmox_role value that inherits the file-server groups (sg-nfs-server,
# sg-smb-server) in host.fw, and extra `GROUP <name>` references appended to a
# node's host.fw after the built-ins. Host scope, both.
proxmox_firewall_storage_role_name: nas
proxmox_firewall_host_extra_groups: []

# CRITICAL: pve-firewall is first-match-wins and position differs between the
# two files. cluster.fw's `[RULES]` is last; host.fw renders these FIRST, ahead
# of the security groups and the egress DROP, so a host rule outranks them all.
# Raw lines, emitted verbatim in order.
proxmox_firewall_cluster_rules: []
proxmox_firewall_host_rules: []
