---
# Guest .fw configs live on the shared pmxcfs (/etc/pve/firewall/<vmid>.fw), so
# ANY reachable Proxmox node can write them: use the delegate main.yml probed
# for reachability rather than pinning the host group's first member, whose
# being down would fail every guest firewall deploy.
- name: Deploy guest firewall configuration
  ansible.builtin.include_tasks:
    file: deploy-pmxcfs-config.yml
    apply:
      become: true
      delegate_to: "{{ firewall_deploy_host | default(_proxmox_firewall_delegate | default(groups[proxmox_firewall_host_group][0])) }}"
  vars:
    pmxcfs_config_src: guest.fw.j2
    pmxcfs_config_dest: "{{ proxmox_firewall_config_dir }}/{{ vmid }}.fw"
    pmxcfs_config_label: "{{ vmid }}.fw"
  when:
    - guest_security_groups is defined
    - guest_security_groups | length > 0
    - vmid is defined
