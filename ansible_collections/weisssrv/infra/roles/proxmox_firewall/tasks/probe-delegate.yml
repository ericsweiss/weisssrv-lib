---
# Probe ONE Proxmox host and record it in _proxmox_firewall_reachable when it
# answers. Must stay a looped INCLUDE around a SINGLE delegated ping, never a
# looped ping: an unreachable looped delegate ends the play with rc 0 despite
# ignore_unreachable, turning the whole fleet's deploy into a green no-op.
- name: Probe for reachability — {{ _proxmox_firewall_probe_host }}
  ansible.builtin.ping:
  delegate_to: "{{ _proxmox_firewall_probe_host }}"
  ignore_unreachable: true
  # A module-level failure (reachable host, broken python; or the molecule
  # scenario's connection:local stand-ins, which fail become) must not abort the
  # deploy either — only a real pong is recorded.
  failed_when: false
  changed_when: false
  register: _proxmox_firewall_probe

- name: Record as reachable — {{ _proxmox_firewall_probe_host }}
  ansible.builtin.set_fact:
    _proxmox_firewall_reachable: "{{ (_proxmox_firewall_reachable | default([])) + [_proxmox_firewall_probe_host] }}"
  when: _proxmox_firewall_probe.ping | default('') == 'pong'
