---
# Schema guard for every hand-authored source list this role renders: the two
# port lists ({port, sources[], comment?}) and the two flat client-scope lists.
# cluster.fw.j2 dereferences each with no default, so a typo or a missing key
# would otherwise surface as a raw undefined-variable error from mid-render
# instead of a message naming the variable and the entry.
#
# `sources` is asserted to be a LIST, not just non-empty: a scalar
# (`sources: k3s_nodes`) has a length too, and the template's
# `{% for src in entry.sources %}` iterates it per character — one rule per
# letter, each naming an IPSet that does not exist, which pve-firewall then
# refuses to compile. Singular-vs-plural is the likely author error here,
# because the metrics seam's key was `source` (a scalar) before this release.
# A MAPPING is rejected for the same reason it is not a list, even though
# iterating one happens to yield its keys.
#
# `port` is asserted to have a VALUE, not merely to be defined: `port:` with the
# number omitted on the next line is `defined` and null, and the template
# renders it as `-dport None` into cluster.fw — a datacenter-wide file
# pve-firewall refuses to compile, written and handler-notified before anyone
# sees it.
#
# Split into its own file so molecule can drive it from fabricated inventory.

- name: Assert the sg-dns admin-port entries carry a port and a list of sources
  ansible.builtin.assert:
    that:
      - item.port is defined
      - item.port is not none
      - item.sources is defined
      - item.sources is sequence
      - item.sources is not string
      - item.sources is not mapping
      - item.sources | length > 0
    fail_msg: >-
      proxmox_firewall_dns_admin_ports entry {{ item }} is malformed: every
      entry needs a `port` with a value and a non-empty `sources` LIST naming
      IPSets (e.g. `- {port: 3000, sources: [admin_ts, admin_lan]}`)
      — a bare scalar is iterated per character by the template, and an empty
      `port` renders as `-dport None`.
    quiet: true
  loop: "{{ proxmox_firewall_dns_admin_ports | default([]) }}"
  loop_control:
    label: "{{ item.port | default('?') }}"

- name: Assert the sg-metrics scrape-port entries carry a port and a list of sources
  ansible.builtin.assert:
    that:
      - item.port is defined
      - item.port is not none
      - item.sources is defined
      - item.sources is sequence
      - item.sources is not string
      - item.sources is not mapping
      - item.sources | length > 0
    fail_msg: >-
      proxmox_firewall_metrics_scrape_ports entry {{ item }} is malformed:
      every entry needs a `port` with a value and a non-empty `sources` LIST
      naming IPSets (e.g. `- {port: 32400, sources: [k3s_nodes],
      comment: plex}`) — a bare scalar is iterated per character by the
      template, and an empty `port` renders as `-dport None`. sg-metrics is
      applied on EVERY node, so the scrapers are named rather than defaulted.
    quiet: true
  loop: "{{ proxmox_firewall_metrics_scrape_ports | default([]) }}"
  loop_control:
    label: "{{ item.port | default('?') }}"

# The two client-scope lists are flat lists of IPSet names, iterated by
# the same `{% for src in ... %}` construct. Both failure shapes are silent:
# a scalar renders one rule per character naming IPSets that do not exist, and
# an EMPTY list renders the surface with no rules at all — DNS closed on every
# VLAN, or the internal ingress closed to every user — in a cluster.fw that
# compiles perfectly and reports nothing.
#
# The container being a non-empty list says nothing about what is IN it, and the
# template interpolates each element straight into `+dc/{{ src }}`: a null
# renders `+dc/None`, an empty string renders a bare `+dc/`, and a name with a
# space in it splits the rule into two arguments.
#
# Both element tests are needed. `match` STRINGIFIES before matching, so a null
# reaches it as "None" and passes — the same silent conversion the template
# performs — and only the `string` test rejects it (a bare number too). `match`
# is what rejects the empty and whitespace-bearing names the `string` test
# admits.
- name: Assert the client-scope source lists are non-empty lists of set names
  ansible.builtin.assert:
    that:
      - lookup('vars', item) is sequence
      - lookup('vars', item) is not string
      - lookup('vars', item) is not mapping
      - lookup('vars', item) | length > 0
      - lookup('vars', item) | select('string') | list | length == lookup('vars', item) | length
      - lookup('vars', item) | select('match', '^\S+$') | list | length == lookup('vars', item) | length
    fail_msg: >-
      {{ item }} must be a non-empty LIST of non-empty IPSet NAMES
      (e.g. `[admin_ts, dns_clients]`) — cluster.fw.j2 renders each entry as
      `+dc/<name>`, which resolves a datacenter IPSet only (a datacenter ALIAS
      is `dc/<name>`, a different syntax this list does not render). A bare
      scalar is iterated per character into rules naming sets that do not
      exist, an empty list silently removes every rule from the surface it
      scopes, and an element that is null, empty or carries whitespace renders
      `+dc/None`, a bare `+dc/`, or a rule split across an argument boundary.
    quiet: true
  loop:
    - proxmox_firewall_dns_client_sources
    - proxmox_firewall_k3s_ingress_int_sources
