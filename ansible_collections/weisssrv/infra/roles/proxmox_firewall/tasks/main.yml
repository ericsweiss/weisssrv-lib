---
# An empty admin_lan IPSet locks :22 and :8006 out of every node, so name the
# variable here rather than letting cluster.fw.j2 raise an undefined-variable
# error mid-render.
- name: Assert the admin LAN address set is supplied
  ansible.builtin.assert:
    that:
      - proxmox_firewall_admin_lan_cidrs | default([]) | length > 0
    fail_msg: >-
      proxmox_firewall_admin_lan_cidrs is required and has no default — an
      empty admin_lan IPSet would lock SSH (:22) and the Proxmox UI (:8006)
      out of every node.
    quiet: true
  when: proxmox_firewall_enabled | bool

# Schema guard for the two hand-authored port lists, in its own file so molecule
# can drive it from fabricated inventory.
- name: Assert the hand-authored port lists match the shared schema
  ansible.builtin.include_tasks: assert_port_lists.yml
  when: proxmox_firewall_enabled | bool

- name: Ensure Proxmox firewall directory exists
  ansible.builtin.file:
    path: "{{ proxmox_firewall_config_dir }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"
    # /etc/pve is the pmxcfs FUSE filesystem: unsafe_writes is required because it
    # doesn't support Ansible's atomic .tmp + cross-directory rename. Required on
    # every /etc/pve task below; a no-op once the dir exists (create/repair only).
    unsafe_writes: true
  when: inventory_hostname in groups[proxmox_firewall_host_group] | default([])

# Proxmox auto-creates this on cluster join, but ensuring it exists makes the
# role robust on fresh nodes and lets the molecule scenario render host.fw.
- name: Ensure per-node firewall directory exists
  ansible.builtin.file:
    path: "{{ proxmox_firewall_node_dir }}/{{ inventory_hostname }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"
    unsafe_writes: true
  when: inventory_hostname in groups[proxmox_firewall_host_group] | default([])

# Resolve a REACHABLE Proxmox host to carry the cluster-wide tasks rather than
# pinning the group's first member, whose being down would fail every firewall
# and monitoring-user deploy. Probe once, then have every host derive the same
# delegate from the probe runner's fact so the run_once delegate_to and the
# per-host hostvars reads agree — including in guest-only plays. Falls back to
# the first group member when the probe recorded nothing.
- name: Reset the reachability probe results for this play
  ansible.builtin.set_fact:
    _proxmox_firewall_reachable: []
  run_once: true
  when: (groups[proxmox_firewall_host_group] | default([]) | length) > 0

- name: Probe Proxmox hosts for reachability (delegate selection)
  ansible.builtin.include_tasks: probe-delegate.yml
  loop: "{{ groups[proxmox_firewall_host_group] }}"
  loop_control:
    loop_var: _proxmox_firewall_probe_host
    label: "{{ _proxmox_firewall_probe_host }}"
  run_once: true
  when: (groups[proxmox_firewall_host_group] | default([]) | length) > 0

- name: Resolve the first reachable Proxmox host as the cluster-task delegate
  vars:
    # run_once fires once per serial batch, so the probe results live on the
    # first host of the CURRENT batch — read them from there so every host
    # derives the same delegate, serial play or not.
    _proxmox_firewall_reachable_hosts: >-
      {{ hostvars[ansible_play_batch | first]['_proxmox_firewall_reachable'] | default([]) }}
  ansible.builtin.set_fact:
    _proxmox_firewall_delegate: "{{ _proxmox_firewall_reachable_hosts[0] if (_proxmox_firewall_reachable_hosts | length > 0) else groups[proxmox_firewall_host_group][0] }}"
  when: (groups[proxmox_firewall_host_group] | default([]) | length) > 0

# Cross-play guard: cluster.fw and the pveum user/ACL/token are cluster-wide and
# must run ONCE per invocation, but run_once fires once PER PLAY and this role is
# included by several. Completion is therefore a delegate_facts fact on the
# delegate, which later plays read through hostvars.
- name: Deploy cluster firewall configuration
  ansible.builtin.include_tasks:
    file: deploy-pmxcfs-config.yml
    # apply propagates become/delegate_to to every task in the included file
    # (delegate_to is not a valid attribute directly on include_tasks).
    apply:
      become: true
      delegate_to: "{{ _proxmox_firewall_delegate }}"
  vars:
    pmxcfs_config_src: cluster.fw.j2
    pmxcfs_config_dest: "{{ proxmox_firewall_config_dir }}/cluster.fw"
    pmxcfs_config_label: cluster.fw
  # cluster.fw is on the shared /etc/pve filesystem: deploy it once, via a
  # Proxmox node, so the role also works in plays whose hosts are guests.
  run_once: true
  when:
    - proxmox_firewall_enabled | default(true)
    - (groups[proxmox_firewall_host_group] | default([]) | length) > 0
    - not (hostvars[_proxmox_firewall_delegate]['_proxmox_firewall_cluster_done'] | default(false))

- name: Mark cluster firewall configuration as deployed for this run
  ansible.builtin.set_fact:
    _proxmox_firewall_cluster_done: true
  delegate_to: "{{ _proxmox_firewall_delegate }}"
  delegate_facts: true
  run_once: true
  when:
    - proxmox_firewall_enabled | default(true)
    - (groups[proxmox_firewall_host_group] | default([]) | length) > 0

- name: Deploy node-specific host.fw configuration
  ansible.builtin.include_tasks:
    file: deploy-pmxcfs-config.yml
    apply:
      become: true
  vars:
    pmxcfs_config_src: host.fw.j2
    pmxcfs_config_dest: "{{ proxmox_firewall_node_dir }}/{{ inventory_hostname }}/host.fw"
    # Runs on each node itself (no delegate), so the per-node inventory_hostname
    # keeps the staging filename unique across a shared staging dir.
    pmxcfs_config_label: "host-{{ inventory_hostname }}.fw"
  when:
    - proxmox_firewall_enabled | default(true)
    - inventory_hostname in groups[proxmox_firewall_host_group] | default([])

# The firewall is enabled through cluster.fw plus the pve-firewall service. The
# datacenter.cfg "firewall: 1" option is deprecated on PVE 8+ and setting it
# raises "property is not defined in schema".

- name: Ensure pve-firewall service is enabled and running
  ansible.builtin.systemd:
    name: pve-firewall
    state: started
    enabled: true
  when:
    - proxmox_firewall_enabled | default(true)
    - inventory_hostname in groups[proxmox_firewall_host_group] | default([])
    - not (proxmox_firewall_skip_pveum | default(false))

- name: Include guest firewall tasks
  ansible.builtin.include_tasks: guest.yml
  when:
    - vmid is defined
    - guest_security_groups is defined

# Proxmox monitoring user and API token for the Prometheus exporters. PVE user
# management is cluster-wide, so run_once + delegate_to run these on a single
# node, and the _proxmox_firewall_pveum_done fact set below keeps the `pveum …
# list` probes from repeating in every later play that includes this role.
- name: Check if monitoring@pve user exists
  ansible.builtin.command: pveum user list --output-format json
  register: proxmox_firewall_users
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: "{{ _proxmox_firewall_delegate }}"
  when:
    - groups.get(proxmox_firewall_host_group, []) | length > 0
    - not (proxmox_firewall_skip_pveum | default(false))
    - not (hostvars[_proxmox_firewall_delegate]['_proxmox_firewall_pveum_done'] | default(false))

- name: Create monitoring@pve user
  ansible.builtin.command: >
    pveum user add monitoring@pve
    --comment 'Prometheus observability exporter'
  changed_when: true
  run_once: true
  delegate_to: "{{ _proxmox_firewall_delegate }}"
  when:
    - groups.get(proxmox_firewall_host_group, []) | length > 0
    # Explicit skip_pveum gate: `.stdout is defined` alone would let a cached or
    # pre-seeded register fire pveum on a host without the binary.
    - not (proxmox_firewall_skip_pveum | default(false))
    - not (hostvars[_proxmox_firewall_delegate]['_proxmox_firewall_pveum_done'] | default(false))
    - proxmox_firewall_users.stdout is defined
    - >-
      proxmox_firewall_users.stdout | from_json | default([]) |
      selectattr('userid', 'equalto', 'monitoring@pve') |
      list | length == 0

- name: Check PVEAuditor ACL for monitoring@pve
  ansible.builtin.command: pveum acl list --output-format json
  register: proxmox_firewall_acls
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: "{{ _proxmox_firewall_delegate }}"
  when:
    - groups.get(proxmox_firewall_host_group, []) | length > 0
    - not (proxmox_firewall_skip_pveum | default(false))
    - not (hostvars[_proxmox_firewall_delegate]['_proxmox_firewall_pveum_done'] | default(false))

- name: Assign PVEAuditor role to monitoring@pve
  ansible.builtin.command: >
    pveum aclmod / --users monitoring@pve --roles PVEAuditor
  changed_when: true
  run_once: true
  delegate_to: "{{ _proxmox_firewall_delegate }}"
  when:
    - groups.get(proxmox_firewall_host_group, []) | length > 0
    - not (proxmox_firewall_skip_pveum | default(false))
    - not (hostvars[_proxmox_firewall_delegate]['_proxmox_firewall_pveum_done'] | default(false))
    - proxmox_firewall_acls.stdout is defined
    - >-
      proxmox_firewall_acls.stdout | from_json | default([]) |
      selectattr('ugid', 'equalto', 'monitoring@pve') |
      selectattr('path', 'equalto', '/') |
      selectattr('roleid', 'equalto', 'PVEAuditor') |
      list | length == 0

- name: Check if exporter API token exists for monitoring@pve
  ansible.builtin.command: pveum user token list monitoring@pve --output-format json
  register: proxmox_firewall_tokens
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: "{{ _proxmox_firewall_delegate }}"
  when:
    - groups.get(proxmox_firewall_host_group, []) | length > 0
    - not (proxmox_firewall_skip_pveum | default(false))
    - not (hostvars[_proxmox_firewall_delegate]['_proxmox_firewall_pveum_done'] | default(false))

- name: Create exporter API token for monitoring@pve
  ansible.builtin.command: >
    pveum user token add monitoring@pve exporter --privsep 0
  changed_when: true
  no_log: true
  register: proxmox_firewall_token_created
  run_once: true
  delegate_to: "{{ _proxmox_firewall_delegate }}"
  when:
    - groups.get(proxmox_firewall_host_group, []) | length > 0
    - not (proxmox_firewall_skip_pveum | default(false))
    - not (hostvars[_proxmox_firewall_delegate]['_proxmox_firewall_pveum_done'] | default(false))
    - proxmox_firewall_tokens.stdout is defined
    - >-
      (proxmox_firewall_tokens.stdout | from_json | default([]) |
      map(attribute='tokenid') | list) |
      intersect(['exporter', 'monitoring@pve!exporter']) | length == 0

- name: Notify if new API token was created
  ansible.builtin.debug:
    msg: >
      API token monitoring@pve!exporter created. The secret is only printed
      once at creation and was discarded here (no_log) — the Proxmox UI
      cannot re-display it. Recover it as root from /etc/pve/priv/token.cfg
      on any Proxmox node, or rotate it (`pveum user token remove
      monitoring@pve exporter && pveum user token add monitoring@pve exporter
      --privsep 0`) and capture the printed value, then store it in the
      secret store the exporters read.
  run_once: true
  delegate_to: "{{ _proxmox_firewall_delegate }}"
  when:
    - proxmox_firewall_token_created is defined
    - proxmox_firewall_token_created is changed

# Recorded on the delegate (delegate_facts) so later plays that include this
# role read it through hostvars and skip the `pveum … list` probes.
- name: Mark pveum monitoring user/token reconcile as done for this run
  ansible.builtin.set_fact:
    _proxmox_firewall_pveum_done: true
  delegate_to: "{{ _proxmox_firewall_delegate }}"
  delegate_facts: true
  run_once: true
  when:
    - groups.get(proxmox_firewall_host_group, []) | length > 0
    - not (proxmox_firewall_skip_pveum | default(false))
