---
# Publish a rendered Jinja template into pmxcfs (/etc/pve), content only:
# render to staging on the normal root fs, then copy in. template/copy cannot
# write here — pmxcfs rejects the chown/chmod/utime that atomic_move performs.
# Full explanation: role README, "Writing into pmxcfs".
#
# Caller contract (include_tasks vars): pmxcfs_config_src (template filename),
# pmxcfs_config_dest (absolute path inside /etc/pve), pmxcfs_config_label
# (unique, filesystem-safe id, also the staging filename). The caller supplies
# become / delegate_to via `apply:`, and run_once / when on the include itself.

- name: Ensure the pmxcfs firewall staging directory exists
  ansible.builtin.file:
    path: "{{ proxmox_firewall_staging_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render firewall config to staging off pmxcfs for {{ pmxcfs_config_label }}
  ansible.builtin.template:
    src: "{{ pmxcfs_config_src }}"
    dest: "{{ proxmox_firewall_staging_dir }}/{{ pmxcfs_config_label }}"
    owner: root
    group: root
    mode: "0640"
  register: proxmox_firewall_pmxcfs_render

- name: Read the live pmxcfs checksum for {{ pmxcfs_config_label }}
  ansible.builtin.stat:
    path: "{{ pmxcfs_config_dest }}"
    checksum_algorithm: sha1
  register: proxmox_firewall_pmxcfs_live

# Plain `cp` (no -p) issues no post-copy fchmod/chown/utime, so pmxcfs accepts
# it and stamps its own root:www-data 0640. Content-only: reusing this helper
# for a pmxcfs file whose mode carries a write bit would reintroduce the EPERM.
# Comparing render against live pmxcfs gives idempotence and corrects
# out-of-band drift. In --check mode `template` returns no checksum, so this
# guard collapses and the render-to-staging task's `changed` is the signal.
- name: Publish the firewall config into pmxcfs when changed for {{ pmxcfs_config_label }}
  ansible.builtin.command:
    cmd: "cp -- {{ proxmox_firewall_staging_dir }}/{{ pmxcfs_config_label }} {{ pmxcfs_config_dest }}"
  when: >-
    (proxmox_firewall_pmxcfs_render.checksum | default(''))
    != (proxmox_firewall_pmxcfs_live.stat.checksum | default(''))
  changed_when: true
