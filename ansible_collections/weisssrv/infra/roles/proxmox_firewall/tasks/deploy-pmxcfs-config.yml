---
# Publish a rendered template into pmxcfs by staging it on the root fs and
# copying it in. Caller vars: pmxcfs_config_src, pmxcfs_config_dest and a
# unique pmxcfs_config_label. See README, "Writing into pmxcfs".

- name: Ensure the pmxcfs firewall staging directory exists
  ansible.builtin.file:
    path: "{{ proxmox_firewall_staging_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render firewall config to staging off pmxcfs for {{ pmxcfs_config_label }}
  ansible.builtin.template:
    src: "{{ pmxcfs_config_src }}"
    dest: "{{ proxmox_firewall_staging_dir }}/{{ pmxcfs_config_label }}"
    owner: root
    group: root
    mode: "0640"
  register: proxmox_firewall_pmxcfs_render

- name: Read the live pmxcfs checksum for {{ pmxcfs_config_label }}
  ansible.builtin.stat:
    path: "{{ pmxcfs_config_dest }}"
    checksum_algorithm: sha1
  register: proxmox_firewall_pmxcfs_live

# CRITICAL: plain `cp` with no -p issues no post-copy fchmod or chown, which is
# why pmxcfs accepts it and stamps its own root:www-data 0640. This helper is
# content-only; a pmxcfs file needing its own mode hits EPERM. The checksum
# compare gives idempotence, and collapses in --check where template returns
# none.
- name: Publish the firewall config into pmxcfs when changed for {{ pmxcfs_config_label }}
  ansible.builtin.command:
    cmd: "cp -- {{ proxmox_firewall_staging_dir }}/{{ pmxcfs_config_label }} {{ pmxcfs_config_dest }}"
  when: >-
    (proxmox_firewall_pmxcfs_render.checksum | default(''))
    != (proxmox_firewall_pmxcfs_live.stat.checksum | default(''))
  changed_when: true
  register: proxmox_firewall_pmxcfs_publish

# A file pve-firewall refuses to compile is already live at this point and it
# keeps serving the last good ruleset, so without this the cluster silently stops
# converging. Some versions still exit 0 on a parse error, hence the stderr test.
- name: Validate the compiled ruleset after publishing {{ pmxcfs_config_label }}
  ansible.builtin.command: pve-firewall compile
  register: proxmox_firewall_compile
  changed_when: false
  check_mode: false
  failed_when: proxmox_firewall_compile_failed | bool
  when:
    - not (proxmox_firewall_skip_pveum | default(false))
    - proxmox_firewall_pmxcfs_publish is changed
