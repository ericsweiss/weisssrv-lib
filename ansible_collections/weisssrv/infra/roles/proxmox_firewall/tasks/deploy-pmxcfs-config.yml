---
# Publish a rendered Jinja template into pmxcfs (/etc/pve) content-only.
#
# pmxcfs auto-enforces root:www-data 0640 under /etc/pve/firewall and REJECTS
# every explicit chown/chmod/utime with EPERM. Ansible's template/copy modules
# land content through atomic_move, whose fallback runs shutil.copy2 (utime) and
# then re-applies owner/group/mode — so any create or content change false-fails
# "Operation not permitted" even though the bytes were written, and
# unsafe_writes does not route around it on ansible-core 2.20+. Hence: render to
# staging on the normal root fs, then publish with a plain `cp` (no metadata
# syscalls) and let pmxcfs stamp its own ownership and mode.
#
# Caller contract (include_tasks vars): pmxcfs_config_src (template filename),
# pmxcfs_config_dest (absolute path inside /etc/pve), pmxcfs_config_label
# (unique, filesystem-safe id, also the staging filename). The caller supplies
# become / delegate_to via `apply:`, and run_once / when on the include itself.

- name: Ensure the pmxcfs firewall staging directory exists
  ansible.builtin.file:
    path: "{{ proxmox_firewall_staging_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render firewall config to staging off pmxcfs for {{ pmxcfs_config_label }}
  ansible.builtin.template:
    src: "{{ pmxcfs_config_src }}"
    dest: "{{ proxmox_firewall_staging_dir }}/{{ pmxcfs_config_label }}"
    owner: root
    group: root
    mode: "0640"
  register: proxmox_firewall_pmxcfs_render

- name: Read the live pmxcfs checksum for {{ pmxcfs_config_label }}
  ansible.builtin.stat:
    path: "{{ pmxcfs_config_dest }}"
    checksum_algorithm: sha1
  register: proxmox_firewall_pmxcfs_live

# cp is the only write primitive pmxcfs accepts here: pmxcfs enforces
# root:www-data 0640 (no group/other write bit), so plain `cp` (no -p) issues
# no post-copy fchmod/chown/utime and dodges the EPERM. This is content-only —
# if this helper is ever reused for a pmxcfs file whose mode carries a write
# bit, cp would restore that mode and reintroduce the fchmod/EPERM.
#
# Comparing render-vs-live-pmxcfs both provides idempotence and corrects
# out-of-band drift in /etc/pve. In `--check` mode `template` returns no
# checksum, so this guard collapses and the publish previews as "skipped" — the
# render-to-staging task's `changed` is the dry-run signal instead.
- name: Publish the firewall config into pmxcfs when changed for {{ pmxcfs_config_label }}
  ansible.builtin.command:
    cmd: "cp -- {{ proxmox_firewall_staging_dir }}/{{ pmxcfs_config_label }} {{ pmxcfs_config_dest }}"
  when: >-
    (proxmox_firewall_pmxcfs_render.checksum | default(''))
    != (proxmox_firewall_pmxcfs_live.stat.checksum | default(''))
  changed_when: true
