---
# Shared APT signed-repository pipeline: stat keyring -> install gnupg ->
# download key -> verify fingerprint -> dearmor -> cleanup -> add repo, all
# gated on the keyring's absence. Inputs and key rotation: the role README.

- name: Ensure keyring directory exists
  ansible.builtin.file:
    path: "{{ apt_signed_repo_keyring_path | dirname }}"
    state: directory
    mode: "0755"

# The verify/dearmor steps call gpg. Callers that provision gnupg elsewhere
# leave this off. Not gated on key absence: the fingerprint check also runs
# against an installed keyring.
- name: Ensure gnupg is installed
  ansible.builtin.apt:
    name: gnupg
    state: present
  when: apt_signed_repo_install_gnupg

- name: Check whether the signing keyring already exists
  ansible.builtin.stat:
    path: "{{ apt_signed_repo_keyring_path }}"
  register: apt_signed_repo_keyring

# Root-only staging area. Verify and dearmor are separate SSH invocations, so
# the key must sit somewhere no other local user can substitute it in between.
- name: Ensure the key staging directory exists
  ansible.builtin.file:
    path: "{{ apt_signed_repo_stage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: not (apt_signed_repo_keyring.stat.exists | default(false))

- name: Download signing key
  ansible.builtin.get_url:
    url: "{{ apt_signed_repo_key_url }}"
    dest: "{{ apt_signed_repo_tmp_key }}"
    owner: root
    group: root
    mode: "0600"
    # Always fetch fresh, recovering from a stale file left by a failed verify.
    force: true
    # get_url's 10s default expires mid-handshake against a vendor key server.
    timeout: 60
  when: not (apt_signed_repo_keyring.stat.exists | default(false))
  # A stalled handshake is retried instead of failing the play. The fingerprint
  # check below still gates what apt trusts.
  register: apt_signed_repo_key_download
  until: apt_signed_repo_key_download is succeeded
  retries: 3
  delay: 5

# Verifies the download when the keyring is absent, the installed keyring
# otherwise. More than one public key fails closed: dearmor imports every key in
# the file, so an appended key would bypass the fingerprint pin.
- name: Verify signing key fingerprint (primary key must match exactly)
  vars:
    apt_signed_repo_verify_path: >-
      {{ apt_signed_repo_keyring_path if (apt_signed_repo_keyring.stat.exists | default(false))
      else apt_signed_repo_tmp_key }}
  ansible.builtin.shell: |
    # set -e makes a bare failing test below abort the script.
    set -eo pipefail
    primary_fpr=$(gpg --show-keys --with-colons {{ apt_signed_repo_verify_path | quote }} 2>/dev/null \
        | awk -F: '/^pub/{p=1; next} p && /^fpr/{print $10; exit}')
    pub_count=$(gpg --show-keys --with-colons {{ apt_signed_repo_verify_path | quote }} 2>/dev/null | grep -c '^pub')
    [ "$pub_count" = "1" ]
    [ "$primary_fpr" = {{ apt_signed_repo_fingerprint | quote }} ]
  args:
    executable: /bin/bash
  changed_when: false

# Dearmor to binary .gpg for signed-by. The creates guard keeps this a no-op
# once the keyring exists.
- name: Add signing key to keyring
  ansible.builtin.shell: >-
    gpg --yes --dearmor -o {{ apt_signed_repo_keyring_path | quote }}
    < {{ apt_signed_repo_tmp_key | quote }}
  args:
    creates: "{{ apt_signed_repo_keyring_path }}"
  when: not (apt_signed_repo_keyring.stat.exists | default(false))

# Re-stat after the dearmor: under --check the shell above reports changed but
# writes nothing, and the permission task below must not fail on a missing
# keyring in check mode.
- name: Re-check the signing keyring after dearmor
  ansible.builtin.stat:
    path: "{{ apt_signed_repo_keyring_path }}"
  register: apt_signed_repo_keyring_final

# gpg --dearmor's output mode depends on the umask, and apt reports
# "unverifiable signature" on a keyring it cannot read. Runs on every keyring.
- name: Set permissions on signing keyring
  ansible.builtin.file:
    path: "{{ apt_signed_repo_keyring_path }}"
    mode: "0644"
  when: apt_signed_repo_keyring_final.stat.exists | default(false)

- name: Clean up the key staging directory
  ansible.builtin.file:
    path: "{{ apt_signed_repo_stage_dir }}"
    state: absent
  when: not (apt_signed_repo_keyring.stat.exists | default(false))

- name: Add APT repository
  ansible.builtin.apt_repository:
    repo: "{{ apt_signed_repo_repo_line }}"
    filename: "{{ apt_signed_repo_filename }}"
    state: present
    update_cache: "{{ apt_signed_repo_update_cache }}"
