---
# Hermetic converge: generate a throwaway signing key, serve it over file://,
# then exercise both the accept (correct fingerprint) and reject (wrong
# fingerprint) paths of apt_signed_repo. update_cache is off so the test never
# reaches for the (non-existent) repo — the three real callers cover the
# apt-update path end to end in their own scenarios.
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Ensure gnupg is installed
      ansible.builtin.apt:
        name: gnupg
        state: present

    - name: Generate a throwaway signing key in an isolated GNUPGHOME
      ansible.builtin.shell: |
        set -o pipefail
        export GNUPGHOME=/tmp/apt-signed-repo-gpg
        rm -rf "$GNUPGHOME"; mkdir -m 0700 "$GNUPGHOME"
        gpg --batch --passphrase '' --quick-generate-key 'apt-signed-repo test <test@example.com>' \
          ed25519 sign none
        gpg --armor --export 'apt-signed-repo test' > /tmp/testkey.asc
      args:
        executable: /bin/bash
        creates: /tmp/testkey.asc

    - name: Read the fingerprint of the generated key
      ansible.builtin.shell: |
        set -o pipefail
        gpg --with-colons --show-keys /tmp/testkey.asc \
          | awk -F: '/^pub/{p=1; next} p && /^fpr/{print $10; exit}'
      args:
        executable: /bin/bash
      register: apt_signed_repo_test_key
      changed_when: false

    - name: Record the real fingerprint of the generated key
      ansible.builtin.set_fact:
        apt_signed_repo_real_fpr: "{{ apt_signed_repo_test_key.stdout_lines[-1] | trim }}"

    - name: Accept path — install the repo with the correct fingerprint
      ansible.builtin.include_role:
        name: weisssrv.infra.apt_signed_repo
      vars:
        apt_signed_repo_key_url: "file:///tmp/testkey.asc"
        apt_signed_repo_fingerprint: "{{ apt_signed_repo_real_fpr }}"
        apt_signed_repo_keyring_path: /etc/apt/keyrings/test-ok.gpg
        apt_signed_repo_keyring_mode: "0644"
        apt_signed_repo_repo_line: >-
          deb [signed-by=/etc/apt/keyrings/test-ok.gpg]
          http://deb.debian.org/debian bookworm main
        apt_signed_repo_filename: apt-signed-repo-test-ok
        apt_signed_repo_update_cache: false

    - name: Reject path — a wrong fingerprint must fail before writing a keyring
      block:
        - name: Run the role with a deliberately wrong fingerprint
          ansible.builtin.include_role:
            name: weisssrv.infra.apt_signed_repo
          vars:
            apt_signed_repo_key_url: "file:///tmp/testkey.asc"
            apt_signed_repo_fingerprint: "0000000000000000000000000000000000000000"
            apt_signed_repo_keyring_path: /etc/apt/keyrings/test-bad.gpg
            apt_signed_repo_repo_line: >-
              deb [signed-by=/etc/apt/keyrings/test-bad.gpg]
              http://deb.debian.org/debian bookworm main
            apt_signed_repo_filename: apt-signed-repo-test-bad
            apt_signed_repo_update_cache: false
      rescue:
        - name: Record that the fingerprint mismatch was rejected
          ansible.builtin.set_fact:
            apt_signed_repo_fingerprint_rejected: true

    - name: Assert the reject path actually failed the role
      ansible.builtin.assert:
        that:
          - apt_signed_repo_fingerprint_rejected | default(false)
        fail_msg: >-
          apt_signed_repo did NOT fail on a wrong fingerprint — the primary-key
          verification is not enforcing.

    # Build the two-key file OUTSIDE the rescued block below: if key
    # construction fails here it must fail the play loudly, not be swallowed by
    # the block's rescue and misread as the guard rejecting (which would let the
    # multi-key guard go untested with a false green).
    - name: Build a two-key file (original key first) in the same GNUPGHOME
      ansible.builtin.shell: |
        set -o pipefail
        export GNUPGHOME=/tmp/apt-signed-repo-gpg
        gpg --batch --passphrase '' \
          --quick-generate-key 'apt-signed-repo test2 <test2@example.com>' \
          ed25519 sign none
        # Original key FIRST so its fingerprint is the primary the role
        # extracts — proving pub_count>1 is rejected even when the primary
        # fingerprint matches exactly (the exact key-bundling bypass the
        # single-fingerprint pin cannot catch on its own).
        gpg --armor --export 'apt-signed-repo test'  >  /tmp/testkey-multi.asc
        gpg --armor --export 'apt-signed-repo test2' >> /tmp/testkey-multi.asc
      args:
        executable: /bin/bash
        creates: /tmp/testkey-multi.asc

    - name: Multi-key reject path — a bundled second key must fail the guard
      block:
        - name: Run the role with a two-key file but the correct PRIMARY fingerprint
          ansible.builtin.include_role:
            name: weisssrv.infra.apt_signed_repo
          vars:
            apt_signed_repo_key_url: "file:///tmp/testkey-multi.asc"
            apt_signed_repo_fingerprint: "{{ apt_signed_repo_real_fpr }}"
            apt_signed_repo_keyring_path: /etc/apt/keyrings/test-multi.gpg
            apt_signed_repo_repo_line: >-
              deb [signed-by=/etc/apt/keyrings/test-multi.gpg]
              http://deb.debian.org/debian bookworm main
            apt_signed_repo_filename: apt-signed-repo-test-multi
            apt_signed_repo_update_cache: false
      rescue:
        - name: Record that the bundled-second-key file was rejected
          ansible.builtin.set_fact:
            apt_signed_repo_multikey_rejected: true

    - name: Assert the multi-key path failed the role (pub_count==1 guard)
      ansible.builtin.assert:
        that:
          - apt_signed_repo_multikey_rejected | default(false)
        fail_msg: >-
          apt_signed_repo did NOT fail on a file bundling two public keys even
          though the primary fingerprint matched — the pub_count==1 fail-closed
          guard is not enforcing, so an appended signing key would be trusted.

    # Existing-keyring re-verification: test-ok.gpg is already installed (accept
    # path above). Re-run the role against it with a WRONG fingerprint — the
    # download/verify/dearmor steps all skip on an existing keyring, so only the
    # new existing-keyring re-verify can catch the drift. It must fail.
    - name: Existing-keyring re-verify — a drifted fingerprint on an installed keyring must fail
      block:
        - name: Re-run the role against the installed keyring with a wrong fingerprint
          ansible.builtin.include_role:
            name: weisssrv.infra.apt_signed_repo
          vars:
            apt_signed_repo_key_url: "file:///tmp/testkey.asc"
            apt_signed_repo_fingerprint: "0000000000000000000000000000000000000000"
            apt_signed_repo_keyring_path: /etc/apt/keyrings/test-ok.gpg
            apt_signed_repo_repo_line: >-
              deb [signed-by=/etc/apt/keyrings/test-ok.gpg]
              http://deb.debian.org/debian bookworm main
            apt_signed_repo_filename: apt-signed-repo-test-ok
            apt_signed_repo_update_cache: false
      rescue:
        - name: Record that the installed-keyring fingerprint drift was rejected
          ansible.builtin.set_fact:
            apt_signed_repo_existing_rejected: true

    - name: Assert the existing-keyring re-verify rejected the drifted fingerprint
      ansible.builtin.assert:
        that:
          - apt_signed_repo_existing_rejected | default(false)
        fail_msg: >-
          apt_signed_repo did NOT fail when the installed keyring's fingerprint
          no longer matches the pinned fingerprint — an existing keyring is
          trusted without re-verification.

    # Dry run against an UNPROVISIONED keyring path. In check mode the dearmor
    # writes nothing, so the keyring is still absent when the permission task is
    # reached — and `file` with an implicit state=file fails "is absent, cannot
    # continue" in check mode too. Without the post-dearmor existence re-check
    # this makes `ansible-playbook --check` red on every fresh host.
    - name: Check-mode dry run — an absent keyring must not fail the permission task
      check_mode: true
      block:
        - name: Run the role in check mode against a keyring path that does not exist
          ansible.builtin.include_role:
            name: weisssrv.infra.apt_signed_repo
          vars:
            apt_signed_repo_key_url: "file:///tmp/testkey.asc"
            apt_signed_repo_fingerprint: "{{ apt_signed_repo_real_fpr }}"
            apt_signed_repo_keyring_path: /etc/apt/keyrings/test-checkmode.gpg
            apt_signed_repo_repo_line: >-
              deb [signed-by=/etc/apt/keyrings/test-checkmode.gpg]
              http://deb.debian.org/debian bookworm main
            apt_signed_repo_filename: apt-signed-repo-test-checkmode
            apt_signed_repo_update_cache: false
      rescue:
        - name: Record that the check-mode dry run failed
          ansible.builtin.set_fact:
            apt_signed_repo_checkmode_failed: true

    - name: Assert the check-mode dry run survived the unprovisioned keyring
      ansible.builtin.assert:
        that:
          - not (apt_signed_repo_checkmode_failed | default(false))
        fail_msg: >-
          apt_signed_repo FAILED in check mode against a keyring that does not
          exist yet — `task infra:check` would be red on every unprovisioned
          host for every caller of this pipeline.
        success_msg: "check mode is clean on an unprovisioned keyring path"
