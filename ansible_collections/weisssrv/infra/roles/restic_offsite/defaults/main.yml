---
# Nightly offsite backup to B2 (restic + rclone), chained OnSuccess= after the
# local archive job. Everything describing WHAT to back up is site data with no
# safe generic value, so it is empty or unset here — README.md.

restic_offsite_enabled: true

# restic — ADVISORY pin: an exact Debian package version hard-pins, empty
# tracks the distro.
restic_offsite_restic_version: ""
# rclone — REQUIRED version + .deb sha256, installed from rclone.org's release
# deb, never Debian apt (years-old build). Both asserted before the download.
restic_offsite_rclone_version: "1.74.4"
restic_offsite_rclone_deb_sha256: "a9da2eaa70428c6dcc5acbb0b7eac0faec4c61643e0b468d9fe09ddf79b7e929"

# amd64 only: the pinned checksum is for rclone's amd64 .deb, and the role
# refuses any other architecture rather than installing an unverified artefact.
restic_offsite_rclone_deb_name: "rclone-v{{ restic_offsite_rclone_version }}-linux-amd64.deb"

# restic repository. REQUIRED when enabled; the rclone b2 backend path form is
# `rclone:b2:<bucket>/<path>`.
restic_offsite_repo: ""

# Name is the `rclone:<name>:` segment of restic_offsite_repo. `b2` is the only
# type whose credentials the role knows by name; any other type takes everything
# from the options map, rendered verbatim as `key = value` (README "rclone remote").
restic_offsite_rclone_remote_name: b2
restic_offsite_rclone_remote_type: b2
restic_offsite_rclone_remote_options: {}

# REQUIRED, no default on purpose: holds the repo index (file PATHS) in
# plaintext - README "Where the cache goes".
# restic_offsite_cache_dir: /path/on/an/encrypted/unreplicated/dataset

# Stable path roots: file sources bind their latest snapshot subtree here; the
# data-zvol clones mount here. Stable paths let restic's parent-snapshot
# optimization re-read only changed files instead of re-hashing everything.
restic_offsite_bind_root: /mnt/restic-src
restic_offsite_zvol_mount_root: /run/restic-offsite
# bind (real host: mount --bind the .zfs snapshot) | direct (molecule: no ZFS).
restic_offsite_bind_mode: bind
restic_offsite_zvol_clone_suffix: b2walk

# Throttles, kept deferential under I/O contention. The WAN upload is the real
# cap and RCLONE_BWLIMIT bounds it.
restic_offsite_bwlimit: "50M"           # RCLONE_BWLIMIT
restic_offsite_rclone_transfers: 4      # RCLONE_TRANSFERS
restic_offsite_gogc: 20                 # GOGC — caps restic heap during index/prune

restic_offsite_metrics_dir: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}"
restic_offsite_snap_prefix: archsync
# Abort (do not upload) if any source's latest snapshot is older than this.
# 26h tolerates one deferred-archive night while still refusing a stale tree.
restic_offsite_freshness_max_age_h: 26

restic_offsite_restore_base: /mnt/restore/restic
restic_offsite_config_dir: /etc/restic-offsite
restic_offsite_excludes_file: "{{ restic_offsite_config_dir }}/excludes.txt"

# GFS. keep_last is a floor counted in SNAPSHOTS, not days, so several runs in
# one day consume it — hence 7 daily rather than 3.
restic_offsite_keep_daily: 7
restic_offsite_keep_weekly: 2
restic_offsite_keep_monthly: 3
restic_offsite_keep_yearly: 1
# Floor independent of the calendar buckets. Retention depth is the only defence
# when the bucket has no Object Lock.
restic_offsite_keep_last: 5
# restic forget --group-by. `host`, not restic's default `host,paths` -
# README "Retention".
restic_offsite_forget_group_by: host
# Blast-radius ceiling: the control script dry-runs the policy and refuses a
# larger delete set. Apply an intended one with
# `restic-offsitectl prune --max-remove <N>` (README "Retention").
restic_offsite_forget_max_remove: 3
# Snapshot tags the retention policy must never forget (`--keep-tag`), pinning
# data the nightly run no longer covers. Tag by hand with
# `restic-offsitectl restic tag --add <tag> <snapshot-id>`.
restic_offsite_keep_tags: []
# Wait this long for a concurrent holder's repository lock instead of failing
# the run outright (restic --retry-lock; empty disables).
restic_offsite_retry_lock: 15m
# A repository lock owned by a DEAD pid on this host and older than this is
# reaped before the exclusive phases. Keep it above the longest expected run.
restic_offsite_stale_lock_min_age_h: 6
# Pack groups the rotating deep verify cycles through (one per verify run).
restic_offsite_verify_groups: 12

# Quarterly restore drill: `restic check` proves consistency, not that THIS host
# can still decrypt and restore. Metrics + sampling rules: README "Restore
# drill". false removes the units.
restic_offsite_restore_drill_enabled: true
# Sample size + hard byte cap. B2 egress is billed and volume proves nothing
# extra here: repo-wide bit-rot is the rotating deep verify's job.
restic_offsite_restore_drill_sample_files: 5
restic_offsite_restore_drill_max_bytes: 16777216  # 16 MiB
# Minimum candidate size for the drill sampler (bytes) - README "Restore drill".
restic_offsite_restore_drill_min_bytes: 4096
# DISTINCT file sources that must contribute a sampled file, or the drill fails.
# Only restic_offsite_sources count: a zvol source is unmounted between runs and
# has no comparand.
restic_offsite_restore_drill_min_sources: 1
# Run one drill at install until one passes - README "First converge runs one
# drill". false for a first converge on an empty repo.
restic_offsite_restore_drill_seed: true
# 05:00 on the 5th of Jan/Apr/Jul/Oct — a quarter, offset well clear of both the
# nightly backup window and the Sunday deep verify.
restic_offsite_restore_drill_timer_calendar: "*-01,04,07,10-05 05:00:00"

# Start timeout for the three oneshot units. systemd disables it for
# Type=oneshot, so without this a wedged restic run holds the lock forever.
restic_offsite_timeout_start_sec: 6h
# Per-unit start timeouts. The rotating deep verify re-downloads and re-hashes
# 1/restic_offsite_verify_groups of the whole repository, so it ships with a
# higher default than the incremental nightly and the sampled drill.
restic_offsite_backup_timeout_start_sec: "{{ restic_offsite_timeout_start_sec }}"
restic_offsite_verify_timeout_start_sec: 12h
restic_offsite_drill_timeout_start_sec: "{{ restic_offsite_timeout_start_sec }}"
# Bounds the teardown after a start-timeout kill: the failure metric is written
# first, so a longer budget only delays SIGKILL.
restic_offsite_timeout_stop_sec: 5m

# systemd load-shaping: deferential under contention.
restic_offsite_nice: 10
restic_offsite_io_class: best-effort
restic_offsite_io_priority: 6
restic_offsite_cpu_weight: 20
restic_offsite_io_weight: 20
# Nightly trigger. Set it shortly after the archive job normally finishes when a
# site also wires the OnSuccess handoff, and clear of the nas_storage swap-clean
# window, which stops guests whose zvols a run clones.
restic_offsite_timer_calendar: "*-*-* 08:00:00"
# Rotating deep verify (restic check --read-data-subset): midday Sunday, far
# from the nightly backup window. The full repo is re-read against bit-rot every
# restic_offsite_verify_groups runs.
restic_offsite_verify_timer_calendar: "Sun *-*-* 12:00:00"
restic_offsite_timer_randomized_delay: 10m
# Overnight units a run must not overlap: an active one makes the run a
# deliberate skip that retries on the next timer. Name swap-clean.service here
# on a host that also runs nas_storage swap-clean.
restic_offsite_conflicting_units: []

# Site data, item shape {name, mountpoint}: each binds <mountpoint>'s latest
# snapshot subtree at <bind_root>/<name>. A dataset with zvol-backed CHILDREN
# walks as empty dirs — dump those into a walked source instead.
restic_offsite_sources: []

# Site data, item shape {name, zvol, fstype, mount_opts}: a file walk cannot see
# a live zvol, so each is clone-mounted read-only for the run. mount_opts
# defaults to `ro`, which lets ext4 replay the journal onto the writable clone.
restic_offsite_zvol_sources: []

# Site data. Patterns are matched against the BIND paths
# (<restic_offsite_bind_root>/<source name>/...). `**/*.partial` is worth
# carrying: dumps are streamed to <final>.partial and renamed only on success.
restic_offsite_excludes: []
