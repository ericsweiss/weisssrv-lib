---
# restic_offsite — install restic/rclone, render the secret-bearing config +
# control script, and wire the systemd oneshot + fallback timer. Everything is
# gated on restic_offsite_enabled so the role is an inert no-op when disabled.

- name: Configure restic offsite backup
  when: restic_offsite_enabled | default(true)
  block:
    # Required site inputs with no safe default: without them the role would
    # render an env file pointing at an empty repository and a cache dir that
    # may land on unencrypted storage.
    - name: Assert the required offsite inputs are set
      ansible.builtin.assert:
        that:
          - restic_offsite_repo | default('') | length > 0
          - restic_offsite_cache_dir | default('') | length > 0
        fail_msg: >-
          restic_offsite_repo and restic_offsite_cache_dir are required when
          restic_offsite_enabled is true. The cache holds repository PATHS in
          plaintext — place it on an encrypted dataset.

    # Presence-only assert: no_log would censor the fail_msg, and the
    # expression prints variable names, not values.
    - name: Assert the offsite credentials are non-empty
      ansible.builtin.assert:
        that:
          - restic_offsite_repo_password | default('') | length > 0
        fail_msg: >-
          restic_offsite_repo_password must be a non-empty value when
          restic_offsite_enabled is true.

    - name: Assert the B2 credentials are non-empty
      ansible.builtin.assert:
        that:
          - restic_offsite_b2_key_id | default('') | length > 0
          - restic_offsite_b2_application_key | default('') | length > 0
        fail_msg: >-
          restic_offsite_b2_key_id and restic_offsite_b2_application_key must be
          non-empty values for the b2 rclone remote (set
          restic_offsite_rclone_remote_type + _remote_options for another
          backend).
      when: restic_offsite_rclone_remote_type == 'b2'

    # The control script derives each throwaway clone's name from the zvol path,
    # so two entries naming the same zvol clone onto each other mid-run.
    - name: Assert the zvol sources are unique
      ansible.builtin.assert:
        that:
          - (restic_offsite_zvol_sources | map(attribute='zvol') | unique | list | length)
            == (restic_offsite_zvol_sources | length)
          - (restic_offsite_zvol_sources | map(attribute='name') | unique | list | length)
            == (restic_offsite_zvol_sources | length)
        fail_msg: >-
          restic_offsite_zvol_sources must not repeat a zvol or a source name.

    # CRITICAL: swap-clean shrinks the ARC, runs swapoff and gracefully stops
    # the guests in nas_storage_swap_clean_stop_guests. Overlapping the offsite
    # run means restic is reading clones of those guests' zvols meanwhile.
    - name: Assert swap-clean is interlocked against the offsite run
      ansible.builtin.assert:
        that:
          - "'restic-offsite.service' in
             (nas_storage_swap_clean_conflicting_units | default([]))"
        fail_msg: >-
          nas_storage_swap_clean_enabled is true on this host but
          nas_storage_swap_clean_conflicting_units does not name
          restic-offsite.service, so swap-clean can shrink the ARC, swapoff and
          stop the guests in nas_storage_swap_clean_stop_guests while restic
          reads clones of their zvols. Add it in group_vars or host_vars.
      when: nas_storage_swap_clean_enabled | default(false) | bool

    # The interlock is two-directional: swap-clean skips while restic runs, and
    # restic skips while swap-clean runs. One side alone leaves the other's
    # window unguarded.
    - name: Assert the offsite run is interlocked against swap-clean
      ansible.builtin.assert:
        that:
          - "'swap-clean.service' in
             (restic_offsite_conflicting_units | default([]))"
        fail_msg: >-
          nas_storage_swap_clean_enabled is true on this host but
          restic_offsite_conflicting_units does not name swap-clean.service, so
          a swap-clean night that starts after the offsite run has taken the
          lock still stops guests underneath it. Add it in group_vars or
          host_vars.
      when: nas_storage_swap_clean_enabled | default(false) | bool

    # Replication hand-off is opt-in on the nas_storage side; without it restic
    # runs on its own timer instead of chaining off a fresh archive.
    - name: Warn when the archive replication does not chain into the offsite run
      ansible.builtin.debug:
        msg: >-
          nas_storage_archive_backup_enabled is true but
          nas_storage_archive_backup_on_success_units does not name
          restic-offsite.service, so this host runs the offsite backup on its own
          timer rather than after a successful replication.
      when:
        - nas_storage_archive_backup_enabled | default(false) | bool
        - "'restic-offsite.service' not in
           (nas_storage_archive_backup_on_success_units | default([]))"

    # restic stays Debian-packaged; restic_offsite_restic_version is advisory:
    # an exact Debian version pins, empty tracks the distro.
    - name: Install restic
      ansible.builtin.apt:
        name:
          - "restic{{ ('=' + restic_offsite_restic_version) if restic_offsite_restic_version else '' }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # rclone comes from rclone.org's pinned .deb, not Debian apt. An empty
    # version makes the probe vacuously true and silently skips the install.
    - name: Assert the rclone pin inputs are sane
      ansible.builtin.assert:
        that:
          - ansible_architecture == 'x86_64'
          - restic_offsite_rclone_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - restic_offsite_rclone_deb_sha256 is match('^[A-Fa-f0-9]{64}$')
        fail_msg: >-
          restic_offsite installs rclone from an amd64-only pinned .deb, and
          this host reports {{ ansible_architecture }}. The version must be a
          semantic version and restic_offsite_rclone_deb_sha256 a sha256.

    # dpkg-query, not `rclone version`: PATH could resolve a stray
    # /usr/local/bin copy (removed below) and false-skip the package install.
    - name: Probe the installed rclone package version
      ansible.builtin.command: dpkg-query -W -f '${Version}' rclone
      register: restic_offsite_rclone_probe
      changed_when: false
      failed_when: false

    - name: Decide whether the rclone pin is already satisfied
      ansible.builtin.set_fact:
        restic_offsite_rclone_pin_satisfied: >-
          {{ (restic_offsite_rclone_probe.stdout | default(''))
             is match('^' ~ (restic_offsite_rclone_version | regex_escape) ~ '($|-)') }}

    # The .deb is a build artifact: install then remove, even on failure.
    - name: Install the pinned rclone release deb
      when: not (restic_offsite_rclone_pin_satisfied | bool)
      block:
        - name: Download the pinned rclone release deb
          ansible.builtin.get_url:
            url: "https://downloads.rclone.org/v{{ restic_offsite_rclone_version }}/{{ restic_offsite_rclone_deb_name }}"
            dest: "/var/tmp/{{ restic_offsite_rclone_deb_name }}"
            checksum: "sha256:{{ restic_offsite_rclone_deb_sha256 }}"
            mode: "0644"

        - name: Install the downloaded rclone deb
          ansible.builtin.apt:
            deb: "/var/tmp/{{ restic_offsite_rclone_deb_name }}"
      always:
        - name: Remove the downloaded rclone deb
          ansible.builtin.file:
            path: "/var/tmp/{{ restic_offsite_rclone_deb_name }}"
            state: absent

    # A stray /usr/local/bin/rclone shadows the packaged binary for root and the
    # systemd units (PATH order); keep the pinned package the single source of
    # truth.
    - name: Remove any stray rclone shadowing the packaged binary
      ansible.builtin.file:
        path: /usr/local/bin/rclone
        state: absent

    - name: Create restic-offsite config directory
      ansible.builtin.file:
        path: "{{ restic_offsite_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create restic-offsite working directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ restic_offsite_bind_root }}"
        - "{{ restic_offsite_zvol_mount_root }}"
        - "{{ restic_offsite_cache_dir }}"

    # 0755, not the 0700 loop above: this is the shared node_exporter textfile
    # dir and 0700 root:root would kill every textfile metric on the host.
    - name: Ensure the metrics textfile directory is traversable by node_exporter
      ansible.builtin.file:
        path: "{{ restic_offsite_metrics_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The env file single-quotes the repository URL, so a quote or backslash
    # there parses differently under systemd EnvironmentFile and shell `source`.
    # no_log: the block reads the secret.
    - name: Refuse secret values the env file and restic would read differently
      ansible.builtin.assert:
        that:
          - not (restic_offsite_repo is search("'"))
          - not (restic_offsite_repo is search('\\\\'))
          - restic_offsite_repo_password == (restic_offsite_repo_password | trim)
        fail_msg: >-
          restic_offsite_repo must not contain single quotes or backslashes (the
          env file single-quotes it), and restic_offsite_repo_password must not
          have leading or trailing whitespace (restic trims a password read from
          RESTIC_PASSWORD_FILE but not one from RESTIC_PASSWORD, so the key
          would change).
      no_log: true

    # rclone.conf is an INI file rendered as `key = value`: a newline in a value
    # or a bracket in a key injects arbitrary remote configuration.
    - name: Refuse rclone remote options that would inject INI syntax
      ansible.builtin.assert:
        that:
          - restic_offsite_rclone_remote_options | default({}) | dict2items
            | rejectattr('key', 'match', '^[A-Za-z0-9_]+$') | list | length == 0
          - restic_offsite_rclone_remote_options | default({}) | dict2items
            | selectattr('value', 'search', '[\\r\\n]') | list | length == 0
        fail_msg: >-
          restic_offsite_rclone_remote_options keys must match ^[A-Za-z0-9_]+$
          and no value may contain a newline — both would inject extra rclone
          configuration into rclone.conf.

    # RESTIC_PASSWORD_FILE keeps the repo password out of restic's environment,
    # which the rclone child process inherits.
    # no_log: the task content IS the secret.
    - name: Render the restic repository password file (secret)
      ansible.builtin.copy:
        content: "{{ restic_offsite_repo_password }}"
        dest: "{{ restic_offsite_config_dir }}/repo-password"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # no_log: the env file names the password file and the repository — the
    # template-writes-a-secret pattern ansible-lint does not catch.
    - name: Render restic-offsite EnvironmentFile (secret)
      ansible.builtin.template:
        src: restic-offsite.env.j2
        dest: "{{ restic_offsite_config_dir }}/env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # no_log: rclone.conf carries the B2 application key.
    - name: Render rclone.conf (secret)
      ansible.builtin.template:
        src: rclone.conf.j2
        dest: "{{ restic_offsite_config_dir }}/rclone.conf"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Render restic exclude file
      ansible.builtin.template:
        src: restic-offsite-excludes.txt.j2
        dest: "{{ restic_offsite_excludes_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Deploy restic-offsitectl control script
      ansible.builtin.template:
        src: restic-offsitectl.sh.j2
        dest: /usr/local/sbin/restic-offsitectl
        owner: root
        group: root
        mode: "0755"

    - name: Deploy restic-offsite systemd service
      ansible.builtin.template:
        src: restic-offsite.service.j2
        dest: /etc/systemd/system/restic-offsite.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd for restic-offsite

    - name: Deploy restic-offsite systemd timer
      ansible.builtin.template:
        src: restic-offsite.timer.j2
        dest: /etc/systemd/system/restic-offsite.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd for restic-offsite

    - name: Enable restic-offsite fallback timer
      ansible.builtin.systemd:
        name: restic-offsite.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Deploy restic-offsite-verify systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - restic-offsite-verify.service
        - restic-offsite-verify.timer
      notify: Reload systemd for restic-offsite

    - name: Enable restic-offsite-verify weekly timer
      ansible.builtin.systemd:
        name: restic-offsite-verify.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    # Split from the verify units so the off switch really removes the timer.
    - name: Deploy the quarterly restore-drill systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - backup-restore-drill.service
        - backup-restore-drill.timer
      when: restic_offsite_restore_drill_enabled | bool
      register: restic_offsite_drill_units
      notify: Reload systemd for restic-offsite

    - name: Enable the quarterly restore-drill timer
      ansible.builtin.systemd:
        name: backup-restore-drill.timer
        enabled: true
        state: started
        daemon_reload: true
      when:
        - restic_offsite_restore_drill_enabled | bool
        - not ansible_check_mode

    # The proof of a PASSING drill is the _last_success_seconds line, not the
    # file's existence: the .prom is written on failure too. `find` keeps the
    # probe honest under --check.
    - name: Probe whether a passing restore drill has ever written its proof metric
      ansible.builtin.find:
        paths: "{{ restic_offsite_metrics_dir }}"
        patterns: backup_restore_drill.prom
        contains: '^backup_restore_drill_last_success_seconds '
      register: restic_offsite_drill_proof
      when: restic_offsite_restore_drill_enabled | bool

    # Level-triggered: a failed seed retries on the next converge. Once a drill
    # has passed, both arms are false. README, "Restore drill".
    - name: Decide whether the first restore drill still needs seeding
      ansible.builtin.set_fact:
        restic_offsite_drill_seed_due: >-
          {{ (restic_offsite_drill_units is changed)
             or ((restic_offsite_drill_proof.matched | default(0) | int) == 0) }}
      when: restic_offsite_restore_drill_enabled | bool

    # Seeds the FIRST drill (a Persistent=true timer does not fire on enable).
    # Set restic_offsite_restore_drill_seed false on a snapshot-less repo.
    - name: Seed the first restore drill so the proof metric exists
      ansible.builtin.systemd:
        name: backup-restore-drill.service
        state: started
      when:
        - restic_offsite_restore_drill_enabled | bool
        - restic_offsite_restore_drill_seed | bool
        - restic_offsite_drill_seed_due | default(false) | bool
        - not ansible_check_mode
      tags:
        - molecule-notest

    - name: Stop the restore-drill timer when the drill is disabled
      ansible.builtin.systemd:
        name: backup-restore-drill.timer
        enabled: false
        state: stopped
      when:
        - not (restic_offsite_restore_drill_enabled | bool)
        - not ansible_check_mode
      failed_when: false

    - name: Remove the restore-drill units when the drill is disabled
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - backup-restore-drill.service
        - backup-restore-drill.timer
      when: not (restic_offsite_restore_drill_enabled | bool)
      notify: Reload systemd for restic-offsite

    # CRITICAL: the .prom goes with the units. A frozen
    # backup_restore_drill_last_success_seconds keeps its staleness alert firing
    # with no timer that could ever clear it.
    - name: Remove the restore-drill metric when the drill is disabled
      ansible.builtin.file:
        path: "{{ restic_offsite_metrics_dir }}/backup_restore_drill.prom"
        state: absent
      when: not (restic_offsite_restore_drill_enabled | bool)
