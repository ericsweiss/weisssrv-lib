---
# restic_offsite — install restic/rclone, render the secret-bearing config +
# control script, and wire the systemd oneshot + fallback timer. Everything is
# gated on restic_offsite_enabled so the role is an inert no-op when disabled.

- name: Configure restic offsite backup
  when: restic_offsite_enabled | default(true)
  block:
    # Required site inputs with no safe default: without them the role would
    # render an env file pointing at an empty repository and a cache dir that
    # may land on unencrypted storage.
    - name: Assert the required offsite inputs are set
      ansible.builtin.assert:
        that:
          - restic_offsite_repo | default('') | length > 0
          - restic_offsite_cache_dir | default('') | length > 0
        fail_msg: >-
          restic_offsite_repo and restic_offsite_cache_dir are required when
          restic_offsite_enabled is true. The cache holds repository PATHS in
          plaintext — place it on an encrypted dataset.

    # A credential set to the empty string renders an empty RESTIC_PASSWORD and
    # an empty rclone account: every task converges green and the backup is
    # non-functional until the next run's metric is read. (An OMITTED variable
    # already fails loudly — the role ships no default for any of the three.)
    # no_log: the assert must never render a secret into output.
    - name: Assert the offsite credentials are non-empty
      ansible.builtin.assert:
        that:
          - restic_offsite_repo_password | default('') | length > 0
        fail_msg: >-
          restic_offsite_repo_password must be a non-empty value when
          restic_offsite_enabled is true.
      no_log: true

    - name: Assert the B2 credentials are non-empty
      ansible.builtin.assert:
        that:
          - restic_offsite_b2_key_id | default('') | length > 0
          - restic_offsite_b2_application_key | default('') | length > 0
        fail_msg: >-
          restic_offsite_b2_key_id and restic_offsite_b2_application_key must be
          non-empty values for the b2 rclone remote (set
          restic_offsite_rclone_remote_type + _remote_options for another
          backend).
      when: restic_offsite_rclone_remote_type == 'b2'
      no_log: true

    # The control script derives each throwaway clone's name from the zvol path,
    # so two entries naming the same zvol clone onto each other mid-run.
    - name: Assert the zvol sources are unique
      ansible.builtin.assert:
        that:
          - (restic_offsite_zvol_sources | map(attribute='zvol') | unique | list | length)
            == (restic_offsite_zvol_sources | length)
          - (restic_offsite_zvol_sources | map(attribute='name') | unique | list | length)
            == (restic_offsite_zvol_sources | length)
        fail_msg: >-
          restic_offsite_zvol_sources must not repeat a zvol or a source name.

    # restic stays Debian-packaged; restic_offsite_restic_version is advisory:
    # an exact Debian version pins, empty tracks the distro.
    - name: Install restic
      ansible.builtin.apt:
        name:
          - "restic{{ ('=' + restic_offsite_restic_version) if restic_offsite_restic_version else '' }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # rclone comes from rclone.org's official .deb, NOT Debian apt (which ships
    # a years-old build): a pinned, checksummed build keeps the backup transport
    # reproducible instead of drifting with the distro. Fail loud on a bad pin —
    # an empty version makes the probe's match vacuously true and SILENTLY skips
    # the pinned install. The deb is amd64-only.
    - name: Assert the rclone pin inputs are sane
      ansible.builtin.assert:
        that:
          - restic_offsite_rclone_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - restic_offsite_rclone_deb_sha256 is match('^[A-Fa-f0-9]{64}$')
          - ansible_architecture == 'x86_64'
        fail_msg: >-
          restic_offsite_rclone_version/restic_offsite_rclone_deb_sha256 must be a semantic version + sha256
          of the rclone.org linux-amd64 deb, and the host must be x86_64.

    # dpkg-query, not `rclone version`: PATH could resolve a stray
    # /usr/local/bin copy (removed below) and false-skip the package install.
    - name: Probe the installed rclone package version
      ansible.builtin.command: dpkg-query -W -f '${Version}' rclone
      register: restic_offsite_rclone_probe
      changed_when: false
      failed_when: false

    - name: Decide whether the rclone pin is already satisfied
      ansible.builtin.set_fact:
        restic_offsite_rclone_pin_satisfied: >-
          {{ (restic_offsite_rclone_probe.stdout | default(''))
             is match('^' ~ (restic_offsite_rclone_version | regex_escape) ~ '($|-)') }}

    # The .deb is a build artifact, not state: fetch it to /var/tmp, install it,
    # and remove it even when the install fails, so a version bump does not
    # leave another ~20 MB behind.
    - name: Install the pinned rclone release deb
      when: not (restic_offsite_rclone_pin_satisfied | bool)
      block:
        - name: Download the pinned rclone release deb
          ansible.builtin.get_url:
            url: "https://downloads.rclone.org/v{{ restic_offsite_rclone_version }}/rclone-v{{ restic_offsite_rclone_version }}-linux-amd64.deb"
            dest: "/var/tmp/rclone-v{{ restic_offsite_rclone_version }}-linux-amd64.deb"
            checksum: "sha256:{{ restic_offsite_rclone_deb_sha256 }}"
            mode: "0644"

        - name: Install the downloaded rclone deb
          ansible.builtin.apt:
            deb: "/var/tmp/rclone-v{{ restic_offsite_rclone_version }}-linux-amd64.deb"
      always:
        - name: Remove the downloaded rclone deb
          ansible.builtin.file:
            path: "/var/tmp/rclone-v{{ restic_offsite_rclone_version }}-linux-amd64.deb"
            state: absent

    # A stray /usr/local/bin/rclone shadows the packaged binary for root and the
    # systemd units (PATH order); keep the pinned package the single source of
    # truth.
    - name: Remove any stray rclone shadowing the packaged binary
      ansible.builtin.file:
        path: /usr/local/bin/rclone
        state: absent

    - name: Create restic-offsite config directory
      ansible.builtin.file:
        path: "{{ restic_offsite_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create restic-offsite working directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ restic_offsite_bind_root }}"
        - "{{ restic_offsite_zvol_mount_root }}"
        - "{{ restic_offsite_cache_dir }}"

    # NOT in the 0700 loop above: the metrics dir is the shared node_exporter
    # textfile dir — 0700 root:root would stop node_exporter (its own user)
    # from traversing it, silently killing every textfile metric on the host.
    # 0755 matches node_exporter_host's own directory task.
    - name: Ensure the metrics textfile directory is traversable by node_exporter
      ansible.builtin.file:
        path: "{{ restic_offsite_metrics_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The env file single-quotes every value so whitespace/#/$ can't break its
    # two parsers (systemd EnvironmentFile + shell source). Single quotes and
    # backslashes are the two characters those parsers unescape DIFFERENTLY —
    # a value containing them would silently produce a different password in
    # systemd runs vs manual shell runs, so refuse them outright.
    # no_log: the assert must never render the secret into output.
    - name: Refuse secret values the env-file parsers would disagree on
      ansible.builtin.assert:
        that:
          - not (restic_offsite_repo_password is search("'"))
          - not (restic_offsite_repo_password is search('\\\\'))
          - not (restic_offsite_repo is search("'"))
          - not (restic_offsite_repo is search('\\\\'))
        fail_msg: >-
          restic_offsite_repo_password / restic_offsite_repo must not contain single
          quotes or backslashes (systemd EnvironmentFile and shell `source`
          parse them differently — rotate the 1Password value instead).
      no_log: true

    # no_log: the env file renders RESTIC_PASSWORD (repo password) — the
    # template-writes-a-secret pattern ansible-lint does not catch.
    - name: Render restic-offsite EnvironmentFile (secret)
      ansible.builtin.template:
        src: restic-offsite.env.j2
        dest: "{{ restic_offsite_config_dir }}/env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # no_log: rclone.conf carries the B2 application key.
    - name: Render rclone.conf (secret)
      ansible.builtin.template:
        src: rclone.conf.j2
        dest: "{{ restic_offsite_config_dir }}/rclone.conf"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Render restic exclude file
      ansible.builtin.template:
        src: restic-offsite-excludes.txt.j2
        dest: "{{ restic_offsite_excludes_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Deploy restic-offsitectl control script
      ansible.builtin.template:
        src: restic-offsitectl.sh.j2
        dest: /usr/local/sbin/restic-offsitectl
        owner: root
        group: root
        mode: "0755"

    - name: Deploy restic-offsite systemd service
      ansible.builtin.template:
        src: restic-offsite.service.j2
        dest: /etc/systemd/system/restic-offsite.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd for restic-offsite

    - name: Deploy restic-offsite systemd timer
      ansible.builtin.template:
        src: restic-offsite.timer.j2
        dest: /etc/systemd/system/restic-offsite.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd for restic-offsite

    - name: Enable restic-offsite fallback timer
      ansible.builtin.systemd:
        name: restic-offsite.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Deploy restic-offsite-verify systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - restic-offsite-verify.service
        - restic-offsite-verify.timer
      notify: Reload systemd for restic-offsite

    - name: Enable restic-offsite-verify weekly timer
      ansible.builtin.systemd:
        name: restic-offsite-verify.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    # Quarterly restore drill. Split from the verify units so the off switch is
    # a real one: flipping restic_offsite_restore_drill_enabled false stops and
    # removes them rather than leaving an armed timer behind.
    - name: Deploy the quarterly restore-drill systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - backup-restore-drill.service
        - backup-restore-drill.timer
      when: restic_offsite_restore_drill_enabled | bool
      register: restic_offsite_drill_units
      notify: Reload systemd for restic-offsite

    - name: Enable the quarterly restore-drill timer
      ansible.builtin.systemd:
        name: backup-restore-drill.timer
        enabled: true
        state: started
        daemon_reload: true
      when:
        - restic_offsite_restore_drill_enabled | bool
        - not ansible_check_mode

    # Does a PASSING drill's proof metric already exist? This is the
    # self-healing half of the seed gate below, and it is deliberately a
    # content probe rather than a stat: write_drill_metrics always writes
    # backup_restore_drill.prom (it records _last_run_seconds even on failure),
    # and only ever emits backup_restore_drill_last_success_seconds after a
    # drill in which every compared file matched. The file existing therefore
    # proves nothing; that one line is the proof.
    #
    # `find` rather than a command: it is read-only, supports check mode
    # natively (so the probe still evaluates under --check and the gate below
    # stays honest there), and returns matched=0 instead of failing when the
    # file is absent.
    - name: Probe whether a passing restore drill has ever written its proof metric
      ansible.builtin.find:
        paths: "{{ restic_offsite_metrics_dir }}"
        patterns: backup_restore_drill.prom
        contains: '^backup_restore_drill_last_success_seconds '
      register: restic_offsite_drill_proof
      when: restic_offsite_restore_drill_enabled | bool

    # The gate, as one named fact so it is assertable (molecule pins both arms).
    # LEVEL-triggered: units changed OR the proof metric is still absent, so a
    # failed seed retries next converge instead of being skipped forever. Once a
    # drill has passed both arms are false and no re-run re-spends B2 egress.
    # Why the seed exists at all: README, "Restore drill".
    - name: Decide whether the first restore drill still needs seeding
      ansible.builtin.set_fact:
        restic_offsite_drill_seed_due: >-
          {{ (restic_offsite_drill_units is changed)
             or ((restic_offsite_drill_proof.matched | default(0) | int) == 0) }}
      when: restic_offsite_restore_drill_enabled | bool

    # Seed the FIRST drill at install time (a Persistent=true timer does not
    # fire on first enable). Fails the play when the drill fails — including on
    # a repository with no snapshot yet; set restic_offsite_restore_drill_seed
    # false for that first converge. README, "Restore drill".
    - name: Seed the first restore drill so the proof metric exists
      ansible.builtin.systemd:
        name: backup-restore-drill.service
        state: started
      when:
        - restic_offsite_restore_drill_enabled | bool
        - restic_offsite_restore_drill_seed | bool
        - restic_offsite_drill_seed_due | default(false) | bool
        - not ansible_check_mode
      tags:
        - molecule-notest

    - name: Stop the restore-drill timer when the drill is disabled
      ansible.builtin.systemd:
        name: backup-restore-drill.timer
        enabled: false
        state: stopped
      when:
        - not (restic_offsite_restore_drill_enabled | bool)
        - not ansible_check_mode
      failed_when: false

    - name: Remove the restore-drill units when the drill is disabled
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - backup-restore-drill.service
        - backup-restore-drill.timer
      when: not (restic_offsite_restore_drill_enabled | bool)
      notify: Reload systemd for restic-offsite
