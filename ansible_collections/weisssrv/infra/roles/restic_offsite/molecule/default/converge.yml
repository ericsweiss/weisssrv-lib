---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Apply the restic_offsite role
      ansible.builtin.include_role:
        name: weisssrv.infra.restic_offsite

    # Seed gate, both arms: unchanged units + proof metric present => not due,
    # metric absent => due. Helpers are changed_when: false so the idempotence
    # step sees no change. Contract: README, "Restore drill".
    - name: Write a proof metric as a PASSING drill would
      ansible.builtin.copy:
        dest: /var/lib/node_exporter/backup_restore_drill.prom
        content: |
          backup_restore_drill_last_run_seconds 1
          backup_restore_drill_last_success_seconds 1
          backup_restore_drill_files_compared 3
        owner: root
        group: root
        mode: "0644"
      changed_when: false

    - name: Re-apply the role with the units unchanged and the proof metric present
      ansible.builtin.include_role:
        name: weisssrv.infra.restic_offsite

    - name: Assert a host whose drill has already passed is not re-seeded
      ansible.builtin.assert:
        that:
          - restic_offsite_drill_proof.matched | int == 1
          - not (restic_offsite_drill_seed_due | bool)
        fail_msg: >-
          The seed gate is still due on a host whose restore drill has already
          passed — every converge would re-run the drill and re-spend B2 egress.
        success_msg: "The restore-drill seed is not re-run once a drill has passed"

    # A failed drill still writes the .prom with _last_run_seconds and no
    # _last_success_seconds, so the probe reads content, not existence.
    - name: Overwrite it with what a FAILED first seed leaves behind
      ansible.builtin.copy:
        dest: /var/lib/node_exporter/backup_restore_drill.prom
        content: |
          backup_restore_drill_last_run_seconds 1
          backup_restore_drill_files_compared 0
        owner: root
        group: root
        mode: "0644"
      changed_when: false

    - name: Re-apply the role with the units unchanged after a failed seed
      ansible.builtin.include_role:
        name: weisssrv.infra.restic_offsite

    - name: Assert a failed seed is retried on the next converge
      ansible.builtin.assert:
        that:
          - restic_offsite_drill_proof.matched | int == 0
          - restic_offsite_drill_seed_due | bool
        fail_msg: >-
          The seed gate is not due even though no drill has ever passed — the
          seed is single-shot again, and a converge after a failed seed goes
          green with the proof metric permanently absent.
        success_msg: "A restore-drill seed that failed is retried until one passes"

    - name: Drop the synthetic drill metric file again
      ansible.builtin.file:
        path: /var/lib/node_exporter/backup_restore_drill.prom
        state: absent
      changed_when: false

    # restic trims a password read from RESTIC_PASSWORD_FILE, so a padded value
    # would open a different repository key than the operator stored.
    - name: Re-apply the role with a whitespace-padded repository password
      tags: [molecule-idempotence-notest]
      block:
        - name: Run the role with a padded password
          ansible.builtin.include_role:
            name: weisssrv.infra.restic_offsite
          vars:
            restic_offsite_repo_password: " padded-password "

        - name: Record that the padded password was accepted
          ansible.builtin.set_fact:
            restic_offsite_padded_refused: false
      rescue:
        # Pinned to the guard's task, so an unrelated error cannot pass as it.
        - name: Record which task refused the padded password
          ansible.builtin.set_fact:
            restic_offsite_padded_refused: >-
              {{ ansible_failed_task.name is search('Refuse secret values the env file and restic would read differently') }}

    - name: Assert a padded repository password is refused
      tags: [molecule-idempotence-notest]
      ansible.builtin.assert:
        that:
          - restic_offsite_padded_refused | bool
        fail_msg: >-
          The role accepted a repository password with leading or trailing
          whitespace, so restic would derive a different key from the file than
          from the stored value.
        success_msg: "A padded repository password is refused"

    - name: Re-apply the role so the converged state is restored
      tags: [molecule-idempotence-notest]
      ansible.builtin.include_role:
        name: weisssrv.infra.restic_offsite

    # Interlock guard, swap-clean side: swap-clean enabled on the same host
    # without restic-offsite.service in its conflict list must fail the play.
    - name: Re-apply the role with swap-clean enabled and no interlock
      tags: [molecule-idempotence-notest]
      block:
        - name: Run the role with an interlock-less conflict list
          ansible.builtin.include_role:
            name: weisssrv.infra.restic_offsite
          vars:
            nas_storage_swap_clean_enabled: true
            nas_storage_swap_clean_conflicting_units: [archive-backup.service]

        - name: Record that the missing interlock was accepted
          ansible.builtin.set_fact:
            restic_offsite_interlock_refused: false
      rescue:
        - name: Record which task refused the missing interlock
          ansible.builtin.set_fact:
            restic_offsite_interlock_refused: >-
              {{ ansible_failed_task.name is search('Assert swap-clean is interlocked against the offsite run') }}

    - name: Assert a swap-clean host with no interlock is refused
      tags: [molecule-idempotence-notest]
      ansible.builtin.assert:
        that:
          - restic_offsite_interlock_refused | bool
        fail_msg: >-
          The role accepted nas_storage_swap_clean_enabled with no
          restic-offsite.service in nas_storage_swap_clean_conflicting_units, so
          swap-clean can stop the guests whose zvol clones restic is reading.
        success_msg: "A swap-clean host with no interlock is refused"

    # Interlock guard, offsite side: swap-clean names the offsite run, but the
    # offsite run does not name swap-clean.service, so it must still fail.
    - name: Re-apply the role with only the swap-clean half of the interlock
      tags: [molecule-idempotence-notest]
      block:
        - name: Run the role with an empty offsite conflict list
          ansible.builtin.include_role:
            name: weisssrv.infra.restic_offsite
          vars:
            nas_storage_swap_clean_enabled: true
            nas_storage_swap_clean_conflicting_units: [restic-offsite.service]
            restic_offsite_conflicting_units: []

        - name: Record that the one-sided interlock was accepted
          ansible.builtin.set_fact:
            restic_offsite_reverse_interlock_refused: false
      rescue:
        - name: Record which task refused the one-sided interlock
          ansible.builtin.set_fact:
            restic_offsite_reverse_interlock_refused: >-
              {{ ansible_failed_task.name is search('Assert the offsite run is interlocked against swap-clean') }}

    - name: Assert a one-sided interlock is refused
      tags: [molecule-idempotence-notest]
      ansible.builtin.assert:
        that:
          - restic_offsite_reverse_interlock_refused | bool
        fail_msg: >-
          The role accepted nas_storage_swap_clean_enabled with no
          swap-clean.service in restic_offsite_conflicting_units, so a swap-clean
          night that starts after the offsite run took the lock stops guests
          underneath it.
        success_msg: "A one-sided swap-clean interlock is refused"

    # Both halves present: the role converges and the offsite run skips while
    # swap-clean runs.
    - name: Re-apply the role with the interlock complete on both sides
      tags: [molecule-idempotence-notest]
      ansible.builtin.include_role:
        name: weisssrv.infra.restic_offsite
      vars:
        nas_storage_swap_clean_enabled: true
        nas_storage_swap_clean_conflicting_units: [restic-offsite.service]
        restic_offsite_conflicting_units: [swap-clean.service]

    - name: Read the conflict list the control script carries
      tags: [molecule-idempotence-notest]
      ansible.builtin.command: grep -E '^CONFLICTING_UNITS=' /usr/local/sbin/restic-offsitectl
      register: restic_offsite_interlock_rendered
      changed_when: false

    - name: Assert the complete interlock converged into the control script
      tags: [molecule-idempotence-notest]
      ansible.builtin.assert:
        that:
          - restic_offsite_interlock_rendered.stdout == 'CONFLICTING_UNITS="swap-clean.service"'
        fail_msg: >-
          With both halves of the interlock set the control script carries
          {{ restic_offsite_interlock_rendered.stdout }}, not swap-clean.service.
        success_msg: "A complete swap-clean interlock converges"

    # Off-switch: the units AND the .prom go, or a frozen
    # backup_restore_drill_last_success_seconds keeps a staleness alert firing.
    - name: Check the drill off-switch removes its metric with its units
      tags: [molecule-idempotence-notest]
      block:
        - name: Write a drill metric for the off-switch to clear
          ansible.builtin.copy:
            dest: /var/lib/node_exporter/backup_restore_drill.prom
            content: |
              backup_restore_drill_last_run_seconds 1
              backup_restore_drill_last_success_seconds 1
            owner: root
            group: root
            mode: "0644"
          changed_when: false

        - name: Run the role with the restore drill disabled
          ansible.builtin.include_role:
            name: weisssrv.infra.restic_offsite
          vars:
            restic_offsite_restore_drill_enabled: false

        - name: Stat what the off-switch should have removed
          ansible.builtin.stat:
            path: "{{ item }}"
          register: restic_offsite_drill_off
          loop:
            - /var/lib/node_exporter/backup_restore_drill.prom
            - /etc/systemd/system/backup-restore-drill.service
            - /etc/systemd/system/backup-restore-drill.timer

        - name: Assert the disabled drill leaves no metric and no units behind
          ansible.builtin.assert:
            that:
              - restic_offsite_drill_off.results | rejectattr('stat.exists') | list | length == 3
            fail_msg: >-
              Disabling the restore drill left
              {{ restic_offsite_drill_off.results | selectattr('stat.exists')
                 | map(attribute='item') | list }}
              behind — a frozen proof metric alerts forever with no timer to clear it.
            success_msg: "Disabling the restore drill removes its metric and its units"

    - name: Re-apply the role so the drill units are restored
      tags: [molecule-idempotence-notest]
      ansible.builtin.include_role:
        name: weisssrv.infra.restic_offsite
