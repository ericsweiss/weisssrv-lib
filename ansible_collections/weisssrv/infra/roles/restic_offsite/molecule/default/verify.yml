---
# Verify: the control script + secret files + timers render correctly; a real
# run against the LOCAL restic file repo produces a snapshot and the split
# backup/retention metrics; a second run short-circuits (and --force overrides);
# restore round-trips; the deep-verify cursor advances; the freshness guard
# aborts (success=0) on a stale source; and the static subcommand / metric /
# zvol-clone contract holds.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stat the control script
      ansible.builtin.stat:
        path: /usr/local/sbin/restic-offsitectl
      register: ctl
      failed_when: >-
        not ctl.stat.exists or ctl.stat.mode != '0755'
        or ctl.stat.pw_name != 'root' or ctl.stat.gr_name != 'root'

    - name: Stat the secret files (env + rclone.conf must be 0600)
      ansible.builtin.stat:
        path: "{{ item }}"
      register: secret_files
      loop:
        - /etc/restic-offsite/env
        - /etc/restic-offsite/rclone.conf
      failed_when: >-
        not secret_files.stat.exists or secret_files.stat.mode != '0600'
        or secret_files.stat.pw_name != 'root'

    - name: Stat the exclude file
      ansible.builtin.stat:
        path: /etc/restic-offsite/excludes.txt
      register: excl
      failed_when: not excl.stat.exists

    - name: Check the fallback timer is enabled  # noqa command-instead-of-module
      ansible.builtin.command: systemctl is-enabled restic-offsite.timer
      register: timer_enabled
      changed_when: false
      failed_when: timer_enabled.stdout | trim != 'enabled'

    - name: Check the weekly verify timer is enabled  # noqa command-instead-of-module
      ansible.builtin.command: systemctl is-enabled restic-offsite-verify.timer
      register: restic_offsite_verify_timer_enabled
      changed_when: false
      failed_when: restic_offsite_verify_timer_enabled.stdout | trim != 'enabled'

    - name: Assert the verify service runs the rotating subset mode
      ansible.builtin.command: grep -q 'verify --auto-subset' /etc/systemd/system/restic-offsite-verify.service
      changed_when: false

    # End-to-end SUCCESS path: source the EnvironmentFile (as the systemd unit
    # would) and run against the local file repo. The seeded fresh archsync tree
    # passes the freshness guard; restic inits + backs up + prunes.
    - name: Run restic-offsitectl run (success path)
      ansible.builtin.shell: |
        set -a
        . /etc/restic-offsite/env
        set +a
        restic-offsitectl run
      args:
        executable: /bin/bash
      changed_when: false

    - name: List restic snapshots
      ansible.builtin.shell: |
        set -a; . /etc/restic-offsite/env; set +a
        restic snapshots
      args:
        executable: /bin/bash
      register: snaps
      changed_when: false

    - name: Assert a snapshot was created
      ansible.builtin.assert:
        that:
          - snaps.stdout is search('nightly')
        fail_msg: "restic produced no nightly snapshot after run"
        success_msg: "restic run created a nightly snapshot"

    - name: Read restic_offsite.prom after success
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/restic_offsite.prom
      register: prom_ok

    - name: Assert success metrics present
      ansible.builtin.assert:
        that:
          - "'restic_offsite_last_run_success 1' in (prom_ok.content | b64decode)"
          - "'restic_offsite_last_run_duration_seconds ' in (prom_ok.content | b64decode)"
          - "'restic_offsite_last_success_timestamp_seconds ' in (prom_ok.content | b64decode)"
          - "'restic_offsite_repo_size_bytes ' in (prom_ok.content | b64decode)"
          - "'restic_offsite_snapshot_total_bytes ' in (prom_ok.content | b64decode)"
        fail_msg: "restic_offsite.prom missing expected metrics on success"
        success_msg: "restic_offsite.prom emits all run metrics on success"

    - name: Assert the backup/prune metric split is emitted
      ansible.builtin.assert:
        that:
          - "'restic_offsite_last_backup_success 1' in (prom_ok.content | b64decode)"
          - "'restic_offsite_last_backup_timestamp_seconds ' in (prom_ok.content | b64decode)"
          - "'restic_offsite_last_prune_success 1' in (prom_ok.content | b64decode)"
          - "'restic_offsite_retention_blocked 0' in (prom_ok.content | b64decode)"
          - "'restic_offsite_retention_pending_removals ' in (prom_ok.content | b64decode)"
        fail_msg: >-
          restic_offsite.prom does not separate the backup result from the
          retention result — a refused prune would read as a failed upload.
        success_msg: "restic_offsite.prom reports backup and retention outcomes separately"

    # ALREADY-UPLOADED short-circuit: the primary trigger (the archive job's
    # OnSuccess=) and the fallback timer both fire every night, so a second run
    # against the SAME source generation must skip rather than repeat a full
    # backup + forget --prune. Asserted behaviourally: re-run now, expect rc=0,
    # the already-uploaded log line, and NO additional restic snapshot.
    - name: Count restic snapshots before the duplicate run
      ansible.builtin.shell: |
        set -o pipefail
        set -a; . /etc/restic-offsite/env; set +a
        restic snapshots --json | grep -c '"short_id"'
      args:
        executable: /bin/bash
      register: restic_offsite_snaps_before
      changed_when: false

    - name: Re-run restic-offsitectl run against the same source generation
      ansible.builtin.shell: |
        set -a; . /etc/restic-offsite/env; set +a
        restic-offsitectl run
      args:
        executable: /bin/bash
      register: restic_offsite_duplicate_run
      changed_when: false

    - name: Count restic snapshots after the duplicate run
      ansible.builtin.shell: |
        set -o pipefail
        set -a; . /etc/restic-offsite/env; set +a
        restic snapshots --json | grep -c '"short_id"'
      args:
        executable: /bin/bash
      register: restic_offsite_snaps_after
      changed_when: false

    - name: Assert the duplicate run skipped instead of re-uploading
      ansible.builtin.assert:
        that:
          - restic_offsite_duplicate_run.rc == 0
          - restic_offsite_duplicate_run.stdout is search('already-uploaded')
          - restic_offsite_snaps_after.stdout | int == restic_offsite_snaps_before.stdout | int
        fail_msg: >-
          A second run against the same source generation did not short-circuit
          (snapshots {{ restic_offsite_snaps_before.stdout }} ->
          {{ restic_offsite_snaps_after.stdout }}) — the nightly job is running twice.
        success_msg: "A second run against the same source generation skips (already-uploaded)"

    - name: Assert --force overrides the already-uploaded skip
      ansible.builtin.shell: |
        set -a; . /etc/restic-offsite/env; set +a
        restic-offsitectl run --force
      args:
        executable: /bin/bash
      register: restic_offsite_forced_run
      changed_when: false
      failed_when: >-
        restic_offsite_forced_run.rc != 0
        or restic_offsite_forced_run.stdout is search('already-uploaded')

    # RESTORE round-trip: restore the appdata source (bind mode backs it up at
    # BIND_ROOT/appdata, which cmd_restore's --include prefix matches) into a temp
    # target and assert the seeded payload comes back byte-for-byte.
    - name: Run restic-offsitectl restore (appdata -> temp target)
      ansible.builtin.shell: |
        set -a; . /etc/restic-offsite/env; set +a
        restic-offsitectl restore appdata latest /tmp/restic-molecule-restore-test
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read the restored payload
      ansible.builtin.slurp:
        src: /tmp/restic-molecule-restore-test/tmp/restic-molecule-bind/appdata/payload.txt
      register: restored_payload

    - name: Assert the restored file round-trips the seeded content
      ansible.builtin.assert:
        that:
          - "'molecule appdata payload' in (restored_payload.content | b64decode)"
        fail_msg: "restic-offsitectl restore did not round-trip the seeded appdata payload"
        success_msg: "restic-offsitectl restore round-trips the seeded appdata payload"

    # VERIFY: run `restic-offsitectl verify` (restic check) and assert the verify
    # metric records success=1 in its own .prom.
    - name: Run restic-offsitectl verify (restic check)
      ansible.builtin.shell: |
        set -a; . /etc/restic-offsite/env; set +a
        restic-offsitectl verify
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read the verify metric file
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/restic_offsite_verify.prom
      register: prom_verify

    - name: Assert the verify metric records success
      ansible.builtin.assert:
        that:
          - "'restic_offsite_last_verify_success 1' in (prom_verify.content | b64decode)"
          - "'restic_offsite_last_verify_timestamp_seconds ' in (prom_verify.content | b64decode)"
        fail_msg: "restic-offsitectl verify did not record restic_offsite_last_verify_success 1"
        success_msg: "restic-offsitectl verify records success=1 in its .prom"

    # ROTATING deep verify: the pack-group cursor is persisted (not derived from
    # the calendar), so consecutive runs read group 1 then group 2 and a failed
    # week is retried instead of skipped for a whole cycle.
    - name: Run two rotating deep verifies
      ansible.builtin.shell: |
        set -a; . /etc/restic-offsite/env; set +a
        restic-offsitectl verify --auto-subset
        grep '^restic_offsite_verify_group ' /var/lib/node_exporter/restic_offsite_verify.prom
        restic-offsitectl verify --auto-subset
        grep '^restic_offsite_verify_group ' /var/lib/node_exporter/restic_offsite_verify.prom
      args:
        executable: /bin/bash
      register: restic_offsite_rotation
      changed_when: false

    - name: Assert the deep-verify cursor advances and is persisted
      ansible.builtin.assert:
        that:
          - restic_offsite_rotation.stdout is search('read-data-subset=1/12')
          - restic_offsite_rotation.stdout is search('read-data-subset=2/12')
          - restic_offsite_rotation.stdout is search('restic_offsite_verify_group 2')
        fail_msg: >-
          The rotating deep verify did not advance its persisted group cursor —
          a failed week would be skipped for a full cycle.
        success_msg: "The rotating deep verify advances a persisted group cursor"

    # FRESHNESS-GUARD abort: age the appdata source's snapshot into the past so
    # its parsed timestamp exceeds the max age; a run must abort with success=0
    # BEFORE touching the repo.
    - name: Age one source's snapshot to make it stale
      ansible.builtin.shell: |
        set -eo pipefail
        cur="$(ls -1 /tmp/molsrc/appdata/.zfs/snapshot/ | grep '^archsync-' | tail -1)"
        mv "/tmp/molsrc/appdata/.zfs/snapshot/${cur}" \
           "/tmp/molsrc/appdata/.zfs/snapshot/archsync-20200101-000000"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Run restic-offsitectl run (stale-source abort path)
      ansible.builtin.shell: |
        set -a; . /etc/restic-offsite/env; set +a
        restic-offsitectl run
      args:
        executable: /bin/bash
      register: stale_run
      changed_when: false
      failed_when: stale_run.rc == 0

    - name: Read restic_offsite.prom after the stale abort
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/restic_offsite.prom
      register: prom_stale

    - name: Assert the stale abort records success=0
      ansible.builtin.assert:
        that:
          - "'restic_offsite_last_run_success 0' in (prom_stale.content | b64decode)"
          - stale_run.stdout is search('stale-source')
        fail_msg: "Freshness guard did not abort with success=0 on a stale source"
        success_msg: "Freshness guard aborts + records success=0 on a stale source"

    - name: Assert the restic-offsitectl contract (subcommands, flags, metrics, zvol logic)
      ansible.builtin.script: files/restic-offsite-contract-assert.sh
      changed_when: false

    - name: Assert restic-offsite metric-preservation behavior (executed, not grepped)
      ansible.builtin.script: files/restic-offsite-metrics-behavior.sh
      changed_when: false
