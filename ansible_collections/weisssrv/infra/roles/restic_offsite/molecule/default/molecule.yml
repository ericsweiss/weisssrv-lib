---
# Hermetic scenario: a local restic file repo, bind mode over a fake
# .zfs/snapshot tree from prepare.yml, no network. Shared driver config comes
# from molecule-shared/base.yml via `-c`.
platforms:
  - name: restic-offsite-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        restic_offsite_enabled: true
        # LOCAL file repo — no rclone/B2 contacted.
        restic_offsite_repo: /tmp/restic-molecule-repo
        # bind mode: mount --bind the seeded snapshot subtree at
        # BIND_ROOT/<name>, so backed-up paths match cmd_restore's --include
        # prefixes and the restore round-trip is testable.
        restic_offsite_bind_mode: bind
        restic_offsite_zvol_sources: []
        restic_offsite_cache_dir: /tmp/restic-molecule-cache
        restic_offsite_bind_root: /tmp/restic-molecule-bind
        restic_offsite_zvol_mount_root: /tmp/restic-molecule-zvol
        restic_offsite_metrics_dir: /var/lib/node_exporter
        restic_offsite_restore_base: /tmp/restic-molecule-restore
        # Seeded fake snapshot trees (prepare.yml). Names match the seeded dirs.
        restic_offsite_sources:
          - name: backups
            mountpoint: /tmp/molsrc/backups
          - name: appdata
            mountpoint: /tmp/molsrc/appdata
        # Three distinct per-unit start timeouts: verify.yml asserts each unit
        # gets its own, so a template wired to the shared floor fails.
        restic_offsite_backup_timeout_start_sec: 4h
        restic_offsite_verify_timeout_start_sec: 9h
        restic_offsite_drill_timeout_start_sec: 3h
        # Test-only secrets: a dummy B2 pair and a restic password for the
        # local file repo. verify.yml asserts the keep-tags flag pair lands in
        # the rendered FORGET_FLAGS array.
        restic_offsite_keep_tags: [legacy]
        # Inactive by default; verify.yml starts it to prove an overlapping
        # overnight job makes the run a deliberate skip.
        restic_offsite_conflicting_units: [restic-molecule-conflict.service]
        restic_offsite_b2_key_id: molecule-b2-key-id
        restic_offsite_b2_application_key: molecule-b2-app-key
        restic_offsite_repo_password: molecule-test-password
