---
# Required site inputs with no default, asserted in tasks/main.yml:
# postfix_null_client_relay_host, _mail_domain, _sasl_user, _sasl_password.

postfix_null_client_relay_port: 587

# Where root's mail ends up. Local by default so a site that forgets to map it
# keeps the mail instead of relaying it somewhere unintended.
postfix_null_client_root_alias: root@localhost

postfix_null_client_config:
  myhostname: "{{ inventory_hostname }}.{{ postfix_null_client_mail_domain }}"
  myorigin: "/etc/mailname"
  # CRITICAL: keep $myhostname listed, so the /etc/aliases root rewrite applies
  # to locally delivered mail. Never list the bare domain, or every null client
  # delivers or bounces *@<domain> locally instead of relaying it.
  mydestination: "$myhostname, localhost.localdomain, localhost"
  relayhost: "[{{ postfix_null_client_relay_host }}]:{{ postfix_null_client_relay_port }}"
  # inet_interfaces = loopback-only binds ::1 as well as 127.0.0.1, so a
  # client resolving localhost to ::1 must also be trusted.
  mynetworks: "127.0.0.0/8 [::1]/128"
  inet_interfaces: "loopback-only"
  # CRITICAL: "secure" encrypts and verifies the relay certificate against
  # CAfile; "encrypt" alone lets a LAN MITM capture the SASL credentials. The
  # relay must present a cert for the relay host chaining to the system bundle.
  smtp_tls_security_level: "secure"
  smtp_tls_CAfile: "/etc/ssl/certs/ca-certificates.crt"
  smtp_sasl_auth_enable: "yes"
  smtp_sasl_security_options: "noanonymous"
  smtp_sasl_password_maps: "hash:/etc/postfix/sasl_passwd"

# Added to (and overriding) postfix_null_client_config at render time, so a site
# can set one main.cf parameter without restating the whole map.
postfix_null_client_config_extra: {}

postfix_null_client_aliases:
  postmaster: root
  nobody: root
  hostmaster: root
  webmaster: root
  root: "{{ postfix_null_client_root_alias }}"
