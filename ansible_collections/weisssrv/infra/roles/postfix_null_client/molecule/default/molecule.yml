---
platforms:
  - name: postfix-null-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        # Only the required inputs: postfix_null_client_config and
        # _aliases are left at their defaults so the scenario exercises the
        # shipped rendering rather than a scenario-local copy of it.
        postfix_null_client_relay_host: smtp-relay.test.local
        postfix_null_client_mail_domain: test.local
        postfix_null_client_sasl_user: testuser
        postfix_null_client_sasl_password: testpassword
        postfix_null_client_root_alias: test@test.local
