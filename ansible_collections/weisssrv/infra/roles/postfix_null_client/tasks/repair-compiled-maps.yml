---
# Self-heal for postfix's compiled map databases, comparing each .db against
# the configured value rather than just "resolves to something". Shared with
# weisssrv.infra.smtp_relay. Input: postfix_null_client_maps_root_alias.

- name: Check that the compiled alias database resolves root to the configured target
  ansible.builtin.command:
    cmd: postmap -q root hash:/etc/aliases
  register: postfix_null_client_maps_alias_root
  changed_when: false
  failed_when: false
  check_mode: false

- name: Rebuild the alias database when it does not match the configured target
  ansible.builtin.command:
    cmd: newaliases
  changed_when: true
  when:
    - postfix_null_client_maps_root_alias | default('', true) | length > 0
    - (postfix_null_client_maps_alias_root.stdout | trim) != (postfix_null_client_maps_root_alias | trim)

# The comparison happens inside the shell so the credential never reaches a log
# or a registered value. rc 0 means the .db matches the source; anything else
# rebuilds.
- name: Check that the compiled SASL map matches the deployed credential
  ansible.builtin.shell: |
    set -o pipefail
    key=$(awk '$1 !~ /^#/ && NF > 1 {print $1; exit}' /etc/postfix/sasl_passwd)
    [ -n "$key" ] || exit 2
    src=$(awk -v k="$key" '$1 == k {sub(/^[^[:blank:]]+[[:blank:]]+/, ""); print; exit}' \
      /etc/postfix/sasl_passwd | sha256sum)
    db=$(postmap -q "$key" hash:/etc/postfix/sasl_passwd | sha256sum)
    [ "$src" = "$db" ]
  args:
    executable: /bin/bash
  register: postfix_null_client_maps_sasl_map
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Rebuild the SASL password database when it does not match the source
  ansible.builtin.command:
    cmd: postmap /etc/postfix/sasl_passwd
  changed_when: true
  when: postfix_null_client_maps_sasl_map.rc != 0
  no_log: true
