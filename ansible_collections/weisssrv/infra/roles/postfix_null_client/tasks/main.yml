---
# Postfix null client: forwards all local mail to a central SMTP relay.

- name: Assert the host runs a supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: "postfix_null_client supports Debian only (see meta/main.yml)"

- name: Validate the required relay inputs are present
  ansible.builtin.assert:
    that:
      - postfix_null_client_relay_host | default('') | length > 0
      - postfix_null_client_mail_domain | default('') | length > 0
    fail_msg: >-
      postfix_null_client_relay_host and postfix_null_client_mail_domain are
      required (the relay to authenticate to, and the domain appended to
      inventory_hostname for myhostname/mailname).

# Split from the input assert so each failure names only its own inputs.
- name: Validate SMTP relay credentials are present
  ansible.builtin.assert:
    that:
      - postfix_null_client_sasl_user | default('') | length > 0
      - postfix_null_client_sasl_password | default('') | length > 0
    fail_msg: >-
      postfix_null_client_sasl_user / postfix_null_client_sasl_password are not
      set — supply them from the site's secret store.
    success_msg: "SMTP relay credentials validated"

- name: Install postfix and dependencies
  ansible.builtin.apt:
    name:
      - postfix
      - libsasl2-modules
      - mailutils
    state: present

- name: Configure mailname
  ansible.builtin.copy:
    content: "{{ postfix_null_client_config.myhostname }}\n"
    dest: /etc/mailname
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Deploy postfix main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Deploy SASL password file
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"
  notify:
    - Postmap sasl_passwd
    - Reload postfix
  no_log: true

- name: Deploy virtual aliases
  ansible.builtin.template:
    src: virtual.j2
    dest: /etc/postfix/virtual
    owner: root
    group: root
    mode: "0644"
  notify:
    - Postmap virtual
    - Reload postfix
  when: postfix_null_client_virtual_aliases is defined

# main.cf.j2 drops virtual_alias_maps under the same guard, so dropping the var
# leaves the table unreferenced. Remove the files rather than leave unmanaged
# state a re-add could silently reuse.
- name: Remove orphaned virtual alias table when no aliases are configured
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/postfix/virtual
    - /etc/postfix/virtual.db
  when: postfix_null_client_virtual_aliases is not defined
  notify: Reload postfix

- name: Configure mail aliases
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  notify: Newaliases

# Both map sources are notify-only, so a lost handler leaves a correct source
# next to a stale compiled .db that postfix keeps reading. Placed before service
# start so a first converge has a usable sasl_passwd.db.
- name: Repair stale compiled postfix maps
  ansible.builtin.import_tasks: repair-compiled-maps.yml
  vars:
    postfix_null_client_maps_root_alias: "{{ postfix_null_client_aliases.root | default('') }}"

- name: Ensure postfix is enabled and running
  ansible.builtin.service:
    name: postfix
    state: started
    enabled: true
