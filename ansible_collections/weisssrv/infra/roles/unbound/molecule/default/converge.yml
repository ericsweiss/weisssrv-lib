---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - dnsutils
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: weisssrv.infra.unbound
