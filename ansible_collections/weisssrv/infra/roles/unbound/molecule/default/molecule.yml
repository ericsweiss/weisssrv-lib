---
platforms:
  - name: unbound-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    # Adds a superseded drop-in on top of the shared prep so converge exercises
    # the legacy-removal path.
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        unbound_port: 5335
        unbound_interface: 127.0.0.1
        unbound_access_control:
          - 127.0.0.0/8 allow
        unbound_forwarders:
          - addr: 1.1.1.1
            port: 853
            name: cloudflare-dns.com
          - addr: 8.8.8.8
            port: 853
            name: dns.google
