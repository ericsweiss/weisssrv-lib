---
unbound_port: 5335

# Filename of the role-managed drop-in under /etc/unbound/unbound.conf.d/.
unbound_dropin_name: managed.conf

# Drop-ins this role previously owned; removed on every run (never the current
# unbound_dropin_name). unbound merges the drop-in dir with a SORTED glob, so a
# leftover that sorts after the managed file wins every duplicated scalar.
unbound_legacy_dropins:
  - weisssrv.conf

# Listen addresses. unbound_interface is the readiness-probe target and the sole
# default entry; add ::1 to unbound_interfaces to also serve IPv6 loopback, and
# pair it with a matching unbound_access_control entry.
unbound_interface: 127.0.0.1
unbound_interfaces: "{{ [unbound_interface] }}"
# Name the readiness probe resolves through unbound_interface. It must resolve
# to an A record via the configured forwarders, so a deployment without public
# egress has to point this at a name its own upstreams answer.
unbound_probe_name: google.com

# Matches unbound_interfaces — nothing listens on ::1 by default, so no ACL is
# emitted for it. unbound refuses every netblock not listed here.
unbound_access_control:
  - "127.0.0.0/8 allow"

# Performance tuning
unbound_num_threads: 2
unbound_msg_cache_size: 16m
unbound_rrset_cache_size: 32m
unbound_outgoing_range: 8192
unbound_num_queries_per_thread: 4096
unbound_so_reuseport: true

# Advanced features
unbound_serve_expired: true
unbound_serve_expired_ttl: 86400
unbound_aggressive_nsec: true
unbound_edns_buffer_size: 1232
# 0x20 DNS-name randomization; redundant behind DoT and a known SERVFAIL source
# against upstreams that normalize case.
unbound_use_caps_for_id: true

unbound_forwarders:
  - addr: "1.1.1.1"
    port: 853
    name: "cloudflare-dns.com"
  - addr: "1.0.0.1"
    port: 853
    name: "cloudflare-dns.com"
  - addr: "9.9.9.9"
    port: 853
    name: "dns.quad9.net"
  - addr: "149.112.112.112"
    port: 853
    name: "dns.quad9.net"
  - addr: "8.8.8.8"
    port: 853
    name: "dns.google"
  - addr: "8.8.4.4"
    port: 853
    name: "dns.google"
