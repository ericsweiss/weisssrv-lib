---
# Unbound DNS resolver configuration
# Provides DoT upstream resolution for AdGuard Home

- name: Install Unbound
  ansible.builtin.apt:
    name:
      - unbound
      - dns-root-data
      # dig is used by the readiness probe below; install it here so the role is
      # self-contained rather than relying on the base role having run first.
      - dnsutils
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Remove superseded role-owned Unbound drop-ins
  ansible.builtin.file:
    path: "/etc/unbound/unbound.conf.d/{{ item }}"
    state: absent
  loop: "{{ unbound_legacy_dropins | default([]) }}"
  when: item != unbound_dropin_name
  notify: Restart unbound

- name: Deploy Unbound main configuration
  ansible.builtin.template:
    src: unbound-managed.conf.j2
    dest: "/etc/unbound/unbound.conf.d/{{ unbound_dropin_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart unbound

- name: Deploy remote-control configuration
  ansible.builtin.copy:
    content: |
      remote-control:
        control-enable: yes
        control-interface: /run/unbound.ctl
        # Unix socket, no control certs (control-use-cert: no)
        control-use-cert: no
    dest: /etc/unbound/unbound.conf.d/remote-control.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart unbound

- name: Ensure Unbound is enabled and running
  ansible.builtin.service:
    name: unbound
    state: started
    enabled: true

- name: Flush handlers before verification
  ansible.builtin.meta: flush_handlers

- name: Verify Unbound is listening
  ansible.builtin.wait_for:
    host: "{{ unbound_interface }}"
    port: "{{ unbound_port }}"
    timeout: 30

- name: Verify Unbound can resolve DNS queries
  ansible.builtin.command:
    cmd: dig @127.0.0.1 -p {{ unbound_port }} google.com +short +time=5
  register: unbound_test
  changed_when: false
  retries: 3
  delay: 2
  # Check both exit code AND that we got an IP address in the output
  # dig can return rc=0 with SERVFAIL/NXDOMAIN but no IP in +short output
  until: unbound_test.rc == 0 and (unbound_test.stdout | regex_search('^\d+\.\d+\.\d+\.\d+', multiline=True) is not none)
  when: not ansible_check_mode

# NOTE: resolv.conf is NOT updated here because unbound listens on port 5335
# The adguard_home role updates resolv.conf after AdGuard Home is running on port 53
# Architecture: resolv.conf -> AdGuard Home (53) -> Unbound (5335) -> Internet (DoT)
