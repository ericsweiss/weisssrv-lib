---
# nic_tuning: four host-level network fixes that must survive a reboot — per-NIC
# ethtool offload overrides (drivers that wedge with GRO/TSO on), a sticky
# ip_forward, a lowered vm.swappiness on memory-committed hosts, and the
# active-backup bond all_slaves_active guard. Rationale for each is in README.md.

- name: Install sysctl.d drop-in for ip_forward
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-nic-tuning-ip-forward.conf
    content: |
      # Managed by Ansible nic_tuning role.
      # Required for overlay-VPN subnet routing. pve_firewall can reset this via
      # its own sysctl resets; persisting in sysctl.d re-applies it on every boot
      # and on `sysctl --system`.
      net.ipv4.ip_forward=1
    owner: root
    group: root
    mode: "0644"
  when: nic_tuning_ip_forward | bool
  notify: Reload sysctl ip_forward

- name: Remove sysctl.d ip_forward drop-in when disabled
  ansible.builtin.file:
    path: /etc/sysctl.d/99-nic-tuning-ip-forward.conf
    state: absent
  when: not (nic_tuning_ip_forward | bool)
  notify: Disable sysctl ip_forward

- name: Install sysctl.d drop-in for vm.swappiness
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-nic-tuning-swappiness.conf
    content: |
      # Managed by Ansible nic_tuning role.
      # Lower swappiness on memory-committed hosts so the kernel reclaims page
      # cache / balloons guest RAM before swapping (the default 60 thrashes swap
      # under guest + ZFS ARC pressure). Re-applied on every boot.
      vm.swappiness={{ nic_tuning_vm_swappiness }}
    owner: root
    group: root
    mode: "0644"
  when: nic_tuning_vm_swappiness is not none
  notify: Reload sysctl swappiness

- name: Remove sysctl.d vm.swappiness drop-in when unmanaged
  ansible.builtin.file:
    path: /etc/sysctl.d/99-nic-tuning-swappiness.conf
    state: absent
  when: nic_tuning_vm_swappiness is none
  notify: Disable sysctl swappiness

- name: Install ethtool for NIC overrides
  ansible.builtin.apt:
    name: ethtool
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - nic_tuning_overrides | length > 0

- name: Ensure /etc/network/interfaces.d exists
  ansible.builtin.file:
    path: /etc/network/interfaces.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nic_tuning_overrides | length > 0

- name: Find existing NIC tuning drop-ins
  ansible.builtin.find:
    paths: /etc/network/interfaces.d
    patterns: "99-nic-*-tuning.cfg"
  register: nic_tuning_existing_dropins
  failed_when: false

- name: Remove stale NIC tuning drop-ins
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nic_tuning_existing_dropins.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    # Only clean up if this host has overrides declared — otherwise we'd
    # delete drop-ins on hosts that legitimately have no overrides but
    # had them previously (or had them set by another tool).
    - nic_tuning_overrides | length > 0
    - item.path | basename not in (nic_tuning_overrides | map(attribute='interface') | map('regex_replace', '^(.*)$', '99-nic-\\1-tuning.cfg') | list)

- name: Install per-NIC ethtool drop-ins
  ansible.builtin.template:
    src: nic-ethtool.cfg.j2
    dest: "/etc/network/interfaces.d/99-nic-{{ item.interface }}-tuning.cfg"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nic_tuning_overrides }}"
  loop_control:
    label: "{{ item.interface }}"

# Compare-then-set against the feature table, not a blind `ethtool -K`: a
# renamed interface, a typo'd feature or a driver that rejects the change must
# fail the play instead of leaving the offload silently on — this role exists to
# keep NICs out of a driver deadlock/TX hang. The `ethtool -k` diff is what
# reports `changed`; ethtool itself is silent on both a real apply and a no-op,
# and exits non-zero when it could not apply the request.
- name: Apply ethtool overrides now (compare-then-set)
  ansible.builtin.shell: |
    set -euo pipefail
    before=$(ethtool -k {{ item.0.interface | quote }})
    ethtool -K {{ item.0.interface | quote }} {{ item.1.feature | quote }} {{ item.1.value | quote }}
    after=$(ethtool -k {{ item.0.interface | quote }})
    if [ "$before" = "$after" ]; then echo OK; else echo CHANGED; fi
  args:
    executable: /bin/bash
  loop: "{{ nic_tuning_overrides | subelements('options', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.interface }} {{ item.1.feature }}={{ item.1.value }}"
  register: nic_tuning_ethtool_apply
  changed_when: "'CHANGED' in nic_tuning_ethtool_apply.stdout"

# active-backup bond MAC-flap guard
# Force all_slaves_active=0 on active-backup bonds so the inactive backup leg's
# reflected frames are dropped instead of poisoning the bridge FDB. THREE layers,
# because the value is really decided at module-load, not by the interfaces file:
#   1. /etc/modprobe.d/bonding.conf — the ACTUAL boot-time control. The bonding
#      module option sets every bond's default when the module loads (before
#      ifupdown2 runs). A stale `all_slaves_active=1` here is why the guard does
#      not survive a reboot on its own: ifupdown2 does NOT honor the
#      `bond-all_slaves_active` interfaces stanza, so that rewrite left the kernel
#      value at the module default (1) after every boot.
#   2. /etc/network/interfaces stanza (surgical, no reload) — belt-and-suspenders
#      for any ifupdown2 that does honor it; harmless where it does not.
#   3. runtime sysfs — applies the fix live now, without a reboot.
# See defaults/main.yml and README.md.
- name: Stat /etc/network/interfaces for the bond all_slaves_active guard
  ansible.builtin.stat:
    path: /etc/network/interfaces
  register: nic_tuning_etc_interfaces
  when: nic_tuning_bond_asa_guard | bool

- name: Persist bond all_slaves_active=0 in /etc/network/interfaces
  # Surgical: only rewrites an explicit `...=1` to `0`; never inserts a line, so
  # a hand-maintained interfaces file is otherwise untouched. Deliberately does
  # NOT notify a networking reload — the runtime task below applies it live, and
  # a reload would blip the uplink. The edit takes effect on the next reboot.
  ansible.builtin.replace:
    path: /etc/network/interfaces
    regexp: '^(\s*bond-all_slaves_active\s+)1\b'
    replace: '\g<1>0'
  when:
    - nic_tuning_bond_asa_guard | bool
    - nic_tuning_etc_interfaces.stat.exists | default(false)

- name: Stat /etc/modprobe.d/bonding.conf for the bonding module option
  ansible.builtin.stat:
    path: /etc/modprobe.d/bonding.conf
  register: nic_tuning_bonding_modprobe
  when: nic_tuning_bond_asa_guard | bool

- name: Force all_slaves_active=0 in the bonding module options (boot-time control)
  # Surgically flip a stale `all_slaves_active=1` to `=0`, preserving fail_over_mac
  # and any other module options. This is what actually decides the value at boot:
  # the module default applies when bonding loads, before ifupdown2 runs. Only
  # touches an existing file — a host with no bonding.conf already gets the kernel
  # default (0), so there is nothing to force. Takes effect on the next module
  # load (reboot); the runtime task below applies it live now. No initramfs
  # rebuild needed: bonding loads at network-up from the live /etc/modprobe.d.
  ansible.builtin.replace:
    path: /etc/modprobe.d/bonding.conf
    regexp: '(\ball_slaves_active=)1\b'
    replace: '\g<1>0'
  when:
    - nic_tuning_bond_asa_guard | bool
    - nic_tuning_bonding_modprobe.stat.exists | default(false)

- name: Enforce all_slaves_active=0 on active-backup bonds at runtime (no reboot)
  ansible.builtin.shell: |
    set -eu
    [ -r /sys/class/net/bonding_masters ] || { echo OK; exit 0; }
    changed=0
    for b in $(cat /sys/class/net/bonding_masters); do
      mode=$(awk '{print $1}' "/sys/class/net/$b/bonding/mode" 2>/dev/null || true)
      cur=$(cat "/sys/class/net/$b/bonding/all_slaves_active" 2>/dev/null || true)
      if [ "$mode" = "active-backup" ] && [ "$cur" = "1" ]; then
        echo 0 > "/sys/class/net/$b/bonding/all_slaves_active" && changed=1
      fi
    done
    [ "$changed" -eq 1 ] && echo CHANGED || echo OK
  args:
    executable: /bin/bash
  register: nic_tuning_bond_asa_runtime
  changed_when: "'CHANGED' in nic_tuning_bond_asa_runtime.stdout"
  when: nic_tuning_bond_asa_guard | bool
