---
# Host-level network fixes that must survive a reboot: per-NIC ethtool offload
# overrides, a sticky ip_forward, a lowered vm.swappiness, the active-backup
# bond all_slaves_active guard, and per-interface IPv6 disable. See README.md.

- name: Install sysctl.d drop-in for ip_forward
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-nic-tuning-ip-forward.conf
    content: |
      # Managed by Ansible nic_tuning role.
      # Required for overlay-VPN subnet routing. pve-firewall resets the live
      # value; sysctl.d re-applies it at boot and on `sysctl --system`.
      net.ipv4.ip_forward=1
    owner: root
    group: root
    mode: "0644"
  when: nic_tuning_ip_forward | bool
  notify: Reload sysctl ip_forward

# Removing the drop-in does not force ip_forward=0: another role may
# legitimately need forwarding (Tailscale subnet routing), and the live value
# reverts to the kernel default at the next reboot.
- name: Remove sysctl.d ip_forward drop-in when disabled
  ansible.builtin.file:
    path: /etc/sysctl.d/99-nic-tuning-ip-forward.conf
    state: absent
  when: not (nic_tuning_ip_forward | bool)

- name: Install sysctl.d drop-in for vm.swappiness
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-nic-tuning-swappiness.conf
    content: |
      # Managed by Ansible nic_tuning role.
      # Lower swappiness so the kernel reclaims page cache before swapping;
      # the default 60 thrashes swap under guest + ZFS ARC pressure.
      vm.swappiness={{ nic_tuning_vm_swappiness }}
    owner: root
    group: root
    mode: "0644"
  when: nic_tuning_vm_swappiness is not none
  notify: Reload sysctl swappiness

# As above: the drop-in goes, the live value is left alone and reverts to the
# kernel default at the next reboot.
- name: Remove sysctl.d vm.swappiness drop-in when unmanaged
  ansible.builtin.file:
    path: /etc/sysctl.d/99-nic-tuning-swappiness.conf
    state: absent
  when: nic_tuning_vm_swappiness is none

- name: Install ethtool for NIC overrides
  ansible.builtin.apt:
    name: ethtool
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - nic_tuning_overrides | length > 0

- name: Ensure /etc/network/interfaces.d exists
  ansible.builtin.file:
    path: /etc/network/interfaces.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nic_tuning_overrides | length > 0

- name: Find existing NIC tuning drop-ins
  ansible.builtin.find:
    paths: /etc/network/interfaces.d
    patterns: "99-nic-*-tuning.cfg"
  register: nic_tuning_existing_dropins
  failed_when: false

- name: Remove stale NIC tuning drop-ins
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nic_tuning_existing_dropins.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  # Reconciles the role's own 99-nic-*-tuning.cfg glob against the declared
  # list, so clearing nic_tuning_overrides removes the drop-ins it wrote.
  when:
    - item.path | basename not in (nic_tuning_overrides | map(attribute='interface') | map('regex_replace', '^(.*)$', '99-nic-\\1-tuning.cfg') | list)

- name: Install per-NIC ethtool drop-ins
  ansible.builtin.template:
    src: nic-ethtool.cfg.j2
    dest: "/etc/network/interfaces.d/99-nic-{{ item.interface }}-tuning.cfg"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nic_tuning_overrides }}"
  loop_control:
    label: "{{ item.interface }}"

# Compare-then-set so `changed` reflects a real kernel transition. Failures are
# not raised here; the read-back assert below owns the diagnosis.
- name: Apply ethtool overrides now (compare-then-set)
  ansible.builtin.shell: |
    set -euo pipefail
    before=$(ethtool -k {{ item.0.interface | quote }})
    ethtool -K {{ item.0.interface | quote }} {{ item.1.feature | quote }} {{ item.1.value | quote }}
    after=$(ethtool -k {{ item.0.interface | quote }})
    if [ "$before" = "$after" ]; then echo OK; else echo CHANGED; fi
  args:
    executable: /bin/bash
  loop: "{{ nic_tuning_overrides | subelements('options', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.interface }} {{ item.1.feature }}={{ item.1.value }}"
  register: nic_tuning_ethtool_apply
  changed_when: "'CHANGED' in nic_tuning_ethtool_apply.stdout"
  failed_when: false

# Without this the role can go green with the offloads still on: the apply
# swallows failures and the ifup drop-in's only failure signal is a syslog line.
- name: Verify the applied NIC offload overrides took effect
  ansible.builtin.include_tasks: verify-offloads.yml
  when:
    - nic_tuning_verify_offloads | bool
    - nic_tuning_overrides | length > 0

# active-backup bond MAC-flap guard in three layers, because the value is decided
# at module load: /etc/modprobe.d/bonding.conf (the boot-time authority), the
# interfaces stanza, and runtime sysfs for the live fix. Rationale: README.
- name: Stat /etc/network/interfaces for the bond all_slaves_active guard
  ansible.builtin.stat:
    path: /etc/network/interfaces
  register: nic_tuning_etc_interfaces
  when: nic_tuning_bond_asa_guard | bool

- name: Persist bond all_slaves_active=0 in /etc/network/interfaces
  # Only rewrites an explicit `...=1` to `0`, never inserts a line. No
  # networking reload: the runtime task below applies it live without blipping
  # the uplink.
  ansible.builtin.replace:
    path: /etc/network/interfaces
    regexp: '^(\s*bond-all_slaves_active\s+)1\b'
    replace: '\g<1>0'
  when:
    - nic_tuning_bond_asa_guard | bool
    - nic_tuning_etc_interfaces.stat.exists | default(false)

- name: Stat /etc/modprobe.d/bonding.conf for the bonding module option
  ansible.builtin.stat:
    path: /etc/modprobe.d/bonding.conf
  register: nic_tuning_bonding_modprobe
  when: nic_tuning_bond_asa_guard | bool

- name: Force all_slaves_active=0 in the bonding module options (boot-time control)
  # Flips a stale `all_slaves_active=1`, preserving the other module options.
  # Without the file the module default is already 0. Applies at next module
  # load; bonding loads at network-up, so no initramfs rebuild.
  ansible.builtin.replace:
    path: /etc/modprobe.d/bonding.conf
    regexp: '(\ball_slaves_active=)1\b'
    replace: '\g<1>0'
  when:
    - nic_tuning_bond_asa_guard | bool
    - nic_tuning_bonding_modprobe.stat.exists | default(false)

- name: Enforce all_slaves_active=0 on active-backup bonds at runtime (no reboot)
  ansible.builtin.shell: |
    set -eu
    [ -r /sys/class/net/bonding_masters ] || { echo "NOBOND no bonding_masters"; exit 0; }
    changed=0
    for b in $(cat /sys/class/net/bonding_masters); do
      d="/sys/class/net/$b/bonding"
      # A bond torn down mid-loop is benign; an unreadable attribute is not,
      # because an unchecked bond is the black-hole condition going unnoticed.
      [ -d "$d" ] || continue
      if [ ! -r "$d/mode" ] || [ ! -r "$d/all_slaves_active" ]; then
        echo "READFAIL $d"
        exit 4
      fi
      mode=$(awk '{print $1}' "$d/mode")
      cur=$(cat "$d/all_slaves_active")
      if [ "$mode" = "active-backup" ] && [ "$cur" = "1" ]; then
        if ! echo 0 > "$d/all_slaves_active"; then
          echo "WRITEFAIL $d/all_slaves_active"
          exit 4
        fi
        changed=1
      fi
    done
    [ "$changed" -eq 1 ] && echo CHANGED || echo OK
  args:
    executable: /bin/bash
  register: nic_tuning_bond_asa_runtime
  changed_when: "'CHANGED' in nic_tuning_bond_asa_runtime.stdout"
  failed_when: nic_tuning_bond_asa_runtime.rc != 0
  when: nic_tuning_bond_asa_guard | bool

- name: Report that the bond guard was not applied at runtime
  # The persisted modprobe option applies at the next module load.
  ansible.builtin.debug:
    msg: >-
      No bonding_masters on {{ inventory_hostname }}: all_slaves_active=0 is
      persisted in /etc/modprobe.d/bonding.conf and applies at the next boot.
  when:
    - nic_tuning_bond_asa_guard | bool
    - "'NOBOND' in nic_tuning_bond_asa_runtime.stdout | default('')"

# Null, empty and whitespace-only all mean unset: an empty string would persist
# a valueless `bond-primary` attribute and clear the live pin on every bond.
- name: Pin the preferred leg of an active-backup bond
  ansible.builtin.include_tasks: bond-primary.yml
  when: (nic_tuning_bond_primary | default('', true) | trim) | length > 0

- name: Remove a bond-leg pin the inventory no longer declares
  ansible.builtin.include_tasks: bond-primary-absent.yml
  when:
    - (nic_tuning_bond_primary | default('', true) | trim) | length == 0
    - nic_tuning_bond_primary_manage_absent | default(true) | bool

# Fully disable IPv6 on the listed interfaces: an IPv4-only segment's untagged
# link-local is an L2 path the VLAN firewall never sees. Slash-separated sysctl
# keys (see README); the live apply writes /proc directly, so no reboot.
- name: Install sysctl.d drop-in to disable IPv6 on selected interfaces
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-nic-tuning-disable-ipv6.conf
    content: |
      # Managed by Ansible nic_tuning role (nic_tuning_disable_ipv6).
      # Keys use '/' as the separator so an interface name containing a dot
      # (e.g. a VLAN subinterface nic1.10) resolves correctly.
      {% for iface in nic_tuning_disable_ipv6 %}
      net/ipv6/conf/{{ iface }}/disable_ipv6 = 1
      net/ipv6/conf/{{ iface }}/autoconf = 0
      net/ipv6/conf/{{ iface }}/accept_ra = 0
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: nic_tuning_disable_ipv6 | length > 0

# Dropping an interface stops persisting the disable; the live value reverts at
# the next reboot, like the ip_forward and swappiness knobs.
- name: Remove disable-IPv6 sysctl.d drop-in when unset
  ansible.builtin.file:
    path: /etc/sysctl.d/99-nic-tuning-disable-ipv6.conf
    state: absent
  when: nic_tuning_disable_ipv6 | length == 0

# Live apply, dot-safe: writes the proc nodes directly. Compare-then-set, and
# fails loudly (MISSING, rc 3) on an absent interface.
- name: Disable IPv6 on the listed interfaces now (live, no reboot)
  ansible.builtin.shell: |
    set -eu
    base="/proc/sys/net/ipv6/conf/{{ item }}"
    changed=0
    for kv in "disable_ipv6 1" "autoconf 0" "accept_ra 0"; do
      set -- $kv
      path="${base}/$1"
      [ -w "$path" ] || { echo "MISSING ${path}"; exit 3; }
      if [ "$(cat "$path")" != "$2" ]; then echo "$2" > "$path"; changed=1; fi
    done
    [ "$changed" -eq 1 ] && echo CHANGED || echo OK
  args:
    executable: /bin/bash
  loop: "{{ nic_tuning_disable_ipv6 }}"
  register: nic_tuning_ipv6_apply
  changed_when: "'CHANGED' in nic_tuning_ipv6_apply.stdout"
  when: nic_tuning_disable_ipv6 | length > 0
