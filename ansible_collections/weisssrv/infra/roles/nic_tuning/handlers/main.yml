---
# Each sysctl is applied with the module rather than `sysctl --system`, so an
# unrelated bad entry under /etc/sysctl.d/ cannot fail or mask these applies.
- name: Reload sysctl ip_forward
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-nic-tuning-ip-forward.conf
    reload: true

- name: Reload sysctl swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ nic_tuning_vm_swappiness }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-nic-tuning-swappiness.conf
    reload: true
