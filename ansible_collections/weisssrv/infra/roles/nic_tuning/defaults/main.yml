---
# Per-NIC ethtool feature overrides via drop-ins in /etc/network/interfaces.d/
# (schema: README), plus an optional ip_forward sysctl drop-in — needed on
# Proxmox hosts for overlay-VPN subnet routing, because pve_firewall otherwise
# resets the live sysctl and only a /etc/sysctl.d/ drop-in survives a reboot.
nic_tuning_overrides: []
nic_tuning_ip_forward: false

# Read the applied overrides back out of the kernel and fail the play when they
# are not live. Leave true on every real host: with it false a refused or
# silently-ignored `ethtool -K` is invisible. Only the molecule scenario sets it
# false, because a container's lo/veth may expose no ethtool feature ioctls.
nic_tuning_verify_offloads: true

# `ethtool -K` takes short feature names, `ethtool --show-features` reports long
# ones, so the read-back needs the mapping: every short name used in
# nic_tuning_overrides needs an entry here or the assert fails saying so. Names
# per ethtool(8) "feature names" / netdev_features.h.
nic_tuning_feature_names:
  gro: generic-receive-offload
  gso: generic-segmentation-offload
  lro: large-receive-offload
  ntuple: ntuple-filters
  rx: rx-checksumming
  rxhash: receive-hashing
  rxvlan: rx-vlan-offload
  sg: scatter-gather
  tso: tcp-segmentation-offload
  tx: tx-checksumming
  txvlan: tx-vlan-offload
  ufo: udp-fragmentation-offload

# Lower vm.swappiness on memory-committed hosts. Set to an integer (0-100) per
# host/group to write a /etc/sysctl.d/ drop-in and apply it live; leave null (the
# default) to leave swappiness unmanaged (kernel default 60). A host running
# guests plus ZFS ARC typically wants 1, paired with an ARC cap.
nic_tuning_vm_swappiness: null

# Force all_slaves_active=0 on active-backup bonds, which stops the inactive
# leg's reflected frames from poisoning the bridge FDB into an intermittent
# MAC-flap black-hole (README). Set false only if a bond legitimately needs =1,
# e.g. multicast RX across multiple switches.
nic_tuning_bond_asa_guard: true
