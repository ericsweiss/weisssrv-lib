---
# Per-NIC ethtool feature overrides via drop-ins in /etc/network/interfaces.d/
# (schema: README), plus an optional ip_forward sysctl drop-in — needed on
# Proxmox hosts for overlay-VPN subnet routing, because pve_firewall otherwise
# resets the live sysctl and only a /etc/sysctl.d/ drop-in survives a reboot.
nic_tuning_overrides: []
nic_tuning_ip_forward: false

# Lower vm.swappiness on memory-committed hosts. Set to an integer (0-100) per
# host/group to write a /etc/sysctl.d/ drop-in and apply it live; leave null (the
# default) to leave swappiness unmanaged (kernel default 60). A host running
# guests plus ZFS ARC typically wants 1, paired with an ARC cap.
nic_tuning_vm_swappiness: null

# Guard against a MAC-flap black-hole on active-backup bonds whose two legs
# share an unmanaged (dumb) switch. With `all_slaves_active=1` the bonding
# driver DELIVERS frames received on the inactive backup leg; the switch floods
# each guest's own frames back onto that leg, so the host bridge learns the
# guest MAC on bond0 (not its veth) and misdirects the guest's unicast return
# traffic out to the switch — an intermittent, recurring outage. Forcing
# `all_slaves_active=0` drops those inactive-leg frames and stops the bridge-FDB
# poisoning. The authoritative of the three places the guard writes it is
# /etc/modprobe.d/bonding.conf: the interfaces stanza alone does NOT survive a
# reboot (ifupdown2 ignores it). Set false only if a bond legitimately needs =1
# (e.g. multicast RX across multiple switches).
nic_tuning_bond_asa_guard: true
