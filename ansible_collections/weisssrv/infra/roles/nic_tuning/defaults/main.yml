---
# Per-NIC ethtool feature overrides via drop-ins in /etc/network/interfaces.d/
# (schema: README), plus an optional ip_forward sysctl drop-in for hosts that
# route an overlay VPN.
nic_tuning_overrides: []
nic_tuning_ip_forward: false

# Read the applied overrides back out of the kernel and fail the play when they
# are not live. Leave true on every real host; only a container without ethtool
# feature ioctls needs it false.
nic_tuning_verify_offloads: true

# `ethtool -K` takes short feature names and `--show-features` reports long
# ones, so the read-back needs this mapping. Every short name used in
# nic_tuning_overrides needs an entry here. Names per ethtool(8).
nic_tuning_feature_names:
  gro: generic-receive-offload
  gso: generic-segmentation-offload
  lro: large-receive-offload
  ntuple: ntuple-filters
  rx: rx-checksumming
  rxhash: receive-hashing
  rxvlan: rx-vlan-offload
  sg: scatter-gather
  tso: tcp-segmentation-offload
  tx: tx-checksumming
  txvlan: tx-vlan-offload
  ufo: udp-fragmentation-offload

# Lower vm.swappiness on memory-committed hosts. An integer 0-100 writes a
# /etc/sysctl.d/ drop-in and applies it live; null leaves swappiness unmanaged.
# A host running guests plus ZFS ARC typically wants 1, paired with an ARC cap.
nic_tuning_vm_swappiness: null

# Force all_slaves_active=0 on active-backup bonds, keeping the inactive leg's
# reflected frames out of the bridge FDB (README). Set false only for a bond
# that needs =1, such as multicast RX across multiple switches.
nic_tuning_bond_asa_guard: true

# Preferred leg of an active-backup bond. miimon only watches carrier, so a NIC
# whose TX unit wedges with the link up keeps transmitting; naming the healthy
# leg here makes the defect-prone one backup-only (README). null leaves it free.
nic_tuning_bond_primary: null

# Lets an undeclared pin be converged away: the bond-primary lines in
# /etc/network/interfaces and the live bonding/primary. Set false on a host
# whose preferred leg is pinned by hand outside Ansible.
nic_tuning_bond_primary_manage_absent: true
# `failure` keeps the active leg until it actually fails, so applying a primary
# never blips a live uplink. `always` and `better` are the kernel's alternatives.
nic_tuning_bond_primary_reselect: failure

# Fully disable IPv6 on the listed interfaces, removing their link-local
# address; [] leaves IPv6 untouched. Strictly per-interface, so siblings keep
# their IPv6. See the README.
nic_tuning_disable_ipv6: []
