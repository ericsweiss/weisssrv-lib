---
# Installs the binaries the role execs (ethtool, iproute2, logger from
# bsdutils) plus ifupdown2, the parser Proxmox uses at boot: verify runs it
# against the rendered drop-in so a stanza it rejects fails the test.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install ethtool, iproute2, bsdutils (logger), and ifupdown2
      ansible.builtin.apt:
        name:
          - ethtool
          - iproute2
          - bsdutils
          - ifupdown2
        state: present
        update_cache: true

    - name: Ensure interfaces.d exists for stale drop-in test
      ansible.builtin.file:
        path: /etc/network/interfaces.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ifupdown2 reads only drop-ins sourced from /etc/network/interfaces, so
    # mirror the Proxmox default. The bond0 `bond-all_slaves_active 1` stanza
    # seeds the MAC-flap guard test; verify asserts the role rewrites it to 0.
    - name: Write /etc/network/interfaces sourcing interfaces.d
      ansible.builtin.copy:
        dest: /etc/network/interfaces
        content: |
          source /etc/network/interfaces.d/*

          auto bond0
          iface bond0 inet manual
              bond-slaves nic0 nic1
              bond-mode active-backup
              bond-all_slaves_active 1
        owner: root
        group: root
        mode: "0644"

    - name: Seed stale NIC tuning drop-in for cleanup test
      ansible.builtin.copy:
        dest: /etc/network/interfaces.d/99-nic-stale0-tuning.cfg
        content: |
          # Stale drop-in - should be removed by nic_tuning role
          post-up /sbin/ethtool -K stale0 gro off || true
        owner: root
        group: root
        mode: "0644"

    # The bonding module option is the real boot-time control for all_slaves_active
    # (ifupdown2 ignores the interfaces stanza). Seed a stale `=1`;
    # verify.yml asserts the role flips it to 0 in place, preserving fail_over_mac.
    - name: Ensure /etc/modprobe.d exists (minimal test container may lack it)
      ansible.builtin.file:
        path: /etc/modprobe.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Seed a stale bonding modprobe.d config (all_slaves_active=1)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/bonding.conf
        content: |
          options bonding fail_over_mac=1 all_slaves_active=1
        owner: root
        group: root
        mode: "0644"
