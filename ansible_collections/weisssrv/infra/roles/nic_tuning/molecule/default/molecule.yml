---
platforms:
  - name: nic-tuning-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        nic_tuning_ip_forward: true
        # A container's lo/veth may expose no ethtool feature ioctls at all, so
        # the role's read-back cannot run here. verify.yml drives the real
        # assert task file with captured `ethtool --show-features` output
        # instead, in both the passing and failing directions.
        nic_tuning_verify_offloads: false
        nic_tuning_vm_swappiness: 10
        nic_tuning_overrides:
          - interface: lo
            options:
              - feature: rx
                value: 'on'
              - feature: tx
                value: 'on'
