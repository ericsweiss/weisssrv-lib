---
# Tests configuration deployment only (k3s binary install is skipped in containers)
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if k3s config directory exists
      ansible.builtin.stat:
        path: /etc/rancher/k3s
      register: k3s_config_dir
      failed_when: not k3s_config_dir.stat.exists

    - name: Check if k3s config file exists
      ansible.builtin.stat:
        path: /etc/rancher/k3s/config.yaml
      register: k3s_config_file
      failed_when: not k3s_config_file.stat.exists

    - name: Verify k3s config file permissions
      ansible.builtin.stat:
        path: /etc/rancher/k3s/config.yaml
      register: config_perms
      failed_when: config_perms.stat.mode != '0600'

    - name: Read k3s config file
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: k3s_config_content

    - name: Decode k3s config
      ansible.builtin.set_fact:
        k3s_config_text: "{{ k3s_config_content.content | b64decode }}"

    - name: Verify k3s config contains expected settings
      ansible.builtin.assert:
        that:
          - "'tls-san' in k3s_config_text"
          - "'10.0.0.161' in k3s_config_text"
          - "'cluster-cidr' in k3s_config_text"
          - "'service-cidr' in k3s_config_text"
        fail_msg: "k3s config file missing expected settings"
        success_msg: "k3s config file contains expected settings"

    # Node-prep: the inotify sysctl drop-in (tasks/main.yml) must render so a
    # container-dense node cannot exhaust the host-global inotify-instance pool
    # and kill a fresh molecule container's systemd PID 1 with "Too many open
    # files". Under k3s_skip_install the role writes the drop-in but does not
    # apply it live (the container shares the host's /proc/sys).
    - name: Read the inotify sysctl drop-in
      ansible.builtin.slurp:
        src: /etc/sysctl.d/90-k3s-inotify.conf
      register: k3s_inotify_dropin

    - name: Verify the inotify drop-in raises both ceilings
      ansible.builtin.assert:
        that:
          - (k3s_inotify_dropin.content | b64decode) is search('(?m)^fs\.inotify\.max_user_instances\s*=\s*8192\s*$')
          - (k3s_inotify_dropin.content | b64decode) is search('(?m)^fs\.inotify\.max_user_watches\s*=\s*1048576\s*$')
        fail_msg: "inotify sysctl drop-in missing or ceilings not raised"
        success_msg: "inotify drop-in raises max_user_instances=8192 and max_user_watches=1048576"

    # Security-critical keys render unconditionally on every server.
    - name: Verify hardening keys render in the server config
      ansible.builtin.assert:
        that:
          - "'secrets-encryption: true' in k3s_config_text"
          - "'agent-token:' in k3s_config_text"
          - "'flannel-backend: \"wireguard-native\"' in k3s_config_text"
        fail_msg: "k3s server config missing secrets-encryption/agent-token/flannel-backend"
        success_msg: "secrets-encryption, agent-token, and wireguard-native flannel render"

    # kube-apiserver audit logging. Enabled on k3s-server-test only
    # (molecule.yml host_vars), so both branches are exercised in one scenario.
    - name: Verify an audit-enabled server renders the kube-apiserver audit args
      ansible.builtin.assert:
        that:
          - "'kube-apiserver-arg:' in k3s_config_text"
          - "'audit-log-path=/var/lib/rancher/k3s/server/logs/audit.log' in k3s_config_text"
          - "'audit-policy-file=/var/lib/rancher/k3s/server/audit-policy.yaml' in k3s_config_text"
          - "'audit-log-maxage=30' in k3s_config_text"
          - "'audit-log-maxbackup=10' in k3s_config_text"
          - "'audit-log-maxsize=100' in k3s_config_text"
        fail_msg: "k3s_audit_enabled did not render the kube-apiserver audit args"
        success_msg: "audit args render: log path, policy file, and all three rotation bounds"
      when: k3s_audit_enabled | default(false) | bool

    # The byte-parity contract: a consumer that has not opted in must get a
    # server config with no trace of auditing in it.
    - name: Verify an audit-disabled server renders no audit config at all
      ansible.builtin.assert:
        that:
          - "'kube-apiserver-arg' not in k3s_config_text"
          - "'audit-' not in k3s_config_text"
        fail_msg: >-
          The audit block leaked into a server config with k3s_audit_enabled
          false — the k3s-server-config.yaml.j2 render is no longer byte-stable
          for consumers that have not opted in.
        success_msg: "audit-disabled server config carries no audit keys"
      when: not (k3s_audit_enabled | default(false) | bool)

    - name: Check the audit policy file presence matches k3s_audit_enabled
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/audit-policy.yaml
      register: k3s_audit_policy_file
      failed_when:
        k3s_audit_policy_file.stat.exists != (k3s_audit_enabled | default(false) | bool)

    - name: Verify the audit policy is root-owned and not world-readable
      ansible.builtin.assert:
        that:
          - k3s_audit_policy_file.stat.mode == '0600'
          - k3s_audit_policy_file.stat.pw_name == 'root'
        fail_msg: "audit policy file is not root-owned 0600"
        success_msg: "audit policy file is root-owned 0600"
      when: k3s_audit_enabled | default(false) | bool

    - name: Read the audit policy
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/audit-policy.yaml
      register: k3s_audit_policy_content
      when: k3s_audit_enabled | default(false) | bool

    - name: Verify the audit policy parses as an audit/v1 Policy with the expected rules
      vars:
        _policy: "{{ k3s_audit_policy_content.content | b64decode | from_yaml }}"
        _levels: "{{ _policy.rules | map(attribute='level') | list }}"
        # Every {group, resources} entry across every rule, flattened.
        _groups: >-
          {{ _policy.rules | selectattr('resources', 'defined')
             | map(attribute='resources') | flatten | list }}
        _resources: "{{ _groups | map(attribute='resources') | flatten | list }}"
        _rr_entries: >-
          {{ _policy.rules | selectattr('level', 'equalto', 'RequestResponse')
             | selectattr('resources', 'defined') | map(attribute='resources')
             | flatten | list }}
        _rr_groups: "{{ _rr_entries | map(attribute='group') | list }}"
        _rr_resources: "{{ _rr_entries | map(attribute='resources') | flatten | list }}"
      ansible.builtin.assert:
        that:
          - _policy.apiVersion == 'audit.k8s.io/v1'
          - _policy.kind == 'Policy'
          - "'RequestReceived' in (_policy.omitStages | default([]))"
          # First match wins, so the None rules must lead.
          - _levels[0] == 'None'
          - _levels[1] == 'None'
          - "'RequestResponse' in _levels"
          - "'Metadata' in _levels"
          # Credential objects captured (metadata only — never their bodies).
          - "'secrets' in _resources"
          - "'configmaps' in _resources"
          - "'serviceaccounts' in _resources"
          # ...and NEVER at a body-carrying level: a RequestResponse rule on
          # secrets would write Secret contents into a plaintext log file.
          - "'secrets' not in _rr_resources"
          # Privilege grants captured in full.
          - "'clusterroles' in _resources"
          - "'clusterrolebindings' in _resources"
          - "'rbac.authorization.k8s.io' in _rr_groups"
        fail_msg: "rendered audit policy is not a valid audit/v1 Policy with the expected rules"
        success_msg: >-
          audit policy is audit/v1 with None-first noise rules, RequestResponse on
          RBAC, and Metadata on secrets/configmaps/serviceaccounts
      when: k3s_audit_enabled | default(false) | bool

    - name: Stat the audit log directory
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/logs
      register: k3s_audit_log_dir

    - name: Verify the audit log directory exists and is root-only
      ansible.builtin.assert:
        that:
          - k3s_audit_log_dir.stat.isdir | default(false)
          - k3s_audit_log_dir.stat.mode == '0700'
          - k3s_audit_log_dir.stat.pw_name == 'root'
        fail_msg: >-
          The audit log directory is missing or readable beyond root — audit
          events name principals, namespaces and object names.
        success_msg: "audit log directory exists, root-owned 0700"
      when: k3s_audit_enabled | default(false) | bool

    - name: Verify the first server renders the bootstrap branch (cluster-init)
      ansible.builtin.assert:
        that:
          - "'cluster-init: true' in k3s_config_text"
          - "'server: \"https://10.0.0.161:6443\"' not in k3s_config_text"
        fail_msg: "First server did not render cluster-init"
        success_msg: "First server renders cluster-init (no join stanza)"
      when: k3s_is_first_server

    - name: Verify a joining server renders the join stanza (no cluster-init)
      ansible.builtin.assert:
        that:
          - "'server: \"https://10.0.0.161:6443\"' in k3s_config_text"
          - "'cluster-init' not in k3s_config_text"
        fail_msg: "Joining server did not render the join stanza"
        success_msg: "Joining server renders the join stanza (no cluster-init)"
      when: not k3s_is_first_server

    # kube-vip is deployed by the first server only.
    - name: Check kube-vip manifest presence matches the first-server role
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
      register: kube_vip_manifest
      failed_when: kube_vip_manifest.stat.exists != (k3s_is_first_server | bool)

    - name: Read kube-vip manifest
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
      register: kube_vip_content
      when: k3s_is_first_server

    - name: Verify kube-vip manifest contains expected settings
      ansible.builtin.assert:
        that:
          - "'10.0.0.161' in (kube_vip_content.content | b64decode)"
          - "'kube-vip' in (kube_vip_content.content | b64decode)"
          # Admin kubeconfig is mounted read-only; unused metrics listener is
          # disabled via the flag (an empty env var would be ignored).
          - "'readOnly: true' in (kube_vip_content.content | b64decode)"
          - "'--prometheusHTTPServer=' in (kube_vip_content.content | b64decode)"
          - "'prometheus_server' not in (kube_vip_content.content | b64decode)"
          # The API-VIP owner must not be preemptible or BestEffort.
          - "'priorityClassName: system-node-critical' in (kube_vip_content.content | b64decode)"
          - "'memory: 192Mi' in (kube_vip_content.content | b64decode)"
          - "'memory: 96Mi' in (kube_vip_content.content | b64decode)"
        fail_msg: "kube-vip manifest missing expected settings"
        success_msg: "kube-vip manifest contains expected settings"
      when: k3s_is_first_server

    # metrics-server override (k3s_metrics_server_override_enabled: true in
    # molecule.yml): first server only, since it owns the manifests dir.
    - name: Check the metrics-server override presence matches the first-server role
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/manifests/metrics-server-config.yaml
      register: k3s_metrics_server_manifest
      failed_when: k3s_metrics_server_manifest.stat.exists != (k3s_is_first_server | bool)

    - name: Read the metrics-server override
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/manifests/metrics-server-config.yaml
      register: k3s_metrics_server_content
      when: k3s_is_first_server

    - name: Verify the metrics-server override raises replicas and bounds memory
      vars:
        _override: "{{ (k3s_metrics_server_content.content | b64decode | from_yaml).spec.valuesContent | from_yaml }}"
      ansible.builtin.assert:
        that:
          - _override.replicas == 2
          - _override.resources.limits.memory == '256Mi'
          - _override.resources.requests.memory == '128Mi'
          - _override.resources.requests.cpu == '25m'
        fail_msg: "metrics-server override did not render replicas/resources"
        success_msg: "metrics-server override renders 2 replicas with a memory limit"
      when: k3s_is_first_server

    # Negative test recorded by converge: re-running the role with a NIC that
    # doesn't exist must fail at the kube-vip interface assert (else kube-vip
    # would silently never announce the API VIP).
    - name: Read kube-vip interface negative-assert result
      ansible.builtin.slurp:
        src: /tmp/kube-vip-iface-assert.json
      register: kube_vip_iface_assert

    - name: Assert a missing kube-vip interface fails the role
      ansible.builtin.assert:
        that:
          - (kube_vip_iface_assert.content | b64decode | from_json).failed
          - "'nonexistent999' in (kube_vip_iface_assert.content | b64decode | from_json).msg"
        fail_msg: >-
          The kube-vip interface assert did not reject a nonexistent NIC —
          a bad k3s_kube_vip_interface would deploy silently and never announce
          the API VIP. Check the assert in tasks/server.yml.

    - name: Read the kube-vip version negative-assert result
      ansible.builtin.slurp:
        src: /tmp/kube-vip-version-assert.json
      register: kube_vip_version_assert

    - name: Assert an empty kube-vip version pin fails the role
      ansible.builtin.assert:
        that:
          - (kube_vip_version_assert.content | b64decode | from_json).failed
          - "'k3s_kube_vip_version' in (kube_vip_version_assert.content | b64decode | from_json).msg"
        fail_msg: >-
          The version assert accepted an empty k3s_kube_vip_version — a dropped
          site pin would deploy whatever kube-vip image tag rendered. Check the
          assert in tasks/server.yml.

    # Off-node etcd snapshot copy artifacts (k3s_etcd_snapshot_offnode_enabled:
    # true in molecule.yml). The NFS mount + timer start are molecule-notest;
    # here we assert the rendered script/service/timer.
    - name: Stat the off-node snapshot copy script
      ansible.builtin.stat:
        path: /usr/local/sbin/k3s-etcd-snapshot-copy.sh
      register: etcd_copy_script
      failed_when:
        - not etcd_copy_script.stat.exists or etcd_copy_script.stat.mode != '0755'

    - name: Read the off-node snapshot copy script
      ansible.builtin.slurp:
        src: /usr/local/sbin/k3s-etcd-snapshot-copy.sh
      register: etcd_copy_script_content

    - name: Verify the copy script targets the snapshot dir with retention 5
      ansible.builtin.assert:
        that:
          - "'/var/lib/rancher/k3s/server/db/snapshots' in (etcd_copy_script_content.content | b64decode)"
          - "'RETENTION=5' in (etcd_copy_script_content.content | b64decode)"
        fail_msg: "off-node copy script missing SNAP_DIR/RETENTION"
        success_msg: "off-node copy script renders SNAP_DIR and RETENTION=5"

    - name: Read the off-node snapshot copy service unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/k3s-etcd-snapshot-copy.service
      register: etcd_copy_service_content

    - name: Verify the copy service gates on the mount
      ansible.builtin.assert:
        that:
          - "'RequiresMountsFor=/mnt/etcd-snapshots' in (etcd_copy_service_content.content | b64decode)"
          - "'TimeoutStartSec=' in (etcd_copy_service_content.content | b64decode)"
        fail_msg: "copy service missing RequiresMountsFor/TimeoutStartSec"
        success_msg: "copy service gates on the mount with a start timeout"

    - name: Read the off-node snapshot copy timer unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/k3s-etcd-snapshot-copy.timer
      register: etcd_copy_timer_content

    - name: Verify the copy timer schedule
      ansible.builtin.assert:
        that:
          - "'OnCalendar=hourly' in (etcd_copy_timer_content.content | b64decode)"
          - "'Persistent=true' in (etcd_copy_timer_content.content | b64decode)"
        fail_msg: "copy timer missing OnCalendar/Persistent"
        success_msg: "copy timer renders OnCalendar=hourly and Persistent=true"

    # Behavioral test of the DEPLOYED copy script (not just its rendered text):
    # seed snapshots + a bind-mounted export, run it, and assert the atomic
    # copy, *.part exclusion, retention prune, the success metric, and the
    # preserved-timestamp failure branch. SYS_ADMIN + privileged let us
    # bind-mount so the script's `mountpoint -q` gate passes. Paths mirror the
    # k3s defaults baked into the rendered script.
    - name: Provide a bind-mounted off-node export so `mountpoint -q` passes
      ansible.builtin.shell: |
        set -e
        mkdir -p /tmp/etcd-dest-backing /mnt/etcd-snapshots
        mountpoint -q /mnt/etcd-snapshots || mount --bind /tmp/etcd-dest-backing /mnt/etcd-snapshots
      args:
        executable: /bin/bash
      changed_when: true

    - name: Seed snapshot source (old, newest, newer *.part) and pre-existing copies
      ansible.builtin.shell: |
        set -e
        SNAP=/var/lib/rancher/k3s/server/db/snapshots
        DEST=/mnt/etcd-snapshots/{{ ansible_hostname }}
        rm -rf "$SNAP"; mkdir -p "$SNAP"
        echo old  > "$SNAP/etcd-snapshot-old";      touch -d @1699990000 "$SNAP/etcd-snapshot-old"
        echo new  > "$SNAP/etcd-snapshot-new";      touch -d @1700000000 "$SNAP/etcd-snapshot-new"
        # A NEWER *.part in-progress snapshot the script must ignore.
        echo part > "$SNAP/etcd-snapshot-new.part"; touch -d @1700000500 "$SNAP/etcd-snapshot-new.part"
        # Six pre-existing copies (all older) so a single new copy trips retention.
        rm -rf "$DEST"; mkdir -p "$DEST"
        for i in 1 2 3 4 5 6; do
          echo dummy > "$DEST/dummy-$i"
          touch -d @$((1699900000 + i)) "$DEST/dummy-$i"
        done
      args:
        executable: /bin/bash
      changed_when: true

    - name: Run the off-node snapshot copy script (success path)
      ansible.builtin.command: /usr/local/sbin/k3s-etcd-snapshot-copy.sh
      changed_when: true

    - name: List the copied snapshots on the export
      ansible.builtin.find:
        paths: "/mnt/etcd-snapshots/{{ ansible_hostname }}"
        file_type: file
      register: etcd_copied

    - name: Verify the newest snapshot copied, *.part excluded, and retention pruned to 5
      vars:
        _copied_names: "{{ etcd_copied.files | map(attribute='path') | map('basename') | list }}"
      ansible.builtin.assert:
        that:
          - "'etcd-snapshot-new' in _copied_names"
          - "'etcd-snapshot-new.part' not in _copied_names"
          - etcd_copied.files | length == 5
        fail_msg: "copy/retention wrong (dest contents: {{ _copied_names }})"
        success_msg: "copy landed the newest snapshot, excluded *.part, and pruned dest to 5"

    - name: Read the etcd snapshot copy metric file (success)
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/etcd_snapshot_copy.prom
      register: etcd_prom_success

    - name: Verify the success metric and the snapshot's own timestamp
      ansible.builtin.assert:
        that:
          - "'etcd_snapshot_last_copy_success 1' in (etcd_prom_success.content | b64decode)"
          - "'etcd_snapshot_last_copy_timestamp_seconds 1700000000' in (etcd_prom_success.content | b64decode)"
        fail_msg: "success metric or snapshot timestamp missing from etcd_snapshot_copy.prom"
        success_msg: "success metric emits success=1 with the snapshot's mtime"

    - name: Unmount the export to force the failure branch
      ansible.builtin.command: umount /mnt/etcd-snapshots
      changed_when: true

    - name: Run the copy script again (failure path — export not mounted)
      ansible.builtin.command: /usr/local/sbin/k3s-etcd-snapshot-copy.sh
      register: etcd_copy_fail
      changed_when: true
      # The mountpoint gate must make the script exit non-zero.
      failed_when: etcd_copy_fail.rc == 0

    - name: Read the metric file after the forced failure
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/etcd_snapshot_copy.prom
      register: etcd_prom_fail

    - name: Verify the failure branch preserved the last-good timestamp
      ansible.builtin.assert:
        that:
          - "'etcd_snapshot_last_copy_success 0' in (etcd_prom_fail.content | b64decode)"
          - "'etcd_snapshot_last_copy_timestamp_seconds 1700000000' in (etcd_prom_fail.content | b64decode)"
        fail_msg: "failure branch did not preserve the prior success timestamp"
        success_msg: "failure branch keeps success=0 with the preserved last-good timestamp"

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "k3s config directory exists"
          - "k3s config file exists with correct permissions (0600)"
          - "k3s config contains tls-san, API VIP, cluster-cidr, and service-cidr"
          - "inotify sysctl drop-in raises max_user_instances/max_user_watches"
          - "secrets-encryption, agent-token, and flannel backend render"
          - "cluster-init vs join stanza matches k3s_is_first_server"
          - "kube-vip manifest deployed on the first server only (VIP, readOnly kubeconfig)"
          - "kube-vip runs system-node-critical with bounded memory"
          - "kube-vip interface assert rejects a nonexistent NIC"
          - "version assert rejects an empty kube-vip pin"
          - "metrics-server override renders on the first server only"
          - "audit args + audit/v1 policy render on the audit-enabled server only"
          - "(k3s binary install skipped in container testing)"
