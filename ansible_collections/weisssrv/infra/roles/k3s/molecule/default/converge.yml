---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - systemd
          - ca-certificates
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: weisssrv.infra.k3s

  post_tasks:
    # Negative test for the kube-vip interface assert (server.yml): with a NIC
    # name that doesn't exist on the host, the role MUST fail loudly rather than
    # let kube-vip start and silently fail to announce the API VIP. The positive
    # path is covered by the main role run above (k3s_kube_vip_interface: eth0).
    - name: Re-run k3s with a nonexistent kube-vip interface (expect failure)
      block:
        - name: Include k3s with a bogus interface
          ansible.builtin.include_role:
            name: weisssrv.infra.k3s
          vars:
            k3s_kube_vip_interface: nonexistent999
        - name: Interface assert failed to trigger
          ansible.builtin.copy:
            dest: /tmp/kube-vip-iface-assert.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Interface assert correctly rejected a missing NIC
          ansible.builtin.copy:
            dest: /tmp/kube-vip-iface-assert.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}
          # This is a test-result marker, not state convergence — the negative
          # test re-runs (and this rescue fires) on every converge, so it must
          # not count toward molecule's idempotence check.
          changed_when: false

    # Negative test for the version asserts (server.yml): the role ships no
    # k3s_version/k3s_kube_vip_version defaults, so a dropped site pin must fail
    # the run instead of deploying a stale version.
    - name: Re-run k3s with an empty kube-vip version (expect failure)
      block:
        - name: Include k3s with an empty kube-vip version
          ansible.builtin.include_role:
            name: weisssrv.infra.k3s
          vars:
            k3s_kube_vip_version: ''
        - name: Version assert failed to trigger
          ansible.builtin.copy:
            dest: /tmp/kube-vip-version-assert.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Version assert correctly rejected an empty pin
          ansible.builtin.copy:
            dest: /tmp/kube-vip-version-assert.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}
          changed_when: false
