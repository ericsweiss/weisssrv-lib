---
dependency:
  name: galaxy
  options:
    # See molecule-shared/base.yml: read the collection's single source of
    # truth (requirements.yml) via a path relative to molecule's CWD, the role
    # directory.
    role-file: ../../requirements.yml
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: k3s-agent-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /run/lock
    # Keep /tmp as regular directory (not tmpfs) to preserve state between test phases
    networks:
      - name: k3s-agent-test-net
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
    ANSIBLE_COLLECTIONS_PATH: ../../../../../../..:~/.ansible/collections:/usr/share/ansible/collections
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
    # Self-contained scenario (no -c base.yml): mirror the base's [connection]
    # pipelining — one docker exec per task instead of put-file + exec.
    connection:
      pipelining: true
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        k3s_version: "v1.35.0+k3s1"
        k3s_api_vip: "10.0.0.161"
        k3s_api_port: 6443
        k3s_token: "test-token-for-molecule-agent-testing"
        # Distinct from k3s_token so the token-migration lineinfile in
        # tasks/agent.yml runs against the env file pre-staged by prepare.yml.
        k3s_agent_token: "test-agent-token-for-molecule"
        k3s_role: agent  # This makes it run agent tasks
        k3s_labels:
          node-type: "general"
          workload: "media"
        k3s_taints:
          - key: "node.kubernetes.io/ingress"
            value: "true"
            effect: "NoSchedule"
        admin_user: root
        internal_domain: test.local
        base_skip_ssh_config: true
        base_skip_dns_config: true
        k3s_skip_install: true  # Skip actual k3s install in container
        # Exercise the GPU-node include path (tasks/gpu.yml). k3s_skip_gpu_install
        # skips the driver/toolkit apt installs + nvidia-smi probe (no GPU or
        # NVIDIA packages in CI); the non-free component-enable still runs against
        # a SCRATCH sources file (prepare.yml stages it) so the container's real
        # apt sources — and `apt update` — stay untouched. verify asserts it.
        k3s_gpu_node: true
        k3s_skip_gpu_install: true
        k3s_gpu_debian_sources_path: /tmp/gpu-test-debian.sources
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
