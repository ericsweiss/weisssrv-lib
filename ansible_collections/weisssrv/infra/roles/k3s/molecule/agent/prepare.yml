---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    # tasks/agent.yml reconciles K3S_TOKEN in this env file whenever it exists,
    # so it is staged with the stale server token and verify.yml asserts the
    # migration to the dedicated agent token.
    - name: Pre-stage k3s-agent service env with a stale server token
      ansible.builtin.raw: |
        printf 'K3S_TOKEN=%s\n' 'test-token-for-molecule-agent-testing' \
          > /etc/systemd/system/k3s-agent.service.env
        chmod 600 /etc/systemd/system/k3s-agent.service.env
      changed_when: false

    # Scratch deb822 sources file for the GPU component-enable, outside /etc/apt
    # so the container's real sources stay untouched. It is seeded with the
    # trixie default, the state a non-free-firmware-gated match would skip.
    - name: Stage a scratch Debian sources file for the GPU component-enable
      ansible.builtin.raw: |
        printf 'Types: deb\nURIs: http://deb.debian.org/debian\nSuites: trixie\nComponents: main non-free-firmware\n' \
          > /tmp/gpu-test-debian.sources
      changed_when: false
