---
- name: Validate required k3s variables
  ansible.builtin.assert:
    that:
      - k3s_token is defined
      - k3s_token | length > 0
      - k3s_version is defined
      - k3s_version | length > 0
      - k3s_api_vip is defined
      - k3s_api_vip | length > 0
      - k3s_kube_vip_version is defined
      - k3s_kube_vip_version | length > 0
    fail_msg: >-
      k3s_token, k3s_version, k3s_api_vip and k3s_kube_vip_version are all
      required — supply the join token from the site's secret store and the two
      version pins from its version block (k3s_kube_vip_version aliases
      kube_vip_version). The role ships no version defaults, so a dropped pin
      fails here instead of quietly deploying a stale one.
    success_msg: "Required k3s variables are present"
  tags: [validation, always]

# verbosity, not just the tag: a tag selects a task, it does not gate one, so
# without this the dump prints on every node of every deploy.
- name: Debug - Show k3s server configuration variables
  ansible.builtin.debug:
    verbosity: 1
    msg:
      - "Host: {{ inventory_hostname }}"
      - "k3s_role: {{ k3s_role }}"
      - "k3s_is_first_server: {{ k3s_is_first_server | default(false) }}"
      - "k3s_api_vip: {{ k3s_api_vip }}"
      - "Config will be written to: /etc/rancher/k3s/config.yaml"
  tags: [debug]

# CRITICAL: rebuild guard. A wiped first server still pinned as
# k3s_is_first_server would bootstrap a NEW etcd cluster against the surviving
# quorum. No local etcd data plus a live API VIP renders the join stanza
# instead. See the README, "Rebuilt-server guards".
- name: Check for existing local etcd data
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/etcd
  register: k3s_local_etcd

# Named once so the probe loop, the assert message and the test all read the
# same list.
- name: Resolve the surviving servers for the bootstrap decision
  ansible.builtin.set_fact:
    k3s_bootstrap_peers: >-
      {{ groups[k3s_server_group] | default([]) | difference([inventory_hostname]) }}
  when: k3s_bootstrap_peers is not defined

- name: Probe the API VIP for an existing cluster (rebuilt first-server guard)
  ansible.builtin.uri:
    url: "https://{{ k3s_api_vip }}:{{ k3s_api_port }}/ping"
    validate_certs: false
    timeout: 5
  register: k3s_vip_probe
  # Any HTTP response (status != -1) proves an apiserver holds the VIP; a
  # connection failure (fresh bootstrap) is the expected negative, not an error.
  failed_when: false
  check_mode: false
  # Retry so one transient VIP blip cannot mis-select cluster-init.
  # until-exhaustion marks the task failed even with failed_when: false, so
  # ignore_errors keeps the fresh-bootstrap negative from aborting the play.
  retries: 3
  delay: 3
  until: (k3s_vip_probe.status | default(-1)) != -1
  ignore_errors: true
  when:
    - k3s_is_first_server | default(false)
    - not k3s_local_etcd.stat.exists
    - not (k3s_skip_install | default(false))

- name: Debug - Show the API VIP probe outcome
  ansible.builtin.debug:
    verbosity: 1
    msg: >-
      VIP probe status {{ k3s_vip_probe.status | default(-1) }} after
      {{ k3s_vip_probe.attempts | default(0) }} attempt(s)
  when: k3s_vip_probe is not skipped

# A dead VIP alone is not evidence that no cluster exists, so the peers are
# probed too: kube-vip failover, a firewall rule or a routing fault on the
# rebuilt node would otherwise look identical to a fresh bootstrap.
- name: Probe each surviving server for an existing cluster
  ansible.builtin.uri:
    url: "https://{{ hostvars[item].ansible_host | default(item) }}:{{ k3s_api_port }}/ping"
    validate_certs: false
    timeout: 5
  register: k3s_peer_probe
  loop: "{{ k3s_bootstrap_peers | default([]) }}"
  failed_when: false
  check_mode: false
  when:
    - k3s_is_first_server | default(false)
    - not k3s_local_etcd.stat.exists
    - not (k3s_skip_install | default(false))

- name: Decide between cluster-init and joining an existing cluster
  ansible.builtin.include_tasks: assert_bootstrap_intent.yml
  when:
    - k3s_is_first_server | default(false)
    - not k3s_local_etcd.stat.exists
    - not (k3s_skip_install | default(false))

# Opt-in, servers only. Ordered BEFORE the config template on purpose: that
# config gains a kube-apiserver-arg block pointing at the policy file, and the
# apiserver exits at startup if it is not there.
- name: Configure kube-apiserver audit logging
  ansible.builtin.include_tasks: audit.yml
  when: k3s_audit_enabled | bool

# Opt-out converges: the config below drops the apiserver args, so the policy
# file is left orphaned unless it is removed here.
- name: Remove a previously deployed audit policy
  ansible.builtin.file:
    path: "{{ k3s_audit_policy_path }}"
    state: absent
  when: not (k3s_audit_enabled | bool)

- name: Deploy k3s server config
  ansible.builtin.template:
    src: k3s-server-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  # Config now renders agent-token (a cluster secret); no_log keeps it out of
  # task output and --diff.
  no_log: true
  notify:
    - Restart k3s
    - Wait for k3s API healthy

- name: Create manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: "0755"
  when: k3s_is_first_server | default(false)

# Runs on every server (kube-vip announces the API VIP from each control-plane
# node): a NIC-name mismatch would otherwise let kube-vip start but silently fail
# to bring up the VIP. Fail loudly at deploy time instead.
- name: Assert the kube-vip interface exists on this server
  ansible.builtin.assert:
    that:
      - k3s_kube_vip_interface in (ansible_facts.interfaces | default([]))
    fail_msg: >-
      k3s_kube_vip_interface '{{ k3s_kube_vip_interface }}' is not a NIC on
      {{ inventory_hostname }} (have:
      {{ ansible_facts.interfaces | default([]) | sort | join(', ') }}). The API VIP
      ({{ k3s_api_vip | default('?') }}) would silently fail to announce. Set
      k3s_kube_vip_interface in the inventory to the right interface.
    success_msg: "kube-vip interface {{ k3s_kube_vip_interface }} present"

# The DaemonSet is rendered once, on the first server, so every node runs it
# with THAT host's interface name. The assert runs on every server because role
# defaults are absent from hostvars. See the README `--limit` caveat.
- name: Assert every server names the same kube-vip interface
  vars:
    _kube_vip_interfaces: >-
      {{ groups[k3s_server_group] | default([])
         | map('extract', hostvars, 'k3s_kube_vip_interface')
         | map('default', k3s_kube_vip_interface) | unique | list }}
  ansible.builtin.assert:
    that:
      - inventory_hostname in (groups[k3s_server_group] | default([]))
      - _kube_vip_interfaces | length <= 1
    fail_msg: >-
      {{ inventory_hostname }} is not a member of k3s_server_group
      '{{ k3s_server_group }}' (members:
      {{ groups[k3s_server_group] | default([]) | join(', ') or '<none — the group does not exist>' }}),
      so the interface set below was read from the wrong group — or the group is
      right and the servers disagree. The kube-vip DaemonSet is rendered once
      from the first server's k3s_kube_vip_interface and runs on every server, so
      all servers must name the same interface. {{ inventory_hostname }} resolves
      '{{ k3s_kube_vip_interface }}' and sees
      {{ _kube_vip_interfaces | join(', ') }} across {{ k3s_server_group }}.
      Point k3s_server_group at the control-plane group, give those nodes a
      matching NIC name, or drop the per-host overrides.
    success_msg: "All servers name the same kube-vip interface"

- name: Deploy kube-vip manifest (first server only)
  ansible.builtin.template:
    src: kube-vip-manifest.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
    mode: "0600"
  when: k3s_is_first_server | default(false)

# An ExecStartPre drop-in reconciles a rejoined server's on-disk cred/passwd
# from the datastore, which k3s cannot self-heal. Installed ahead of the start
# below. See the README, "Rebuilt-server guards".
- name: Ensure k3s systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install cred/passwd datastore-reconcile drop-in (etcd-member restart safety)
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/50-reconcile-cred-passwd.conf
    content: |
      # Managed by Ansible (k3s role). Reconcile cred/passwd from the datastore
      # before each start so a rebuilt/rejoined etcd member does not fatal
      # "cred/passwd newer than datastore" on restart. See k3s-io/k3s#4910.
      [Service]
      ExecStartPre=-/usr/bin/rm -f /var/lib/rancher/k3s/server/cred/passwd
    owner: root
    group: root
    mode: "0644"
  register: k3s_cred_reconcile_dropin

# Inline (not a handler) on purpose: the reload must precede the k3s (re)start
# below so the ExecStartPre is in effect, whereas handlers only flush at play end.
- name: Reload systemd when the cred reconcile drop-in changes  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: k3s_cred_reconcile_dropin is changed

# The agent unit must never run on a server node (a node converted from agent
# to server keeps a k3s-agent competing for the kubelet). Mirrors agent.yml's
# stray-server-unit check.
- name: Check if k3s-agent.service exists (agent service on server node)
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_service

- name: Stop and disable k3s-agent.service if present (wrong service for server)
  ansible.builtin.systemd:
    name: k3s-agent
    state: stopped
    enabled: false
    daemon_reload: true
  when:
    - k3s_agent_service.stat.exists
    - not (k3s_skip_install | default(false))

# Version detection + install-script staging (shared with agent.yml)
- name: Detect k3s version and stage install script
  ansible.builtin.include_tasks: install-script.yml

- name: Install or upgrade k3s server
  ansible.builtin.command: /root/k3s-install.sh server
  environment:
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when:
    - k3s_needs_install | bool
    - not (k3s_skip_install | default(false))
  notify:
    - Restart k3s
    - Wait for k3s API healthy
  changed_when: true
  no_log: true

- name: Wait for k3s to be ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_ready
  retries: 30
  delay: 10
  until: k3s_ready.rc == 0
  changed_when: false
  when: not (k3s_skip_install | default(false))

- name: Wait for kube-vip to assign VIP
  ansible.builtin.wait_for:
    host: "{{ k3s_api_vip }}"
    port: "{{ k3s_api_port }}"
    timeout: 120
  when:
    - k3s_is_first_server | default(false)
    - not (k3s_skip_install | default(false))

- name: Apply node labels
  ansible.builtin.command: >
    k3s kubectl label node {{ inventory_hostname }}
    {{ item.key }}={{ item.value }} --overwrite
  loop: "{{ k3s_labels | dict2items }}"
  when:
    - k3s_labels | length > 0
    - not (k3s_skip_install | default(false))
  register: k3s_label_result
  # kubectl prints "node/X labeled" on mutation, "node/X not labeled" on no-op.
  changed_when: "' not labeled' not in (k3s_label_result.stdout | default(''))"

- name: Apply node taints
  ansible.builtin.command: >
    k3s kubectl taint node {{ inventory_hostname }}
    {{ item.key }}={{ item.value }}:{{ item.effect }} --overwrite
  loop: "{{ k3s_taints }}"
  when:
    - k3s_taints | length > 0
    - not (k3s_skip_install | default(false))
  register: k3s_taint_result
  # kubectl prints "node/X tainted/untainted/modified" on mutation.
  changed_when: >-
    ('tainted' in (k3s_taint_result.stdout | default('')))
    or ('modified' in (k3s_taint_result.stdout | default('')))

# k3s ships metrics-server as static manifests, so a HelmChartConfig never reaches
# it. Any stale override in the manifests dir is removed.
- name: Remove a stale metrics-server override
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests/metrics-server-config.yaml
    state: absent
  when: k3s_is_first_server | default(false)

# Servers hold their etcd snapshots on local disk only; this copies the newest
# one off-node. Opt-in, and needs the companion NFS export plus
# node_exporter_host (see defaults).
- name: Configure off-node etcd snapshot copy
  ansible.builtin.include_tasks: etcd-snapshot-offnode.yml
  when: k3s_etcd_snapshot_offnode_enabled | bool

- name: Remove a previously deployed off-node etcd snapshot copy
  ansible.builtin.include_tasks: etcd-snapshot-offnode-absent.yml
  when: not (k3s_etcd_snapshot_offnode_enabled | bool)
