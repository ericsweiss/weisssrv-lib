---
- name: Install k3s prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - open-iscsi
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not (k3s_skip_install | default(false))

- name: Install k3s prerequisites (minimal for config testing)
  ansible.builtin.apt:
    name:
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: k3s_skip_install | default(false)

- name: Enable iscsid service
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  when: not (k3s_skip_install | default(false))

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# See k3s_inotify_* in defaults/main.yml for the failure mode. The drop-in
# persists across reboots; the live apply is skipped under k3s_skip_install so a
# test container only writes the file and never touches the shared host's
# /proc/sys.
- name: Raise kernel inotify limits for systemd-in-Docker CI containers
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value | string }}"
    sysctl_file: /etc/sysctl.d/90-k3s-inotify.conf
    sysctl_set: "{{ not (k3s_skip_install | default(false) | bool) }}"
    reload: "{{ not (k3s_skip_install | default(false) | bool) }}"
    state: present
  loop:
    - { name: fs.inotify.max_user_instances, value: "{{ k3s_inotify_max_user_instances }}" }
    - { name: fs.inotify.max_user_watches, value: "{{ k3s_inotify_max_user_watches }}" }
  loop_control:
    label: "{{ item.name }}={{ item.value }}"
  when: k3s_inotify_tuning | bool

- name: Remove the k3s inotify sysctl drop-in when disabled
  # Removes persistence only: the live ceiling stays raised until the next
  # reboot cleanly reverts it to the kernel default. We deliberately do NOT force
  # the value back down (same rationale as nic_tuning's ip_forward disable) —
  # lowering a kernel limit that other workloads on the node may now rely on
  # could do more harm than leaving it high for one more boot cycle.
  ansible.builtin.file:
    path: /etc/sysctl.d/90-k3s-inotify.conf
    state: absent
  when: not (k3s_inotify_tuning | bool)

# Pin the GitLab registry hostname to the internal Traefik VIP so containerd
# resolves it locally (no upstream DNS) and pulls CI images via the direct
# internal path. See k3s_registry_host_pins in defaults/main.yml for the why +
# the post-deploy verification. Idempotent; an empty list removes the pin block
# (blockinfile deletes the managed block when it renders empty), so setting
# k3s_registry_host_pins: [] genuinely disables the pin instead of leaving a
# stale entry behind.
- name: Pin container-registry hostnames to the internal Traefik VIP in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED: k3s registry host pins"
    block: |
      {% for pin in k3s_registry_host_pins | default([]) %}
      {{ pin.ip }} {{ pin.name }}
      {% endfor %}
  when: not (k3s_skip_install | default(false))

# Pin the NAS hostname the NFS-over-TLS PVs mount by, so a remount/reschedule
# does not depend on AdGuard being up. See k3s_storage_host_pins in
# defaults/main.yml. Same semantics as above: empty list removes the block.
- name: Pin the NAS storage hostname in /etc/hosts (DNS-independent NFS mounts)
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED: k3s storage host pins"
    block: |
      {% for pin in k3s_storage_host_pins | default([]) %}
      {{ pin.ip }} {{ pin.name }}
      {% endfor %}
  when: not (k3s_skip_install | default(false))

- name: Mount additional persistent disks
  ansible.builtin.include_role:
    name: weisssrv.infra.zvol_mount
  vars:
    zvol_mount_disks: "{{ k3s_additional_disks }}"
  when: k3s_additional_disks | length > 0

- name: Include server tasks
  ansible.builtin.include_tasks: server.yml
  when: k3s_role == 'server'

- name: Include agent tasks
  ansible.builtin.include_tasks: agent.yml
  when: k3s_role == 'agent'
