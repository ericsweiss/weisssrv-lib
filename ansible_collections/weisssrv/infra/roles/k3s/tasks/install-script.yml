---
# Shared k3s version detection and install-script staging, included by
# server.yml and agent.yml. Exports k3s_needs_install, the single
# install/upgrade gate the callers read.

- name: Check current k3s version
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false

- name: Parse current k3s version
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_current_version.stdout | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+') | default('') }}"
  when: k3s_current_version.rc == 0

- name: Compute the install/upgrade gate
  ansible.builtin.set_fact:
    k3s_needs_install: "{{ k3s_current_version.rc != 0 or (k3s_installed_version | default('')) != k3s_version }}"

# Stays always-on: one line recording what this deploy actually changed.
- name: Report the k3s version this run installs
  ansible.builtin.debug:
    msg: >-
      k3s {{ k3s_installed_version | default('not installed') }} -> {{ k3s_version }}
      (install/upgrade: {{ k3s_needs_install }})
  tags: [debug]

- name: Download k3s install script
  ansible.builtin.get_url:
    # CRITICAL: download and execute stay separate tasks, never `curl | sh`, so
    # the root-run installer is integrity-checked first. /root 0700 keeps /tmp
    # symlink abuse out; the optional per-version checksum protects the script
    # itself, while install.sh verifies the binary it downloads.
    url: "{{ k3s_install_script_url }}"
    dest: /root/k3s-install.sh
    owner: root
    group: root
    mode: "0700"
    force: true
    checksum: "{{ k3s_install_script_checksum | default(omit, true) }}"
  when:
    - k3s_needs_install | bool
    - not (k3s_skip_install | default(false))
