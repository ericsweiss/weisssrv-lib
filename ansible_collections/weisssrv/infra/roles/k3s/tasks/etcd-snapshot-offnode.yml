---
# Mounts the NFS export (by hostname, xprtsec=tls) and installs a timer copying
# the newest local k3s snapshot there, with a last-copy textfile metric. Server
# nodes only; defaults/main.yml lists the companion changes this needs.

# k3s_etcd_snapshot_nfs_server defaults to empty, and ansible.posix.mount writes
# the fstab line before it tries to mount, so an empty server leaves
# ":/k3s-etcd" in /etc/fstab behind an opaque resolution error.
- name: Assert the off-node snapshot NFS target is configured
  ansible.builtin.assert:
    that:
      - k3s_etcd_snapshot_nfs_server | length > 0
      - k3s_etcd_snapshot_nfs_export | length > 0
    fail_msg: >-
      k3s_etcd_snapshot_offnode_enabled is on but k3s_etcd_snapshot_nfs_server
      or k3s_etcd_snapshot_nfs_export is empty. The server must be the export
      host's HOSTNAME, not an IP: xprtsec=tls verifies a cert with no IP SAN.
    quiet: true

- name: Create the off-node etcd snapshot mount point
  ansible.builtin.file:
    path: "{{ k3s_etcd_snapshot_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# The xprtsec=tls mount needs tlshd (nfs_tls role) active on this server;
# without it the mount hangs with an opaque timeout. Fail loud instead.
- name: Assert tlshd is active for the off-node TLS NFS mount  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active tlshd.service
  register: k3s_offnode_tlshd
  changed_when: false
  failed_when: k3s_offnode_tlshd.stdout != "active"
  tags:
    - molecule-notest

# Mount by hostname (k3s_etcd_snapshot_nfs_server) so the server's cert
# verifies under xprtsec=tls — an IP mount fails the TLS handshake (no IP SAN).
# The /etc/hosts pin (k3s_storage_host_pins) keeps resolution DNS-independent.
- name: Mount the off-node etcd snapshot NFS export (by hostname, TLS)
  ansible.posix.mount:
    path: "{{ k3s_etcd_snapshot_mountpoint }}"
    src: "{{ k3s_etcd_snapshot_nfs_server }}:{{ k3s_etcd_snapshot_nfs_export }}"
    fstype: nfs4
    opts: "{{ k3s_etcd_snapshot_nfs_options }}"
    state: mounted
  tags:
    - molecule-notest

- name: Ensure the node_exporter textfile directory exists
  ansible.builtin.file:
    path: "{{ k3s_etcd_snapshot_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the etcd snapshot off-node copy script
  ansible.builtin.template:
    src: k3s-etcd-snapshot-copy.sh.j2
    dest: /usr/local/sbin/k3s-etcd-snapshot-copy.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the etcd snapshot copy service unit
  ansible.builtin.template:
    src: k3s-etcd-snapshot-copy.service.j2
    dest: /etc/systemd/system/k3s-etcd-snapshot-copy.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for etcd snapshot copy

- name: Install the etcd snapshot copy timer unit
  ansible.builtin.template:
    src: k3s-etcd-snapshot-copy.timer.j2
    dest: /etc/systemd/system/k3s-etcd-snapshot-copy.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for etcd snapshot copy

- name: Enable + start the etcd snapshot copy timer
  ansible.builtin.systemd:
    name: k3s-etcd-snapshot-copy.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags:
    - molecule-notest
