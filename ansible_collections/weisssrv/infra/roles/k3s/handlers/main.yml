---
# Restart, then gate on the API coming back. failed_when:false tolerates k3s
# exiting once during etcd rejoin; "Wait for k3s API healthy" is the real gate.
- name: Restart k3s
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: true
  failed_when: false
  when: not (k3s_skip_install | default(false))

- name: Wait for k3s API healthy
  # /readyz gates on the apiserver being ready to serve, not merely up. kubectl
  # --raw returns rc 0 only on HTTP 200; --request-timeout bounds each probe so
  # the 30 x 10s retry budget stays predictable.
  ansible.builtin.command: k3s kubectl --request-timeout=5s get --raw=/readyz
  register: k3s_api_readyz
  changed_when: false
  until: k3s_api_readyz.rc == 0
  retries: 30
  delay: 10
  when: not (k3s_skip_install | default(false))

# Agents are lighter (no etcd/API) and rarely flake on restart; failed_when:false
# tolerates a transient exit, and the "Wait for agent node Ready" handler below
# (notified alongside this one) is the real gate.
- name: Restart k3s-agent
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
    daemon_reload: true
  failed_when: false
  when: not (k3s_skip_install | default(false))

# systemd accepting the restart is not proof: require k3s-agent active with a
# stable NRestarts before the delegated Ready poll, because a dead kubelet keeps
# the node Ready for the node-monitor grace period.
- name: Confirm the restarted k3s-agent is up and stable
  ansible.builtin.shell: |
    set -e
    r1="$(systemctl show k3s-agent -p NRestarts --value)"
    sleep 15
    r2="$(systemctl show k3s-agent -p NRestarts --value)"
    [ "$(systemctl is-active k3s-agent)" = "active" ] && [ "$r1" = "$r2" ]
  register: k3s_agent_stable
  changed_when: false
  until: k3s_agent_stable.rc == 0
  retries: 12
  delay: 10
  when: not (k3s_skip_install | default(false))

- name: Wait for agent node Ready
  ansible.builtin.command: >-
    k3s kubectl get node {{ inventory_hostname }}
    -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_agent_node_ready
  changed_when: false
  until: k3s_agent_node_ready.stdout == "True"
  retries: 30
  delay: 10
  delegate_to: "{{ groups[k3s_server_group] | default([]) | first | default(inventory_hostname, true) }}"
  when:
    - not (k3s_skip_install | default(false))
    - groups[k3s_server_group] | default([]) | length > 0

# Covers check-mode runs only; the enable+start task carries its own
# daemon_reload.
- name: Reload systemd for etcd snapshot copy
  ansible.builtin.systemd:
    daemon_reload: true
  when: not (k3s_skip_install | default(false))
