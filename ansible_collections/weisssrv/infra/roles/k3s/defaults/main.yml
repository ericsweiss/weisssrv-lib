---
# /etc/hosts pins for a registry whose public name resolves through a flaky
# upstream, as [{name, ip}]. The pin overrides only the A record, so SNI and
# TLS validation still use the hostname.
k3s_registry_host_pins: []
# /etc/hosts pins for the NFS server name the PVs mount by, as [{name, ip}].
# A wildcard cert has no IP SAN, so the mount must use a name; the pin keeps
# cluster DNS off the storage-mount critical path.
k3s_storage_host_pins: []

# Raise the per-UID inotify ceilings on every k3s node. Pods share the host user
# namespace, so every uid-0 container draws on one 128-instance pool; exhausting
# it kills the next systemd-in-container PID 1 with "Too many open files".
k3s_inotify_tuning: true
k3s_inotify_max_user_instances: 8192
k3s_inotify_max_user_watches: 1048576

# k3s_version is required and has no default here: a role-local pin duplicates
# the site's version block and deploys the stale value when the group_var is
# dropped. server.yml and agent.yml assert it instead.

# Molecule/check-mode escape hatch: render the config without installing k3s.
k3s_skip_install: false

# Agent (worker) join token, used for agent installs and the server config's
# `agent-token`. Defaults to the server token so the role is self-contained;
# override with a dedicated lower-privilege token in production.
k3s_agent_token: "{{ k3s_token }}"

# Pin the installer URL path to a k3s release tag instead of the mutable
# get.k3s.io redirect. The script is downloaded and run separately, not
# `curl | sh`, so its bytes can be pinned by the checksum below.
k3s_install_script_url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
# Optional sha256 pin for install.sh; empty omits get_url's checksum: param.
# Set it as "sha256:<hex>" alongside k3s_version. install.sh already verifies
# the k3s binary, so this closes the gap on the script itself.
k3s_install_script_checksum: ""

# Inventory group holding the server (control-plane) nodes. Agents delegate
# their post-join kubectl calls to its first member.
k3s_server_group: k3s_servers

k3s_role: agent  # or 'server'
k3s_is_first_server: false

# Opt-in for a greenfield HA bootstrap. The first server refuses cluster-init
# when it has no etcd data and neither the API VIP nor any peer answers, because
# that is an inability to determine, not proof no cluster exists.
k3s_bootstrap_new_cluster: false

# Network configuration. k3s_api_vip is the kube-vip API address every node
# joins through — required, asserted in server.yml/agent.yml; empty default.
k3s_api_vip: ""
k3s_api_port: 6443

# Extra SANs baked into the apiserver certificate, on top of k3s_api_vip,
# inventory_hostname and ansible_host. Changing this needs the existing serving
# cert removed so k3s regenerates it.
k3s_internal_domain: "{{ internal_domain | default('') }}"
k3s_tls_sans: "{{ ['k3s.' ~ k3s_internal_domain] if k3s_internal_domain else [] }}"

# Persistent disks attached to the node's VM, handed to
# weisssrv.infra.zvol_mount. Aliases the inventory-wide `vm_additional_disks`,
# which weisssrv.infra.proxmox_vm aliases identically.
k3s_additional_disks: "{{ vm_additional_disks | default([]) }}"
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

k3s_disable:
  - servicelb
  - traefik

# Flannel CNI backend. wireguard-native encrypts cross-node pod traffic out of
# the box; vxlan is plaintext. README.md carries the caveats.
k3s_flannel_backend: "wireguard-native"

k3s_labels: {}
k3s_taints: []
# Extra `kubelet-arg` entries, rendered into both the server and the agent
# config (e.g. "system-reserved=memory=512Mi"). Declared so it is discoverable
# rather than existing only as a template default.
k3s_kubelet_args: []

# NVIDIA GPU node. When true, agent.yml includes tasks/gpu.yml, which installs
# the NVIDIA driver + nvidia-container-toolkit so k3s auto-detects the `nvidia`
# container runtime (no containerd template edit).
k3s_gpu_node: false

# Molecule/check-mode escape hatch for the GPU path: render the repo/component
# config but skip the driver/toolkit apt installs + nvidia-smi probe. Mirrors
# k3s_skip_install.
k3s_skip_gpu_install: false

# The deb822 Debian sources file whose Components line gpu.yml enables non-free
# on. Overridable so the molecule agent scenario can point it at a scratch file
# (leaving the container's real apt sources — and thus `apt update` — untouched).
k3s_gpu_debian_sources_path: /etc/apt/sources.list.d/debian.sources

# Components gpu.yml writes into that file. Pinned at the call site so a site
# setting apt_signed_repo_components for an unrelated repo cannot drop the
# non-free components the NVIDIA driver and firmware packages live in.
k3s_gpu_apt_components: main contrib non-free non-free-firmware

# GPU artifact pins, all four required on the GPU install path and asserted
# there: the driver/toolkit pair is card-specific and the keyring sha256 must be
# the operator's own. They alias the inventory-wide `nvidia_*` names.
k3s_gpu_cuda_keyring_version: "{{ nvidia_cuda_keyring_version | default('') }}"
k3s_gpu_cuda_keyring_sha256: "{{ nvidia_cuda_keyring_sha256 | default('') }}"
k3s_gpu_driver_version: "{{ nvidia_driver_version | default('') }}"
k3s_gpu_container_toolkit_version: "{{ nvidia_container_toolkit_version | default('') }}"

# kube-vip. The version is required on servers and has no role-local pin, which
# would duplicate the site's version block. Both alias the inventory-wide
# `kube_vip_*` names.
k3s_kube_vip_version: "{{ kube_vip_version | default('') }}"
k3s_kube_vip_interface: "{{ kube_vip_interface | default('eth0') }}"

# true mounts the node's cluster-admin kubeconfig into the kube-vip pod instead
# of running it on its ServiceAccount token. Only for a kube-vip build that
# cannot use the in-cluster token; it makes the pod cluster-admin.
k3s_kube_vip_host_kubeconfig: false

# kube-vip pod resources. Upstream ships none, which makes the pod that owns the
# API VIP BestEffort and the first eviction victim under node memory pressure.
# Memory limit only — a CPU limit on a VIP announcer buys throttling, not safety.
k3s_kube_vip_resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 192Mi

# kube-apiserver audit logging (servers only, opt-in; README.md). Enabling is a
# server config change, so it costs a rolling control-plane restart. OFF BY
# DEFAULT keeps the rendered server config byte-identical until a site opts in.
k3s_audit_enabled: false

# Where the apiserver writes the audit log and reads its policy. Both live under
# the k3s server state dir, on the node's LOCAL disk; nothing ships them
# off-node (the role's alloy_host companion reads journald only).
k3s_audit_log_path: /var/lib/rancher/k3s/server/logs/audit.log
k3s_audit_policy_path: /var/lib/rancher/k3s/server/audit-policy.yaml

# Rotation, enforced by the apiserver itself: maxbackup files of maxsize MB,
# discarding anything older than maxage days. Bounds on-disk audit at
# maxsize * (maxbackup + 1) per server.
k3s_audit_maxage: 30
k3s_audit_maxbackup: 10
k3s_audit_maxsize: 100

# Rendered verbatim to k3s_audit_policy_path. The role asserts an
# audit.k8s.io/v1 Policy with rules, because the apiserver exits on an
# unparseable policy. First match wins, so the two `None` rules stay first.
k3s_audit_policy:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  # RequestReceived doubles every event (one on arrival, one on completion) for
  # no added signal — the completion stage carries the response code.
  omitStages:
    - RequestReceived
  rules:
    # Health/version/discovery probes: every kubelet, every kube-vip, every
    # blackbox probe, several times a second, forever.
    - level: "None"
      nonResourceURLs:
        - /healthz*
        - /livez*
        - /readyz*
        - /version
        - /metrics
        - /openapi/*
    # Leader-election lease renewals in kube-system (scheduler, controller
    # manager, kube-vip): a write every couple of seconds, no security value.
    - level: "None"
      namespaces:
        - kube-system
      resources:
        - group: coordination.k8s.io
          resources:
            - leases
    # Privilege grants, captured in full.
    - level: RequestResponse
      verbs:
        - create
        - update
        - patch
        - delete
        - deletecollection
      resources:
        - group: rbac.authorization.k8s.io
          resources:
            - roles
            - clusterroles
            - rolebindings
            - clusterrolebindings
    # Permission enumeration, captured as metadata only.
    - level: Metadata
      resources:
        - group: rbac.authorization.k8s.io
          resources:
            - roles
            - clusterroles
            - rolebindings
            - clusterrolebindings
    # Credential-bearing objects, metadata only (never their bodies).
    - level: Metadata
      resources:
        - group: ""
          resources:
            - secrets
            - configmaps
            - serviceaccounts

# Off-node etcd snapshot copy (README.md). Off by default: it needs companion
# changes outside this role — the NFS export, node_exporter_host on the servers,
# the firewall path for :2049, and weisssrv.infra.nfs_tls.
k3s_etcd_snapshot_offnode_enabled: false

# Local directory k3s writes its scheduled/on-demand etcd snapshots to.
k3s_etcd_snapshot_dir: /var/lib/rancher/k3s/server/db/snapshots

# NFS mount for the off-node copies. Mount by hostname so the server cert
# verifies under xprtsec=tls. The client dirpath is pseudo-root-relative: with
# an fsid=0 export at /export, NFSv4 clients resolve '/k3s-etcd'.
k3s_etcd_snapshot_nfs_server: ""
k3s_etcd_snapshot_nfs_export: /k3s-etcd
k3s_etcd_snapshot_mountpoint: /mnt/etcd-snapshots
# noauto+nofail keep this backup-only mount off the boot path — the copy unit
# pulls it on demand via RequiresMountsFor — so a NAS-down boot never blocks or
# degrades remote-fs.target.
k3s_etcd_snapshot_nfs_options: "vers=4.2,xprtsec=tls,_netdev,noauto,nofail"

# node_exporter textfile dir (shared with node_exporter_host, which must run on
# the servers for the metric to be scraped).
k3s_etcd_snapshot_textfile_dir: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}"

# Copy-timer cadence and per-server retention on the export.
k3s_etcd_snapshot_copy_oncalendar: "hourly"
k3s_etcd_snapshot_retention: 5
