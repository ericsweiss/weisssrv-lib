---
# Pinned Docker Engine (CE) + compose/buildx plugins from download.docker.com,
# dpkg-held so an apt-upgrade never bumps them out from under a running compose
# stack, plus the journald daemon.json.
#
# docker_engine_skip_install gates every step needing the real apt repo, the
# Docker binary or a running daemon, so a render-only run can still assert the
# daemon.json. It defaults false; callers gate the whole include on their own flag.

- name: Validate the pinned Docker versions are supplied
  ansible.builtin.assert:
    that:
      - docker_engine_ce_version | default('') | length > 0
      - docker_engine_containerd_version | default('') | length > 0
      - docker_engine_buildx_plugin_version | default('') | length > 0
      - docker_engine_compose_plugin_version | default('') | length > 0
    fail_msg: >-
      docker_engine_{ce,containerd,buildx_plugin,compose_plugin}_version are
      required — pin them alongside the site's other component versions.
  when: not (docker_engine_skip_install | default(false))

# A host that still carries the old /usr/share/keyrings repo line ends up with
# BOTH lines in docker.list once the current one is added, and apt then refuses
# the source ("Conflicting values set for option Signed-By"), wedging every later
# apt operation. Drop the legacy line + orphaned keyring before anything touches
# apt. Pure local file ops, so they run in render-only mode too.
- name: Remove legacy Docker repo line (pre-standardization keyring path)
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/docker.list
    regexp: 'signed-by=/usr/share/keyrings/docker\.gpg'
    state: absent
  when: docker_engine_keyring_path != '/usr/share/keyrings/docker.gpg'

- name: Remove legacy Docker keyring (pre-standardization path)
  ansible.builtin.file:
    path: /usr/share/keyrings/docker.gpg
    state: absent
  when: docker_engine_keyring_path != '/usr/share/keyrings/docker.gpg'

- name: Install Docker apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: not (docker_engine_skip_install | default(false))

# Docker's repo line pins arch to the dpkg architecture (amd64), not the kernel
# name (x86_64), so resolve it rather than hardcoding.
- name: Resolve the dpkg architecture for the Docker repo line
  ansible.builtin.command: dpkg --print-architecture
  register: docker_engine_dpkg_arch
  changed_when: false
  when: not (docker_engine_skip_install | default(false))

- name: Add the Docker apt repository (fingerprint-verified)
  ansible.builtin.include_role:
    name: weisssrv.infra.apt_signed_repo
  vars:
    apt_signed_repo_key_url: "{{ docker_engine_key_url }}"
    # Docker's apt signing key primary fingerprint (docs.docker.com/engine/install/debian).
    apt_signed_repo_fingerprint: "{{ docker_engine_key_fingerprint }}"
    apt_signed_repo_keyring_path: "{{ docker_engine_keyring_path }}"
    apt_signed_repo_repo_line: >-
      deb [arch={{ docker_engine_dpkg_arch.stdout }}
      signed-by={{ docker_engine_keyring_path }}]
      {{ docker_engine_repo_url }}
      {{ ansible_distribution_release }} stable
    apt_signed_repo_filename: docker
  when: not (docker_engine_skip_install | default(false))

- name: Install Docker Engine + plugins (pinned)
  ansible.builtin.apt:
    name: "{{ docker_engine_packages }}"
    state: present
    update_cache: true
    # The hold below would make THIS task fail ("held packages were changed") the
    # day a pin is bumped; allow_change_held_packages reconciles the new pin
    # through the hold, and the Hold task re-applies it at the new version.
    allow_change_held_packages: true
    # The pins are authoritative in BOTH directions: a host that drifted ABOVE
    # the pin (an un-held engine caught by an apt-upgrade) must converge down
    # rather than fail every deploy with "Packages were downgraded and -y was
    # used without --allow-downgrades". live-restore keeps containers running
    # across the engine restart either way.
    allow_downgrade: true
  when: not (docker_engine_skip_install | default(false))

- name: Hold Docker packages at the pinned versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ docker_engine_hold_packages }}"
  when: not (docker_engine_skip_install | default(false))

# /etc/docker exists once the engine is installed; create it explicitly so the
# daemon.json write below also works in the render-only (skip_install) scenario.
- name: Ensure the Docker config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Docker daemon configuration (journald log driver)
  ansible.builtin.copy:
    # journald so container stdout/stderr lands in the systemd journal, which
    # alloy_host already ships to Loki (no docker-specific log pipeline needed).
    content: "{{ docker_engine_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: not (docker_engine_skip_install | default(false))
