---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the rendered Docker daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_engine_daemon_json

    - name: Parse the rendered daemon.json
      ansible.builtin.set_fact:
        docker_engine_daemon: "{{ docker_engine_daemon_json.content | b64decode | from_json }}"

    - name: Assert daemon.json selects the journald log driver + live-restore
      ansible.builtin.assert:
        that:
          - docker_engine_daemon['log-driver'] == 'journald'
          - docker_engine_daemon['live-restore'] | bool
        fail_msg: >-
          /etc/docker/daemon.json is missing the journald log-driver /
          live-restore configuration the shared role installs; got
          {{ docker_engine_daemon }}.
        success_msg: "daemon.json renders the journald log driver + live-restore"

    - name: Stat the required-pin assert marker
      ansible.builtin.stat:
        path: /var/tmp/molecule-docker-pin-assert
      register: docker_engine_pin_assert_marker

    - name: Assert the required-pin assert rejected the empty version pin
      ansible.builtin.assert:
        that:
          - docker_engine_pin_assert_marker.stat.exists
        fail_msg: >-
          The converge left no marker, so the required-pin assert did not fail
          the play on an empty docker_engine_ce_version.
        success_msg: "an empty version pin fails the required-pin assert"
