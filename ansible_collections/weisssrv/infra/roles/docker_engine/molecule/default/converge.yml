---
# Render-only converge (see molecule.yml).
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install docker_engine in render-only mode
      ansible.builtin.include_role:
        name: weisssrv.infra.docker_engine
      vars:
        docker_engine_skip_install: true

    # The required-pin assert is the guard that stops a consumer getting an
    # unpinned engine; drive it with one pin empty and record that it fired.
    - name: Drive the required-pin assert with an empty version pin
      block:
        - name: Include docker_engine with an empty engine pin
          ansible.builtin.include_role:
            name: weisssrv.infra.docker_engine
          vars:
            docker_engine_skip_install: false
            docker_engine_ce_version: ""

        - name: Fail because the required-pin assert did not fire
          ansible.builtin.fail:
            msg: >-
              docker_engine accepted an empty docker_engine_ce_version; the
              required-pin assert no longer guards the install.
      rescue:
        - name: Record that the required-pin assert fired
          ansible.builtin.copy:
            dest: /var/tmp/molecule-docker-pin-assert
            content: "fired\n"
            mode: "0644"
          when: ansible_failed_task.name == 'Validate the pinned Docker versions are supplied'
