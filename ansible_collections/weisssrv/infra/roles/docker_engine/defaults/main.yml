---
# docker_engine_{ce,containerd,buildx_plugin,compose_plugin}_version have no
# default here; tasks/main.yml asserts them unless docker_engine_skip_install.
# A stale default pin would silently downgrade a consumer's engine.

# Render-only escape hatch: skip every step that needs the real apt repo, the
# Docker binary or a running daemon. Callers gate the whole include on their own
# skip flag, so this is primarily for the molecule scenario.
docker_engine_skip_install: false
