---
# OIDC SSO via the user_oidc app. Idempotent: the install is guarded on the
# enabled-apps list and user_oidc:provider is an upsert. Every task runs occ
# inside the web container as www-data.

- name: Query the enabled Nextcloud apps
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data nextcloud php occ app:list --output=json
    chdir: "{{ nextcloud_compose_dir }}"
  register: nextcloud_app_list
  changed_when: false

# app:install downloads AND enables in one step; only run it when the app is not
# already enabled.
- name: Install the user_oidc app
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data nextcloud php occ app:install user_oidc
    chdir: "{{ nextcloud_compose_dir }}"
  when: "'user_oidc' not in (nextcloud_app_list.stdout | from_json).enabled | default({})"
  changed_when: true

# The client secret arrives on stdin and is read by `$(cat)` inside the
# container: no_log keeps it out of Ansible's output, but an argv-borne secret
# is readable in /proc/<pid>/cmdline on the guest for as long as the docker CLI,
# the shim and php run.
- name: Configure the OIDC provider
  ansible.builtin.command:
    # argv, so the shell script below reaches `sh -c` verbatim instead of being
    # re-split by the module's shlex parse of a single command string.
    argv:
      - docker
      - compose
      - exec
      - -T
      - -u
      - www-data
      - nextcloud
      - sh
      - -c
      - >-
        php occ user_oidc:provider {{ nextcloud_oidc_provider_id | quote }}
        --clientid={{ nextcloud_oidc_client_id | quote }}
        --clientsecret="$(cat)"
        --discoveryuri={{ nextcloud_oidc_discovery_uri | quote }}
        --scope={{ nextcloud_oidc_scope | quote }}
        --unique-uid={{ nextcloud_oidc_unique_uid | quote }}
        --mapping-uid={{ nextcloud_oidc_mapping_uid | quote }}
        --mapping-display-name={{ nextcloud_oidc_mapping_display_name | quote }}
        --mapping-email={{ nextcloud_oidc_mapping_email | quote }}
        --mapping-groups={{ nextcloud_oidc_mapping_groups | quote }}
        --group-provisioning={{ nextcloud_oidc_group_provisioning | quote }}
    stdin: "{{ nextcloud_oidc_client_secret }}"
    chdir: "{{ nextcloud_compose_dir }}"
  no_log: true
  # Idempotent upsert with no change signal: a first deploy or re-key mutates
  # state but reports unchanged.
  changed_when: false

# SSO-only: make user_oidc the default backend and auto-redirect to the
# provider (hides the local login form; ?direct=1 bypasses it for break-glass).
- name: Enforce SSO-only login (auto-redirect to the provider)
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T -u www-data nextcloud php occ config:app:set
      user_oidc allow_multiple_user_backends --value={{ 0 if (nextcloud_oidc_sso_only | default(true)) else 1 }}
    chdir: "{{ nextcloud_compose_dir }}"
  # Idempotent upsert with no change signal.
  changed_when: false
