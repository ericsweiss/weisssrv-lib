---
# Nextcloud on a Debian guest as a docker-compose stack (web + postgres + redis
# + cron + exporter) under one systemd-managed compose project, fronted by a
# host nginx that terminates TLS and proxies to the loopback-bound web port.

- name: Assert the required Nextcloud inputs are present
  ansible.builtin.assert:
    that:
      - nextcloud_version | default('') | length > 0
      - nextcloud_postgres_version | default('') | length > 0
      - nextcloud_redis_version | default('') | length > 0
      - nextcloud_exporter_version | default('') | length > 0
      - (nextcloud_external_host | default('') | length > 0) or
        (nextcloud_internal_host | default('') | length > 0)
    fail_msg: >-
      The four image pins (nextcloud_version, nextcloud_postgres_version,
      nextcloud_redis_version, nextcloud_exporter_version) are required, as is
      at least one of nextcloud_external_host / nextcloud_internal_host (derived
      from external_domain / internal_domain when those are set).
    quiet: true

- name: Validate required Nextcloud secrets are present
  ansible.builtin.assert:
    that:
      - nextcloud_admin_password | default('') | length > 0
      - nextcloud_db_password | default('') | length > 0
      - nextcloud_serverinfo_token | default('') | length > 0
    fail_msg: >-
      nextcloud_admin_password, nextcloud_db_password and
      nextcloud_serverinfo_token are required (env: NEXTCLOUD_ADMIN_PASSWORD,
      NEXTCLOUD_POSTGRES_PASSWORD, NEXTCLOUD_SERVERINFO_TOKEN).
    quiet: true
  no_log: true
  when: not (nextcloud_skip_install | default(false))

- name: Validate required Nextcloud OIDC inputs are present
  ansible.builtin.assert:
    that:
      - nextcloud_oidc_discovery_uri | default('') | length > 0
      - nextcloud_oidc_client_id | default('') | length > 0
      - nextcloud_oidc_client_secret | default('') | length > 0
    fail_msg: >-
      nextcloud_oidc_enabled is set, so nextcloud_oidc_discovery_uri,
      nextcloud_oidc_client_id and nextcloud_oidc_client_secret are required
      (env: NEXTCLOUD_OIDC_CLIENT_ID, NEXTCLOUD_OIDC_CLIENT_SECRET).
    quiet: true
  no_log: true
  when:
    - not (nextcloud_skip_install | default(false))
    - nextcloud_oidc_enabled | default(false)

- name: Assert the offsite backup landing inputs are present
  ansible.builtin.assert:
    that:
      - nextcloud_backup_nfs_server | default('') | length > 0
      - nextcloud_backup_nfs_export | default('') | length > 0
    fail_msg: >-
      nextcloud_backup_nfs_enabled is set, so nextcloud_backup_nfs_server and
      nextcloud_backup_nfs_export are required.
    quiet: true
  when: nextcloud_backup_nfs_enabled | default(false)

- name: Assert the outgoing-mail inputs are present
  ansible.builtin.assert:
    that:
      - nextcloud_mail_domain | default('') | length > 0
    fail_msg: >-
      nextcloud_smtp_host is set, so nextcloud_mail_domain (the sender domain)
      is required.
    quiet: true
  when: nextcloud_smtp_enabled | default(false)

- name: Mount additional persistent disks
  ansible.builtin.include_role:
    name: weisssrv.infra.zvol_mount
  vars:
    zvol_mount_disks: "{{ nextcloud_additional_disks }}"
  when: nextcloud_additional_disks | length > 0

# Pinned engine + plugins, dpkg hold, journald daemon.json (docker_engine).
- name: Install Docker Engine and the compose plugin
  ansible.builtin.include_role:
    name: weisssrv.infra.compose_app
    tasks_from: docker.yml
  vars:
    compose_app_skip_install: "{{ nextcloud_skip_install | default(false) }}"

- name: Create Nextcloud application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nextcloud_app_dir }}"
    - "{{ nextcloud_compose_dir }}"

# Pre-created + chowned so the container never chowns a large populated tree on
# start.
- name: Create Nextcloud html + data directories (owned by www-data uid/gid)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    mode: "0750"
  loop:
    - "{{ nextcloud_html_dir }}"
    - "{{ nextcloud_data_dir }}"

# role_path inside an include_role resolves to the INCLUDED role, so the site
# template's absolute path must be captured here, before the include.
- name: Resolve the Nextcloud nginx site template path
  ansible.builtin.set_fact:
    nextcloud_nginx_site_template: "{{ role_path }}/templates/nginx-nextcloud.conf.j2"
  when: nextcloud_nginx_enabled | default(true)

- name: Configure the host nginx reverse proxy
  ansible.builtin.include_role:
    name: weisssrv.infra.compose_app
    tasks_from: nginx.yml
  vars:
    compose_app_skip_install: "{{ nextcloud_skip_install | default(false) }}"
    compose_app_nginx_cert_dir: "{{ nextcloud_nginx_cert_dir }}"
    compose_app_nginx_cert_dir_mode: "0755"
    compose_app_nginx_ssl_cert: "{{ nextcloud_nginx_ssl_certificate }}"
    compose_app_nginx_ssl_key: "{{ nextcloud_nginx_ssl_certificate_key }}"
    compose_app_nginx_site_name: nextcloud.conf
    compose_app_nginx_site_template: "{{ nextcloud_nginx_site_template }}"
    compose_app_nginx_self_signed_days: 365
    compose_app_nginx_self_signed_subj: "/CN={{ nextcloud_external_host or nextcloud_internal_host }}"
    # The placeholder carries no SAN (single-host CN).
    compose_app_nginx_self_signed_san: ""
    # Seed the placeholder only on a real deploy.
    compose_app_nginx_bootstrap_cert: "{{ not (nextcloud_skip_install | default(false)) }}"
  when: nextcloud_nginx_enabled | default(true)

# Secrets live in the .env; the compose file itself is secret-free.
- name: Deploy the Nextcloud compose environment file
  ansible.builtin.template:
    src: nextcloud.env.j2
    dest: "{{ nextcloud_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart compose stack

- name: Deploy the Nextcloud compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart compose stack

# compose_app deploys + enables the shared unit, flushes handlers (so the stack
# is up with the just-rendered config) and starts it, before the occ steps run.
- name: Deploy + start the Nextcloud compose stack
  ansible.builtin.include_role:
    name: weisssrv.infra.compose_app
  vars:
    compose_app_skip_install: "{{ nextcloud_skip_install | default(false) }}"
    compose_app_service_name: nextcloud-compose
    compose_app_description: "Nextcloud Docker Compose stack"
    compose_app_working_directory: "{{ nextcloud_compose_dir }}"
    compose_app_requires_mounts_for:
      - "{{ nextcloud_app_dir }}"
      - "{{ nextcloud_postgres_dir }}"
      - "{{ nextcloud_data_mount }}"
    compose_app_requires_mounts_comment:
      - "Path-based mount ordering (systemd escapes these to the right .mount units):"
      - "the data volumes must be mounted before the stack starts."
    compose_app_reconcile_comment:
      - "`up -d` reconciles the running stack to the rendered compose/.env, recreating"
      - "only the containers whose definition changed (ExecReload matches ExecStart so"
      - "`systemctl reload` re-applies without a full down/up)."

- name: Wait for Nextcloud to finish installing
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data nextcloud php occ status --output=json
    chdir: "{{ nextcloud_compose_dir }}"
  register: nextcloud_status
  changed_when: false
  failed_when: false
  retries: "{{ nextcloud_install_wait_retries }}"
  delay: "{{ nextcloud_install_wait_delay }}"
  # One short-circuiting expression: `and` skips the from_json parse while the
  # command still fails during first-install init (stdout not yet JSON).
  until: >-
    nextcloud_status.rc == 0
    and (nextcloud_status.stdout | from_json).installed | default(false)
  when: not (nextcloud_skip_install | default(false))

# Nextcloud's SSRF guard refuses server-side fetches to private addresses, so
# OIDC discovery fails whenever the provider resolves to one. The toggle is
# global — accepted-risk detail in the README.
- name: Allow server-side requests to local addresses
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T -u www-data nextcloud
      php occ config:system:set allow_local_remote_servers
      --value=true --type=boolean
    chdir: "{{ nextcloud_compose_dir }}"
  # Idempotent occ upsert with no change signal.
  changed_when: false
  when:
    - not (nextcloud_skip_install | default(false))
    - nextcloud_oidc_enabled | default(false)
    - nextcloud_oidc_allow_local_remote_servers | default(true)

- name: Configure OIDC SSO
  ansible.builtin.include_tasks: sso.yml
  when:
    - not (nextcloud_skip_install | default(false))
    - nextcloud_oidc_enabled | default(false)

# The serverinfo app ships enabled; the exporter authenticates to its API with
# this token (NEXTCLOUD_AUTH_TOKEN).
- name: Set the serverinfo token consumed by the exporter
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T -u www-data nextcloud
      php occ config:app:set serverinfo token --value={{ nextcloud_serverinfo_token | quote }}
    chdir: "{{ nextcloud_compose_dir }}"
  no_log: true
  # Idempotent occ upsert with no change signal; ok can hide a first-set/rotate.
  changed_when: false
  when: not (nextcloud_skip_install | default(false))

# Applied with occ because the image's SMTP_* env only autoconfigures a FRESH
# install. mail_smtpauth stays off: the relay is expected to accept the guest by
# network, so there is no credential to manage.
- name: Configure Nextcloud outgoing SMTP (relay)
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T -u www-data nextcloud
      php occ config:system:set {{ item.key }} --value={{ item.value | quote }}
    chdir: "{{ nextcloud_compose_dir }}"
  loop:
    - {key: mail_smtpmode, value: "smtp"}
    - {key: mail_smtphost, value: "{{ nextcloud_smtp_host }}"}
    - {key: mail_smtpport, value: "{{ nextcloud_smtp_port }}"}
    - {key: mail_smtpsecure, value: "{{ nextcloud_smtp_secure }}"}
    - {key: mail_from_address, value: "{{ nextcloud_mail_from_address }}"}
    - {key: mail_domain, value: "{{ nextcloud_mail_domain }}"}
  loop_control:
    label: "{{ item.key }}"
  # Idempotent upserts with no change signal; ok can hide a real value change.
  changed_when: false
  when:
    - not (nextcloud_skip_install | default(false))
    - nextcloud_smtp_enabled | default(false)

# The landing dir's root:root/0750 attrs belong to the LOCAL underlay only: once
# the export is mounted, re-running the file task chowns the NFS root, which an
# all_squash export rejects with EPERM. Skip it when something is mounted there.
- name: Check whether the backup landing directory is already a mountpoint
  ansible.builtin.command: mountpoint -q {{ nextcloud_backup_dir | quote }}
  register: nextcloud_backup_dir_mountpoint
  changed_when: false
  failed_when: false

- name: Create the backup landing directory
  ansible.builtin.file:
    path: "{{ nextcloud_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: nextcloud_backup_dir_mountpoint.rc != 0

# nofail keeps a fileserver-down boot from hanging; the backup service's
# RequiresMountsFor pulls the mount on demand.
- name: Mount the offsite backup NFS export
  ansible.posix.mount:
    path: "{{ nextcloud_backup_mountpoint }}"
    src: "{{ nextcloud_backup_nfs_server }}:{{ nextcloud_backup_nfs_export }}"
    fstype: nfs4
    opts: "{{ nextcloud_backup_nfs_options }}"
    state: mounted
  when:
    - not (nextcloud_skip_install | default(false))
    - nextcloud_backup_nfs_enabled | default(false)
  tags:
    - molecule-notest

- name: Deploy the shared backup-metrics helper library
  ansible.builtin.include_role:
    name: weisssrv.infra.compose_app
    tasks_from: backup_lib.yml
  vars:
    compose_app_skip_install: "{{ nextcloud_skip_install | default(false) }}"
    compose_app_backup_lib_dest: "{{ nextcloud_backup_lib_path }}"
    compose_app_backup_size_help_object: "dump"

- name: Deploy the Nextcloud backup wrapper
  ansible.builtin.template:
    src: nextcloud-backup-run.sh.j2
    dest: /usr/local/sbin/nextcloud-backup-run.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy the Nextcloud backup service + timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: nextcloud-backup.service.j2, dest: nextcloud-backup.service}
    - {src: nextcloud-backup.timer.j2, dest: nextcloud-backup.timer}
  notify: Reload systemd

- name: Enable + start the Nextcloud backup timer
  ansible.builtin.systemd:
    name: nextcloud-backup.timer
    enabled: "{{ nextcloud_backup_enabled | default(true) }}"
    state: "{{ 'started' if (nextcloud_backup_enabled | default(true)) else 'stopped' }}"
    daemon_reload: true
  when: not (nextcloud_skip_install | default(false))
