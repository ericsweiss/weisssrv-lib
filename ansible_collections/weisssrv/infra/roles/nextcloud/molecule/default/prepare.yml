---
# Prepare: shared systemd/apt prep plus the fixtures the render-only run needs
# (nginx dirs, textfile dir, a mock docker for the backup wrapper).
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    # nginx isn't installed under skip_install, but the role renders its site
    # file + symlink into these dirs.
    - name: Create mock nginx sites directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/nginx/sites-available
        - /etc/nginx/sites-enabled

    # node_exporter_host isn't in this scenario; create the textfile dir the
    # backup wrapper writes into.
    - name: Ensure the node_exporter textfile collector dir exists
      ansible.builtin.file:
        path: /var/lib/node_exporter
        state: directory
        mode: "0755"

    # app:list answers for the SSO cases; the disabled map of an install with
    # no disabled app is a JSON list, as PHP encodes an empty array.
    - name: Write the app:list fixtures for the SSO cases
      ansible.builtin.copy:
        dest: "/tmp/nextcloud-applist-{{ item.key }}.json"
        mode: "0644"
        content: "{{ item.value | to_json }}"
      loop: "{{ nextcloud_applist_fixtures | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        nextcloud_applist_fixtures:
          enabled: {enabled: {files: "2.0.0", user_oidc: "7.1.0"}, disabled: []}
          disabled: {enabled: {files: "2.0.0"}, disabled: {user_oidc: "7.1.0"}}
          absent: {enabled: {files: "2.0.0"}, disabled: []}

    # Mock `docker` so the wrapper's pg_dump pipe runs on success and failure.
    # /tmp/nextcloud-backup-fail arms the failure, /tmp/nextcloud-backup-tiny a
    # truncated dump; NEXTCLOUD_INFLIGHT_PROBE snapshots the zone mid-dump.
    - name: Install mock docker for the backup-wrapper and SSO tests
      ansible.builtin.copy:
        dest: /usr/local/bin/docker
        mode: "0755"
        content: |
          #!/bin/bash
          # NEXTCLOUD_OCC_CASE logs each exec and answers app:list per case.
          if [ "$1" = "compose" ] && [ "$2" = "exec" ] && [ -n "${NEXTCLOUD_OCC_CASE:-}" ]; then
            printf '%s\n' "$*" >> "/tmp/nextcloud-occ-${NEXTCLOUD_OCC_CASE}.log"
            case " $* " in
              *" occ app:list "*) cat "/tmp/nextcloud-applist-${NEXTCLOUD_OCC_CASE}.json" ;;
              # The provider command is fed its secret on stdin; drain it so the
              # writer never sees a closed pipe.
              *"user_oidc:provider"*) cat >/dev/null ;;
            esac
            exit 0
          fi
          if [ "$1" = "compose" ]; then
            for a in "$@"; do
              if [ "$a" = "pg_dump" ]; then
                if [ -n "${NEXTCLOUD_INFLIGHT_PROBE:-}" ]; then
                  ls -1 "${NEXTCLOUD_INFLIGHT_DIR:-/nonexistent}"/nextcloud-db-*.sql.gz \
                    > "$NEXTCLOUD_INFLIGHT_PROBE" 2>/dev/null
                  ls -1 "${NEXTCLOUD_INFLIGHT_DIR:-/nonexistent}"/nextcloud-db-*.sql.gz.partial \
                    > "${NEXTCLOUD_INFLIGHT_PROBE}.partial" 2>/dev/null
                fi
                if [ -f /tmp/nextcloud-backup-fail ]; then
                  echo "mock pg_dump FAILED" >&2
                  exit 1
                fi
                if [ -f /tmp/nextcloud-backup-tiny ]; then
                  # Under the wrapper's 1000-byte floor: a truncated dump.
                  echo "tiny"
                  exit 0
                fi
                # Incompressible data, so the gzipped dump clears the wrapper's
                # size floor.
                head -c 8192 /dev/urandom | base64
                exit 0
              fi
            done
            exit 0
          fi
          exit 0
