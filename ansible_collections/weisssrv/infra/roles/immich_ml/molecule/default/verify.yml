---
# Verify the rendered Immich ML stack (render/contract scenario).
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    immich_ml_compose_dir: /opt/immich-ml/compose
  tasks:
    - name: Stat docker-compose.yml
      ansible.builtin.stat:
        path: "{{ immich_ml_compose_dir }}/docker-compose.yml"
      register: immich_ml_compose_stat

    - name: Verify compose file perms
      ansible.builtin.assert:
        that:
          - immich_ml_compose_stat.stat.exists
          - immich_ml_compose_stat.stat.mode == '0640'
        fail_msg: "docker-compose.yml missing or not 0640"
        success_msg: "docker-compose.yml present with 0640 perms"

    - name: Slurp docker-compose.yml
      ansible.builtin.slurp:
        src: "{{ immich_ml_compose_dir }}/docker-compose.yml"
      register: immich_ml_compose

    - name: Verify compose pins the openvino image and wires GPU/cache/port
      ansible.builtin.assert:
        that:
          # Version-lockstep contract: the release pin + -openvino.
          - (immich_ml_compose.content | b64decode) is search('immich-machine-learning:v3\.0\.3-openvino')
          # GPU wiring: the device dir, the upstream USB cgroup rule, and the
          # video/render group_add fallbacks (no real device nodes to discover).
          - (immich_ml_compose.content | b64decode) is search('- /dev/dri:/dev/dri')
          - (immich_ml_compose.content | b64decode) is search("- 'c 189:\\* rmw'")
          - (immich_ml_compose.content | b64decode) is search('- "44"')
          - (immich_ml_compose.content | b64decode) is search('- "104"')
          # Model cache volume, timezone, published port and restart policy.
          - (immich_ml_compose.content | b64decode) is search('- model-cache:/cache')
          - (immich_ml_compose.content | b64decode) is search('"0.0.0.0:3003:3003"')
          # Quoted whole: the ': ' inside the pattern would otherwise make YAML
          # parse the list entry as a mapping (a truthy no-op, not a test).
          - "(immich_ml_compose.content | b64decode) is search('TZ: America/Los_Angeles')"
          - "(immich_ml_compose.content | b64decode) is search('restart: always')"
          # No extra env by default: only TZ under `environment:`.
          - (immich_ml_compose.content | b64decode) is not search('MACHINE_LEARNING_MAX_BATCH_SIZE__OCR')
        fail_msg: "docker-compose.yml missing expected image pin / GPU / cache / port config"
        success_msg: "docker-compose.yml pins the -openvino image and wires GPU, cache, port 3003"

    - name: Slurp the compose systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/immich-ml-compose.service
      register: immich_ml_unit

    - name: Verify the compose unit content
      ansible.builtin.assert:
        that:
          - (immich_ml_unit.content | b64decode) is search('Requires=docker.service')
          - (immich_ml_unit.content | b64decode) is search('WorkingDirectory=/opt/immich-ml/compose')
          - (immich_ml_unit.content | b64decode) is search('ExecStart=/usr/bin/docker compose up -d --remove-orphans')
          - (immich_ml_unit.content | b64decode) is search('ExecStop=/usr/bin/docker compose down')
          # No attached volumes on this guest — the unit must NOT carry
          # RequiresMountsFor (that is the immich guest unit's mount guard).
          - (immich_ml_unit.content | b64decode) is not search('RequiresMountsFor')
        fail_msg: "immich-ml-compose.service missing expected docker-compose lifecycle wiring"
        success_msg: "immich-ml-compose.service owns the compose lifecycle (no volume coupling)"

    # The extra-env and bind seams (side-rendered in converge).
    - name: Slurp the seam render
      ansible.builtin.slurp:
        src: /tmp/immich-ml-compose-seams.yml
      register: immich_ml_seams

    - name: Verify extra env keys and the pinned publish address render
      ansible.builtin.assert:
        that:
          - "(immich_ml_seams.content | b64decode) is search('MACHINE_LEARNING_MAX_BATCH_SIZE__OCR: \"3\"')"
          - (immich_ml_seams.content | b64decode) is search('"10.10.0.58:3003:3003"')
          # TZ is not displaced by the extra keys.
          - "(immich_ml_seams.content | b64decode) is search('TZ: America/Los_Angeles')"
        fail_msg: "immich_ml_extra_env / immich_ml_bind did not reach the compose file"
        success_msg: "the extra-env map and the publish address are real seams"
