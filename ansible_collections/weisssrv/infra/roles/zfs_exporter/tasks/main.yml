---
# ZFS Exporter — Prometheus metrics for ZFS pools and datasets.
# Thin wrapper over the shared prometheus_exporter role (tarball install).
# Runs as root because ZFS introspection needs /dev/zfs ioctls.

# The pinned checksum covers ONE artefact, so the role can only install the
# x86_64 tarball; fail here rather than as an exec-format error inside the unit.
- name: Assert the host architecture matches the pinned artefact
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'x86_64'
    fail_msg: >-
      zfs_exporter installs the upstream linux-amd64 tarball pinned by
      zfs_exporter_checksum; this host reports {{ ansible_architecture }}.
      Supply a per-architecture artefact and checksum before enabling the role
      here.
    success_msg: "Host architecture matches the pinned zfs_exporter artefact"

- name: Install zfs_exporter via shared pipeline
  ansible.builtin.include_role:
    name: weisssrv.infra.prometheus_exporter
    tasks_from: install
  vars:
    _ze_base: "https://github.com/pdf/zfs_exporter/releases/download"
    _ze_file: "zfs_exporter-{{ zfs_exporter_version }}.linux-amd64.tar.gz"
    prometheus_exporter_name: zfs_exporter
    prometheus_exporter_version: "{{ zfs_exporter_version }}"
    prometheus_exporter_artifact_type: tarball
    prometheus_exporter_download_url: "{{ _ze_base }}/v{{ zfs_exporter_version }}/{{ _ze_file }}"
    prometheus_exporter_checksum: "{{ zfs_exporter_checksum }}"
    prometheus_exporter_binary_path: /usr/local/bin/zfs_exporter
    prometheus_exporter_archive_member: "zfs_exporter-{{ zfs_exporter_version }}.linux-amd64/zfs_exporter"
    # zfs_exporter --version writes to stderr as
    # `zfs_exporter, version X.Y.Z (branch: ..., revision: ...)`. awk extracts
    # the version token so the check is exact-equal, not a substring match.
    prometheus_exporter_version_check_cmd: |
      set -o pipefail
      /usr/local/bin/zfs_exporter --version 2>&1 | awk '/^zfs_exporter, version/ { print $3; exit }'
    prometheus_exporter_service_name: zfs-exporter
    prometheus_exporter_port: "{{ zfs_exporter_port }}"

- name: Deploy zfs-exporter systemd service
  ansible.builtin.template:
    src: zfs-exporter.service.j2
    dest: /etc/systemd/system/zfs-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus exporter

- name: Enable and verify zfs_exporter via shared pipeline
  ansible.builtin.include_role:
    name: weisssrv.infra.prometheus_exporter
    tasks_from: service
  vars:
    prometheus_exporter_name: zfs_exporter
    prometheus_exporter_service_name: zfs-exporter
    prometheus_exporter_port: "{{ zfs_exporter_port }}"
