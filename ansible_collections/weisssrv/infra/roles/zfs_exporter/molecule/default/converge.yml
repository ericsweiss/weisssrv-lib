---
# Mocks the zfs_exporter binary since there is no real ZFS in Docker.
# The mock reports the pinned version, so the role's version-check gate skips
# the download/extract path.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Create mock zfs_exporter binary
      ansible.builtin.copy:
        dest: /usr/local/bin/zfs_exporter
        mode: "0755"
        content: |
          #!/bin/bash
          case "$1" in
            --version) echo "zfs_exporter, version {{ zfs_exporter_version }}"; exit 0 ;;
          esac
          while true; do sleep 3600; done
      when: ansible_os_family == "Debian"

  roles:
    - role: weisssrv.infra.zfs_exporter
