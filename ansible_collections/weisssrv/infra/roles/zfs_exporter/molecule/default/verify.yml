---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if zfs_exporter binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/zfs_exporter
      register: zfs_exporter_binary
      failed_when: not zfs_exporter_binary.stat.exists

    - name: Verify binary is executable
      ansible.builtin.assert:
        that:
          - zfs_exporter_binary.stat.executable
        fail_msg: "zfs_exporter binary is not executable"
        success_msg: "zfs_exporter binary is executable"

    - name: Check if systemd service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/zfs-exporter.service
      register: service_file
      failed_when: not service_file.stat.exists

    - name: Read service file content
      ansible.builtin.slurp:
        src: /etc/systemd/system/zfs-exporter.service
      register: service_content

    - name: Verify service file content
      ansible.builtin.assert:
        that:
          - "'ZFS Exporter for Prometheus' in (service_content.content | b64decode)"
          # Whole ExecStart line: a bare port substring matches any digit run
          # in the unit, so it would pass with the flag dropped entirely.
          - >-
            ('ExecStart=/usr/local/bin/zfs_exporter --web.listen-address=:' ~ zfs_exporter_port)
            in (service_content.content | b64decode)
        fail_msg: "Service file missing expected configuration"
        success_msg: "Service file has correct configuration"

    # An IPv6 bind must be bracketed or Go's net.SplitHostPort rejects it and
    # the exporter never starts. Side-rendered: the address is not routable here.
    - name: Side-render the unit with an IPv6 listen address  # noqa no-relative-paths
      ansible.builtin.template:
        src: ../../templates/zfs-exporter.service.j2
        dest: /tmp/zfs-exporter-ipv6.service
        mode: "0600"
      vars:
        zfs_exporter_listen_address: "fd00::5"

    - name: Read the IPv6-bound unit
      ansible.builtin.slurp:
        src: /tmp/zfs-exporter-ipv6.service
      register: zfs_exporter_ipv6_unit

    - name: Assert an IPv6 listen address is bracketed
      ansible.builtin.assert:
        that:
          - >-
            ('--web.listen-address=[fd00::5]:' ~ zfs_exporter_port)
            in (zfs_exporter_ipv6_unit.content | b64decode)
        fail_msg: >-
          An IPv6 listen address rendered unbracketed, so the exporter fails to
          parse its own --web.listen-address and never starts.
        success_msg: "an IPv6 listen address renders bracketed"

    # Mock binary: enabled, not necessarily running.
    - name: Check service status
      ansible.builtin.systemd:
        name: zfs-exporter
      register: service_status

    - name: Verify service is enabled
      ansible.builtin.assert:
        that:
          - service_status.status.UnitFileState == 'enabled'
        fail_msg: "zfs-exporter service is not enabled"
        success_msg: "zfs-exporter service is enabled"
