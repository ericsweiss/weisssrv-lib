---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - systemd
          - ca-certificates
          - dnsutils
          - python3-passlib
        state: present
      when: ansible_os_family == "Debian"

    - name: Create adguard group (pre-requisite for user creation)
      ansible.builtin.group:
        name: adguard
        system: true
        state: present

  roles:
    # adguard_home declares no meta dependency, so the upstream resolver behind
    # adguard_home_upstream_dns is ordered here — 127.0.0.1:5335 has to answer
    # before the role's post-deploy DNS probe.
    - role: weisssrv.infra.unbound
    - role: weisssrv.infra.adguard_home

  post_tasks:
    # Negative arm for the staged-archive trust boundary. The staged bytes are
    # installed as root with no upstream signature, so a group-writable cache
    # must be refused before its checksums.txt is read.
    - name: Stage a group-writable archive cache
      ansible.builtin.file:
        path: /tmp/adguard-untrusted-cache
        state: directory
        owner: root
        group: root
        mode: "0775"

    - name: Put a decoy archive in it for the pin below
      ansible.builtin.copy:
        dest: "/tmp/adguard-untrusted-cache/AdGuardHome_linux_{{ adguard_home_arch }}-v99.99.99.tar.gz"
        content: "decoy\n"
        owner: root
        group: root
        mode: "0644"

    - name: Refuse to install from an untrusted staging path
      block:
        - name: Re-run the role against the untrusted cache
          ansible.builtin.include_role:
            name: weisssrv.infra.adguard_home
          vars:
            adguard_home_archive_cache_dir: /tmp/adguard-untrusted-cache
            adguard_home_version: "99.99.99"
            adguard_home_skip_api_config: true
            adguard_home_skip_resolv_conf_update: true

        - name: The untrusted cache was not refused
          ansible.builtin.fail:
            msg: "the role accepted a group-writable staging directory"
      rescue:
        - name: Record which failure the untrusted cache produced
          ansible.builtin.copy:
            dest: /tmp/adguard-untrusted-cache-result.json
            content: "{{ {'msg': ansible_failed_result.msg | default('')} | to_json }}"
            mode: "0644"

        # The refused run aborts inside the install block, before its own
        # cleanup, so the staging-hygiene assert in verify still holds.
        - name: Clean up after the refused run
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ adguard_home_stage_dir }}"
            - /tmp/adguard-untrusted-cache
