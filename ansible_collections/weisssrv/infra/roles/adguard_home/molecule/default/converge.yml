---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - systemd
          - ca-certificates
          - dnsutils
          - python3-passlib
        state: present
      when: ansible_os_family == "Debian"

    - name: Create adguard group (pre-requisite for user creation)
      ansible.builtin.group:
        name: adguard
        system: true
        state: present

  roles:
    # adguard_home declares no meta dependency, so the upstream resolver behind
    # adguard_home_upstream_dns is ordered here — 127.0.0.1:5335 has to answer
    # before the role's post-deploy DNS probe.
    - role: weisssrv.infra.unbound
    - role: weisssrv.infra.adguard_home
