---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if AdGuard Home binary exists
      ansible.builtin.stat:
        path: /opt/AdGuardHome/AdGuardHome
      register: adguard_home_binary
      failed_when: not adguard_home_binary.stat.exists

    - name: Verify AdGuard Home binary is executable
      ansible.builtin.assert:
        that:
          - adguard_home_binary.stat.executable
        fail_msg: "AdGuard Home binary is not executable"
        success_msg: "AdGuard Home binary is executable"

    - name: Check if AdGuard Home user exists
      ansible.builtin.command: id adguard
      register: adguard_home_user_check
      failed_when: adguard_home_user_check.rc != 0
      changed_when: false

    - name: Verify adguard user has no login shell
      ansible.builtin.command: getent passwd adguard
      register: adguard_home_passwd
      changed_when: false

    - name: Assert adguard user has nologin shell
      ansible.builtin.assert:
        that:
          - "'/nologin' in adguard_home_passwd.stdout or '/false' in adguard_home_passwd.stdout"
        fail_msg: "adguard user should have no login shell"
        success_msg: "adguard user correctly has no login shell"

    - name: Check if systemd service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/AdGuardHome.service
      register: adguard_home_service_file
      failed_when: not adguard_home_service_file.stat.exists

    - name: Read systemd service file
      ansible.builtin.slurp:
        src: /etc/systemd/system/AdGuardHome.service
      register: adguard_home_service_content

    - name: Verify systemd service file content (core settings)
      ansible.builtin.assert:
        that:
          - "'User=adguard' in (adguard_home_service_content.content | b64decode)"
          - "'Group=adguard' in (adguard_home_service_content.content | b64decode)"
          - "'CAP_NET_BIND_SERVICE' in (adguard_home_service_content.content | b64decode)"
          - "'NoNewPrivileges=true' in (adguard_home_service_content.content | b64decode)"
          - "'ExecStart=/opt/AdGuardHome/AdGuardHome' in (adguard_home_service_content.content | b64decode)"
        fail_msg: "Systemd service file missing expected content"
        success_msg: "Systemd service file has correct core security settings"

    # Presence only — the value depends on adguard_home_use_protect_system.
    - name: Verify systemd service file has ProtectSystem setting
      ansible.builtin.assert:
        that:
          - "'ProtectSystem=' in (adguard_home_service_content.content | b64decode)"
        fail_msg: "Systemd service file missing ProtectSystem setting"
        success_msg: "Systemd service file has ProtectSystem setting (value depends on adguard_home_use_protect_system)"

    - name: Check if AdGuard Home is running
      ansible.builtin.systemd:
        name: AdGuardHome
      register: adguard_home_service
      failed_when: adguard_home_service.status.ActiveState != 'active'

    - name: Verify AdGuard Home service is enabled
      ansible.builtin.assert:
        that:
          - adguard_home_service.status.UnitFileState == 'enabled'
        fail_msg: "AdGuard Home service is not enabled"
        success_msg: "AdGuard Home service is enabled"

    - name: Wait for AdGuard Home HTTP port
      ansible.builtin.wait_for:
        port: 3000
        timeout: 60
        msg: "AdGuard Home HTTP port not responding"

    - name: Check if AdGuard Home responds on port 3000
      ansible.builtin.uri:
        url: http://localhost:3000/
        status_code: [200, 301, 302]
      register: adguard_home_http
      until: adguard_home_http.status in [200, 301, 302]
      retries: 5
      delay: 10

    - name: Check if config directory has correct permissions
      ansible.builtin.stat:
        path: /opt/AdGuardHome
      register: adguard_home_dir_perms
      failed_when: adguard_home_dir_perms.stat.pw_name != 'adguard'

    - name: Check data directory exists and has correct permissions
      ansible.builtin.stat:
        path: /opt/AdGuardHome/data
      register: adguard_home_data_dir

    - name: Assert data directory has restrictive permissions
      ansible.builtin.assert:
        that:
          - adguard_home_data_dir.stat.exists
          - adguard_home_data_dir.stat.isdir
          - adguard_home_data_dir.stat.pw_name == 'adguard'
          - adguard_home_data_dir.stat.mode == '0700'
        fail_msg: "Data directory has incorrect permissions"
        success_msg: "Data directory has correct restrictive permissions (0700)"

    - name: Check certs directory exists
      ansible.builtin.stat:
        path: /opt/AdGuardHome/certs
      register: adguard_home_certs_dir

    - name: Assert certs directory has setgid and correct group
      ansible.builtin.assert:
        that:
          - adguard_home_certs_dir.stat.exists
          - adguard_home_certs_dir.stat.isdir
          - adguard_home_certs_dir.stat.gr_name == 'adguard'
          # setgid, so a cert dropped in by acme_certs inherits the group
          - adguard_home_certs_dir.stat.mode == '2750'
        fail_msg: "Certs directory has incorrect permissions"
        success_msg: "Certs directory has correct permissions for cert distribution"

    - name: Check if AdGuardHome.yaml exists
      ansible.builtin.stat:
        path: /opt/AdGuardHome/AdGuardHome.yaml
      register: adguard_home_config_file
      failed_when: not adguard_home_config_file.stat.exists

    - name: Read AdGuardHome.yaml
      ansible.builtin.slurp:
        src: /opt/AdGuardHome/AdGuardHome.yaml
      register: adguard_home_config_content

    # The admin's own entry must carry a bcrypt hash — a bare "password:" match
    # would also pass on a different user's line, the exact confusion
    # adguard-admin-hash.py exists to prevent.
    - name: Verify the admin user's entry carries a bcrypt hash
      ansible.builtin.assert:
        that:
          - >-
            (adguard_home_config_content.content | b64decode | from_yaml).users
            | selectattr('name', 'equalto', adguard_home_admin_user | default('admin'))
            | map(attribute='password') | select('match', '^\$2[aby]\$')
            | list | length == 1
        fail_msg: "The admin user's password is not a bcrypt hash"
        success_msg: "The admin user's password is a bcrypt hash"

    - name: Check the admin-password helper is installed
      ansible.builtin.stat:
        path: /usr/local/sbin/adguard-admin-hash.py
      register: adguard_home_hash_helper
      failed_when: not adguard_home_hash_helper.stat.exists

    # The binary is installed as root from what is on disk, so the tarball is
    # staged in a root-owned 0700 directory and removed afterwards.
    - name: Stat the AdGuard Home staging directory
      ansible.builtin.stat:
        path: /root/adguard-home-install
      register: adguard_home_stage_dir_stat

    - name: Find AdGuard Home leftovers under /tmp
      ansible.builtin.find:
        paths: /tmp
        patterns: 'AdGuardHome*'
        file_type: any
      register: adguard_home_tmp_leftovers

    - name: Assert nothing was staged under /tmp and the staging dir is gone
      ansible.builtin.assert:
        that:
          - not adguard_home_stage_dir_stat.stat.exists
          - adguard_home_tmp_leftovers.files | length == 0
        fail_msg: >-
          AdGuard Home was staged under world-writable /tmp, or the staging
          directory was left behind after the install.
        success_msg: "AdGuard Home staged in a root-owned directory and cleaned up"

    # Negative arm from converge: the refusal direction of the staged-archive
    # trust boundary, proved through real Ansible rather than a stand-in.
    - name: Read the untrusted-cache result
      ansible.builtin.slurp:
        src: /tmp/adguard-untrusted-cache-result.json
      register: adguard_home_untrusted_result

    - name: Assert a group-writable staging path is refused by name
      vars:
        adguard_home_untrusted_msg: >-
          {{ (adguard_home_untrusted_result.content | b64decode | from_json).msg }}
      ansible.builtin.assert:
        that:
          - "'is not a trusted staging path' in adguard_home_untrusted_msg"
        fail_msg: >-
          The role failed on a group-writable staged-archive cache for some
          other reason than the trust assert: {{ adguard_home_untrusted_msg }}
        success_msg: "A group-writable staged-archive cache is refused by the trust assert"

    # The API base is derived from the bind, so hardening the bind does not
    # point the role's own reconcile at a loopback nothing listens on.
    - name: Resolve the API base for a specific bind address
      ansible.builtin.include_vars:
        file: ../../vars/main.yml
      vars:
        adguard_home_web_bind: 192.0.2.5
        adguard_home_http_port: 3000

    - name: Assert the API base follows a non-wildcard bind
      vars:
        adguard_home_web_bind: 192.0.2.5
        adguard_home_http_port: 3000
      ansible.builtin.assert:
        that:
          - _adguard_home_api_base | trim == 'http://192.0.2.5:3000'
        fail_msg: >-
          The API base ignored adguard_home_web_bind
          ({{ _adguard_home_api_base | trim }}), so a site that restricts the
          bind would fail every reconcile task with connection refused.
        success_msg: "the API base follows adguard_home_web_bind"

    - name: Assert a wildcard bind still dials loopback
      vars:
        adguard_home_web_bind: "0.0.0.0"
        adguard_home_http_port: 3000
      ansible.builtin.assert:
        that:
          - _adguard_home_api_base | trim == 'http://127.0.0.1:3000'
        fail_msg: "a wildcard bind must still be dialled on loopback"
        success_msg: "a wildcard bind is dialled on loopback"

    - name: Assert an IPv6 bind is bracketed
      vars:
        adguard_home_web_bind: "2001:db8::5"
        adguard_home_http_port: 3000
      ansible.builtin.assert:
        that:
          - _adguard_home_api_base | trim == 'http://[2001:db8::5]:3000'
        fail_msg: "an IPv6 bind must be bracketed or every API task dials an unparseable URL"
        success_msg: "an IPv6 bind is bracketed"

    - name: Assert the IPv6 wildcard bind still dials loopback
      vars:
        adguard_home_web_bind: "::"
        adguard_home_http_port: 3000
      ansible.builtin.assert:
        that:
          - _adguard_home_api_base | trim == 'http://127.0.0.1:3000'
        fail_msg: "the '::' wildcard must fall back to loopback"
        success_msg: "the IPv6 wildcard bind is dialled on loopback"

    # The API reads carry no_log, so a failed probe must still name the URL and
    # the status instead of a censored result.
    - name: Drive an API read against a port nothing listens on
      block:
        - name: Reconcile rewrites against a closed port
          ansible.builtin.include_role:
            name: weisssrv.infra.adguard_home
            tasks_from: api_config.yml
          vars:
            adguard_home_web_bind: 127.0.0.1
            adguard_home_http_port: 9
            adguard_home_admin_user: molecule
            adguard_home_admin_password: molecule

        - name: The read assert did NOT fire
          ansible.builtin.set_fact:
            adguard_home_read_guard_fired: false
      rescue:
        - name: Record the failed API read
          ansible.builtin.set_fact:
            adguard_home_read_guard_fired: true
            adguard_home_read_failure: "{{ ansible_failed_result.msg | default('') }}"

    - name: Assert a failed API read reports the URL and status
      ansible.builtin.assert:
        that:
          - adguard_home_read_guard_fired | default(false)
          - "'http://127.0.0.1:9/control/rewrite/list' in adguard_home_read_failure"
          - "'returned HTTP' in adguard_home_read_failure"
        fail_msg: >-
          A rewrite-list read against a closed port did not fail with the URL
          and status: {{ adguard_home_read_failure | default('the read did not fail at all') }}
        success_msg: "a failed API read names the URL and status"
