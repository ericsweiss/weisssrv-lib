---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if AdGuard Home binary exists
      ansible.builtin.stat:
        path: /opt/AdGuardHome/AdGuardHome
      register: adguard_home_binary
      failed_when: not adguard_home_binary.stat.exists

    - name: Verify AdGuard Home binary is executable
      ansible.builtin.assert:
        that:
          - adguard_home_binary.stat.executable
        fail_msg: "AdGuard Home binary is not executable"
        success_msg: "AdGuard Home binary is executable"

    - name: Check if AdGuard Home user exists
      ansible.builtin.command: id adguard
      register: adguard_home_user_check
      failed_when: adguard_home_user_check.rc != 0
      changed_when: false

    - name: Verify adguard user has no login shell
      ansible.builtin.command: getent passwd adguard
      register: adguard_home_passwd
      changed_when: false

    - name: Assert adguard user has nologin shell
      ansible.builtin.assert:
        that:
          - "'/nologin' in adguard_home_passwd.stdout or '/false' in adguard_home_passwd.stdout"
        fail_msg: "adguard user should have no login shell"
        success_msg: "adguard user correctly has no login shell"

    - name: Check if systemd service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/AdGuardHome.service
      register: adguard_home_service_file
      failed_when: not adguard_home_service_file.stat.exists

    - name: Read systemd service file
      ansible.builtin.slurp:
        src: /etc/systemd/system/AdGuardHome.service
      register: adguard_home_service_content

    - name: Verify systemd service file content (core settings)
      ansible.builtin.assert:
        that:
          - "'User=adguard' in (adguard_home_service_content.content | b64decode)"
          - "'Group=adguard' in (adguard_home_service_content.content | b64decode)"
          - "'CAP_NET_BIND_SERVICE' in (adguard_home_service_content.content | b64decode)"
          - "'NoNewPrivileges=true' in (adguard_home_service_content.content | b64decode)"
          - "'ExecStart=/opt/AdGuardHome/AdGuardHome' in (adguard_home_service_content.content | b64decode)"
        fail_msg: "Systemd service file missing expected content"
        success_msg: "Systemd service file has correct core security settings"

    # ProtectSystem check is conditional - disabled in Docker container tests
    - name: Verify systemd service file has ProtectSystem setting
      ansible.builtin.assert:
        that:
          - "'ProtectSystem=' in (adguard_home_service_content.content | b64decode)"
        fail_msg: "Systemd service file missing ProtectSystem setting"
        success_msg: "Systemd service file has ProtectSystem setting (value depends on adguard_home_use_protect_system)"

    - name: Check if AdGuard Home is running
      ansible.builtin.systemd:
        name: AdGuardHome
      register: adguard_home_service
      failed_when: adguard_home_service.status.ActiveState != 'active'

    - name: Verify AdGuard Home service is enabled
      ansible.builtin.assert:
        that:
          - adguard_home_service.status.UnitFileState == 'enabled'
        fail_msg: "AdGuard Home service is not enabled"
        success_msg: "AdGuard Home service is enabled"

    - name: Wait for AdGuard Home HTTP port
      ansible.builtin.wait_for:
        port: 3000
        timeout: 60
        msg: "AdGuard Home HTTP port not responding"

    - name: Check if AdGuard Home responds on port 3000
      ansible.builtin.uri:
        url: http://localhost:3000/
        status_code: [200, 301, 302]
      register: adguard_home_http
      until: adguard_home_http.status in [200, 301, 302]
      retries: 5
      delay: 10

    - name: Check if config directory has correct permissions
      ansible.builtin.stat:
        path: /opt/AdGuardHome
      register: adguard_home_dir_perms
      failed_when: adguard_home_dir_perms.stat.pw_name != 'adguard'

    - name: Check data directory exists and has correct permissions
      ansible.builtin.stat:
        path: /opt/AdGuardHome/data
      register: adguard_home_data_dir

    - name: Assert data directory has restrictive permissions
      ansible.builtin.assert:
        that:
          - adguard_home_data_dir.stat.exists
          - adguard_home_data_dir.stat.isdir
          - adguard_home_data_dir.stat.pw_name == 'adguard'
          - adguard_home_data_dir.stat.mode == '0700'
        fail_msg: "Data directory has incorrect permissions"
        success_msg: "Data directory has correct restrictive permissions (0700)"

    - name: Check certs directory exists
      ansible.builtin.stat:
        path: /opt/AdGuardHome/certs
      register: adguard_home_certs_dir

    - name: Assert certs directory has setgid and correct group
      ansible.builtin.assert:
        that:
          - adguard_home_certs_dir.stat.exists
          - adguard_home_certs_dir.stat.isdir
          - adguard_home_certs_dir.stat.gr_name == 'adguard'
        fail_msg: "Certs directory has incorrect permissions"
        success_msg: "Certs directory has correct permissions for cert distribution"

    - name: Check if AdGuardHome.yaml exists
      ansible.builtin.stat:
        path: /opt/AdGuardHome/AdGuardHome.yaml
      register: adguard_home_config_file

    - name: Read AdGuardHome.yaml if it exists
      ansible.builtin.slurp:
        src: /opt/AdGuardHome/AdGuardHome.yaml
      register: adguard_home_config_content
      when: adguard_home_config_file.stat.exists

    # The admin's own entry must carry a bcrypt hash — a bare "password:" match
    # would also pass on a different user's line, the exact confusion
    # adguard-admin-hash.py exists to prevent.
    - name: Verify the admin user's entry carries a bcrypt hash
      ansible.builtin.assert:
        that:
          - >-
            (adguard_home_config_content.content | b64decode | from_yaml).users
            | selectattr('name', 'equalto', adguard_home_admin_user | default('admin'))
            | map(attribute='password') | select('match', '^\$2[aby]\$')
            | list | length == 1
        fail_msg: "The admin user's password is not a bcrypt hash"
        success_msg: "The admin user's password is a bcrypt hash"
      when: adguard_home_config_file.stat.exists

    - name: Check the admin-password helper is installed
      ansible.builtin.stat:
        path: /usr/local/sbin/adguard-admin-hash.py
      register: adguard_home_hash_helper
      failed_when: not adguard_home_hash_helper.stat.exists

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "AdGuard Home binary installed and executable"
          - "adguard user exists with no login shell"
          - "Systemd service file exists with correct security settings:"
          - "  - User/Group: adguard"
          - "  - CAP_NET_BIND_SERVICE capability for privileged port binding"
          - "  - NoNewPrivileges=true, ProtectSystem hardening (strict in production, false in Docker tests)"
          - "AdGuard Home service is active and enabled"
          - "HTTP interface responding on port 3000"
          - "Directory permissions correct:"
          - "  - /opt/AdGuardHome owned by adguard"
          - "  - /opt/AdGuardHome/data has 0700 permissions"
          - "  - /opt/AdGuardHome/certs has setgid for cert distribution"
          - "Config file AdGuardHome.yaml exists with password hash"
