---
# Covers the TLS/DoT configuration path, which the default scenario cannot: it
# deploys no certs, so api_base_config.yml's /control/tls/configure block
# self-skips. Here a self-signed cert plus adguard_home_tls_enabled makes the
# POST actually fire, and the idempotence step catches a regression in the
# certificate_path comparison (POST-every-run if tls/status stops echoing the
# paths). Self-contained (no `-c base.yml`): the CI molecule-tests job applies
# the shared base to default scenarios only.
dependency:
  name: galaxy
  options:
    # See molecule-shared/base.yml: read the collection's single source of
    # truth (requirements.yml) via a path relative to molecule's CWD, the role
    # directory.
    role-file: ../../requirements.yml
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: adguard-tls-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - NET_ADMIN
      - NET_RAW
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
    ANSIBLE_COLLECTIONS_PATH: ../../../../../../..:~/.ansible/collections:/usr/share/ansible/collections
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
  playbooks:
    prepare: ../../../../molecule-shared/prepare-common.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        # Keep in step with docker/molecule-test/Dockerfile's
        # ADGUARD_HOME_VERSION: matching pins install from the archive staged in
        # the image instead of fetching github.com mid-test. The cache is
        # opt-in, so the scenario names the image's staging directory; the
        # image also stages the release checksums.txt there, which is what the
        # role verifies the archive against before unpacking it.
        adguard_home_archive_cache_dir: /var/cache/adguard-home
        adguard_home_version: 0.107.78
        adguard_home_user: adguard
        adguard_home_group: adguard
        adguard_home_install_path: /opt/AdGuardHome
        adguard_home_cert_path: /opt/AdGuardHome/certs
        adguard_home_http_port: 3000
        adguard_home_dns_port: 53
        adguard_home_admin_user: eric
        adguard_home_admin_password: testpassword123
        adguard_home_protection_enabled: true
        adguard_home_upstream_dns:
          - 127.0.0.1:5335
        adguard_home_enable_dnssec: true
        internal_domain: test.local
        base_skip_ssh_config: true
        base_skip_dns_config: true
        adguard_home_skip_resolv_conf_update: true
        adguard_home_use_private_tmp: false
        adguard_home_use_protect_system: false
        # The feature under test: certs are present (deployed in converge) and
        # TLS is enabled, so api_base_config.yml runs the /control/tls/configure
        # POST instead of self-skipping. server_name matches the self-signed
        # cert's CN/SAN so AdGuard accepts and enables it.
        adguard_home_tls_enabled: true
        adguard_home_tls_server_name: dns.test.local
        # Docker exec needs a beat between the config rewrite and the restart.
        adguard_home_settle_seconds: 1
        adguard_home_https_port: 443
        adguard_home_dot_port: 853
        adguard_home_doq_port: 853
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
