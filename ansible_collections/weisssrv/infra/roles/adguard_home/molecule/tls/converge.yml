---
# Same container prep as the default scenario, plus a self-signed cert deployed
# into adguard_home_cert_path (mimicking acme_certs) so the role's
# /control/tls/configure path runs.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - systemd
          - ca-certificates
          - dnsutils
          - python3-passlib
          - openssl
        state: present
      when: ansible_os_family == "Debian"

    - name: Create adguard group (pre-requisite for user creation)
      ansible.builtin.group:
        name: adguard
        system: true
        state: present

    # acme_certs deploys fullchain.pem + privkey.pem here in production; deploy a
    # self-signed pair before the role so api_base_config.yml sees the certs and
    # runs the TLS configure POST. setgid dir + group adguard so the AdGuard
    # process can read the key it loads via the API.
    - name: Create certs directory for self-signed TLS cert
      ansible.builtin.file:
        path: "{{ adguard_home_cert_path }}"
        state: directory
        owner: root
        group: adguard
        mode: "2750"

    - name: Generate self-signed TLS certificate
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:2048 -nodes
          -keyout {{ adguard_home_cert_path }}/privkey.pem
          -out {{ adguard_home_cert_path }}/fullchain.pem
          -days 3650 -subj "/CN={{ adguard_home_tls_server_name }}"
          -addext "subjectAltName=DNS:{{ adguard_home_tls_server_name }}"
        creates: "{{ adguard_home_cert_path }}/fullchain.pem"

    - name: Set ownership + perms on the self-signed cert (group adguard readable)
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: adguard
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ adguard_home_cert_path }}/fullchain.pem"
          mode: "0644"
        - path: "{{ adguard_home_cert_path }}/privkey.pem"
          mode: "0640"

  roles:
    # adguard_home declares no meta dependency, so the upstream resolver behind
    # adguard_home_upstream_dns is ordered here — 127.0.0.1:5335 has to answer
    # before the role's post-deploy DNS probe.
    - role: weisssrv.infra.unbound
    - role: weisssrv.infra.adguard_home
