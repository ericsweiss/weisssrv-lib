---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# throttle: 1 — never restart every resolver in the play at once; the LAN keeps
# resolving through the others. The retries ride out a connection that drops
# with the restart.
- name: Restart AdGuardHome
  ansible.builtin.systemd:
    name: AdGuardHome
    state: restarted
  register: adguard_home_restart_result
  retries: 3
  delay: 3
  until: adguard_home_restart_result is succeeded
  throttle: 1
