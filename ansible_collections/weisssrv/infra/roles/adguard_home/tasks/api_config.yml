---
# DNS rewrites + custom filtering rules reconciled to codified state through the
# live AdGuard API (adds missing, removes orphaned); skipped in check mode.

- name: Reconcile AdGuard rewrites and filtering rules over the local API
  module_defaults:
    ansible.builtin.uri:
      user: "{{ adguard_home_admin_user }}"
      password: "{{ adguard_home_admin_password }}"
      force_basic_auth: true
  block:
    - name: Skip API configuration in check mode
      ansible.builtin.debug:
        msg: "Skipping AdGuard Home API configuration in check mode (cannot query live API)"
      when: ansible_check_mode

    # An empty codified list means "manage none" (defaults/main.yml): without this
    # gate the reconcilers below would read it as "delete everything live". Set the
    # matching _prune flag to make an empty list authoritative.
    - name: Determine which record sets are authoritative
      ansible.builtin.set_fact:
        adguard_home_reconcile_rewrites: >-
          {{ (adguard_home_rewrites | length > 0) or (adguard_home_prune_rewrites | bool) }}
        adguard_home_reconcile_user_rules: >-
          {{ (adguard_home_user_rules | length > 0) or (adguard_home_prune_user_rules | bool) }}

    - name: Report record sets left unmanaged
      ansible.builtin.debug:
        msg: >-
          AdGuard on {{ inventory_hostname }}: rewrites reconciled =
          {{ adguard_home_reconcile_rewrites }}, user rules reconciled =
          {{ adguard_home_reconcile_user_rules }}. A false side has an empty
          codified list and its prune flag off, so live state is left untouched.
      when: not (adguard_home_reconcile_rewrites | bool and adguard_home_reconcile_user_rules | bool)

    # no_log censors a failure completely, so each read stays off the failure
    # path and the assert after it names the URL and status.
    - name: Get existing DNS rewrites
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/rewrite/list"
        method: GET
        status_code: 200
      register: adguard_home_existing_rewrites
      no_log: true
      failed_when: false
      when: not ansible_check_mode

    - name: Assert the AdGuard rewrite list read succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_existing_rewrites is skipped
            or (adguard_home_existing_rewrites.status | default(0)) == 200
        fail_msg: >-
          GET {{ _adguard_home_api_base }}/control/rewrite/list returned HTTP
          {{ adguard_home_existing_rewrites.status | default('n/a') }}:
          {{ adguard_home_existing_rewrites.msg | default('no response body') }}
        success_msg: "AdGuard rewrite list read"
      when: not ansible_check_mode

    - name: Build list of codified domains
      ansible.builtin.set_fact:
        adguard_home_codified_domains: "{{ adguard_home_rewrites | map(attribute='domain') | list }}"
      when: not ansible_check_mode

    - name: Delete DNS rewrites not in codified list
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/rewrite/delete"
        method: POST
        body_format: json
        body:
          domain: "{{ item.domain }}"
          answer: "{{ item.answer }}"
        status_code: 200
      loop: "{{ adguard_home_existing_rewrites.json | default([]) }}"
      when:
        - not ansible_check_mode
        - adguard_home_reconcile_rewrites | bool
        - item.domain not in adguard_home_codified_domains
      no_log: true
      failed_when: false
      register: adguard_home_deleted_rewrites

    - name: Build list of codified domain-answer pairs
      ansible.builtin.set_fact:
        adguard_home_codified_pairs: >-
          {{ adguard_home_rewrites |
             map('dict2items') |
             map('selectattr', 'key', 'in', ['domain', 'answer']) |
             map('items2dict') |
             list }}
      when: not ansible_check_mode

    - name: Delete DNS rewrites with incorrect answer (for update)
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/rewrite/delete"
        method: POST
        body_format: json
        body:
          domain: "{{ item.domain }}"
          answer: "{{ item.answer }}"
        status_code: 200
      loop: "{{ adguard_home_existing_rewrites.json | default([]) }}"
      when:
        - not ansible_check_mode
        - item.domain in adguard_home_codified_domains
        - adguard_home_codified_pairs | selectattr('domain', 'equalto', item.domain) |
          selectattr('answer', 'equalto', item.answer) | list | length == 0
      no_log: true
      failed_when: false
      register: adguard_home_updated_rewrites_deleted

    - name: Refresh existing DNS rewrites after deletions
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/rewrite/list"
        method: GET
        status_code: 200
      register: adguard_home_existing_rewrites_refreshed
      no_log: true
      failed_when: false
      when: not ansible_check_mode

    - name: Assert the refreshed AdGuard rewrite list read succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_existing_rewrites_refreshed is skipped
            or (adguard_home_existing_rewrites_refreshed.status | default(0)) == 200
        fail_msg: >-
          GET {{ _adguard_home_api_base }}/control/rewrite/list returned HTTP
          {{ adguard_home_existing_rewrites_refreshed.status | default('n/a') }}:
          {{ adguard_home_existing_rewrites_refreshed.msg | default('no response body') }}
        success_msg: "AdGuard rewrite list re-read"
      when: not ansible_check_mode

    - name: Add missing or updated DNS rewrites
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/rewrite/add"
        method: POST
        body_format: json
        body:
          domain: "{{ item.domain }}"
          answer: "{{ item.answer }}"
        status_code: 200
      loop: "{{ adguard_home_rewrites }}"
      when:
        - not ansible_check_mode
        - >
          adguard_home_existing_rewrites_refreshed.json | default([]) |
          selectattr('domain', 'equalto', item.domain) |
          selectattr('answer', 'equalto', item.answer) |
          list |
          length == 0
      no_log: true
      failed_when: false
      register: adguard_home_added_rewrites

    - name: Get existing custom filtering rules
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/filtering/status"
        method: GET
        status_code: 200
      register: adguard_home_filtering_status
      no_log: true
      failed_when: false
      when: not ansible_check_mode

    - name: Assert the AdGuard filtering status read succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_filtering_status is skipped
            or (adguard_home_filtering_status.status | default(0)) == 200
        fail_msg: >-
          GET {{ _adguard_home_api_base }}/control/filtering/status returned HTTP
          {{ adguard_home_filtering_status.status | default('n/a') }}:
          {{ adguard_home_filtering_status.msg | default('no response body') }}
        success_msg: "AdGuard filtering status read"
      when: not ansible_check_mode

    - name: Get current user rules
      ansible.builtin.set_fact:
        adguard_home_current_user_rules: "{{ adguard_home_filtering_status.json.user_rules | default([]) }}"
      when: not ansible_check_mode

    - name: Update custom filtering rules to match codified state
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/filtering/set_rules"
        method: POST
        body_format: json
        body:
          rules: "{{ adguard_home_user_rules }}"
        status_code: 200
      when:
        - not ansible_check_mode
        - adguard_home_reconcile_user_rules | bool
        - adguard_home_current_user_rules != adguard_home_user_rules
      no_log: true
      failed_when: false
      register: adguard_home_rules_updated

    # Surface any non-200 API responses that failed_when:false above let through,
    # without exposing the basic-auth credentials carried in the requests.
    - name: Collect failed AdGuard rewrite/filtering API responses
      ansible.builtin.set_fact:
        adguard_home_api_failed_status: >-
          {{ ((adguard_home_deleted_rewrites.results | default([]))
              + (adguard_home_updated_rewrites_deleted.results | default([]))
              + (adguard_home_added_rewrites.results | default([]))
              + ([adguard_home_rules_updated] if adguard_home_rules_updated is not skipped else []))
             | rejectattr('skipped', 'defined')
             | map(attribute='status', default='missing')
             | reject('equalto', 200)
             | list }}
      when: not ansible_check_mode

    - name: Assert AdGuard rewrite and filtering API calls succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_api_failed_status | default([]) | length == 0
        fail_msg: >-
          AdGuard rewrite/filtering API call(s) returned non-200 HTTP status(es):
          {{ adguard_home_api_failed_status | default('unknown') }}
        success_msg: "AdGuard rewrites and filtering rules applied"
      when: not ansible_check_mode

    - name: Display DNS rewrite summary
      ansible.builtin.debug:
        msg:
          - >-
            DNS rewrites added:
            {{ (adguard_home_added_rewrites.results | default([]) | selectattr('changed', 'defined') |
            selectattr('changed', 'equalto', true) | list | length) if not ansible_check_mode else 'N/A (check mode)' }}
          - >-
            DNS rewrites deleted:
            {{ (adguard_home_deleted_rewrites.results | default([]) | selectattr('changed', 'defined') |
            selectattr('changed', 'equalto', true) | list | length) if not ansible_check_mode else 'N/A (check mode)' }}
          - >-
            Custom filtering rules updated:
            {{ adguard_home_rules_updated.changed | default(false) if not ansible_check_mode else 'N/A (check mode)' }}
