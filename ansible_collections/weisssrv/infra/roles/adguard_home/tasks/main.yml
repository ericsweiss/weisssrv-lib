---
# Empty here means AdGuard advertises an empty DoT/DoH/DoQ SNI on every deploy
# with a green play, so require it up front rather than at the API call.
- name: Validate the TLS server name is set when TLS is enabled
  ansible.builtin.assert:
    that:
      - adguard_home_tls_server_name | default('') | length > 0
    fail_msg: >-
      adguard_home_tls_server_name is required when adguard_home_tls_enabled —
      it must match the certificate distributed to adguard_home_cert_path.
    success_msg: "TLS server name is set"
  when: adguard_home_tls_enabled | bool

- name: Install the password-reconciliation and DNS-probe prerequisites
  ansible.builtin.apt:
    name:
      # passlib + PyYAML back files/adguard-admin-hash.py, which parses
      # AdGuardHome.yaml to find the admin's password line.
      - python3-passlib
      - python3-yaml
      # dig backs the DNS-resolution verify below; install it here so the role
      # is self-contained rather than relying on the base role having run first.
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Check if adguard user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ adguard_home_user }}"
  register: adguard_home_user_check
  failed_when: false

- name: Check if AdGuard Home service exists
  ansible.builtin.stat:
    path: /etc/systemd/system/AdGuardHome.service
  register: adguard_home_service

- name: Stop AdGuard Home for user creation
  ansible.builtin.service:
    name: AdGuardHome
    state: stopped
  when:
    - adguard_home_service.stat.exists
    - adguard_home_user_check.ansible_facts.getent_passwd is not defined or adguard_home_user_check.ansible_facts.getent_passwd[adguard_home_user] is not defined
  changed_when: false  # Service stop/start is deployment process, not config drift

- name: Create adguard group
  ansible.builtin.group:
    name: "{{ adguard_home_group }}"
    system: true
    state: present

- name: Create adguard user
  ansible.builtin.user:
    name: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ adguard_home_install_path }}"
    create_home: false

- name: Create AdGuard Home directory
  ansible.builtin.file:
    path: "{{ adguard_home_install_path }}"
    state: directory
    owner: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    mode: "0755"

- name: Create AdGuard Home certs directory
  ansible.builtin.file:
    path: "{{ adguard_home_cert_path }}"
    state: directory
    owner: root
    group: "{{ adguard_home_group }}"
    mode: "2750"

- name: Create AdGuard Home data directory
  ansible.builtin.file:
    path: "{{ adguard_home_install_path }}/data"
    state: directory
    owner: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    mode: "0700"

- name: Check if AdGuard Home is installed
  ansible.builtin.stat:
    path: "{{ adguard_home_install_path }}/AdGuardHome"
  register: adguard_home_binary

# Version-aware install: detect the running binary's version so bumps to
# adguard_home_version actually upgrade a host already running an older build.
# AdGuardHome --version prints "AdGuard Home, version vX.Y.Z"; pull the bare
# semver to compare against the pin.
- name: Check installed AdGuard Home version
  ansible.builtin.command: "{{ adguard_home_install_path }}/AdGuardHome --version"
  register: adguard_home_version_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: adguard_home_binary.stat.exists

- name: Determine AdGuard Home install need
  ansible.builtin.set_fact:
    # Reinstall when the binary is missing, the probe failed, or the parsed
    # version differs from the pin (no-op when they match -> idempotent).
    adguard_home_needs_install: >-
      {{ not adguard_home_binary.stat.exists
         or adguard_home_version_check.rc | default(1) != 0
         or (adguard_home_version_check.stdout | default('')
             | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('')) != adguard_home_version }}

- name: Set AdGuard Home architecture
  ansible.builtin.set_fact:
    adguard_home_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Download and install AdGuard Home
  when: adguard_home_needs_install
  block:
    # Feeds the trust assert below. `stat` defaults to follow: false and must
    # STAY there — following would report the target's ownership while the
    # symlink itself (lrwxrwxrwx, and replaceable by whoever owns the link) is
    # the thing an attacker repoints. Unfollowed, a symlinked cache directory
    # stats as woth -> the assert denies, which is the intended answer.
    - name: Look for the staged-archive cache directory
      ansible.builtin.stat:
        path: "{{ adguard_home_archive_cache_dir }}"
      register: adguard_home_archive_cache_stat
      when: adguard_home_archive_cache_dir | length > 0

    # The cache file name carries the version, so a cache staged for a different
    # pin simply misses and the upstream download runs.
    - name: Look for a locally staged AdGuard Home archive
      ansible.builtin.stat:
        path: "{{ adguard_home_archive_cache_dir }}/AdGuardHome_linux_{{ adguard_home_arch }}-v{{ adguard_home_version }}.tar.gz"
        checksum_algorithm: sha256
      register: adguard_home_staged_archive
      when: adguard_home_archive_cache_dir | length > 0

    # A staged archive bypasses get_url's checksum, so verify it here or the
    # cache directory becomes an unauthenticated path to root on the resolver.
    # Preference: the explicit pin, else the upstream checksums.txt staged
    # alongside it. Neither -> fail; do not install unverified bytes.
    - name: Look for a staged checksums.txt
      ansible.builtin.stat:
        path: "{{ adguard_home_archive_cache_dir }}/checksums.txt"
      register: adguard_home_staged_checksums
      when:
        - adguard_home_staged_archive.stat.exists | default(false)
        - adguard_home_archive_sha256 | length == 0

    # A digest only proves the bytes match SOMETHING an attacker also controls:
    # whoever can replace the archive in this directory can replace the
    # checksums.txt beside it, and can point a symlink at whatever the pin was
    # computed over. The comparison below is therefore only as trustworthy as
    # the directory itself, so establish the trust boundary FIRST — the cache
    # directory and every staged file must be root-owned and closed to group and
    # other writers. Ordered ahead of the slurp so an untrusted checksums.txt is
    # never even read.
    - name: Assert the staged-archive cache is a root-owned trust boundary
      ansible.builtin.assert:
        that:
          - adguard_home_archive_cache_stat.stat.isdir | default(false)
          - adguard_home_archive_cache_stat.stat.uid | default(-1) == 0
          - not (adguard_home_archive_cache_stat.stat.wgrp | default(true))
          - not (adguard_home_archive_cache_stat.stat.woth | default(true))
          - adguard_home_staged_archive.stat.uid | default(-1) == 0
          - not (adguard_home_staged_archive.stat.wgrp | default(true))
          - not (adguard_home_staged_archive.stat.woth | default(true))
          # Skipped when the stat did not run (an explicit pin is set, or no
          # checksums.txt is staged) — nothing is trusted from a file that is
          # not consulted.
          - >-
            not (adguard_home_staged_checksums.stat.exists | default(false))
            or (adguard_home_staged_checksums.stat.uid == 0
                and not adguard_home_staged_checksums.stat.wgrp
                and not adguard_home_staged_checksums.stat.woth)
        fail_msg: >-
          {{ adguard_home_archive_cache_dir }} is not a trusted staging path.
          Its contents are unpacked and installed as root with no upstream
          signature, so the directory and every file staged in it must be owned
          by root (uid 0) and not writable by group or other — otherwise the
          digest check below only proves the bytes match a value the same writer
          controls. Found directory
          uid={{ adguard_home_archive_cache_stat.stat.uid | default('absent') }}
          mode={{ adguard_home_archive_cache_stat.stat.mode | default('absent') }},
          archive uid={{ adguard_home_staged_archive.stat.uid | default('absent') }}
          mode={{ adguard_home_staged_archive.stat.mode | default('absent') }},
          checksums.txt uid={{ adguard_home_staged_checksums.stat.uid | default('unused') }}
          mode={{ adguard_home_staged_checksums.stat.mode | default('unused') }}.
          Correct the ownership and modes, or unset
          adguard_home_archive_cache_dir to install from the upstream download.
        quiet: true
      when: adguard_home_staged_archive.stat.exists | default(false)

    - name: Read the staged checksums.txt
      ansible.builtin.slurp:
        src: "{{ adguard_home_archive_cache_dir }}/checksums.txt"
      register: adguard_home_staged_checksums_content
      when: adguard_home_staged_checksums.stat.exists | default(false)

    - name: Verify the staged AdGuard Home archive
      ansible.builtin.assert:
        that:
          - >-
            (adguard_home_archive_sha256 | length > 0
             and adguard_home_staged_archive.stat.checksum == adguard_home_archive_sha256)
            or (adguard_home_staged_checksums_content.content is defined
                and (adguard_home_staged_checksums_content.content | b64decode)
                    is search(adguard_home_staged_archive.stat.checksum ~ '\s+\S*AdGuardHome_linux_' ~ adguard_home_arch ~ '\.tar\.gz'))
        fail_msg: >-
          The staged archive {{ adguard_home_staged_archive.stat.path }}
          (sha256 {{ adguard_home_staged_archive.stat.checksum }}) is not
          verified: set adguard_home_archive_sha256 to that digest, or stage the
          release's checksums.txt beside it. Remove the archive to fall back to
          the upstream download.
        quiet: true
      when: adguard_home_staged_archive.stat.exists | default(false)

    - name: Resolve the AdGuard Home archive to unpack
      ansible.builtin.set_fact:
        adguard_home_archive_path: >-
          {{ adguard_home_staged_archive.stat.path
             if adguard_home_staged_archive.stat.exists | default(false)
             else '/tmp/AdGuardHome_linux_' ~ adguard_home_arch ~ '.tar.gz' }}

    # github.com's TLS handshake stalls often enough to cost a whole CI run:
    # bound each attempt and retry rather than failing the play on one stall.
    - name: Download AdGuard Home
      ansible.builtin.get_url:
        url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/v{{ adguard_home_version }}/AdGuardHome_linux_{{ adguard_home_arch }}.tar.gz"
        # Use upstream filename so get_url's checksum lookup matches an entry in checksums.txt
        dest: "/tmp/AdGuardHome_linux_{{ adguard_home_arch }}.tar.gz"
        mode: "0644"
        checksum: "sha256:https://github.com/AdguardTeam/AdGuardHome/releases/download/v{{ adguard_home_version }}/checksums.txt"
        timeout: 60
      register: adguard_home_download
      retries: 3
      delay: 5
      until: adguard_home_download is succeeded
      when: not (adguard_home_staged_archive.stat.exists | default(false))

    - name: Extract AdGuard Home
      ansible.builtin.unarchive:
        src: "{{ adguard_home_archive_path }}"
        dest: /tmp
        remote_src: true

    # On an upgrade the service is already running; stop it before swapping the
    # binary on disk so the replacement is clean (avoids text-file-busy and a
    # stale process serving the old build). The "Ensure AdGuard Home is enabled
    # and running" task below brings it back up on the new binary. Skipped on a
    # fresh install where the unit does not exist yet.
    - name: Stop AdGuard Home for binary upgrade
      ansible.builtin.service:
        name: AdGuardHome
        state: stopped
      when: adguard_home_service.stat.exists
      changed_when: false

    - name: Install AdGuard Home binary
      ansible.builtin.copy:
        src: /tmp/AdGuardHome/AdGuardHome
        dest: "{{ adguard_home_install_path }}/AdGuardHome"
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Cleanup download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/AdGuardHome_linux_{{ adguard_home_arch }}.tar.gz"
        - /tmp/AdGuardHome

- name: Deploy AdGuard Home systemd service
  ansible.builtin.template:
    src: adguardhome.service.j2
    dest: /etc/systemd/system/AdGuardHome.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart AdGuardHome

# A fresh unit file is invisible to systemd until the queued daemon-reload runs.
- name: Flush handlers before starting service
  ansible.builtin.meta: flush_handlers

# AdGuardHome.sig can ship non-world-readable; the adguard user must read it.
# failed_when: false — it may legitimately be absent.
- name: Ensure AdGuardHome.sig is readable by the adguard user
  ansible.builtin.file:
    path: "{{ adguard_home_install_path }}/AdGuardHome.sig"
    mode: "0644"
  failed_when: false

- name: Ensure AdGuard Home is enabled and running
  ansible.builtin.systemd:
    name: AdGuardHome
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for AdGuard Home to be ready
  ansible.builtin.wait_for:
    port: "{{ adguard_home_http_port }}"
    timeout: 60

- name: Check if AdGuard Home config exists (fresh install check)
  ansible.builtin.stat:
    path: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
  register: adguard_home_initial_config

# Required by the setup wizard on a fresh host, and by the password/API
# reconciliation on every later run.
- name: Validate AdGuard admin password is set
  ansible.builtin.assert:
    # An assert result carries the conditional text and the messages, never the
    # value, so this task prints its fail_msg rather than a censored placeholder.
    that:
      - adguard_home_admin_password is defined
      - adguard_home_admin_password | length > 0
    fail_msg: >-
      adguard_home_admin_password is not set — supply it from the site's
      secret store.
    quiet: true
  when: >-
    not adguard_home_initial_config.stat.exists
    or not (adguard_home_skip_api_config | default(false))

# Without this the instance stays in setup mode and serves no DNS: the wizard
# POST is what writes AdGuardHome.yaml and binds the DNS listener.
- name: Complete AdGuard Home initial setup (fresh install only)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_home_http_port }}/control/install/configure"
    method: POST
    body_format: json
    body:
      web:
        ip: "{{ adguard_home_web_bind }}"
        port: "{{ adguard_home_http_port }}"
      dns:
        ip: "{{ adguard_home_dns_bind }}"
        port: "{{ adguard_home_dns_port }}"
      username: "{{ adguard_home_admin_user }}"
      password: "{{ adguard_home_admin_password }}"
    status_code: 200
  when:
    - not ansible_check_mode
    - not adguard_home_initial_config.stat.exists
  no_log: true

- name: Wait for AdGuard Home to be ready after initial setup
  ansible.builtin.wait_for:
    port: "{{ adguard_home_http_port }}"
    timeout: 60
  when: not adguard_home_initial_config.stat.exists

# No password API — the bcrypt hash is reconciled in AdGuardHome.yaml by
# files/adguard-admin-hash.py (see its docstring).
- name: Check if AdGuard Home config exists (for password check)
  ansible.builtin.stat:
    path: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
  register: adguard_home_config

- name: Install the admin-password reconciliation helper
  ansible.builtin.copy:
    src: adguard-admin-hash.py
    dest: "{{ adguard_home_hash_helper_path }}"
    owner: root
    group: root
    mode: "0755"
  when: not (adguard_home_skip_api_config | default(false))

# The password reaches the helper on stdin, never in argv or `environment:`
# (Ansible prefixes environment assignments onto the remote command string, so
# they sit in /proc/<pid>/cmdline for the length of the run). The helper
# re-hashes only when the stored hash fails verification, so a converged host
# reports ok and nothing restarts.
- name: Reconcile the admin password in the AdGuard Home config
  ansible.builtin.command:
    argv:
      - python3
      - "{{ adguard_home_hash_helper_path }}"
      - --config
      - "{{ adguard_home_install_path }}/AdGuardHome.yaml"
      - --user
      - "{{ adguard_home_admin_user }}"
      - reconcile
    stdin: "{{ adguard_home_admin_password }}"
    stdin_add_newline: false
  register: adguard_home_hash_result
  # Compared exactly, NOT with the `'CHANGED' in ...` idiom used elsewhere: the
  # negative verdict is UNCHANGED, which contains CHANGED.
  changed_when: adguard_home_hash_result.stdout | default('') | trim == 'CHANGED'
  when:
    - adguard_home_config.stat.exists
    - not (adguard_home_skip_api_config | default(false))
  notify: Restart AdGuardHome
  # no_log because the password is in this task's args. It also hides the
  # helper's distinct failure messages, so the failure is deferred and re-raised
  # by the next task, which prints stderr — none of it contains the secret.
  no_log: true
  failed_when: false
  # One resolver at a time: the rewrite queues a restart of the host the LAN
  # resolves through.
  throttle: 1

- name: Surface an admin-password reconciliation failure
  ansible.builtin.fail:
    msg: >-
      adguard-admin-hash.py failed on {{ inventory_hostname }}
      (rc={{ adguard_home_hash_result.rc | default('?') }}):
      {{ adguard_home_hash_result.stderr | default('') | trim
         | default('no stderr captured', true) }}
  when:
    - adguard_home_config.stat.exists
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_hash_result.rc | default(0) != 0

# The helper preserves the file's existing mode/ownership rather than asserting
# it, so correct a config left readable by an operator or by AdGuard itself.
- name: Enforce ownership and mode on the AdGuard Home config
  ansible.builtin.file:
    path: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
    owner: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    mode: "0600"
  when:
    - adguard_home_config.stat.exists
    - not (adguard_home_skip_api_config | default(false))

# Test harness only: a container connection plugin can need a moment between the
# config write and the restart. Prod leaves it 0.
- name: Settle after the config update
  ansible.builtin.pause:
    seconds: "{{ adguard_home_settle_seconds }}"
  when: adguard_home_settle_seconds | int > 0

# Flush before the API tasks: the password change queues a restart, and the API
# calls below need the resolver back up.
- name: Flush handlers before API configuration
  ansible.builtin.meta: flush_handlers

- name: Wait for AdGuard Home to be ready before API configuration
  ansible.builtin.wait_for:
    port: "{{ adguard_home_http_port }}"
    timeout: 60
  when: not ansible_check_mode

# Base settings (upstreams, TLS, cache, ratelimit) are reconciled on EVERY
# instance — DNS has to work here before the resolution check below.
- name: Configure base AdGuard Home settings via API
  ansible.builtin.include_tasks: api_base_config.yml
  when:
    - not (adguard_home_skip_api_config | default(false))

# Rewrites and filtering rules are reconciled on the PRIMARY only; replicas
# receive them from weisssrv.infra.adguard_sync, and reconciling them on both
# ends would fight that sync.
- name: Configure DNS rewrites and filtering rules via API
  ansible.builtin.include_tasks: api_config.yml
  when:
    - adguard_home_is_primary | bool
    - not (adguard_home_skip_api_config | default(false))

# Real answers, not just rc=0, before the host's own resolver is pointed here.
# -4 because an IPv6 answer would fail the regex.
- name: Verify AdGuard Home DNS resolution is working
  ansible.builtin.command:
    cmd: "dig -4 @127.0.0.1 {{ adguard_home_dns_probe_name | quote }} +short +time=5"
  register: adguard_home_dns_test
  changed_when: false
  retries: 5
  delay: 3
  until:
    - adguard_home_dns_test.rc == 0
    - adguard_home_dns_test.stdout | length > 0
    - adguard_home_dns_test.stdout is regex('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

- name: Display DNS verification result
  ansible.builtin.debug:
    msg: >-
      DNS verification successful - resolved {{ adguard_home_dns_probe_name }}
      to: {{ adguard_home_dns_test.stdout | default('N/A') }}
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

# Resolution path once this lands: resolv.conf -> AdGuard (53) -> the upstream
# resolver. resolv_conf owns the chattr -i/+i wrap and the stuck-flag check.
# Skipped in containers, where /etc/resolv.conf is an unreplaceable bind mount.
- name: Update resolv.conf to use localhost for DNS
  ansible.builtin.include_role:
    name: weisssrv.infra.resolv_conf
  vars:
    resolv_conf_immutable: true
    # resolv_conf's template consumes host_dns_servers; this instance answers
    # for itself, so point the host at its own listener.
    host_dns_servers:
      - "127.0.0.1"
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

- name: Display resolv.conf update status
  ansible.builtin.debug:
    msg: "resolv.conf updated to use localhost (127.0.0.1): {{ resolv_conf_result.changed | default(false) }}"
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

- name: Verify resolv.conf content
  ansible.builtin.command:
    cmd: cat /etc/resolv.conf
  register: adguard_home_resolv_conf_content
  changed_when: false
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

- name: Display final resolv.conf
  ansible.builtin.debug:
    msg: "Final /etc/resolv.conf:\n{{ adguard_home_resolv_conf_content.stdout }}"
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))
