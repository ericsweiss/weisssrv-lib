---
# AdGuard Home installation and configuration
# Runs as unprivileged user with CAP_NET_BIND_SERVICE

- name: Install python3-passlib for password verification and dnsutils for the DNS probe
  ansible.builtin.apt:
    name:
      - python3-passlib
      # dig backs the DNS-resolution verify below; install it here so the role
      # is self-contained rather than relying on the base role having run first.
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Check if adguard user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ adguard_home_user }}"
  register: adguard_home_user_check
  failed_when: false

- name: Check if AdGuard Home service exists
  ansible.builtin.stat:
    path: /etc/systemd/system/AdGuardHome.service
  register: adguard_home_service

- name: Stop AdGuard Home for user creation
  ansible.builtin.service:
    name: AdGuardHome
    state: stopped
  when:
    - adguard_home_service.stat.exists
    - adguard_home_user_check.ansible_facts.getent_passwd is not defined or adguard_home_user_check.ansible_facts.getent_passwd[adguard_home_user] is not defined
  changed_when: false  # Service stop/start is deployment process, not config drift

- name: Create adguard group
  ansible.builtin.group:
    name: "{{ adguard_home_group }}"
    system: true
    state: present

- name: Create adguard user
  ansible.builtin.user:
    name: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ adguard_home_install_path }}"
    create_home: false

- name: Create AdGuard Home directory
  ansible.builtin.file:
    path: "{{ adguard_home_install_path }}"
    state: directory
    owner: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    mode: "0755"

- name: Create AdGuard Home certs directory
  ansible.builtin.file:
    path: "{{ adguard_home_cert_path }}"
    state: directory
    owner: root
    group: "{{ adguard_home_group }}"
    mode: "2750"  # setgid so new files inherit group

- name: Create AdGuard Home data directory
  ansible.builtin.file:
    path: "{{ adguard_home_install_path }}/data"
    state: directory
    owner: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    mode: "0700"

- name: Check if AdGuard Home is installed
  ansible.builtin.stat:
    path: "{{ adguard_home_install_path }}/AdGuardHome"
  register: adguard_home_binary

# Version-aware install: detect the running binary's version so bumps to
# adguard_home_version actually upgrade a host already running an older build.
# AdGuardHome --version prints "AdGuard Home, version vX.Y.Z"; pull the bare
# semver to compare against the pin.
- name: Check installed AdGuard Home version
  ansible.builtin.command: "{{ adguard_home_install_path }}/AdGuardHome --version"
  register: adguard_home_version_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: adguard_home_binary.stat.exists

- name: Determine AdGuard Home install need
  ansible.builtin.set_fact:
    # Reinstall when the binary is missing, the probe failed, or the parsed
    # version differs from the pin (no-op when they match -> idempotent).
    adguard_home_needs_install: >-
      {{ not adguard_home_binary.stat.exists
         or adguard_home_version_check.rc | default(1) != 0
         or (adguard_home_version_check.stdout | default('')
             | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('')) != adguard_home_version }}

- name: Set AdGuard Home architecture
  ansible.builtin.set_fact:
    adguard_home_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Download and install AdGuard Home
  when: adguard_home_needs_install
  block:
    - name: Download AdGuard Home
      ansible.builtin.get_url:
        url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/v{{ adguard_home_version }}/AdGuardHome_linux_{{ adguard_home_arch }}.tar.gz"
        # Use upstream filename so get_url's checksum lookup matches an entry in checksums.txt
        dest: "/tmp/AdGuardHome_linux_{{ adguard_home_arch }}.tar.gz"
        mode: "0644"
        checksum: "sha256:https://github.com/AdguardTeam/AdGuardHome/releases/download/v{{ adguard_home_version }}/checksums.txt"

    - name: Extract AdGuard Home
      ansible.builtin.unarchive:
        src: "/tmp/AdGuardHome_linux_{{ adguard_home_arch }}.tar.gz"
        dest: /tmp
        remote_src: true

    # On an upgrade the service is already running; stop it before swapping the
    # binary on disk so the replacement is clean (avoids text-file-busy and a
    # stale process serving the old build). The "Ensure AdGuard Home is enabled
    # and running" task below brings it back up on the new binary. Skipped on a
    # fresh install where the unit does not exist yet.
    - name: Stop AdGuard Home for binary upgrade
      ansible.builtin.service:
        name: AdGuardHome
        state: stopped
      when: adguard_home_service.stat.exists
      changed_when: false  # Service stop/start is deployment process, not config drift

    - name: Install AdGuard Home binary
      ansible.builtin.copy:
        src: /tmp/AdGuardHome/AdGuardHome
        dest: "{{ adguard_home_install_path }}/AdGuardHome"
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Cleanup download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/AdGuardHome_linux_{{ adguard_home_arch }}.tar.gz"
        - /tmp/AdGuardHome

- name: Deploy AdGuard Home systemd service
  ansible.builtin.template:
    src: adguardhome.service.j2
    dest: /etc/systemd/system/AdGuardHome.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart AdGuardHome

# Flush handlers to ensure systemd daemon reload happens before starting the service.
# On a fresh install, the new unit file won't be visible to systemd until daemon-reload runs.
- name: Flush handlers before starting service
  ansible.builtin.meta: flush_handlers

# The .sig file has been observed with restrictive perms, unreadable by the
# non-root adguard user; failed_when: false because it may legitimately not
# exist.
- name: Ensure AdGuardHome.sig is readable by the adguard user
  ansible.builtin.file:
    path: "{{ adguard_home_install_path }}/AdGuardHome.sig"
    mode: "0644"
  failed_when: false

- name: Ensure AdGuard Home is enabled and running
  ansible.builtin.systemd:
    name: AdGuardHome
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for AdGuard Home to be ready
  ansible.builtin.wait_for:
    port: "{{ adguard_home_http_port }}"
    timeout: 60

- name: Check if AdGuard Home config exists (fresh install check)
  ansible.builtin.stat:
    path: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
  register: adguard_home_initial_config

# This prevents sending a blank password to the setup wizard
- name: Validate AdGuard admin password is set (for initial setup)
  ansible.builtin.assert:
    that:
      - adguard_home_admin_password is defined
      - adguard_home_admin_password | length > 0
    fail_msg: >-
      adguard_home_admin_password is not set — supply it from the site's
      secret store before the initial setup wizard runs.
    success_msg: "AdGuard admin password is set"
  when: not adguard_home_initial_config.stat.exists
  no_log: true

# Complete initial setup wizard for fresh installations
# This creates the config file and enables DNS binding
# Without this, AdGuard Home stays in setup mode and won't serve DNS
- name: Complete AdGuard Home initial setup (fresh install only)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_home_http_port }}/control/install/configure"
    method: POST
    body_format: json
    body:
      web:
        ip: "0.0.0.0"
        port: "{{ adguard_home_http_port }}"
      dns:
        ip: "0.0.0.0"
        port: "{{ adguard_home_dns_port }}"
      username: "{{ adguard_home_admin_user }}"
      password: "{{ adguard_home_admin_password }}"
    status_code: 200
  when:
    - not ansible_check_mode
    - not adguard_home_initial_config.stat.exists
  no_log: true

- name: Wait for AdGuard Home to be ready after initial setup
  ansible.builtin.wait_for:
    port: "{{ adguard_home_http_port }}"
    timeout: 60
  when: not adguard_home_initial_config.stat.exists

# Password hash management: Check if existing hash matches password before regenerating
# This prevents unnecessary config rewrites and restarts on every run
# bcrypt generates a different salt each time, so we can't compare hashes directly
- name: Check if AdGuard Home config exists (for password check)
  ansible.builtin.stat:
    path: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
  register: adguard_home_config

# Parse the document instead of grepping for an indented `password:` line: the
# admin user's hash is users[?name == adguard_home_admin_user].password, and a
# line-oriented read/write pair targets "the last password line" — which is a
# different user's the moment a second account exists (or a different key
# entirely after any schema change), silently locking that account out on every
# deploy while never reconciling the admin.
- name: Read the AdGuard Home config
  ansible.builtin.slurp:
    src: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
  register: adguard_home_config_raw
  when:
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_config.stat.exists
  no_log: true

- name: Parse the AdGuard Home config
  ansible.builtin.set_fact:
    adguard_home_config_doc: "{{ adguard_home_config_raw.content | b64decode | from_yaml }}"
  when:
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_config.stat.exists
  no_log: true

- name: Assert the admin user exists in the config
  ansible.builtin.assert:
    that:
      - adguard_home_config_doc.users | default([]) | selectattr('name', 'equalto', adguard_home_admin_user) | list | length == 1
    fail_msg: >-
      {{ adguard_home_install_path }}/AdGuardHome.yaml has no unique users[] entry
      named {{ adguard_home_admin_user }} — refusing to guess which account's
      password to reconcile.
  when:
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_config.stat.exists

- name: Extract the admin user's existing password hash
  ansible.builtin.set_fact:
    adguard_home_existing_hash: >-
      {{ adguard_home_config_doc.users | selectattr('name', 'equalto', adguard_home_admin_user)
         | map(attribute='password') | first | default('') }}
  when:
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_config.stat.exists
  no_log: true

- name: Verify existing hash against password
  ansible.builtin.shell: |
    python3 -c "
    import os
    try:
        from passlib.hash import bcrypt
        password = os.environ['ADGUARD_PASSWORD']
        hash_value = os.environ['ADGUARD_HASH']
        if bcrypt.verify(password, hash_value):
            print('valid')
        else:
            print('invalid')
    except Exception:
        print('error')
    "
  args:
    executable: /bin/bash
  environment:
    ADGUARD_PASSWORD: "{{ adguard_home_admin_password }}"
    ADGUARD_HASH: "{{ adguard_home_existing_hash | default('') | trim }}"
  register: adguard_home_hash_verify_result
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_admin_password is defined
    - adguard_home_admin_password | length > 0
    - adguard_home_existing_hash | default('') | trim | length > 0
    - adguard_home_existing_hash | default('') | trim is match('^\$2[aby]\$')
  no_log: true

- name: Set password hash validity
  ansible.builtin.set_fact:
    adguard_home_password_hash_valid: "{{ (adguard_home_hash_verify_result.stdout | default('') | trim == 'valid') | bool }}"
  when:
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_hash_verify_result is defined

# Generate bcrypt hash from password at deploy time
# Only regenerate if: no existing hash, hash is invalid, or verification failed
# Uses passlib on target host (installed as prerequisite) to avoid controller dependency
- name: Generate bcrypt hash from admin password
  ansible.builtin.shell: |
    python3 -c "
    import os
    from passlib.hash import bcrypt
    password = os.environ['ADGUARD_PASSWORD']
    print(bcrypt.using(rounds=10).hash(password))
    "
  args:
    executable: /bin/bash
  environment:
    ADGUARD_PASSWORD: "{{ adguard_home_admin_password }}"
  register: adguard_home_generated_hash_result
  changed_when: false
  check_mode: false
  when:
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_admin_password is defined
    - adguard_home_admin_password | length > 0
    - not (adguard_home_password_hash_valid | default(false) | bool)
  no_log: true

- name: Set generated password hash fact
  ansible.builtin.set_fact:
    adguard_home_admin_password_hash: "{{ adguard_home_generated_hash_result.stdout | trim }}"
  when:
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_generated_hash_result.stdout is defined
    - adguard_home_generated_hash_result.stdout | length > 0
  no_log: true

# If existing hash is valid, use it instead of generating a new one
- name: Use existing valid password hash
  ansible.builtin.set_fact:
    adguard_home_admin_password_hash: "{{ adguard_home_existing_hash | trim }}"
  when:
    - not (adguard_home_skip_api_config | default(false))
    - adguard_home_password_hash_valid | default(false) | bool
  no_log: true

- name: Validate AdGuard admin password hash is available
  ansible.builtin.assert:
    that:
      - adguard_home_admin_password_hash is defined
      - adguard_home_admin_password_hash | length > 0
      - adguard_home_admin_password_hash is match('^\$2[aby]\$')
    fail_msg: "Failed to generate the AdGuard admin password hash from adguard_home_admin_password."
    success_msg: "AdGuard admin password hash validated"
  when: not (adguard_home_skip_api_config | default(false))

- name: Start the reconciled user list empty
  ansible.builtin.set_fact:
    adguard_home_users_reconciled: []
  when:
    - adguard_home_config.stat.exists
    - not (adguard_home_skip_api_config | default(false))
    - not (adguard_home_password_hash_valid | default(false) | bool)

# Rebuilt entry by entry rather than mapped, so the other users and the list
# order survive untouched.
- name: Replace the admin user's hash in the user list
  ansible.builtin.set_fact:
    adguard_home_users_reconciled: >-
      {{ adguard_home_users_reconciled
         + [item if item.name != adguard_home_admin_user
            else item | combine({'password': adguard_home_admin_password_hash})] }}
  loop: "{{ adguard_home_config_doc.users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - adguard_home_config.stat.exists
    - not (adguard_home_skip_api_config | default(false))
    - not (adguard_home_password_hash_valid | default(false) | bool)
  no_log: true

# Whole-document rewrite, gated on the hash actually being stale: AdGuard's own
# writer formats the file differently, so an unconditional rewrite would report
# changed on every run and bounce the service each time.
- name: Update the admin password in the AdGuard Home config
  ansible.builtin.copy:
    content: "{{ adguard_home_config_doc | combine({'users': adguard_home_users_reconciled}) | to_nice_yaml(indent=2, width=4096) }}"
    dest: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
    owner: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    mode: "0600"
  when:
    - adguard_home_config.stat.exists
    - not (adguard_home_skip_api_config | default(false))
    - not (adguard_home_password_hash_valid | default(false) | bool)
  notify: Restart AdGuardHome
  no_log: true
  # Serialize execution to prevent Docker exec race conditions in test containers
  throttle: 1

# Brief pause after config update to stabilize Docker exec interface
# This prevents race conditions when multiple containers modify configs concurrently
- name: Stabilize after config update
  ansible.builtin.pause:
    seconds: 1
  when:
    - adguard_home_config.stat.exists
    - ansible_connection == "docker"

# Flush handlers to ensure AdGuard Home is fully restarted before API configuration
# This is critical because the password update above triggers a restart
# Note: The Restart AdGuardHome handler includes a built-in sleep for container stability
- name: Flush handlers before API configuration
  ansible.builtin.meta: flush_handlers

- name: Wait for AdGuard Home to be ready before API configuration
  ansible.builtin.wait_for:
    port: "{{ adguard_home_http_port }}"
    timeout: 60
  when: not ansible_check_mode

# Configure base settings via API (ALL DNS hosts)
# Base settings (upstreams, TLS, cache, ratelimit) are reconciled on EVERY
# instance — DNS has to work here before the resolution check below.
- name: Configure base AdGuard Home settings via API
  ansible.builtin.include_tasks: api_base_config.yml
  when:
    - not (adguard_home_skip_api_config | default(false))

# Rewrites and filtering rules are reconciled on the PRIMARY only; replicas
# receive them from weisssrv.infra.adguard_sync, and reconciling them on both
# ends would fight that sync.
- name: Configure DNS rewrites and filtering rules via API
  ansible.builtin.include_tasks: api_config.yml
  when:
    - adguard_home_is_primary | bool
    - not (adguard_home_skip_api_config | default(false))

# Verify AdGuard Home can resolve DNS before updating resolv.conf
# This must succeed with actual DNS results (not just rc=0) before we switch resolv.conf
# Skip in molecule tests - Docker containers can't replace bind-mounted resolv.conf
# Note: Use -4 to force IPv4 since IPv6 responses would fail the regex validation
- name: Verify AdGuard Home DNS resolution is working
  ansible.builtin.command:
    cmd: dig -4 @127.0.0.1 google.com +short +time=5
  register: adguard_home_dns_test
  changed_when: false
  retries: 5
  delay: 3
  until:
    - adguard_home_dns_test.rc == 0
    - adguard_home_dns_test.stdout | length > 0
    - adguard_home_dns_test.stdout is regex('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

- name: Display DNS verification result
  ansible.builtin.debug:
    msg: "DNS verification successful - resolved google.com to: {{ adguard_home_dns_test.stdout | default('N/A') }}"
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

# Update resolv.conf to use localhost now that AdGuard Home is verified working
# Architecture: resolv.conf -> AdGuard Home (53) -> Unbound (5335) -> Internet (DoT)
# Skip in molecule tests - Docker containers have resolv.conf as a bind mount that can't be replaced
# The shared resolv_conf role (invoked below with resolv_conf_immutable: true)
# owns the chattr -i/+i wrap, stuck-flag verification, and the
# unprivileged-container warning path.
- name: Update resolv.conf to use localhost for DNS
  ansible.builtin.include_role:
    name: weisssrv.infra.resolv_conf
  vars:
    resolv_conf_immutable: true
    # resolv_conf's template consumes host_dns_servers; this instance answers
    # for itself, so point the host at its own listener.
    host_dns_servers:
      - "127.0.0.1"
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

- name: Display resolv.conf update status
  ansible.builtin.debug:
    msg: "resolv.conf updated to use localhost (127.0.0.1): {{ resolv_conf_result.changed | default(false) }}"
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

- name: Verify resolv.conf content
  ansible.builtin.command:
    cmd: cat /etc/resolv.conf
  register: adguard_home_resolv_conf_content
  changed_when: false
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

- name: Display final resolv.conf
  ansible.builtin.debug:
    msg: "Final /etc/resolv.conf:\n{{ adguard_home_resolv_conf_content.stdout }}"
  when:
    - not ansible_check_mode
    - not (adguard_home_skip_resolv_conf_update | default(false))

- name: Display resolv.conf skip notice (molecule test)
  ansible.builtin.debug:
    msg: "Skipping resolv.conf update - Docker containers have resolv.conf as a bind mount"
  when: adguard_home_skip_resolv_conf_update | default(false)
