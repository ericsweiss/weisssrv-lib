---
# Base settings (upstreams, TLS, cache, ratelimit, DHCP) reconciled through the
# live AdGuard API; skipped in check mode.

- name: Reconcile AdGuard base settings over the local API
  module_defaults:
    ansible.builtin.uri:
      user: "{{ adguard_home_admin_user }}"
      password: "{{ adguard_home_admin_password }}"
      force_basic_auth: true
  block:
    - name: Skip API base configuration in check mode
      ansible.builtin.debug:
        msg: "Skipping AdGuard Home API base configuration in check mode (cannot query live API)"
      when: ansible_check_mode

    - name: Validate AdGuard admin password is set for API calls
      ansible.builtin.assert:
        that:
          - adguard_home_admin_password is defined
          - adguard_home_admin_password | length > 0
        fail_msg: "adguard_home_admin_password is not set — the API calls below cannot authenticate."
        success_msg: "AdGuard admin password is set"
      when: not ansible_check_mode

    # no_log censors a failure completely, so the read stays off the failure
    # path and the assert below names the URL and status.
    - name: Get current DNS configuration
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/dns_info"
        method: GET
        status_code: 200
      register: adguard_home_current_dns_config
      no_log: true
      failed_when: false
      when: not ansible_check_mode

    - name: Assert the AdGuard DNS configuration read succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_current_dns_config is skipped
            or (adguard_home_current_dns_config.status | default(0)) == 200
        fail_msg: >-
          GET {{ _adguard_home_api_base }}/control/dns_info returned HTTP
          {{ adguard_home_current_dns_config.status | default('n/a') }}:
          {{ adguard_home_current_dns_config.msg | default('no response body') }}
        success_msg: "AdGuard DNS configuration read"
      when: not ansible_check_mode

    - name: Update DNS configuration
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/dns_config"
        method: POST
        body_format: json
        # Bare variable refs only: a filter here can change the JSON type AdGuard sees,
        # and the API answers a wrong-typed field with 400.
        body:
          protection_enabled: "{{ adguard_home_protection_enabled }}"
          upstream_dns: "{{ adguard_home_upstream_dns }}"
          upstream_mode: "{{ adguard_home_upstream_mode }}"
          fallback_dns: "{{ adguard_home_fallback_dns }}"
          dnssec_enabled: "{{ adguard_home_enable_dnssec }}"
          resolve_clients: "{{ adguard_home_resolve_clients }}"
          use_private_ptr_resolvers: "{{ adguard_home_use_private_ptr_resolvers }}"
          disable_ipv6: "{{ adguard_home_disable_ipv6 }}"
          ratelimit: "{{ adguard_home_ratelimit }}"
          ratelimit_whitelist: "{{ adguard_home_ratelimit_whitelist }}"
          ratelimit_subnet_len_ipv4: "{{ adguard_home_ratelimit_subnet_len_ipv4 }}"
          ratelimit_subnet_len_ipv6: "{{ adguard_home_ratelimit_subnet_len_ipv6 }}"
          cache_enabled: "{{ adguard_home_cache_enabled }}"
          cache_size: "{{ adguard_home_cache_size }}"
          cache_ttl_min: "{{ adguard_home_cache_ttl_min }}"
          cache_ttl_max: "{{ adguard_home_cache_ttl_max }}"
          cache_optimistic: "{{ adguard_home_cache_optimistic }}"
        status_code: 200
      when:
        - not ansible_check_mode
        # Check every field sent, to detect drift. AdGuard serializes the default
        # load-balance mode back as "" on GET, so an empty live upstream_mode is
        # read as load_balance. No "#" inside the folded ">" scalar below.
        - >
          (adguard_home_current_dns_config.json.protection_enabled | default(true) != adguard_home_protection_enabled) or
          (adguard_home_current_dns_config.json.upstream_dns | default([]) != adguard_home_upstream_dns) or
          (((adguard_home_current_dns_config.json.upstream_mode | default('')) or 'load_balance') != adguard_home_upstream_mode) or
          (adguard_home_current_dns_config.json.fallback_dns | default([]) != adguard_home_fallback_dns) or
          (adguard_home_current_dns_config.json.dnssec_enabled | default(false) != adguard_home_enable_dnssec) or
          (adguard_home_current_dns_config.json.resolve_clients | default(true) != adguard_home_resolve_clients) or
          (adguard_home_current_dns_config.json.use_private_ptr_resolvers | default(true) != adguard_home_use_private_ptr_resolvers) or
          (adguard_home_current_dns_config.json.disable_ipv6 | default(false) != adguard_home_disable_ipv6) or
          (adguard_home_current_dns_config.json.ratelimit | default(0) != adguard_home_ratelimit) or
          (adguard_home_current_dns_config.json.ratelimit_whitelist | default([]) != adguard_home_ratelimit_whitelist) or
          (adguard_home_current_dns_config.json.ratelimit_subnet_len_ipv4 | default(24) != adguard_home_ratelimit_subnet_len_ipv4) or
          (adguard_home_current_dns_config.json.ratelimit_subnet_len_ipv6 | default(56) != adguard_home_ratelimit_subnet_len_ipv6) or
          (adguard_home_current_dns_config.json.cache_enabled | default(true) != adguard_home_cache_enabled) or
          (adguard_home_current_dns_config.json.cache_size | default(0) != adguard_home_cache_size) or
          (adguard_home_current_dns_config.json.cache_ttl_min | default(0) != adguard_home_cache_ttl_min) or
          (adguard_home_current_dns_config.json.cache_ttl_max | default(0) != adguard_home_cache_ttl_max) or
          (adguard_home_current_dns_config.json.cache_optimistic | default(false) != adguard_home_cache_optimistic)
      # no_log protects the basic-auth credentials. failed_when and ignore_errors
      # are off the failure path so the assert below reports the real status and
      # body instead of a censored "no_log" failure.
      no_log: true
      failed_when: false
      ignore_errors: true
      register: adguard_home_dns_config_updated
      until: (adguard_home_dns_config_updated.status | default(0)) == 200
      retries: 3
      delay: 2

    # Each block asserts its own update: a single trailing assert would defer a
    # failed dns_config past the TLS and DHCP blocks.
    - name: Assert AdGuard DNS configuration update succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_dns_config_updated is skipped or (adguard_home_dns_config_updated.status | default(0)) == 200
        fail_msg: >-
          AdGuard /control/dns_config update failed (HTTP {{ adguard_home_dns_config_updated.status | default('n/a') }}):
          {{ adguard_home_dns_config_updated.json | default(adguard_home_dns_config_updated.content | default(adguard_home_dns_config_updated.msg | default('no response body'))) }}
        success_msg: "AdGuard DNS configuration applied"
      when: not ansible_check_mode

    # acme_certs delivers the certs AFTER this role, so the TLS block self-skips on
    # a first deployment and applies on the next run.
    - name: Check if TLS certificate exists
      ansible.builtin.stat:
        path: "{{ adguard_home_cert_path }}/fullchain.pem"
      register: adguard_home_tls_cert_exists
      when:
        - not ansible_check_mode
        - adguard_home_tls_enabled

    - name: Check if TLS private key exists
      ansible.builtin.stat:
        path: "{{ adguard_home_cert_path }}/privkey.pem"
      register: adguard_home_tls_key_exists
      when:
        - not ansible_check_mode
        - adguard_home_tls_enabled

    - name: Skip TLS configuration if certificates not yet deployed
      ansible.builtin.debug:
        msg: "TLS certificates not yet deployed (will be configured by acme_certs role) - skipping TLS configuration"
      when:
        - not ansible_check_mode
        - adguard_home_tls_enabled
        - adguard_home_tls_cert_exists is defined
        - adguard_home_tls_key_exists is defined
        - not (adguard_home_tls_cert_exists.stat.exists | default(false) and adguard_home_tls_key_exists.stat.exists | default(false))

    - name: Get current TLS configuration
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/tls/status"
        method: GET
        status_code: 200
      register: adguard_home_current_tls_config
      no_log: true
      failed_when: false
      when:
        - not ansible_check_mode
        - adguard_home_tls_enabled
        - adguard_home_tls_cert_exists is defined
        - adguard_home_tls_key_exists is defined
        - adguard_home_tls_cert_exists.stat.exists | default(false)
        - adguard_home_tls_key_exists.stat.exists | default(false)

    # The response carries certificate and private-key fields, so report the
    # status and message only.
    - name: Assert the AdGuard TLS status read succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_current_tls_config is skipped
            or (adguard_home_current_tls_config.status | default(0)) == 200
        fail_msg: >-
          GET {{ _adguard_home_api_base }}/control/tls/status returned HTTP
          {{ adguard_home_current_tls_config.status | default('n/a') }}:
          {{ adguard_home_current_tls_config.msg | default('no response body') }}
        success_msg: "AdGuard TLS status read"
      when: not ansible_check_mode

    - name: Update TLS configuration
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/tls/configure"
        method: POST
        body_format: json
        # Bare refs, no | int / | bool: see the dns_config body above.
        body:
          enabled: "{{ adguard_home_tls_enabled }}"
          server_name: "{{ adguard_home_tls_server_name }}"
          # force_https stays false: the role reconciles over the plaintext
          # admin API at _adguard_home_api_base (README § Security).
          force_https: false
          port_https: "{{ adguard_home_https_port }}"
          port_dns_over_tls: "{{ adguard_home_dot_port }}"
          port_dns_over_quic: "{{ adguard_home_doq_port }}"
          # Use certificate_path/private_key_path (file paths) instead of
          # certificate_chain/private_key (which expect actual PEM content)
          certificate_path: "{{ adguard_home_cert_path }}/fullchain.pem"
          private_key_path: "{{ adguard_home_cert_path }}/privkey.pem"
        status_code: 200
      when:
        - not ansible_check_mode
        - adguard_home_tls_enabled
        - adguard_home_tls_cert_exists is defined
        - adguard_home_tls_key_exists is defined
        - adguard_home_tls_cert_exists.stat.exists | default(false)
        - adguard_home_tls_key_exists.stat.exists | default(false)
        - >
          (adguard_home_current_tls_config.json.enabled | default(false)) != adguard_home_tls_enabled or
          (adguard_home_current_tls_config.json.server_name | default('')) != adguard_home_tls_server_name or
          (adguard_home_current_tls_config.json.force_https | default(false) | bool) or
          (adguard_home_current_tls_config.json.port_https | default(0)) != adguard_home_https_port or
          (adguard_home_current_tls_config.json.port_dns_over_tls | default(0)) != adguard_home_dot_port or
          (adguard_home_current_tls_config.json.port_dns_over_quic | default(0)) != adguard_home_doq_port or
          (adguard_home_current_tls_config.json.certificate_path | default('')) != (adguard_home_cert_path + '/fullchain.pem') or
          (adguard_home_current_tls_config.json.private_key_path | default('')) != (adguard_home_cert_path + '/privkey.pem')
      no_log: true
      failed_when: false
      ignore_errors: true
      register: adguard_home_tls_config_updated
      until: (adguard_home_tls_config_updated.status | default(0)) == 200
      retries: 3
      delay: 2

    - name: Assert AdGuard TLS configuration update succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_tls_config_updated is skipped or (adguard_home_tls_config_updated.status | default(0)) == 200
        fail_msg: >-
          AdGuard /control/tls/configure update failed (HTTP {{ adguard_home_tls_config_updated.status | default('n/a') }}):
          {{ adguard_home_tls_config_updated.json | default(adguard_home_tls_config_updated.content | default(adguard_home_tls_config_updated.msg | default('no response body'))) }}
        success_msg: "AdGuard TLS configuration applied"
      when: not ansible_check_mode

    # Only the disable direction is implemented, so a true value would be a silent
    # no-op rather than a configured DHCP server.
    - name: Assert AdGuard DHCP is not requested
      ansible.builtin.assert:
        that:
          - not (adguard_home_dhcp_enabled | bool)
        fail_msg: >-
          adguard_home_dhcp_enabled is true, but this role only reconciles the
          DHCP server into the disabled state — configure DHCP out of band.
        success_msg: "AdGuard DHCP server stays disabled"

    - name: Get current DHCP configuration
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/dhcp/status"
        method: GET
        status_code: 200
      register: adguard_home_current_dhcp_config
      no_log: true
      failed_when: false
      when: not ansible_check_mode

    - name: Assert the AdGuard DHCP status read succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_current_dhcp_config is skipped
            or (adguard_home_current_dhcp_config.status | default(0)) == 200
        fail_msg: >-
          GET {{ _adguard_home_api_base }}/control/dhcp/status returned HTTP
          {{ adguard_home_current_dhcp_config.status | default('n/a') }}:
          {{ adguard_home_current_dhcp_config.msg | default('no response body') }}
        success_msg: "AdGuard DHCP status read"
      when: not ansible_check_mode

    - name: Disable DHCP server (router handles DHCP)
      ansible.builtin.uri:
        url: "{{ _adguard_home_api_base }}/control/dhcp/set_config"
        method: POST
        body_format: json
        body:
          enabled: false
        status_code: 200
      when:
        - not ansible_check_mode
        - adguard_home_current_dhcp_config.json.enabled | default(false)
      no_log: true
      failed_when: false
      ignore_errors: true
      register: adguard_home_dhcp_config_updated
      until: (adguard_home_dhcp_config_updated.status | default(0)) == 200
      retries: 3
      delay: 2

    - name: Assert AdGuard DHCP configuration update succeeded
      ansible.builtin.assert:
        that:
          - adguard_home_dhcp_config_updated is skipped or (adguard_home_dhcp_config_updated.status | default(0)) == 200
        fail_msg: >-
          AdGuard /control/dhcp/set_config update failed (HTTP {{ adguard_home_dhcp_config_updated.status | default('n/a') }}):
          {{ adguard_home_dhcp_config_updated.json | default(adguard_home_dhcp_config_updated.content | default(adguard_home_dhcp_config_updated.msg | default('no response body'))) }}
        success_msg: "AdGuard DHCP configuration applied"
      when: not ansible_check_mode
