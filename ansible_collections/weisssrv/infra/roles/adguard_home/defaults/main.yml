---
# Required inputs (no default):
#   adguard_home_version         — pinned AdGuard Home release
#   adguard_home_admin_password  — admin password; supply from the secret store
#   adguard_home_tls_server_name — when adguard_home_tls_enabled

adguard_home_user: adguard
adguard_home_group: adguard
adguard_home_install_path: /opt/AdGuardHome
adguard_home_http_port: 3000
adguard_home_dns_port: 53
adguard_home_dot_port: 853
adguard_home_https_port: 443
adguard_home_admin_user: admin

# Listen addresses written by the first-install setup wizard. The admin UI is
# plaintext HTTP (force_https stays false so the role can reconcile over the
# localhost API), so restrict adguard_home_web_bind or firewall the port.
adguard_home_web_bind: "0.0.0.0"
adguard_home_dns_bind: "0.0.0.0"

# Name resolved by the post-deploy DNS smoke test.
adguard_home_dns_probe_name: google.com

# Where files/adguard-admin-hash.py is installed; it is also the operator tool
# for inspecting or resetting the admin hash (README § Admin password).
adguard_home_hash_helper_path: /usr/local/sbin/adguard-admin-hash.py

# Seconds to wait between the config rewrite and the restart handler. Only a
# container test harness needs this; leave 0 on real hosts.
adguard_home_settle_seconds: 0

# Reconcile rewrites + filtering rules here. Exactly ONE instance may do so:
# the replicas receive them through weisssrv.infra.adguard_sync, and a second
# reconciler would fight that sync.
adguard_home_is_primary: false

# Skip API configuration (useful for integration tests)
adguard_home_skip_api_config: false

# Skip pointing the host's own resolver at this instance (the role otherwise
# rewrites /etc/resolv.conf to 127.0.0.1 via weisssrv.infra.resolv_conf).
adguard_home_skip_resolv_conf_update: false

# systemd sandboxing. Both are set false in containers, where the private
# mounts systemd creates over system directories break the unit.
adguard_home_use_private_tmp: true
adguard_home_use_protect_system: true

# Unit ordering. The default upstream is a local recursive resolver
# (weisssrv.infra.unbound); set these empty when pointing at a public one.
adguard_home_after_units:
  - unbound.service
adguard_home_wants_units:
  - unbound.service

# DoT/DoH/DoQ. The server name must match the cert distributed to
# adguard_home_cert_path, so it has no default.
adguard_home_tls_enabled: true
adguard_home_tls_server_name: ""
adguard_home_cert_path: "{{ adguard_home_install_path }}/certs"
adguard_home_doq_port: 853

# Upstream resolver — a local recursive resolver (weisssrv.infra.unbound) by
# default; point it at a public resolver to drop that dependency.
adguard_home_upstream_dns:
  - "127.0.0.1:5335"

# API-managed base settings (api_base_config.yml).
adguard_home_protection_enabled: true
adguard_home_upstream_mode: "load_balance"
adguard_home_fallback_dns: []
adguard_home_enable_dnssec: true
adguard_home_resolve_clients: true
adguard_home_use_private_ptr_resolvers: false
adguard_home_disable_ipv6: false

# Cache configuration
adguard_home_cache_enabled: true
adguard_home_cache_size: 8388608
adguard_home_cache_ttl_min: 0
adguard_home_cache_ttl_max: 0
adguard_home_cache_optimistic: false

# Rate limiting
adguard_home_ratelimit: 20
adguard_home_ratelimit_whitelist: []

# The role only reconciles the DISABLED state (it asserts this stays false);
# running AdGuard's DHCP server is out of scope.
adguard_home_dhcp_enabled: false

# Reconciled on the primary only (adguard_home_is_primary). Empty lists mean
# "manage none" — the role never deletes what it was not given.
adguard_home_rewrites: []
adguard_home_user_rules: []

# Make the empty list authoritative instead, so the last rewrite / rule can be
# removed through codification. Prunes everything the lists do not name.
adguard_home_prune_rewrites: false
adguard_home_prune_user_rules: false
