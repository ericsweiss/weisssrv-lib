---
# Internal, not consumer API: ansible_architecture -> the arch token in the
# upstream release artifact name. Unmapped architectures fail closed rather than
# installing an amd64 binary that will not run.
_adguard_home_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7
  armv6l: armv6
  i386: "386"
  i686: "386"
  riscv64: riscv64

# Every API task reconciles over the listener adguard_home_web_bind names. A
# wildcard bind is dialled on loopback; a specific one is dialled directly, so
# restricting the bind does not break the role's own reconcile.
_adguard_home_api_host: >-
  {{ '127.0.0.1'
     if adguard_home_web_bind in ['0.0.0.0', '::', '*', '']
     else adguard_home_web_bind }}
_adguard_home_api_base: >-
  http://{{ '[' ~ _adguard_home_api_host ~ ']'
            if ':' in _adguard_home_api_host
            else _adguard_home_api_host }}:{{ adguard_home_http_port }}
