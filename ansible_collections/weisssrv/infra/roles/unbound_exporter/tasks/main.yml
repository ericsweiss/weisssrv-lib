---
# Unbound Exporter — Prometheus metrics for the Unbound DNS resolver.
# Thin wrapper over the shared prometheus_exporter role (.deb install).

# The pinned checksum covers ONE artefact, so the role can only install the
# x86_64 .deb; fail here rather than as a 404 or a dpkg arch refusal that reads
# like a corrupted download.
- name: Assert the host architecture matches the pinned artefact
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'x86_64'
    fail_msg: >-
      unbound_exporter installs the upstream x86_64 .deb pinned by
      unbound_exporter_checksum; this host reports
      {{ ansible_architecture }}. Supply a per-architecture artefact and
      checksum before enabling the role here.
    success_msg: "Host architecture matches the pinned unbound_exporter artefact"

- name: Install unbound_exporter via shared pipeline
  ansible.builtin.include_role:
    name: weisssrv.infra.prometheus_exporter
    tasks_from: install
  vars:
    _ue_base: "https://github.com/letsencrypt/unbound_exporter/releases/download"
    _ue_file: "unbound_exporter-v{{ unbound_exporter_version }}.x86_64.deb"
    prometheus_exporter_name: unbound_exporter
    prometheus_exporter_version: "{{ unbound_exporter_version }}"
    prometheus_exporter_artifact_type: deb
    prometheus_exporter_download_url: "{{ _ue_base }}/v{{ unbound_exporter_version }}/{{ _ue_file }}"
    prometheus_exporter_checksum: "{{ unbound_exporter_checksum }}"
    prometheus_exporter_binary_path: /usr/bin/unbound_exporter
    # The binary has no --version flag, so dpkg is the source of truth. Strip
    # the epoch and everything after the LAST `-` (debian-policy §5.6.12 only
    # allows a hyphen in upstream when a revision follows) to get the pinned
    # upstream version; a raw substring check would match `0.4.6` against
    # `0.4.60-1` and miss `1:0.4.6-1`.
    prometheus_exporter_version_check_cmd: |
      set -o pipefail
      dpkg-query -W -f='${Version}' unbound_exporter 2>/dev/null | sed -E 's/^[0-9]+://; s/-[^-]*$//'
    prometheus_exporter_service_name: unbound-exporter
    prometheus_exporter_port: "{{ unbound_exporter_port }}"

- name: Deploy unbound-exporter systemd service
  ansible.builtin.template:
    src: unbound-exporter.service.j2
    dest: /etc/systemd/system/unbound-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus exporter

- name: Enable and verify unbound_exporter via shared pipeline
  ansible.builtin.include_role:
    name: weisssrv.infra.prometheus_exporter
    tasks_from: service
  vars:
    prometheus_exporter_name: unbound_exporter
    prometheus_exporter_service_name: unbound-exporter
    prometheus_exporter_port: "{{ unbound_exporter_port }}"
