---
# Installs the real .deb, not a mock: the role's install check is `dpkg-query`,
# which a mock never satisfies, so idempotence would fail. The container has no
# Unbound control socket, so the /metrics health check is `molecule-notest`.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

  roles:
    - role: weisssrv.infra.unbound_exporter
