---
# Installs the real .deb, not a mock binary: the role's install check is
# `dpkg-query`, which a mock never satisfies, so converge would install over it
# and the idempotence run would re-write the mock (changed) and fail.
# There is no Unbound control socket in the container, so the shared pipeline's
# /metrics health check is tagged `molecule-notest`.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

  roles:
    - role: weisssrv.infra.unbound_exporter
