---
platforms:
  - name: base-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        admin_user: testuser
        admin_email: test@test.local
        timezone: America/Los_Angeles
        base_skip_dns_config: true
        base_skip_sudoers_validation: true
        # TWO keys: the role deploys the whole list in ONE authorized_key call
        # (a looped exclusive: true would leave only the last key), so the
        # newline join is only exercised with more than one entry.
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITestKeyForMolecule test@molecule
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAISecondTestKeyForMolecule second@molecule
        base_common_packages:
          - curl
          - wget
          - neovim
          - htop
          - tmux
          - git
          - jq
          - unzip
          - rsync
          - net-tools
          - dnsutils
          - ca-certificates
          - gnupg
          - lsb-release
        base_vm_packages:
          - qemu-guest-agent
        base_fail2ban_enabled: true
        base_fail2ban_pveproxy_enabled: false
        base_fail2ban_recidive_enabled: false
        base_fail2ban_ignoreip:
          - 127.0.0.1/8
          - ::1
