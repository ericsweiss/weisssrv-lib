---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - sudo
        state: present
      when: ansible_os_family == "Debian"

    - name: Create testuser before running base role
      ansible.builtin.user:
        name: testuser
        state: present
        create_home: true

  roles:
    - role: weisssrv.infra.base

  post_tasks:
    # Second pass for the ONE key path that can lock an operator out: exclusive
    # rewrites authorized_keys wholesale. Run against a second admin user so the
    # additive default above stays asserted on testuser, and idempotent because
    # prepare (not converge) seeded the foreign key it revokes.
    - name: Re-apply the role for the exclusive-keys admin user
      ansible.builtin.include_role:
        name: weisssrv.infra.base
      vars:
        base_admin_user: keyexcl
        base_ssh_authorized_keys_exclusive: true
