---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - sudo
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: weisssrv.infra.base

  post_tasks:
    # Second pass for the ONE key path that can lock an operator out: exclusive
    # rewrites authorized_keys wholesale. A second admin user keeps the additive
    # default asserted on testuser; prepare seeded the foreign key it revokes.
    - name: Re-apply the role for the exclusive-keys admin user
      ansible.builtin.include_role:
        name: weisssrv.infra.base
      vars:
        base_admin_user: keyexcl
        base_ssh_authorized_keys_exclusive: true

    # Negative test: an entry carrying whitespace would silently become two
    # kernel parameters, so the token assert must reject it.
    - name: Re-apply with a multi-token kernel cmdline entry (expect failure)
      block:
        - name: Include base with a kernel cmdline entry holding a space
          ansible.builtin.include_role:
            name: weisssrv.infra.base
          vars:
            base_kernel_cmdline_args:
              - "slub_nomerge nosmt"

        - name: Kernel cmdline token assert failed to trigger
          ansible.builtin.copy:
            dest: /tmp/base-kernel-cmdline-token-assert.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Kernel cmdline token assert correctly rejected the entry
          ansible.builtin.copy:
            dest: /tmp/base-kernel-cmdline-token-assert.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}

    # Negative test: on a systemd-boot host the drop-in is never read, so the
    # role must refuse rather than stage a parameter that cannot reach the
    # kernel.
    - name: Stage a systemd-boot kernel command line
      ansible.builtin.copy:
        dest: /etc/kernel/cmdline
        content: "root=ZFS=rpool/ROOT/pve-1 boot=zfs\n"
        mode: "0644"

    - name: Re-apply with a systemd-boot kernel command line (expect failure)
      block:
        - name: Include base while /etc/kernel/cmdline exists
          ansible.builtin.include_role:
            name: weisssrv.infra.base

        - name: Systemd-boot assert failed to trigger
          ansible.builtin.copy:
            dest: /tmp/base-kernel-cmdline-grub-assert.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Systemd-boot assert correctly refused the host
          ansible.builtin.copy:
            dest: /tmp/base-kernel-cmdline-grub-assert.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}

    - name: Remove the staged systemd-boot kernel command line
      ansible.builtin.file:
        path: /etc/kernel/cmdline
        state: absent
