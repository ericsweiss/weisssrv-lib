---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - sudo
        state: present
      when: ansible_os_family == "Debian"

    - name: Create testuser before running base role
      ansible.builtin.user:
        name: testuser
        state: present
        create_home: true

  roles:
    - role: weisssrv.infra.base

  post_tasks:
    # Second pass for the ONE key path that can lock an operator out: exclusive
    # rewrites authorized_keys wholesale. Run against a second admin user so the
    # additive default above stays asserted on testuser, and idempotent because
    # prepare (not converge) seeded the foreign key it revokes.
    - name: Re-apply the role for the exclusive-keys admin user
      ansible.builtin.include_role:
        name: weisssrv.infra.base
      vars:
        base_admin_user: keyexcl
        base_ssh_authorized_keys_exclusive: true
