---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    # openssh-server ships in the molecule image; host keys and the privilege
    # separation dir must exist for the role's sshd -t/-T validation to work
    # (/run is tmpfs, so /run/sshd is gone on every container start).
    - name: Ensure sshd host keys and runtime dir exist
      ansible.builtin.raw: |
        mkdir -p /run/sshd
        ssh-keygen -A
      changed_when: false

    # Seed a conflicting cloud-init style drop-in: the role's 00-hardening.conf
    # must sort ahead of it (sshd is FIRST-match-wins), which the role's own
    # sshd -T assert and the verify playbook prove.
    - name: Seed a conflicting 50-cloud-init.conf sshd drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/50-cloud-init.conf
        content: |
          PasswordAuthentication yes
        owner: root
        group: root
        mode: "0644"

    # Two admin users, each seeded with a FOREIGN key nothing in the inventory
    # lists. testuser converges additively (default) and must KEEP it; keyexcl
    # converges with base_ssh_authorized_keys_exclusive and must LOSE it. Seeded
    # here, not in converge, so the idempotence re-run does not ping-pong.
    - name: Create the two admin users the converge exercises
      ansible.builtin.user:
        name: "{{ item }}"
        state: present
        create_home: true
      loop:
        - testuser
        - keyexcl

    - name: Create .ssh for both admin users
      ansible.builtin.file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0700"
      loop:
        - testuser
        - keyexcl

    - name: Seed a foreign key into both authorized_keys files
      ansible.builtin.copy:
        dest: "/home/{{ item }}/.ssh/authorized_keys"
        content: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIForeignKeyNotInInventory foreign@molecule\n"
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0600"
      loop:
        - testuser
        - keyexcl
