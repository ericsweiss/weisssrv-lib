---
# Hardening goes in a /etc/ssh/sshd_config.d/ drop-in, prefixed `00-` on
# purpose: sshd resolves directives FIRST-match-wins, and the Proxmox cloud-init
# VM image can ship a 50-cloud-init.conf that a `99-*` file would lose to. The
# `sshd -T` assert below proves the intended values are effective whatever other
# drop-ins exist.

# Lockout guard. The drop-in below rewrites sshd_config unconditionally, and
# base_admin_user == 'root' means "manage no admin user" — the user, sudoers and
# authorized_keys tasks in main.yml all self-skip — so a defaults-only run would
# disable root login while provisioning no replacement. Refuse to write it unless
# a login path survives: a managed non-root account carrying at least one key,
# root login still permitted, or password authentication left on (which keeps
# every pre-existing account reachable — the case for hosts whose keys are
# provisioned outside Ansible by cloud-init or image baking).
# The accept/reject matrix is exercised in molecule/default/verify.yml.
- name: Assert the SSH hardening leaves a usable login path
  ansible.builtin.assert:
    that:
      - >-
        (base_admin_user != 'root' and base_ssh_authorized_keys | default([]) | length > 0)
        or (base_ssh_permit_root_login | string | lower != 'no')
        or (base_ssh_password_authentication | bool)
    fail_msg: >-
      base_ssh_permit_root_login is "no", base_ssh_password_authentication is
      false, and no alternative login is provisioned (base_admin_user is
      'root', which manages no admin user, and/or base_ssh_authorized_keys is
      empty) — this run would lock SSH out of the host. Set admin_user to a
      non-root account AND ssh_authorized_keys to at least one public key, or
      set ssh_permit_root_login to "prohibit-password", or leave
      ssh_password_authentication on.
    success_msg: "SSH hardening leaves a usable login path"

# Validate the hardening drop-in BEFORE installing it: render a candidate into a
# temp dir, assemble the merged effective config there (a drop-in can't be
# checked standalone — `sshd -t -f` needs a complete config with HostKey etc.),
# and `sshd -t` that. The drop-in is copied into /etc/ssh/sshd_config.d/ only
# after it passes, so a bad value never lands on disk to break the next sshd
# restart/reboot (validate-after-install would leave the broken file behind).
# The temp-dir scaffolding tasks report changed_when: false — they build a
# throwaway validation sandbox every run; the only real state change is the
# drop-in install below.
- name: Create temp dir for SSH drop-in validation
  ansible.builtin.tempfile:
    state: directory
    suffix: sshd-validate
  register: base_sshd_validate_dir
  changed_when: false
  check_mode: false

- name: Validate the SSH hardening drop-in, then install it
  block:
    - name: Render SSH hardening drop-in candidate
      ansible.builtin.template:
        src: sshd-hardening.conf.j2
        dest: "{{ base_sshd_validate_dir.path }}/00-hardening.conf"
        owner: root
        group: root
        mode: "0644"
      changed_when: false
      check_mode: false

    - name: Validate candidate against the merged sshd configuration
      ansible.builtin.shell: |
        set -euo pipefail
        tmp={{ base_sshd_validate_dir.path | quote }}
        mkdir -p "$tmp/sshd_config.d"
        if [ -d /etc/ssh/sshd_config.d ]; then
          cp -a /etc/ssh/sshd_config.d/. "$tmp/sshd_config.d/" 2>/dev/null || true
        fi
        cp "$tmp/00-hardening.conf" "$tmp/sshd_config.d/00-hardening.conf"
        if grep -Eq '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config.d/' /etc/ssh/sshd_config; then
          sed -E "s#^([[:space:]]*Include[[:space:]]+)/etc/ssh/sshd_config.d/#\1$tmp/sshd_config.d/#" \
            /etc/ssh/sshd_config > "$tmp/sshd_config"
        else
          cat /etc/ssh/sshd_config > "$tmp/sshd_config"
          printf '\nInclude %s/sshd_config.d/*.conf\n' "$tmp" >> "$tmp/sshd_config"
        fi
        sshd -t -f "$tmp/sshd_config"
      args:
        executable: /bin/bash
      changed_when: false
      check_mode: false

    - name: Ensure the sshd drop-in directory exists
      # copy won't create the parent dir; Debian/Proxmox ship it, but be explicit
      # so a minimal host without it doesn't fail the install below.
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the validated SSH hardening drop-in
      ansible.builtin.copy:
        src: "{{ base_sshd_validate_dir.path }}/00-hardening.conf"
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      notify: Restart sshd
  always:
    - name: Clean up the SSH validation temp dir
      ansible.builtin.file:
        path: "{{ base_sshd_validate_dir.path }}"
        state: absent
      changed_when: false
      check_mode: false

- name: Assert SSH hardening is effective (sshd -T)
  ansible.builtin.command:
    cmd: sshd -T
  register: base_sshd_effective_config
  changed_when: false
  # Skip in check mode: the drop-in template above is not actually written
  # during --check, so sshd -T would reflect the pre-fix config and the assert
  # below could false-fail a dry run.
  when: not ansible_check_mode

# sshd -T normalizes PermitRootLogin "prohibit-password" to "without-password"
# in its output, so compare against the normalized form.
- name: Confirm key hardening directives reflect the intended values
  ansible.builtin.assert:
    that:
      - _sshd_effective is search('(?m)^passwordauthentication ' ~ _want_pwauth ~ '$')
      - _sshd_effective is search('(?m)^permitrootlogin ' ~ _want_rootlogin ~ '$')
      # Port is additive in sshd_config: require EXACTLY the intended port (no
      # extra/stale Port line from the base config or another drop-in leaving an
      # old SSH port listening), so the role fails closed instead of silently
      # keeping it open. A duplicate SAME-port line (e.g. an uncommented Port in
      # the monolithic config equal to ours) is harmless redundancy that sshd -T
      # does NOT dedupe, so `| unique` collapses it; a DIFFERENT stale port still
      # leaves >1 element and fails closed.
      - (_sshd_effective | regex_findall('(?m)^port\s+\S+$') | unique) == ['port ' ~ (base_ssh_port | string)]
    fail_msg: >-
      sshd -T does not reflect the intended hardening. Another
      sshd_config.d drop-in (e.g. 50-cloud-init.conf) likely sets a
      conflicting value that sorts ahead of 00-hardening.conf.
    success_msg: "SSH hardening is effective in the merged sshd config"
  vars:
    _sshd_effective: "{{ base_sshd_effective_config.stdout | lower }}"
    _want_pwauth: "{{ base_ssh_password_authentication | ternary('yes', 'no') }}"
    _want_rootlogin: "{{ base_ssh_permit_root_login | lower | replace('prohibit-password', 'without-password') }}"
  when: not ansible_check_mode

- name: Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: "{{ base_ssh_service_name | default('ssh') }}"
    state: started
    enabled: true
