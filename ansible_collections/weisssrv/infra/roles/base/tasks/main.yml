---
# Every include_tasks below uses apply: — tags on the include line alone do not
# reach the included tasks, so a `--tags ssh` run would execute the include and
# skip its contents.
- name: Configure Proxmox repositories
  ansible.builtin.include_tasks:
    file: proxmox-repos.yml
    apply:
      tags: [packages, base, proxmox-repos]
  tags: [packages, base, proxmox-repos]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"
  changed_when: false  # Cache updates are maintenance, not config changes
  tags: [packages, base]

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ base_common_packages }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"
  tags: [packages, base]

# Downstream tasks gate on these facts, so they must exist for any --tags
# subset. qemu-guest-agent is KVM-only; the update-policy gates cover any guest.
- name: Detect if running as a KVM guest
  ansible.builtin.set_fact:
    base_is_kvm_guest: >-
      {{ ansible_facts['virtualization_role'] | default('') == 'guest'
         and ansible_facts['virtualization_type'] | default('') == 'kvm' }}
  tags: [always]

- name: Detect if running in a VM
  ansible.builtin.set_fact:
    base_is_virtual_machine: "{{ ansible_facts['virtualization_role'] | default('') == 'guest' }}"
  tags: [always]

- name: Detect if running in a container (no hwclock access)
  ansible.builtin.set_fact:
    base_is_container: "{{ ansible_facts['virtualization_type'] | default('') in ['docker', 'lxc', 'container', 'podman'] }}"
  tags: [always]

- name: Install VM-specific packages
  ansible.builtin.apt:
    name: "{{ base_vm_packages }}"
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - base_is_kvm_guest | bool
  tags: [packages, base]

- name: Enable and start qemu-guest-agent service
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when:
    - ansible_facts['os_family'] == "Debian"
    - base_is_kvm_guest | bool
  tags: [packages, base]

# Updates are driven from Ansible on VMs and containers. Written whether or not
# the package is installed: a later `apt install unattended-upgrades` would
# otherwise come up enabled.
- name: Disable unattended-upgrades auto-update
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible - unattended-upgrades disabled
      // Updates are managed via Task/Ansible workflows
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
    mode: "0644"
    owner: root
    group: root
  when: (base_is_virtual_machine | bool) or (base_is_container | bool)
  tags: [config, base]

- name: Check whether the unattended-upgrades unit is installed
  ansible.builtin.stat:
    path: "{{ item }}"
  register: base_unattended_upgrades_unit
  loop:
    - /usr/lib/systemd/system/unattended-upgrades.service
    - /lib/systemd/system/unattended-upgrades.service
    - /etc/systemd/system/unattended-upgrades.service
  tags: [config, base]

# Gated on the unit existing rather than tolerating every failure, so a wedged
# systemd fails the run instead of leaving the service enabled.
- name: Stop and disable unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  when:
    - (base_is_virtual_machine | bool) or (base_is_container | bool)
    - base_unattended_upgrades_unit.results | selectattr('stat.exists') | list | length > 0
  tags: [config, base]

# OpenIPMI's LSB init script fails to load the drivers on a host with no BMC,
# leaving the system 'degraded' on every boot, so it is masked there. The role
# only masks: a host that later gains a BMC needs `systemctl unmask` by hand.
- name: Check for IPMI hardware device
  ansible.builtin.stat:
    path: /dev/ipmi0
  register: base_ipmi_device
  tags: [config, base]

- name: Check whether openipmi init script is present
  ansible.builtin.stat:
    path: /etc/init.d/openipmi
  register: base_openipmi_initscript
  tags: [config, base]

# The symlink IS the mask, so this works before the SysV generator has run the
# unit into existence — which `systemd: masked` cannot.
- name: Mask openipmi.service on hosts without IPMI hardware
  ansible.builtin.file:
    path: /etc/systemd/system/openipmi.service
    src: /dev/null
    state: link
  when:
    - base_openipmi_initscript.stat.exists
    - not base_ipmi_device.stat.exists
  notify: Reload systemd
  tags: [config, base]

- name: Ensure admin user exists with sudo group
  ansible.builtin.user:
    name: "{{ base_admin_user }}"
    groups: sudo
    append: true
    create_home: true
    state: present
  when: base_admin_user != 'root'
  tags: [users, security, base]

- name: Create .ssh directory for admin user
  ansible.builtin.file:
    path: "/home/{{ base_admin_user }}/.ssh"
    state: directory
    owner: "{{ base_admin_user }}"
    group: "{{ base_admin_user }}"
    mode: "0700"
  when: base_admin_user != 'root'
  tags: [ssh, users, security, base]

- name: Validate SSH keys are not empty
  ansible.builtin.assert:
    that:
      - item | trim | length > 0
      - "'ssh-' in item or 'ecdsa-' in item or 'sk-' in item"
    fail_msg: "base_ssh_authorized_keys contains an empty or malformed entry."
    quiet: true
  loop: "{{ base_ssh_authorized_keys | default([]) }}"
  when: base_ssh_authorized_keys is defined and base_ssh_authorized_keys | length > 0
  tags: [ssh, users, security, base]

# Whole list in one call, newline-joined; the separator must be a real newline
# or every key collapses into one malformed line. Additive unless
# base_ssh_authorized_keys_exclusive; an empty exclusive list is refused below.
- name: Refuse an empty exclusive authorized_keys list
  ansible.builtin.assert:
    that: >-
      not (base_ssh_authorized_keys_exclusive | bool)
      or (base_ssh_authorized_keys | default([]) | length > 0)
    fail_msg: >-
      base_ssh_authorized_keys_exclusive is true but base_ssh_authorized_keys
      is empty. That combination would remove every key from
      {{ base_admin_user }}'s authorized_keys and lock this SSH-managed host
      out. Populate the list, or perform the full revocation from console
      access instead.
  tags: [ssh, users, security, base]

- name: Deploy authorized_keys for admin user
  ansible.posix.authorized_key:
    user: "{{ base_admin_user }}"
    state: present
    key: "{{ base_ssh_authorized_keys | join('\n') }}"
    exclusive: "{{ base_ssh_authorized_keys_exclusive | bool }}"
  when: base_ssh_authorized_keys is defined and base_ssh_authorized_keys | length > 0
  tags: [ssh, users, security, base]

- name: Configure sudoers for admin user (passwordless sudo)
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ base_admin_user }}
    line: "{{ base_admin_user }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "{{ 'visudo -cf %s' if not (base_skip_sudoers_validation | default(false)) else omit }}"
  when: base_admin_user != 'root'
  tags: [ssh, users, security, base]

- name: Include SSH hardening tasks
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      tags: [ssh, security, base]
  when: not (base_skip_ssh_config | default(false))
  tags: [ssh, security, base]

- name: Set timezone (physical/VM - with hwclock)
  community.general.timezone:
    name: "{{ base_timezone }}"
    hwclock: UTC
  when:
    - base_timezone is defined
    - not (base_skip_timezone_config | default(false))
    - not base_is_container
  tags: [config, base]

- name: Set timezone (container - symlink only, no hwclock)
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ base_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  when:
    - base_timezone is defined
    - not (base_skip_timezone_config | default(false))
    - base_is_container
  tags: [config, base]

- name: Configure DNS servers
  ansible.builtin.include_tasks:
    file: dns.yml
    apply:
      tags: [dns, networking, base]
  when: not (base_skip_dns_config | default(false))
  tags: [dns, networking, base]

- name: Configure extra kernel command-line parameters
  ansible.builtin.include_tasks:
    file: kernel-cmdline.yml
    apply:
      tags: [kernel, boot, base]
  tags: [kernel, boot, base]

- name: Include fail2ban tasks
  ansible.builtin.include_tasks:
    file: fail2ban.yml
    apply:
      tags: [security, fail2ban, base]
  when: base_fail2ban_enabled | default(true)
  tags: [security, fail2ban, base]
