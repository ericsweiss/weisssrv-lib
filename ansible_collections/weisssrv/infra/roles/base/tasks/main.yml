---
# Base role: common packages, SSH hardening, and user setup

# Configure Proxmox repositories first (disable enterprise, enable community).
# All include_tasks below use apply: — tags on the include line alone do not
# propagate to the included (untagged) tasks, so a tag-subset run like
# `--tags ssh` would execute only the include and silently skip everything
# inside the file.
- name: Configure Proxmox repositories
  ansible.builtin.include_tasks:
    file: proxmox-repos.yml
    apply:
      tags: [packages, base, proxmox-repos]
  tags: [packages, base, proxmox-repos]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"
  changed_when: false  # Cache updates are maintenance, not config changes
  tags: [packages, base]

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ base_common_packages }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"
  tags: [packages, base]

# Downstream tasks gate on these facts — they must exist for any --tags subset.
- name: Detect if running in a VM
  ansible.builtin.set_fact:
    base_is_virtual_machine: "{{ ansible_facts['virtualization_role'] == 'guest' and ansible_facts['virtualization_type'] == 'kvm' }}"
  tags: [always]

- name: Detect if running in a container (no hwclock access)
  ansible.builtin.set_fact:
    base_is_container: "{{ ansible_facts['virtualization_type'] | default('') in ['docker', 'lxc', 'container', 'podman'] }}"
  tags: [always]

- name: Install VM-specific packages
  ansible.builtin.apt:
    name: "{{ base_vm_packages }}"
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - base_is_virtual_machine | bool
  tags: [packages, base]

- name: Enable and start qemu-guest-agent service
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when:
    - ansible_facts['os_family'] == "Debian"
    - base_is_virtual_machine | bool
  tags: [packages, base]

# Disable unattended-upgrades on VMs and containers to prevent unexpected
# updates/reboots. We manage updates via controlled Task/Ansible workflows
# instead.
- name: Check if unattended-upgrades is installed
  ansible.builtin.stat:
    path: /etc/apt/apt.conf.d/20auto-upgrades
  register: base_auto_upgrades_config
  when: (base_is_virtual_machine | bool) or (base_is_container | bool)
  tags: [config, base]

- name: Disable unattended-upgrades auto-update
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible - unattended-upgrades disabled
      // Updates are managed via Task/Ansible workflows
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
    mode: "0644"
    owner: root
    group: root
  when:
    - (base_is_virtual_machine | bool) or (base_is_container | bool)
    - base_auto_upgrades_config.stat.exists | default(false)
  tags: [config, base]

- name: Stop and disable unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  failed_when: false  # Service may not exist on all systems
  when: (base_is_virtual_machine | bool) or (base_is_container | bool)
  tags: [config, base]

# OpenIPMI ships an LSB init script that tries to load IPMI drivers at boot.
# On hosts with no BMC/IPMI hardware the load fails ("ipmi_si: Unable to find
# any System Interface(s)"), leaving the unit failed and the whole system in
# 'degraded' state on every boot. Mask it where there's no IPMI device so the
# boot stays clean. No-op where openipmi isn't installed (VMs/containers/CI) or
# where real IPMI hardware exists. The role only masks (never unmasks): if a
# host later gains a BMC, re-enable manually with `systemctl unmask
# openipmi.service` — the conditional below won't auto-revert it.
- name: Check for IPMI hardware device
  ansible.builtin.stat:
    path: /dev/ipmi0
  register: base_ipmi_device
  tags: [config, base]

- name: Check whether openipmi init script is present
  ansible.builtin.stat:
    path: /etc/init.d/openipmi
  register: base_openipmi_initscript
  tags: [config, base]

- name: Mask openipmi.service on hosts without IPMI hardware
  ansible.builtin.systemd:
    name: openipmi.service
    masked: true
  failed_when: false  # Unit may not be generated yet on first run
  when:
    - base_openipmi_initscript.stat.exists
    - not base_ipmi_device.stat.exists
  tags: [config, base]

- name: Ensure admin user exists with sudo group
  ansible.builtin.user:
    name: "{{ base_admin_user }}"
    groups: sudo
    append: true
    create_home: true
    state: present
  when: base_admin_user != 'root'
  tags: [users, security, base]

- name: Create .ssh directory for admin user
  ansible.builtin.file:
    path: "/home/{{ base_admin_user }}/.ssh"
    state: directory
    owner: "{{ base_admin_user }}"
    group: "{{ base_admin_user }}"
    mode: "0700"
  when: base_admin_user != 'root'
  tags: [ssh, users, security, base]

- name: Validate SSH keys are not empty
  ansible.builtin.assert:
    that:
      - item | trim | length > 0
      - "'ssh-' in item or 'ecdsa-' in item or 'sk-' in item"
    fail_msg: "base_ssh_authorized_keys contains an empty or malformed entry."
    quiet: true
  loop: "{{ base_ssh_authorized_keys | default([]) }}"
  when: base_ssh_authorized_keys is defined and base_ssh_authorized_keys | length > 0
  tags: [ssh, users, security, base]

- name: Deploy authorized_keys for admin user
  ansible.posix.authorized_key:
    user: "{{ base_admin_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ base_ssh_authorized_keys | default([]) }}"
  when: base_ssh_authorized_keys is defined and base_ssh_authorized_keys | length > 0
  tags: [ssh, users, security, base]

- name: Configure sudoers for admin user (passwordless sudo)
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ base_admin_user }}
    line: "{{ base_admin_user }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "{{ 'visudo -cf %s' if not (base_skip_sudoers_validation | default(false)) else omit }}"
  when: base_admin_user != 'root'
  tags: [ssh, users, security, base]

- name: Include SSH hardening tasks
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      tags: [ssh, security, base]
  when: not (base_skip_ssh_config | default(false))
  tags: [ssh, security, base]

- name: Set timezone (physical/VM - with hwclock)
  community.general.timezone:
    name: "{{ base_timezone }}"
    hwclock: UTC
  when:
    - base_timezone is defined
    - not (base_skip_timezone_config | default(false))
    - not base_is_container
  tags: [config, base]

- name: Set timezone (container - symlink only, no hwclock)
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ base_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  when:
    - base_timezone is defined
    - not (base_skip_timezone_config | default(false))
    - base_is_container
  tags: [config, base]

- name: Configure DNS servers
  ansible.builtin.include_tasks:
    file: dns.yml
    apply:
      tags: [dns, networking, base]
  when: not (base_skip_dns_config | default(false))
  tags: [dns, networking, base]

# Intel e1000e NIC workaround
# The e1000e driver has known issues causing "Hardware Unit Hang" on
# I219-LM/I219-V NICs. Disabling TSO/GSO prevents these hangs.
# See: https://www.intel.com/content/www/us/en/support/articles/000057074/

- name: Check for Intel e1000e NIC
  ansible.builtin.shell: |
    set -o pipefail
    lspci | grep -i ethernet | grep -i intel | grep -qE 'I219|I218|I217' && echo 'yes' || echo 'no'
  args:
    executable: /bin/bash
  register: base_has_intel_e1000e
  changed_when: false
  failed_when: false
  when: not base_is_virtual_machine | default(false)
  tags: [networking, base]

- name: Install ethtool for NIC configuration
  ansible.builtin.apt:
    name: ethtool
    state: present
  when:
    - not base_is_virtual_machine | default(false)
    - base_has_intel_e1000e.stdout | default('no') == 'yes'
  tags: [networking, base]

- name: Install e1000e TSO fix script
  ansible.builtin.copy:
    src: e1000e-tso-fix.sh
    dest: /usr/local/sbin/e1000e-tso-fix.sh
    mode: "0755"
    owner: root
    group: root
  when:
    - not base_is_virtual_machine | default(false)
    - base_has_intel_e1000e.stdout | default('no') == 'yes'
  notify: Restart e1000e TSO fix service
  tags: [networking, base]

- name: Create e1000e TSO fix service
  ansible.builtin.copy:
    dest: /etc/systemd/system/e1000e-tso-fix.service
    content: |
      # Managed by Ansible - Intel e1000e Hardware Unit Hang workaround
      # Disables TSO/GSO/GRO on Intel I219/I218/I217 NICs to prevent driver hangs
      [Unit]
      Description=Disable TSO/GSO/GRO on Intel e1000e NICs
      After=network-pre.target
      Before=network.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/e1000e-tso-fix.sh

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
    owner: root
    group: root
  when:
    - not base_is_virtual_machine | default(false)
    - base_has_intel_e1000e.stdout | default('no') == 'yes'
  notify: Reload systemd
  tags: [networking, base]

- name: Enable and start e1000e TSO fix service
  ansible.builtin.systemd:
    name: e1000e-tso-fix
    enabled: true
    state: started
    daemon_reload: true
  when:
    - not base_is_virtual_machine | default(false)
    - base_has_intel_e1000e.stdout | default('no') == 'yes'
  tags: [networking, base]

# NOTE: every other NIC offload workaround lives in weisssrv.infra.nic_tuning
# (declarative per-host `nic_tuning_overrides` + a live ethtool apply).
#
# One-time cleanup for hosts deployed from an older base role, which left an
# orphaned atlantic-gro-fix oneshot unit + script behind. Droppable once every
# such host has converged.
- name: Check for orphaned atlantic-gro-fix unit
  ansible.builtin.stat:
    path: /etc/systemd/system/atlantic-gro-fix.service
  register: base_atlantic_gro_orphan
  tags: [networking, base]

- name: Disable orphaned atlantic-gro-fix service
  ansible.builtin.systemd:
    name: atlantic-gro-fix.service
    enabled: false
    state: stopped
  when: base_atlantic_gro_orphan.stat.exists
  tags: [networking, base]

- name: Remove orphaned atlantic-gro-fix unit and script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/atlantic-gro-fix.service
    - /usr/local/sbin/atlantic-gro-fix.sh
  when: base_atlantic_gro_orphan.stat.exists
  notify: Reload systemd
  tags: [networking, base]

# Fail2ban - Intrusion Prevention
# Protects against brute-force attacks on SSH and other services. Whitelist the
# site's own networks via base_fail2ban_ignoreip.

- name: Include fail2ban tasks
  ansible.builtin.include_tasks:
    file: fail2ban.yml
    apply:
      tags: [security, fail2ban, base]
  when: base_fail2ban_enabled | default(true)
  tags: [security, fail2ban, base]
