---
# CRITICAL: a host that RUNS the resolver (base_is_resolver_host) has no
# 127.0.0.1 answer until the resolver roles run. Probe first: use external
# bootstrap DNS while it is silent, keep 127.0.0.1 once it answers. Writing
# external DNS unconditionally strands a healthy resolver host on it.
- name: Probe the local resolver
  ansible.builtin.command:
    cmd: dig +short +time=2 +tries=1 @127.0.0.1 {{ base_resolver_probe_name }} A
  register: base_local_resolver_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: base_is_resolver_host | bool

- name: Set DNS servers for a resolver host
  ansible.builtin.set_fact:
    base_host_dns_servers: >-
      {{ ['127.0.0.1']
         if (base_local_resolver_probe.rc | default(1) == 0
             and base_local_resolver_probe.stdout | default('') | trim | length > 0)
         else base_bootstrap_dns_servers }}
  when: base_is_resolver_host | bool

- name: Set DNS servers for all other hosts
  ansible.builtin.set_fact:
    base_host_dns_servers: "{{ base_dns_servers }}"
  when: not (base_is_resolver_host | bool)

# The immutable-flag (chattr) handling lives in the resolv_conf role.
# resolv.conf changes take effect immediately; no networking restart is needed.
- name: Configure /etc/resolv.conf with DNS servers
  ansible.builtin.include_role:
    name: weisssrv.infra.resolv_conf
    apply:
      tags: [dns, networking, base]
  vars:
    resolv_conf_immutable: true
    # resolv_conf's template consumes host_dns_servers; pass the role-local
    # value in rather than setting that name as a fact.
    host_dns_servers: "{{ base_host_dns_servers }}"
