---
# Contract test: four role invocations covering both branches of both gates.
#   1-2. tarball / deb SKIP paths — version-check reports the pinned version.
#   3.   tarball INSTALL path — get_url -> unarchive -> copy -> cleanup.
#   4.   deb INSTALL path — get_url -> apt(deb:) -> cleanup.
# Mock binaries + trivial units are pre-staged so the service half has something
# real to enable/start; the health-check uri is molecule-notest.
- name: Converge
  hosts: all
  become: true
  vars:
    _pe_tarball_version: "9.9.9"
    _pe_deb_version: "8.8.8"
    # Stale version reported by the install-path probe so needs_install=true.
    _pe_install_version: "10.0.0"
    _pe_install_tmp: /tmp/pe-install-fixture
    # Deb install-path fixture (case 4).
    _pe_deb_install_version: "7.7.7"
    _pe_deb_install_tmp: /tmp/pe-deb-install-fixture
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Create mock exporter binaries
      ansible.builtin.copy:
        dest: "{{ item }}"
        mode: "0755"
        content: |
          #!/bin/bash
          while true; do sleep 3600; done
      loop:
        - /usr/local/bin/pe-tarball-mock
        - /usr/local/bin/pe-deb-mock

    - name: Create mock exporter units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.unit }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description={{ item.unit }} mock
          [Service]
          ExecStart={{ item.bin }}
          Restart=always
          [Install]
          WantedBy=multi-user.target
      loop:
        - { unit: "pe-tarball-mock", bin: "/usr/local/bin/pe-tarball-mock" }
        - { unit: "pe-deb-mock", bin: "/usr/local/bin/pe-deb-mock" }
        - { unit: "pe-install-mock", bin: "/usr/local/bin/pe-install-mock" }

    # case 3 fixture — nested archive member, served over file://.
    - name: Stage tarball fixture build dir
      ansible.builtin.file:
        path: "{{ _pe_install_tmp }}/build/pe-install-mock-{{ _pe_install_version }}.linux-amd64"
        state: directory
        mode: "0755"

    - name: Stage the fixture binary inside the archive member dir
      ansible.builtin.copy:
        dest: "{{ _pe_install_tmp }}/build/pe-install-mock-{{ _pe_install_version }}.linux-amd64/pe-install-mock"
        mode: "0755"
        content: |
          #!/bin/bash
          if [ "$1" = "--version" ]; then echo "{{ _pe_install_version }}"; exit 0; fi
          while true; do sleep 3600; done

    - name: Pack the fixture tarball  # noqa: command-instead-of-module
      # unarchive only extracts; creating the fixture archive needs tar.
      ansible.builtin.command:
        cmd: >-
          tar -czf {{ _pe_install_tmp }}/pe-install-mock-{{ _pe_install_version }}.linux-amd64.tar.gz
          -C {{ _pe_install_tmp }}/build pe-install-mock-{{ _pe_install_version }}.linux-amd64
        creates: "{{ _pe_install_tmp }}/pe-install-mock-{{ _pe_install_version }}.linux-amd64.tar.gz"

    # case 4 fixture — minimal .deb, served over file://.
    - name: Stage deb fixture package tree
      ansible.builtin.file:
        path: "{{ _pe_deb_install_tmp }}/pkg/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - DEBIAN
        - usr/local/bin
        - etc/systemd/system

    - name: Write deb fixture control file
      ansible.builtin.copy:
        dest: "{{ _pe_deb_install_tmp }}/pkg/DEBIAN/control"
        mode: "0644"
        content: |
          Package: pe-realdeb-mock
          Version: {{ _pe_deb_install_version }}
          Architecture: all
          Maintainer: molecule <test@test.local>
          Description: prometheus_exporter deb install-path fixture

    - name: Write deb fixture binary
      ansible.builtin.copy:
        dest: "{{ _pe_deb_install_tmp }}/pkg/usr/local/bin/pe-realdeb-mock"
        mode: "0755"
        content: |
          #!/bin/bash
          while true; do sleep 3600; done

    - name: Write deb fixture unit
      ansible.builtin.copy:
        dest: "{{ _pe_deb_install_tmp }}/pkg/etc/systemd/system/pe-realdeb-mock.service"
        mode: "0644"
        content: |
          [Unit]
          Description=pe-realdeb-mock
          [Service]
          ExecStart=/usr/local/bin/pe-realdeb-mock
          Restart=always
          [Install]
          WantedBy=multi-user.target

    - name: Build the deb fixture  # noqa: command-instead-of-module
      # apt's deb: install needs a real .deb; dpkg-deb builds one from the tree.
      ansible.builtin.command:
        cmd: dpkg-deb --build {{ _pe_deb_install_tmp }}/pkg {{ _pe_deb_install_tmp }}/pe-realdeb-mock.deb
        creates: "{{ _pe_deb_install_tmp }}/pe-realdeb-mock.deb"

  tasks:
    # case 1 — tarball SKIP path
    - name: Run shared pipeline (tarball branch)
      ansible.builtin.include_role:
        name: weisssrv.infra.prometheus_exporter
      vars:
        prometheus_exporter_name: "pe-tarball-mock"
        prometheus_exporter_version: "{{ _pe_tarball_version }}"
        prometheus_exporter_artifact_type: "tarball"
        prometheus_exporter_download_url: "https://example.invalid/pe-tarball-mock-{{ _pe_tarball_version }}.linux-amd64.tar.gz"
        prometheus_exporter_checksum: ""
        prometheus_exporter_binary_path: "/usr/local/bin/pe-tarball-mock"
        prometheus_exporter_archive_member: "pe-tarball-mock-{{ _pe_tarball_version }}.linux-amd64/pe-tarball-mock"
        prometheus_exporter_version_check_cmd: "echo {{ _pe_tarball_version }}"
        prometheus_exporter_service_name: "pe-tarball-mock"
        prometheus_exporter_port: 19999

    # case 2 — deb SKIP path
    - name: Run shared pipeline (deb branch)
      ansible.builtin.include_role:
        name: weisssrv.infra.prometheus_exporter
      vars:
        prometheus_exporter_name: "pe-deb-mock"
        prometheus_exporter_version: "{{ _pe_deb_version }}"
        prometheus_exporter_artifact_type: "deb"
        prometheus_exporter_download_url: "https://example.invalid/pe-deb-mock-v{{ _pe_deb_version }}.x86_64.deb"
        prometheus_exporter_checksum: ""
        prometheus_exporter_binary_path: "/usr/local/bin/pe-deb-mock"
        prometheus_exporter_version_check_cmd: "echo {{ _pe_deb_version }}"
        prometheus_exporter_service_name: "pe-deb-mock"
        prometheus_exporter_port: 19998

    # case 3 — tarball INSTALL path
    - name: Run shared pipeline (tarball install path)
      ansible.builtin.include_role:
        name: weisssrv.infra.prometheus_exporter
      vars:
        prometheus_exporter_name: "pe-install-mock"
        prometheus_exporter_version: "{{ _pe_install_version }}"
        prometheus_exporter_artifact_type: "tarball"
        prometheus_exporter_download_url: "file://{{ _pe_install_tmp }}/pe-install-mock-{{ _pe_install_version }}.linux-amd64.tar.gz"
        prometheus_exporter_checksum: ""
        prometheus_exporter_binary_path: "/usr/local/bin/pe-install-mock"
        prometheus_exporter_archive_member: "pe-install-mock-{{ _pe_install_version }}.linux-amd64/pe-install-mock"
        # rc!=0 (binary absent) on the first converge => install; the pinned
        # version once installed => skip. Keeps the path idempotent.
        prometheus_exporter_version_check_cmd: "/usr/local/bin/pe-install-mock --version"
        prometheus_exporter_service_name: "pe-install-mock"
        prometheus_exporter_port: 19997
        # Dedicated scratch dir: the role's cleanup must not eat the fixture.
        prometheus_exporter_tmp_dir: "/tmp/pe-install-scratch"

    # case 4 — deb INSTALL path
    - name: Run shared pipeline (deb install path)
      ansible.builtin.include_role:
        name: weisssrv.infra.prometheus_exporter
      vars:
        prometheus_exporter_name: "pe-realdeb-mock"
        prometheus_exporter_version: "{{ _pe_deb_install_version }}"
        prometheus_exporter_artifact_type: "deb"
        prometheus_exporter_download_url: "file://{{ _pe_deb_install_tmp }}/pe-realdeb-mock.deb"
        prometheus_exporter_checksum: ""
        prometheus_exporter_binary_path: "/usr/local/bin/pe-realdeb-mock"
        prometheus_exporter_version_check_cmd: "dpkg-query -W -f='${Version}' pe-realdeb-mock 2>/dev/null || true"
        prometheus_exporter_service_name: "pe-realdeb-mock"
        prometheus_exporter_port: 19996
        prometheus_exporter_tmp_dir: "/tmp/pe-deb-scratch"
