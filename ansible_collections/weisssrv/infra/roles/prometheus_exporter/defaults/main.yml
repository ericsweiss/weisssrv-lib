---
# prometheus_exporter: shared install pipeline for download-based exporters.
# Callers set these via include_role vars. The sentinel values only keep the
# role parseable without a caller; a real run always overrides them.

# Logical name, used only in task titles.
prometheus_exporter_name: ""

# Upstream version the version-check command is compared against.
prometheus_exporter_version: ""

# Artifact kind: "tarball" (get_url + unarchive + copy) or "deb" (apt deb:).
prometheus_exporter_artifact_type: "tarball"

# Release artifact URL (the basename is used as the download filename).
prometheus_exporter_download_url: ""

# get_url checksum spec (e.g. "sha256:..."); empty => no checksum verification.
prometheus_exporter_checksum: ""

# Where the installed binary lands (tarball path; informational for deb).
prometheus_exporter_binary_path: ""

# tarball only: path of the binary inside the extracted archive, relative to
# prometheus_exporter_tmp_dir.
prometheus_exporter_archive_member: ""

# Shell that prints the installed upstream version on stdout. Empty stdout or
# a non-zero rc means "not installed / wrong version" => (re)install.
prometheus_exporter_version_check_cmd: ""

# systemd unit name (without .service) the role enables/starts/restarts.
prometheus_exporter_service_name: ""

# Port the health check probes on localhost.
prometheus_exporter_port: 0

# Scratch directory for downloads/extraction (root-owned 0700, created by the
# install tasks — avoids dropping release artifacts in world-readable /tmp).
prometheus_exporter_tmp_dir: /var/cache/prometheus_exporter
