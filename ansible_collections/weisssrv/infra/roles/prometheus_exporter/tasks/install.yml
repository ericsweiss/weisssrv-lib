---
# Download + install half of the shared exporter pipeline. The caller's
# version-check command decides whether anything happens; when the pinned
# version is already installed every task below is skipped (idempotent).

# Every required parameter defaults to an empty sentinel, so a caller typo
# otherwise surfaces as an empty URL or an empty unit name several tasks later.
# The failed condition in the output names the parameter.
- name: Assert the caller supplied every required prometheus_exporter parameter
  ansible.builtin.assert:
    that:
      - prometheus_exporter_name | length > 0
      - prometheus_exporter_version | length > 0
      - prometheus_exporter_download_url | length > 0
      - prometheus_exporter_version_check_cmd | length > 0
      - prometheus_exporter_service_name | length > 0
      - prometheus_exporter_binary_path | length > 0
      - prometheus_exporter_artifact_type in ['tarball', 'deb']
      - prometheus_exporter_artifact_type != 'tarball'
        or prometheus_exporter_archive_member | length > 0
    fail_msg: >-
      prometheus_exporter was included without one of its required parameters
      (the failed condition above names it). The defaults are empty sentinels
      for ansible-lint, not usable values.

- name: Check installed version of {{ prometheus_exporter_name }}
  # The caller supplies the probe (zfs_exporter reads --version off stderr;
  # unbound_exporter queries dpkg). Read-only, so it must run under --check
  # or the rc/stdout comparison below explodes on a skipped-task result.
  ansible.builtin.shell: "{{ prometheus_exporter_version_check_cmd }}"
  args:
    executable: /bin/bash
  register: prometheus_exporter_current
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine install need for {{ prometheus_exporter_name }}
  ansible.builtin.set_fact:
    # trim guards against probes that emit a trailing newline (dpkg-query).
    prometheus_exporter_needs_install: >-
      {{ prometheus_exporter_current.rc != 0
         or (prometheus_exporter_current.stdout | trim) != prometheus_exporter_version }}

- name: Ensure scratch dir for {{ prometheus_exporter_name }}
  ansible.builtin.file:
    path: "{{ prometheus_exporter_tmp_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: prometheus_exporter_needs_install

- name: Download artifact for {{ prometheus_exporter_name }}
  ansible.builtin.get_url:
    url: "{{ prometheus_exporter_download_url }}"
    dest: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_download_url | basename }}"
    mode: "0644"
    # Empty checksum omits the param entirely; both wrappers pin a sha256 in
    # all.yml, so this is just the generic fallback for a checksumless caller.
    checksum: "{{ prometheus_exporter_checksum | default(omit, true) }}"
    # get_url's 10s default expires mid-handshake against a release mirror.
    timeout: 60
  when: prometheus_exporter_needs_install
  # Release artifacts are fetched from GitHub, whose TLS handshakes/connections
  # intermittently reset from CI runners — retry before failing the play.
  register: prometheus_exporter_download
  until: prometheus_exporter_download is succeeded
  retries: 3
  delay: 5

- name: Extract tarball for {{ prometheus_exporter_name }}
  ansible.builtin.unarchive:
    src: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_download_url | basename }}"
    dest: "{{ prometheus_exporter_tmp_dir }}"
    remote_src: true
  when:
    - prometheus_exporter_needs_install
    - prometheus_exporter_artifact_type == 'tarball'

- name: Install binary for {{ prometheus_exporter_name }}
  ansible.builtin.copy:
    src: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_archive_member }}"
    dest: "{{ prometheus_exporter_binary_path }}"
    mode: "0755"
    remote_src: true
  when:
    - prometheus_exporter_needs_install
    - prometheus_exporter_artifact_type == 'tarball'
  notify: Restart prometheus exporter

- name: Install deb package for {{ prometheus_exporter_name }}
  ansible.builtin.apt:
    deb: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_download_url | basename }}"
    state: present
  when:
    - prometheus_exporter_needs_install
    - prometheus_exporter_artifact_type == 'deb'
  notify: Restart prometheus exporter

- name: Clean up downloaded files for {{ prometheus_exporter_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _prometheus_exporter_cleanup_paths }}"
  vars:
    _prometheus_exporter_archive: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_download_url | basename }}"
    # The download is always removed. A tarball also leaves the member's top
    # path component behind, a nested directory or a top-level binary, so that
    # goes too.
    _prometheus_exporter_cleanup_paths: >-
      {{ [_prometheus_exporter_archive]
         + ([prometheus_exporter_tmp_dir ~ '/' ~ (prometheus_exporter_archive_member.split('/')[0])]
            if prometheus_exporter_artifact_type == 'tarball'
            else []) }}
  when: prometheus_exporter_needs_install
