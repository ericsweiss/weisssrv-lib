---
# Standalone entrypoint for callers that template their unit before invoking
# the role. Wrapper roles instead call install.yml and service.yml via
# tasks_from:, so they can slot their own unit template in between.

- name: Run exporter install pipeline
  ansible.builtin.import_tasks: install.yml

- name: Run exporter service pipeline
  ansible.builtin.import_tasks: service.yml
