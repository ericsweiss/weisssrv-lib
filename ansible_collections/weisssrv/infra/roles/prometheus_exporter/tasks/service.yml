---
# Enable + start + health-check half of the shared exporter pipeline. Run
# after the caller has templated its unit file so a unit change is picked up.

# The health probe below is the only consumer of the port, so the service half
# asserts it. The install half must not: adguard_sync runs install only and has
# no port to health-check.
- name: Assert the caller supplied a health-check port
  ansible.builtin.assert:
    that:
      - prometheus_exporter_port | int > 0
    fail_msg: >-
      prometheus_exporter_port is required by the service half; the metrics
      health check probes localhost on that port.
    quiet: true

- name: Enable and start service {{ prometheus_exporter_service_name }}
  ansible.builtin.systemd:
    name: "{{ prometheus_exporter_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts before health check
  # Flush so the health probe sees the restarted binary. Play-global: this also
  # runs handlers queued by earlier roles in the same play.
  ansible.builtin.meta: flush_handlers

- name: Verify metrics endpoint for {{ prometheus_exporter_name }}
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_exporter_port }}/metrics"
    return_content: false
    status_code: 200
  register: prometheus_exporter_health
  retries: 5
  delay: 3
  until: prometheus_exporter_health.status == 200
  when: not ansible_check_mode
  tags:
    - molecule-notest
