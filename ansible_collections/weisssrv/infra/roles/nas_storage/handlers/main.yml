---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload NFS exports
  ansible.builtin.command: exportfs -ra
  changed_when: true
  when: not (nas_storage_skip_nfs_reload | default(false))

# Fired when the nfs-server ordering drop-in changes: daemon_reload picks it up
# and a clean restart re-establishes nfsd ordered after the encrypted-dataset
# mounts.
- name: Restart nfs-server for ordering
  ansible.builtin.systemd:
    name: nfs-server.service
    state: restarted
    daemon_reload: true
  # Bound the restart: nfsd's stop path can hang, so async/poll fails the deploy
  # loudly instead of blocking the run indefinitely.
  async: 90
  poll: 5
  when: not (nas_storage_skip_nfs_reload | default(false))

- name: Restart smbd
  ansible.builtin.service:
    name: smbd
    state: restarted

- name: Restart smartd
  ansible.builtin.service:
    name: smartd
    state: restarted
  when: not (nas_storage_skip_smartd_service | default(false))
