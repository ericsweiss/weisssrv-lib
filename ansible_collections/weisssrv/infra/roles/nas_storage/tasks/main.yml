---
# NAS storage role: ZFS, NFS, MergerFS, Samba, media-mover

- name: Include ZFS tasks
  ansible.builtin.include_tasks: zfs.yml
  when:
    - nas_storage_zfs_pools is defined
    - not (nas_storage_skip_zfs_operations | default(false))

- name: Include MergerFS tasks
  ansible.builtin.include_tasks: mergerfs.yml
  when:
    - nas_storage_mergerfs_mounts is defined
    - not (nas_storage_skip_mergerfs | default(false))

- name: Include NFS tasks
  ansible.builtin.include_tasks: nfs.yml
  when: nas_storage_exports is defined

- name: Include Samba tasks
  ansible.builtin.include_tasks: samba.yml
  when: nas_storage_samba_shares is defined

- name: Include media-mover tasks
  ansible.builtin.include_tasks: media_mover.yml
  when: nas_storage_media_mover_enabled | default(false)

- name: Include swap-clean tasks
  ansible.builtin.include_tasks: swap_clean.yml
  when: nas_storage_swap_clean_enabled | default(false)

- name: Include SMART monitoring tasks
  ansible.builtin.include_tasks: smartd.yml
  when: nas_storage_smartd_enabled | default(true)

- name: Include archive backup tasks
  when: nas_storage_archive_backup_enabled | bool
  block:
    # The rendered script rewrites the destination pool's root properties and
    # destroys its own snapshots there, so a pool nominated by accident (or an
    # empty source list producing a no-op timer) must fail before the unit ships.
    - name: Assert the archive-backup inventory is supplied
      ansible.builtin.assert:
        that:
          - nas_storage_archive_backup_pool | default('') | length > 0
          - nas_storage_archive_backup_sources | default([]) | length > 0
        fail_msg: >-
          nas_storage_archive_backup_enabled is true, so
          nas_storage_archive_backup_pool (the destination pool, whose root
          properties this role rewrites) and nas_storage_archive_backup_sources
          (the datasets to replicate) are both required.

    - name: Include archive backup tasks
      ansible.builtin.include_tasks: archive_backup.yml

# Opt-out converges instead of orphaning: see archive_backup_absent.yml.
- name: Remove a previously deployed archive backup
  ansible.builtin.include_tasks: archive_backup_absent.yml
  when: not (nas_storage_archive_backup_enabled | bool)

- name: Include /etc/pve cluster-config backup tasks
  ansible.builtin.include_tasks: pve_cluster_backup.yml
  when: nas_storage_pve_cluster_backup_enabled | default(false)

# Turning the feature off must also stand the timer down — an armed unit would
# keep archiving /etc/pve key material indefinitely.
- name: Reconcile the /etc/pve cluster-config backup away when disabled
  when: not (nas_storage_pve_cluster_backup_enabled | default(false))
  block:
    - name: Stop + disable the pve-cluster-backup timer if present
      ansible.builtin.systemd:
        name: pve-cluster-backup.timer
        enabled: false
        state: stopped
      failed_when: false
      when: not ansible_check_mode

    - name: Remove the pve-cluster-backup units and script
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/pve-cluster-backup.timer
        - /etc/systemd/system/pve-cluster-backup.service
        - /usr/local/sbin/pve-cluster-backup.sh
      notify: Reload systemd

- name: Include backup-artifact metrics tasks
  ansible.builtin.include_tasks: backup_metrics.yml
  when: nas_storage_backup_artifact_metrics_enabled | default(false)
