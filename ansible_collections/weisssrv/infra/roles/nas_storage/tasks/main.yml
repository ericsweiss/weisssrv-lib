---
# NAS storage role: ZFS, NFS, MergerFS, Samba, media-mover

# Pure inventory validation, so it runs before anything is written: every export
# bind source and every boot-ordered MergerFS union must be classified
# ZFS-backed or not. Rationale + the `zfs:` contract live in the included file.
- name: Assert every ZFS-backed source is classified
  ansible.builtin.include_tasks: assert_zfs_classification.yml

# The cap is a modprobe.d/sysfs concern on any ZFS host, so it runs whether or
# not pool properties are declared or the pool work is skipped.
- name: Cap the ZFS ARC
  ansible.builtin.include_tasks: zfs_arc.yml
  when: nas_storage_zfs_arc_max_bytes | default('') | string | length > 0

- name: Include ZFS tasks
  ansible.builtin.include_tasks: zfs.yml
  when:
    - nas_storage_zfs_pools is defined
    - not (nas_storage_skip_zfs_operations | default(false))

- name: Include MergerFS tasks
  ansible.builtin.include_tasks: mergerfs.yml
  when:
    - nas_storage_mergerfs_mounts is defined
    - not (nas_storage_skip_mergerfs | default(false))

- name: Include NFS tasks
  ansible.builtin.include_tasks: nfs.yml
  when: nas_storage_exports is defined

- name: Include Samba tasks
  ansible.builtin.include_tasks: samba.yml
  when: nas_storage_samba_shares is defined

- name: Include media-mover tasks
  ansible.builtin.include_tasks: media_mover.yml
  when: nas_storage_media_mover_enabled | default(false)

- name: Remove a previously deployed media mover
  ansible.builtin.include_tasks: deprovision_units.yml
  vars:
    nas_storage_deprovision_timers: [media-mover.timer]
    nas_storage_deprovision_static_services: [media-mover.service]
    nas_storage_deprovision_paths:
      - /usr/local/sbin/media-mover.sh
    nas_storage_deprovision_metrics:
      - "{{ nas_storage_backup_artifact_metrics_dir }}/media_mover.prom"
  when: not (nas_storage_media_mover_enabled | default(false))

- name: Include swap-clean tasks
  when: nas_storage_swap_clean_enabled
  block:
    - name: Assert the swap-clean stop-guest list is well formed
      ansible.builtin.include_tasks: assert_swap_clean_guests.yml

    - name: Deploy the swap-clean units
      ansible.builtin.include_tasks: swap_clean.yml

- name: Remove a previously deployed swap-clean
  ansible.builtin.include_tasks: deprovision_units.yml
  vars:
    nas_storage_deprovision_timers: [swap-clean.timer]
    nas_storage_deprovision_static_services: [swap-clean.service]
    nas_storage_deprovision_paths:
      - /usr/local/sbin/swap-clean.sh
    nas_storage_deprovision_metrics:
      - "{{ nas_storage_backup_artifact_metrics_dir }}/swap_clean.prom"
  when: not nas_storage_swap_clean_enabled

- name: Include SMART monitoring tasks
  ansible.builtin.include_tasks: smartd.yml
  when: nas_storage_smartd_enabled

- name: Include archive backup tasks
  when: nas_storage_archive_backup_enabled | bool
  block:
    # The rendered script rewrites the destination pool's root properties and
    # destroys its own snapshots there, so a pool nominated by accident (or an
    # empty source list producing a no-op timer) must fail before the unit ships.
    - name: Assert the archive-backup inventory is supplied
      ansible.builtin.assert:
        that:
          - nas_storage_archive_backup_pool | default('') | length > 0
          - nas_storage_archive_backup_sources | default([]) | length > 0
        fail_msg: >-
          nas_storage_archive_backup_enabled is true, so
          nas_storage_archive_backup_pool (the destination pool, whose root
          properties this role rewrites) and nas_storage_archive_backup_sources
          (the datasets to replicate) are both required.

    - name: Assert the archive exclusion list is well formed
      ansible.builtin.include_tasks: assert_archive_exclude.yml

    - name: Include archive backup tasks
      ansible.builtin.include_tasks: archive_backup.yml

# Opt-out converges instead of orphaning: see deprovision_units.yml.
- name: Remove a previously deployed archive backup
  ansible.builtin.include_tasks: deprovision_units.yml
  vars:
    nas_storage_deprovision_timers: [archive-backup.timer]
    nas_storage_deprovision_static_services: [archive-backup.service]
    nas_storage_deprovision_paths:
      - /usr/local/sbin/archive-backupctl
    nas_storage_deprovision_metrics:
      - "{{ nas_storage_backup_artifact_metrics_dir }}/archive_backup.prom"
      - "{{ nas_storage_backup_artifact_metrics_dir }}/.archive_prune_failed"
  when: not (nas_storage_archive_backup_enabled | bool)

- name: Include /etc/pve cluster-config backup tasks
  ansible.builtin.include_tasks: pve_cluster_backup.yml
  when: nas_storage_pve_cluster_backup_enabled | default(false)

# An armed timer would keep archiving /etc/pve key material indefinitely.
- name: Remove a previously deployed /etc/pve cluster-config backup
  ansible.builtin.include_tasks: deprovision_units.yml
  vars:
    nas_storage_deprovision_timers: [pve-cluster-backup.timer]
    nas_storage_deprovision_static_services: [pve-cluster-backup.service]
    nas_storage_deprovision_paths:
      - /usr/local/sbin/pve-cluster-backup.sh
      - "{{ nas_storage_pve_cluster_backup_lib_path }}"
    nas_storage_deprovision_metrics:
      - "{{ nas_storage_backup_artifact_metrics_dir }}/pve_cluster_backup.prom"
  when: not (nas_storage_pve_cluster_backup_enabled | default(false))

- name: Include backup-artifact metrics tasks
  ansible.builtin.include_tasks: backup_metrics.yml
  when: nas_storage_backup_artifact_metrics_enabled | default(false)

- name: Remove a previously deployed backup-artifact collector
  ansible.builtin.include_tasks: deprovision_units.yml
  vars:
    nas_storage_deprovision_timers: [backup-artifact-mtime-collector.timer]
    nas_storage_deprovision_static_services: [backup-artifact-mtime-collector.service]
    nas_storage_deprovision_paths:
      - /usr/local/sbin/backup-artifact-mtime-collector.sh
    nas_storage_deprovision_metrics:
      - "{{ nas_storage_backup_artifact_metrics_dir }}/backup_artifact_mtime.prom"
  when: not (nas_storage_backup_artifact_metrics_enabled | default(false))

# The boot-time remount unit outlives the unions it remounts, so a host that
# drops MergerFS keeps a oneshot mounting fstab entries the role no longer owns.
- name: Remove a previously deployed MergerFS remount unit
  ansible.builtin.include_tasks: deprovision_units.yml
  vars:
    nas_storage_deprovision_services: [mergerfs-remount.service]
  when: nas_storage_mergerfs_mounts | default([]) | length == 0
