---
# Decision step over the busy-mount probes: may the remount cycle proceed, and
# which NFS exports must it unexport first? Split out of mergerfs.yml for the
# same reason as mergerfs_needs_remount.yml — the unexport/unmount path around
# it is only reachable on a live fileserver, this part is pure derivation.
#
# The gate is deliberately GLOBAL: one busy union blocks the whole cycle,
# because the unexport/unmount tasks it guards loop over every union.

- name: Check if safe remount is possible
  ansible.builtin.set_fact:
    nas_storage_mergerfs_safe_to_remount: >-
      {{ nas_storage_mergerfs_needs_remount | default(false)
         and (nas_storage_mergerfs_nfs_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length == 0)
         and (nas_storage_mergerfs_process_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length == 0) }}

# The exports that actually sit on a MergerFS target, as `<client spec>:<path>`
# — the argument form `exportfs -u` takes. Everything else on this server (k3s
# PVs, backup landing zones) must keep serving through the remount, so the
# unexport is scoped to these and never `exportfs -u -a`.
- name: Identify the MergerFS-backed NFS export bindings
  ansible.builtin.set_fact:
    nas_storage_mergerfs_export_bindings: >-
      {{ nas_storage_exports | default([])
         | selectattr('bind_source', 'defined')
         | selectattr('bind_source', 'in', nas_storage_mergerfs_mounts | map(attribute='target') | list)
         | list | subelements('clients') | list }}
