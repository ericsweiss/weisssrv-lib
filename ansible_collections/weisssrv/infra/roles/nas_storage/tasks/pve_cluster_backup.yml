---
# Nightly /etc/pve archive. vzdump captures guests, not pmxcfs: users/ACLs/API
# tokens (user.cfg), corosync.conf and priv/ (cluster CA + node certs + authkey)
# are otherwise backed up nowhere, so a total-cluster loss means rebuilding the
# PVE cluster identity from scratch. The archive lands in the offsite-eligible
# landing zone and rides the archive replication out with everything else.

- name: Deploy the /etc/pve cluster-config backup script
  ansible.builtin.template:
    src: pve-cluster-backup.sh.j2
    dest: /usr/local/sbin/pve-cluster-backup.sh
    owner: root
    group: root
    mode: "0755"

# Same fail-closed guard nfs.yml applies to every bind source: creating the
# landing dir on an UNMOUNTED dataset would put it on the root filesystem, where
# nothing replicates it and the real dataset would later shadow it.
- name: Verify the backups dataset is mounted before creating the landing dir
  ansible.builtin.command: "mountpoint -q {{ nas_storage_backup_apps_base | dirname }}"
  register: nas_storage_pve_cluster_backups_mounted
  changed_when: false
  check_mode: false
  failed_when:
    - nas_storage_pve_cluster_backups_mounted.rc != 0
    - not (nas_storage_skip_zfs_operations | default(false))

# root:root 0700, NOT the squash owner the NFS-exported per-app dirs use: the
# archive contains /etc/pve/priv (cluster CA private key, node certs, authkey).
# This app is written locally by root and deliberately has no NFS export.
- name: Create the pve-cluster landing directory (root-only — holds key material)
  ansible.builtin.file:
    path: "{{ nas_storage_backup_apps_base }}/pve-cluster"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: >-
    nas_storage_pve_cluster_backups_mounted.rc == 0
    or (nas_storage_skip_zfs_operations | default(false))

- name: Create the pve-cluster-backup systemd service
  ansible.builtin.template:
    src: pve-cluster-backup.service.j2
    dest: /etc/systemd/system/pve-cluster-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Create the pve-cluster-backup systemd timer
  ansible.builtin.template:
    src: pve-cluster-backup.timer.j2
    dest: /etc/systemd/system/pve-cluster-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable the pve-cluster-backup timer
  ansible.builtin.systemd:
    name: pve-cluster-backup.timer
    enabled: true
    state: started
    daemon_reload: true
