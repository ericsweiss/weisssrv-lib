---
- name: Ensure the shared media group exists
  ansible.builtin.include_tasks: media_group.yml

- name: Install NFS server packages
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Remove the site-named NFSv4 delegation sysctl drop-in
  ansible.builtin.file:
    path: /etc/sysctl.d/99-z-weisssrv-nas-storage-nfs-leases.conf
    state: absent

# Delegation kill-switch. A sysctl.d drop-in rather than a live-only sysctl, so
# the value survives a reboot.
- name: Deploy sysctl drop-in disabling NFSv4 delegations
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-z-nas-storage-nfs-leases.conf
    content: |
      # Managed by Ansible (nas_storage). fs.leases-enable=0 stops nfsd granting
      # NEW NFSv4 delegations; existing ones persist until returned or reboot.
      # Trade-off: nas_storage README.
      fs.leases-enable=0
    owner: root
    group: root
    mode: "0644"
  when: nas_storage_nfs_disable_delegations | bool

# Reconcile the LIVE value on every enabled run: another sysctl pass can flip
# leases back on while the drop-in sits unchanged, and a handler never fires.
- name: Read live fs.leases-enable
  ansible.builtin.command: sysctl -n fs.leases-enable
  register: nas_storage_leases_live
  changed_when: false
  when:
    - nas_storage_nfs_disable_delegations | bool
    - nas_storage_nfs_apply_delegation_sysctl_live | bool

- name: Apply the delegation kill-switch when the live value drifts
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-z-nas-storage-nfs-leases.conf
  when:
    - nas_storage_nfs_disable_delegations | bool
    - nas_storage_nfs_apply_delegation_sysctl_live | bool
    - (nas_storage_leases_live.stdout | trim) != '0'
  changed_when: true

# Removing the drop-in does not force leases back on live: the kernel default
# (1) returns at the next reboot, mirroring nic_tuning's ip_forward pattern.
- name: Remove NFSv4 delegation sysctl drop-in when not requested
  ansible.builtin.file:
    path: /etc/sysctl.d/99-z-nas-storage-nfs-leases.conf
    state: absent
  when: not (nas_storage_nfs_disable_delegations | bool)

- name: Create export root directory
  ansible.builtin.file:
    path: "{{ nas_storage_export_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create bind mount directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ nas_storage_exports }}"
  loop_control:
    label: "{{ item.path }}"

# ZFS-backed bind sources must be mounted datasets first, or an unmounted pool's
# bare mountpoint is captured and served empty. bind_source_check aims the guard
# at the parent dataset when bind_source is a subdirectory.
- name: Verify ZFS-backed bind sources are mounted datasets
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ item.bind_source_check | default(item.bind_source) }}"]
  loop: "{{ nas_storage_exports }}"
  loop_control:
    label: "{{ item.bind_source_check | default(item.bind_source) | default('N/A') }}"
  register: nas_storage_nfs_bind_source_mounted
  changed_when: false
  check_mode: false
  # Fail closed on an unmounted ZFS source. The bypass is nas_storage_skip_zfs_operations
  # (test containers have no real ZFS mounts), never nas_storage_skip_nfs_reload:
  # skipping the reload must not disable the guard.
  failed_when:
    - nas_storage_nfs_bind_source_mounted.rc != 0
    - not (nas_storage_skip_zfs_operations | default(false))
  when:
    - item.bind_source is defined
    # An explicit `zfs:` on the export WINS over the derived classification —
    # it is the declaration the up-front assert accepts, in both directions.
    - item.zfs | default(item.bind_source is match(nas_storage_zfs_bind_source_pattern)) | bool

# A MergerFS target is no ZFS mount root, so the guard above skips it. Its own
# two arms: the union must be mounted, and every branch under a ZFS mount root
# must be too - a union mounted over empty branch stubs exports nothing.
- name: Verify MergerFS-backed bind sources are mounted unions
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ item }}"]
  loop: "{{ nas_storage_exports | selectattr('bind_source', 'defined')
            | map(attribute='bind_source')
            | select('in', nas_storage_mergerfs_mounts | default([]) | map(attribute='target') | list)
            | unique | list }}"
  register: nas_storage_nfs_mergerfs_source_mounted
  changed_when: false
  check_mode: false
  failed_when:
    - nas_storage_nfs_mergerfs_source_mounted.rc != 0
    - not (nas_storage_skip_zfs_operations | default(false))

# findmnt --target, not mountpoint -q: a branch may legitimately be a
# subdirectory of a dataset. What must not happen is a branch resolving to the
# root filesystem, which is the unmounted-pool stub.
- name: Verify the ZFS-backed branches of the exported MergerFS unions are on a mounted dataset
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --first-only, --target, "{{ item }}", -o, TARGET]
  loop: "{{ nas_storage_mergerfs_mounts | default([])
            | selectattr('target', 'in', nas_storage_exports | selectattr('bind_source', 'defined')
              | map(attribute='bind_source') | list)
            | map(attribute='sources') | flatten | unique
            | select('match', nas_storage_zfs_bind_source_pattern) | list }}"
  register: nas_storage_nfs_mergerfs_branch_mounted
  changed_when: false
  check_mode: false
  failed_when:
    - nas_storage_nfs_mergerfs_branch_mounted.rc != 0
      or (nas_storage_nfs_mergerfs_branch_mounted.stdout | trim) in ['', '/']
    - not (nas_storage_skip_zfs_operations | default(false))

- name: Set ownership on bind source directories
  ansible.builtin.file:
    path: "{{ item.bind_source }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ nas_storage_exports }}"
  loop_control:
    label: "{{ item.bind_source | default('N/A') }}"
  when: item.bind_source is defined

# A nested ZFS dataset auto-created under the appdata base mounts over the stub
# below and shadows it under the non-recursive bind. Remedy: canmount=off on
# that dataset.
- name: Guard against a per-app appdata path being a shadowing mountpoint
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ nas_storage_appdata_base }}/{{ item }}"]
  loop: "{{ nas_storage_appdata_dirs | default([]) }}"
  loop_control:
    label: "{{ nas_storage_appdata_base }}/{{ item }}"
  register: nas_storage_nfs_appdata_mountpoint
  changed_when: false
  check_mode: false
  failed_when:
    - nas_storage_nfs_appdata_mountpoint.rc == 0
    - not (nas_storage_skip_zfs_operations | default(false))
  when:
    - nas_storage_appdata_dirs | default([]) | length > 0
    - nas_storage_appdata_base in (nas_storage_exports | selectattr('bind_source', 'defined')
        | map(attribute='bind_source') | list)

# Per-app subdirs must exist and be owned by the export's squash uid/gid before
# an app's first write. Runs after the mounted-dataset guard, so a locked pool
# is never mkdir'd onto.
- name: Create per-app appdata subdirectories
  ansible.builtin.file:
    path: "{{ nas_storage_appdata_base }}/{{ item }}"
    state: directory
    owner: "{{ nas_storage_appdata_owner }}"
    group: "{{ nas_storage_appdata_group }}"
    mode: "{{ nas_storage_appdata_mode }}"
  loop: "{{ nas_storage_appdata_dirs | default([]) }}"
  loop_control:
    label: "{{ nas_storage_appdata_base }}/{{ item }}"
  when:
    - nas_storage_appdata_dirs | default([]) | length > 0
    - nas_storage_appdata_base in (nas_storage_exports | selectattr('bind_source', 'defined')
        | map(attribute='bind_source') | list)

# CRITICAL: `state: mounted` does not compare a bind's live source, so a bind
# can serve the wrong tree while looking converged and client mount RPCs hang.
# Detect by device:inode identity and lazy-detach every stacked layer, so the
# remount below re-points it.
- name: Detach export binds serving a stale source
  ansible.builtin.shell: |
    set -euo pipefail
    path={{ item.path | quote }}
    src={{ item.bind_source | quote }}
    mounted() {
      # findmnt: rc 0 mounted, rc 1 with no output = not a mountpoint (the
      # one tolerable failure); anything else means detection itself broke,
      # and reporting "ok" then would certify a stale bind as sound.
      set +e
      out="$(findmnt --mountpoint "$path" 2>&1 >/dev/null)"
      rc=$?
      set -e
      if [ "$rc" -ne 0 ] && { [ "$rc" -ne 1 ] || [ -n "$out" ]; }; then
        echo "findmnt failed (rc=$rc): $out" >&2
        exit 1
      fi
      return "$rc"
    }
    identity() { stat -c '%d:%i' -- "$1" 2>/dev/null || echo "unreadable-$1"; }
    detached=0
    # Bounded: findmnt matches every STACKED mount at the target and umount -l
    # pops one layer per call, so a single detach can leave a stale layer
    # beneath — loop until the endpoint is healthy, absent, or the bound hits.
    for _ in 1 2 3 4 5; do
      mounted || break
      [ "$(identity "$path")" = "$(identity "$src")" ] && break
      umount -l "$path"
      detached=1
    done
    if mounted && [ "$(identity "$path")" != "$(identity "$src")" ]; then
      echo "ERROR: $path still serves a source other than $src after detach attempts" >&2
      exit 1
    fi
    if [ "$detached" -eq 1 ]; then
      echo "detached stale source"
    else
      echo "ok"
    fi
  args:
    executable: /bin/bash
  register: nas_storage_nfs_stale_bind
  changed_when: "'detached stale source' in nas_storage_nfs_stale_bind.stdout"
  notify: Reload NFS exports
  loop: "{{ nas_storage_exports }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.bind_source is defined

- name: Configure bind mounts in fstab
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.bind_source }}"
    fstype: none
    # ZFS-backed binds order on a ZFS mount unit or they race the mounts at boot
    # and capture an empty mountpoint; nofail keeps boot unblocked. Encrypted
    # sources anchor on zfs-mount-encrypted, which runs after keys load.
    opts: >-
      {{
        'bind,nofail,x-systemd.requires=' ~ _zfs_anchor
        ~ ',x-systemd.after=' ~ _zfs_anchor
        ~ ',x-systemd.requires-mounts-for=' ~ item.bind_source
        if (item.zfs | default(item.bind_source is match(nas_storage_zfs_bind_source_pattern)) | bool)
        else 'bind'
      }}
    state: mounted
  loop: "{{ nas_storage_exports }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    _zfs_anchor: >-
      {{ 'zfs-mount-encrypted.service'
         if item.bind_source in (nas_storage_encrypted_bind_sources | default([]))
         else 'zfs-mount.service' }}
  when: item.bind_source is defined

- name: Deploy NFS exports configuration
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports

# Ordering drop-in: nfsd must not export the encrypted datasets before they are
# unlocked and mounted. Rationale in the template itself.
- name: Ensure nfs-server drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nfs-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy nfs-server ordering drop-in (gate nfsd on encrypted-dataset mounts)
  ansible.builtin.template:
    src: nfs-server-zfs.conf.j2
    dest: /etc/systemd/system/nfs-server.service.d/zfs-encrypted.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nfs-server for ordering

# Flush before starting or probing nfsd, or a stopped nfsd starts once with the
# OLD unit config and the readiness probe checks the pre-restart listener.
# flush_handlers ignores `when`; the handlers themselves carry the skip gate.
- name: Flush pending NFS handlers before starting/probing NFS
  ansible.builtin.meta: flush_handlers

- name: Ensure NFS server is enabled and running
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true
  when: not (nas_storage_skip_nfs_reload | default(false))

# nfs-server.service is Type=oneshot, so its unit state does not prove nfsd is
# serving; the TCP listener on 2049 does. Fails the play loudly when nfsd is not
# accepting connections.
- name: Verify nfsd is serving on TCP 2049
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 2049
    state: started
    timeout: 30
  changed_when: false
  when: not (nas_storage_skip_nfs_reload | default(false))
