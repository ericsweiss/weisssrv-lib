---
# MergerFS unions for tiered storage. Mount-time-only options are invisible once
# mounted, so fstab is authoritative and any option change needs a full remount
# cycle. Sequence and idle gate: the role README.

- name: Install MergerFS
  ansible.builtin.apt:
    name:
      - mergerfs
      # psmisc ships fuser, which the idle probe needs before a remount.
      - psmisc
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Derive the fstab options for each MergerFS union
  ansible.builtin.include_tasks: mergerfs_opts.yml

- name: Configure MergerFS mounts in fstab
  ansible.posix.mount:
    path: "{{ item.target }}"
    src: "{{ item.sources | join(':') }}"
    fstype: fuse.mergerfs
    opts: "{{ nas_storage_mergerfs_fstab_opts[item.name] }}"
    state: mounted
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_fstab_changed

- name: Verify MergerFS mount status and fstab options
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT={{ item.target | quote }}
    CONTROL_FILE="${MOUNTPOINT}/.mergerfs"

    if ! mountpoint -q "$MOUNTPOINT" 2>/dev/null; then
      echo "STATUS: NOT_MOUNTED"
      exit 1
    fi

    if [ ! -e "$CONTROL_FILE" ]; then
      echo "STATUS: NOT_MERGERFS - mount exists but no .mergerfs control file"
      exit 1
    fi

    fstab_opts=$(grep "^[^#].*[[:space:]]{{ item.target }}[[:space:]]" /etc/fstab | awk '{print $4}')
    if [ -z "$fstab_opts" ]; then
      echo "STATUS: NO_FSTAB_ENTRY"
      exit 1
    fi

    echo "FSTAB_OPTS: $fstab_opts"

    required_opts="{{ (nas_storage_mergerfs_required_opts | default(item.options | default([]), true)) | join(' ') }}"
    missing_opts=""
    for opt in $required_opts; do
      if ! echo "$fstab_opts" | grep -qF -- "$opt"; then
        missing_opts="${missing_opts}${opt} "
      fi
    done

    if [ -n "$missing_opts" ]; then
      echo "STATUS: FSTAB_MISSING_OPTIONS - $missing_opts"
      exit 1
    fi

    echo "STATUS: OK - MergerFS mounted with correct fstab options"
    exit 0
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_status_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Determine if MergerFS remount is needed
  ansible.builtin.include_tasks: mergerfs_needs_remount.yml
  when: not ansible_check_mode

- name: Display MergerFS status
  ansible.builtin.debug:
    msg: |
      MergerFS mount: {{ item.item.name }}
      Status: {{ item.stdout | default('unknown') }}
      Needs remount: {{ nas_storage_mergerfs_needs_remount | default(false) }}
  loop: "{{ nas_storage_mergerfs_status_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - not ansible_check_mode
    - item.stdout is defined

- name: Check for active NFS clients on MergerFS-backed exports
  ansible.builtin.script: "mergerfs-bind-probe.sh check {{ item.target | quote }}"
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_nfs_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_needs_remount | default(false)

- name: Check for processes using MergerFS mount
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT={{ item.target | quote }}

    # Without fuser the probe cannot tell "nothing holds it" from "I could not
    # look"; a missing binary would read as an idle union and unmount it.
    command -v fuser >/dev/null 2>&1 || {
      echo "NO_FUSER: cannot determine whether $MOUNTPOINT is in use"
      exit 3
    }

    if fuser -m "$MOUNTPOINT" 2>/dev/null | grep -q .; then
      echo "IN_USE:"
      fuser -vm "$MOUNTPOINT" 2>&1 | head -20
      exit 1
    fi

    echo "IDLE"
    exit 0
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_process_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_needs_remount | default(false)
    - nas_storage_mergerfs_nfs_check.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list | length > 0

- name: Display warning - MergerFS remount blocked
  ansible.builtin.debug:
    msg: |
      WARNING: MergerFS mount {{ item.item.name }} needs remount to apply fstab options,
      but cannot proceed safely.

      {% if nas_storage_mergerfs_nfs_check.results is defined %}
      {% for nfs in nas_storage_mergerfs_nfs_check.results %}
      {% if nfs.rc is defined and nfs.rc != 0 %}
      NFS Status: {{ nfs.stdout | default('Active clients detected') }}
      {% endif %}
      {% endfor %}
      {% endif %}

      {% if nas_storage_mergerfs_process_check.results is defined %}
      {% for proc in nas_storage_mergerfs_process_check.results %}
      {% if proc.rc is defined and proc.rc != 0 %}
      Process Status: {{ proc.stdout | default('Processes using mount') }}
      {% endif %}
      {% endfor %}
      {% endif %}

      To apply correct options:
      1. Stop all NFS clients and services using the mount
      2. Re-run this role
      -- OR --
      Reboot the system (fstab has correct options, will apply on boot)
      -- OR --
      Manual remount (per MergerFS-backed export <client>:<path>):
        exportfs -u <client>:<export path>
        umount <export path>
        umount {{ item.target }}
        mount {{ item.target }}
        mount <export path>
        exportfs -a
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_needs_remount | default(false)
    - (nas_storage_mergerfs_nfs_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0)
      or (nas_storage_mergerfs_process_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0)

- name: Decide whether the remount cycle may proceed, and what it must unexport
  ansible.builtin.include_tasks: mergerfs_remount_gate.yml
  when: not ansible_check_mode

# The exports this cycle unbinds and rebinds: those whose bind_source is a
# MergerFS union target.
- name: Identify the MergerFS-backed bind mount paths
  ansible.builtin.set_fact:
    nas_storage_mergerfs_bind_paths: >-
      {{ nas_storage_exports | default([])
         | selectattr('bind_source', 'defined')
         | selectattr('bind_source', 'in', nas_storage_mergerfs_mounts | map(attribute='target') | list)
         | map(attribute='path')
         | list }}
  when: not ansible_check_mode

# One cycle: unexport, unbind, remount the union, rebind. `always:` remounts the
# union and the binds and re-exports, so a failure mid-cycle never leaves the
# exports pointing at empty mountpoints.
- name: Run the MergerFS remount cycle
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_safe_to_remount | default(false)
  block:
    - name: Temporarily unexport the MergerFS-backed NFS paths
      ansible.builtin.command:
        argv:
          - exportfs
          - -u
          - "{{ item.1.spec }}:{{ item.0.path }}"
      loop: "{{ nas_storage_mergerfs_export_bindings | default([]) }}"
      loop_control:
        label: "{{ item.1.spec }}:{{ item.0.path }}"
      register: nas_storage_nfs_unexport
      changed_when: true

    - name: Unmount the MergerFS-backed bind mounts
      ansible.posix.mount:
        path: "{{ item }}"
        state: unmounted
      loop: "{{ nas_storage_mergerfs_bind_paths | default([]) }}"
      loop_control:
        label: "{{ item }}"

    # Any remaining mount of the union keeps it busy and would fail the unmount
    # below with no explanation. Matched by mount device id, so an undeclared
    # bind is named instead of silently blocking the cycle.
    - name: Assert no undeclared mount still holds a MergerFS union
      ansible.builtin.script: "mergerfs-bind-probe.sh list {{ item.target | quote }}"
      loop: "{{ nas_storage_mergerfs_mounts }}"
      loop_control:
        label: "{{ item.name }}"
      register: nas_storage_mergerfs_leftover_binds
      changed_when: false
      failed_when: >-
        nas_storage_mergerfs_leftover_binds.rc != 0
        or (nas_storage_mergerfs_leftover_binds.stdout | trim | length > 0)

    - name: Unmount MergerFS
      ansible.posix.mount:
        path: "{{ item.target }}"
        state: unmounted
      loop: "{{ nas_storage_mergerfs_mounts }}"
      loop_control:
        label: "{{ item.name }}"

  always:
    # In `always:` and ungated: `state: mounted` is idempotent, so a failure
    # anywhere in the cycle still restores the union and the binds instead of
    # re-exporting empty mountpoints.
    - name: Mount MergerFS with fstab options
      ansible.posix.mount:
        path: "{{ item.target }}"
        state: mounted
      loop: "{{ nas_storage_mergerfs_mounts }}"
      loop_control:
        label: "{{ item.name }}"
      register: nas_storage_mergerfs_mount

    - name: Remount bind mounts for NFS exports
      ansible.posix.mount:
        path: "{{ item }}"
        state: mounted
      loop: "{{ nas_storage_mergerfs_bind_paths | default([]) }}"
      loop_control:
        label: "{{ item }}"

    # -a re-exports everything in /etc/exports; the untouched exports are
    # already active, so this only restores the ones unexported above.
    - name: Re-export NFS paths
      ansible.builtin.command: exportfs -a
      when:
        - nas_storage_nfs_unexport is defined
        - nas_storage_nfs_unexport.changed | default(false)
      register: nas_storage_nfs_reexport
      changed_when: nas_storage_nfs_reexport.rc == 0

# Fails the run rather than reporting a cycle that left the union stale: the
# mount must be live, carry the required fstab options, and every bind must be
# back on the same device as its union.
- name: Verify MergerFS mount after remount cycle
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT={{ item.target | quote }}
    CONTROL_FILE="${MOUNTPOINT}/.mergerfs"

    if ! mountpoint -q "$MOUNTPOINT"; then
      echo "FAILED: Not mounted"
      exit 1
    fi

    if [ ! -e "$CONTROL_FILE" ]; then
      echo "FAILED: No .mergerfs control file"
      exit 1
    fi

    fstab_opts=$(grep "^[^#].*[[:space:]]{{ item.target }}[[:space:]]" /etc/fstab | awk '{print $4}')
    required_opts="{{ (nas_storage_mergerfs_required_opts | default(item.options | default([]), true)) | join(' ') }}"
    missing_opts=""
    for opt in $required_opts; do
      if ! echo "$fstab_opts" | grep -qF -- "$opt"; then
        missing_opts="${missing_opts}${opt} "
      fi
    done
    if [ -n "$missing_opts" ]; then
      echo "FAILED: fstab is missing options ($missing_opts): $fstab_opts"
      exit 1
    fi

    union_dev=$(findmnt --noheadings --first-only -o MAJ:MIN --mountpoint "$MOUNTPOINT")
    binds=({{ nas_storage_exports | default([]) | selectattr('bind_source', 'defined')
              | selectattr('bind_source', 'equalto', item.target)
              | map(attribute='path') | map('quote') | join(' ') }})
    for bind in "${binds[@]}"; do
      bind_dev=$(findmnt --noheadings --first-only -o MAJ:MIN --mountpoint "$bind" 2>/dev/null || true)
      if [ "$bind_dev" != "$union_dev" ]; then
        echo "FAILED: export bind $bind is not on ${MOUNTPOINT} after the cycle (${bind_dev:-unmounted})"
        exit 1
      fi
    done

    echo "SUCCESS: MergerFS mounted, fstab has correct options"
    echo "FSTAB: $fstab_opts"
    exit 0
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_final_verify
  changed_when: false
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_mount is defined
    - nas_storage_mergerfs_mount.changed | default(false)

- name: Report final MergerFS status
  ansible.builtin.debug:
    msg: "{{ item.stdout }}"
  loop: "{{ nas_storage_mergerfs_final_verify.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - item.stdout is defined

- name: Deploy MergerFS remount service
  ansible.builtin.template:
    src: mergerfs-remount.service.j2
    dest: /etc/systemd/system/mergerfs-remount.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable MergerFS remount service
  ansible.builtin.systemd:
    name: mergerfs-remount.service
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
