---
# MergerFS configuration for tiered storage.
#
# MergerFS options are NOT verifiable at runtime (FUSE exposes only generic
# options; inodecalc/noforget/use_ino/cache.files are invisible once mounted),
# so fstab is the authoritative source: correct fstab + a live mount means the
# options are applied, and any option change needs a full remount cycle. See
# the role README for the remount sequence.

- name: Install MergerFS
  ansible.builtin.apt:
    name: mergerfs
    state: present
  when: ansible_facts['os_family'] == "Debian"

# Boot ordering: the branch dirs are (deliberately plaintext) ZFS datasets
# with no .mount units — zfs-mount-generator is not enabled here (see the
# nfs.yml bind-mount comment) — so requires-mounts-for alone orders against
# nothing and the mergerfs mount can race the ZFS mounts and capture empty
# branch stubs. Anchor explicitly on the bulk zfs-mount.service like the
# ZFS-backed export binds do (nofail keeps a missing branch from blocking
# boot); requires-mounts-for is kept as documentation of the branch set.
- name: Configure MergerFS mounts in fstab
  ansible.posix.mount:
    path: "{{ item.target }}"
    src: "{{ item.sources | join(':') }}"
    fstype: fuse.mergerfs
    opts: >-
      {{ item.options | join(',') }},fsname={{ item.name }}{%- if item.systemd_requires is defined -%}
      ,nofail,x-systemd.requires=zfs-mount.service,x-systemd.after=zfs-mount.service{%- for req in item.systemd_requires -%}
      ,x-systemd.requires-mounts-for={{ req }}{%- endfor -%}
      {% endif -%}
    state: mounted
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_fstab_changed

- name: Verify MergerFS mount status and fstab options
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"
    CONTROL_FILE="${MOUNTPOINT}/.mergerfs"

    if ! mountpoint -q "$MOUNTPOINT" 2>/dev/null; then
      echo "STATUS: NOT_MOUNTED"
      exit 1
    fi

    if [ ! -e "$CONTROL_FILE" ]; then
      echo "STATUS: NOT_MERGERFS - mount exists but no .mergerfs control file"
      exit 1
    fi

    fstab_opts=$(grep "^[^#].*[[:space:]]{{ item.target }}[[:space:]]" /etc/fstab | awk '{print $4}')
    if [ -z "$fstab_opts" ]; then
      echo "STATUS: NO_FSTAB_ENTRY"
      exit 1
    fi

    echo "FSTAB_OPTS: $fstab_opts"

    missing_opts=""
    if ! echo "$fstab_opts" | grep -q "inodecalc=path-hash"; then
      missing_opts="${missing_opts}inodecalc=path-hash "
    fi
    if ! echo "$fstab_opts" | grep -q "noforget"; then
      missing_opts="${missing_opts}noforget "
    fi

    if [ -n "$missing_opts" ]; then
      echo "STATUS: FSTAB_MISSING_OPTIONS - $missing_opts"
      exit 1
    fi

    # Runtime options are not verifiable, so a correct fstab plus a live mount
    # is taken as proof they are applied.
    echo "STATUS: OK - MergerFS mounted with correct fstab options"
    exit 0
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_status_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Determine if MergerFS remount is needed
  ansible.builtin.set_fact:
    nas_storage_mergerfs_needs_remount: >-
      {{ (nas_storage_mergerfs_fstab_changed.results | selectattr('changed', 'equalto', true) | list | length > 0)
         or (nas_storage_mergerfs_status_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0) }}
  when: not ansible_check_mode

- name: Display MergerFS status
  ansible.builtin.debug:
    msg: |
      MergerFS mount: {{ item.item.name }}
      Status: {{ item.stdout | default('unknown') }}
      Needs remount: {{ nas_storage_mergerfs_needs_remount | default(false) }}
  loop: "{{ nas_storage_mergerfs_status_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - not ansible_check_mode
    - item.stdout is defined

- name: Check for active NFS clients on MergerFS-backed exports
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"

    bind_exports=$(findmnt --list --noheadings -o TARGET | grep "^/export" | while read exp; do
      src=$(findmnt --noheadings -o SOURCE "$exp" 2>/dev/null)
      if [ "$src" = "$MOUNTPOINT" ]; then
        echo "$exp"
      fi
    done)

    if [ -z "$bind_exports" ]; then
      echo "NO_NFS_BIND_EXPORTS"
      exit 0
    fi

    echo "BIND_EXPORTS: $bind_exports"

    nfs_connections=$(ss -tn state established '( sport = :2049 )' 2>/dev/null | grep -v "^State" | head -5)
    if [ -n "$nfs_connections" ]; then
      echo "ACTIVE_NFS_CLIENTS:"
      echo "$nfs_connections"
      exit 1
    fi

    echo "NFS_IDLE"
    exit 0
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_nfs_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_needs_remount | default(false)

- name: Check for processes using MergerFS mount
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"

    if fuser -m "$MOUNTPOINT" 2>/dev/null | grep -q .; then
      echo "IN_USE:"
      fuser -vm "$MOUNTPOINT" 2>&1 | head -20
      exit 1
    fi

    echo "IDLE"
    exit 0
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_process_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_needs_remount | default(false)
    - nas_storage_mergerfs_nfs_check.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list | length > 0

- name: Display warning - MergerFS remount blocked
  ansible.builtin.debug:
    msg: |
      WARNING: MergerFS mount {{ item.item.name }} needs remount to apply fstab options,
      but cannot proceed safely.

      {% if nas_storage_mergerfs_nfs_check.results is defined %}
      {% for nfs in nas_storage_mergerfs_nfs_check.results %}
      {% if nfs.rc is defined and nfs.rc != 0 %}
      NFS Status: {{ nfs.stdout | default('Active clients detected') }}
      {% endif %}
      {% endfor %}
      {% endif %}

      {% if nas_storage_mergerfs_process_check.results is defined %}
      {% for proc in nas_storage_mergerfs_process_check.results %}
      {% if proc.rc is defined and proc.rc != 0 %}
      Process Status: {{ proc.stdout | default('Processes using mount') }}
      {% endif %}
      {% endfor %}
      {% endif %}

      To apply correct options:
      1. Stop all NFS clients and services using the mount
      2. Re-run this role
      -- OR --
      Reboot the system (fstab has correct options, will apply on boot)
      -- OR --
      Manual remount (per MergerFS-backed export <client>:<path>):
        exportfs -u <client>:<export path>
        umount <export path>
        umount {{ item.target }}
        mount {{ item.target }}
        mount <export path>
        exportfs -a
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_needs_remount | default(false)
    - (nas_storage_mergerfs_nfs_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0)
      or (nas_storage_mergerfs_process_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0)

- name: Check if safe remount is possible
  ansible.builtin.set_fact:
    nas_storage_mergerfs_safe_to_remount: >-
      {{ nas_storage_mergerfs_needs_remount | default(false)
         and (nas_storage_mergerfs_nfs_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length == 0)
         and (nas_storage_mergerfs_process_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length == 0) }}
  when: not ansible_check_mode

# The exports that actually sit on a MergerFS target, as `<client spec>:<path>`
# — the argument form `exportfs -u` takes. Everything else on this server (k3s
# PVs, backup landing zones) must keep serving through the remount, so the
# unexport is scoped to these and never `exportfs -u -a`.
- name: Identify the MergerFS-backed NFS export bindings
  ansible.builtin.set_fact:
    nas_storage_mergerfs_export_bindings: >-
      {{ nas_storage_exports | default([])
         | selectattr('bind_source', 'defined')
         | selectattr('bind_source', 'in', nas_storage_mergerfs_mounts | map(attribute='target') | list)
         | list | subelements('clients') | list }}
  when: not ansible_check_mode

- name: Temporarily unexport the MergerFS-backed NFS paths
  ansible.builtin.command:
    argv:
      - exportfs
      - -u
      - "{{ item.1.spec }}:{{ item.0.path }}"
  loop: "{{ nas_storage_mergerfs_export_bindings | default([]) }}"
  loop_control:
    label: "{{ item.1.spec }}:{{ item.0.path }}"
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_safe_to_remount | default(false)
  register: nas_storage_nfs_unexport
  changed_when: true

- name: Identify and unmount bind mounts sourced from MergerFS
  # findmnt-driven rather than inventory-driven: any bind still sourced from the
  # target would keep it busy and fail the unmount below, including one the
  # inventory does not declare.
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"

    findmnt --list --noheadings -o TARGET,SOURCE -t none | while read target source; do
      if [ "$source" = "$MOUNTPOINT" ]; then
        echo "Unmounting: $target (bind from $source)"
        umount "$target" || echo "Warning: failed to unmount $target"
      fi
    done
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_safe_to_remount | default(false)
  # Part of one remount cycle whose change is reported by the mount tasks below;
  # a per-item result is not addressable in changed_when on ansible-core 2.19+.
  changed_when: false

# Gate on nas_storage_mergerfs_safe_to_remount: with zero bind mounts sourcing
# from the target there is nothing to unbind, but the remount must still proceed
# or new fstab options are silently never applied.
- name: Unmount MergerFS
  ansible.posix.mount:
    path: "{{ item.target }}"
    state: unmounted
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_safe_to_remount | default(false)
  register: nas_storage_mergerfs_unmount

- name: Mount MergerFS with fstab options
  ansible.posix.mount:
    path: "{{ item.target }}"
    state: mounted
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_unmount is defined
    - nas_storage_mergerfs_unmount.changed | default(false)
  register: nas_storage_mergerfs_mount

- name: Identify bind mounts to remount
  ansible.builtin.set_fact:
    nas_storage_mergerfs_bind_paths: >-
      {{ nas_storage_exports | default([])
         | selectattr('bind_source', 'defined')
         | selectattr('bind_source', 'in', nas_storage_mergerfs_mounts | map(attribute='target') | list)
         | map(attribute='path')
         | list }}
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_mount is defined
    - nas_storage_mergerfs_mount.changed | default(false)

- name: Remount bind mounts for NFS exports
  ansible.posix.mount:
    path: "{{ item }}"
    state: mounted
  loop: "{{ nas_storage_mergerfs_bind_paths | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_mount is defined
    - nas_storage_mergerfs_mount.changed | default(false)
    - nas_storage_mergerfs_bind_paths | default([]) | length > 0
  register: nas_storage_bind_remount

# -a re-exports everything in /etc/exports; the untouched exports are already
# active, so this only restores the ones unexported above.
- name: Re-export NFS paths
  ansible.builtin.command: exportfs -a
  when:
    - not ansible_check_mode
    - nas_storage_nfs_unexport is defined
    - nas_storage_nfs_unexport.changed | default(false)
  register: nas_storage_nfs_reexport
  changed_when: nas_storage_nfs_reexport.rc == 0

- name: Verify MergerFS mount after remount cycle
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"
    CONTROL_FILE="${MOUNTPOINT}/.mergerfs"

    if ! mountpoint -q "$MOUNTPOINT"; then
      echo "FAILED: Not mounted"
      exit 1
    fi

    if [ ! -e "$CONTROL_FILE" ]; then
      echo "FAILED: No .mergerfs control file"
      exit 1
    fi

    # Verify fstab has correct options
    fstab_opts=$(grep "^[^#].*[[:space:]]{{ item.target }}[[:space:]]" /etc/fstab | awk '{print $4}')
    if echo "$fstab_opts" | grep -q "inodecalc=path-hash" && echo "$fstab_opts" | grep -q "noforget"; then
      echo "SUCCESS: MergerFS mounted, fstab has correct options"
      echo "FSTAB: $fstab_opts"
      exit 0
    else
      echo "WARNING: Fstab options may be incomplete: $fstab_opts"
      exit 1
    fi
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: nas_storage_mergerfs_final_verify
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - nas_storage_mergerfs_mount is defined
    - nas_storage_mergerfs_mount.changed | default(false)

- name: Report final MergerFS status
  ansible.builtin.debug:
    msg: "{{ item.stdout }}"
  loop: "{{ nas_storage_mergerfs_final_verify.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - item.stdout is defined

- name: Deploy MergerFS remount service
  ansible.builtin.template:
    src: mergerfs-remount.service.j2
    dest: /etc/systemd/system/mergerfs-remount.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable MergerFS remount service
  ansible.builtin.systemd:
    name: mergerfs-remount.service
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
