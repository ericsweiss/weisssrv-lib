---
# Derives the fstab option string of every union, keyed by union name. Split
# out of mergerfs.yml so it is testable without FUSE. Boot anchoring and the
# ZFS classification rules are in the README.

- name: Reset the derived MergerFS fstab options
  ansible.builtin.set_fact:
    nas_storage_mergerfs_fstab_opts: {}

- name: Derive the fstab options for each MergerFS union
  ansible.builtin.set_fact:
    nas_storage_mergerfs_fstab_opts: >-
      {{ nas_storage_mergerfs_fstab_opts | combine({item.name: _mergerfs_opts}) }}
  loop: "{{ nas_storage_mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    # Derived from the branch set, overridden by an explicit boolean `zfs:`. A
    # branch EQUAL to a mount root does not count — the pattern matches paths
    # INSIDE a root — so such a union needs `zfs: true`.
    _zfs_backed_branches: >-
      {{ item.zfs | default(item.sources
         | select('match', nas_storage_zfs_bind_source_pattern) | list | length > 0) }}
    _mergerfs_opts: >-
      {{ item.options | join(',') }},fsname={{ item.name }}{%- if _zfs_backed_branches | bool -%}
      ,nofail,x-systemd.requires=zfs-mount.service,x-systemd.after=zfs-mount.service{%- elif item.systemd_requires is defined -%}
      ,nofail{%- endif -%}
      {%- for req in item.systemd_requires | default([]) -%}
      ,x-systemd.requires-mounts-for={{ req }}{%- endfor -%}
