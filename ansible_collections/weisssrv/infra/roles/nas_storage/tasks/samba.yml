---
- name: Install Samba packages
  ansible.builtin.apt:
    name:
      - samba
      - samba-common-bin
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure the shared media group exists
  ansible.builtin.include_tasks: media_group.yml

- name: Ensure nas user exists
  ansible.builtin.user:
    name: nas
    comment: "Samba NAS user"
    groups: "{{ nas_storage_media_group }}"
    append: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

# smbd must be configured and running BEFORE the password probe below: the probe
# authenticates against the live smbd, so a down smbd would skip the first
# deploy's reset and make the next run report changed.
- name: Deploy Samba configuration
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: "testparm -s %s"
  notify: Restart smbd

- name: Ensure Samba services are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  # nmbd exits immediately under `disable netbios = yes`, so managing it there
  # flaps the service state on every run.
  loop: "{{ ['smbd'] if nas_storage_samba_disable_netbios else ['smbd', 'nmbd'] }}"

- name: Ensure nmbd is stopped and disabled when NetBIOS is off
  ansible.builtin.service:
    name: nmbd
    state: stopped
    enabled: false
  when: nas_storage_samba_disable_netbios
  failed_when: false  # the unit may not exist on minimal installs

# The secret never appears in argv: smbpasswd reads it on stdin, smbclient from
# PASSWD in the environment. The probe resets the stored password only on a
# confirmed auth failure, so a transport error never clobbers it.
- name: Check whether the current Samba password already works
  ansible.builtin.shell: |
    set -uo pipefail
    # Exit codes: 0 auth ok | 1 auth failure (reset) | 2 smbd unreachable (skip)
    for _ in 1 2 3; do
      if out=$(smbclient -L localhost -U nas 2>&1); then
        exit 0
      fi
      if printf '%s\n' "$out" | grep -qiE 'NT_STATUS_LOGON_FAILURE|NT_STATUS_ACCESS_DENIED'; then
        exit 1
      fi
      sleep 3
    done
    exit 2
  args:
    executable: /bin/bash
  environment:
    PASSWD: "{{ nas_storage_samba_password }}"
  register: nas_storage_samba_password_check
  changed_when: false
  failed_when: false
  no_log: true
  check_mode: false
  when: nas_storage_samba_password | length > 0

- name: Warn when the Samba password could not be verified (smbd unreachable)
  ansible.builtin.debug:
    msg: >-
      smbd was unreachable after retries; leaving the stored Samba password
      unchanged this run. If this is a first deploy, re-run once smbd is up.
  when:
    - nas_storage_samba_password | length > 0
    - nas_storage_samba_password_check.rc | default(2) == 2

- name: Set Samba password for nas user
  ansible.builtin.command:
    cmd: smbpasswd -a -s nas
    stdin: "{{ pw }}\n{{ pw }}"
  vars:
    pw: "{{ nas_storage_samba_password }}"
  when:
    - nas_storage_samba_password | length > 0
    - nas_storage_samba_password_check.rc | default(2) == 1
  no_log: true
  changed_when: true

# An empty nas_storage_samba_password skips the whole block above, leaving a
# first-deploy account with no password. A warning, not an assert: the account
# fails closed until the password is set.
- name: Warn when the Samba password is empty (unmanaged this run)
  ansible.builtin.debug:
    msg: >-
      nas_storage_samba_password is empty (default: the SAMBA_NAS_PASSWORD
      environment variable) — the Samba password was neither verified nor set
      this run. Supply it from the site's secret store; until then a
      first-deploy account has no password.
  when: nas_storage_samba_password | length == 0
