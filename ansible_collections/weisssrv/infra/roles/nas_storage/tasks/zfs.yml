---
# ZFS dataset configuration and scrub timers

# Pools can be legitimately absent at deploy time — the archive pool's
# documented steady state is exported/unplugged. Probe each pool once and
# skip its datasets/scrub timer when it is not imported, rather than
# hard-failing the whole storage deploy on a `zfs list` miss.
- name: Probe imported ZFS pools
  ansible.builtin.command: zpool list -H -o name
  register: nas_storage_zfs_imported_pools
  changed_when: false
  check_mode: false

# Only `zfs set`s on a mismatch, so `changed` means something actually changed.
# Datasets in a non-imported pool are skipped, not failed. `set -e` goes AFTER
# the existence probe so a failing `zfs set` (or a bad property name) fails the
# task instead of falling through; failed_when must check rc explicitly because
# setting it replaces Ansible's default rc!=0 handling.
#
# Property values in nas_storage_zfs_pools[].properties MUST be written in the
# HUMAN-READABLE form `zfs get -H -o value` prints (the comparison runs without
# -p, so recordsize is '1M', not 1048576). Any other form never compares equal,
# so the task would `zfs set` and report changed every run, masking real drift.
- name: Verify ZFS datasets exist and set properties
  ansible.builtin.shell: |
    if ! zfs list {{ item.1.name | quote }} >/dev/null 2>&1; then
      echo "DATASET_MISSING"
      exit 0
    fi
    set -e
    changed=0
    {% for prop, value in item.1.properties.items() %}
    current=$(zfs get -H -o value {{ prop | quote }} {{ item.1.name | quote }} 2>/dev/null)
    if [ "$current" != {{ value | quote }} ]; then
      zfs set {{ prop | quote }}={{ value | quote }} {{ item.1.name | quote }}
      changed=1
    fi
    {% endfor %}
    if [ "$changed" -eq 1 ]; then echo "CHANGED"; else echo "OK"; fi
  loop: "{{ nas_storage_zfs_pools | subelements('datasets') }}"
  loop_control:
    label: "{{ item.1.name }}"
  register: nas_storage_zfs_result
  changed_when: "'CHANGED' in nas_storage_zfs_result.stdout"
  # The pool is imported (the when: gate guarantees it), so a missing dataset
  # here is a real misconfiguration, not the exported-archive steady state —
  # surface it. Datasets in an un-imported pool are skipped by the when: gate.
  failed_when: "nas_storage_zfs_result.rc != 0 or 'DATASET_MISSING' in nas_storage_zfs_result.stdout"
  when: item.0.name in nas_storage_zfs_imported_pools.stdout_lines

# The zfs-scrub-<schedule>@.timer template units are shipped by
# zfsutils-linux and exist for any imported pool, so enabling/starting them
# is expected to succeed. We deliberately do NOT blanket-swallow with
# failed_when: false — that masked a misspelled nas_storage_zfs_scrub_schedule (which
# builds a non-existent unit name) and let scrubs silently never run on the
# multi-TB raidz pools. The imported-pool when: gate already covers the
# exported/absent-pool steady state; any remaining failure here (e.g. a bad
# schedule -> "Unit ... not found") is a real misconfiguration and must
# surface.
- name: Enable ZFS scrub timer
  ansible.builtin.systemd:
    name: "zfs-scrub-{{ nas_storage_zfs_scrub_schedule | default('monthly') }}@{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ nas_storage_zfs_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - nas_storage_zfs_scrub_enabled | default(true)
    - item.name in nas_storage_zfs_imported_pools.stdout_lines

- name: Ensure zfs-auto-snapshot is installed
  ansible.builtin.apt:
    name: zfs-auto-snapshot
    state: present
  when: ansible_facts['os_family'] == "Debian"

# Cap the ZFS ARC via a module parameter when nas_storage_zfs_arc_max_bytes is set. Baked
# into the initramfs (Update initramfs handler) so it applies at early boot,
# before the data pools import and the ARC grows to the ~half-RAM default and
# swap-thrashes the pinned guests on this memory-over-committed host. Empty
# default -> the file is not managed (no cap enforced, nothing removed).
- name: Cap ZFS ARC via modprobe.d
  ansible.builtin.template:
    src: zfs-modprobe.conf.j2
    dest: /etc/modprobe.d/zfs.conf
    owner: root
    group: root
    mode: "0644"
  when: nas_storage_zfs_arc_max_bytes | default('') | string | length > 0
  notify: Update initramfs

# The modprobe.d file + initramfs rebuild above only take effect at the next
# boot. Apply the cap to the running kernel too so a changed nas_storage_zfs_arc_max_bytes
# is live immediately (compare-then-set, matching the property task above).
# Guarded on the sysfs param existing — the molecule container has no ZFS
# module, so the file is absent there.
- name: Check for running ZFS ARC parameter
  ansible.builtin.stat:
    path: /sys/module/zfs/parameters/zfs_arc_max
  register: nas_storage_zfs_arc_max_param
  when: nas_storage_zfs_arc_max_bytes | default('') | string | length > 0

- name: Apply ZFS ARC cap to the running kernel
  ansible.builtin.shell: |
    current=$(cat /sys/module/zfs/parameters/zfs_arc_max)
    if [ "$current" != {{ nas_storage_zfs_arc_max_bytes | quote }} ]; then
      echo {{ nas_storage_zfs_arc_max_bytes | quote }} > /sys/module/zfs/parameters/zfs_arc_max
      echo "CHANGED"
    else
      echo "OK"
    fi
  register: nas_storage_zfs_arc_runtime
  changed_when: "'CHANGED' in nas_storage_zfs_arc_runtime.stdout"
  # No check_mode:false — this task writes /sys, so a dry-run (task infra:check)
  # must skip it rather than mutate the running kernel on the live NAS.
  when:
    - nas_storage_zfs_arc_max_bytes | default('') | string | length > 0
    - nas_storage_zfs_arc_max_param.stat.exists | default(false)
