---
# A byte count is handed to weisssrv.infra.zfs_arc_cap, which owns the whole
# implementation; empty leaves ARC at the ZFS default and manages nothing.
# Aliased to the inventory-wide `zfs_arc_max_bytes`; set this directly to
# decouple.
nas_storage_zfs_arc_max_bytes: "{{ zfs_arc_max_bytes | default('') }}"
# Passed through as zfs_arc_cap_skip_initramfs: the modprobe.d file still
# renders, only the update-initramfs rebuild is suppressed. For molecule and
# check-mode runs, where there is no real /boot kernel.
nas_storage_zfs_arc_skip_initramfs: false

# Media-mover load-shaping. The mover shares the nightly window with backups,
# scrub and smartd, so it is deliberately deferential: nice/ionice set absolute
# priority, and the cgroup-v2 weights (below the 100 default) only bite under
# contention. bwlimit is an optional hard rsync cap (empty = unlimited).
nas_storage_media_mover_min_age: 12h
nas_storage_media_mover_schedule: "*-*-* 06:00:00"
nas_storage_media_mover_nice: 10
nas_storage_media_mover_io_class: best-effort
nas_storage_media_mover_io_priority: 7
nas_storage_media_mover_cpu_weight: 20
nas_storage_media_mover_io_weight: 20
nas_storage_media_mover_bwlimit: ""

# Single source of truth for the gid the NFS exports squash to, the Samba
# `force group` and the appdata ownership. Reference values: the gid must match
# what the site's clients already use, or every squashed write lands wrong.
nas_storage_media_group: media
nas_storage_media_gid: 2000

# Per-app appdata subdirs under the appdata NFS export. The export squashes all
# client writes to nas_storage_appdata_owner:group, so each dir must be owned by
# that pair. Apps on their own block device do NOT belong here. Path/uid/gid are
# reference values, not a contract.
nas_storage_appdata_base: /mnt/ssd/appdata
nas_storage_appdata_owner: 1000
nas_storage_appdata_group: "{{ nas_storage_media_gid }}"
nas_storage_appdata_mode: "0775"
# CONSTRAINT: no database-dump directories here — they belong on the
# offsite-eligible landing zone below. This export carries live config only.
nas_storage_appdata_dirs: []

# Offsite-eligible logical-dump landing zone: apps on a raw block device land a
# dump under <base>/<app> so it rides the archive file walk (a file walk cannot
# see inside a live zvol). Give each app its own per-app NFS export in
# nas_storage_exports for cross-app isolation; the subdirs come from the generic
# bind_source handling, so no subdir list is needed here.
nas_storage_backup_apps_base: /mnt/tank/backups/apps

# RUNTIME mounted-dataset guard for nas_storage_backup_apps_base: an unmounted
# dataset leaves a plain directory that a writer would shadow-write and the
# collector would read as fresh, keeping both alert arms green. Never set false
# on a real NAS.
nas_storage_backup_require_mounted_dataset: "{{ not (nas_storage_skip_zfs_operations | default(false)) }}"

# NAS-side backup-artifact collector: an independent freshness+size signal, since
# an app's own wrapper metrics go green even when the dump never REACHED the
# landing zone. Entries are mappings because `pattern` is MANDATORY — a
# newest-file-of-any-name collector lets a nightly sidecar hold freshness green.
# Patterns are shell globs matched against the BASENAME; keep them tight enough
# to exclude sidecars and partial-backup variants. Optional `companions` globs
# cover files required to RESTORE the dump but not the dump itself.
nas_storage_backup_artifact_metrics_enabled: true
nas_storage_backup_artifact_apps: []

# Nightly ZFS replication to a detachable archive pool. OFF by default: the
# control script rewrites pool-root properties and destroys snapshots on
# nas_storage_archive_backup_pool, so it must never run against a pool a site
# did not nominate.
nas_storage_archive_backup_enabled: false
# Destination pool. Its root properties are rewritten by the script.
nas_storage_archive_backup_pool: ""
# Replicated recursively, each landing at <pool>/<basename>. Every ROOT entry
# must be a filesystem, not a zvol.
nas_storage_archive_backup_sources: []
# The one dataset receiving cluster-wide vzdump writes, snapshotted only once
# writes under its mountpoint have quiesced. Empty disables the guard.
nas_storage_archive_backup_vzdump_target: ""
# Per-dataset retention on the destination pool: the newest N snapshots, plus
# the newest of each of the last M calendar months.
nas_storage_archive_backup_keep_recent: 3
nas_storage_archive_backup_keep_monthly: 6
# The in-script quiesce guard defers the vzdump target if the overnight backup
# window overruns this.
nas_storage_archive_backup_schedule: "*-*-* 06:30:00"
nas_storage_archive_backup_random_delay: "10m"

# Nightly tar of /etc/pve into the landing zone: vzdump captures GUESTS, not
# pmxcfs, so the cluster identity is otherwise backed up nowhere. Opt-in, and
# only meaningful on a PVE member that also holds the landing zone. The archive
# carries private key material, so it and its directory are root-only.
nas_storage_pve_cluster_backup_enabled: false
nas_storage_pve_cluster_backup_src: /etc/pve
# RUNTIME mounted-SOURCE guard. /etc/pve is a FUSE mount; with pve-cluster down
# it is an empty directory that tars into a valid backup of nothing, which
# retention then retires the real archives behind. Never false on a real PVE host.
nas_storage_pve_cluster_backup_require_src_mount: "{{ not (nas_storage_skip_zfs_operations | default(false)) }}"
# CONTENT guard, paths relative to _src: a degraded pmxcfs still tars into a
# readable archive, so framing checks alone cannot tell it from an archive of
# nothing. The archive is refused unless every file here is in it. Shorten only
# for a deployment that genuinely lacks one (a standalone node has no
# corosync.conf).
nas_storage_pve_cluster_backup_required_files:
  - user.cfg
  - corosync.conf
  - pve-root-ca.pem
  - priv/pve-root-ca.key
  - authkey.pub
  - priv/authkey.key
nas_storage_pve_cluster_backup_schedule: "*-*-* 02:15:00"
nas_storage_pve_cluster_backup_random_delay: 300
nas_storage_pve_cluster_backup_keep: 14
nas_storage_pve_cluster_backup_nice: 10

# SMART monitoring groups. Each entry: {name, disks[], schedule, ata?}. schedule
# is smartd's -s regex, staggered so the groups do not thrash together; ata:
# false drops the ATA-only -o/-S flags, which log warnings on NVMe. The default
# reproduces the four legacy pool-named lists; a different pool layout sets this
# list directly.
nas_storage_smartd_tank_disks: []
nas_storage_smartd_ssd_disks: []
nas_storage_smartd_nvme_disks: []
nas_storage_smartd_archive_disks: []
nas_storage_smartd_disk_groups:
  - name: tank
    disks: "{{ nas_storage_smartd_tank_disks }}"
    schedule: "(S/../.././02|L/../08/./03)"
  - name: ssd
    disks: "{{ nas_storage_smartd_ssd_disks }}"
    schedule: "(S/../.././02|L/../09/./03)"
  - name: nvme
    disks: "{{ nas_storage_smartd_nvme_disks }}"
    schedule: "(S/../.././02|L/../10/./03)"
    ata: false
  - name: archive
    disks: "{{ nas_storage_smartd_archive_disks }}"
    schedule: "(S/../.././02|L/../11/./03)"

# Skip enabling/starting smartd (a container has no SMART-capable devices).
nas_storage_skip_smartd_service: false

# Samba password for the `nas` account; set it directly to use another backend.
# Never reaches argv. Empty leaves it unmanaged (a warning, not a failure).
nas_storage_samba_password: "{{ lookup('ansible.builtin.env', 'SAMBA_NAS_PASSWORD', default='') }}"

# Samba listener scope. smbd otherwise also binds 139, which nothing in an
# SMB3-only deployment uses and only the firewall closes.
nas_storage_samba_ports: "445"
nas_storage_samba_disable_netbios: true

# ZFS mount roots — site data. A bind_source under one of these is treated as
# ZFS-backed (mounted-dataset guard + zfs-mount boot ordering); anything else is
# a plain bind with neither, so a different pool layout MUST set this or both
# protections silently do nothing. A per-entry `zfs: true|false` overrides the
# classification (README).
nas_storage_zfs_mount_roots:
  - /mnt/tank
  - /mnt/ssd
  - /mnt/nvme
# Derived from the roots; matches paths INSIDE a root, not the root itself. An
# EMPTY roots list must yield a NEVER-matching pattern — `^()/` is an empty
# alternation that matches every absolute path and would invert the guard.
nas_storage_zfs_bind_source_pattern: >-
  {{ ('^(' ~ (nas_storage_zfs_mount_roots | map('regex_escape') | join('|')) ~ ')/')
     if (nas_storage_zfs_mount_roots | length > 0) else '^(?!)' }}

# Nightly swap reset. Every knob is declared here rather than left as a template
# fallback — this mechanism gracefully stops production guests.
nas_storage_swap_clean_enabled: false
nas_storage_swap_clean_schedule: "*-*-* 07:00:00"
nas_storage_swap_clean_random_delay: 1800
# Ordered "vmid:name:timeout" escalation candidates.
nas_storage_swap_clean_stop_guests: []
# min_mb: reclaim below this is not worth a run. margin_mb: free-RAM headroom
# required before swapoff. arc_shrink_mb: how far the ARC is squeezed for it.
nas_storage_swap_clean_min_mb: 512
nas_storage_swap_clean_margin_mb: 2048
nas_storage_swap_clean_arc_shrink_mb: 2048
nas_storage_swap_clean_service_timeout: 1200
nas_storage_swap_clean_nice: 10

nas_storage_smartd_enabled: true
nas_storage_zfs_scrub_enabled: true
nas_storage_zfs_scrub_schedule: monthly

# Where every metric-writing wrapper in this role drops its .prom file.
nas_storage_backup_artifact_metrics_dir: >-
  {{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}

# MergerFS fstab options the health probe requires. Empty derives them per union
# from its own `options`; a non-empty list overrides that for EVERY union.
nas_storage_mergerfs_required_opts: []

# Component gates, declared so a typo cannot silently disable one.
nas_storage_skip_zfs_operations: false  # pool/dataset/property work (needs real ZFS)
nas_storage_skip_mergerfs: false        # mergerfs mount management
nas_storage_skip_nfs_reload: false      # exportfs reload after an exports change
