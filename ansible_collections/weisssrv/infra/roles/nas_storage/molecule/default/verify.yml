---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if NFS server is installed
      ansible.builtin.package:
        name: nfs-kernel-server
        state: present
      check_mode: true
      register: nfs_installed
      failed_when: nfs_installed.changed

    - name: Check if exports file exists
      ansible.builtin.stat:
        path: /etc/exports
      register: exports_file
      failed_when: not exports_file.stat.exists

    - name: Verify NFSv4 delegation kill-switch drop-in landed with the exact sysctl
      ansible.builtin.command: grep -qx "fs.leases-enable=0" /etc/sysctl.d/99-z-nas-storage-nfs-leases.conf
      register: leases_dropin
      changed_when: false
      failed_when: leases_dropin.rc != 0

    - name: Stat the site-named NFSv4 delegation drop-in the role now removes
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-z-weisssrv-nas-storage-nfs-leases.conf
      register: leases_legacy_dropin
      failed_when: leases_legacy_dropin.stat.exists

    - name: Verify exports file contains expected exports
      ansible.builtin.command: grep -q "/tank/media/unified" /etc/exports
      register: exports_check
      failed_when: exports_check.rc != 0
      changed_when: false

    # exports.j2 xprtsec precedence: a per-client value overrides the
    # export-level one, including opting one client out of TLS. Client lines are
    # backslash-continued, so each client spec greps as one line.

    - name: Assert plaintext export has no xprtsec on its client line
      ansible.builtin.command: >-
        grep -F '192.0.2.0/24(ro,sync,no_subtree_check)' /etc/exports
      register: plain_grep
      changed_when: false
      failed_when: plain_grep.rc != 0 or 'xprtsec' in plain_grep.stdout

    - name: Assert export-level xprtsec=tls reaches the first client line
      ansible.builtin.command: >-
        grep -F '/tank/appdata/tls 192.0.2.200/29(rw,sync,no_subtree_check,fsid=91,xprtsec=tls)' /etc/exports
      register: tls_first
      changed_when: false
      failed_when: tls_first.rc != 0

    - name: Assert export-level xprtsec=tls reaches the continued client line
      ansible.builtin.command: >-
        grep -F '192.0.2.220/29(rw,sync,no_subtree_check,fsid=91,xprtsec=tls)' /etc/exports
      register: tls_cont
      changed_when: false
      failed_when: tls_cont.rc != 0

    - name: Assert mixed export requires TLS (xprtsec=tls) on the opted-in k3s client
      ansible.builtin.command: >-
        grep -F '/tank/media/mixed 192.0.2.200/29(rw,sync,no_subtree_check,fsid=92,xprtsec=tls)' /etc/exports
      register: mixed_tls
      changed_when: false
      failed_when: mixed_tls.rc != 0

    - name: Assert mixed export leaves the .154 client plaintext (no xprtsec)
      ansible.builtin.command: >-
        grep -F '192.0.2.154/32(ro,sync,no_subtree_check,fsid=92)' /etc/exports
      register: mixed_plain
      changed_when: false
      # rc 0 = the exact plaintext spec is present; if xprtsec had leaked onto
      # the .154 line the option string would differ and this grep would miss.
      failed_when: mixed_plain.rc != 0 or 'xprtsec' in mixed_plain.stdout

    # _zfs_anchor selection (nfs.yml): an encrypted bind source must order on
    # the LATE zfs-mount-encrypted.service, a plaintext one on the early
    # zfs-mount.service; the wrong anchor captures an empty mountpoint.
    - name: Read the /export/appdata bind fstab entry (encrypted source)
      ansible.builtin.command: >-
        grep -E '^/mnt/ssd/appdata[[:space:]]+/export/appdata[[:space:]]' /etc/fstab
      register: enc_bind_line
      changed_when: false
      failed_when: >-
        enc_bind_line.rc != 0
        or 'x-systemd.requires=zfs-mount-encrypted.service' not in enc_bind_line.stdout
        or 'x-systemd.after=zfs-mount-encrypted.service' not in enc_bind_line.stdout
        or 'nofail' not in enc_bind_line.stdout

    - name: Read the /export/share bind fstab entry (plaintext source)
      ansible.builtin.command: >-
        grep -E '^/mnt/tank/share[[:space:]]+/export/share[[:space:]]' /etc/fstab
      register: plain_bind_line
      changed_when: false
      failed_when: >-
        plain_bind_line.rc != 0
        or 'x-systemd.requires=zfs-mount.service' not in plain_bind_line.stdout
        or 'zfs-mount-encrypted' in plain_bind_line.stdout

    # An explicit `zfs:` on the export OVERRIDES the mount-root derivation, in
    # both directions. Definedness alone must not silence the classification
    # assert while the guard and the anchor still key off the pattern.
    - name: Read the /export/declared-plain bind fstab entry (zfs false, outside the roots)
      ansible.builtin.command: >-
        grep -E '^/srv/plainbind[[:space:]]+/export/declared-plain[[:space:]]' /etc/fstab
      register: declared_plain_line
      changed_when: false
      failed_when: >-
        declared_plain_line.rc != 0
        or 'zfs-mount' in declared_plain_line.stdout

    - name: Read the /export/declared-zfs bind fstab entry (zfs true, outside the roots)
      ansible.builtin.command: >-
        grep -E '^/srv/pool2/data[[:space:]]+/export/declared-zfs[[:space:]]' /etc/fstab
      register: declared_zfs_line
      changed_when: false
      failed_when: >-
        declared_zfs_line.rc != 0
        or 'x-systemd.requires=zfs-mount.service' not in declared_zfs_line.stdout
        or 'nofail' not in declared_zfs_line.stdout

    - name: Read the nfs-server ordering drop-in
      ansible.builtin.slurp:
        src: /etc/systemd/system/nfs-server.service.d/zfs-encrypted.conf
      register: nfs_dropin

    - name: Assert the drop-in gates nfsd on the encrypted export only
      ansible.builtin.assert:
        that:
          - "'After=zfs-mount-encrypted.service' in (nfs_dropin.content | b64decode)"
          - "'RequiresMountsFor=/export/appdata' in (nfs_dropin.content | b64decode)"
          - "'RequiresMountsFor=/export/share' not in (nfs_dropin.content | b64decode)"
        fail_msg: >-
          nfs-server drop-in must order after zfs-mount-encrypted.service and
          RequiresMountsFor exactly the encrypted exports (never the plaintext
          ones).

    # Media mover: script + timer render and the timer is enabled.
    - name: Stat media-mover script
      ansible.builtin.stat:
        path: /usr/local/sbin/media-mover.sh
      register: media_mover_script
      failed_when: not media_mover_script.stat.exists or media_mover_script.stat.mode != '0755'

    - name: Verify media-mover script renders src/dst from host vars
      ansible.builtin.command: grep -q 'SRC="/mnt/nvme/media/library"' /usr/local/sbin/media-mover.sh
      register: media_mover_src_check
      changed_when: false
      failed_when: media_mover_src_check.rc != 0

    # The `${sval}` emit carries the preserved timestamp on failure, so
    # MediaMoverStale measures time-since-success. Behaviour is executed by
    # files/archive-metrics-behavior.sh; this pin catches a wholesale removal.
    - name: Verify media-mover failure path preserves the last-success timestamp
      ansible.builtin.command: grep -qF 'media_mover_last_success_timestamp_seconds ${sval}' /usr/local/sbin/media-mover.sh
      register: media_mover_prev_check
      changed_when: false
      failed_when: media_mover_prev_check.rc != 0

    - name: Check media-mover timer enabled state  # noqa command-instead-of-module
      ansible.builtin.command: systemctl is-enabled media-mover.timer
      register: media_mover_timer
      changed_when: false
      failed_when: media_mover_timer.stdout | trim != 'enabled'

    # swap-clean: the render and metric-name contracts. Behaviour that needs no
    # swap (the ARC-cap restore, the pre-flight decision) is executed by
    # files/swap-clean-behavior.sh below.
    - name: Stat swap-clean script
      ansible.builtin.stat:
        path: /usr/local/sbin/swap-clean.sh
      register: swap_clean_script
      failed_when: not swap_clean_script.stat.exists or swap_clean_script.stat.mode != '0755'

    - name: Verify swap-clean rendered the stop-guest candidate list from host vars
      ansible.builtin.command: grep -qF '999:test-guest:60' /usr/local/sbin/swap-clean.sh
      register: swap_clean_stop_guests_check
      changed_when: false
      failed_when: swap_clean_stop_guests_check.rc != 0

    - name: Verify swap-clean rejects a malformed stop-guest entry at run time
      ansible.builtin.command: grep -qF "ignoring malformed stop-guest entry" /usr/local/sbin/swap-clean.sh
      register: swap_clean_entry_guard
      changed_when: false
      failed_when: swap_clean_entry_guard.rc != 0

    # The schedule alone stops guarding the moment an overnight job overruns, so
    # every conflicting unit must reach the rendered pre-flight.
    - name: Verify swap-clean guards every configured conflicting unit
      ansible.builtin.command: grep -qF "{{ item }}" /usr/local/sbin/swap-clean.sh
      loop:
        - restic-offsite.service
        - archive-backup.service
        - media-mover.service
      register: swap_clean_conflicting
      changed_when: false
      failed_when: swap_clean_conflicting.rc != 0

    - name: Read the swap-clean service unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/swap-clean.service
      register: swap_clean_unit

    # TimeoutStopSec is the EXIT trap's budget after a start timeout; the
    # ExecStopPost is the only restore that survives a SIGKILL.
    - name: Assert the swap-clean unit budgets its stop path and restores the ARC cap
      ansible.builtin.assert:
        that:
          - "'TimeoutStopSec=300' in (swap_clean_unit.content | b64decode)"
          - "'ExecStopPost=' in (swap_clean_unit.content | b64decode)"
          - "nas_storage_zfs_arc_max_bytes in (swap_clean_unit.content | b64decode)"
        fail_msg: >-
          swap-clean.service must budget TimeoutStopSec and restore the ARC cap
          from ExecStopPost: {{ swap_clean_unit.content | b64decode }}
        success_msg: "swap-clean.service budgets its stop path and restores the ARC cap"

    - name: Assert swap-clean ARC-restore + pre-flight behavior (executed, not grepped)
      ansible.builtin.script: files/swap-clean-behavior.sh
      changed_when: false

    # The failure/abort path must preserve the last-success timestamp (same
    # contract as media-mover) so a staleness alert measures time-since-success,
    # not time-since-attempt; a wholesale removal of the metric block trips this.
    - name: Verify swap-clean failure path preserves the last-success timestamp
      ansible.builtin.command: grep -qF 'swap_clean_last_success_timestamp_seconds ${sval}' /usr/local/sbin/swap-clean.sh
      register: swap_clean_prev_check
      changed_when: false
      failed_when: swap_clean_prev_check.rc != 0

    # Exact metric-name contract: the guest-restart-failure alert (kube-prometheus
    # -stack) matches this series by name, so a rename must fail here. Behavior is
    # executed by files/archive-metrics-behavior.sh (cleanup demotion arm).
    - name: Verify swap-clean emits the guest-restart-failure gauge
      ansible.builtin.command: grep -qF 'swap_clean_guest_restart_failures ${restart_failed}' /usr/local/sbin/swap-clean.sh
      register: swap_clean_restart_gauge
      changed_when: false
      failed_when: swap_clean_restart_gauge.rc != 0

    - name: Check swap-clean timer enabled state  # noqa command-instead-of-module
      ansible.builtin.command: systemctl is-enabled swap-clean.timer
      register: swap_clean_timer
      changed_when: false
      failed_when: swap_clean_timer.stdout | trim != 'enabled'

    # Per-app appdata subdirectories: created after the
    # mounted-dataset guard, owned 1000:2000 so the all_squashed appdata export
    # is writable by the floating k3s apps (Grafana + downloads/recipes).
    - name: Stat the grafana appdata subdirectory
      ansible.builtin.stat:
        path: /mnt/ssd/appdata/grafana
      register: appdata_grafana
      failed_when: >-
        not appdata_grafana.stat.exists
        or not appdata_grafana.stat.isdir
        or appdata_grafana.stat.uid != 1000
        or appdata_grafana.stat.gid != 2000

    # backups-apps: per-app exports each scoped to a single writer. authentik and
    # gitlab require TLS; home-assistant is the plaintext appliance exception,
    # whose trailing `)` after fsid=98 anchors that no xprtsec leaked in.
    - name: Read /etc/exports for the per-app backups-apps assertions
      ansible.builtin.slurp:
        src: /etc/exports
      register: backups_apps_exports

    - name: Assert per-app backups-apps export isolation + per-app TLS scoping
      ansible.builtin.assert:
        that:
          - >-
            '/export/backups-apps/authentik 192.0.2.200/29(rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=96,xprtsec=tls)'
            in (backups_apps_exports.content | b64decode)
          - >-
            '/export/backups-apps/gitlab 192.0.2.153/32(rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=97,xprtsec=tls)'
            in (backups_apps_exports.content | b64decode)
          - >-
            '/export/backups-apps/home-assistant 192.0.2.154/32(rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=98)'
            in (backups_apps_exports.content | b64decode)
        fail_msg: "per-app backups-apps exports not scoped/TLS-set as expected (authentik+gitlab TLS, HAOS plaintext)"
        success_msg: "backups-apps split into per-app exports: authentik/gitlab require TLS, HAOS stays plaintext"

    # bind_source_check: each per-app subdir bind anchors on the encrypted mount
    # (its bind_source is in nas_storage_encrypted_bind_sources).
    - name: Read the /export/backups-apps/authentik bind fstab entry (subdir of an encrypted dataset)
      ansible.builtin.command: >-
        grep -E '^/mnt/tank/backups/apps/authentik[[:space:]]+/export/backups-apps/authentik[[:space:]]' /etc/fstab
      register: backups_apps_bind
      changed_when: false
      failed_when: >-
        backups_apps_bind.rc != 0
        or 'x-systemd.requires=zfs-mount-encrypted.service' not in backups_apps_bind.stdout

    - name: Stat a backups-apps per-app subdirectory (created + owned as a bind source)
      ansible.builtin.stat:
        path: /mnt/tank/backups/apps/authentik
      register: backups_apps_authentik
      failed_when: >-
        not backups_apps_authentik.stat.exists
        or not backups_apps_authentik.stat.isdir
        or backups_apps_authentik.stat.uid != 1000
        or backups_apps_authentik.stat.gid != 2000

    - name: Stat the backup-artifact mtime collector script
      ansible.builtin.stat:
        path: /usr/local/sbin/backup-artifact-mtime-collector.sh
      register: backup_artifact_collector
      failed_when: >-
        not backup_artifact_collector.stat.exists
        or backup_artifact_collector.stat.mode != '0755'

    - name: Check backup-artifact collector timer enabled  # noqa command-instead-of-module
      ansible.builtin.command: systemctl is-enabled backup-artifact-mtime-collector.timer
      register: backup_artifact_timer
      changed_when: false
      failed_when: backup_artifact_timer.stdout | trim != 'enabled'

    # CRITICAL: a collector taking the newest file of ANY name lets nightly
    # sidecar copies hold the freshness signal green while no restorable dump
    # ever lands. Both arms are asserted: a sidecar-only dir reports 0, and the
    # same dir reports a real mtime and size once an artefact lands. Sidecars are
    # seeded non-empty, so exclusion must come from the name, not the size.
    - name: Seed the gitlab landing dir with sidecar files only (non-restorable)
      ansible.builtin.copy:
        dest: "/mnt/tank/backups/apps/gitlab/{{ item }}"
        content: "molecule-fixture\n"
        mode: "0600"
      loop:
        - gitlab.rb
        - gitlab-secrets.json
        - 1785142817_2026_07_27_19.2.0-ee_gitlab_backup.tar.tmp

    - name: Run the collector against a scratch textfile dir (sidecars only)
      ansible.builtin.command: /usr/local/sbin/backup-artifact-mtime-collector.sh /tmp/backup-artifact-verify
      changed_when: false

    - name: Read the sidecar-only collector output
      ansible.builtin.slurp:
        src: /tmp/backup-artifact-verify/backup_artifact_mtime.prom
      register: backup_artifact_sidecars_only

    - name: A config-file copy must NOT satisfy backup-artifact freshness
      ansible.builtin.assert:
        that:
          - "'backup_artifact_last_mtime_seconds{app=\"gitlab\"} 0' in (backup_artifact_sidecars_only.content | b64decode)"
          - "'backup_artifact_last_size_bytes{app=\"gitlab\"} 0' in (backup_artifact_sidecars_only.content | b64decode)"
        fail_msg: >-
          The collector reported a non-zero gitlab artifact mtime/size while only
          sidecar files and a .tmp partial were present — the false-green the
          per-app pattern exists to prevent.

    - name: Land a real GitLab tarball in the same dir
      ansible.builtin.copy:
        dest: /mnt/tank/backups/apps/gitlab/1785142817_2026_07_27_19.2.0-ee_gitlab_backup.tar
        content: "not-really-a-tarball\n"
        mode: "0600"

    - name: Re-run the collector with a restorable artifact present
      ansible.builtin.command: /usr/local/sbin/backup-artifact-mtime-collector.sh /tmp/backup-artifact-verify
      changed_when: false

    - name: Read the with-artifact collector output
      ansible.builtin.slurp:
        src: /tmp/backup-artifact-verify/backup_artifact_mtime.prom
      register: backup_artifact_with_tarball

    - name: A matching artifact must produce a real mtime and a non-zero size
      ansible.builtin.assert:
        that:
          - "'backup_artifact_last_mtime_seconds{app=\"gitlab\"} 0' not in (backup_artifact_with_tarball.content | b64decode)"
          - "'backup_artifact_last_mtime_seconds{app=\"gitlab\"}' in (backup_artifact_with_tarball.content | b64decode)"
          - "'backup_artifact_last_size_bytes{app=\"gitlab\"} 0' not in (backup_artifact_with_tarball.content | b64decode)"
        fail_msg: >-
          The collector did not pick up a file matching the gitlab artefact
          pattern — the freshness signal would be permanently 0/stale.

    # Companion files: required to RESTORE the artefact, deliberately excluded
    # from the artefact pattern, so presence/size needs its own signal.
    - name: A present companion reports present=1 and a non-zero size
      ansible.builtin.assert:
        that:
          - >-
            'backup_artifact_companion_present{app="gitlab",file="gitlab-secrets.json"} 1'
            in (backup_artifact_with_tarball.content | b64decode)
          - >-
            'backup_artifact_companion_size_bytes{app="gitlab",file="gitlab-secrets.json"} 0'
            not in (backup_artifact_with_tarball.content | b64decode)
        fail_msg: >-
          The companion metrics did not report the present, non-empty
          gitlab-secrets.json — a restore-blocking absence would be invisible.

    - name: Remove the companion, keeping the artifact
      ansible.builtin.file:
        path: /mnt/tank/backups/apps/gitlab/gitlab-secrets.json
        state: absent

    - name: Re-run the collector with the companion missing
      ansible.builtin.command: /usr/local/sbin/backup-artifact-mtime-collector.sh /tmp/backup-artifact-verify
      changed_when: false

    - name: Read the missing-companion collector output
      ansible.builtin.slurp:
        src: /tmp/backup-artifact-verify/backup_artifact_mtime.prom
      register: backup_artifact_no_companion

    - name: A missing companion reports present=0 while the artifact stays fresh
      ansible.builtin.assert:
        that:
          - >-
            'backup_artifact_companion_present{app="gitlab",file="gitlab-secrets.json"} 0'
            in (backup_artifact_no_companion.content | b64decode)
          - "'backup_artifact_last_size_bytes{app=\"gitlab\"} 0' not in (backup_artifact_no_companion.content | b64decode)"
        fail_msg: >-
          A missing gitlab-secrets.json did not flip the companion metric to 0 —
          a tarball with no key material would restore to unreadable columns.

    # Mounted-dataset guard: with the backups dataset unmounted the landing zone
    # is a plain root-fs dir holding shadow copies the collector would read as
    # fresh. The container path is never a mountpoint, so the guard is forced on.
    - name: Run the collector with the mounted-dataset guard forced ON
      ansible.builtin.shell: |
        set -eo pipefail
        sed 's#^REQUIRE_MOUNT=.*#REQUIRE_MOUNT=1#' \
          /usr/local/sbin/backup-artifact-mtime-collector.sh > /tmp/collector-guard.sh
        # `sh <file>`, not an exec bit: molecule mounts /tmp as a Docker tmpfs,
        # which defaults to noexec, so a chmod +x there still gives rc=126.
        sh /tmp/collector-guard.sh /tmp/backup-artifact-guard
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read the guard-on collector output
      ansible.builtin.slurp:
        src: /tmp/backup-artifact-guard/backup_artifact_mtime.prom
      register: backup_artifact_guard_on

    - name: An unmounted landing zone must emit NO per-app series
      ansible.builtin.assert:
        that:
          - "'backup_artifact_last_mtime_seconds{app=' not in (backup_artifact_guard_on.content | b64decode)"
          - "'backup_artifact_last_size_bytes{app=' not in (backup_artifact_guard_on.content | b64decode)"
          - "'backup_artifact_companion_present{app=' not in (backup_artifact_guard_on.content | b64decode)"
          - "'backup_artifact_collector_last_success_seconds ' in (backup_artifact_guard_on.content | b64decode)"
        fail_msg: >-
          The collector reported per-app series with the backups dataset
          unmounted — every per-app absent() alert arm would stay green while
          nothing offsite-eligible exists.

    - name: Remove the backup-artifact verification fixtures
      ansible.builtin.file:
        path: "/mnt/tank/backups/apps/gitlab/{{ item }}"
        state: absent
      loop:
        - gitlab.rb
        - gitlab-secrets.json
        - 1785142817_2026_07_27_19.2.0-ee_gitlab_backup.tar
        - 1785142817_2026_07_27_19.2.0-ee_gitlab_backup.tar.tmp

    # /etc/pve cluster-identity archive, exercised end to end against a synthetic
    # source (the container has no pmxcfs).
    - name: Stat the pve-cluster backup script
      ansible.builtin.stat:
        path: /usr/local/sbin/pve-cluster-backup.sh
      register: nas_storage_pve_cluster_script
      failed_when: >-
        not nas_storage_pve_cluster_script.stat.exists
        or nas_storage_pve_cluster_script.stat.mode != '0755'

    - name: Read the pve-cluster backup script
      ansible.builtin.slurp:
        src: /usr/local/sbin/pve-cluster-backup.sh
      register: nas_storage_pve_cluster_script_raw

    - name: Read the shared metrics library the pve-cluster wrapper sources
      ansible.builtin.slurp:
        src: /usr/local/lib/nas-storage-backup-lib.sh
      register: nas_storage_pve_cluster_metrics_lib

    - name: Assert the wrapper sources the shared library rather than its own copy
      ansible.builtin.assert:
        that:
          - (nas_storage_pve_cluster_metrics_lib.content | b64decode) is search('write_prom_metrics\\(\\)')
          - (nas_storage_pve_cluster_metrics_lib.content | b64decode) is search('/etc/pve archive')
          - (nas_storage_pve_cluster_script_raw.content | b64decode) is search('\\. "\\$METRICS_LIB"')
          - (nas_storage_pve_cluster_script_raw.content | b64decode)
            is not search('(?m)^write_prom_metrics\\(\\) \\{')
        fail_msg: >-
          The pve-cluster wrapper carries its own write_prom_metrics copy, or the
          shared library is missing or was rendered without its size-help noun.
        success_msg: "The pve-cluster wrapper sources the shared metrics library"

    - name: Check the pve-cluster-backup timer is enabled  # noqa command-instead-of-module
      ansible.builtin.command: systemctl is-enabled pve-cluster-backup.timer
      register: nas_storage_pve_cluster_timer
      changed_when: false
      failed_when: nas_storage_pve_cluster_timer.stdout | trim != 'enabled'

    - name: Stat the pve-cluster landing directory (must be root-only — holds key material)
      ansible.builtin.stat:
        path: /mnt/tank/backups/apps/pve-cluster
      register: nas_storage_pve_cluster_dir
      failed_when: >-
        not nas_storage_pve_cluster_dir.stat.exists
        or not nas_storage_pve_cluster_dir.stat.isdir
        or nas_storage_pve_cluster_dir.stat.mode != '0700'
        or nas_storage_pve_cluster_dir.stat.uid != 0

    - name: An absent source must fail loudly, not report success
      ansible.builtin.shell: |
        set -o pipefail
        sed 's#^SRC=.*#SRC="/nonexistent/etc/pve"#' /usr/local/sbin/pve-cluster-backup.sh > /tmp/pvecb-missing.sh
        # `bash <file>`: /tmp is a noexec Docker tmpfs here, so +x is not enough.
        bash /tmp/pvecb-missing.sh
      args:
        executable: /bin/bash
      register: nas_storage_pve_cluster_missing
      changed_when: false
      failed_when: nas_storage_pve_cluster_missing.rc == 0

    - name: Read the metrics written by the absent-source run
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/pve_cluster_backup.prom
      register: nas_storage_pve_cluster_prom_fail

    - name: A failed run records success=0 and size=0
      ansible.builtin.assert:
        that:
          - "'pve_cluster_backup_last_run_success 0' in (nas_storage_pve_cluster_prom_fail.content | b64decode)"
          - "'pve_cluster_backup_last_size_bytes 0' in (nas_storage_pve_cluster_prom_fail.content | b64decode)"
        fail_msg: "An absent source did not record a failed run — the alert arms would stay green."

    # CRITICAL: without the landing-zone mount guard this local producer tars
    # /etc/pve, priv/ included, onto the root filesystem and reports success, and
    # the collector reads the same shadowed dir. The guard is forced on here. A
    # stale archive is seeded under the redirected DEST_DIR so the run must not
    # size a shadow copy into a healthy-looking last_size_bytes.
    - name: An unmounted landing zone must fail closed, not shadow-write the source
      ansible.builtin.shell: |
        set -o pipefail
        sed -e 's#^SRC=.*#SRC="/tmp/fake-pve-guard"#' \
            -e 's#^DEST_DIR=.*#DEST_DIR="/tmp/pvecb-shadow"#' \
            -e 's#^REQUIRE_MOUNT=.*#REQUIRE_MOUNT=1#' \
            /usr/local/sbin/pve-cluster-backup.sh > /tmp/pvecb-guard.sh
        mkdir -p /tmp/fake-pve-guard/priv /tmp/pvecb-shadow
        echo 'FAKE-CA' > /tmp/fake-pve-guard/priv/pve-root-ca.pem
        dd if=/dev/zero of=/tmp/pvecb-shadow/etc-pve-20200101-000000.tar.gz bs=4096 count=1 2>/dev/null
        bash /tmp/pvecb-guard.sh
      args:
        executable: /bin/bash
      register: nas_storage_pve_cluster_unmounted
      changed_when: false
      failed_when: nas_storage_pve_cluster_unmounted.rc == 0

    - name: The unmounted run records success=0 and produced no archive
      ansible.builtin.shell: |
        set -o pipefail
        grep -c '^pve_cluster_backup_last_run_success 0' /var/lib/node_exporter/pve_cluster_backup.prom \
          | tr -d '[:space:]'
        echo
        ls /mnt/tank/backups/apps/pve-cluster/etc-pve-*.tar.gz 2>/dev/null | wc -l | tr -d '[:space:]'
        echo
      args:
        executable: /bin/bash
      register: nas_storage_pve_cluster_unmounted_state
      changed_when: false
      failed_when: nas_storage_pve_cluster_unmounted_state.stdout_lines != ['1', '0']

    - name: Read the metrics written by the unmounted-landing-zone run
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/pve_cluster_backup.prom
      register: nas_storage_pve_cluster_prom_unmounted

    - name: The unmounted run reports size 0, not the shadow archive's size
      ansible.builtin.assert:
        that:
          - "'pve_cluster_backup_last_size_bytes 0'
             in (nas_storage_pve_cluster_prom_unmounted.content | b64decode)"
          - "'pve_cluster_backup_last_size_bytes 4096'
             not in (nas_storage_pve_cluster_prom_unmounted.content | b64decode)"
        fail_msg: >-
          The unmounted-landing-zone run sized a shadow archive on the root
          filesystem — BackupArtifactEmpty would stay green for a landing zone
          nothing can reach.
        success_msg: "The unmounted-landing-zone run distrusts shadow archives and reports size 0"

    # CRITICAL: /etc/pve is FUSE, so with pve-cluster.service down it is an empty
    # directory every downstream check passes on. Without the source-side mount
    # guard the run publishes a backup of nothing as success, and retention
    # retires the real archives behind it.
    - name: An unmounted pmxcfs source must fail closed, not archive an empty mountpoint
      ansible.builtin.shell: |
        set -o pipefail
        sed -e 's#^SRC=.*#SRC="/tmp/fake-pve-src"#' \
            -e 's#^REQUIRE_SRC_MOUNT=.*#REQUIRE_SRC_MOUNT=1#' \
            /usr/local/sbin/pve-cluster-backup.sh > /tmp/pvecb-src.sh
        mkdir -p /tmp/fake-pve-src
        bash /tmp/pvecb-src.sh
      args:
        executable: /bin/bash
      register: nas_storage_pve_cluster_src_unmounted
      changed_when: false
      failed_when: nas_storage_pve_cluster_src_unmounted.rc == 0

    - name: The unmounted-source run records success=0 and produced no archive
      ansible.builtin.shell: |
        set -o pipefail
        grep -c '^pve_cluster_backup_last_run_success 0' /var/lib/node_exporter/pve_cluster_backup.prom \
          | tr -d '[:space:]'
        echo
        ls /mnt/tank/backups/apps/pve-cluster/etc-pve-*.tar.gz 2>/dev/null | wc -l | tr -d '[:space:]'
        echo
      args:
        executable: /bin/bash
      register: nas_storage_pve_cluster_src_unmounted_state
      changed_when: false
      failed_when: nas_storage_pve_cluster_src_unmounted_state.stdout_lines != ['1', '0']

    # The real pmxcfs layout: the CA certificate sits at the root, only the
    # private half under priv/. Invented paths would test a guard that can never
    # pass against nas_storage_pve_cluster_backup_required_files on a real host.
    - name: Seed a synthetic pmxcfs tree (real cluster-identity paths)
      ansible.builtin.shell: |
        set -eo pipefail
        rm -rf /tmp/fake-pve
        mkdir -p /tmp/fake-pve/priv
        echo 'user:root@pam:1:0:::::' > /tmp/fake-pve/user.cfg
        echo 'totem { cluster_name: molecule }' > /tmp/fake-pve/corosync.conf
        echo 'FAKE-CA-CERT' > /tmp/fake-pve/pve-root-ca.pem
        echo 'FAKE-AUTHKEY-PUB' > /tmp/fake-pve/authkey.pub
        echo 'FAKE-CA-KEY' > /tmp/fake-pve/priv/pve-root-ca.key
        echo 'FAKE-AUTHKEY' > /tmp/fake-pve/priv/authkey.key
      args:
        executable: /bin/bash
      changed_when: false

    - name: Run the pve-cluster backup against the synthetic source (three times, for retention)
      ansible.builtin.shell: |
        set -eo pipefail
        sed 's#^SRC=.*#SRC="/tmp/fake-pve"#' /usr/local/sbin/pve-cluster-backup.sh > /tmp/pvecb.sh
        bash /tmp/pvecb.sh
        sleep 1
        bash /tmp/pvecb.sh
        sleep 1
        bash /tmp/pvecb.sh
      args:
        executable: /bin/bash
      changed_when: false

    # A trailing slash on the source must not reach the required-files check:
    # "etc/pve//user.cfg" is a path tar never emits, so every run would delete
    # its own archive and exit 1.
    - name: A trailing slash on the source must still publish an archive
      ansible.builtin.shell: |
        set -eo pipefail
        sed 's#^SRC=.*#SRC="/tmp/fake-pve/"#' /usr/local/sbin/pve-cluster-backup.sh > /tmp/pvecb-slash.sh
        bash /tmp/pvecb-slash.sh
      args:
        executable: /bin/bash
      register: nas_storage_pve_cluster_slash
      changed_when: false
      failed_when: nas_storage_pve_cluster_slash.rc != 0

    - name: Read the metrics written by the successful run
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/pve_cluster_backup.prom
      register: nas_storage_pve_cluster_prom_ok

    - name: A successful run records success=1 and a NON-ZERO size
      ansible.builtin.assert:
        that:
          - "'pve_cluster_backup_last_run_success 1' in (nas_storage_pve_cluster_prom_ok.content | b64decode)"
          - "'pve_cluster_backup_last_success_timestamp_seconds ' in (nas_storage_pve_cluster_prom_ok.content | b64decode)"
          - "'pve_cluster_backup_last_size_bytes 0' not in (nas_storage_pve_cluster_prom_ok.content | b64decode)"
        fail_msg: >-
          The archive run did not record success + a non-zero size — a 0 here is
          what the empty-artifact alert exists to catch.

    - name: List the produced archives
      ansible.builtin.find:
        paths: /mnt/tank/backups/apps/pve-cluster
        patterns: "etc-pve-*.tar.gz"
      register: nas_storage_pve_cluster_archives

    - name: Retention keeps exactly nas_storage_pve_cluster_backup_keep archives, mode 0600
      ansible.builtin.assert:
        that:
          - nas_storage_pve_cluster_archives.matched == 2
          - nas_storage_pve_cluster_archives.files | map(attribute='mode') | unique == ['0600']
        fail_msg: >-
          Expected 2 archives (keep=2) at 0600 after three runs, found
          {{ nas_storage_pve_cluster_archives.matched }} — retention or the
          key-material file mode regressed.

    - name: The archive must actually contain the cluster identity files
      ansible.builtin.shell: |
        set -o pipefail
        newest=$(ls -t /mnt/tank/backups/apps/pve-cluster/etc-pve-*.tar.gz | head -1)
        tar -tzf "$newest"
      args:
        executable: /bin/bash
      register: nas_storage_pve_cluster_listing
      changed_when: false

    - name: Every declared cluster-identity file is in the published archive
      ansible.builtin.assert:
        that:
          - "'tmp/fake-pve/' ~ item in nas_storage_pve_cluster_listing.stdout_lines"
        fail_msg: >-
          The published archive is missing {{ item }} — a restore cannot rebuild
          the cluster identity from it.
      loop:
        - user.cfg
        - corosync.conf
        - pve-root-ca.pem
        - priv/pve-root-ca.key
        - authkey.pub
        - priv/authkey.key

    # CRITICAL: a source that tars perfectly but is missing one identity file is
    # a degraded pmxcfs, and publishing it retires a real archive per night
    # through retention. The content guard must refuse and leave the landing
    # zone alone.
    - name: Count the archives before the missing-identity-file run
      ansible.builtin.find:
        paths: /mnt/tank/backups/apps/pve-cluster
        patterns: "etc-pve-*.tar.gz"
      register: nas_storage_pve_cluster_before_degraded

    - name: A readable archive missing an identity file must not be published
      ansible.builtin.shell: |
        set -o pipefail
        rm -rf /tmp/fake-pve-degraded
        mkdir -p /tmp/fake-pve-degraded/priv
        echo 'user:root@pam:1:0:::::' > /tmp/fake-pve-degraded/user.cfg
        echo 'totem { cluster_name: molecule }' > /tmp/fake-pve-degraded/corosync.conf
        echo 'FAKE-CA-CERT' > /tmp/fake-pve-degraded/pve-root-ca.pem
        echo 'FAKE-AUTHKEY-PUB' > /tmp/fake-pve-degraded/authkey.pub
        echo 'FAKE-CA-KEY' > /tmp/fake-pve-degraded/priv/pve-root-ca.key
        # priv/authkey.key deliberately absent.
        sed 's#^SRC=.*#SRC="/tmp/fake-pve-degraded"#' \
          /usr/local/sbin/pve-cluster-backup.sh > /tmp/pvecb-degraded.sh
        bash /tmp/pvecb-degraded.sh
      args:
        executable: /bin/bash
      register: nas_storage_pve_cluster_degraded
      changed_when: false
      failed_when: nas_storage_pve_cluster_degraded.rc == 0

    - name: Count the archives after the missing-identity-file run
      ansible.builtin.find:
        paths: /mnt/tank/backups/apps/pve-cluster
        patterns: "etc-pve-*.tar.gz"
      register: nas_storage_pve_cluster_after_degraded

    - name: The refused run published nothing and named the missing file
      ansible.builtin.assert:
        that:
          - nas_storage_pve_cluster_after_degraded.matched
            == nas_storage_pve_cluster_before_degraded.matched
          - "'priv/authkey.key' in nas_storage_pve_cluster_degraded.stdout"
        fail_msg: >-
          An archive missing priv/authkey.key was published (or the refusal did
          not say which file was missing) — retention would age a real archive
          out behind a backup that cannot restore the cluster identity.
        success_msg: "A readable archive of an incomplete pmxcfs is refused, not published"

    # The size fallback's non-destructive direction: with the landing zone
    # mounted, a failed run still sizes the newest existing archive, because
    # 0 bytes means no artefact at all and carries a different runbook.
    - name: Read the metrics written by the refused run
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/pve_cluster_backup.prom
      register: nas_storage_pve_cluster_prom_degraded

    - name: A failed run over a reachable landing zone sizes the newest archive
      ansible.builtin.assert:
        that:
          - "'pve_cluster_backup_last_run_success 0'
             in (nas_storage_pve_cluster_prom_degraded.content | b64decode)"
          - "'pve_cluster_backup_last_size_bytes 0'
             not in (nas_storage_pve_cluster_prom_degraded.content | b64decode)"
        fail_msg: >-
          A failed run reported 0 bytes while good archives sit in a mounted
          landing zone — that is the "no artefact at all" page, for the wrong
          fault.
        success_msg: "A failed run over a mounted landing zone still sizes the newest archive"

    - name: Check if Samba is installed
      ansible.builtin.package:
        name: samba
        state: present
      check_mode: true
      register: samba_installed
      failed_when: samba_installed.changed

    - name: Check if smb.conf exists
      ansible.builtin.stat:
        path: /etc/samba/smb.conf
      register: smb_conf
      failed_when: not smb_conf.stat.exists

    - name: Verify smb.conf contains expected shares
      ansible.builtin.command: grep -q "\[media\]" /etc/samba/smb.conf
      register: smb_check
      failed_when: smb_check.rc != 0
      changed_when: false

    - name: Check if NFS service exists
      ansible.builtin.systemd:
        name: nfs-kernel-server
      register: nfs_service
      failed_when: nfs_service.status.LoadState != 'loaded'

    - name: Check if Samba service exists
      ansible.builtin.systemd:
        name: smbd
      register: smb_service
      failed_when: smb_service.status.LoadState != 'loaded'

    # archive-backupctl contract: MAP/RMAP, locks and restore targets all derive
    # from SRC_LIST, so files/archive-contract-assert.sh pins inventory reaching
    # SRC_LIST intact, basename uniqueness and the type-to-arm coupling.
    - name: Write the expected archive source set from the inventory
      ansible.builtin.copy:
        content: "{{ nas_storage_archive_backup_sources | join('\n') }}\n"
        dest: /tmp/expected-archive-sources
        mode: "0644"

    - name: Assert the archive-backupctl contract (restorable, lock-listed, type-coupled)
      ansible.builtin.script: files/archive-contract-assert.sh /usr/local/sbin/archive-backupctl /tmp/expected-archive-sources
      changed_when: false

    # The per-child exclusion seam: the container has no ZFS, so the render, the
    # -X derivation and probe, the archive-copy reconcile and the source-side
    # snapshot/retention arms are driven against renders carrying exclusions.
    - name: Render archive-backupctl with an exclusion list  # noqa no-relative-paths
      ansible.builtin.template:
        src: ../../templates/archive-backupctl.sh.j2
        dest: /tmp/archive-backupctl-excluded
        mode: "0755"
      vars:
        nas_storage_archive_backup_exclude:
          - tank/share/scratch
          - ssd/appdata/cache
        nas_storage_archive_backup_keep_recent: 3
        nas_storage_archive_backup_keep_monthly: 6
        nas_storage_zfs_scrub_schedule: monthly
        nas_storage_backup_artifact_metrics_dir: /var/lib/node_exporter

    - name: Render archive-backupctl with exclusions and the destroy opt-in  # noqa no-relative-paths
      ansible.builtin.template:
        src: ../../templates/archive-backupctl.sh.j2
        dest: /tmp/archive-backupctl-excluded-ok
        mode: "0755"
      vars:
        nas_storage_archive_backup_exclude:
          - tank/share/scratch
          - ssd/appdata/cache
        nas_storage_archive_backup_exclude_destroy_ok: true
        nas_storage_archive_backup_keep_recent: 3
        nas_storage_archive_backup_keep_monthly: 6
        nas_storage_zfs_scrub_schedule: monthly
        nas_storage_backup_artifact_metrics_dir: /var/lib/node_exporter

    - name: Assert the archive exclusion seam (rendered, derived, probed, reconciled)
      ansible.builtin.script: >-
        files/archive-exclude-behavior.sh /tmp/archive-backupctl-excluded
        /usr/local/sbin/archive-backupctl /tmp/archive-backupctl-excluded-ok
      changed_when: false

    - name: Drive the exclusion guard - every entry under a replicated source
      ansible.builtin.include_tasks: ../../tasks/assert_archive_exclude.yml
      vars:
        nas_storage_archive_backup_sources: [tank/share, ssd/appdata]
        nas_storage_archive_backup_exclude: [tank/share/scratch, ssd/appdata/cache]

    - name: Drive the exclusion guard - an entry outside every source
      block:
        - name: Include the exclusion guard with an orphan entry
          ansible.builtin.include_tasks: ../../tasks/assert_archive_exclude.yml
          vars:
            nas_storage_archive_backup_sources: [tank/share]
            nas_storage_archive_backup_exclude: [tank/other/scratch]
      rescue:
        - name: Record that the orphan exclusion was rejected
          ansible.builtin.set_fact:
            nas_archive_exclude_rejected: >-
              {{ 'must be a descendant' in (ansible_failed_result | to_json) }}

    # A source itself is not a valid exclusion: `-X` on the dataset being sent
    # would empty the stream.
    - name: Drive the exclusion guard - an entry equal to a source
      block:
        - name: Include the exclusion guard with a source as the entry
          ansible.builtin.include_tasks: ../../tasks/assert_archive_exclude.yml
          vars:
            nas_storage_archive_backup_sources: [tank/share]
            nas_storage_archive_backup_exclude: [tank/share]
      rescue:
        - name: Record that the source-as-exclusion was rejected
          ansible.builtin.set_fact:
            nas_archive_exclude_self_rejected: >-
              {{ 'must be a descendant' in (ansible_failed_result | to_json) }}

    - name: Assert the exclusion guard fails closed
      ansible.builtin.assert:
        that:
          - nas_archive_exclude_rejected | default(false) | bool
          - nas_archive_exclude_self_rejected | default(false) | bool
        fail_msg: >-
          The exclusion guard accepted an entry that `zfs send -X` cannot apply,
          which would replicate the excluded child anyway.
        success_msg: "exclusion guard rejects orphan and self entries"

    # The unit must chain whatever nas_storage_archive_backup_on_success_units
    # names; dropping OnSuccess= leaves the offsite backup to its fallback timer,
    # a day-scale delay behind the fresh snapshot.
    - name: Read the archive-backup service unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/archive-backup.service
      register: archive_backup_unit

    - name: Assert archive-backup chains the configured units on success
      ansible.builtin.assert:
        that:
          - "'OnSuccess=restic-offsite.service' in (archive_backup_unit.content | b64decode)"
        fail_msg: >-
          archive-backup.service does not chain the configured on-success units
        success_msg: "archive-backup.service chains the configured OnSuccess units"

    - name: Render the archive-backup unit with no OnSuccess units  # noqa no-relative-paths
      ansible.builtin.template:
        src: ../../templates/archive-backup.service.j2
        dest: /tmp/archive-backup-nochain.service
        mode: "0644"
      vars:
        nas_storage_archive_backup_on_success_units: []

    - name: Read the un-chained archive-backup unit
      ansible.builtin.slurp:
        src: /tmp/archive-backup-nochain.service
      register: archive_backup_nochain

    - name: Assert an empty unit list renders no OnSuccess line
      ansible.builtin.assert:
        that:
          - "'OnSuccess' not in (archive_backup_nochain.content | b64decode)"
        fail_msg: "nas_storage_archive_backup_on_success_units is not a real seam - OnSuccess= is still rendered"
        success_msg: "an empty on-success list renders no OnSuccess line"

    # Executes the ZFS-free metric helpers (deferral accounting, timestamp
    # preservation, swap-clean's write_prom_metrics + cleanup restart-failure
    # demotion) instead of only grep-pinning them.
    - name: Assert archive/media-mover/swap-clean metric behavior (executed, not grepped)
      ansible.builtin.script: files/archive-metrics-behavior.sh
      changed_when: false

    # The MergerFS bind probe against real mounts: a bind of a union shares its
    # mount device id, so findmnt's SOURCE column cannot distinguish them. A
    # private tmpfs stands in for the union so the device id is its own.
    - name: Drive the MergerFS bind probe against real bind mounts
      block:
        - name: Create the probe fixture mounts
          ansible.builtin.shell: |
            set -eo pipefail
            mkdir -p /tmp/mergerfs-probe/union /tmp/mergerfs-probe/bind /tmp/mergerfs-probe/subbind /tmp/mergerfs-probe/empty-bin
            mountpoint -q /tmp/mergerfs-probe/union || mount -t tmpfs tmpfs /tmp/mergerfs-probe/union
            mkdir -p /tmp/mergerfs-probe/union/sub
            mountpoint -q /tmp/mergerfs-probe/bind \
              || mount --bind /tmp/mergerfs-probe/union /tmp/mergerfs-probe/bind
            mountpoint -q /tmp/mergerfs-probe/subbind \
              || mount --bind /tmp/mergerfs-probe/union/sub /tmp/mergerfs-probe/subbind
          args:
            executable: /bin/bash
          changed_when: false

        - name: List the binds of the fixture union
          ansible.builtin.script: ../../files/mergerfs-bind-probe.sh list /tmp/mergerfs-probe/union
          register: nas_probe_list
          changed_when: false

        - name: Check the fixture union for active NFS clients
          ansible.builtin.script: ../../files/mergerfs-bind-probe.sh check /tmp/mergerfs-probe/union
          register: nas_probe_check
          changed_when: false
          failed_when: false

        - name: Assert the probe finds the root bind and the subdirectory bind
          ansible.builtin.assert:
            that:
              - "'/tmp/mergerfs-probe/bind' in nas_probe_list.stdout_lines"
              - "'/tmp/mergerfs-probe/subbind' in nas_probe_list.stdout_lines"
              - "'/tmp/mergerfs-probe/union' not in nas_probe_list.stdout_lines"
              - "'BIND_EXPORTS' in nas_probe_check.stdout"
            fail_msg: >-
              The bind probe missed a bind of the union, so the busy gate would
              let the remount cycle run under live NFS clients:
              {{ nas_probe_list.stdout }} / {{ nas_probe_check.stdout }}
            success_msg: "bind probe matches root and subdirectory binds by mount device id"

        - name: Remove the binds, leaving the union mounted
          ansible.builtin.shell: |
            set -eo pipefail
            umount /tmp/mergerfs-probe/subbind
            umount /tmp/mergerfs-probe/bind
          args:
            executable: /bin/bash
          changed_when: false

        - name: Check the unbound union
          ansible.builtin.script: ../../files/mergerfs-bind-probe.sh check /tmp/mergerfs-probe/union
          register: nas_probe_none
          changed_when: false

        - name: Assert an unbound union reports no bind exports
          ansible.builtin.assert:
            that:
              - "'NO_NFS_BIND_EXPORTS' in nas_probe_none.stdout"
            fail_msg: "A union with no binds must not block the remount cycle: {{ nas_probe_none.stdout }}"
            success_msg: "unbound union: NO_NFS_BIND_EXPORTS"

        - name: Run the probe with a bad mode
          ansible.builtin.script: ../../files/mergerfs-bind-probe.sh wrong /tmp/mergerfs-probe/union
          register: nas_probe_bad_mode
          changed_when: false
          failed_when: false

        - name: Run the probe with no union argument
          ansible.builtin.script: ../../files/mergerfs-bind-probe.sh list
          register: nas_probe_no_union
          changed_when: false
          failed_when: false

        # The remount guard keys off rc, so a usage error must never look like
        # an empty bind list.
        - name: Assert a usage error exits non-zero rather than printing nothing
          ansible.builtin.assert:
            that:
              - nas_probe_bad_mode.rc == 2
              - nas_probe_no_union.rc == 2
              - nas_probe_bad_mode.stdout | trim | length == 0
              - nas_probe_no_union.stdout | trim | length == 0
            fail_msg: >-
              The bind probe accepted a bad invocation, so the leftover-mount
              guard would read "could not run" as "nothing holds the union".
            success_msg: "bind probe usage errors exit 2 with empty stdout"

        # A probe result carrying no rc never ran. Feeding one to the gate must
        # refuse the remount, not read as "no failure, therefore clean".
        - name: Evaluate the remount gate against a probe that never ran
          vars:
            nas_storage_mergerfs_needs_remount: true
            nas_storage_mergerfs_mounts:
              - name: media
                target: /tmp/mergerfs-probe/union
            nas_storage_mergerfs_nfs_check:
              results:
                - failed: true
                  msg: "could not execute the probe script"
            nas_storage_mergerfs_process_check:
              results:
                - rc: 0
          ansible.builtin.set_fact:
            nas_gate_without_rc: >-
              {{ nas_storage_mergerfs_needs_remount | default(false)
                 and (nas_storage_mergerfs_nfs_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list | length) == (nas_storage_mergerfs_mounts | length)
                 and (nas_storage_mergerfs_process_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list | length) == (nas_storage_mergerfs_mounts | length) }}

        - name: Assert a probe that never ran blocks the remount cycle
          ansible.builtin.assert:
            that:
              - not (nas_gate_without_rc | bool)
            fail_msg: >-
              The remount gate read a probe result with no rc as clean, so the
              cycle would unexport and unmount unions that were never checked.
            success_msg: "a probe that never ran blocks the remount cycle"

        # A missing fuser must read as "I could not look", never as an idle
        # union: reading it clean would unmount a union processes still hold.
        - name: Read the idle probe out of the task file
          ansible.builtin.slurp:
            src: ../../tasks/mergerfs.yml
          register: nas_mergerfs_tasks
          delegate_to: localhost
          become: false

        - name: Assert the idle probe refuses to run without fuser
          ansible.builtin.assert:
            that:
              - "'command -v fuser' in (nas_mergerfs_tasks.content | b64decode)"
              - "'NO_FUSER' in (nas_mergerfs_tasks.content | b64decode)"
            fail_msg: >-
              tasks/mergerfs.yml lost its fuser guard, so an absent binary
              reads as an idle union.
            success_msg: "the idle probe guards on fuser being present"

        - name: Run the idle probe's fuser guard with fuser off PATH
          ansible.builtin.shell: |
            set -o pipefail
            MOUNTPOINT=/tmp/mergerfs-probe/union
            command -v fuser >/dev/null 2>&1 || {
              echo "NO_FUSER: cannot determine whether $MOUNTPOINT is in use"
              exit 3
            }
            echo "IDLE"
            exit 0
          args:
            executable: /bin/bash
          environment:
            PATH: /tmp/mergerfs-probe/empty-bin
          register: nas_probe_no_fuser
          changed_when: false
          failed_when: false

        - name: Evaluate the remount gate against a probe that could not look
          vars:
            nas_storage_mergerfs_needs_remount: true
            nas_storage_mergerfs_mounts:
              - name: media
                target: /tmp/mergerfs-probe/union
            nas_storage_mergerfs_nfs_check:
              results:
                - rc: 0
            nas_storage_mergerfs_process_check:
              results:
                - rc: "{{ nas_probe_no_fuser.rc }}"
          ansible.builtin.set_fact:
            nas_gate_without_fuser: >-
              {{ nas_storage_mergerfs_needs_remount | default(false)
                 and (nas_storage_mergerfs_nfs_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list | length) == (nas_storage_mergerfs_mounts | length)
                 and (nas_storage_mergerfs_process_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list | length) == (nas_storage_mergerfs_mounts | length) }}

        - name: Assert a probe with no fuser exits 3 and blocks the remount cycle
          ansible.builtin.assert:
            that:
              - nas_probe_no_fuser.rc == 3
              - "'NO_FUSER' in nas_probe_no_fuser.stdout"
              - not (nas_gate_without_fuser | bool)
            fail_msg: >-
              The idle probe reported IDLE with no fuser installed, so the
              remount cycle would unmount a union that may still be in use.
            success_msg: "a probe that cannot look blocks the remount cycle"
      always:
        - name: Tear down the probe fixture mounts
          ansible.builtin.shell: |
            umount -l /tmp/mergerfs-probe/subbind 2>/dev/null || true
            umount -l /tmp/mergerfs-probe/bind 2>/dev/null || true
            umount -l /tmp/mergerfs-probe/union 2>/dev/null || true
            rm -rf /tmp/mergerfs-probe
          args:
            executable: /bin/bash
          changed_when: false

    # The stop-guest list is handed to `qm shutdown <vmid> --timeout <s>`, so a
    # shape typo builds a plausible command out of a misconfiguration.
    - name: Drive the stop-guest guard - a well-formed list
      ansible.builtin.include_tasks: ../../tasks/assert_swap_clean_guests.yml
      vars:
        nas_storage_swap_clean_stop_guests: ["100:gitlab:180", "999:test-guest:60"]

    - name: Drive the stop-guest guard - malformed entries
      block:
        - name: Include the stop-guest guard with malformed entries
          ansible.builtin.include_tasks: ../../tasks/assert_swap_clean_guests.yml
          vars:
            nas_storage_swap_clean_stop_guests: ["100", "100:60", "100:name:abc"]
      rescue:
        - name: Record that the malformed entries were rejected
          ansible.builtin.set_fact:
            nas_swap_clean_guests_rejected: >-
              {{ 'vmid:name:timeout-seconds' in (ansible_failed_result | to_json) }}

    - name: Assert the stop-guest guard fails closed
      ansible.builtin.assert:
        that:
          - nas_swap_clean_guests_rejected | default(false) | bool
        fail_msg: "A malformed stop-guest entry must fail the deploy, not reach `qm shutdown`"
        success_msg: "stop-guest guard rejects entries that are not vmid:name:timeout"

    # Per-group smartd flags: the seam for drives that spin down, which the
    # reference deployment does not use, so only a fabricated render covers it.
    - name: Render smartd.conf with per-group extra flags  # noqa no-relative-paths
      ansible.builtin.template:
        src: ../../templates/smartd.conf.j2
        dest: /tmp/smartd-extra.conf
        mode: "0644"
      vars:
        nas_storage_smartd_disk_groups:
          - name: spindown
            disks: [/dev/disk/by-id/probe-disk]
            schedule: "(S/../.././02)"
            extra_flags: "-n standby,q"

    - name: Read the smartd render
      ansible.builtin.slurp:
        src: /tmp/smartd-extra.conf
      register: nas_smartd_extra

    - name: Assert the extra flags land on the directive line
      ansible.builtin.assert:
        that:
          - "'/dev/disk/by-id/probe-disk -a -o on -S on -s (S/../.././02) -n standby,q -m root'
             in (nas_smartd_extra.content | b64decode)"
        fail_msg: "smartd group extra_flags did not reach the directive: {{ nas_smartd_extra.content | b64decode }}"
        success_msg: "smartd groups carry per-group extra flags"

    # Server identity is a variable, so a site on another workgroup (or joining a
    # domain) does not have to fork the template.
    - name: Render smb.conf with a non-default identity  # noqa no-relative-paths
      ansible.builtin.template:
        src: ../../templates/smb.conf.j2
        dest: /tmp/smb-identity.conf
        mode: "0644"
      vars:
        nas_storage_samba_workgroup: OTHERGROUP
        nas_storage_samba_server_role: standalone server
        nas_storage_samba_ports: "445"
        nas_storage_samba_disable_netbios: true
        nas_storage_samba_interfaces: [lo, eth0]

    - name: Read the smb.conf render
      ansible.builtin.slurp:
        src: /tmp/smb-identity.conf
      register: nas_smb_identity

    - name: Assert the Samba identity and listener scope are variable-driven
      ansible.builtin.assert:
        that:
          - "'workgroup = OTHERGROUP' in (nas_smb_identity.content | b64decode)"
          - "'interfaces = lo eth0' in (nas_smb_identity.content | b64decode)"
          - "'bind interfaces only = yes' in (nas_smb_identity.content | b64decode)"
          - "'socket options' not in (nas_smb_identity.content | b64decode)"
        fail_msg: "smb.conf still hard-codes the server identity: {{ nas_smb_identity.content | b64decode }}"
        success_msg: "smb.conf takes its workgroup and listener scope from variables"

    # MergerFS remount decision logic. The remount cycle needs FUSE, which the
    # container lacks, but the facts that gate it are pure derivations, so they
    # are driven from fabricated register results.
    - name: Drive the remount decision — nothing changed, every union healthy
      ansible.builtin.include_tasks: ../../tasks/mergerfs_needs_remount.yml
      vars:
        nas_storage_mergerfs_fstab_changed:
          results:
            - {changed: false}
            - {changed: false}
        nas_storage_mergerfs_status_check:
          results:
            - {rc: 0}
            - {rc: 0}

    - name: Assert a healthy no-change state needs no remount
      ansible.builtin.assert:
        that:
          - not (nas_storage_mergerfs_needs_remount | bool)
        fail_msg: "An unchanged fstab with every union mounted must not trigger a remount cycle"
        success_msg: "no-change path: needs_remount false"

    - name: Drive the remount decision — one union's fstab options changed
      ansible.builtin.include_tasks: ../../tasks/mergerfs_needs_remount.yml
      vars:
        nas_storage_mergerfs_fstab_changed:
          results:
            - {changed: false}
            - {changed: true}
        nas_storage_mergerfs_status_check:
          results:
            - {rc: 0}
            - {rc: 0}

    - name: Assert a changed fstab entry needs a remount
      ansible.builtin.assert:
        that:
          - nas_storage_mergerfs_needs_remount | bool
        fail_msg: "A changed fstab entry must trigger the remount cycle, or new options are never applied"
        success_msg: "fstab-changed path: needs_remount true"

    # The other clause of the OR: fstab unchanged but a union is unmounted, not
    # mergerfs, or missing inodecalc+noforget. This arm recovers a union
    # unmounted by hand; without it the media exports serve a stub forever.
    - name: Drive the remount decision — fstab unchanged, one union unhealthy
      ansible.builtin.include_tasks: ../../tasks/mergerfs_needs_remount.yml
      vars:
        nas_storage_mergerfs_fstab_changed:
          results:
            - {changed: false}
            - {changed: false}
        nas_storage_mergerfs_status_check:
          results:
            - {rc: 0}
            - {rc: 1}

    - name: Assert an unhealthy union needs a remount even with an unchanged fstab
      ansible.builtin.assert:
        that:
          - nas_storage_mergerfs_needs_remount | bool
        fail_msg: "A non-zero status check must trigger the remount cycle, or a hand-unmounted union never recovers"
        success_msg: "status-check path: needs_remount true"

    # Classification guard (tasks/assert_zfs_classification.yml) driven from
    # fabricated inventory in all four shapes it decides. These pin the
    # fail-closed direction, which no converging inventory can exercise.
    - name: Drive the classification guard — every source declared or derived
      ansible.builtin.include_tasks: ../../tasks/assert_zfs_classification.yml
      vars:
        nas_storage_zfs_mount_roots: [/mnt/tank, /mnt/nvme]
        nas_storage_zfs_bind_source_pattern: "^(/mnt/tank|/mnt/nvme)/"
        nas_storage_mergerfs_mounts:
          - name: media
            target: /mnt/media
            sources: [/mnt/nvme/media, /mnt/tank/media]
            systemd_requires: [/mnt/tank]
        nas_storage_exports:
          - {path: /export/tv, bind_source: /mnt/tank/tv}
          - {path: /export/media, bind_source: /mnt/media}
          - {path: /export/local, bind_source: /srv/local, zfs: false}
          - {path: /export/other, bind_source: /srv/pool2/data, zfs: true}

    - name: Drive the classification guard — an undeclared out-of-roots export
      block:
        - name: Include the guard with an undeclared export bind source
          ansible.builtin.include_tasks: ../../tasks/assert_zfs_classification.yml
          vars:
            nas_storage_zfs_mount_roots: [/mnt/tank]
            nas_storage_zfs_bind_source_pattern: "^(/mnt/tank)/"
            nas_storage_mergerfs_mounts: []
            nas_storage_exports:
              - {path: /export/other, bind_source: /srv/pool2/data}
      rescue:
        # Pinned to the message of the assert this case exists to trip: a bare
        # `true` here would record success for ANY failure, including a typo in
        # the fabricated inventory above.
        - name: Record that the undeclared export was rejected
          ansible.builtin.set_fact:
            nas_classify_export_rejected: >-
              {{ 'outside nas_storage_zfs_mount_roots' in (ansible_failed_result | to_json) }}

    - name: Drive the classification guard — a union anchored on nothing
      block:
        - name: Include the guard with a union whose branches are the roots themselves
          ansible.builtin.include_tasks: ../../tasks/assert_zfs_classification.yml
          vars:
            nas_storage_zfs_mount_roots: [/mnt/tank, /mnt/nvme]
            nas_storage_zfs_bind_source_pattern: "^(/mnt/tank|/mnt/nvme)/"
            nas_storage_exports: []
            nas_storage_mergerfs_mounts:
              - name: media
                target: /mnt/media
                sources: [/mnt/nvme, /mnt/tank]
                systemd_requires: [/mnt/tank]
      rescue:
        - name: Record that the unanchored union was rejected
          ansible.builtin.set_fact:
            nas_classify_union_rejected: >-
              {{ 'no branch INSIDE' in (ansible_failed_result | to_json) }}

    # The anchor is derived from the branch set, so a union that never declares
    # systemd_requires is checked too — scoping the guard to that key left the
    # shape it exists to catch invisible whenever the key was absent.
    - name: Drive the classification guard — an unanchored union with no systemd_requires
      block:
        - name: Include the guard with a root-branched union carrying no systemd_requires
          ansible.builtin.include_tasks: ../../tasks/assert_zfs_classification.yml
          vars:
            nas_storage_zfs_mount_roots: [/mnt/tank, /mnt/nvme]
            nas_storage_zfs_bind_source_pattern: "^(/mnt/tank|/mnt/nvme)/"
            nas_storage_exports: []
            nas_storage_mergerfs_mounts:
              - name: media
                target: /mnt/media
                sources: [/mnt/nvme, /mnt/tank]
      rescue:
        - name: Record that the systemd_requires-less union was rejected
          ansible.builtin.set_fact:
            nas_classify_bare_union_rejected: >-
              {{ 'no branch INSIDE' in (ansible_failed_result | to_json) }}

    # `zfs:` is read through `| bool`, which maps a non-boolean to False rather
    # than erroring — so presence alone is not a declaration. An empty string is
    # the realistic shape: `zfs: "{{ some_var }}"` rendering empty.
    - name: Drive the classification guard — a non-boolean `zfs:` value
      block:
        - name: Include the guard with an empty-string zfs declaration
          ansible.builtin.include_tasks: ../../tasks/assert_zfs_classification.yml
          vars:
            nas_storage_zfs_mount_roots: [/mnt/tank]
            nas_storage_zfs_bind_source_pattern: "^(/mnt/tank)/"
            nas_storage_mergerfs_mounts: []
            nas_storage_exports:
              - {path: /export/other, bind_source: /srv/pool2/data, zfs: ""}
      rescue:
        - name: Record that the non-boolean zfs value was rejected
          ansible.builtin.set_fact:
            nas_classify_nonboolean_rejected: >-
              {{ 'Export /export/other declares' in (ansible_failed_result | to_json)
                 and 'not a boolean' in (ansible_failed_result | to_json) }}

    # The type check is its own assert, independent of the classification
    # branch: a value typo on a source the roots DO cover must still be caught.
    - name: Drive the classification guard — a non-boolean `zfs:` on an IN-ROOT export
      block:
        - name: Include the guard with a typo'd zfs on a matching bind source
          ansible.builtin.include_tasks: ../../tasks/assert_zfs_classification.yml
          vars:
            nas_storage_zfs_mount_roots: [/mnt/tank]
            nas_storage_zfs_bind_source_pattern: "^(/mnt/tank)/"
            nas_storage_mergerfs_mounts: []
            nas_storage_exports:
              - {path: /export/tv, bind_source: /mnt/tank/tv, zfs: "maybe"}
      rescue:
        - name: Record that the in-root non-boolean zfs value was rejected
          ansible.builtin.set_fact:
            nas_classify_inroot_nonboolean_rejected: >-
              {{ 'Export /export/tv declares' in (ansible_failed_result | to_json)
                 and 'not a boolean' in (ansible_failed_result | to_json) }}

    - name: Drive the classification guard — a non-boolean `zfs:` on an anchored union
      block:
        - name: Include the guard with a typo'd zfs on a ZFS-branched union
          ansible.builtin.include_tasks: ../../tasks/assert_zfs_classification.yml
          vars:
            nas_storage_zfs_mount_roots: [/mnt/tank]
            nas_storage_zfs_bind_source_pattern: "^(/mnt/tank)/"
            nas_storage_exports: []
            nas_storage_mergerfs_mounts:
              - name: media
                target: /mnt/media
                sources: [/mnt/tank/media]
                zfs: "maybe"
      rescue:
        - name: Record that the anchored-union non-boolean zfs value was rejected
          ansible.builtin.set_fact:
            nas_classify_union_nonboolean_rejected: >-
              {{ 'MergerFS union media declares' in (ansible_failed_result | to_json)
                 and 'not a boolean' in (ansible_failed_result | to_json) }}

    - name: Assert the classification guard fails closed on every shape
      ansible.builtin.assert:
        that:
          - nas_classify_export_rejected | default(false) | bool
          - nas_classify_union_rejected | default(false) | bool
          - nas_classify_bare_union_rejected | default(false) | bool
          - nas_classify_nonboolean_rejected | default(false) | bool
          - nas_classify_inroot_nonboolean_rejected | default(false) | bool
          - nas_classify_union_nonboolean_rejected | default(false) | bool
        fail_msg: >-
          The classification guard accepted an export bind source outside the
          mount roots with no `zfs:` declaration, a union with no branch INSIDE
          a root (with or without systemd_requires), or a non-boolean `zfs:`
          value on EITHER branch — all six fail open into an unguarded,
          unordered mount.
        success_msg: >-
          classification guard fails closed on undeclared exports, unanchored
          unions (systemd_requires or not) and non-boolean zfs values whether or
          not the source matches a mount root

    - name: Drive the remount gate — idle mounts, remount allowed
      ansible.builtin.include_tasks: ../../tasks/mergerfs_remount_gate.yml
      vars:
        nas_storage_mergerfs_needs_remount: true
        nas_storage_mergerfs_nfs_check:
          results:
            - {rc: 0}
        nas_storage_mergerfs_process_check:
          results:
            - {rc: 0}
        nas_storage_mergerfs_mounts:
          - name: media
            target: /mnt/media
        nas_storage_exports:
          - path: /export/media
            bind_source: /mnt/media
            clients:
              - spec: 192.0.2.200/29
              - spec: 192.0.2.154/32
          - path: /export/share
            bind_source: /mnt/tank/share
            clients:
              - spec: 192.0.2.200/29

    - name: Assert the idle path unblocks the remount and scopes the unexport
      ansible.builtin.assert:
        that:
          - nas_storage_mergerfs_safe_to_remount | bool
          - nas_storage_mergerfs_export_bindings | length == 2
          - (nas_storage_mergerfs_export_bindings | map(attribute='0.path')
             | unique | list) == ['/export/media']
          - (nas_storage_mergerfs_export_bindings | map(attribute='1.spec') | list)
            == ['192.0.2.200/29', '192.0.2.154/32']
        fail_msg: >-
          The unexport must be scoped to the MergerFS-backed exports only —
          got {{ nas_storage_mergerfs_export_bindings
                 | map(attribute='0.path') | list }}
        success_msg: "idle path: safe_to_remount true, unexport scoped to /export/media"

    - name: Drive the remount gate — a busy mount blocks the cycle
      ansible.builtin.include_tasks: ../../tasks/mergerfs_remount_gate.yml
      vars:
        nas_storage_mergerfs_needs_remount: true
        nas_storage_mergerfs_nfs_check:
          results:
            - {rc: 0}
        nas_storage_mergerfs_process_check:
          results:
            - {rc: 1}
        nas_storage_mergerfs_mounts:
          - name: media
            target: /mnt/media
        nas_storage_exports: []

    - name: Assert a process holding the mount blocks the remount
      ansible.builtin.assert:
        that:
          - not (nas_storage_mergerfs_safe_to_remount | bool)
        fail_msg: "A busy mount must block the unexport/unmount cycle on a live fileserver"
        success_msg: "busy path: safe_to_remount false"

    - name: Drive the remount gate — an established NFS client blocks the cycle
      ansible.builtin.include_tasks: ../../tasks/mergerfs_remount_gate.yml
      vars:
        nas_storage_mergerfs_needs_remount: true
        nas_storage_mergerfs_nfs_check:
          results:
            - {rc: 1}
        nas_storage_mergerfs_process_check:
          results: []
        nas_storage_mergerfs_mounts:
          - name: media
            target: /mnt/media
        nas_storage_exports: []

    - name: Assert an active NFS client blocks the remount
      ansible.builtin.assert:
        that:
          - not (nas_storage_mergerfs_safe_to_remount | bool)
        fail_msg: "An established NFS client must block the unexport/unmount cycle"
        success_msg: "active-client path: safe_to_remount false"

    # The fstab option string in all four anchor shapes plus both directions of
    # the `zfs:` override, driven from fabricated inventory because the mount
    # needs FUSE. The override unions match the ones the guard above accepts.
    - name: Derive the fstab options for the four anchor shapes and both overrides
      ansible.builtin.include_tasks: ../../tasks/mergerfs_opts.yml
      vars:
        nas_storage_zfs_bind_source_pattern: "^(/mnt/tank|/mnt/nvme)/"
        nas_storage_mergerfs_mounts:
          - name: zfs-with-req
            target: /mnt/media
            sources: [/mnt/nvme/media, /mnt/tank/media]
            options: [defaults, "cache.files=partial"]
            systemd_requires: [/mnt/tank, /mnt/nvme]
          - name: zfs-no-req
            target: /mnt/media2
            sources: [/mnt/nvme/media2, /mnt/tank/media2]
            options: [defaults]
          - name: plain-with-req
            target: /mnt/plain
            sources: [/srv/a, /srv/b]
            options: [defaults]
            systemd_requires: [/srv/a]
          - name: plain-no-req
            target: /mnt/plain2
            sources: [/srv/c, /srv/d]
            options: [defaults]
          # Branches EQUAL to the mount roots never match the pattern, so this
          # union is anchored only because `zfs: true` says so.
          - name: override-true
            target: /mnt/roots
            sources: [/mnt/nvme, /mnt/tank]
            options: [defaults]
            zfs: true
          # Branches inside the roots DO match, so this union is unanchored only
          # because `zfs: false` says so.
          - name: override-false
            target: /mnt/optout
            sources: [/mnt/nvme/optout, /mnt/tank/optout]
            options: [defaults]
            zfs: false

    - name: Assert the anchor is derived from the branch set, not systemd_requires
      ansible.builtin.assert:
        that:
          - nas_storage_mergerfs_fstab_opts['zfs-with-req'] == zfs_anchor ~ req_tank ~ req_nvme
          - nas_storage_mergerfs_fstab_opts['zfs-no-req'] ==
            'defaults,fsname=zfs-no-req,nofail,x-systemd.requires=zfs-mount.service,x-systemd.after=zfs-mount.service'
          - nas_storage_mergerfs_fstab_opts['plain-with-req'] ==
            'defaults,fsname=plain-with-req,nofail,x-systemd.requires-mounts-for=/srv/a'
          - nas_storage_mergerfs_fstab_opts['plain-no-req'] == 'defaults,fsname=plain-no-req'
        fail_msg: "MergerFS fstab options wrong: {{ nas_storage_mergerfs_fstab_opts }}"
        success_msg: "fstab options carry the zfs-mount anchor exactly on the ZFS-branched unions"
      vars:
        zfs_anchor: >-
          defaults,cache.files=partial,fsname=zfs-with-req,nofail,x-systemd.requires=zfs-mount.service,x-systemd.after=zfs-mount.service
        req_tank: ",x-systemd.requires-mounts-for=/mnt/tank"
        req_nvme: ",x-systemd.requires-mounts-for=/mnt/nvme"

    # Both directions, or a dropped `item.zfs | default(...)` would still pass:
    # the derivation alone gets override-true wrong AND override-false right.
    - name: Assert an explicit `zfs:` overrides the derived classification
      ansible.builtin.assert:
        that:
          - nas_storage_mergerfs_fstab_opts['override-true'] ==
            'defaults,fsname=override-true,nofail,x-systemd.requires=zfs-mount.service,x-systemd.after=zfs-mount.service'
          - nas_storage_mergerfs_fstab_opts['override-false'] == 'defaults,fsname=override-false'
        fail_msg: "The explicit `zfs:` override was ignored: {{ nas_storage_mergerfs_fstab_opts }}"
        success_msg: "explicit `zfs:` wins over the branch-set derivation in both directions"

    # The same two unions the opts render above: the guard must ACCEPT both
    # (an explicit boolean is a declaration), including the root-branched one it
    # rejects without it.
    - name: Drive the classification guard — the same explicit `zfs:` overrides
      ansible.builtin.include_tasks: ../../tasks/assert_zfs_classification.yml
      vars:
        nas_storage_zfs_mount_roots: [/mnt/tank, /mnt/nvme]
        nas_storage_zfs_bind_source_pattern: "^(/mnt/tank|/mnt/nvme)/"
        nas_storage_exports: []
        nas_storage_mergerfs_mounts:
          - name: override-true
            target: /mnt/roots
            sources: [/mnt/nvme, /mnt/tank]
            zfs: true
          - name: override-false
            target: /mnt/optout
            sources: [/mnt/nvme/optout, /mnt/tank/optout]
            zfs: false

    # The ARC-cap seam: nas_storage hands nas_storage_zfs_arc_max_bytes and
    # _skip_initramfs to weisssrv.infra.zfs_arc_cap, included independently of
    # the pool work so it is reached even with skip_zfs_operations set.
    - name: Read the rendered ARC modprobe.d file
      ansible.builtin.slurp:
        src: /etc/modprobe.d/zfs.conf
      register: nas_zfs_arc_conf

    - name: Assert the NAS byte count reached the rendered cap
      ansible.builtin.assert:
        that:
          - "'options zfs zfs_arc_max=' ~ nas_storage_zfs_arc_max_bytes
             in (nas_zfs_arc_conf.content | b64decode)"
        fail_msg: >-
          The ARC cap pass-through dropped the byte count:
          {{ nas_zfs_arc_conf.content | b64decode }}
        success_msg: "nas_storage_zfs_arc_max_bytes reaches zfs_arc_cap's modprobe.d render"

# The de-provisioning tasks are included directly, so the role's defaults are
# loaded here for the managed marker they carry, and its handler is mirrored:
# include_tasks (unlike include_role) brings neither into a play.
- name: Verify the de-provisioning path
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - ../../defaults/main.yml
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
  tasks:
    # De-provisioning path (nas_storage_archive_backup_enabled: false), which no
    # other scenario runs because molecule.yml opts in. It runs last: it removes
    # the units the play above inspects.
    - name: Check the archive-backup service is static (no [Install] section)  # noqa command-instead-of-module
      # A static unit has nothing to disable; the enabled-unit case below covers
      # the other half.
      ansible.builtin.command: systemctl is-enabled archive-backup.service
      register: archive_backup_service_enabled
      changed_when: false
      failed_when: archive_backup_service_enabled.stdout | trim != 'static'

    # The ownership test is a plain substring match, so the marker has to be a
    # literal the deployed headers really carry - this role's own templates and
    # the units a delegate role renders for it.
    - name: Read the headers of a role-rendered and a delegate-rendered unit
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: nas_managed_headers
      loop:
        - /etc/systemd/system/archive-backup.service
        - /etc/systemd/system/backup-artifact-mtime-collector.service

    - name: Verify every deployed unit carries the managed marker
      ansible.builtin.assert:
        that:
          - nas_storage_managed_marker in (item.content | b64decode)
        fail_msg: >-
          {{ item.item }} carries no '{{ nas_storage_managed_marker }}' header,
          so the opt-out reads this role's own file as hand-written and leaves
          its timer armed.
        success_msg: "{{ item.item }} carries the managed marker"
      loop: "{{ nas_managed_headers.results }}"
      loop_control:
        label: "{{ item.item }}"

    # include_tasks, not include_role: include_role would also execute the
    # role's meta dependency (weisssrv.infra.base) inside verify. The relative
    # path resolves from this playbook's own directory.
    - name: Run the archive-backup de-provisioning path
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_deprovision_timers: [archive-backup.timer]
        nas_storage_deprovision_static_services: [archive-backup.service]
        nas_storage_deprovision_paths:
          - /usr/local/sbin/archive-backupctl
        nas_storage_deprovision_metrics:
          - "{{ nas_storage_backup_artifact_metrics_dir }}/archive_backup.prom"

    # Call sites name the units, not their paths, so a unit can never be stopped
    # without its file being removed.
    - name: Verify the unit files are derived from the unit names
      ansible.builtin.assert:
        that:
          - "'/etc/systemd/system/archive-backup.timer' in nas_storage_deprovision_all_paths"
          - "'/etc/systemd/system/archive-backup.service' in nas_storage_deprovision_all_paths"
          - "'/usr/local/sbin/archive-backupctl' in nas_storage_deprovision_all_paths"
          - nas_storage_deprovision_all_paths | length == 3
        fail_msg: >-
          The de-provisioning path did not derive its unit files from the unit
          names: {{ nas_storage_deprovision_all_paths }}
        success_msg: "the de-provisioning path derives unit files from unit names"

    - name: Flush handlers so the systemd daemon-reload lands before the checks
      ansible.builtin.meta: flush_handlers

    - name: Stat the de-provisioned archive-backup units and script
      ansible.builtin.stat:
        path: "{{ item }}"
      register: archive_backup_removed
      loop:
        - /etc/systemd/system/archive-backup.timer
        - /etc/systemd/system/archive-backup.service
        - /usr/local/sbin/archive-backupctl

    - name: Check the archive-backup timer is no longer scheduled  # noqa command-instead-of-module
      ansible.builtin.command: systemctl list-timers --all --no-legend
      register: archive_backup_timers
      changed_when: false

    - name: Verify the opt-out removed the units, the script and the schedule
      ansible.builtin.assert:
        that:
          - archive_backup_removed.results | map(attribute='stat.exists') | select | list | length == 0
          - "'archive-backup' not in archive_backup_timers.stdout"
        fail_msg: >-
          nas_storage_archive_backup_enabled: false left artifacts behind:
          {{ archive_backup_removed.results | selectattr('stat.exists')
             | map(attribute='item') | list }}
          / timers: {{ archive_backup_timers.stdout_lines | select('search', 'archive-backup') | list }}
        success_msg: "archive-backup opt-out removed both units, the script and the timer schedule"

    # A component whose service carries an [Install] section must lose its
    # .wants symlink too, or systemd warns on every daemon-reload.
    - name: Deploy an enabled scratch unit for the de-provisioning path
      ansible.builtin.copy:
        dest: /etc/systemd/system/nas-deprovision-probe.service
        mode: "0644"
        content: |
          # {{ nas_storage_managed_marker }}
          [Unit]
          Description=nas_storage de-provisioning probe
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          [Install]
          WantedBy=multi-user.target

    - name: Enable the scratch unit
      ansible.builtin.systemd:
        name: nas-deprovision-probe.service
        enabled: true
        daemon_reload: true

    - name: Run the de-provisioning path on the enabled scratch unit
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_deprovision_timers: []
        nas_storage_deprovision_services: [nas-deprovision-probe.service]

    - name: Flush handlers after the scratch-unit de-provisioning
      ansible.builtin.meta: flush_handlers

    - name: Stat the scratch unit's WantedBy symlink
      ansible.builtin.stat:
        path: /etc/systemd/system/multi-user.target.wants/nas-deprovision-probe.service
      register: nas_deprovision_probe_link

    - name: Verify the de-provisioning path left no dangling .wants symlink
      ansible.builtin.assert:
        that:
          - not nas_deprovision_probe_link.stat.exists
        fail_msg: >-
          de-provisioning removed the unit file but left its multi-user.target
          .wants symlink, so systemd warns on every daemon-reload.
        success_msg: "de-provisioning disables the unit before removing it"

    # The component names are conventional, so a host adopted with a hand-rolled
    # unit of the same name must keep it: no marker, no removal and no stop.
    - name: Deploy an enabled hand-written unit the role never rendered
      ansible.builtin.copy:
        dest: /etc/systemd/system/nas-deprovision-handrolled.service
        mode: "0644"
        content: |
          [Unit]
          Description=Hand-written unit the role must not touch
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          [Install]
          WantedBy=multi-user.target

    - name: Enable the hand-written unit
      ansible.builtin.systemd:
        name: nas-deprovision-handrolled.service
        enabled: true
        daemon_reload: true

    # The .prom follows the unit's ownership verdict: a kept hand-rolled timer
    # keeps writing this series, so deleting it only puts a gap in the graph.
    - name: Seed the hand-written unit's metrics file
      ansible.builtin.copy:
        dest: "{{ nas_storage_backup_artifact_metrics_dir }}/nas_deprovision_handrolled.prom"
        content: "nas_deprovision_handrolled 1\n"
        mode: "0644"

    - name: Run the de-provisioning path on the hand-written unit
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_deprovision_services: [nas-deprovision-handrolled.service]
        nas_storage_deprovision_metrics:
          - "{{ nas_storage_backup_artifact_metrics_dir }}/nas_deprovision_handrolled.prom"

    - name: Stat the hand-written unit, its WantedBy symlink and its metrics file
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nas_deprovision_handrolled
      loop:
        - /etc/systemd/system/nas-deprovision-handrolled.service
        - /etc/systemd/system/multi-user.target.wants/nas-deprovision-handrolled.service
        - "{{ nas_storage_backup_artifact_metrics_dir }}/nas_deprovision_handrolled.prom"

    - name: Verify the de-provisioning path kept the hand-written unit
      ansible.builtin.assert:
        that:
          - nas_deprovision_handrolled.results | map(attribute='stat.exists') | select | list | length == 3
          - nas_storage_deprovision_managed | length == 0
        fail_msg: >-
          The de-provisioning path stopped or removed a unit carrying no
          '{{ nas_storage_managed_marker }}' marker, or deleted the .prom that
          unit still writes.
        success_msg: "the de-provisioning path leaves a hand-written unit and its metrics in place"

    - name: Delete the hand-written unit's metrics fixture
      ansible.builtin.file:
        path: "{{ nas_storage_backup_artifact_metrics_dir }}/nas_deprovision_handrolled.prom"
        state: absent

    - name: Remove the hand-written unit fixture
      ansible.builtin.systemd:
        name: nas-deprovision-handrolled.service
        enabled: false
        state: stopped
        daemon_reload: true

    - name: Delete the hand-written unit fixture file
      ansible.builtin.file:
        path: /etc/systemd/system/nas-deprovision-handrolled.service
        state: absent

    # A declared path that is not a regular file cannot be classified, so it must
    # fail rather than read as a hand-written unit and skip the whole component.
    - name: Reject path — a declared component path that is not a regular file
      block:
        - name: De-provision with a directory in the declared path list
          ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
          vars:
            nas_storage_deprovision_services: []
            nas_storage_deprovision_paths: [/etc/systemd/system]
      rescue:
        - name: Record that the non-file path was refused
          ansible.builtin.set_fact:
            nas_deprovision_nonfile_refused: true

    - name: Verify a declared path that is not a regular file fails the play
      ansible.builtin.assert:
        that:
          - nas_deprovision_nonfile_refused | default(false) | bool
        fail_msg: >-
          A directory in nas_storage_deprovision_paths read as a hand-written
          unit, so the component was silently left deployed.
        success_msg: "a declared component path that is not a regular file fails the play"

    - name: Deploy a role-written scratch unit for the manage_absent gate
      ansible.builtin.copy:
        dest: /etc/systemd/system/nas-deprovision-optout.service
        mode: "0644"
        content: |
          # {{ nas_storage_managed_marker }}
          [Unit]
          Description=nas_storage manage_absent probe
          [Service]
          Type=oneshot
          ExecStart=/bin/true

    - name: Run the de-provisioning path with nas_storage_manage_absent false
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_manage_absent: false
        nas_storage_deprovision_static_services: [nas-deprovision-optout.service]

    - name: Stat the scratch unit the opt-out must leave alone
      ansible.builtin.stat:
        path: /etc/systemd/system/nas-deprovision-optout.service
      register: nas_deprovision_optout

    - name: Verify nas_storage_manage_absent false removes nothing
      ansible.builtin.assert:
        that:
          - nas_deprovision_optout.stat.exists
        fail_msg: >-
          nas_storage_manage_absent: false still removed
          /etc/systemd/system/nas-deprovision-optout.service
        success_msg: "nas_storage_manage_absent: false leaves a deployed component alone"

    - name: Delete the manage_absent scratch unit
      ansible.builtin.file:
        path: /etc/systemd/system/nas-deprovision-optout.service
        state: absent

    # An empty marker matches every file, so the ownership test that keeps a
    # hand-written unit would pass for every declared path.
    - name: Deploy a role-written scratch unit for the empty-marker gate
      ansible.builtin.copy:
        dest: /etc/systemd/system/nas-deprovision-marker.service
        mode: "0644"
        content: |
          # {{ nas_storage_managed_marker }}
          [Unit]
          Description=nas_storage empty-marker probe
          [Service]
          Type=oneshot
          ExecStart=/bin/true

    - name: Reject path — an empty managed marker must fail the de-provisioning
      block:
        - name: De-provision with an empty nas_storage_managed_marker
          ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
          vars:
            nas_storage_managed_marker: ""
            nas_storage_deprovision_static_services: [nas-deprovision-marker.service]
      rescue:
        - name: Record that the empty marker was refused
          ansible.builtin.set_fact:
            nas_deprovision_marker_refused: true
          when: ansible_failed_task.name == 'Assert the managed-file marker is usable'

    - name: Stat the scratch unit the empty-marker run must leave alone
      ansible.builtin.stat:
        path: /etc/systemd/system/nas-deprovision-marker.service
      register: nas_deprovision_marker_unit

    - name: Verify an empty managed marker fails the play and keeps the unit
      ansible.builtin.assert:
        that:
          - nas_deprovision_marker_refused | default(false) | bool
          - nas_deprovision_marker_unit.stat.exists
        fail_msg: >-
          An empty nas_storage_managed_marker did not fail the de-provisioning,
          so every declared path tests as role-written and a hand-written unit
          would be removed.
        success_msg: "an empty nas_storage_managed_marker fails the de-provisioning"

    - name: Delete the empty-marker scratch unit
      ansible.builtin.file:
        path: /etc/systemd/system/nas-deprovision-marker.service
        state: absent

    - name: Reject path — a component naming nothing must fail the de-provisioning
      block:
        - name: De-provision with every component list empty
          ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
          vars:
            nas_storage_deprovision_timers: []
            nas_storage_deprovision_services: []
            nas_storage_deprovision_static_services: []
            nas_storage_deprovision_paths: []
            nas_storage_deprovision_metrics: []
      rescue:
        - name: Record that the empty component was refused
          ansible.builtin.set_fact:
            nas_deprovision_empty_refused: true
          when: ansible_failed_task.name == 'Assert the component named something to de-provision'

    - name: Verify a component naming nothing fails the play
      ansible.builtin.assert:
        that:
          - nas_deprovision_empty_refused | default(false) | bool
        fail_msg: >-
          A de-provisioning call naming no units and no paths did not fail, so a
          caller typo would stop and remove nothing without saying so.
        success_msg: "a de-provisioning call naming nothing fails the play"

    # The stat gate must make this a no-op, which is what keeps `systemctl stop`
    # off a unit that no longer exists.
    - name: Re-run the de-provisioning path on the now-clean host
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_deprovision_timers: [archive-backup.timer]
        nas_storage_deprovision_static_services: [archive-backup.service]
        nas_storage_deprovision_paths:
          - /usr/local/sbin/archive-backupctl
        nas_storage_deprovision_metrics:
          - "{{ nas_storage_backup_artifact_metrics_dir }}/archive_backup.prom"

    - name: Re-stat the de-provisioned archive-backup units and script
      ansible.builtin.stat:
        path: "{{ item }}"
      register: archive_backup_still_absent
      loop:
        - /etc/systemd/system/archive-backup.timer
        - /etc/systemd/system/archive-backup.service
        - /usr/local/sbin/archive-backupctl

    - name: Verify the second de-provisioning run took the no-op path
      ansible.builtin.assert:
        that:
          - nas_storage_deprovision_probe.results | selectattr('stat.exists') | list | length == 0
          - archive_backup_still_absent.results | map(attribute='stat.exists') | select | list | length == 0
        fail_msg: >-
          The de-provisioning path did not see a clean host on the second run -
          the stat gate no longer protects `systemctl stop` on an absent unit.
        success_msg: "the de-provisioning path is a no-op on an already-clean host"

    # A component whose first declared path is already gone must still be
    # stopped: the probe covers the whole set, not just the first entry.
    - name: Seed a surviving archive-backup service with its timer already gone
      ansible.builtin.copy:
        dest: /etc/systemd/system/archive-backup.service
        content: |
          # {{ nas_storage_managed_marker }}
          [Unit]
          Description=Partially removed archive backup
          [Service]
          Type=oneshot
          ExecStart=/bin/true
        mode: "0644"

    - name: Run the de-provisioning path against the partial remains
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_deprovision_timers: [archive-backup.timer]
        nas_storage_deprovision_static_services: [archive-backup.service]
        nas_storage_deprovision_paths:
          - /usr/local/sbin/archive-backupctl

    - name: Verify the probe saw the surviving unit behind an absent first path
      ansible.builtin.assert:
        that:
          - nas_storage_deprovision_probe.results | selectattr('stat.exists') | list | length == 1
        fail_msg: >-
          The de-provisioning probe read only its first path, so a partially
          removed component is deleted without ever being stopped or disabled.
        success_msg: "the de-provisioning probe covers every declared path"

    - name: Re-stat the partially removed archive-backup service
      ansible.builtin.stat:
        path: /etc/systemd/system/archive-backup.service
      register: archive_backup_partial_removed

    - name: Verify the partial remains were removed too
      ansible.builtin.assert:
        that:
          - not archive_backup_partial_removed.stat.exists
        fail_msg: "the de-provisioning path left a surviving unit file behind"
        success_msg: "the de-provisioning path removes partial remains"

    # The same converge-on-opt-out contract for the components that share
    # tasks/deprovision_units.yml. Runs last: it removes units the assertions
    # above inspect.
    - name: De-provision the media mover
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_deprovision_timers: [media-mover.timer]
        nas_storage_deprovision_services: [media-mover.service]
        nas_storage_deprovision_paths:
          - /usr/local/sbin/media-mover.sh
        nas_storage_deprovision_metrics:
          - "{{ nas_storage_backup_artifact_metrics_dir }}/media_mover.prom"

    - name: De-provision swap-clean
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_deprovision_timers: [swap-clean.timer]
        nas_storage_deprovision_services: [swap-clean.service]
        nas_storage_deprovision_paths:
          - /usr/local/sbin/swap-clean.sh
        nas_storage_deprovision_metrics:
          - "{{ nas_storage_backup_artifact_metrics_dir }}/swap_clean.prom"

    - name: De-provision the backup-artifact collector
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_deprovision_timers: [backup-artifact-mtime-collector.timer]
        nas_storage_deprovision_services: [backup-artifact-mtime-collector.service]
        nas_storage_deprovision_paths:
          - /usr/local/sbin/backup-artifact-mtime-collector.sh
        nas_storage_deprovision_metrics:
          - "{{ nas_storage_backup_artifact_metrics_dir }}/backup_artifact_mtime.prom"

    - name: Flush handlers so the systemd daemon-reload lands before the checks
      ansible.builtin.meta: flush_handlers

    - name: Stat the de-provisioned component units and scripts
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nas_components_removed
      loop:
        - /etc/systemd/system/media-mover.timer
        - /etc/systemd/system/media-mover.service
        - /usr/local/sbin/media-mover.sh
        - /etc/systemd/system/swap-clean.timer
        - /etc/systemd/system/swap-clean.service
        - /usr/local/sbin/swap-clean.sh
        - /etc/systemd/system/backup-artifact-mtime-collector.timer
        - /etc/systemd/system/backup-artifact-mtime-collector.service
        - /usr/local/sbin/backup-artifact-mtime-collector.sh
        - "{{ nas_storage_backup_artifact_metrics_dir }}/media_mover.prom"
        - "{{ nas_storage_backup_artifact_metrics_dir }}/swap_clean.prom"
        - "{{ nas_storage_backup_artifact_metrics_dir }}/backup_artifact_mtime.prom"
        - "{{ nas_storage_backup_artifact_metrics_dir }}/archive_backup.prom"

    - name: List the remaining timers  # noqa command-instead-of-module
      ansible.builtin.command: systemctl list-timers --all --no-legend
      register: nas_components_timers
      changed_when: false

    - name: Verify each opt-out removed its units, script and schedule
      ansible.builtin.assert:
        that:
          - nas_components_removed.results | map(attribute='stat.exists') | select | list | length == 0
          - "'media-mover' not in nas_components_timers.stdout"
          - "'swap-clean' not in nas_components_timers.stdout"
          - "'backup-artifact-mtime-collector' not in nas_components_timers.stdout"
        fail_msg: >-
          A flipped-off component left an armed timer, or a frozen .prom whose
          staleness alert can never clear:
          {{ nas_components_removed.results | selectattr('stat.exists')
             | map(attribute='item') | list }}
        success_msg: "every opt-out removes its units, script, timer and .prom"

    # Partial state: the unit file is already gone but the script survives, so
    # `systemctl stop` would hard-fail on a unit systemd cannot load.
    - name: Deploy only the script half of a de-provisioned component
      ansible.builtin.copy:
        dest: /usr/local/sbin/nas-deprovision-partial.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # {{ nas_storage_managed_marker }}
          exit 0

    - name: Run the de-provisioning path with the unit file already absent
      ansible.builtin.include_tasks: ../../tasks/deprovision_units.yml
      vars:
        nas_storage_deprovision_timers: [nas-deprovision-partial.timer]
        nas_storage_deprovision_services: [nas-deprovision-partial.service]
        nas_storage_deprovision_paths:
          - /usr/local/sbin/nas-deprovision-partial.sh

    - name: Stat the surviving script after the partial de-provisioning
      ansible.builtin.stat:
        path: /usr/local/sbin/nas-deprovision-partial.sh
      register: nas_deprovision_partial_script

    - name: Verify a partially removed component converges instead of failing
      ansible.builtin.assert:
        that:
          - not nas_deprovision_partial_script.stat.exists
        fail_msg: >-
          The de-provisioning path left /usr/local/sbin/nas-deprovision-partial.sh
          behind, so a host whose unit files are already gone never converges.
        success_msg: "de-provisioning clears a leftover script with no unit file present"
