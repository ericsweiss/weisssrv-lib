---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - nfs-kernel-server
          - samba
          - systemd
        state: present
      when: ansible_os_family == "Debian"

    - name: Create mock ZFS mount points for testing
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /tank/media/unified
        - /tank/media
        - /nvme/media

  roles:
    - role: weisssrv.infra.nas_storage
