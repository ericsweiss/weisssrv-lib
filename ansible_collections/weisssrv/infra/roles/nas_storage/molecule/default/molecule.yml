---
platforms:
  - name: nas-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        admin_user: root
        admin_email: test@test.local
        internal_domain: test.local
        base_skip_ssh_config: true
        base_skip_dns_config: true
        nas_storage_exports:
          - path: /tank/media/unified
            clients:
              - spec: 192.0.2.0/24
                options: ro,sync,no_subtree_check
          - path: /tank/appdata/tls
            xprtsec: tls
            clients:
              - spec: 192.0.2.200/29
                options: rw,sync,no_subtree_check,fsid=91
              - spec: 192.0.2.220/29
                options: rw,sync,no_subtree_check,fsid=91
          - path: /tank/media/mixed
            clients:
              - spec: 192.0.2.200/29
                options: rw,sync,no_subtree_check,fsid=92
                xprtsec: tls
              - spec: 192.0.2.154/32
                options: ro,sync,no_subtree_check,fsid=92
          # bind_source exports: one on an encrypted dataset, one plaintext,
          # so verify.yml can assert the fstab _zfs_anchor split and the
          # nfs-server drop-in scoping.
          - path: /export/appdata
            bind_source: /mnt/ssd/appdata
            clients:
              - spec: 192.0.2.200/29
                options: rw,sync,no_subtree_check,fsid=93
          - path: /export/share
            bind_source: /mnt/tank/share
            clients:
              - spec: 192.0.2.200/29
                options: rw,sync,no_subtree_check,fsid=94
          # Per-app exports, each bind_source a subdir of an encrypted dataset,
          # with bind_source_check pointing the mounted-dataset guard at the
          # parent. Covers TLS and plaintext exports scoped to one writer each.
          - path: /export/backups-apps/authentik
            bind_source: /mnt/tank/backups/apps/authentik
            bind_source_check: /mnt/tank/backups
            owner: 1000
            group: 2000
            mode: "02775"
            xprtsec: tls
            clients:
              - spec: 192.0.2.200/29
                options: rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=96
          - path: /export/backups-apps/gitlab
            bind_source: /mnt/tank/backups/apps/gitlab
            bind_source_check: /mnt/tank/backups
            owner: 1000
            group: 2000
            mode: "02775"
            xprtsec: tls
            clients:
              - spec: 192.0.2.153/32
                options: rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=97
          - path: /export/backups-apps/home-assistant
            bind_source: /mnt/tank/backups/apps/home-assistant
            bind_source_check: /mnt/tank/backups
            owner: 1000
            group: 2000
            mode: "02775"
            clients:
              - spec: 192.0.2.154/32
                options: rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=98
          # Explicit `zfs:` classification, both directions. Both bind sources
          # sit outside nas_storage_zfs_mount_roots, so the key is what decides
          # and verify asserts the rendered fstab opts differ accordingly.
          - path: /export/declared-plain
            bind_source: /srv/plainbind
            zfs: false
            clients:
              - spec: 192.0.2.200/29
                options: rw,sync,no_subtree_check,fsid=99
          - path: /export/declared-zfs
            bind_source: /srv/pool2/data
            zfs: true
            clients:
              - spec: 192.0.2.200/29
                options: rw,sync,no_subtree_check,fsid=100
        nas_storage_encrypted_bind_sources:
          - /mnt/ssd/appdata
          - /mnt/tank/backups/apps/authentik
          - /mnt/tank/backups/apps/gitlab
          - /mnt/tank/backups/apps/home-assistant
        nas_storage_backup_apps_base: /mnt/tank/backups/apps
        nas_storage_backup_artifact_metrics_enabled: true
        # Site data (default []). verify.yml drives the collector against these:
        # the gitlab entry pins the sidecar-vs-artefact split (the pattern must
        # exclude gitlab.rb/gitlab-secrets.json) and the companion metrics.
        nas_storage_backup_artifact_apps:
          - name: gitlab
            pattern: "*_gitlab_backup.tar"
            companions:
              - "gitlab-secrets.json"
          - name: home-assistant
            pattern: "Automatic_backup_*.tar"
          - name: pve-cluster
            pattern: "etc-pve-*.tar.gz"
        # /etc/pve archive. The container has no pmxcfs, so verify points the
        # script at a synthetic SRC to exercise the real tar/validate/retention
        # path (and asserts the absent-source arm fails loudly).
        nas_storage_pve_cluster_backup_enabled: true
        nas_storage_pve_cluster_backup_keep: 2
        # Site data (default []), but verify.yml asserts the per-app dirs are
        # created with the squash owner — the scenario supplies its own list.
        nas_storage_appdata_dirs:
          - grafana
          - sonarr
        # A realistic multi-pool source set: files/archive-contract-assert.sh
        # pins the derivations (MAP/RMAP, lock list, restore targets, the
        # root-is-a-filesystem allow-list) against exactly these entries.
        nas_storage_archive_backup_enabled: true
        nas_storage_archive_backup_pool: archive
        nas_storage_archive_backup_vzdump_target: tank/proxmox
        nas_storage_archive_backup_sources:
          - tank/share
          - tank/backups
          - tank/nextcloud-data
          - tank/proxmox
          - tank/immich-data
          - ssd/appdata
          - ssd/databases
          - ssd/k3s-etcd
        # The library defaults carry no restic-offsite.service: it ships from the
        # independently opt-in restic_offsite role. Both seams are driven here.
        nas_storage_archive_backup_on_success_units:
          - restic-offsite.service
        nas_storage_swap_clean_conflicting_units:
          - restic-offsite.service
          - archive-backup.service
          - media-mover.service
        nas_storage_media_mover_enabled: true
        nas_storage_media_mover_src: /mnt/nvme/media/library
        nas_storage_media_mover_dst: /mnt/tank/media/library
        nas_storage_swap_clean_enabled: true
        # Exercise the guest-stop recovery render path (join of the candidate list)
        # so a Jinja error in swap-clean.sh.j2 fails converge. The script is only
        # deployed here, never run, so the placeholder vmids are inert.
        nas_storage_swap_clean_stop_guests:
          - "999:test-guest:60"
        nas_storage_samba_shares:
          - name: media
            path: /tank/media/unified
            read_only: true
            guest_ok: false
        # ARC cap pass-through to weisssrv.infra.zfs_arc_cap; verify.yml
        # asserts this byte count reaches the rendered modprobe.d file.
        # skip_initramfs suppresses the rebuild handler.
        nas_storage_zfs_arc_max_bytes: "8589934592"
        nas_storage_zfs_arc_skip_initramfs: true
        # Delegation kill-switch: verify.yml asserts the sysctl.d drop-in lands
        # with fs.leases-enable=0. Live apply stays off, since the knob is not
        # container-namespaced and would reach the CI host's kernel.
        nas_storage_nfs_disable_delegations: true
        nas_storage_nfs_apply_delegation_sysctl_live: false
        nas_storage_skip_zfs_operations: true
        nas_storage_skip_mergerfs: true
        nas_storage_skip_nfs_reload: true
        nas_storage_skip_smartd_service: true
