---
platforms:
  - name: nas-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        admin_user: root
        admin_email: test@test.local
        internal_domain: test.local
        base_skip_ssh_config: true
        base_skip_dns_config: true
        nas_storage_exports:
          - path: /tank/media/unified
            clients:
              - spec: 192.168.0.0/24
                options: ro,sync,no_subtree_check
          - path: /tank/appdata/tls
            xprtsec: tls
            clients:
              - spec: 192.168.0.200/29
                options: rw,sync,no_subtree_check,fsid=91
              - spec: 192.168.0.220/29
                options: rw,sync,no_subtree_check,fsid=91
          - path: /tank/media/mixed
            clients:
              - spec: 192.168.0.200/29
                options: rw,sync,no_subtree_check,fsid=92
                xprtsec: tls
              - spec: 192.168.0.154/32
                options: ro,sync,no_subtree_check,fsid=92
          # bind_source exports: one on an encrypted dataset, one plaintext, so
          # the fstab _zfs_anchor split (zfs-mount-encrypted.service vs
          # zfs-mount.service) and the nfs-server drop-in scoping are asserted
          # in verify.yml. The dirs are plain container paths — the mounted-
          # dataset guard is bypassed by nas_storage_skip_zfs_operations.
          - path: /export/appdata
            bind_source: /mnt/ssd/appdata
            clients:
              - spec: 192.168.0.200/29
                options: rw,sync,no_subtree_check,fsid=93
          - path: /export/share
            bind_source: /mnt/tank/share
            clients:
              - spec: 192.168.0.200/29
                options: rw,sync,no_subtree_check,fsid=94
          # backups-apps: PER-APP exports, each bind_source a SUBDIR of an
          # (encrypted) dataset — bind_source_check points the mounted-dataset
          # guard at the parent and the fstab anchor uses the late
          # zfs-mount-encrypted.service. Exercises the isolation split: a k3s
          # require-TLS export, a VM require-TLS export (gitlab, now on the wire),
          # and the HAOS plaintext export — each scoped to a single writer. The
          # subdirs are created + owned as bind sources (no dedicated subdir task).
          - path: /export/backups-apps/authentik
            bind_source: /mnt/tank/backups/apps/authentik
            bind_source_check: /mnt/tank/backups
            owner: 1000
            group: 2000
            mode: "02775"
            xprtsec: tls
            clients:
              - spec: 192.168.0.200/29
                options: rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=96
          - path: /export/backups-apps/gitlab
            bind_source: /mnt/tank/backups/apps/gitlab
            bind_source_check: /mnt/tank/backups
            owner: 1000
            group: 2000
            mode: "02775"
            xprtsec: tls
            clients:
              - spec: 192.168.0.153/32
                options: rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=97
          - path: /export/backups-apps/home-assistant
            bind_source: /mnt/tank/backups/apps/home-assistant
            bind_source_check: /mnt/tank/backups
            owner: 1000
            group: 2000
            mode: "02775"
            clients:
              - spec: 192.168.0.154/32
                options: rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=98
        nas_storage_encrypted_bind_sources:
          - /mnt/ssd/appdata
          - /mnt/tank/backups/apps/authentik
          - /mnt/tank/backups/apps/gitlab
          - /mnt/tank/backups/apps/home-assistant
        nas_storage_backup_apps_base: /mnt/tank/backups/apps
        nas_storage_backup_artifact_metrics_enabled: true
        # A realistic multi-pool source set: files/archive-contract-assert.sh
        # pins the derivations (MAP/RMAP, lock list, restore targets, the
        # root-is-a-filesystem allow-list) against exactly these entries.
        nas_storage_archive_backup_enabled: true
        nas_storage_archive_backup_pool: archive
        nas_storage_archive_backup_vzdump_target: tank/proxmox
        nas_storage_archive_backup_sources:
          - tank/share
          - tank/backups
          - tank/nextcloud-data
          - tank/proxmox
          - tank/immich-data
          - ssd/appdata
          - ssd/databases
          - ssd/k3s-etcd
        nas_storage_media_mover_enabled: true
        nas_storage_media_mover_src: /mnt/nvme/media/library
        nas_storage_media_mover_dst: /mnt/tank/media/library
        nas_storage_swap_clean_enabled: true
        # Exercise the guest-stop recovery render path (join of the candidate list)
        # so a Jinja error in swap-clean.sh.j2 fails converge. The script is only
        # deployed here, never run, so the placeholder vmids are inert.
        nas_storage_swap_clean_stop_guests:
          - "999:test-guest:60"
        nas_storage_samba_shares:
          - name: media
            path: /tank/media/unified
            read_only: true
            guest_ok: false
        nas_storage_skip_zfs_operations: true
        nas_storage_skip_mergerfs: true
        nas_storage_skip_nfs_reload: true
        nas_storage_skip_smartd_service: true
