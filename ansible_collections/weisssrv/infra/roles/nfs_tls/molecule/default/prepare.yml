---
# Two preconditions the role expects from the host:
#   1. /etc/ssl/private/{fullchain,privkey}.pem exist (acme_certs distributes
#      them in production). On the client-only host they also simulate a stale
#      pre-least-privilege rollout that the cleanup task must remove.
#   2. tlshd.service must accept `state: started`, so ktls-utils is
#      pre-installed with a /bin/true ExecStart override — the container lacks
#      the AF_TLSH netlink subsystem the real binary needs.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule-shared/tasks/prepare-apt-disable.yml

    - name: Gather facts
      ansible.builtin.setup:

    # Synthetic cert files so the role's preflight assertion passes.
    # In production these are written by acme_certs's homelab-cert-reload.sh.
    - name: Ensure /etc/ssl/private exists
      ansible.builtin.file:
        path: /etc/ssl/private
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Touch synthetic fullchain.pem
      ansible.builtin.copy:
        dest: /etc/ssl/private/fullchain.pem
        content: |
          -----BEGIN CERTIFICATE-----
          synthetic-test-fixture-not-a-real-cert
          -----END CERTIFICATE-----
        owner: root
        group: root
        mode: "0644"

    - name: Touch synthetic privkey.pem
      ansible.builtin.copy:
        dest: /etc/ssl/private/privkey.pem
        content: |
          -----BEGIN PRIVATE KEY-----
          synthetic-test-fixture-not-a-real-key
          -----END PRIVATE KEY-----
        owner: root
        group: root
        mode: "0600"

    # Pre-install ktls-utils so the unit file exists for the drop-in below to
    # override (and the role's own apt step becomes a fast no-op).
    - name: Pre-install ktls-utils
      ansible.builtin.apt:
        name: ktls-utils
        state: present
        update_cache: true

    # Replace tlshd's ExecStart with /bin/true: without it the role's final
    # `systemd: state: started` fails in a container, because the kernel-TLS
    # handshake netlink family the real binary needs isn't compiled in.
    - name: Create tlshd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/tlshd.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop in test-only no-op ExecStart override
      ansible.builtin.copy:
        dest: /etc/systemd/system/tlshd.service.d/molecule-test-noop.conf
        content: |
          # Molecule-only override, NEVER deployed to production hosts.
          [Service]
          ExecStart=
          ExecStart=/bin/true
          Type=oneshot
          RemainAfterExit=yes
        owner: root
        group: root
        mode: "0644"

    - name: Reload systemd to pick up the drop-in
      ansible.builtin.systemd:
        daemon_reload: true

    # Opted-out host precondition: simulate a host that WAS running NFS-TLS
    # before nfs_tls_enabled flipped false. Stage the enabled unit + a stale
    # /etc/tlshd.conf so the role's de-list reconcile has something to undo.
    # Gated on the opted-out host only (nfs_tls_enabled: false in host_vars).
    - name: Stage opted-out precondition (enabled tlshd + stale config)
      when: not (nfs_tls_enabled | default(true))
      block:
        - name: Enable and start tlshd on the opted-out host
          ansible.builtin.systemd:
            name: tlshd.service
            enabled: true
            state: started

        - name: Write a stale /etc/tlshd.conf on the opted-out host
          ansible.builtin.copy:
            dest: /etc/tlshd.conf
            content: |
              # Stale pre-opt-out config; the role's reconcile must remove this.
              [authenticate.client]
              x509.truststore = /etc/ssl/certs/ca-certificates.crt
            owner: root
            group: root
            mode: "0644"
