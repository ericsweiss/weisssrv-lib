---
# Installs and configures tlshd (kernel TLS handshake daemon) for use
# by NFSv4's xprtsec=tls/mtls. Idempotent; safe to re-run.
- name: Install ktls-utils (provides tlshd)
  ansible.builtin.apt:
    name:
      # tlshd (the TLS handshake daemon xprtsec=tls requires)
      - ktls-utils
      # mount.nfs — without the userspace helper the kernel fsconfig() fails
      # with "NFS: mount program didn't pass remote address".
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - nfs_tls_enabled | default(false)
    - ansible_facts['os_family'] == "Debian"

# Refuse to start tlshd before the cert files exist: it would either crash-loop
# or return the wrong handshake at the next NFS mount.
- name: Verify cert + key + truststore are present before starting tlshd
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ nfs_tls_cert_path }}"
    - "{{ nfs_tls_key_path }}"
    # tlshd fails to start on a missing truststore path without saying so, so
    # an overridden nfs_tls_truststore is stat'd up front.
    - "{{ nfs_tls_truststore }}"
  register: nfs_tls_files
  when: nfs_tls_enabled | default(false)

- name: Assert cert + key + truststore exist
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item }} missing — for the cert (and the key, on a server or
      mTLS client), run the site's weisssrv.infra.acme_certs distribution play
      first so the wildcard cert/key reaches this host. For the truststore, verify
      nfs_tls_truststore points at a real CA bundle (default
      /etc/ssl/certs/ca-certificates.crt is from the `ca-certificates` package).
  loop: "{{ nfs_tls_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - nfs_tls_enabled | default(false)
    # xprtsec=tls clients present no cert, so they need only the truststore.
    # The cert AND key (which tlshd.conf.j2 emits together) are required only on
    # an NFS server or an mTLS client — otherwise a least-privilege client where
    # neither is distributed would fail this preflight.
    - >-
      item.item == nfs_tls_truststore
      or (item.item in [nfs_tls_cert_path, nfs_tls_key_path]
          and ((nfs_tls_is_server | default(false)) or (nfs_tls_client_cert | default(false))))

# tlshd loads a loose-permission key silently, so the mode is verified here
# (README "Private-key least privilege"). Require 0600 or 0400: this rejects
# group/other-readable modes AND owner-unreadable ones (0000/0200) that would
# silently break tlshd's key load.
- name: Assert private key is owner-readable + not group/other-readable (0600/0400)
  ansible.builtin.assert:
    that:
      - item.stat.mode is match('^0?[46]00$')
    fail_msg: >-
      {{ item.item }} has mode {{ item.stat.mode }} — the TLS private key
      must be 0600 (no group/other access). Tighten with
      `chmod 600 {{ item.item }}` and check the cert distribution's key_mode
      for this host.
    quiet: true
  loop: "{{ nfs_tls_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - nfs_tls_enabled | default(false)
    # Same gating as the existence check: the key only lives on a server or
    # mTLS client, so only there is its mode our concern.
    - (nfs_tls_is_server | default(false)) or (nfs_tls_client_cert | default(false))
    - item.item == nfs_tls_key_path
    - item.stat.exists

- name: Ensure /etc/tlshd.conf exists with our config
  ansible.builtin.template:
    src: tlshd.conf.j2
    dest: /etc/tlshd.conf
    owner: root
    group: root
    mode: "0644"
  when: nfs_tls_enabled | default(false)
  notify: Restart tlshd

- name: Enable and start tlshd
  ansible.builtin.systemd:
    name: tlshd.service
    enabled: true
    state: started
    daemon_reload: true
  when: nfs_tls_enabled | default(false)

# Client-only hosts need neither PEM under xprtsec=tls, and a wildcard key must
# not linger from an earlier rollout. Skipped on the NFS server and on an mTLS
# client, which legitimately keep it. nfs_tls_scrub_client_cert exists because
# these paths are also acme_certs' local install path (see README).
- name: Remove cert + key on client-only hosts (least privilege)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ nfs_tls_cert_path }}"
    - "{{ nfs_tls_key_path }}"
  when:
    - nfs_tls_enabled | default(false)
    - nfs_tls_scrub_client_cert | default(true)
    - not (nfs_tls_is_server | default(false))
    - not (nfs_tls_client_cert | default(false))

# Opt-out reconciliation: flipping nfs_tls_enabled back to false must not leave
# tlshd enabled with a stale /etc/tlshd.conf. Tolerate ONLY the missing-unit
# case — a blanket failed_when: false would mask a typo'd unit name.
- name: Stop and disable tlshd when NFS-TLS is opted out
  ansible.builtin.systemd:
    name: tlshd.service
    enabled: false
    state: stopped
  register: nfs_tls_tlshd_optout
  failed_when:
    - nfs_tls_tlshd_optout is failed
    - "'Could not find the requested service' not in (nfs_tls_tlshd_optout.msg | default(''))"
  when: not (nfs_tls_enabled | default(false))

- name: Remove tlshd configuration when NFS-TLS is opted out
  ansible.builtin.file:
    path: /etc/tlshd.conf
    state: absent
  when: not (nfs_tls_enabled | default(false))
