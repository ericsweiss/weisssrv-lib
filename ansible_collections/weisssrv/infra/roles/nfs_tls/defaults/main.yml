---
# Deploys tlshd (ktls-utils), which NFSv4 `xprtsec=tls`/`mtls` needs to encrypt
# its RPC stream. Floors: kernel 6.5+, nfs-utils 2.6.3+. Opt-in, and both ends
# need it. README carries the rollout order.

nfs_tls_enabled: false

# Is this host an NFS *server* (terminates the server-side TLS handshake)?
# When true, tlshd.conf gets an [authenticate.server] block with the host's
# cert + key. Client-only hosts leave it false.
nfs_tls_is_server: false

# Does the CLIENT present a certificate? Required only for xprtsec=mtls; under
# xprtsec=tls this stays false and the client block omits the private key.
# See README "Private-key least privilege".
nfs_tls_client_cert: false

# Cert + key paths. Defaults match the filenames weisssrv.infra.acme_certs
# distributes (fullchain.pem + privkey.pem under /etc/ssl/private/) to the NFS
# server only. Override if a host uses a different cert delivery path.
nfs_tls_cert_path: /etc/ssl/private/fullchain.pem
nfs_tls_key_path: /etc/ssl/private/privkey.pem

# Set true to have this role DELETE nfs_tls_cert_path + nfs_tls_key_path on a
# client-only host, where an xprtsec=tls client needs neither. Off by default:
# those paths are also acme_certs' install path, so another role may own them.
nfs_tls_scrub_client_cert: false

# Truststore for validation: the system CA bundle, so a publicly-issued cert
# validates as-is. Override when using an internal CA.
nfs_tls_truststore: /etc/ssl/certs/ca-certificates.crt
