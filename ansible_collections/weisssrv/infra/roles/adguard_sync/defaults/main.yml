---
# Pushes AdGuard Home config from the primary to the replica. The whole role is
# gated on adguard_sync_enabled, so set it true on the primary only.
adguard_sync_enabled: false

# How often the sync timer fires (systemd OnCalendar).
adguard_sync_schedule: "*:0/5"

# Where the run metrics land; aliases node_exporter_host_textfile_dir so it
# tracks the host's exporter config.
adguard_sync_textfile_dir: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}"

# Two or more replicas: a list of {url, username, password}, the credentials
# falling back to adguard_sync_admin_user / _password. When non-empty it
# replaces the single adguard_sync_replica in the rendered config.
adguard_sync_replicas: []

# Which AdGuard config sections the primary pushes. tlsConfig stays false: cert
# files/paths are host-local and reconciled per host by weisssrv.infra.adguard_home,
# so syncing them would fight the Ansible-managed config on the replica.
adguard_sync_features:
  dns:
    accessLists: true
    serverConfig: true
    rewrites: true
  dhcp:
    serverConfig: true
    staticLeases: true
  generalSettings: true
  queryLogConfig: true
  statsConfig: true
  clientSettings: true
  services: true
  filters: true
  theme: true
  tlsConfig: false

# Required inputs, asserted in tasks/main.yml and documented in the README:
# adguard_sync_version, adguard_sync_origin, adguard_sync_replica (or
# adguard_sync_replicas), adguard_sync_admin_user, adguard_sync_admin_password.
