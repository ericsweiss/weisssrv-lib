---
platforms:
  - name: adguard-sync-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        adguard_sync_enabled: true
        adguard_sync_version: 0.9.2
        # Custom textfile dir so the metrics-writer template's PROM_DIR is proven
        # to track node_exporter_host_textfile_dir (not the hardcoded default).
        node_exporter_host_textfile_dir: /tmp/adg-textfile
        adguard_sync_schedule: '*:0/5'
        adguard_sync_origin: http://192.168.0.150:3000
        adguard_sync_replica: http://192.168.0.160:3000
        adguard_sync_admin_user: admin
        adguard_sync_admin_password: test-password
        adguard_sync_features:
          generalSettings: true
          queryLogConfig: true
          statsConfig: true
          clientSettings: true
          services: true
          filters: true
          dhcp:
            serverConfig: false
            staticLeases: false
          dns:
            serverConfig: true
            accessLists: true
            rewrites: true
