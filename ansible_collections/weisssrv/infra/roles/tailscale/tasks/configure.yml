---
# `tailscale up` runs automatically when TAILSCALE_AUTH_KEY is present in the
# environment; without it the play ends by printing the manual command to run.

- name: Create keyrings directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts['os_family'] == "Debian"

# The key is re-fetched every run (force: true) so an upstream rotation lands
# without manual removal. It is verified in a staging path before install: apt
# already trusts the keyring path, so an unverified install trusts tampering.
- name: Create staging file for Tailscale GPG key
  ansible.builtin.tempfile:
    state: file
    suffix: tailscale-gpg
  register: tailscale_gpg_staging
  changed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == "Debian"

- name: Verify the Tailscale GPG key, then install it
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: Download Tailscale GPG key to staging path
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: "{{ tailscale_gpg_staging.path }}"
        mode: '0644'
        force: true
      changed_when: false

    - name: Verify Tailscale GPG key fingerprint (primary key must match exactly)
      ansible.builtin.shell: |
        set -o pipefail
        # The whole file is installed as trusted, so bind the FULL set of
        # primary keys — matching only the first lets a bundle carrying the
        # pinned key plus an appended primary key pass. Subkey fprs are ignored.
        primary_fprs=$(gpg --show-keys --with-colons {{ tailscale_gpg_staging.path | quote }} 2>/dev/null \
            | awk -F: '/^pub:/{p=1; next} p && /^fpr:/{print $10; p=0}')
        [ "$primary_fprs" = {{ tailscale_gpg_fingerprint | quote }} ]
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install verified Tailscale GPG key
      ansible.builtin.copy:
        src: "{{ tailscale_gpg_staging.path }}"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: '0644'
        remote_src: true
  always:
    - name: Clean up the GPG key staging file
      ansible.builtin.file:
        path: "{{ tailscale_gpg_staging.path }}"
        state: absent
      changed_when: false
      check_mode: false

- name: Add Tailscale repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} main
    state: present
    filename: tailscale
  when: ansible_facts['os_family'] == "Debian"

- name: Install Tailscale (pinned version)
  ansible.builtin.apt:
    name: "tailscale={{ tailscale_version }}"
    state: present
    update_cache: true
    allow_downgrade: true
    allow_change_held_packages: true
  when:
    - ansible_facts['os_family'] == "Debian"

# Hold so a manual `apt upgrade` can't move Tailscale past the pin —
# pkgs.tailscale.com continuously serves newer builds. The install above sets
# allow_change_held_packages, so a pin bump still proceeds through the hold.
- name: Hold Tailscale package to prevent unintended upgrades
  ansible.builtin.dpkg_selections:
    name: tailscale
    selection: hold
  when: ansible_facts['os_family'] == "Debian"

- name: Enable Tailscale service
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true
  when: ansible_facts['os_family'] == "Debian"

# Persisted in a role-owned sysctl.d drop-in (NOT the module's /etc/sysctl.conf
# default, and NOT nic_tuning's 99-nic-tuning-ip-forward.conf — that file is
# deleted by nic_tuning's disable path).
- name: Enable IP forwarding for subnet routing
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_file: /etc/sysctl.d/99-tailscale-ip-forward.conf
    sysctl_set: true
    state: present
    reload: true
  when: tailscale_advertise_routes | length > 0

# Stops ip_forward being re-asserted at boot without forcing the live value to
# 0, since nic_tuning may own ip_forward on the same host. A demoted subnet
# router keeps forwarding until reboot.
- name: Remove ip_forward sysctl drop-in when subnet routing disabled
  ansible.builtin.file:
    path: /etc/sysctl.d/99-tailscale-ip-forward.conf
    state: absent
  when: tailscale_advertise_routes | length == 0

# Keep the drop-in above the single owner of ip_forward. The regexp matches only
# the uncommented directive, leaving the distribution's example line alone.
- name: Remove ip_forward entry from /etc/sysctl.conf
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: '^net\.ipv4\.ip_forward\s*='
    state: absent

- name: Create tailscaled systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d
    state: directory
    mode: '0755'
  when: tailscale_advertise_routes | length > 0

# Bridge/network initialization can reset ip_forward to 0 after systemd-sysctl
# has run, so re-apply it once tailscaled starts (which is after networking).
- name: Persist IP forwarding via tailscaled ExecStartPost
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscaled.service.d/ip-forward.conf
    mode: '0644'
    content: |
      [Service]
      ExecStartPost=-/sbin/sysctl -w net.ipv4.ip_forward=1
  when: tailscale_advertise_routes | length > 0
  notify: Reload and restart tailscaled

- name: Remove IP forwarding drop-in when subnet routing disabled
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d/ip-forward.conf
    state: absent
  when: tailscale_advertise_routes | length == 0
  notify: Reload and restart tailscaled

# A subnet router on a bridging host double-masquerades traffic to guests hosted
# on ITSELF. One nat-only ACCEPT above Tailscale's ts-postrouting jump skips the
# second masquerade; see the README, "Subnet router on a bridging host".
- name: Install subnet-router bridge-masquerade fix script
  ansible.builtin.copy:
    dest: /usr/local/sbin/tailscale-bridge-masq-fix
    mode: '0755'
    content: |
      #!/bin/sh

      # Managed by the weisssrv.infra.tailscale role. Keeps the bridge-local
      # anti-double-masquerade ACCEPT at the top of nat POSTROUTING, above
      # Tailscale's ts-postrouting jump. Idempotent.
      set -u
      # No -s: logger already reaches the journal, and the timer runs every
      # minute.
      log() { logger -t tailscale-bridge-masq-fix -- "$*"; }
      MARK=/run/tailscale-bridge-masq-fix.deferred
      IPT=/usr/sbin/iptables
      [ -x "$IPT" ] || { log "iptables not found at $IPT; skipping"; exit 0; }
      rule='-m physdev --physdev-is-bridged -m mark --mark 0x40000/0xff0000 -j ACCEPT'
      # -w on every call: pve-firewall rewrites iptables on its own loop and
      # holds /run/xtables.lock while it does.
      # Already in slot 1: no netfilter churn on the per-minute timer run.
      [ "$("$IPT" -w 5 -t nat -S POSTROUTING | sed -n 2p)" = "-A POSTROUTING $rule" ] && exit 0
      # Wait (bounded, ~5s) for Tailscale's POSTROUTING jump so the insert below
      # lands ABOVE it.
      n=0
      while [ "$n" -lt 50 ] && ! "$IPT" -w 5 -t nat -C POSTROUTING -j ts-postrouting 2>/dev/null; do
          n=$((n + 1))
          sleep 0.1
      done
      # No jump yet (nftables mode, or a slow boot): inserting now would strand
      # the rule below a later jump, so retry on the timer and mark it once.
      # rc 4 is a resource problem, not an absent rule.
      "$IPT" -w 5 -t nat -C POSTROUTING -j ts-postrouting
      rc=$?
      if [ "$rc" -ne 0 ]; then
          [ "$rc" -eq 4 ] && { log 'iptables reported a resource problem; retrying next run'; exit 0; }
          [ -e "$MARK" ] || { log 'ts-postrouting jump absent; retrying each minute'; : > "$MARK"; }
          exit 0
      fi
      rm -f "$MARK"
      # CRITICAL: insert at slot 1 FIRST, then drop the copies below it. A
      # sweep-then-insert order leaves nat POSTROUTING with no ACCEPT at all
      # for as long as the insert contends for the xtables lock, which is the
      # double-masquerade the rule exists to prevent.
      n=0
      until "$IPT" -w 5 -t nat -I POSTROUTING 1 $rule; do
          n=$((n + 1))
          [ "$n" -lt 10 ] || { log 'insert failed; retrying next timer run'; exit 1; }
          sleep 0.5
      done
      # Delete the lower copies by rule number: a spec delete would take the
      # fresh top one. `-S` line 1 is the policy, so rule number = line - 1.
      while [ "$("$IPT" -w 5 -t nat -S POSTROUTING | grep -c -- "$rule")" -gt 1 ]; do
          num=$("$IPT" -w 5 -t nat -S POSTROUTING | grep -n -- "$rule" | tail -1 | cut -d: -f1)
          "$IPT" -w 5 -t nat -D POSTROUTING $((num - 1)) 2>/dev/null || break
      done
  when: tailscale_advertise_routes | length > 0

# ExecStartPost re-applies the rule only on a tailscaled restart, so a rule wiped
# by a pve-firewall or tailscaled rule rebuild stays gone. The timer re-asserts
# it every minute.
- name: Persist subnet-router bridge-masquerade fix via tailscaled ExecStartPost
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscaled.service.d/bridge-masquerade-fix.conf
    mode: '0644'
    content: |
      [Service]
      ExecStartPost=-/usr/local/sbin/tailscale-bridge-masq-fix
  when: tailscale_advertise_routes | length > 0
  notify: Reload and restart tailscaled

- name: Install the bridge-masquerade fix unit + timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/tailscale-bridge-masq-fix.{{ item.suffix }}"
    mode: '0644'
    content: "{{ item.content }}"
  loop:
    - suffix: service
      content: |
        [Unit]
        Description=Re-assert the Tailscale bridge-local masquerade ACCEPT rule
        After=tailscaled.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/tailscale-bridge-masq-fix
    - suffix: timer
      content: |
        [Unit]
        Description=Periodically re-assert the Tailscale bridge-local masquerade ACCEPT rule

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=1min
        AccuracySec=10s
        Unit=tailscale-bridge-masq-fix.service

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.suffix }}"
  when: tailscale_advertise_routes | length > 0
  register: tailscale_bridge_masq_units

- name: Enable and start the bridge-masquerade fix timer
  ansible.builtin.systemd:
    name: tailscale-bridge-masq-fix.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - tailscale_advertise_routes | length > 0
    - not ansible_check_mode

- name: Restart the bridge-masquerade fix timer on a unit change
  ansible.builtin.systemd:
    name: tailscale-bridge-masq-fix.timer
    state: restarted
    daemon_reload: true
  when:
    - tailscale_advertise_routes | length > 0
    - not ansible_check_mode
    - tailscale_bridge_masq_units is changed

# Drop the override, the units and the script when this host stops being a
# subnet router. The live iptables rule is a no-op without marked bridged
# traffic and clears on the next reboot.
- name: Check whether the bridge-masquerade fix timer is still on disk
  ansible.builtin.stat:
    path: /etc/systemd/system/tailscale-bridge-masq-fix.timer
  register: tailscale_bridge_masq_timer_unit
  when: tailscale_advertise_routes | length == 0

- name: Stop and disable the bridge-masquerade fix timer when subnet routing disabled
  ansible.builtin.systemd:
    name: tailscale-bridge-masq-fix.timer
    enabled: false
    state: stopped
  when:
    - tailscale_advertise_routes | length == 0
    - not ansible_check_mode
    - tailscale_bridge_masq_timer_unit.stat.exists | default(false)

- name: Remove subnet-router bridge-masquerade fix files when subnet routing disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/tailscaled.service.d/bridge-masquerade-fix.conf
    - /etc/systemd/system/tailscale-bridge-masq-fix.timer
    - /etc/systemd/system/tailscale-bridge-masq-fix.service
    - /usr/local/sbin/tailscale-bridge-masq-fix
  when: tailscale_advertise_routes | length == 0
  notify: Reload and restart tailscaled

- name: Check Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Fail when a Tailscale join is required but TAILSCALE_AUTH_KEY is unset
  ansible.builtin.fail:
    msg: >-
      tailscale_require_authkey is set and {{ inventory_hostname }} is not
      Running, but TAILSCALE_AUTH_KEY is absent from the deploy environment, so
      the tailnet join would be skipped silently.
  when:
    - not ansible_check_mode
    - tailscale_require_authkey | default(false) | bool
    - tailscale_status.rc != 0 or (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') != "Running"
    - lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY', default='') == ''

# Auth key via TS_AUTHKEY env so it never reaches argv. --advertise-tags is not
# passed here: a tag on the join hard-fails while the live ACL has no tagOwners
# entry. The reconcile task below adopts tags.
- name: Authenticate Tailscale with auth key
  ansible.builtin.command: >
    tailscale up
    --accept-routes={{ tailscale_accept_routes | lower }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    {% if tailscale_advertise_routes | length > 0 %}--advertise-routes={{ tailscale_advertise_routes | join(',') }}{% endif %}
    {% if tailscale_additional_flags is defined %}{{ tailscale_additional_flags | join(' ') }}{% endif %}
  environment:
    TS_AUTHKEY: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY') }}"
  when:
    - not ansible_check_mode
    - tailscale_status.rc != 0 or (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') != "Running"
    - lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY', default='') != ''
  no_log: true
  register: tailscale_up
  changed_when: "'Success' in tailscale_up.stdout or tailscale_up.rc == 0"
  failed_when: false

# The task above is no_log (a rejected key can be echoed back in the CLI's own
# error text), so a failed join would otherwise abort the play with a fully
# redacted result. Report the rc and where to look instead.
- name: Fail with a usable message when the Tailscale join did not succeed
  ansible.builtin.fail:
    msg: >-
      `tailscale up` failed (rc={{ tailscale_up.rc }}). Its output is suppressed
      because the auth key can appear in it: run `journalctl -u tailscaled -n 50`
      and `tailscale status` on {{ inventory_hostname }}. An expired key, the
      tailnet device limit and an ACL rejection all land here.
  when:
    - tailscale_up is defined
    - not tailscale_up.skipped | default(false)
    - tailscale_up.rc | default(0) != 0

# `tailscale up` is gated on BackendState, so `tailscale set` carries later
# inventory edits to a Running node. tailscale_additional_flags stay on `up`
# only; `set` gives no reliable changed signal.
- name: Reconcile Tailscale preferences on authenticated node
  ansible.builtin.command: >
    tailscale set
    --accept-routes={{ tailscale_accept_routes | lower }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
  when:
    - not ansible_check_mode
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running"
  changed_when: false

# Tags reconcile separately: first adoption needs an interactive reauth, which
# must not fail the route/DNS reconcile. --advertise-tags is missing from
# `tailscale set` on some CLI releases, so probe for it — see README, ACL tags.
- name: Check whether `tailscale set` supports --advertise-tags on this CLI
  ansible.builtin.command: tailscale set --help
  register: tailscale_set_help
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - tailscale_advertise_tags | length > 0

# Strict mode would otherwise pass silently on a CLI that cannot reconcile: the
# task below is skipped, so its failed_when never fires. Tags may be correct
# from an out-of-band `tailscale up`, so check the live Self.Tags.
- name: Verify strict tag adoption when the CLI cannot reconcile tags non-interactively
  ansible.builtin.assert:
    that:
      - >-
        (tailscale_advertise_tags
         | difference((tailscale_status.stdout | default('{}') | from_json).get('Self', {}).get('Tags', []) | default([], true))
         | length) == 0
    fail_msg: >-
      tailscale_tags_require_adoption is set but this Tailscale CLI's `tailscale
      set` has no --advertise-tags and the node is still missing one or more
      requested tags ({{ tailscale_advertise_tags | join(',') }}). Complete the
      supervised `tailscale up --advertise-tags` adoption
      (the tailnet-ACL module README) and verify with `tailscale status`.
    success_msg: "Strict mode: node already advertises all requested ACL tags."
  when:
    - not ansible_check_mode
    - tailscale_advertise_tags | length > 0
    - tailscale_tags_require_adoption | default(false) | bool
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running"
    - "'--advertise-tags' not in ((tailscale_set_help.stdout | default('')) ~ (tailscale_set_help.stderr | default('')))"

- name: Reconcile advertised Tailscale ACL tags on authenticated node
  ansible.builtin.command: >
    tailscale set
    --advertise-tags={{ tailscale_advertise_tags | join(',') }}
  when:
    - not ansible_check_mode
    - tailscale_advertise_tags | length > 0
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running"
    - "'--advertise-tags' in ((tailscale_set_help.stdout | default('')) ~ (tailscale_set_help.stderr | default('')))"
  changed_when: false
  failed_when:
    - tailscale_tags_require_adoption | default(false) | bool
    - (tailscale_set_tags.rc | default(1)) != 0
  register: tailscale_set_tags

- name: Surface Tailscale tag reconciliation result
  ansible.builtin.debug:
    msg: >-
      {% if '--advertise-tags' not in ((tailscale_set_help.stdout | default('')) ~ (tailscale_set_help.stderr | default(''))) %}
      Tag reconcile skipped: this Tailscale CLI's `tailscale set` has no
      --advertise-tags. Tags are (re)adopted via `tailscale up --advertise-tags`
      (supervised — the tailnet-ACL module README, tagOwners) and persist
      server-side; verify with `tailscale status`.
      {% elif (tailscale_set_tags.rc | default(0)) != 0 %}
      Advertising {{ tailscale_advertise_tags | join(',') }} did not complete non-interactively
      (rc={{ tailscale_set_tags.rc }}; stderr={{ tailscale_set_tags.stderr | default('') | trim }}).
      Expected BEFORE the live ACL defines tagOwners (the host needs an interactive reauth to adopt
      the tag) — follow the tailnet-ACL module README (tag adoption), then verify with `tailscale status`.
      If tagOwners already exists live and this persists, it is NOT the expected reauth case — investigate
      the stderr above. Re-run the supervised adoption step with `-e tailscale_tags_require_adoption=true`
      to make a non-zero result fail the play.
      {% else %}
      Advertised ACL tags reconciled: {{ tailscale_advertise_tags | join(',') }}
      {% endif %}
  when:
    - not ansible_check_mode
    - tailscale_advertise_tags | length > 0
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running"

- name: Report the Tailscale join outcome or the skipped join
  ansible.builtin.debug:
    msg: |
      {% if tailscale_up is defined and tailscale_up.changed %}
      Tailscale authenticated successfully
      {% elif tailscale_status.rc == 0 and (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running" %}
      Tailscale already authenticated and running
      {% else %}
      WARNING: Tailscale join skipped — no auth key and the node is not Running
      Run:
      sudo tailscale up
      --accept-routes={{ tailscale_accept_routes | lower }}
      --accept-dns={{ tailscale_accept_dns | lower }}
      {% if tailscale_advertise_routes | length > 0 %}
      --advertise-routes={{ tailscale_advertise_routes | join(',') }}
      {% endif %}
      {% if tailscale_additional_flags is defined %}
      {{ tailscale_additional_flags | join(' ') }}
      {% endif %}
      {% if tailscale_advertise_tags | length > 0 %}
      Then adopt the ACL tag (after the ACL defines tagOwners): tailscale set --advertise-tags={{ tailscale_advertise_tags | join(',') }}
      (first tag adoption on a user-owned host needs a reauth — see the tailnet-ACL module README)
      {% endif %}
      {% endif %}
  when: not ansible_check_mode
