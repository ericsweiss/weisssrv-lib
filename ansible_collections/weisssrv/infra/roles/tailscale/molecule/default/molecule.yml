---
platforms:
  - name: tailscale-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  env:
    TAILSCALE_AUTH_KEY: ''
  inventory:
    group_vars:
      all:
        # tailscale_version is unset, so the scenario installs the shipped
        # default and a default upstream stops publishing fails here rather than
        # on a consumer's host. Sites pin their own version.
        tailscale_enabled: true
        tailscale_accept_routes: false
        tailscale_accept_dns: false
        tailscale_advertise_routes:
          - 192.168.0.0/24
        # Exercise the tag-advertisement path (rendered into the `tailscale set
        # --advertise-tags` reconcile task). tailscale up/set are skipped in
        # molecule, so this checks a clean converge, not live tag adoption.
        tailscale_advertise_tags:
          - tag:subnet-router
        tailscale_additional_flags: []
