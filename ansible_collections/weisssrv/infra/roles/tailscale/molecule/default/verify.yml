---
# The scenario leaves tailscale_version unset so the shipped default is what
# gets installed. This play loads that default so the pin assertion below has
# a value to compare against.
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../../defaults/main.yml
  tasks:
    - name: Check if Tailscale GPG key exists
      ansible.builtin.stat:
        path: /usr/share/keyrings/tailscale-archive-keyring.gpg
      register: tailscale_gpg
      failed_when: not tailscale_gpg.stat.exists

    - name: Check if Tailscale apt repository exists
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/tailscale.list
      register: tailscale_repo
      failed_when: not tailscale_repo.stat.exists

    - name: Read Tailscale repository config
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/tailscale.list
      register: tailscale_repo_content

    - name: Verify repository config
      ansible.builtin.assert:
        that:
          - "'pkgs.tailscale.com' in (tailscale_repo_content.content | b64decode)"
          - "'signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg' in (tailscale_repo_content.content | b64decode)"
        fail_msg: "Tailscale repository not configured correctly"
        success_msg: "Tailscale repository configured correctly"

    - name: Check if tailscale package is installed
      ansible.builtin.command: dpkg -l tailscale
      register: tailscale_installed
      changed_when: false
      failed_when: tailscale_installed.rc != 0

    - name: Verify version pinning was applied
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -l tailscale | grep -oP '\d+\.\d+\.\d+'
      args:
        executable: /bin/bash
      register: installed_version
      changed_when: false

    - name: Verify installed version matches pinned version
      ansible.builtin.assert:
        that:
          - installed_version.stdout is search(tailscale_version | regex_replace('-.*$', ''))
        fail_msg: "Installed version {{ installed_version.stdout }} does not match pinned {{ tailscale_version }}"
        success_msg: "Version pinning verified: {{ installed_version.stdout }}"

    # The role dpkg-holds tailscale so a manual `apt upgrade` can't move it past
    # the pin (pkgs.tailscale.com continuously serves newer builds).
    - name: Verify the Tailscale package is dpkg-held
      ansible.builtin.command: dpkg --get-selections tailscale
      register: tailscale_hold
      changed_when: false
      failed_when: "'hold' not in tailscale_hold.stdout"

    - name: Check if tailscaled service exists
      ansible.builtin.stat:
        path: /lib/systemd/system/tailscaled.service
      register: tailscaled_service
      failed_when: not tailscaled_service.stat.exists

    - name: Check if tailscaled service is enabled
      ansible.builtin.systemd:
        name: tailscaled
      register: tailscaled_status

    - name: Verify tailscaled service state
      ansible.builtin.assert:
        that:
          - tailscaled_status.status.UnitFileState == 'enabled'
        fail_msg: "tailscaled service is not enabled"
        success_msg: "tailscaled service is enabled"

    - name: Check if tailscale binary exists
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: tailscale_binary
      failed_when: not tailscale_binary.stat.exists

    # IP forwarding verification (exercised because tailscale_advertise_routes is set)
    - name: Check IP forwarding is enabled
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: ip_forward_status
      changed_when: false

    - name: Verify IP forwarding is enabled
      ansible.builtin.assert:
        that:
          - ip_forward_status.stdout == '1'
        fail_msg: "IP forwarding is not enabled"
        success_msg: "IP forwarding is enabled"

    - name: Check ip_forward sysctl drop-in exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-tailscale-ip-forward.conf
      register: sysctl_dropin
      failed_when: not sysctl_dropin.stat.exists

    - name: Stat /etc/sysctl.conf
      ansible.builtin.stat:
        path: /etc/sysctl.conf
      register: sysctl_conf_stat

    - name: Read /etc/sysctl.conf
      ansible.builtin.slurp:
        src: /etc/sysctl.conf
      register: sysctl_conf_content
      when: sysctl_conf_stat.stat.exists

    - name: Verify ip_forward is not persisted in /etc/sysctl.conf
      ansible.builtin.assert:
        that:
          - sysctl_conf_content.content | b64decode is not search('(?m)^net\.ipv4\.ip_forward\s*=')
        fail_msg: "/etc/sysctl.conf still carries the ip_forward entry (drop-in should own it)"
        success_msg: "ip_forward persisted only in the role-owned sysctl.d drop-in"
      when: sysctl_conf_stat.stat.exists

    - name: Check systemd drop-in for IP forwarding persistence exists
      ansible.builtin.stat:
        path: /etc/systemd/system/tailscaled.service.d/ip-forward.conf
      register: ip_forward_dropin

    - name: Verify systemd drop-in exists and has correct content
      ansible.builtin.assert:
        that:
          - ip_forward_dropin.stat.exists
        fail_msg: "IP forwarding systemd drop-in not deployed"
        success_msg: "IP forwarding systemd drop-in deployed"

    - name: Read drop-in content
      ansible.builtin.slurp:
        src: /etc/systemd/system/tailscaled.service.d/ip-forward.conf
      register: dropin_content

    - name: Verify drop-in content
      ansible.builtin.assert:
        that:
          - "'ExecStartPost' in (dropin_content.content | b64decode)"
          - "'ip_forward=1' in (dropin_content.content | b64decode)"
        fail_msg: "IP forwarding drop-in has incorrect content"
        success_msg: "IP forwarding drop-in content verified"

    # Subnet-router bridge-masquerade fix: the script plus the drop-in that
    # runs it, exercised because tailscale_advertise_routes is set. Rendering
    # only; runtime POSTROUTING ordering is verified on a real subnet router.
    - name: Stat the bridge-masquerade fix script
      ansible.builtin.stat:
        path: /usr/local/sbin/tailscale-bridge-masq-fix
      register: bridge_masq_script

    - name: Verify the bridge-masquerade fix script is deployed and executable
      ansible.builtin.assert:
        that:
          - bridge_masq_script.stat.exists
          - bridge_masq_script.stat.mode == '0755'
        fail_msg: "bridge-masquerade fix script missing or not executable"
        success_msg: "bridge-masquerade fix script deployed (0755)"

    - name: Read the bridge-masquerade fix script
      ansible.builtin.slurp:
        src: /usr/local/sbin/tailscale-bridge-masq-fix
      register: bridge_masq_script_content

    - name: Verify the script carries the deterministic ordering logic
      ansible.builtin.assert:
        that:
          - "'--physdev-is-bridged' in (bridge_masq_script_content.content | b64decode)"
          - "'0x40000/0xff0000' in (bridge_masq_script_content.content | b64decode)"
          - "'-C POSTROUTING -j ts-postrouting' in (bridge_masq_script_content.content | b64decode)"
          - "'-I POSTROUTING 1' in (bridge_masq_script_content.content | b64decode)"
          # Every call takes the xtables lock: pve-firewall rewrites iptables on
          # its own loop, and a lost lock after the delete sweep leaves no rule.
          - "'-w 5 -t nat -I POSTROUTING 1' in (bridge_masq_script_content.content | b64decode)"
          - "(bridge_masq_script_content.content | b64decode).count('-w 5') >= 5"
          # Slot-1 check: without it the per-minute timer rewrites the rule on
          # every tick. With it, a re-run is a no-op.
          - "'sed -n 2p' in (bridge_masq_script_content.content | b64decode)"
          # The give-up path must say so in the journal, or a router silently
          # loses reachability to its own guests with no signal anywhere.
          - "'ts-postrouting jump absent' in (bridge_masq_script_content.content | b64decode)"
          # Insert-first, sweep-after, and the sweep deletes by rule number: a
          # spec delete ahead of the insert leaves nat POSTROUTING with no
          # ACCEPT for as long as the insert waits on the xtables lock.
          - "'-D POSTROUTING $rule' not in (bridge_masq_script_content.content | b64decode)"
          - >-
            (bridge_masq_script_content.content | b64decode).index('-I POSTROUTING 1 $rule')
            < (bridge_masq_script_content.content | b64decode).index('-D POSTROUTING $((num - 1))')
        fail_msg: "bridge-masquerade fix script missing the wait/insert-at-top logic"
        success_msg: "bridge-masquerade fix script logic verified"

    # A host where Tailscale never uses iptables takes the deferral branch every
    # minute, so the branch logs once per state change and not per run.
    - name: Run the fix script twice with no ts-postrouting jump present
      ansible.builtin.command: /usr/local/sbin/tailscale-bridge-masq-fix
      register: bridge_masq_runs
      changed_when: false
      failed_when: bridge_masq_runs.rc != 0
      loop: [1, 2]

    - name: Stat the deferral marker
      ansible.builtin.stat:
        path: /run/tailscale-bridge-masq-fix.deferred
      register: bridge_masq_marker

    - name: Verify the deferral branch is exit-0 and logs once per state change
      ansible.builtin.assert:
        that:
          - bridge_masq_marker.stat.exists
          - "'logger -t tailscale-bridge-masq-fix --' in (bridge_masq_script_content.content | b64decode)"
          - "'logger -t tailscale-bridge-masq-fix -s' not in (bridge_masq_script_content.content | b64decode)"
        fail_msg: >-
          The deferral branch logs on every timer tick, which buries the one
          occurrence that matters under ~2880 journal entries a day.
        success_msg: "the deferral branch marks state and logs once"

    # The ExecStartPost alone only re-applies the rule on a tailscaled restart,
    # so a rule wiped by a firewall rebuild stays gone. The timer is what makes
    # it survive; assert it is deployed AND armed.
    - name: Stat the bridge-masquerade fix unit and timer
      ansible.builtin.stat:
        path: "/etc/systemd/system/tailscale-bridge-masq-fix.{{ item }}"
      register: bridge_masq_units
      loop:
        - service
        - timer

    - name: Verify the bridge-masquerade fix unit and timer are deployed
      ansible.builtin.assert:
        that: bridge_masq_units.results | map(attribute='stat.exists') | reject | length == 0
        fail_msg: "tailscale-bridge-masq-fix.service/.timer missing"
        success_msg: "bridge-masquerade fix unit + timer deployed"

    - name: Read the bridge-masquerade fix timer
      ansible.builtin.slurp:
        src: /etc/systemd/system/tailscale-bridge-masq-fix.timer
      register: bridge_masq_timer_content

    - name: Verify the timer re-asserts the rule on a cadence
      ansible.builtin.assert:
        that:
          - "'OnUnitActiveSec=' in (bridge_masq_timer_content.content | b64decode)"
          - "'Unit=tailscale-bridge-masq-fix.service' in (bridge_masq_timer_content.content | b64decode)"
        fail_msg: "bridge-masquerade fix timer does not re-run the repair unit"

    - name: Check the bridge-masquerade fix timer is enabled  # noqa command-instead-of-module
      ansible.builtin.command: systemctl is-enabled tailscale-bridge-masq-fix.timer
      register: bridge_masq_timer_enabled
      changed_when: false
      failed_when: bridge_masq_timer_enabled.stdout | trim != 'enabled'

    - name: Read the bridge-masquerade fix drop-in
      ansible.builtin.slurp:
        src: /etc/systemd/system/tailscaled.service.d/bridge-masquerade-fix.conf
      register: bridge_masq_dropin_content

    - name: Verify the drop-in ExecStartPost invokes the script
      ansible.builtin.assert:
        that:
          - "'ExecStartPost=-/usr/local/sbin/tailscale-bridge-masq-fix' in (bridge_masq_dropin_content.content | b64decode)"
        fail_msg: "bridge-masquerade fix drop-in does not invoke the script"
        success_msg: "bridge-masquerade fix drop-in wired to the script"

    - name: Read the missing-auth-key result
      ansible.builtin.slurp:
        src: /tmp/molecule-results/require-authkey.json
      register: tailscale_require_authkey_artifact

    - name: Assert a required auth key that is unset fails the play
      vars:
        refused: "{{ (tailscale_require_authkey_artifact.content | b64decode | from_json).refused }}"
      ansible.builtin.assert:
        that:
          - refused | bool
        fail_msg: >-
          tailscale_require_authkey: true skipped the join instead of failing,
          so a node that never joined the tailnet reports success.
        success_msg: "tailscale_require_authkey: true fails when TAILSCALE_AUTH_KEY is unset"
