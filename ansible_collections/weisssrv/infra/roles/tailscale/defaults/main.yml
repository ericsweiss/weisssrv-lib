---
tailscale_enabled: true

# Pinned apt version + dpkg hold; pkgs.tailscale.com continuously serves newer
# builds. Override centrally wherever the site keeps its version pins.
tailscale_version: "1.102.2"

# Upstream signing key. The download is fingerprint-checked against this BEFORE
# it is copied into the trusted keyring, so pin/rotate it deliberately.
tailscale_gpg_fingerprint: "2596A99EAAB33821893C0A79458CA832957F5868"

tailscale_accept_routes: false  # false prevents routing loops on subnet routers
tailscale_accept_dns: false  # the site's own resolvers stay authoritative
tailscale_advertise_routes: []  # e.g. ["192.168.0.0/24"]
tailscale_advertise_tags: []  # e.g. ["tag:subnet-router"]; the tag must exist in the tailnet ACL's tagOwners
tailscale_additional_flags: []  # extra `tailscale up` flags, e.g. ["--ssh"]

# false = best-effort: a failed tag reconcile does not fail the play. Set true
# only for the supervised adoption step run after the ACL defines tagOwners, so
# a host that silently fails to adopt is caught. See the README (ACL tags).
tailscale_tags_require_adoption: false

# The auth key is read from the TAILSCALE_AUTH_KEY environment variable, never
# from a variable — it must not reach argv or a fact.
