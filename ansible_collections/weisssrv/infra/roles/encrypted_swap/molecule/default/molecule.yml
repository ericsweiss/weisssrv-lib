---
# Scenario: assert the crypttab + fstab rendering + boot-finalize wiring
# (activation is deferred to reboot — real devices — so there is nothing live
# to exercise here).
platforms:
  - name: encrypted-swap-test
    image: ${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:latest}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        encrypted_swap_enabled: true
        encrypted_swap_source_device: /dev/pve/swap
