---
# dm-crypt plain-mode swap with a random ephemeral key, wired through
# /etc/crypttab and /etc/fstab. Bare-metal hosts only. See README.

encrypted_swap_enabled: true

# Backing swap device. Defaults to the Proxmox installer's layout
# (/dev/pve/swap LVM LV) — override per host if a box differs.
encrypted_swap_source_device: /dev/pve/swap
encrypted_swap_mapper_name: cryptswap

# True fails the deploy when the backing device is not a block device; false
# self-skips loudly instead, for a mixed fleet.
encrypted_swap_require_source_device: true

# aes-xts-plain64, size=512 => AES-256-XTS (two 256-bit keys). Random key from
# /dev/urandom (ephemeral).
encrypted_swap_cipher: aes-xts-plain64
encrypted_swap_key_size: 512
encrypted_swap_sector_size: 4096

# fstab `pri=` for the mapper line; must sit above the plaintext swap line so
# the kernel prefers the mapper during the defer window. See README.
encrypted_swap_mapper_swap_priority: 100

# Where the finalize unit drops encrypted_swap.prom. Skipped when the directory
# is absent, so a host without node_exporter_host is unaffected.
encrypted_swap_textfile_dir: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}"
