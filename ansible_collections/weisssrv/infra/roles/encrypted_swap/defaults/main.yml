---
# encrypted_swap — dm-crypt PLAIN-mode swap with a RANDOM ephemeral key (fresh
# each boot, discarded at shutdown, so on-disk swap is unrecoverable after a
# reboot). Managed via /etc/crypttab (systemd-cryptsetup opens + mkswaps the
# mapper at boot) + /etc/fstab. Bare-metal hosts only.

encrypted_swap_enabled: true

# Backing swap device. Defaults to the Proxmox installer's layout
# (/dev/pve/swap LVM LV) — override per host if a box differs.
encrypted_swap_source_device: /dev/pve/swap
encrypted_swap_mapper_name: cryptswap

# aes-xts-plain64, size=512 => AES-256-XTS (two 256-bit keys). Random key from
# /dev/urandom (ephemeral).
encrypted_swap_cipher: aes-xts-plain64
encrypted_swap_key_size: 512
encrypted_swap_sector_size: 4096

# Priority for the encrypted mapper's fstab swap line. Set ABOVE the plaintext
# backing swap so that during the deferred-activation window (both lines present,
# see README) the kernel prefers the encrypted mapper for new swap-outs the
# moment it comes up at reboot — before the boot finalize unit drops the plaintext
# device. `nofail` on the mapper line lets `swapon -a` silently skip the mapper
# while it is still absent (pre-reboot defer window) instead of erroring.
encrypted_swap_mapper_swap_priority: 100
