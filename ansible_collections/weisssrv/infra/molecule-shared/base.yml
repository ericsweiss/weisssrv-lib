---
# Shared Molecule base config for the per-role default scenarios, applied via
# `molecule -c <path-to>/molecule-shared/base.yml test`. Molecule deep-merges it
# with each role's molecule.yml, so a role file only carries its own
# `platforms` (list-replace) and `provisioner.inventory.group_vars`, plus any
# key it wants to override.
#
# The relative paths below differ in depth on purpose: molecule resolves
# role-file/requirements-file against its CWD (the role dir) but playbook paths
# against the scenario dir.
#
# Multi-host integration stacks do NOT use this base — they run their own
# multi-platform molecule invocation.
dependency:
  name: galaxy
  options:
    # Both galaxy sub-dependencies (ansible-galaxy role install + collection
    # install) read one source of truth instead of a per-scenario copy (which
    # drifts into inconsistent, upper-bound-less pins).
    role-file: ../../requirements.yml
    requirements-file: ../../requirements.yml
driver:
  name: docker
provisioner:
  name: ansible
  env:
    # Both resolve against ansible-playbook's CWD, which molecule sets to the
    # SCENARIO dir: three up is <collection-root>/roles, seven up is the repo
    # root — the dir CONTAINING ansible_collections/, i.e. what makes
    # weisssrv.infra resolvable by FQCN (molecule sets no collections path of
    # its own). The two defaults are re-listed because this replaces the
    # variable wholesale, and dropping them would hide the galaxy dependencies
    # installed by the `dependency` step above.
    ANSIBLE_ROLES_PATH: ../../..
    ANSIBLE_COLLECTIONS_PATH: ../../../../../../..:~/.ansible/collections:/usr/share/ansible/collections
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
    # Molecule renders its own ansible.cfg, so the repo ansible.cfg does NOT
    # apply here — and its [ssh_connection] pipelining wouldn't cover the
    # docker connection anyway. The general [connection] setting pipes each
    # module straight into one `docker exec` instead of a put-file + exec
    # round-trip per task, which is the dominant per-task overhead on the
    # exec-heavy docker transport.
    connection:
      pipelining: true
  playbooks:
    # Shared prepare for every default scenario. Roles that need extra prep ship
    # their own molecule/default/prepare.yml AND re-point playbooks.prepare at it
    # (deep-merge: an unset prepare in a role's molecule.yml inherits this one).
    prepare: ../../../../molecule-shared/prepare-common.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
