---
# Shared Molecule base config for the collection's role scenarios, deep-merged
# with each role's molecule.yml. CI passes it with -c for every scenario. The
# relative paths below resolve against two bases: molecule-shared/README.md.
dependency:
  name: galaxy
  options:
    # Both galaxy sub-dependencies read one source of truth instead of a
    # per-scenario copy.
    role-file: ../../requirements.yml
    requirements-file: ../../requirements.yml
driver:
  name: docker
provisioner:
  name: ansible
  env:
    # CRITICAL: both resolve against the SCENARIO dir. Three up is
    # <collection-root>/roles, seven up is the dir CONTAINING
    # ansible_collections/, which is what makes weisssrv.infra resolvable by
    # FQCN. The two trailing defaults are re-listed because this replaces the
    # variable wholesale; dropping them hides the galaxy dependencies.
    ANSIBLE_ROLES_PATH: ../../..
    ANSIBLE_COLLECTIONS_PATH: ../../../../../../..:~/.ansible/collections:/usr/share/ansible/collections
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
    # Molecule renders its own ansible.cfg, so the repo ansible.cfg does not
    # apply. [connection] pipelining pipes each module into one `docker exec`
    # instead of a put-file + exec round-trip per task.
    connection:
      pipelining: true
  playbooks:
    # Shared prepare for every scenario that does not re-point it. Roles needing
    # extra prep ship their own molecule/default/prepare.yml AND re-point
    # playbooks.prepare at it (deep-merge: an unset prepare inherits this one).
    prepare: ../../../../molecule-shared/prepare-common.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
