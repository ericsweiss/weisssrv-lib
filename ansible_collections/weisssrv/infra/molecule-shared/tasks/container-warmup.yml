---
# Shared molecule container warm-up, included from converge pre_tasks via
#   ansible.builtin.include_tasks: ../../../../molecule-shared/tasks/container-warmup.yml
# (a scenario dir sits 4 levels under the collection root).
# Waits out the apt/dpkg races a fresh systemd container starts with, then
# refreshes the apt cache and confirms systemd is up.

- name: Wait for apt locks to be released
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
          fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
          fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
      sleep 1
    done
  args:
    executable: /bin/bash
  changed_when: false

- name: Fix any interrupted dpkg state
  ansible.builtin.shell: |
    dpkg --configure -a || true
  args:
    executable: /bin/bash
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Wait for systemd to be ready
  ansible.builtin.wait_for:
    path: /run/systemd/system
    state: present
    timeout: 30
