---
namespace: weisssrv
name: infra
version: 0.9.1
readme: README.md
authors:
  - Eric S. Weiss
description: >-
  Host-configuration roles for a Proxmox + ZFS + k3s homelab: base hardening,
  storage, DNS/SMTP, guest lifecycle, exporters, node tuning and the
  application guests. Site data (domains, IPs, pool names) is always an input,
  never a role default.
license:
  - MIT
tags:
  - infrastructure
  - proxmox
  - zfs
  - k3s
  - homelab
  - linux
  - systemd
  - networking
  - monitoring
  - storage
repository: https://git.ericsweiss.com/eric/weisssrv-lib
homepage: https://git.ericsweiss.com/eric/weisssrv-lib
documentation: https://git.ericsweiss.com/eric/weisssrv-lib/-/blob/main/ansible_collections/weisssrv/infra/README.md
issues: https://git.ericsweiss.com/eric/weisssrv-lib/-/issues

# Runtime contract for consumers: exactly the collections the roles' own
# tasks/handlers/templates address by FQCN. requirements.yml is the superset the
# TEST environment installs; tests/test_ansible_collection.py checks that this
# set is contained in it, with matching pins.
dependencies:
  ansible.posix: ">=2.1.0,<3.0.0"
  community.general: ">=12.2.0,<13.0.0"

# Test scaffolding is repo content, not artifact content: it only resolves
# inside this checkout (molecule-shared/ is reached by relative path) and would
# otherwise ship in every consumer's installed copy.
build_ignore:
  - molecule-shared
  - roles/*/molecule
  # No changelog file ships, by policy: release notes are generated per tag from
  # the conventional commits (docs/VERSIONING.md). A hand-maintained
  # changelogs/changelog.yaml went stale within one release and told consumers
  # a different story than the tag notes; this entry keeps a stray one out of
  # the artifact if the antsibull tooling is ever run here by accident.
  - changelogs
  # The TEST-environment superset. `dependencies:` above is the runtime
  # contract; shipping this alongside it in the artifact invites a consumer to
  # install the test-only collections too.
  - requirements.yml
  - "*.tar.gz"
