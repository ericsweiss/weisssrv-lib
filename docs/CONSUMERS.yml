---
# Registry of every repo that pins this library, and every place it holds a pin.
#
# WHY THIS FILE EXISTS. Only one pin surface is machine-enforced: the CI
# `include: ref:` entries, by the vendored scripts/check-lib-pins.py. The Ansible
# collection version, the Terraform module `?ref=`, the vendored script copies
# and the CLI install spec all drift silently — both halves keep working, just at
# different library versions. Cutting a release without walking this list is how
# a consumer ends up running last release's gate under this release's template.
#
# HOW TO USE IT. Read it before cutting a release (docs/VERSIONING.md's release
# checklist) and when planning a bump. Update it in the same MR whenever a
# consumer gains or drops an include, starts or stops vendoring a script, or
# moves a pin to a new file.
#
# MOSTLY NOT machine-read. `tests/test_docs_registry.py` parses the file and
# holds every `enforced:` / `enforced_by:` claim to a gate that exists (the
# consumer-side ones only when a sibling checkout is available). Everything else
# here is reviewed prose, so keep the enforcement claims in those two keys —
# a gate named only in a `note:` is ungated.

consumers:
  - name: weisssrv
    url: https://git.ericsweiss.com/eric/weisssrv
    role: >-
      The homelab platform repo — one running cluster. Privileged
      `infrastructure` runner, root. Every template input default is calibrated
      to this consumer, so it adopts most templates with no `inputs:` at all.
    profile: weisssrv
    pins:
      ci_includes:
        single_source: .gitlab-ci.yml -> variables.WEISSSRV_LIB_REF
        enforced_by: scripts/check-lib-pins.py (vendored; --fix rewrites)
        # `include:` is resolved before `variables:` exists, so every entry
        # repeats the tag as a literal. 14 files across 11 entries: TWO entries
        # share a `file:` list because those five files pass no inputs; the
        # other nine bind inputs per entry.
        templates:
          - /ci/templates/dep-cache.yml          # defaults verbatim (shared entry)
          - /ci/templates/install-1password.yml  # defaults verbatim (shared entry)
          - /ci/templates/terraform-http-backend.yml  # defaults verbatim (shared entry)
          - /ci/validate/terraform.yml       # defaults verbatim (shared entry; emits TWO jobs)
          - /ci/security/secret-detection.yml  # defaults verbatim (shared entry)
          - /ci/lint/yaml-lint.yml           # inputs: targets, changes
          - /ci/lint/shellcheck.yml          # inputs: direct_globs, find_dir (""), changes
          - /ci/lint/ansible-lint.yml        # inputs: targets, galaxy_requirements, changes
          - /ci/lint/python-lint.yml         # inputs: targets, config (vendored ruff.toml), changes
          - /ci/lint/docs-link-check.yml     # inputs: changes -> **/*.md
          - /ci/maintenance/version-check.yml  # inputs: setup_command, check_command
          - /ci/test/python-tests.yml        # inputs: pins, setup_command (lib clone), ~28 traced paths
          - /ci/validate/flux-lint.yml       # inputs: pins + extra_validation
          - /ci/review/pr-agent.yml          # inputs: secrets_source, gate, needs
        not_consumed:
          # The ONLY three templates outside this pipeline — treat every other
          # input-default change as consumer-visible in weisssrv.
          - /ci/build/docker-build.yml
          - /ci/release/semantic-release.yml
          - /ci/maintenance/version-bump-bot.yml  # weisssrv runs a local bump job
        not_yet_adopted:
          # Extracted FROM this pipeline's local .deploy-base / .kubectl-setup;
          # weisssrv still carries its own copies. Adopt on the next bump — and
          # adopt them as a PAIR: ansible-deploy.yml's job only carries the
          # stage/rules/resource_group shell, and `extends: $[[ inputs.base ]]`
          # is where the retry and the op/ssh toolchain come from, so the job
          # template alone reproduces nothing. The per-job `variables:` op:// map
          # stays consumer-side either way, as an extends-side override.
          - /ci/deploy/deploy-base.yml
          - /ci/deploy/kubectl-setup.yml
          - /ci/deploy/ansible-deploy.yml
      ansible_collection:
        file: ansible/requirements.yml
        status: >-
          Adopted (v0.6.0). ansible/roles/ is deleted, every playbook addresses
          roles as weisssrv.infra.<role>, and the inventory carries the renamed
          variable API. Bumping the pin here changes what runs on the hosts, so
          every deploy-ansible-* job keys on ansible/requirements.yml.
      terraform_modules:
        status: >-
          Adopted, all three. terraform/{cloudflare,tailscale,authentik} are
          thin callers of cloudflare-zone / tailscale-acl / authentik-sso
          holding only site data. All three `?ref=` pins equal
          variables.WEISSSRV_LIB_REF — they move as one, and divergence is a
          hard failure, not a supported state. This consumer is the only one
          that PLANS these modules against live infrastructure — the cluster
          template's render check is static — so a behavioural module change is
          judged here.
        files:
          - terraform/cloudflare/main.tf     # cloudflare-zone
          - terraform/tailscale/main.tf      # tailscale-acl
          - terraform/authentik/main.tf      # authentik-sso
        enforced_by: >-
          weisssrv
          scripts/test_site_configs.py::test_terraform_module_refs_match_the_ci_variable
          — check-lib-pins.py reads only the include block and
          ansible/requirements.yml, so this pin class is gated by the consumer's
          own suite instead. The refs are still edited by hand: bump all three
          with WEISSSRV_LIB_REF, then `terraform init -upgrade` and read the
          plan — each root passes the identity-bearing inputs explicitly (zone
          settings, flow slugs, scope mapping lists) so a changed library
          default cannot move live state on a ref bump unreviewed.
      vendored_copies: >-
        Recorded in the library at scripts/vendored-paths.yml under
        consumers.weisssrv, and checked from here by
        scripts/check-vendored-copies.py against a library checkout. That
        registry is the single list — vendored (byte-identical) and forked
        (deliberately divergent, with the library-side sha they were last
        reconciled against) — so a file the library starts or stops shipping
        reaches this gate at the next bump with nothing to maintain here. The
        copies are what actually RUN: the CI templates take the script path
        from the consumer tree, so re-vendor on every bump. Covers scripts/
        copies plus the root ruff.toml (lint/ruff.toml upstream, discovered by
        the tool at its conventional root name), which is byte-identical here
        and registered as vendored — only the two templates fork it. The lint
        profiles ARE forks here (.gitleaks.toml,
        .gitlab/secret-detection-ruleset.toml, .editorconfig,
        .pre-commit-config.yaml), as is the one forked script,
        scripts/extract-prometheus-config.py: it unions observability/rules/*
        with the HelmRelease.
      cli: not installed
      images: >-
        Pulls the library's published
        $CI_REGISTRY/eric/weisssrv-lib/molecule-{ci,test}:$WEISSSRV_LIB_REF
        images; weisssrv's own docker/ now holds only the app images
        (hermes-agent, camofox-browser). The image tag is therefore a fifth pin
        surface that moves with WEISSSRV_LIB_REF, and it only resolves once the
        release tag exists.
        NOT YET ADOPTED: the ansible-deploy image, published from the same
        registry at the same tag. weisssrv's .deploy-base still installs the op
        CLI, ansible and git per run (over half of a 115s deploy job); adopting
        it is an image swap plus dropping those before_script steps, and it
        pairs naturally with the /ci/deploy/* includes above.

  - name: weisssrv-app-template
    url: https://git.ericsweiss.com/eric/weisssrv-app-template
    role: >-
      Scaffold for tenant repos that deploy INTO the weisssrv cluster. Shared
      non-privileged `k8s-deploy` runner, UID 1000 — so every include passes
      `tags: []` and the non-root-safe input set.
    profile: tenant
    pins:
      # TWO pipelines, and they are NOT the same set — the same repo-vs-tenant
      # split `vendored_copies` below already handles. Keyed separately so an
      # input-default change is judged against the pipeline that actually
      # includes the template.
      ci_includes:
        scope: the template repo's OWN pipeline (what CI runs on this repo)
        single_source: .gitlab-ci.yml -> variables.WEISSSRV_LIB_REF
        enforced_by: scripts/check-lib-pins.py (vendored) + its own tests/
        # 7 entries, all unconditional — a plain YAML file, no jinja.
        templates:
          - /ci/lint/yaml-lint.yml
          # targets "scripts"; NO config: input — ruff discovers the root
          # ruff.toml, the same file `task python-lint` resolves.
          - /ci/lint/python-lint.yml
          # test_dir: tests, pip_packages: copier + jinja2, changes: **/*.
          # The suite is copier.yml schema checks + the render invariants
          # (validate_render.py, test_render.py, test_copier_config.py,
          # test_check_lib_pins.py).
          - /ci/test/python-tests.yml
          - /ci/lint/docs-link-check.yml
          - /ci/security/secret-detection.yml
          - /ci/review/pr-agent.yml
          - /ci/release/semantic-release.yml
        not_consumed:
          - /ci/validate/terraform.yml       # ships no Terraform
          - /ci/validate/flux-lint.yml       # the manifests are jinja SOURCES here, not renderable
          - /ci/lint/ansible-lint.yml
          - /ci/lint/shellcheck.yml
          - /ci/build/docker-build.yml       # the Dockerfile is a template file, not built here
          - /ci/maintenance/version-check.yml
          - /ci/maintenance/version-bump-bot.yml
          - /ci/templates/*
          - /ci/deploy/*
      rendered_tenant_ci_includes:
        scope: >-
          the pipeline copier RENDERS into a generated tenant, from
          "template/{% if ci_shape == 'gitlab_selfhosted' %}.gitlab-ci.yml{% endif %}.jinja".
          Only the gitlab_selfhosted shape consumes the library at all — the
          github shape gets vendored Actions workflows, `none` gets no pipeline.
        single_source: copier.yml -> lib_ref (rendered into variables.WEISSSRV_LIB_REF and every literal ref:)
        enforced_by: >-
          tests/test_check_lib_pins.py + the render tests in this repo; the
          generated tenant then runs its own vendored check-lib-pins.py.
        # 8 entries. docker-build is the ONE copier-gated include
        # (enable_image_build); the other 7 are unconditional.
        templates:
          - /ci/lint/yaml-lint.yml
          - /ci/validate/flux-lint.yml       # substitute: false (non-root), over kubernetes/flux
          - /ci/lint/python-lint.yml         # targets "scripts", vendored template/ruff.toml
          - /ci/lint/docs-link-check.yml
          - /ci/security/secret-detection.yml
          - /ci/build/docker-build.yml       # copier-gated on enable_image_build; privileged runner
          - /ci/release/semantic-release.yml
          - /ci/review/pr-agent.yml
        not_consumed:
          - /ci/validate/terraform.yml       # absent entirely (tenants ship no Terraform)
          - /ci/lint/ansible-lint.yml
          - /ci/lint/shellcheck.yml          # a rendered tenant ships no shell scripts
          - /ci/test/python-tests.yml        # and no test suite of its own
          - /ci/maintenance/version-check.yml
          - /ci/maintenance/version-bump-bot.yml
          - /ci/templates/*
          - /ci/deploy/*                     # Flux pulls; a tenant never deploys
      ansible_collection: not consumed (tenants ship no Ansible)
      terraform_modules: not consumed
      vendored_copies: >-
        Recorded in the library at scripts/vendored-paths.yml under
        consumers.weisssrv-app-template, and checked from here by
        scripts/check-vendored-copies.py — the only gate on this relationship
        now that the consumer's own scripts/-only iterator is gone. It also
        reaches past scripts/: tests/test_check_lib_pins.py (a byte-identical
        copy of the canonical suite, so a library change to check-lib-pins.py
        reds this gate until re-vendored), the three workflow copies
        (release.yml, ci.yml, build-image.yml — from
        ci/release/github-release-workflow.example.yml and ci/github/*), and the
        lint-profile forks.
        The registry's consumer paths follow the copier template layout:
        anything rendered into a tenant sits under template/, with the jinja
        conditional directory names (ci_shape, enable_image_build) as literal
        path segments; only the copies this repo runs on ITSELF stay
        unprefixed. Several files exist TWICE and are registered twice, because
        they drift separately — scripts/ (check-doc-links.py,
        check-lib-pins.py, semantic-release.py), the lint profiles (ruff.toml,
        .gitleaks.toml, .editorconfig) and
        .gitlab/secret-detection-ruleset.toml, whose root copy is what this
        repo's OWN pipeline loads. Only .pre-commit-config.yaml exists on the
        tenant side alone. Moving any of them is a library-release event, since
        the registry is library-owned: a consumer layout change lands on that
        consumer's main before the tag encoding it is cut. build-image.yml's
        consumer path carries the enable_image_build conditional too, so a
        tenant that runs an upstream image gets no packages:write workflow.
      cli:
        files: []
        note: >-
          None. The shell wrappers that carried a second, unchecked literal of
          the tag (rename.sh, select-ci.sh) are gone with the scaffolding CLI
          they called: this repo is a copier template now, rendered by
          `weisssrv-new-project new-app`, and the CI shape is the `ci_shape`
          answer. As with the cluster template, the CLI version and the template
          version couple at generation time rather than pinning in the output,
          so check-lib-pins.py sees every remaining literal.
      contract_tests: >-
        None in this repo. The library no longer carries a byte-identical
        scaffold fixture of this template; the copy relationship is recorded in
        scripts/vendored-paths.yml and checked from the consumer side by
        scripts/check-vendored-copies.py.

  - name: weisssrv-cluster-template
    url: https://git.ericsweiss.com/eric/weisssrv-cluster-template
    role: >-
      The copier template a NEW cluster is generated from. Widest surface of the
      three: CI includes, the collection, and all three Terraform modules. The
      generated repo is PRE-BOOTSTRAP on day one, which is why it must pass
      flux-lint `require_cluster_root: false` until `flux bootstrap` has written
      the gotk files.
    profile: generated-cluster
    pins:
      # Every pin below derives from ONE copier answer, so a bump is a single
      # value — the easy case, and the reason the template is the reference
      # implementation for how a consumer should hold its pins.
      single_source: copier.yml -> lib_ref (default), plus lib_url and lib_project
      ci_includes:
        file: "template/.gitlab-ci.yml.jinja — `ref: {{ lib_ref }}` on every entry"
        # 17 files; 16 unconditional, semantic-release copier-gated on
        # enable_semantic_release.
        templates:
          - /ci/lint/yaml-lint.yml
          - /ci/lint/ansible-lint.yml
          - /ci/lint/shellcheck.yml
          - /ci/lint/python-lint.yml
          - /ci/test/python-tests.yml
          - /ci/validate/terraform.yml
          - /ci/validate/flux-lint.yml
          - /ci/lint/docs-link-check.yml
          - /ci/security/secret-detection.yml
          - /ci/review/pr-agent.yml
          - /ci/maintenance/version-check.yml
          - /ci/maintenance/version-bump-bot.yml
          - /ci/release/semantic-release.yml   # copier-gated: enable_semantic_release
          - /ci/templates/dep-cache.yml
          - /ci/templates/install-1password.yml
          - /ci/templates/terraform-http-backend.yml
          - /ci/deploy/deploy-base.yml         # op_vault + ansible_version inputs
        not_yet_adopted:
          # The rendered deploy jobs are per-playbook and name their own script,
          # so neither the kubectl layer nor the generic job template applies.
          - /ci/deploy/kubectl-setup.yml
          - /ci/deploy/ansible-deploy.yml
      ansible_collection:
        file: template/ansible/requirements.yml.jinja
        pin: "version: {{ lib_ref }} against {{ lib_url }}"
      terraform_modules:
        pin: "?ref={{ lib_ref }}"
        files:
          - template/terraform/cloudflare/main.tf.jinja        # cloudflare-zone
          - template/terraform/authentik/main.tf.jinja         # authentik-sso
          - template/terraform/{% if vpn_tailscale %}tailscale{% endif %}/main.tf.jinja  # tailscale-acl
      vendored_copies:
        note: >-
          Recorded in the library at scripts/vendored-paths.yml under
          consumers.weisssrv-cluster-template (most paths are under template/,
          since they are rendered into the generated repo; the unprefixed ones
          are the copies this repo runs on ITSELF — scripts/check-doc-links.py,
          scripts/check-lib-pins.py, scripts/semantic-release.py, its lint
          profiles and its secret-detection ruleset). BOTH sets are registered:
          the three scripts and the tenant-side lint profiles (template/ruff.toml,
          template/.editorconfig) exist twice and drift separately. Checked by
          scripts/check-vendored-copies.py, which
          tests/validate_render.py:check_vendored calls via
          _check_registered_copies — so the registry-only entries
          (tests/test_check_lib_pins.py, the lint-profile forks) ARE reached;
          it is the sibling directory WALK, over the render's scripts/, that
          sees only scripts. template/.gitleaks.toml.jinja is deliberately
          unregistered: it is a Jinja source with `{{ cluster_name }}`
          interpolation, so it has no bytes comparable to lint/gitleaks.toml.
          COMMITTED, not fetched: template/scripts/ holds the vendored library
          scripts plus this cluster's site-data configs
          (deploy-coverage.conf, helm-values-releases.yaml,
          autoscaling-policy.yaml, netpol-except.yaml,
          alertmanager-behaviour.yaml, hosts.env, hosts-env-map.yml) and the
          one locally-written flux-env.sh. They must be committed: the
          generated repo's tests/ import check-lib-pins.py at module scope.
        file: template/Taskfile.yml.jinja -> LIB_REF
      cli:
        note: >-
          The template is RENDERED by this library's CLI
          (`weisssrv-new-project new-cluster`), so the CLI version and the
          template version are coupled at generation time, not pinned in the
          output.

# Surfaces a bump has to touch, in the order docs/VERSIONING.md walks them.
# "enforced" means something fails if it is skipped.
pin_surfaces:
  - id: ci_include_ref
    enforced: scripts/check-lib-pins.py
  - id: ansible_collection_version
    enforced: >-
      scripts/check-lib-pins.py (vendored) — it reads the sibling
      ansible/requirements.yml and holds the collection version: equal to
      variables.WEISSSRV_LIB_REF; --fix syncs it. Belt-and-braces:
      weisssrv-cluster-template
      template/tests/test_lib_pins.py::test_collection_and_taskfile_pin_the_same_ref
      (in the GENERATED repo) + weisssrv scripts/test_site_configs.py
      (requirements.yml vs variables.WEISSSRV_LIB_REF)
    note: >-
      The gate derives the wanted ref from .gitlab-ci.yml, so a consumer with
      no .gitlab-ci.yml cannot run it. The app template ships no Ansible, so
      there is nothing to gate there.
  - id: terraform_module_ref
    enforced: >-
      weisssrv-cluster-template
      template/tests/test_lib_pins.py::test_terraform_module_sources_pin_the_same_ref
      + weisssrv
      scripts/test_site_configs.py::test_terraform_module_refs_match_the_ci_variable
    note: >-
      Both consumers hold every module `?ref=` equal to their single library
      pin — the cluster template for the refs it renders, weisssrv for all
      three of its roots. Divergence between roots is a red pipeline, not a
      supported state, so bump them together and confirm with
      `terraform init -upgrade` before the plan. The app template ships no
      Terraform.
  - id: vendored_script_copies
    enforced: >-
      weisssrv scripts/test_vendored_byte_identity.py (never skips) +
      weisssrv-cluster-template tests/validate_render.py:check_vendored +
      weisssrv-app-template tests/validate_render.py:check_registered_copies
    note: >-
      ALL THREE consumers drive scripts/check-vendored-copies.py against
      scripts/vendored-paths.yml; no hand-maintained scripts/-only list is left,
      and all three gates are on their consumer's main. The per-consumer
      wrappers differ in what else they do and in how they read the library:
      weisssrv (scripts/test_vendored_byte_identity.py) passes `--ref` at the
      pin from .gitlab-ci.yml and falls back to the checkout's working tree when
      the tag is not cut yet, announcing the fallback via a skip rather than
      assuming it — the only pre-tag-tolerant wrapper, and it adds one local
      smoke test the library cannot supply (a script sharing a name with a
      library script must be registered).
      weisssrv-cluster-template (tests/validate_render.py:check_vendored) runs
      the registry gate via _check_registered_copies AND a directory walk over
      the RENDER's scripts/, so the copy is proved right before copier touches
      it and unchanged after.
      weisssrv-app-template (tests/validate_render.py:check_registered_copies)
      is the registry gate alone; it ships no scripts/-only iterator, and its
      registry rows use the copier template/ layout.
      Both template wrappers pass `--lib-path` with NO `--ref`, so they compare
      the library WORKING TREE unconditionally — which is exactly what makes the
      lib-merge -> tag -> consumer-MR order workable for them too.
      One registry in the library, read by every consumer, reaches the
      non-scripts/ copies a hand-maintained list misses: the lint profiles, the
      vendored GitHub workflows, tests/test_check_lib_pins.py.
  - id: cli_install_spec
    enforced: false
  - id: image_tag
    enforced: false
    note: >-
      :vX.Y.Z tags exist only from the release that added publish-image-tags
      (and, for ansible-deploy, the release that added that image). weisssrv now
      pulls molecule-{ci,test} at $WEISSSRV_LIB_REF, so its molecule jobs cannot
      run until the tag is cut.
