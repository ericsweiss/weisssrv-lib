---
# CI for weisssrv-lib itself: tag-less jobs on the shared non-root runner, image
# builds + molecule matrix + retag on the `infrastructure` PROJECT runner, which
# must be enabled or they sit pending. Templates: docs/INCLUDE-CONTRACT.md.
stages:
  - build
  - lint
  - test
  - security
  - ai-review
  - release

workflow:
  # Cancel superseded MR pipelines even once a non-interruptible image build has
  # started, so their molecule jobs release the privileged runner.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # The only schedule this repo creates a pipeline for: the nightly full
    # molecule matrix (molecule-tests below is its sole job).
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "full-matrix"'

# Makes the auto_cancel above reach the included lint/test jobs, none of which
# declares `interruptible`. Jobs that must survive a supersede set
# `interruptible: false` on themselves, which wins over this default.
default:
  interruptible: true

variables:
  PYYAML_VERSION: "6.0.2"

# PyYAML is pinned at THREE places that must move together (an `include:` is
# resolved before `variables:` exist): the block above, `pyyaml_version` on the
# python-tests include, and its DEFAULT in ci/internal/molecule-matrix.gitlab-ci.yml.
include:
  # .molecule-base + the molecule job template stay in a LOCAL fragment: the
  # generated MR child pipeline includes ONLY that file, so it must be
  # self-contained and must not carry the static matrix the child emits itself.
  - local: /.gitlab/ci/molecule-jobs.gitlab-ci.yml
  # The two molecule images, on the privileged runner. Their `changes` are
  # disjoint and exclude .gitlab-ci.yml, and `schedule_when: never` keeps the
  # full-matrix schedule from rebuilding them.
  - local: /ci/build/docker-build.yml
    inputs:
      job_name: build-molecule-ci
      image_name: molecule-ci
      context: docker/molecule-ci
      tags: ["infrastructure"]
      cpu_selector: "esweiss.com/cpu=modern"
      schedule_when: "never"
      digest_dotenv_var: MOLECULE_CI_IMAGE
      digest_dotenv_file: molecule-images.env
      changes:
        - "docker/molecule-ci/**/*"
  # No digest dotenv for the test image: the molecule jobs pull it by its
  # immutable `:<short-sha>` tag (see the fragment's before_script), which
  # already pins the test target per pipeline.
  - local: /ci/build/docker-build.yml
    inputs:
      job_name: build-molecule-test
      image_name: molecule-test
      context: docker/molecule-test
      tags: ["infrastructure"]
      cpu_selector: "esweiss.com/cpu=modern"
      schedule_when: "never"
      changes:
        - "docker/molecule-test/**/*"
  # The deploy job image (docker/ansible-deploy/README.md), consumed by no job
  # here: consumers pull it at a release tag. `changes` is its own context
  # alone, disjoint from both molecule contexts.
  - local: /ci/build/docker-build.yml
    inputs:
      job_name: build-ansible-deploy
      image_name: ansible-deploy
      context: docker/ansible-deploy
      tags: ["infrastructure"]
      cpu_selector: "esweiss.com/cpu=modern"
      schedule_when: "never"
      changes:
        - "docker/ansible-deploy/**/*"
  # MR-targeted molecule child pipeline. Every other input already matches this
  # repo; integration_dir points at a dir that does not exist, which is correct
  # here. The PLAN job is non-root safe, so it runs on the shared runner.
  - local: /ci/internal/molecule-matrix.gitlab-ci.yml
    inputs:
      tags: []
  - local: /ci/lint/ansible-lint.yml
    inputs:
      tags: []
      config: "-c .ansible-lint"
      targets: "ansible_collections"
      # The repo root holds ansible_collections/, so `.` is what makes the
      # collection's own FQCN self-references resolve.
      collections_path: "."
      # Dependency collections (community.general etc.) the roles' FQCN module
      # refs need — without them syntax-check fails on unresolvable modules.
      galaxy_requirements: "ansible_collections/weisssrv/infra/requirements.yml"
      changes:
        - "ansible_collections/**/*"
        - ".ansible-lint"
        - ".ansible-lint-ignore"
        - ".gitlab-ci.yml"
        # Self-application: a template-only MR must EXECUTE a rendered job, and
        # this one's before_script is where the pip_extra variable-routing lives.
        - "ci/**/*"
        # The molecule image pins the same linter versions as this job's
        # inputs; a one-sided bump must render the job that proves them equal.
        - "docker/molecule-ci/requirements.txt"
  # Self-applied with a deliberately trivial check: this repo has no service
  # registry, so the CONTENT is a no-op and its own upstream pins are bumped by
  # hand. Rendering the job still exercises the template's inputs and rules.
  - local: /ci/maintenance/version-check.yml
    inputs:
      tags: []
      job_name: version-check-selftest
      # Runs first and in the same shell as check_command, so the export below
      # proves the input is threaded rather than dropped.
      setup_command: 'export SELFTEST_SETUP=ran'
      # Writes the artifact and exits 0, via REPORT_PATH so the job proves that
      # input reaches the script too.
      check_command: 'printf ''{"selftest": "%s"}\n'' "${SELFTEST_SETUP:-MISSING}" > "$REPORT_PATH"'
      changes:
        - "ci/maintenance/version-check.yml"
        - ".gitlab-ci.yml"
  - local: /ci/lint/yaml-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      # Explicit copy of the template default; the parity gate holds all three
      # copies (here, the template, the molecule image) equal.
      yamllint_version: "1.38.0"
      config: "-c lint/yamllint-self.yml"
      targets: >-
        ci/ lint/ ansible_collections/ .gitlab/ examples/ scripts/ docker/
        .gitlab-ci.yml .pre-commit-config.yaml
      changes:
        - "ci/**/*"
        - "lint/**/*"
        - "ansible_collections/**/*"
        - ".gitlab/**/*"
        - "examples/**/*"
        - "scripts/**/*.yml"
        - "docker/**/*.yml"
        - ".gitlab-ci.yml"
        - ".pre-commit-config.yaml"
  - local: /ci/lint/shellcheck.yml
    inputs:
      tags: []
      direct_globs: "scripts/*.sh"
      # The collection ships shell in role files/ and templates/ (*.sh.j2 gets
      # the Jinja neutralizer treatment), which is what find_dir walks.
      find_dir: "ansible_collections"
      changes:
        - "scripts/**/*.sh"
        - "ansible_collections/**/*.sh"
        - "ansible_collections/**/*.sh.j2"
        - ".gitlab-ci.yml"
  - local: /ci/lint/python-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      config: "--config lint/ruff.toml"
      # examples/ carries a runnable *.example.py that tests/test_examples.py
      # loads, so it is linted like any other shipped source.
      targets: "scripts tests cli examples kubernetes"
      changes:
        - "scripts/**/*.py"
        - "tests/**/*.py"
        - "cli/**/*.py"
        - "examples/**/*.py"
        # kubernetes/reapers/ ships programs a consumer vendors into its cluster.
        - "kubernetes/**/*.py"
        - "lint/ruff.toml"
        - ".gitlab-ci.yml"
  # changes: the template default already matches the checker's roots.
  - local: /ci/lint/docs-link-check.yml
    inputs:
      tags: []
      image: python:3.13
  # Blocking over the whole tree: the script excludes tool caches itself, and
  # the convention covers every file, so neither paths nor changes is narrowed.
  # No config file here, so PyYAML is not installed.
  - local: /ci/lint/comment-length.yml
    inputs:
      tags: []
      pyyaml_version: ""
  - local: /ci/test/python-tests.yml
    inputs:
      tags: []
      # The FULL python image (not -slim) ships git — needed by the
      # check-taskfile and vendored-copy tests that init throwaway repos — so no
      # apt package is required and the job stays non-root safe.
      image: python:3.13
      apt_packages: ""
      # The binary-driven gates fail, not skip, under $CI: jq for the
      # collect-state and deploy-verify suites, amtool for the Alertmanager one.
      setup_command: "python3 scripts/ci-fetch-tools.py jq amtool"
      test_dir: "tests cli/tests"
      pytest_version: "9.1.1"
      pyyaml_version: "6.0.2"
      # copier: an optional extra, without which the CLI's new-cluster tests
      # skip. jinja2 is pinned explicitly because several test modules import
      # it directly rather than through copier's resolution.
      pip_packages: "copier==9.17.0 jinja2==3.1.6"
      changes:
        - "scripts/**/*"
        - "tests/**/*"
        - "cli/**/*"
        # test_ansible_collection.py asserts on the collection tree itself
        # (galaxy.yml deps vs requirements.yml, role metadata).
        - "ansible_collections/**/*"
        # test_generate_hosts_env.py loads examples/hosts-env-map.example.yml
        # at runtime, so the shipped example stays proven-loadable.
        - "examples/**/*"
        # test_render_templates.py renders every ci/ template and shell-parses
        # the result: the gate has to fire on the files it guards, not only on
        # the test that guards them.
        - "ci/**/*"
        # tests/test_kube_reaper.py guards the shipped reaper programs.
        - "kubernetes/**/*"
        - ".gitlab-ci.yml"
        # test_lint_version_parity.py holds the molecule image's linter pins
        # equal to the ci/lint template defaults.
        - "docker/**/*"
        # test_release_version.py asserts the release literals in the
        # copy-paste pin snippets equal cli/pyproject.toml's version.
        - "README.md"
        # test_terraform_modules.py asserts every module's README, its tftest
        # files and their expect_failures blocks.
        - "terraform/**/*"
        # test_lint_profiles.py holds the lint/ profiles and the root forks at
        # the same pins.
        - "lint/**/*"
        - ".pre-commit-config.yaml"
        - ".editorconfig"
        - ".gitattributes"
        # test_scripts_have_tests.py, test_include_contract_inputs.py and
        # test_terraform_modules.py assert on docs/SCRIPTS.md,
        # docs/INCLUDE-CONTRACT.md and docs/README.md.
        - "docs/**/*"
  # cpu_selector is site data with no template default; this instance's runners
  # allowlist ^esweiss\.com/cpu=(modern|legacy)$ and gitleaks SIGILLs on the
  # legacy nodes. allow_failure keeps its default, so findings block the merge.
  - local: /ci/security/secret-detection.yml
    inputs:
      tags: []
      cpu_selector: "esweiss.com/cpu=modern"
  # terraform/modules/ is the library-side workload; both jobs run in the lint
  # stage because this pipeline has no validate stage. `test: true` because only
  # `terraform test` exercises the validation blocks (mock_provider, no creds).
  - local: /ci/validate/terraform.yml
    inputs:
      tags: []
      validate_stage: lint
      fmt_dir: "terraform/"
      module_glob: "terraform/modules/*/"
      test: true
      changes:
        - "terraform/**/*"
        - ".gitlab-ci.yml"
  # AI code review; everything but the runner tag and `needs` is the template
  # default. secrets_source stays `env`: the shared runner is non-root and
  # cannot apt-install the op CLI, so both secrets come from masked CI variables.
  - local: /ci/review/pr-agent.yml
    inputs:
      tags: []
      needs:
        - job: yaml-lint
          optional: true
        - job: shellcheck
          optional: true
        - job: ci-templates-parse
          optional: true
        - job: python-tests
          optional: true
  # Cuts this library's OWN tag — the one every consumer's `ref:` / `?ref=` /
  # `version:` pins. No `needs:`, so the last-declared `release` stage gates it
  # on every earlier job. major_on_zero stays false while the tag is 0.x.
  - local: /ci/release/semantic-release.yml
    inputs:
      tags: []

# Republish every image this repo builds under the tag semantic-release just cut,
# so a consumer pins images at the SAME ref as the templates. The source is this
# pipeline's :<short-sha> when it rebuilt, else :latest; the alias is additive.
publish-image-tags:
  stage: release
  tags: ["infrastructure"]
  # Writes tags consumers pin; must not be cancelled by the next merge.
  interruptible: false
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  needs:
    - job: semantic-release
      artifacts: true
  image:
    # CLI-only image (no daemon); digest-pinned multi-arch index, same 27.5.1
    # line as the dind service and ci/build/docker-build.yml's static CLI.
    name: docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    entrypoint: [""]
  services:
    - name: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - |
      set -eu
      # release.json is written by scripts/semantic-release.py with indent=2, so
      # a top-level key is the only thing at exactly two spaces of indent; the
      # notes body is a single escaped JSON string and cannot match.
      released=$(sed -n 's/^  "released": \([a-z]*\),*$/\1/p' release.json | head -n1)
      tag=$(sed -n 's/^  "tag": "\([^"]*\)",*$/\1/p' release.json | head -n1)
      if [ "$released" != "true" ]; then
        echo "no release cut in this pipeline — nothing to retag"; exit 0
      fi
      [ -n "$tag" ] || { echo "release.json says released but carries no tag"; exit 1; }
      i=0
      while [ "$i" -lt 30 ]; do
        if docker info >/dev/null 2>&1; then break; fi
        i=$((i + 1))
        sleep 2
      done
      docker info >/dev/null 2>&1 || { echo "docker daemon did not become ready"; exit 1; }
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      for img in molecule-ci molecule-test ansible-deploy; do
        ref="${CI_REGISTRY_IMAGE}/${img}"
        if docker pull "${ref}:${CI_COMMIT_SHORT_SHA}" >/dev/null 2>&1; then
          src="${ref}:${CI_COMMIT_SHORT_SHA}"
        elif docker pull "${ref}:latest" >/dev/null 2>&1; then
          src="${ref}:latest"
        else
          # First release of a fresh repo: the images have never been pushed.
          # Warn instead of reddening the pipeline that already cut the tag.
          echo "WARNING: no ${ref} image to retag — ${tag} not published for ${img}"
          continue
        fi
        docker tag "$src" "${ref}:${tag}"
        docker push "${ref}:${tag}"
        echo "published ${ref}:${tag} (from ${src})"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

# Same-named override MERGES with the included python-tests job at the map
# level: these variables land on it without touching its scripts.
python-tests:
  variables:
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    KUBERNETES_MEMORY_REQUEST: "512Mi"
    # Full clone: TestReleaseLineage binds galaxy.yml / cli/pyproject.toml to
    # the tag semantic-release will cut, and the shallow default drops those
    # assertions once the last release falls outside the clone depth.
    GIT_DEPTH: "0"
  # These `needs:` chains keep the tag-less fan-out inside the shared runner's
  # pod quota; `optional:` so a changes-skipped dependency unblocks immediately.
  # A new tag-less job goes on a chain.
  needs:
    - job: python-lint
      optional: true

ansible-lint:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  needs:
    - job: yaml-lint
      optional: true

secret_detection:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  needs:
    - job: shellcheck
      optional: true

molecule-plan:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  needs:
    - job: docs-link-check
      optional: true

# Right-size the tag-less job pods (the runner allows overrides <= 6Gi): these
# jobs use ~200Mi, so declaring 1Gi keeps a full fan-out inside the namespace
# quota instead of failing at pod creation.
yaml-lint:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

shellcheck:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

python-lint:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

docs-link-check:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

comment-length:
  needs:
    - job: yaml-lint
      optional: true

terraform-fmt:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

terraform-validate:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

# Quota contention on the shared runner surfaces as runner_system_failure at
# pod creation when a pipeline's fan-out bursts past the namespace quota;
# retrying turns that into throttling. Every lib template bakes the same block.
.retry-runner-contention: &retry-runner-contention
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure

# Shared by both rules of the job that reads them, so one path cannot drift.
.collection-changes: &collection-changes
  - "ansible_collections/**/*"
  - "scripts/check-molecule-matrix-coverage.sh"
  - "scripts/check-role-defaults-documented.py"
  - "scripts/check-role-readme-literals.py"
  - ".gitlab-ci.yml"

.collection-build-changes: &collection-build-changes
  - "ansible_collections/**/*"
  - ".gitlab-ci.yml"

ci-templates-parse:
  <<: *retry-runner-contention
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  # Smoke: every CI template must be valid multi-document YAML (a spec header +
  # config). Catches a malformed template before a consumer includes it.
  stage: lint
  image: python:3.13-slim
  needs: []
  before_script:
    - pip install --user --quiet "pyyaml==${PYYAML_VERSION}"
  script:
    - |
      python - <<'PY'
      import glob, re, sys, yaml

      class Loader(yaml.SafeLoader):
          """SafeLoader that understands GitLab's `!reference [job, key]`."""

      Loader.add_constructor("!reference", lambda l, n: l.construct_sequence(n))

      bad = 0
      found = sorted(glob.glob("ci/**/*.yml", recursive=True))
      for f in found:
          try:
              list(yaml.load_all(open(f), Loader=Loader))
              print("ok  ", f)
          except Exception as e:  # noqa: BLE001
              bad = 1
              print("FAIL", f, e)
      # Every template docs/INCLUDE-CONTRACT.md names must be in the checkout:
      # one that exists only on a working tree (untracked, or swallowed by a
      # .gitignore pattern) makes a consumer's include resolve at no ref.
      contract = open("docs/INCLUDE-CONTRACT.md").read()
      documented = set(re.findall(r"ci/[A-Za-z0-9_-]+/[A-Za-z0-9._-]+\.yml", contract))
      for r in sorted(documented - set(found)):
          bad = 1
          print("FAIL", r, "is documented in docs/INCLUDE-CONTRACT.md but absent from the checkout")
      sys.exit(bad)
      PY

collection-checks:
  <<: *retry-runner-contention
  needs:
    - job: ci-templates-parse
      optional: true
  # Two invariants nothing else covers: the matrix below lists every scenario dir
  # on disk (the generator's own check is ROLE-level), and the built collection
  # matches `build_ignore` (a bad pattern exits 0, so the tarball is inspected).
  stage: lint
  image: python:3.13-slim
  tags: []
  variables:
    CI_FILE: .gitlab-ci.yml
    ROLES_DIR: ansible_collections/weisssrv/infra/roles
    # The integration stacks live in the consuming cluster repo, so this repo
    # declares none. A non-empty path that does not resolve is exit 2.
    INTEGRATION_DIR: ""
    # The ansible-core that ansible 14.4.0 (docker/molecule-ci/requirements.txt)
    # resolves to; the collection's requires_ansible floor stays 2.18 for
    # consumers, held honest by the collection-floor-build job.
    ANSIBLE_CORE_VERSION: "2.21.4"
    # The runner pod's uid has no passwd entry; ansible-galaxy resolves the
    # build user from these and hard-exits ("No username set in the
    # environment") when neither exists.
    USER: gitlab-runner
    LOGNAME: gitlab-runner
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    KUBERNETES_MEMORY_REQUEST: "512Mi"
  before_script:
    - pip install --user --quiet "pyyaml==${PYYAML_VERSION}" "ansible-core==${ANSIBLE_CORE_VERSION}"
  script:
    - bash scripts/check-molecule-matrix-coverage.sh
    - python3 scripts/check-role-defaults-documented.py
    - >-
      python3 scripts/check-role-readme-literals.py
      --site-domain esweiss.com --site-domain ericsweiss.com
      --site-literal '(?<![\w.])10\.0\.(10|20)\.\d{1,3}(?!\.?\d)'
    - |
      "$(python -m site --user-base)/bin/ansible-galaxy" collection build \
        --force --output-path /tmp ansible_collections/weisssrv/infra
    - |
      set -e
      tarball=$(ls -1 /tmp/weisssrv-infra-*.tar.gz)
      entries=$(tar -tzf "$tarball")
      # Nothing build_ignore excludes may ship: molecule-shared/ resolves only
      # inside this checkout, and a role's molecule/ dir is test scaffolding.
      leaked=$(echo "$entries" | grep -E '^molecule-shared/|^roles/[^/]+/molecule/' || true)
      if [ -n "$leaked" ]; then
        echo "build_ignore leaked test scaffolding into the artifact:"; echo "$leaked"; exit 1
      fi
      # ...and nothing real may be dropped: every role dir on disk must ship.
      echo "$entries" | grep '^roles/' | cut -d/ -f2 | sort -u > /tmp/packed-roles
      ls -1 "$ROLES_DIR" | sort > /tmp/disk-roles
      missing=$(comm -23 /tmp/disk-roles /tmp/packed-roles)
      if [ -n "$missing" ]; then
        echo "build_ignore dropped roles from the artifact:"; echo "$missing"; exit 1
      fi
      echo "artifact ok: $(wc -l < /tmp/packed-roles) roles, no molecule scaffolding"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *collection-changes
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *collection-changes
    - if: '$CI_PIPELINE_SOURCE == "web"'

# The collection advertises requires_ansible >= 2.18 while every other job runs
# the newer core the molecule-ci image pins, so this job is the only thing
# holding the declared floor honest.
collection-floor-build:
  <<: *retry-runner-contention
  stage: lint
  image: python:3.13-slim
  tags: []
  variables:
    # The floor meta/runtime.yml advertises.
    ANSIBLE_CORE_FLOOR: "2.18.18"
    # The runner pod's uid has no passwd entry; ansible-galaxy resolves the
    # build user from these and hard-exits ("No username set in the
    # environment") when neither exists.
    USER: gitlab-runner
    LOGNAME: gitlab-runner
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    KUBERNETES_MEMORY_REQUEST: "512Mi"
  before_script:
    - pip install --user --quiet "ansible-core==${ANSIBLE_CORE_FLOOR}"
  script:
    - |
      set -e
      galaxy_bin="$(python -m site --user-base)/bin"
      "$galaxy_bin/ansible-galaxy" collection build \
        --force --output-path /tmp ansible_collections/weisssrv/infra
      # The roles address community.general and ansible.posix by FQCN, so
      # syntax-check cannot resolve their modules without these installed.
      "$galaxy_bin/ansible-galaxy" collection install \
        -r ansible_collections/weisssrv/infra/requirements.yml -p /tmp/collections
      export ANSIBLE_COLLECTIONS_PATH="$PWD:/tmp/collections"
      for play in ansible_collections/weisssrv/infra/roles/*/molecule/*/converge.yml; do
        "$galaxy_bin/ansible-playbook" --syntax-check "$play"
      done
      echo "collection parses on ansible-core ${ANSIBLE_CORE_FLOOR}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *collection-build-changes
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *collection-build-changes
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Molecule unit tests, one parallel job per role/scenario. This full static
# matrix is the scenario UNIVERSE: scripts/generate-molecule-pipeline.py reads
# it to narrow an MR run, and a role dir with no entry here fails that generator.
molecule-tests:
  extends: .molecule-test-job
  parallel:
    matrix:
      - ROLE: acme_certs
        SCENARIO: default
      - ROLE: adguard_home
        SCENARIO: default
      # Second scenario: the AdGuard-over-HTTPS branch, self-contained (no -c base).
      - ROLE: adguard_home
        SCENARIO: tls
      - ROLE: adguard_sync
        SCENARIO: default
      - ROLE: alloy_host
        SCENARIO: default
      - ROLE: apt_signed_repo
        SCENARIO: default
      - ROLE: base
        SCENARIO: default
      - ROLE: compose_app
        SCENARIO: default
      - ROLE: docker_engine
        SCENARIO: default
      - ROLE: encrypted_swap
        SCENARIO: default
      - ROLE: gitlab
        SCENARIO: default
      - ROLE: home_assistant
        SCENARIO: default
      - ROLE: immich
        SCENARIO: default
      - ROLE: immich_ml
        SCENARIO: default
      # Split into two jobs to halve wall time.
      - ROLE: k3s
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: agent
      - ROLE: nas_storage
        SCENARIO: default
      - ROLE: nextcloud
        SCENARIO: default
      - ROLE: nfs_tls
        SCENARIO: default
      - ROLE: nic_tuning
        SCENARIO: default
      - ROLE: node_exporter_host
        SCENARIO: default
      - ROLE: plex
        SCENARIO: default
      - ROLE: postfix_null_client
        SCENARIO: default
      - ROLE: prometheus_exporter
        SCENARIO: default
      - ROLE: proxmox_backup
        SCENARIO: default
      - ROLE: proxmox_firewall
        SCENARIO: default
      - ROLE: proxmox_ha
        SCENARIO: default
      - ROLE: proxmox_lxc
        SCENARIO: default
      - ROLE: proxmox_vm
        SCENARIO: default
      - ROLE: qol
        SCENARIO: default
      - ROLE: resolv_conf
        SCENARIO: default
      # Second scenario: the opt-out branch (`resolv_conf_search_domains: []`).
      - ROLE: resolv_conf
        SCENARIO: empty-search
      - ROLE: restic_offsite
        SCENARIO: default
      - ROLE: smtp_relay
        SCENARIO: default
      - ROLE: tailscale
        SCENARIO: default
      - ROLE: textfile_collector
        SCENARIO: default
      - ROLE: unbound
        SCENARIO: default
      - ROLE: unbound_exporter
        SCENARIO: default
      - ROLE: vfio_passthrough
        SCENARIO: default
      - ROLE: zfs_arc_cap
        SCENARIO: default
      - ROLE: zfs_encryption
        SCENARIO: default
      - ROLE: zfs_exporter
        SCENARIO: default
      - ROLE: zvol_mount
        SCENARIO: default
  rules:
    # The nightly cross-role regression net, beyond what an MR or a merge
    # selects. Needs a pipeline schedule carrying SCHEDULE_TYPE=full-matrix.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "full-matrix"'
    # Any other schedule must never fire this whole privileged fan-out.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # No merge_request_event clause: MRs run the targeted child instead.
    # Subtrees, not `ansible_collections/**/*`: galaxy.yml and MIGRATING.md move
    # on every release MR, which would fire the whole matrix for docs-only work.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "ansible_collections/weisssrv/infra/roles/**/*"
        - "ansible_collections/weisssrv/infra/plugins/**/*"
        - "ansible_collections/weisssrv/infra/molecule-shared/**/*"
        - "ansible_collections/weisssrv/infra/meta/**/*"
        - "ansible_collections/weisssrv/infra/requirements.yml"
        - "docker/molecule-ci/**/*"
        - "docker/molecule-test/**/*"
        - "scripts/molecule-retry.sh"
        - "scripts/sanitize-junit-expected-failures.py"
        - ".gitlab/ci/molecule-jobs.gitlab-ci.yml"
        # This file defines the matrix and the plan/trigger wiring: a CI-only
        # change must re-run the suite rather than pass green and break the NEXT
        # collection MR.
        - ".gitlab-ci.yml"
    - if: '$CI_PIPELINE_SOURCE == "web"'
