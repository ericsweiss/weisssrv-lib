---
# CI for weisssrv-lib itself. Two runner classes: the lint/test/security/review
# jobs are TAG-LESS and non-root safe (`pip install --user`, `python -m`, no
# apt, no /usr/local/bin writes) and land on the shared runner; the three image
# builds, the molecule matrix and the image retag need privileged
# Docker-in-Docker and are tagged `infrastructure`.
#
# ADMIN PREREQUISITE: `infrastructure` is a PROJECT runner — it must be enabled
# for this project (Settings > CI/CD > Runners) or every tagged job sits pending.
#
# The ci/ templates are `spec:inputs` files, not standalone pipelines, so they
# cannot be `glab ci lint`'d in isolation: ci-templates-parse below is the
# YAML/spec smoke, and the `include:` block renders the rest for real. Which
# templates cannot be self-applied here, and why, is in docs/INCLUDE-CONTRACT.md.
stages:
  - build
  - lint
  - test
  - security
  - ai-review
  - release

workflow:
  # Aggressively cancel superseded MR pipelines. GitLab's default auto-cancel is
  # "conservative": it stops cancelling the moment any NON-interruptible job (the
  # image builds) has started — which on an image-touching MR would leave every
  # heavy molecule job of the previous pipeline running on the scarce privileged
  # runner. `interruptible` cancels those while leaving the builds alone.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Makes the auto_cancel above actually reach the included lint/test jobs, none of
# which declares `interruptible`. The jobs that must survive a supersede (both
# image builds, semantic-release, the release retag) set `interruptible: false`
# on themselves, which wins over this default.
default:
  interruptible: true

variables:
  PYYAML_VERSION: "6.0.2"

# Self-application: the library consumes its OWN templates instead of
# hand-rolling equivalents, so an undeclared input or a malformed render fails
# the MR that introduced it (includes expand at pipeline creation regardless of
# any job's `changes:`). EXECUTING a rendered script is separately path-gated,
# so python-tests and ansible-lint carry `ci/**/*` and a template-only MR always
# runs those two for real. `local:` resolves against this pipeline's commit; a
# `project:`+`ref:` self-include would resolve the ref, not the branch under
# review.
#
# PyYAML is pinned at THREE places that must move together — an `include:` is
# resolved before `variables:` exist, so a pin there cannot reference
# $PYYAML_VERSION: the `variables:` block above (used by the two inline jobs),
# the `pyyaml_version` input passed to ci/test/python-tests.yml below, and the
# `pyyaml_version` DEFAULT in ci/internal/molecule-matrix.gitlab-ci.yml.
include:
  # .molecule-base + the molecule job template stay in a LOCAL fragment (not a
  # ci/ template): the generated MR child pipeline (molecule-plan ->
  # molecule-trigger) includes ONLY that file, so it must be self-contained, and
  # it must not carry the static matrix the child emits itself. Including it here
  # is what lets the static `molecule-tests` job below extend the same template.
  - local: /.gitlab/ci/molecule-jobs.gitlab-ci.yml
  # The two molecule images, both on the privileged runner — DinD cannot run
  # tag-less. Their `changes` are DISJOINT so each gates on only its own
  # context: a pip pin bump must not rebuild molecule-test's ~40-package apt
  # layer, and a molecule-test apt change must not rebuild molecule-ci's
  # pip+galaxy layers. Deliberately NOT gated on .gitlab-ci.yml either — an
  # unrelated CI edit must not trigger a multi-minute DinD rebuild and re-push.
  # build-molecule-ci additionally emits the digest dotenv that pins
  # MOLECULE_CI_IMAGE for the matrix and for the child pipeline's jobs.
  - local: /ci/build/docker-build.yml
    inputs:
      job_name: build-molecule-ci
      image_name: molecule-ci
      context: docker/molecule-ci
      tags: ["infrastructure"]
      digest_dotenv_var: MOLECULE_CI_IMAGE
      digest_dotenv_file: molecule-images.env
      changes:
        - "docker/molecule-ci/**/*"
  # No digest dotenv for the test image: the molecule jobs pull it by its
  # immutable `:<short-sha>` tag (see the fragment's before_script), which
  # already pins the test target per pipeline.
  - local: /ci/build/docker-build.yml
    inputs:
      job_name: build-molecule-test
      image_name: molecule-test
      context: docker/molecule-test
      tags: ["infrastructure"]
      changes:
        - "docker/molecule-test/**/*"
  # The deploy job image (docker/ansible-deploy/README.md). No job in THIS
  # pipeline consumes it — it is built here so consumers can pull it at a
  # release tag instead of re-installing the op CLI, ansible and git on every
  # deploy. `changes` is its own context alone, disjoint from both molecule
  # contexts for the same reason they are disjoint from each other.
  - local: /ci/build/docker-build.yml
    inputs:
      job_name: build-ansible-deploy
      image_name: ansible-deploy
      context: docker/ansible-deploy
      tags: ["infrastructure"]
      changes:
        - "docker/ansible-deploy/**/*"
  # MR-targeted molecule child pipeline. Every other input already matches this
  # repo (roles_dir/ci_file/jobs_include/global_triggers/changes and the two
  # image jobs); integration_dir points at a dir that does not exist, which is
  # correct — this library ships no integration suite. tags: the PLAN job is
  # non-root safe, so it runs on the shared runner; the child's jobs take their
  # tags from the fragment.
  - local: /ci/internal/molecule-matrix.gitlab-ci.yml
    inputs:
      tags: []
  - local: /ci/lint/ansible-lint.yml
    inputs:
      tags: []
      config: "-c .ansible-lint"
      targets: "ansible_collections"
      # The repo root holds ansible_collections/, so `.` is what makes the
      # collection's own FQCN self-references resolve.
      collections_path: "."
      # Dependency collections (community.general etc.) the roles' FQCN module
      # refs need — without them syntax-check fails on unresolvable modules.
      galaxy_requirements: "ansible_collections/weisssrv/infra/requirements.yml"
      changes:
        - "ansible_collections/**/*"
        - ".ansible-lint"
        - ".ansible-lint-ignore"
        - ".gitlab-ci.yml"
        # Self-application: a template-only MR must EXECUTE a rendered job, and
        # this one's before_script is where the pip_extra variable-routing lives.
        - "ci/**/*"
        # The molecule image pins the same linter versions as this job's
        # inputs; a one-sided bump must render the job that proves them equal.
        - "docker/molecule-ci/requirements.txt"
  # Self-applied with a deliberately trivial check. The CONTENT is a no-op:
  # check-versions.py reads a service registry keyed off a consumer's
  # `*_version` vars file, and this repo has none — its own upstream pins
  # (the two base images, the static docker CLI, the pip pins in
  # docker/molecule-ci/requirements.txt) are bumped by hand and are NOT
  # tracked here. Rendering the job still exercises its inputs,
  # interpolation, rules and artifact behaviour in the MR that changes it
  # instead of in a consumer.
  - local: /ci/maintenance/version-check.yml
    inputs:
      tags: []
      job_name: version-check-selftest
      # setup_command runs FIRST and in the same shell as check_command, so an
      # export here is observable in the report below. That is the point: it
      # proves the input is threaded, which `true` (now also the default) could
      # not distinguish from the input being dropped entirely.
      setup_command: 'export SELFTEST_SETUP=ran'
      # Writes the artifact and exits 0. `printf` rather than `echo` for the
      # literal, and REPORT_PATH rather than a hard-coded name so the job proves
      # that input reaches the script too — a hard-coded name would still pass
      # while REPORT_PATH went nowhere.
      check_command: 'printf ''{"selftest": "%s"}\n'' "${SELFTEST_SETUP:-MISSING}" > "$REPORT_PATH"'
      changes:
        - "ci/maintenance/version-check.yml"
        - ".gitlab-ci.yml"
  - local: /ci/lint/yaml-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      # Explicit copy of the template default; the parity gate holds all three
      # copies (here, the template, the molecule image) equal.
      yamllint_version: "1.38.0"
      config: "-c .yamllint"
      targets: "ci/ lint/ taskfiles/ ansible_collections/ .gitlab/ .gitlab-ci.yml"
      changes:
        - "ci/**/*"
        - "lint/**/*"
        - "taskfiles/**/*"
        - "ansible_collections/**/*"
        - ".gitlab/**/*"
        - ".gitlab-ci.yml"
        - ".yamllint"
  - local: /ci/lint/shellcheck.yml
    inputs:
      tags: []
      direct_globs: "scripts/*.sh"
      # The collection ships shell in role files/ and templates/ (*.sh.j2 gets
      # the Jinja neutralizer treatment), which is what find_dir walks.
      find_dir: "ansible_collections"
      changes:
        - "scripts/**/*.sh"
        - "ansible_collections/**/*.sh"
        - "ansible_collections/**/*.sh.j2"
        - ".gitlab-ci.yml"
  - local: /ci/lint/python-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      config: "--config lint/ruff.toml"
      # examples/ carries a runnable *.example.py that tests/test_examples.py
      # loads, so it is linted like any other shipped source.
      targets: "scripts tests cli examples"
      changes:
        - "scripts/**/*.py"
        - "tests/**/*.py"
        - "cli/**/*.py"
        - "examples/**/*.py"
        - "lint/ruff.toml"
        - ".gitlab-ci.yml"
  - local: /ci/lint/docs-link-check.yml
    inputs:
      tags: []
      image: python:3.13
      # The checker's default roots are every git-TRACKED *.md, so the job
      # already covers AGENTS.md, cli/README.md, lint/README.md and
      # taskfiles/README.md — `changes:` has to match that scope or an MR
      # touching only one of them never fires the gate.
      changes:
        - "**/*.md"
        - "scripts/check-doc-links.py"
  - local: /ci/test/python-tests.yml
    inputs:
      tags: []
      # The FULL python image (not -slim) ships git — needed by the
      # check-taskfile and vendored-copy tests that init throwaway repos — so no
      # apt package is required and the job stays non-root safe.
      image: python:3.13
      apt_packages: ""
      test_dir: "tests cli/tests"
      pytest_version: "9.1.1"
      pyyaml_version: "6.0.2"
      # copier: without it the CLI's new-cluster tests skip (it is an optional
      # extra of the package, not a runtime dependency).
      pip_packages: "copier==9.17.0"
      changes:
        - "scripts/**/*"
        - "tests/**/*"
        - "cli/**/*"
        - "taskfiles/**/*"
        # test_ansible_collection.py asserts on the collection tree itself
        # (galaxy.yml deps vs requirements.yml, role metadata).
        - "ansible_collections/**/*"
        # test_generate_hosts_env.py loads examples/hosts-env-map.example.yml
        # at runtime, so the shipped example stays proven-loadable.
        - "examples/**/*"
        # test_render_templates.py renders every ci/ template and shell-parses
        # the result: the gate has to fire on the files it guards, not only on
        # the test that guards them.
        - "ci/**/*"
        - ".gitlab-ci.yml"
        # test_lint_version_parity.py holds the molecule image's linter pins
        # equal to the ci/lint template defaults.
        - "docker/**/*"
        # test_release_version.py asserts the release literals in the
        # copy-paste pin snippets equal cli/pyproject.toml's version.
        - "README.md"
        - "terraform/modules/*/README.md"
  # cpu_selector keeps its default: gitleaks SIGILLs on the legacy-CPU nodes and
  # the shared runner allowlists exactly that override. allow_failure keeps its
  # default too — findings block here, which is the point of shipping the gate.
  - local: /ci/security/secret-detection.yml
    inputs:
      tags: []
  # terraform/modules/ is the library-side workload for this template. Both jobs
  # run in the lint stage (this pipeline has no validate stage), and validate
  # loops over the module dirs rather than the template's `terraform/*/` default.
  # `test: true` because every module here ships tests/validation.tftest.hcl —
  # `terraform validate` evaluates no caller values, so the variable
  # `validation` blocks and the `precondition`s are only exercised by
  # `terraform test`. Every test file declares mock_provider, so no credentials.
  - local: /ci/validate/terraform.yml
    inputs:
      tags: []
      validate_stage: lint
      fmt_dir: "terraform/"
      module_glob: "terraform/modules/*/"
      test: true
      changes:
        - "terraform/**/*"
        - ".gitlab-ci.yml"
  # AI code review. Everything but the runner tag and the needs list is the
  # template default (pragent 0.40.0 digest-pinned, gpt-5.6 at xhigh, review +
  # improve, inline dual-publishing at score >= 6, `$OPENAI__KEY` gate,
  # allow_failure). secrets_source stays `env`: this library's shared runner is
  # non-root and cannot apt-install the 1Password CLI, so the two secrets come
  # from masked CI/CD variables (OPENAI__KEY, GITLAB__PERSONAL_ACCESS_TOKEN) that
  # pr-agent reads straight from the environment. The gate means the job is not
  # CREATED until those variables are set — an absent AI review is expected, not
  # a failure.
  - local: /ci/review/pr-agent.yml
    inputs:
      tags: []
      needs:
        - job: yaml-lint
          optional: true
        - job: shellcheck
          optional: true
        - job: ci-templates-parse
          optional: true
        - job: python-tests
          optional: true
  # Cuts this library's OWN tag from the conventional commits merged to main —
  # the tag every consumer's `ref:` / `?ref=` / `version:` pins. Defaults
  # elsewhere: `release` is declared LAST above and the job sets no `needs:`, so
  # stage ordering gates the release on every earlier job passing; the template's
  # rules are already main-only (schedule excluded) and `resource_group`
  # serializes rapid merges. major_on_zero stays false — while the tag is 0.x, a
  # `feat!:` bumps MINOR, and leaving initial development stays a deliberate
  # call (flip the input for the release that means 1.0.0).
  - local: /ci/release/semantic-release.yml
    inputs:
      tags: []

# Republish every image this repo builds under the tag semantic-release just
# cut, so a consumer pins the image at the SAME ref it pins the templates at
# (molecule-ci:vX.Y.Z). The build jobs are path-gated, so most releases ship an
# image built by an earlier pipeline: the source is this pipeline's :<short-sha>
# when it rebuilt, else the current :latest. Both immutable tags stay published
# either way — this only adds the version alias.
publish-image-tags:
  stage: release
  tags: ["infrastructure"]
  # Writes tags consumers pin; must not be cancelled by the next merge.
  interruptible: false
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  needs:
    - job: semantic-release
      artifacts: true
  image:
    # CLI-only image (no daemon); digest-pinned multi-arch index, same 27.5.1
    # line as the dind service and ci/build/docker-build.yml's static CLI.
    name: docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    entrypoint: [""]
  services:
    - name: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - |
      set -eu
      # release.json is written by scripts/semantic-release.py with indent=2, so
      # a top-level key is the only thing at exactly two spaces of indent; the
      # notes body is a single escaped JSON string and cannot match.
      released=$(sed -n 's/^  "released": \([a-z]*\),*$/\1/p' release.json | head -n1)
      tag=$(sed -n 's/^  "tag": "\([^"]*\)",*$/\1/p' release.json | head -n1)
      if [ "$released" != "true" ]; then
        echo "no release cut in this pipeline — nothing to retag"; exit 0
      fi
      [ -n "$tag" ] || { echo "release.json says released but carries no tag"; exit 1; }
      # `if` rather than `cmd && break`: an AND-list whose first command fails
      # returns non-zero, which `set -e` would take as a reason to exit.
      i=0
      while [ "$i" -lt 30 ]; do
        if docker info >/dev/null 2>&1; then break; fi
        i=$((i + 1))
        sleep 2
      done
      docker info >/dev/null 2>&1 || { echo "docker daemon did not become ready"; exit 1; }
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      for img in molecule-ci molecule-test ansible-deploy; do
        ref="${CI_REGISTRY_IMAGE}/${img}"
        if docker pull "${ref}:${CI_COMMIT_SHORT_SHA}" >/dev/null 2>&1; then
          src="${ref}:${CI_COMMIT_SHORT_SHA}"
        elif docker pull "${ref}:latest" >/dev/null 2>&1; then
          src="${ref}:latest"
        else
          # First release of a fresh repo: the images have never been pushed.
          # Warn instead of reddening the pipeline that already cut the tag.
          echo "WARNING: no ${ref} image to retag — ${tag} not published for ${img}"
          continue
        fi
        docker tag "$src" "${ref}:${tag}"
        docker push "${ref}:${tag}"
        echo "published ${ref}:${tag} (from ${src})"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

# Same-named override MERGES with the included python-tests job at the map
# level: these variables land on it without touching its scripts.
python-tests:
  variables:
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    KUBERNETES_MEMORY_REQUEST: "512Mi"
    # Full clone: TestReleaseLineage binds galaxy.yml / cli/pyproject.toml to the
    # tag semantic-release will cut, and on the shallow default those assertions
    # vanish the moment the last release falls outside the clone depth — i.e.
    # exactly when the release is largest. Same reason the release job sets it.
    GIT_DEPTH: "0"
  # Fan-out shaping (see .retry-runner-contention below): the quota admits 7
  # concurrent 5Gi job pods and this pipeline creates 12 tag-less jobs, so the
  # templates' needs:[] would burst 5 past the quota — deterministically, at
  # pod-creation time, for the length of the first wave. These overrides put
  # the 5 overflow jobs behind first-wave jobs (optional: a changes-skipped
  # dep just unblocks immediately), capping the burst at exactly quota width.
  needs:
    - job: python-lint
      optional: true

ansible-lint:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  needs:
    - job: yaml-lint
      optional: true

secret_detection:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  needs:
    - job: shellcheck
      optional: true

molecule-plan:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  needs:
    - job: docs-link-check
      optional: true

# Right-size the tag-less job pods (the runner allows overrides <= 6Gi): these
# jobs use ~200Mi, so declaring 1Gi keeps a full fan-out inside the namespace
# quota instead of failing at pod creation.
yaml-lint:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

shellcheck:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

python-lint:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

docs-link-check:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

terraform-fmt:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

terraform-validate:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

# Quota contention on the shared runner surfaces as runner_system_failure at
# pod creation when a pipeline's fan-out bursts past the namespace quota;
# retrying turns that into throttling. Every lib template bakes the same block.
.retry-runner-contention: &retry-runner-contention
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure

ci-templates-parse:
  <<: *retry-runner-contention
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  # Smoke: every CI template must be valid multi-document YAML (a spec header +
  # config). Catches a malformed template before a consumer includes it.
  stage: lint
  image: python:3.13-slim
  needs: []
  before_script:
    - pip install --user --quiet "pyyaml==${PYYAML_VERSION}"
  script:
    - |
      python - <<'PY'
      import glob, os, sys, yaml

      class Loader(yaml.SafeLoader):
          """SafeLoader that understands GitLab's `!reference [job, key]`."""

      Loader.add_constructor("!reference", lambda l, n: l.construct_sequence(n))

      bad = 0
      found = sorted(glob.glob("ci/**/*.yml", recursive=True))
      for f in found:
          try:
              list(yaml.load_all(open(f), Loader=Loader))
              print("ok  ", f)
          except Exception as e:  # noqa: BLE001
              bad = 1
              print("FAIL", f, e)
      # Regression guard: every documented template must be TRACKED — a file
      # that exists only on disk makes a consumer's include resolve at no ref.
      required = ["ci/build/docker-build.yml"]
      for r in required:
          if r not in found or not os.path.isfile(r):
              bad = 1
              print("FAIL", r, "is required but not present in the checkout")
      sys.exit(bad)
      PY

collection-checks:
  <<: *retry-runner-contention
  needs:
    - job: ci-templates-parse
      optional: true
  # Two invariants nothing else covers:
  #   - the matrix below lists every scenario dir on disk. The generator's own
  #     CoverageError is ROLE-level, so a second scenario under an already-listed
  #     role would run in no job at all; this gate names it.
  #   - the built collection matches `build_ignore`. A bad pattern either ships
  #     molecule scaffolding into every consumer's install or drops real content,
  #     and `ansible-galaxy collection build` exits 0 either way, so the tarball
  #     is inspected below.
  stage: lint
  image: python:3.13-slim
  tags: []
  variables:
    CI_FILE: .gitlab-ci.yml
    ROLES_DIR: ansible_collections/weisssrv/infra/roles
    INTEGRATION_DIR: ansible_collections/weisssrv/infra/integration-tests
    # ansible 11.6.0 (docker/molecule-ci/requirements.txt) resolves
    # ansible-core ~=2.18.6, which is also the collection's requires_ansible
    # floor — build with the core the roles are tested on.
    ANSIBLE_CORE_VERSION: "2.18.18"
    # The runner pod's uid has no passwd entry; ansible-galaxy resolves the
    # build user from these and hard-exits ("No username set in the
    # environment") when neither exists.
    USER: gitlab-runner
    LOGNAME: gitlab-runner
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    KUBERNETES_MEMORY_REQUEST: "512Mi"
  before_script:
    - pip install --user --quiet "pyyaml==${PYYAML_VERSION}" "ansible-core==${ANSIBLE_CORE_VERSION}"
  script:
    - bash scripts/check-molecule-matrix-coverage.sh
    - |
      "$(python -m site --user-base)/bin/ansible-galaxy" collection build \
        --force --output-path /tmp ansible_collections/weisssrv/infra
    - |
      set -e
      tarball=$(ls -1 /tmp/weisssrv-infra-*.tar.gz)
      entries=$(tar -tzf "$tarball")
      # Nothing build_ignore excludes may ship: molecule-shared/ resolves only
      # inside this checkout, and a role's molecule/ dir is test scaffolding.
      leaked=$(echo "$entries" | grep -E '^molecule-shared/|^roles/[^/]+/molecule/' || true)
      if [ -n "$leaked" ]; then
        echo "build_ignore leaked test scaffolding into the artifact:"; echo "$leaked"; exit 1
      fi
      # ...and nothing real may be dropped: every role dir on disk must ship.
      echo "$entries" | grep '^roles/' | cut -d/ -f2 | sort -u > /tmp/packed-roles
      ls -1 "$ROLES_DIR" | sort > /tmp/disk-roles
      missing=$(comm -23 /tmp/disk-roles /tmp/packed-roles)
      if [ -n "$missing" ]; then
        echo "build_ignore dropped roles from the artifact:"; echo "$missing"; exit 1
      fi
      echo "artifact ok: $(wc -l < /tmp/packed-roles) roles, no molecule scaffolding"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "ansible_collections/**/*"
        - "scripts/check-molecule-matrix-coverage.sh"
        - ".gitlab-ci.yml"
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "ansible_collections/**/*"
        - "scripts/check-molecule-matrix-coverage.sh"
        - ".gitlab-ci.yml"
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Molecule unit tests — one parallel job per role/scenario, every scenario under
# ansible_collections/weisssrv/infra/roles/*/molecule/. This full static matrix
# is the scenario UNIVERSE: scripts/generate-molecule-pipeline.py reads it to
# narrow an MR run, and a role dir with no entry here fails that generator loudly
# rather than shipping untested. MR pipelines run the targeted child instead
# (molecule-plan -> molecule-trigger); main and web run everything.
molecule-tests:
  extends: .molecule-test-job
  parallel:
    matrix:
      - ROLE: acme_certs
        SCENARIO: default
      - ROLE: adguard_home
        SCENARIO: default
      # Second scenario: the AdGuard-over-HTTPS branch, self-contained (no -c base).
      - ROLE: adguard_home
        SCENARIO: tls
      - ROLE: adguard_sync
        SCENARIO: default
      - ROLE: alloy_host
        SCENARIO: default
      - ROLE: apt_signed_repo
        SCENARIO: default
      - ROLE: base
        SCENARIO: default
      - ROLE: compose_app
        SCENARIO: default
      - ROLE: docker_engine
        SCENARIO: default
      - ROLE: encrypted_swap
        SCENARIO: default
      - ROLE: gitlab
        SCENARIO: default
      - ROLE: home_assistant
        SCENARIO: default
      - ROLE: immich
        SCENARIO: default
      - ROLE: immich_ml
        SCENARIO: default
      # Split into two jobs to halve wall time.
      - ROLE: k3s
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: agent
      - ROLE: nas_storage
        SCENARIO: default
      - ROLE: nextcloud
        SCENARIO: default
      - ROLE: nfs_tls
        SCENARIO: default
      - ROLE: nic_tuning
        SCENARIO: default
      - ROLE: node_exporter_host
        SCENARIO: default
      - ROLE: plex
        SCENARIO: default
      - ROLE: postfix_null_client
        SCENARIO: default
      - ROLE: prometheus_exporter
        SCENARIO: default
      - ROLE: proxmox_backup
        SCENARIO: default
      - ROLE: proxmox_firewall
        SCENARIO: default
      - ROLE: proxmox_ha
        SCENARIO: default
      - ROLE: proxmox_lxc
        SCENARIO: default
      - ROLE: proxmox_vm
        SCENARIO: default
      - ROLE: qol
        SCENARIO: default
      - ROLE: resolv_conf
        SCENARIO: default
      # Second scenario: the opt-out branch (`resolv_conf_search_domains: []`).
      - ROLE: resolv_conf
        SCENARIO: empty-search
      - ROLE: restic_offsite
        SCENARIO: default
      - ROLE: smtp_relay
        SCENARIO: default
      - ROLE: tailscale
        SCENARIO: default
      - ROLE: textfile_collector
        SCENARIO: default
      - ROLE: unbound
        SCENARIO: default
      - ROLE: unbound_exporter
        SCENARIO: default
      - ROLE: vfio_passthrough
        SCENARIO: default
      - ROLE: zfs_arc_cap
        SCENARIO: default
      - ROLE: zfs_encryption
        SCENARIO: default
      - ROLE: zfs_exporter
        SCENARIO: default
      - ROLE: zvol_mount
        SCENARIO: default
  rules:
    # Defensive (the workflow rules already exclude schedules): a future
    # maintenance schedule must never fire this whole privileged fan-out.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # NO merge_request_event clause: MR pipelines run the targeted child
    # (molecule-plan / molecule-trigger) instead of this full matrix.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "ansible_collections/**/*"
        - "docker/molecule-ci/**/*"
        - "docker/molecule-test/**/*"
        - "scripts/molecule-retry.sh"
        - "scripts/sanitize-junit-expected-failures.py"
        - ".gitlab/ci/molecule-jobs.gitlab-ci.yml"
        # This file defines the matrix and the plan/trigger wiring: a CI-only
        # change must re-run the suite rather than pass green and break the NEXT
        # collection MR.
        - ".gitlab-ci.yml"
    - if: '$CI_PIPELINE_SOURCE == "web"'
