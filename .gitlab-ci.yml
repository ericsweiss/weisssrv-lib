---
# CI for weisssrv-lib itself. Two runner classes:
#
#   - The lint/test/security/review jobs are TAG-LESS and non-root safe
#     (`pip install --user`, `python -m`, no apt, no /usr/local/bin writes), so
#     they land on the shared non-privileged runner.
#   - The two molecule image builds and the molecule matrix need privileged
#     Docker-in-Docker and are tagged `infrastructure`.
#
# ADMIN PREREQUISITES:
#   1. `infrastructure` is a PROJECT runner (not instance-wide). It must be
#      enabled for weisssrv-lib under Settings > CI/CD > Runners before any
#      tagged job here can be scheduled — until then those jobs sit pending
#      with "no runner matches". The tag-less jobs are unaffected.
#   2. The app-template project must list weisssrv-lib on its CI/CD job-token
#      allowlist, so python-tests can clone it for the cross-repo contract
#      test.
#
# NOTE: the CI templates under ci/ are `spec:inputs` files — not standalone
# pipelines — so they cannot be `glab ci lint`'d in isolation; the
# ci-templates-parse job below is a YAML/spec smoke. This pipeline renders most
# of them for real via the self-application `include:` block. Exactly three are
# NOT rendered here and are still first exercised in a consumer:
#
#   - ci/validate/flux-lint.yml           — no Kubernetes tree in this repo
#   - ci/templates/*.yml                  — hidden-job fragments with no
#                                           library-side job to extend them
#   - ci/maintenance/version-bump-bot.yml — it WRITES to the repo (branch,
#                                           push, MR), so a self-applied run
#                                           would raise bot MRs against this
#                                           library on every schedule. Wired
#                                           by each CONSUMER instead.
#
# ci/maintenance/version-check.yml IS self-applied, with a trivial check_command
# that just writes the report: this repo has nothing real to check, but rendering
# the job still proves its inputs, rules and artifact behaviour work. It is
# read-only, so unlike the bot it costs nothing to run here.
#
# ci/release/semantic-release.yml IS wired (the `release` stage below): merging
# to main cuts this library's own tag, which is what every consumer pins.
stages:
  - build
  - lint
  - test
  - security
  - ai-review
  - release

workflow:
  # Aggressively cancel superseded MR pipelines. GitLab's default auto-cancel is
  # "conservative": it stops cancelling the moment any NON-interruptible job (the
  # image builds) has started — which on an image-touching MR would leave every
  # heavy molecule job of the previous pipeline running on the scarce privileged
  # runner. `interruptible` cancels those while leaving the builds alone.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  PYYAML_VERSION: "6.0.2"

# Self-application: the library consumes its OWN templates rather than
# hand-rolling equivalent jobs, so every input and rules block is RESOLVED here
# by the MR that changes it — includes are expanded at pipeline creation
# regardless of any job's `changes:`, so an undeclared input or a malformed
# render fails the pipeline outright. EXECUTING a rendered script is separately
# path-gated, so two include sites carry `ci/**/*` in their `changes` —
# python-tests (which runs tests/test_render_templates.py over every ci/
# template) and ansible-lint — and a template-only MR therefore always runs at
# least those two for real; the remaining rendered scripts run when their own
# paths move. `local:` resolves against this pipeline's commit (a
# `project:`+`ref:` self-include would resolve the ref, not the branch under
# review).
#
# Tool pins are literal at each include site — an `include:` is resolved before
# `variables:` exist, so a pin there cannot reference $PYYAML_VERSION. PyYAML is
# therefore pinned at THREE places that must move together:
#
#   1. the `variables:` block above — used by ci-templates-parse and
#      collection-checks, the two jobs written inline in this file
#   2. the `pyyaml_version` input passed to ci/test/python-tests.yml below
#   3. the `pyyaml_version` DEFAULT in ci/internal/molecule-matrix.gitlab-ci.yml,
#      taken as-is (not overridden at its include site below)
include:
  # .molecule-base + the molecule job template stay in a LOCAL fragment (not a
  # ci/ template): the generated MR child pipeline (molecule-plan ->
  # molecule-trigger) includes ONLY that file, so it must be self-contained, and
  # it must not carry the static matrix the child emits itself. Including it here
  # is what lets the static `molecule-tests` job below extend the same template.
  - local: /.gitlab/ci/molecule-jobs.gitlab-ci.yml
  # The two molecule images, both on the privileged runner — DinD cannot run
  # tag-less. Their `changes` are DISJOINT so each gates on only its own
  # context: a pip pin bump must not rebuild molecule-test's ~40-package apt
  # layer, and a molecule-test apt change must not rebuild molecule-ci's
  # pip+galaxy layers. Deliberately NOT gated on .gitlab-ci.yml either — an
  # unrelated CI edit must not trigger a multi-minute DinD rebuild and re-push.
  # build-molecule-ci additionally emits the digest dotenv that pins
  # MOLECULE_CI_IMAGE for the matrix and for the child pipeline's jobs.
  - local: /ci/build/docker-build.yml
    inputs:
      job_name: build-molecule-ci
      image_name: molecule-ci
      context: docker/molecule-ci
      tags: ["infrastructure"]
      digest_dotenv_var: MOLECULE_CI_IMAGE
      digest_dotenv_file: molecule-images.env
      changes:
        - "docker/molecule-ci/**/*"
  # No digest dotenv for the test image: the molecule jobs pull it by its
  # immutable `:<short-sha>` tag (see the fragment's before_script), which
  # already pins the test target per pipeline.
  - local: /ci/build/docker-build.yml
    inputs:
      job_name: build-molecule-test
      image_name: molecule-test
      context: docker/molecule-test
      tags: ["infrastructure"]
      changes:
        - "docker/molecule-test/**/*"
  # MR-targeted molecule child pipeline. Every other input already matches this
  # repo (roles_dir/ci_file/jobs_include/global_triggers/changes and the two
  # image jobs); integration_dir points at a dir that does not exist, which is
  # correct — this library ships no integration suite. tags: the PLAN job is
  # non-root safe, so it runs on the shared runner; the child's jobs take their
  # tags from the fragment.
  - local: /ci/internal/molecule-matrix.gitlab-ci.yml
    inputs:
      tags: []
  - local: /ci/lint/ansible-lint.yml
    inputs:
      tags: []
      config: "-c .ansible-lint"
      targets: "ansible_collections"
      # The repo root holds ansible_collections/, so `.` is what makes the
      # collection's own FQCN self-references resolve.
      collections_path: "."
      # Dependency collections (community.general etc.) the roles' FQCN module
      # refs need — without them syntax-check fails on unresolvable modules.
      galaxy_requirements: "ansible_collections/weisssrv/infra/requirements.yml"
      changes:
        - "ansible_collections/**/*"
        - ".ansible-lint"
        - ".ansible-lint-ignore"
        - ".gitlab-ci.yml"
        # Self-application: a template-only MR must EXECUTE a rendered job, and
        # this one's before_script is where the pip_extra variable-routing lives.
        - "ci/**/*"
  # Self-applied with a deliberately trivial check. This repo tracks no upstream
  # versions, so there is nothing real to report — but that is an argument about
  # the CONTENT of check_command, not about whether the template renders. Running
  # it here is what exercises its spec:inputs, its interpolation, its four rules
  # and its artifact behaviour in the MR that changes it, rather than discovering
  # a defect in a consumer. This template needed six review rounds; every one of
  # them was a defect a rendered run could have surfaced.
  - local: /ci/maintenance/version-check.yml
    inputs:
      tags: []
      job_name: version-check-selftest
      # setup_command runs FIRST and in the same shell as check_command, so an
      # export here is observable in the report below. That is the point: it
      # proves the input is threaded, which `true` (now also the default) could
      # not distinguish from the input being dropped entirely.
      setup_command: 'export SELFTEST_SETUP=ran'
      # Writes the artifact and exits 0. `printf` rather than `echo` for the
      # literal, and REPORT_PATH rather than a hard-coded name so the job proves
      # that input reaches the script too — a hard-coded name would still pass
      # while REPORT_PATH went nowhere.
      check_command: 'printf ''{"selftest": "%s"}\n'' "${SELFTEST_SETUP:-MISSING}" > "$REPORT_PATH"'
      changes:
        - "ci/maintenance/version-check.yml"
        - ".gitlab-ci.yml"
  - local: /ci/lint/yaml-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      yamllint_version: "1.38.0"
      config: "-c .yamllint"
      targets: "ci/ lint/ taskfiles/ ansible_collections/ .gitlab/ .gitlab-ci.yml"
      changes:
        - "ci/**/*"
        - "lint/**/*"
        - "taskfiles/**/*"
        - "ansible_collections/**/*"
        - ".gitlab/**/*"
        - ".gitlab-ci.yml"
        - ".yamllint"
  - local: /ci/lint/shellcheck.yml
    inputs:
      tags: []
      direct_globs: "scripts/*.sh"
      # The collection ships shell in role files/ and templates/ (*.sh.j2 gets
      # the Jinja neutralizer treatment), which is what find_dir walks.
      find_dir: "ansible_collections"
      changes:
        - "scripts/**/*.sh"
        - "ansible_collections/**/*.sh"
        - "ansible_collections/**/*.sh.j2"
        - ".gitlab-ci.yml"
  - local: /ci/lint/python-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      config: "--config lint/ruff.toml"
      targets: "scripts tests cli"
      changes:
        - "scripts/**/*.py"
        - "tests/**/*.py"
        - "cli/**/*.py"
        - "lint/ruff.toml"
        - ".gitlab-ci.yml"
  - local: /ci/lint/docs-link-check.yml
    inputs:
      tags: []
      image: python:3.13-slim
      # AGENTS.md and cli/README.md are deliberately absent: the checker's
      # default roots are docs/ + top-level README.md/CLAUDE.md, so triggering
      # on them would imply coverage the job does not have.
      changes:
        - "docs/**/*"
        - "README.md"
        - "scripts/check-doc-links.py"
  - local: /ci/test/python-tests.yml
    inputs:
      tags: []
      # The FULL python image (not -slim) ships git — needed by the
      # check-taskfile / tree.py tests that init throwaway repos — so no apt
      # package is required and the job stays non-root safe.
      image: python:3.13
      apt_packages: ""
      test_dir: "tests cli/tests"
      pytest_version: "9.1.1"
      pyyaml_version: "6.0.2"
      # copier: without it the CLI's new-cluster tests skip (it is an optional
      # extra of the package, not a runtime dependency).
      pip_packages: "ruamel.yaml==0.18.10 copier==9.17.0"
      # Clone the app template so test_template_contract.py's cross-repo half
      # RUNS here (WEISSSRV_TEMPLATE_REQUIRED below turns its skip into a
      # failure). Needs weisssrv-lib on the template project's job-token
      # allowlist (admin prerequisite, see header). The old project path keeps
      # working through GitLab's rename redirect until the rename lands.
      #
      # WEISSSRV_TEMPLATE_REF defaults to the template's default branch. Override
      # it (a pipeline variable) when a change spans both repos: this fixture and
      # the template must move together, but GitLab cannot merge two projects
      # atomically, so whichever lands first would otherwise red the other. Point
      # it at the template's MR branch for that one pipeline instead of muting
      # the comparison — a disabled gate is how the drift got here.
      setup_command: >-
        git clone --depth 1
        ${WEISSSRV_TEMPLATE_REF:+--branch "$WEISSSRV_TEMPLATE_REF"}
        "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/eric/weisssrv-app-template.git"
        "$WEISSSRV_TEMPLATE_ROOT"
      changes:
        - "scripts/**/*"
        - "tests/**/*"
        - "cli/**/*"
        - "taskfiles/**/*"
        # test_ansible_collection.py asserts on the collection tree itself
        # (galaxy.yml deps vs requirements.yml, role metadata).
        - "ansible_collections/**/*"
        # test_generate_hosts_env.py loads examples/hosts-env-map.example.yml
        # at runtime, so the shipped example stays proven-loadable.
        - "examples/**/*"
        # test_render_templates.py renders every ci/ template and shell-parses
        # the result: the gate has to fire on the files it guards, not only on
        # the test that guards them.
        - "ci/**/*"
        - ".gitlab-ci.yml"
  # cpu_selector keeps its default: gitleaks SIGILLs on the legacy-CPU nodes and
  # the shared runner allowlists exactly that override. allow_failure keeps its
  # default too — findings block here, which is the point of shipping the gate.
  - local: /ci/security/secret-detection.yml
    inputs:
      tags: []
  # terraform/modules/ is the library-side workload for this template. Both jobs
  # run in the lint stage (this pipeline has no validate stage), and validate
  # loops over the module dirs rather than the template's `terraform/*/` default.
  - local: /ci/validate/terraform.yml
    inputs:
      tags: []
      validate_stage: lint
      fmt_dir: "terraform/"
      module_glob: "terraform/modules/*/"
      changes:
        - "terraform/**/*"
        - ".gitlab-ci.yml"
  # AI code review. Everything but the runner tag and the needs list is the
  # template default (pragent 0.40.0 digest-pinned, gpt-5.6 at xhigh, review +
  # improve, inline dual-publishing at score >= 6, `$OPENAI__KEY` gate,
  # allow_failure). secrets_source stays `env`: this library's shared runner is
  # non-root and cannot apt-install the 1Password CLI, so the two secrets come
  # from masked CI/CD variables (OPENAI__KEY, GITLAB__PERSONAL_ACCESS_TOKEN) that
  # pr-agent reads straight from the environment. The gate means the job is not
  # CREATED until those variables are set — an absent AI review is expected, not
  # a failure.
  - local: /ci/review/pr-agent.yml
    inputs:
      tags: []
      needs:
        - job: yaml-lint
          optional: true
        - job: shellcheck
          optional: true
        - job: ci-templates-parse
          optional: true
        - job: python-tests
          optional: true
  # Cuts this library's OWN tag from the conventional commits merged to main —
  # the tag every consumer's `ref:` / `?ref=` / `version:` pins. Defaults
  # elsewhere: `release` is declared LAST above and the job sets no `needs:`, so
  # stage ordering gates the release on every earlier job passing; the template's
  # rules are already main-only (schedule excluded) and `resource_group`
  # serializes rapid merges. major_on_zero stays false — while the tag is 0.x, a
  # `feat!:` bumps MINOR, and leaving initial development stays a deliberate
  # call (flip the input for the release that means 1.0.0).
  - local: /ci/release/semantic-release.yml
    inputs:
      tags: []

# Same-named override MERGES with the included python-tests job at the map
# level: these variables land on it without touching its scripts. The env pair
# makes the template-contract test's cross-repo half mandatory here (an
# explicit-but-invalid root aborts collection; a missing checkout fails instead
# of skipping).
python-tests:
  variables:
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    KUBERNETES_MEMORY_REQUEST: "512Mi"
    WEISSSRV_TEMPLATE_ROOT: "/tmp/weisssrv-app-template"
    WEISSSRV_TEMPLATE_REQUIRED: "1"
    # Full clone: TestReleaseLineage binds galaxy.yml / cli/pyproject.toml to the
    # tag semantic-release will cut, and on the shallow default those assertions
    # vanish the moment the last release falls outside the clone depth — i.e.
    # exactly when the release is largest. Same reason the release job sets it.
    GIT_DEPTH: "0"
  # Fan-out shaping (see .retry-runner-contention below): the quota admits 7
  # concurrent 5Gi job pods and this pipeline creates 12 tag-less jobs, so the
  # templates' needs:[] would burst 5 past the quota — deterministically, at
  # pod-creation time, for the length of the first wave. These overrides put
  # the 5 overflow jobs behind first-wave jobs (optional: a changes-skipped
  # dep just unblocks immediately), capping the burst at exactly quota width.
  needs:
    - job: python-lint
      optional: true

ansible-lint:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  needs:
    - job: yaml-lint
      optional: true

secret_detection:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  needs:
    - job: shellcheck
      optional: true

molecule-plan:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  needs:
    - job: docs-link-check
      optional: true

# Right-size the tag-less job pods (the runner allows overrides <= 6Gi):
# these jobs use ~200Mi; declaring 1Gi keeps a full fan-out at ~12Gi of
# quota instead of 60Gi, which is what made pipelines 929-934 fail.
yaml-lint:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

shellcheck:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

python-lint:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

docs-link-check:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

terraform-fmt:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

terraform-validate:
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"

# Quota contention on the shared runner surfaces as runner_system_failure at
# pod creation when a pipeline's fan-out bursts past the namespace quota;
# retrying turns that into throttling. Every lib template bakes the same block.
.retry-runner-contention: &retry-runner-contention
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure

ci-templates-parse:
  <<: *retry-runner-contention
  variables:
    KUBERNETES_MEMORY_LIMIT: "1Gi"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
  # Smoke: every CI template must be valid multi-document YAML (a spec header +
  # config). Catches a malformed template before a consumer includes it.
  stage: lint
  image: python:3.13-slim
  needs: []
  before_script:
    - pip install --user --quiet "pyyaml==${PYYAML_VERSION}"
  script:
    - |
      python - <<'PY'
      import glob, os, sys, yaml
      bad = 0
      found = sorted(glob.glob("ci/**/*.yml", recursive=True))
      for f in found:
          try:
              list(yaml.safe_load_all(open(f)))
              print("ok  ", f)
          except Exception as e:  # noqa: BLE001
              bad = 1
              print("FAIL", f, e)
      # Regression guard: every documented template must actually be committed
      # (a `.gitignore` pattern once hid ci/build/docker-build.yml — it was on
      # disk but untracked, so a consumer's include resolved at no ref).
      required = ["ci/build/docker-build.yml"]
      for r in required:
          if r not in found or not os.path.isfile(r):
              bad = 1
              print("FAIL", r, "is required but not present in the checkout")
      sys.exit(bad)
      PY

collection-checks:
  <<: *retry-runner-contention
  needs:
    - job: ci-templates-parse
      optional: true
  # Two invariants over ansible_collections/weisssrv/infra that nothing else
  # covers:
  #   - the molecule matrix below must list every scenario dir on disk. The
  #     generator's own CoverageError is ROLE-level, so a second scenario added
  #     under an already-listed role runs in no job at all; this gate is the one
  #     that names it. Same env-var contract the molecule-plan job uses.
  #   - the collection must build AND the artifact must match `build_ignore` —
  #     a bad pattern either ships the molecule scaffolding into every
  #     consumer's installed copy or drops real content, and `ansible-galaxy
  #     collection build` exits 0 either way, so the tarball itself is
  #     inspected below. Otherwise it surfaces first at a consumer's install.
  stage: lint
  image: python:3.13-slim
  tags: []
  variables:
    CI_FILE: .gitlab-ci.yml
    ROLES_DIR: ansible_collections/weisssrv/infra/roles
    INTEGRATION_DIR: ansible_collections/weisssrv/infra/integration-tests
    # ansible 11.6.0 (docker/molecule-ci/requirements.txt) resolves
    # ansible-core ~=2.18.6, which is also the collection's requires_ansible
    # floor — build with the core the roles are tested on.
    ANSIBLE_CORE_VERSION: "2.18.18"
    # The runner pod's uid has no passwd entry; ansible-galaxy resolves the
    # build user from these and hard-exits ("No username set in the
    # environment") when neither exists.
    USER: gitlab-runner
    LOGNAME: gitlab-runner
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    KUBERNETES_MEMORY_REQUEST: "512Mi"
  before_script:
    - pip install --user --quiet "pyyaml==${PYYAML_VERSION}" "ansible-core==${ANSIBLE_CORE_VERSION}"
  script:
    - bash scripts/check-molecule-matrix-coverage.sh
    - |
      "$(python -m site --user-base)/bin/ansible-galaxy" collection build \
        --force --output-path /tmp ansible_collections/weisssrv/infra
    - |
      set -e
      tarball=$(ls -1 /tmp/weisssrv-infra-*.tar.gz)
      entries=$(tar -tzf "$tarball")
      # Nothing build_ignore excludes may ship: molecule-shared/ resolves only
      # inside this checkout, and a role's molecule/ dir is test scaffolding.
      leaked=$(echo "$entries" | grep -E '^molecule-shared/|^roles/[^/]+/molecule/' || true)
      if [ -n "$leaked" ]; then
        echo "build_ignore leaked test scaffolding into the artifact:"; echo "$leaked"; exit 1
      fi
      # ...and nothing real may be dropped: every role dir on disk must ship.
      echo "$entries" | grep '^roles/' | cut -d/ -f2 | sort -u > /tmp/packed-roles
      ls -1 "$ROLES_DIR" | sort > /tmp/disk-roles
      missing=$(comm -23 /tmp/disk-roles /tmp/packed-roles)
      if [ -n "$missing" ]; then
        echo "build_ignore dropped roles from the artifact:"; echo "$missing"; exit 1
      fi
      echo "artifact ok: $(wc -l < /tmp/packed-roles) roles, no molecule scaffolding"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "ansible_collections/**/*"
        - "scripts/check-molecule-matrix-coverage.sh"
        - ".gitlab-ci.yml"
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "ansible_collections/**/*"
        - "scripts/check-molecule-matrix-coverage.sh"
        - ".gitlab-ci.yml"
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Molecule unit tests — one parallel job per role/scenario, every scenario under
# ansible_collections/weisssrv/infra/roles/*/molecule/. This full static matrix
# is the scenario UNIVERSE: scripts/generate-molecule-pipeline.py reads it to
# narrow an MR run, and a role dir with no entry here fails that generator loudly
# rather than shipping untested. MR pipelines run the targeted child instead
# (molecule-plan -> molecule-trigger); main and web run everything.
molecule-tests:
  extends: .molecule-test-job
  parallel:
    matrix:
      - ROLE: acme_certs
        SCENARIO: default
      - ROLE: adguard_home
        SCENARIO: default
      # tls: the AdGuard-over-HTTPS branch (self-contained scenario, no -c base).
      - ROLE: adguard_home
        SCENARIO: tls
      - ROLE: adguard_sync
        SCENARIO: default
      - ROLE: alloy_host
        SCENARIO: default
      # apt_signed_repo is the shared signed-apt-repo pipeline backing
      # alloy_host + the consumer-side roles; its scenario hermetically tests
      # both the accept (correct fingerprint) and reject paths.
      - ROLE: apt_signed_repo
        SCENARIO: default
      - ROLE: base
        SCENARIO: default
      # compose_app is the shared compose-lifecycle super-role (compose systemd
      # unit + write_prom_metrics lib + nginx task flow); its scenario asserts
      # the rendered unit body and the metrics lib without a Docker runtime.
      - ROLE: compose_app
        SCENARIO: default
      # docker_engine renders + asserts the journald daemon.json on the
      # skip-install path (no real repo or daemon in the container).
      - ROLE: docker_engine
        SCENARIO: default
      # encrypted_swap contract-tests the crypttab/systemd render on the skip
      # path (a dm-crypt random-key swap cannot be created in a container).
      - ROLE: encrypted_swap
        SCENARIO: default
      # k3s runs server + agent as separate jobs to halve wall time.
      - ROLE: k3s
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: agent
      - ROLE: nas_storage
        SCENARIO: default
      - ROLE: nfs_tls
        SCENARIO: default
      - ROLE: nic_tuning
        SCENARIO: default
      - ROLE: node_exporter_host
        SCENARIO: default
      - ROLE: postfix_null_client
        SCENARIO: default
      # prometheus_exporter is the shared install pipeline backing zfs_exporter +
      # unbound_exporter; its scenario contract-tests both artifact branches
      # (tarball + deb) on the skip path.
      - ROLE: prometheus_exporter
        SCENARIO: default
      - ROLE: proxmox_backup
        SCENARIO: default
      - ROLE: proxmox_firewall
        SCENARIO: default
      - ROLE: proxmox_ha
        SCENARIO: default
      - ROLE: proxmox_lxc
        SCENARIO: default
      - ROLE: proxmox_vm
        SCENARIO: default
      - ROLE: qol
        SCENARIO: default
      - ROLE: resolv_conf
        SCENARIO: default
      # empty-search: the opt-out branch (`resolv_conf_search_domains: []`), so a
      # regression that emits a bare `search ` trips CI.
      - ROLE: resolv_conf
        SCENARIO: empty-search
      # restic_offsite runs against a local file repo + a fake snapshot tree (no
      # network), asserting subcommands, metric names, 0600 secret files, timer
      # enable, and the freshness-guard abort.
      - ROLE: restic_offsite
        SCENARIO: default
      - ROLE: smtp_relay
        SCENARIO: default
      - ROLE: tailscale
        SCENARIO: default
      - ROLE: textfile_collector
        SCENARIO: default
      - ROLE: unbound
        SCENARIO: default
      - ROLE: unbound_exporter
        SCENARIO: default
      - ROLE: vfio_passthrough
        SCENARIO: default
      - ROLE: zfs_arc_cap
        SCENARIO: default
      # zfs_encryption validates template rendering, file modes, systemd
      # ordering hooks and per-pool service enable. It cannot exercise
      # `zfs load-key` (no kernel module in a container) or live 1Password
      # Connect calls, but covers the deploy contract with mocked inputs.
      - ROLE: zfs_encryption
        SCENARIO: default
      - ROLE: zfs_exporter
        SCENARIO: default
      # zvol_mount uses loop devices in prepare; works under privileged DinD.
      - ROLE: zvol_mount
        SCENARIO: default
  rules:
    # Defensive (the workflow rules already exclude schedules): a future
    # maintenance schedule must never fire this 37-job privileged fan-out.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # NO merge_request_event clause: MR pipelines run the targeted child
    # (molecule-plan / molecule-trigger) instead of this full matrix.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "ansible_collections/**/*"
        - "docker/molecule-ci/**/*"
        - "docker/molecule-test/**/*"
        - "scripts/molecule-retry.sh"
        - "scripts/sanitize-junit-expected-failures.py"
        - ".gitlab/ci/molecule-jobs.gitlab-ci.yml"
        # This file defines the matrix and the plan/trigger wiring: a CI-only
        # change must re-run the suite rather than pass green and break the NEXT
        # collection MR.
        - ".gitlab-ci.yml"
    - if: '$CI_PIPELINE_SOURCE == "web"'
