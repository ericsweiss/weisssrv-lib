# gitleaks allowlist shared across weisssrv-family repos. Vendor it together
# with secret-detection-ruleset.toml or it does nothing; see lint/README.md.
# `useDefault = true` is REQUIRED — without it gitleaks loads no rules at all.

title = "weisssrv-family allowlist"

[extend]
useDefault = true

[[allowlists]]
description = "weisssrv-family false positives"
regexes = [
  # 1Password refs, doc placeholders like [your-cloudflare-api-token], and
  # test/fixture tokens. All anchored at the start of the token so a real secret
  # merely prefixed with one of these shapes can't be silenced.
  '''^op://[A-Za-z0-9_ /-]+''',
  '''^\[your-[a-z0-9-]+\]''',
  '''^(test|fake|dummy|example)[-_]?(password|token|key|secret)[A-Za-z0-9_-]*''',
  # Published supply-chain pins the CI templates check downloaded key material
  # against: 1Password's apt GPG fingerprint and its apk public key's sha256.
  # Exact values, so rotating a pinned key forces a review here alongside it.
  '''^3FEF9748469ADBE15DA7CA80AC2D62742012EA22$''',
  '''^0e88171d9f8b7630763f70cbf69f2a01b4ba8ea1d8e79487f59c162db255eb84$''',
  # Molecule fixture key material, matched by CONTENT not by path, so the files
  # stay in scope. The acme_certs throwaway OpenSSH key is reported twice, raw
  # and with its base64 partly decoded, hence the loose middle.
  '''(?s)^-----BEGIN OPENSSH PRIVATE KEY-----\s+b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW\s.*bmx5LWRvbnQtdXNlAAAAC3Rlc3RAbW9sZWN1bGUBAgMEBQ==\s+-----END OPENSSH PRIVATE KEY-----$''',
  # The nfs_tls prepare stub, which says what it is in its own PEM body.
  '''(?s)^-----BEGIN PRIVATE KEY-----\s+synthetic-test-fixture-not-a-real-key\s+-----END PRIVATE KEY-----$''',
  # collect-state redaction fixtures, which need realistic token shapes to
  # assert against. Each exact fixture value, never the file. The PEM is not
  # end-anchored: the capture carries the Python concatenation boundaries.
  '''^glpat-abc123def456$''',
  '''^glrt-AbC_123-xyz$''',
  '''(?s)^-----BEGIN RSA PRIVATE KEY-----.*the8keymaterial.*$''',
]

paths = [
  # Generated cluster snapshots (gitignored, but never trip on a stray copy).
  '''CLUSTER_STATUS\.txt''',
  '''cluster-state-.*\.txt''',
  # Vendored galaxy dependency collections, installed into the tree by the
  # ansible-lint flow; third-party fixtures are full of dummy keys.
  '''\.ansible-home/''',
]
