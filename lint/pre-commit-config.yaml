---
# Local guardrails: run `pre-commit install` once, then these run on every
# commit. They mirror what CI enforces (secret scan + yamllint), so problems
# surface before you push. Revs are pinned; bump them deliberately. Copy into a
# consumer repo as `.pre-commit-config.yaml`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
