---
# Strict yamllint profile, aligned with the ansible-lint production profile
# (160-char line limit, truthy/octal rules). weisssrv applies this to its
# ansible/ tree via the ansible-lint job (which honors `# noqa yaml[...]`
# exemptions that raw yamllint cannot) — do NOT point a bare `yamllint` run at
# this config for an ansible tree; use it for non-ansible YAML that should hold
# to the stricter line-length/truthy/octal rules. Provided here so a consumer
# that wants the stricter profile has a single shared source.
extends: default

rules:
  line-length:
    max: 160
    level: error
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no']
  comments:
    min-spaces-from-content: 1
  # Required by ansible-lint for compatibility
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
