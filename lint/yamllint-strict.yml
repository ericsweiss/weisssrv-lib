---
# Strict yamllint profile, aligned with the ansible-lint production profile
# (160-char line limit, truthy/octal rules). No consumer vendors it today — it
# is offered for a repo that wants the stricter rules. Apply it THROUGH
# ansible-lint on an ansible tree (ansible-lint honors `# noqa yaml[...]`
# exemptions that a bare `yamllint` run cannot); point a bare `yamllint` run at
# it only for non-ansible YAML.
extends: default

rules:
  line-length:
    max: 160
    level: error
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no']
  comments:
    min-spaces-from-content: 1
  # ansible-lint's bundled yamllint profile disables this rule; keep the two
  # aligned or ansible-lint and a bare yamllint run disagree.
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
