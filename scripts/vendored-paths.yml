---
# Canonical registry of library files copied into a consumer repo.
#
# The library is the only place the copy relationship is recorded. Each consumer
# runs scripts/check-vendored-copies.py against a library checkout; nothing is
# maintained per consumer, so a file the library starts (or stops) shipping
# reaches every gate at the next bump.
#
# Two relationships, both checked:
#   vendored — byte-identical. Drift in either direction fails.
#   forked   — deliberately divergent. The check asserts the file still differs
#              (a converged fork belongs under `vendored`) and, when
#              `reconciled_sha256` is set, that the LIBRARY side has not moved
#              since the fork was last reconciled. That is the half a
#              documentation-only fork list cannot catch.
#
# Entry forms: a bare string when both repos use the same path, or a mapping
# with `lib:` and `consumer:` when they differ. `reason:` is required on forks.
#
# Two release-time properties, both gated by tests/test_check_vendored_copies.py:
#   * `reconciled_sha256` records the LIBRARY blob as this release ships it. A
#     release that edits a forked file must re-take its sha here — the value is
#     read at the consumer's pinned tag, so a stale one reds the consumer's gate
#     with no consumer-side fix.
#   * a `consumer:` path is a claim about the consumer's LAYOUT. Moving a file in
#     a consumer repo is therefore a library-release event.

consumers:
  weisssrv:
    vendored:
      - scripts/b2-bucket-drift.py
      - scripts/check-alertmanager-behaviour.py
      - scripts/check-backup-artifact-apps.py
      - scripts/check-default-deny-coverage.py
      - scripts/check-deploy-coverage.sh
      - scripts/check-doc-links.py
      - scripts/check-hpa-vpa-invariant.py
      - scripts/check-kubectl-version-pin.py
      - scripts/check-lib-pins.py
      - scripts/check-netpol-except-parity.py
      - scripts/check-pvc-storageclass.py
      - scripts/check-scrape-netpol.py
      - scripts/check-secretstore-scope.py
      - scripts/check-taskfile.sh
      - scripts/check-versions.py
      - scripts/find-pve-host-for-vm.sh
      - scripts/find-reachable-host.sh
      - scripts/flux-env.sh
      - scripts/flux-render.sh
      - scripts/generate-hosts-env.py
      - scripts/generate-versions-configmap.py
      - scripts/kubeconform-skipped.py
      - scripts/lint-prometheus-config.sh
      - scripts/molecule-retry.sh
      - scripts/resolve-tool.sh
      - scripts/sanitize-junit-expected-failures.py
      - scripts/shell-lib.sh
      - scripts/validate-helm-values.py
      - scripts/version-bump-mr.py
      - scripts/version-check-ci.py
      # Discovered by the tool at its conventional root name.
      - lib: lint/ruff.toml
        consumer: ruff.toml
    forked:
      - lib: scripts/extract-prometheus-config.py
        reason: >-
          Rules extraction unions the HelmRelease with the standalone
          PrometheusRule manifests under observability/rules/; the library copy
          reads the HelmRelease alone.
        reconciled_sha256: 294bcbf560adf90c9318c10c10d5da9c33e96b0043498e55e11616a20b03adf9
      - lib: lint/gitleaks.toml
        consumer: .gitleaks.toml
        reason: Allowlist paths and fixture anchors are per-repo.
        reconciled_sha256: bffbe70c94436f4442aaeecc1f1f5715315fc5908b1486b2198796b9e097ff0d
      - lib: lint/secret-detection-ruleset.toml
        consumer: .gitlab/secret-detection-ruleset.toml
        reason: Ruleset overrides name this repo's scanned paths.
        reconciled_sha256: d6413e69a2d8a6f7d0c468d4370a406299894ad9e3fe274eb7f69eb30a7c936d
      - lib: lint/editorconfig
        consumer: .editorconfig
        reason: Per-repo file-type sections on a shared base.
        reconciled_sha256: 911171d9f26ba0bb47300c97a9e46b078d48eb852dfe9a050fbc3c8e41cc2944
      - lib: lint/pre-commit-config.yaml
        consumer: .pre-commit-config.yaml
        reason: Per-repo hook set on a shared base.
        reconciled_sha256: 39e7c3a5fbc7d2185ad73c436cbba736cae1e2b2b88f7f50387f041cbd87323c

  weisssrv-app-template:
    # A copier template: `_subdirectory: template`, so every file RENDERED INTO a
    # tenant lives under `template/`, and the directory names carry the jinja
    # conditionals that switch a component on or off (`ci_shape`,
    # `enable_image_build`). Those literal names are part of the path. Copies the
    # template repo runs on ITSELF (its own scripts/, its own lint profiles at the
    # root) stay unprefixed. BOTH sets are registered — they are separate files
    # that drift separately, so a re-vendor of one is not a re-vendor of the
    # other.
    vendored:
      # The root copies are what this repo runs on ITSELF …
      - scripts/check-doc-links.py
      - scripts/check-lib-pins.py
      - scripts/semantic-release.py
      # … and the template/ copies are the same files rendered into a tenant.
      # Both are registered: a re-vendor that touched only the root pair would
      # otherwise ship a stale script to every repo generated afterwards.
      - lib: scripts/check-doc-links.py
        consumer: template/scripts/check-doc-links.py
      - lib: scripts/check-lib-pins.py
        consumer: "template/scripts/{% if ci_shape == 'gitlab_selfhosted' %}check-lib-pins.py{% endif %}"
      - lib: scripts/semantic-release.py
        consumer: "template/scripts/{% if ci_shape != 'none' %}semantic-release.py{% endif %}"
      # The check-lib-pins suite is canonical here: a consumer that vendors the
      # script vendors its tests and adds only its own smoke test.
      - tests/test_check_lib_pins.py
      - lib: ci/release/github-release-workflow.example.yml
        consumer: "template/{% if ci_shape == 'github' %}.github{% endif %}/workflows/release.yml"
      - lib: ci/github/ci.example.yml
        consumer: "template/{% if ci_shape == 'github' %}.github{% endif %}/workflows/ci.yml"
      # Gated on `enable_image_build` as well as the shape, because the GitLab
      # shape gates its own build job on that answer: without the conditional
      # the two shapes disagree about what `enable_image_build: false` means,
      # and a tenant that never builds an image still gets a `packages: write`
      # workflow firing on every push to main. It renders alongside the
      # `{% if enable_image_build %}Dockerfile{% endif %}` the same answer
      # controls. One line, quoted — see the note under `forked:`.
      - lib: ci/github/build-image.example.yml
        consumer: "template/{% if ci_shape == 'github' %}.github{% endif %}/workflows/{% if enable_image_build %}build-image.yml{% endif %}"
    forked:
      - lib: lint/ruff.toml
        consumer: ruff.toml
        reason: Narrower target set than the library profile.
        reconciled_sha256: ccf4e857a9d7e20039ef8f68be7080210e6703d1400c23586ec6f5679e2fbfb2
      - lib: lint/gitleaks.toml
        consumer: .gitleaks.toml
        reason: Allowlist paths and fixture anchors are per-repo.
        reconciled_sha256: bffbe70c94436f4442aaeecc1f1f5715315fc5908b1486b2198796b9e097ff0d
      # The root ruleset, the one this template's OWN pipeline loads. A separate
      # file from the tenant copy below and it drifts separately, so both are
      # registered — the same split the scripts and lint profiles get.
      - lib: lint/secret-detection-ruleset.toml
        consumer: .gitlab/secret-detection-ruleset.toml
        reason: Ruleset overrides name this repo's own scanned paths.
        reconciled_sha256: d6413e69a2d8a6f7d0c468d4370a406299894ad9e3fe274eb7f69eb30a7c936d
      # One line, quoted, however long: a folded scalar reconstructs the literal
      # filename only if the wrap lands on a space, so re-wrapping it silently
      # produces a different path — and a wrong `consumer:` path is unfixable
      # from the consumer side at an immutable tag.
      - lib: lint/secret-detection-ruleset.toml
        consumer: "template/{% if ci_shape != 'github' %}.gitlab{% endif %}/{% if ci_shape == 'gitlab_selfhosted' %}secret-detection-ruleset.toml{% endif %}"
        reason: Ruleset overrides name the rendered tenant's scanned paths.
        reconciled_sha256: d6413e69a2d8a6f7d0c468d4370a406299894ad9e3fe274eb7f69eb30a7c936d
      - lib: lint/editorconfig
        consumer: .editorconfig
        reason: Per-repo file-type sections on a shared base.
        reconciled_sha256: 911171d9f26ba0bb47300c97a9e46b078d48eb852dfe9a050fbc3c8e41cc2944
      - lib: lint/pre-commit-config.yaml
        consumer: template/.pre-commit-config.yaml
        reason: Per-repo hook set on a shared base.
        reconciled_sha256: 39e7c3a5fbc7d2185ad73c436cbba736cae1e2b2b88f7f50387f041cbd87323c
      # The tenant-side lint profiles, the same split as the scripts above: the
      # root three are what this repo lints ITSELF with, these three are what a
      # generated tenant gets. Registering only one half left the other
      # unguarded.
      - lib: lint/ruff.toml
        consumer: template/ruff.toml
        reason: Tenant target set, narrower than the library profile.
        reconciled_sha256: ccf4e857a9d7e20039ef8f68be7080210e6703d1400c23586ec6f5679e2fbfb2
      - lib: lint/gitleaks.toml
        consumer: template/.gitleaks.toml
        reason: Allowlist paths and fixture anchors are per-tenant.
        reconciled_sha256: bffbe70c94436f4442aaeecc1f1f5715315fc5908b1486b2198796b9e097ff0d
      - lib: lint/editorconfig
        consumer: template/.editorconfig
        reason: Tenant file-type sections on a shared base.
        reconciled_sha256: 911171d9f26ba0bb47300c97a9e46b078d48eb852dfe9a050fbc3c8e41cc2944

  weisssrv-cluster-template:
    # Also two copy sets, and both are registered — scripts AND lint profiles.
    # The template/ copies are rendered into the generated cluster; the
    # unprefixed ones are what this repo runs on ITSELF (its own scripts/, its
    # own lint profiles, its own secret-detection ruleset). A file present in
    # only one set is registered once; that asymmetry is real (this repo runs no
    # deploy-coverage gate on itself, the tenant runs no secret-detection
    # ruleset of its own).
    #
    # Two deliberate exclusions, both because there are no comparable bytes to
    # compare: template/.gitleaks.toml.jinja is a Jinja SOURCE
    # (`{{ cluster_name }}` interpolation), not a copy of lint/gitleaks.toml;
    # and the .yamllint profiles are unregistered family-wide, not just here.
    vendored:
      # --- copies the template repo runs on itself ---
      - scripts/check-doc-links.py
      - scripts/check-lib-pins.py
      - scripts/semantic-release.py
      # --- copies rendered into the generated cluster ---
      - lib: scripts/check-backup-artifact-apps.py
        consumer: template/scripts/check-backup-artifact-apps.py
      - lib: scripts/check-default-deny-coverage.py
        consumer: template/scripts/check-default-deny-coverage.py
      - lib: scripts/check-deploy-coverage.sh
        consumer: template/scripts/check-deploy-coverage.sh
      - lib: scripts/check-doc-links.py
        consumer: template/scripts/check-doc-links.py
      - lib: scripts/check-hpa-vpa-invariant.py
        consumer: template/scripts/check-hpa-vpa-invariant.py
      - lib: scripts/check-lib-pins.py
        consumer: template/scripts/check-lib-pins.py
      - lib: scripts/check-netpol-except-parity.py
        consumer: template/scripts/check-netpol-except-parity.py
      - lib: scripts/check-pvc-storageclass.py
        consumer: template/scripts/check-pvc-storageclass.py
      - lib: scripts/check-scrape-netpol.py
        consumer: template/scripts/check-scrape-netpol.py
      - lib: scripts/check-secretstore-scope.py
        consumer: template/scripts/check-secretstore-scope.py
      - lib: scripts/check-taskfile.sh
        consumer: template/scripts/check-taskfile.sh
      - lib: scripts/check-versions.py
        consumer: template/scripts/check-versions.py
      - lib: scripts/extract-prometheus-config.py
        consumer: template/scripts/extract-prometheus-config.py
      - lib: scripts/flux-env.sh
        consumer: template/scripts/flux-env.sh
      - lib: scripts/find-reachable-host.sh
        consumer: template/scripts/find-reachable-host.sh
      - lib: scripts/flux-render.sh
        consumer: template/scripts/flux-render.sh
      - lib: scripts/generate-hosts-env.py
        consumer: template/scripts/generate-hosts-env.py
      - lib: scripts/generate-versions-configmap.py
        consumer: template/scripts/generate-versions-configmap.py
      - lib: scripts/kubeconform-skipped.py
        consumer: template/scripts/kubeconform-skipped.py
      - lib: scripts/lint-prometheus-config.sh
        consumer: template/scripts/lint-prometheus-config.sh
      - lib: scripts/resolve-tool.sh
        consumer: template/scripts/resolve-tool.sh
      - lib: scripts/semantic-release.py
        consumer: template/scripts/semantic-release.py
      - lib: scripts/shell-lib.sh
        consumer: template/scripts/shell-lib.sh
      - lib: scripts/validate-helm-values.py
        consumer: template/scripts/validate-helm-values.py
      - lib: scripts/version-bump-mr.py
        consumer: template/scripts/version-bump-mr.py
      - tests/test_check_lib_pins.py
      - lib: lint/secret-detection-ruleset.toml
        consumer: .gitlab/secret-detection-ruleset.toml
    forked:
      - lib: lint/ruff.toml
        consumer: ruff.toml
        reason: Narrower target set than the library profile.
        reconciled_sha256: ccf4e857a9d7e20039ef8f68be7080210e6703d1400c23586ec6f5679e2fbfb2
      - lib: lint/gitleaks.toml
        consumer: .gitleaks.toml
        reason: Allowlist paths and fixture anchors are per-repo.
        reconciled_sha256: bffbe70c94436f4442aaeecc1f1f5715315fc5908b1486b2198796b9e097ff0d
      - lib: lint/editorconfig
        consumer: .editorconfig
        reason: Per-repo file-type sections on a shared base.
        reconciled_sha256: 911171d9f26ba0bb47300c97a9e46b078d48eb852dfe9a050fbc3c8e41cc2944
      # The tenant-side lint profiles, the same split as the scripts above: the
      # root pair is what this repo lints ITSELF with, these two are what a
      # generated cluster gets. Registering only one half left the other
      # unguarded — the library tightens lint/ruff.toml, the root copy reds and
      # gets reconciled, and every cluster generated afterwards silently stays
      # on the old profile.
      - lib: lint/ruff.toml
        consumer: template/ruff.toml
        reason: >-
          Same rule selection, tenant-scoped header — it documents that the
          generated cluster relies on ruff's own config discovery.
        reconciled_sha256: ccf4e857a9d7e20039ef8f68be7080210e6703d1400c23586ec6f5679e2fbfb2
      - lib: lint/editorconfig
        consumer: template/.editorconfig
        reason: >-
          Tenant file-type sections on a shared base — `[Dockerfile*]` rather
          than `[Dockerfile]`, to cover the per-app Dockerfile suffixes.
        reconciled_sha256: 911171d9f26ba0bb47300c97a9e46b078d48eb852dfe9a050fbc3c8e41cc2944
