---
# Public route: changeme-app.ericsweiss.com.
#
# external-dns watches IngressRoutes cluster-wide and, seeing the target
# annotation below, creates the proxied Cloudflare CNAME automatically — no
# operator action and no Terraform edit for a public hostname. The middlewares
# live in the platform `traefik` namespace; cross-namespace references are
# enabled cluster-side (`allowCrossNamespace: true`).
#
# An internal (LAN/tailnet) route is optional/ingressroute-internal.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: changeme-app
  annotations:
    external-dns.alpha.kubernetes.io/target: ericsweiss.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`changeme-app.ericsweiss.com`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        # Authentik SSO (forward-auth). The middleware alone does nothing: the
        # operator must also create a proxy provider whose `external_host` is
        # EXACTLY this route's hostname, an application, a group and a policy
        # binding, and add the provider to the embedded outpost. A missing
        # outpost assignment surfaces as a 404 from the outpost, and an
        # `external_host` on the other split-horizon hostname breaks the
        # redirect. See docs/ONBOARDING.md.
        # - name: authentik-auth
        #   namespace: authentik
      services:
        - name: changeme-app
          port: 8080
  tls:
    secretName: changeme-app-ericsweiss-tls
