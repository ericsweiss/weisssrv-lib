---
# Public route: changeme-app.ericsweiss.com.
#
# external-dns watches IngressRoutes cluster-wide and, seeing the target
# annotation below, creates the proxied Cloudflare CNAME automatically — no
# operator action and no Terraform edit for a public hostname. The middlewares
# live in the platform `traefik` namespace; cross-namespace references are
# enabled cluster-side (`allowCrossNamespace: true`).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: changeme-app
  annotations:
    external-dns.alpha.kubernetes.io/target: ericsweiss.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`changeme-app.ericsweiss.com`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        # To require Authentik SSO in front of the app (forward-auth), add:
        # - name: authentik-auth
        #   namespace: authentik
      services:
        - name: changeme-app
          port: 8080
  tls:
    secretName: changeme-app-ericsweiss-tls

# ---
# # Internal route: changeme-app.esweiss.com (LAN + tailnet only).
# #
# # `lan-tailscale-only` restricts the source to the LAN, the tailnet, and the
# # pod CIDR. The internal hostname is NOT auto-provisioned — external-dns only
# # manages ericsweiss.com — so the operator must add an AdGuard rewrite
# # (`changeme-app.esweiss.com -> 192.168.0.101`) via a weisssrv MR. Enable the
# # internal Certificate in certificate.yaml alongside this route.
