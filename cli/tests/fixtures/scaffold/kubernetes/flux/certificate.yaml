---
# Per-host TLS certificate issued by the platform's cert-manager ClusterIssuer
# (Let's Encrypt production, DNS-01 over Cloudflare). It MUST live in the same
# namespace as the IngressRoute that references its secret — Traefik only reads
# the TLS secret from the route's own namespace.
#
# Per-host, NOT wildcard: Let's Encrypt caps duplicate certificates at 5 per
# week, and the platform already issues the `default`-namespace wildcards. A
# per-host cert per tenant avoids sharing/copying those and stays well under
# the rate limit. `renewBefore: 720h` (30d) matches the cluster convention.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: changeme-app-tls
spec:
  secretName: changeme-app-ericsweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: changeme-app.ericsweiss.com
  dnsNames:
    - changeme-app.ericsweiss.com
  renewBefore: 720h

# ---
