---
# Vertical Pod Autoscaler. `updateMode: Initial` right-sizes the pod on its
# natural restarts without evicting a running one — the safe default for a
# stateless web app. Tune min/maxAllowed to your app's real footprint.
#
# Conventions to keep in mind:
#   * Stateful/DB workloads → set `updateMode: "Off"` (recommend-only; apply by
#     hand) so the VPA never evicts a pod holding open storage.
#   * If you enable hpa.yaml (HPA owns CPU), make this VPA memory-only by setting
#     `controlledResources: [memory]` so the two don't fight over CPU.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: changeme-app
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: changeme-app
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 25m
          memory: 64Mi
        maxAllowed:
          cpu: 1
          memory: 512Mi
        controlledResources:
          - cpu
          - memory
