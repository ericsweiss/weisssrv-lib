---
# PodDisruptionBudget — always on. Keeps at least one replica up during
# voluntary disruptions (kured node-reboot drains, evictions). With the
# Deployment's default `replicas: 2` and the soft podAntiAffinity that spreads
# them, `minAvailable: 1` stops both pods being drained at once — so a kured
# reboot can't take the app fully down.
#
# If you switch to a single-replica app, DELETE this (a `minAvailable: 1` on one
# replica blocks every voluntary eviction — a node can never drain it). If you
# enable optional/hpa.yaml, keep `minReplicas >= 2` so this stays satisfiable.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: changeme-app
  labels:
    app.kubernetes.io/name: changeme-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changeme-app
