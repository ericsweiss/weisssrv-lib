---
# Tenant workload aggregate. Flux reconciles THIS directory (the cluster-side
# wiring Kustomization sets `path: ./kubernetes/flux`).
#
# No `namespace:` is set here on purpose: the cluster-side Flux Kustomization
# supplies `targetNamespace: <your-slug>`, and the operator owns the Namespace
# object (with its Pod Security Admission labels). See docs/ONBOARDING.md.
#
# Rename flow: run `./scripts/rename.sh <app> <gitlab-group>` once after
# forking to replace every changeme-app / changeme-group token in this tree.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - certificate.yaml
  - ingressroute.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - vpa.yaml
  - pdb.yaml
  # Opt-in add-ons. They are real, schema-validated manifests in optional/ (CI
  # builds that directory separately); enabling one is uncommenting its line
  # here. Each file's header carries the rest of its checklist.
  # - optional/hpa.yaml                       # horizontal autoscaling
  # - optional/ingressroute-internal.yaml     # internal (LAN/tailnet) route
  # - optional/certificate-internal.yaml      # cert for that internal route
  # - optional/externalsecret-registry.yaml   # private-registry pull secret
  # - optional/externalsecret-gitlab.yaml     # REPLACES externalsecret.yaml
