---
# Secrets are pulled into the namespace by the External Secrets Operator. The
# ClusterSecretStore is created OPERATOR-SIDE in the weisssrv wiring file (it is
# named `onepassword-<your-slug>` or `gitlab-<your-slug>` — see docs/ONBOARDING.md);
# this manifest only references it.
#
# Two backends are available (pick the one your wiring file provisions):
#
#   * 1Password (below, ACTIVE) — recommended when you have vault access. Items
#     live in the shared "Homelab" vault, PREFIXED with your slug to isolate
#     them: `remoteRef.key` is the full item title "<slug>: <Item>",
#     `remoteRef.property` is the field name. No `op://`, no item IDs.
#
#   * GitLab CI/CD variables — easiest for external collaborators. Swap this
#     file for optional/externalsecret-gitlab.yaml.
#
# Each `secretKey` below is bound to an env var explicitly in deployment.yaml
# via `secretKeyRef` (keys are hyphenated per the homelab convention, which an
# `envFrom` would silently drop). If your app needs no secrets: delete this
# file, its line in kustomization.yaml, and the secret `env` block in
# deployment.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changeme-app-secrets
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-changeme-app
  target:
    name: changeme-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: "changeme-app: App Secrets"
        property: api-key
