---
# GitLab CI/CD variables secret backend — OPT-IN ALTERNATIVE to
# ../externalsecret.yaml (which uses 1Password).
#
# Enable: uncomment `- optional/externalsecret-gitlab.yaml` in
# ../kustomization.yaml and REMOVE `- externalsecret.yaml` from the same list —
# both create the `changeme-app-secrets` Secret. Pick the backend your
# operator-side wiring file provisions (docs/ONBOARDING.md); each masked CI/CD
# variable key on your GitLab project maps straight across as a `remoteRef.key`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changeme-app-secrets
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitlab-changeme-app
  target:
    name: changeme-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: APP_API_KEY
