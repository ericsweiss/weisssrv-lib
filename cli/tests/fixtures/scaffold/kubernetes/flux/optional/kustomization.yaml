---
# Opt-in manifests. Flux NEVER builds this directory — ../kustomization.yaml is
# what the cluster-side Kustomization points at, and these files are commented
# out there. This kustomization exists so CI can still `kustomize build` +
# kubeconform them (the `flux-lint-optional` job), so a switched-off manifest
# cannot rot into something that fails the day it is enabled.
#
# Enabling one is uncommenting its line in ../kustomization.yaml; each file's
# header carries the rest of the checklist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - hpa.yaml
  - ingressroute-internal.yaml
  - certificate-internal.yaml
  - externalsecret-gitlab.yaml
  - externalsecret-registry.yaml
