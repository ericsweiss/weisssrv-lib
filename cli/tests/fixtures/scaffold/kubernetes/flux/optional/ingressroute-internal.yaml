---
# Internal route: changeme-app.esweiss.com (LAN + tailnet only) — OPT-IN.
#
# Enable: uncomment `- optional/ingressroute-internal.yaml` in
# ../kustomization.yaml, and enable optional/certificate-internal.yaml with it.
#
# `lan-tailscale-only` restricts the source to the LAN, the tailnet and the pod
# CIDR. The internal hostname is NOT auto-provisioned — external-dns manages the
# external domain only — so the operator adds an AdGuard rewrite
# (`changeme-app.esweiss.com -> 192.168.0.101`) via a weisssrv MR.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: changeme-app-internal
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`changeme-app.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: changeme-app
          port: 8080
  tls:
    secretName: changeme-app-esweiss-tls
