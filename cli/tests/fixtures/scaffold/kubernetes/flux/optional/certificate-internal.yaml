---
# Internal certificate — OPT-IN, enable together with
# optional/ingressroute-internal.yaml by uncommenting its line in
# ../kustomization.yaml.
#
# `changeme-app.esweiss.com` resolves only on the LAN/tailnet, but cert-manager
# validates over public DNS-01, so issuance works even though the name is
# internal.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: changeme-app-tls-internal
spec:
  secretName: changeme-app-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: changeme-app.esweiss.com
  dnsNames:
    - changeme-app.esweiss.com
  renewBefore: 720h
