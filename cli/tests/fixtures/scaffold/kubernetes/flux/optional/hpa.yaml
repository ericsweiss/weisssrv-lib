---
# Horizontal Pod Autoscaler — OPT-IN.
#
# Enable: uncomment `- optional/hpa.yaml` in ../kustomization.yaml, then
#   * delete `replicas:` from ../deployment.yaml (Flux server-side apply would
#     otherwise fight the HPA over the replica count), and
#   * set `controlledResources: [memory]` in ../vpa.yaml so the VPA and the HPA
#     do not both drive CPU.
# `minReplicas: 2` keeps ../pdb.yaml (`minAvailable: 1`) satisfiable.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: changeme-app
  labels:
    app.kubernetes.io/name: changeme-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: changeme-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
