---
# Registry pull credentials — OPT-IN. Needed only when the image lives in a
# PRIVATE registry (the shipped build-image job pushes to your GitLab project's
# private Container Registry, so a template-derived project usually needs this).
#
# Enable: uncomment `- optional/externalsecret-registry.yaml` in
# ../kustomization.yaml and add to ../deployment.yaml's pod spec:
#   imagePullSecrets: [{name: changeme-app-registry}]
#
# Operator side (docs/ONBOARDING.md): create a GitLab deploy token with the
# `read_registry` scope on the tenant project and store its value in the
# tenant's secret backend as the field this manifest reads. The deploy-token
# NAME is not a secret and is a literal below; only the token is pulled.
#
# The registry host is the INTERNAL name (`registry.git.esweiss.com`): nodes
# resolve it to Traefik on the LAN, avoiding a hairpin through the public name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changeme-app-registry
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-changeme-app
  target:
    name: changeme-app-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.git.esweiss.com":{"username":"changeme-app","password":"{{ .token }}","auth":"{{ printf "changeme-app:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: "changeme-app: Registry Pull"
        property: token
