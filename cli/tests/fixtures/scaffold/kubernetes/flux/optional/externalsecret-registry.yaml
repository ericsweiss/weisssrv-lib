---
# Registry pull credentials — OPT-IN. Needed only when the image lives in a
# PRIVATE registry (the shipped build-image job pushes to your GitLab project's
# private Container Registry, so a template-derived project usually needs this).
#
# Enable: uncomment `- optional/externalsecret-registry.yaml` in
# ../kustomization.yaml and add to ../deployment.yaml's pod spec:
#   imagePullSecrets: [{name: changeme-app-registry}]
#
# Operator side (docs/ONBOARDING.md): create a GitLab deploy token with the
# `read_registry` scope on the tenant project and store its value in the
# tenant's secret backend as the field this manifest reads. The deploy-token
# NAME is not a secret and is a literal below; only the token is pulled.
#
# Credentials are keyed on BOTH registry hostnames: kubelet matches pull
# secrets against the literal host in the image reference, and the shipped
# deployment.yaml uses the external name while nodes may pull via the internal
# one. The deploy-token USERNAME is read from the secret item alongside the
# token — GitLab generates it, so it must never be assumed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changeme-app-registry
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-changeme-app
  target:
    name: changeme-app-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{
            "registry.git.ericsweiss.com":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"},
            "registry.git.esweiss.com":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: "changeme-app: Registry Pull"
        property: token
    - secretKey: username
      remoteRef:
        key: "changeme-app: Registry Pull"
        property: username
