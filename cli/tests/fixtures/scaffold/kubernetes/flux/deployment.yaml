---
# Application workload. Hardened, non-root by default so it satisfies the
# tenant namespace's Pod Security Admission (enforce: baseline / warn+audit:
# restricted). Swap the image, port, probe paths, and resources for your app.
#
# Image tag is a LITERAL pin (Flux postBuild `${var}` substitution is
# weisssrv-internal and is NOT available to tenants). renovate.json is provided,
# but NO Renovate bot runs against this self-hosted GitLab by default — bump the
# tag yourself or enable self-hosted Renovate (see README "Keeping image tags
# current"). Point this at the image your CI builds
# (registry.git.ericsweiss.com/<group>/<app>) or any upstream image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeme-app
  labels:
    app.kubernetes.io/name: changeme-app
spec:
  # Two replicas for rolling updates without downtime. If you enable hpa.yaml,
  # DELETE this `replicas:` line so Flux server-side apply doesn't fight the HPA.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: changeme-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeme-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Soft NAS-avoidance: prefer the general compute agents over the
      # storage node. Remove/adjust if your workload is storage-local. To PIN
      # to the NAS node (zvol-backed data), replace this whole affinity block
      # with a required hostname match on `k3s-agt-nas-01` plus a toleration
      # for `esweiss.com/nas=true:PreferNoSchedule` — see docs/ARCHITECTURE.md.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: esweiss.com/nas
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: changeme-app
      containers:
        - name: app
          image: registry.git.ericsweiss.com/changeme-group/changeme-app:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Bind each secret key you need as its own env var, mirroring the
          # rest of the cluster (see kubernetes/apps in weisssrv). This is the
          # required shape: the ExternalSecret's keys are hyphenated (`api-key`)
          # to match the homelab convention, and hyphens are not valid env-var
          # names — an `envFrom: secretRef` would silently SKIP them. `optional:
          # true` lets the pod start before the operator has wired the secret
          # store. Delete this block (and externalsecret.yaml) if you need no
          # secrets.
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: changeme-app-secrets
                  key: api-key
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Adjust paths to your app's health endpoints.
          # A slow-booting image can be killed by the livenessProbe before it
          # ever comes up (here: ~15s + 3*20s ≈ 75s of grace). If yours needs
          # longer, uncomment this startupProbe — while it runs, the liveness
          # and readiness probes are held off, and failureThreshold*periodSeconds
          # (300s below) is the real startup budget.
          # startupProbe:
          #   httpGet:
          #     path: /
          #     port: http
          #   periodSeconds: 10
          #   failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          # readOnlyRootFilesystem is on; give the app a writable scratch dir.
          # Add more emptyDir mounts (cache, run dirs) as your image needs them.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
