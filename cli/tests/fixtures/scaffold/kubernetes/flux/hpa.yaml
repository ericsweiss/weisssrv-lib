# Horizontal Pod Autoscaler — OPT-IN.
#
# The PodDisruptionBudget is now shipped by default in pdb.yaml (it needs no
# HPA), so this file is HPA-only. To enable the HPA:
#   1. Uncomment the resource below.
#   2. Add `- hpa.yaml` to the resources list in kustomization.yaml.
#   3. DELETE the `replicas:` line from deployment.yaml so Flux server-side
#      apply doesn't fight the HPA over the replica count.
#   4. Make vpa.yaml memory-only (`controlledResources: [memory]`) so the VPA
#      and HPA don't both drive CPU.
#   5. Keep `minReplicas >= 2` so the default pdb.yaml (`minAvailable: 1`) stays
#      satisfiable.

# ---
# apiVersion: autoscaling/v2
# kind: HorizontalPodAutoscaler
# metadata:
#   name: changeme-app
# spec:
#   scaleTargetRef:
#     apiVersion: apps/v1
#     kind: Deployment
#     name: changeme-app
#   minReplicas: 2
#   maxReplicas: 5
#   metrics:
#     - type: Resource
#       resource:
#         name: cpu
#         target:
#           type: Utilization
#           averageUtilization: 80
#   behavior:
#     scaleDown:
#       stabilizationWindowSeconds: 300
