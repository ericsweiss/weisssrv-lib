# Vendored from weisssrv-lib `lint/ruff.toml`. The `python-lint` CI job and the
# `github` shape's `python-lint` step both use ruff's own config discovery, so
# this file at the repo root is what makes them agree with a local
# `task python-lint` — and without it ruff's built-in defaults would flag style
# rules the vendored library scripts deliberately do not follow.
#
# `target-version` must not exceed the lowest Python this repo's scripts support
# (the vendored helpers are stdlib-only and 3.9-compatible).
target-version = "py39"

[lint]
# Correctness-first selection: pyflakes (F), the pycodestyle subsets that flag
# real errors rather than layout (E4 imports, E7 statements, E9 syntax/IO), W
# (invalid escapes, trailing whitespace), and bugbear (B). Formatting-only rules
# (line length, quote style, import order) are deliberately OUT — the family has
# no formatter and churning them would bury the findings that matter.
select = ["E4", "E7", "E9", "F", "W", "B"]
