# GitLab Secret Detection custom ruleset.
#
# GitLab's Secret-Detection job runs gitleaks under the hood. The supported way
# to load a custom gitleaks config is a `[[secrets.passthrough]]` here that
# points at `.gitleaks.toml`. (The `SECRET_DETECTION_RULESET_PATH` variable is
# NOT a documented GitLab variable and is silently ignored.)
# https://docs.gitlab.com/user/application_security/secret_detection/pipeline/#customize-analyzer-rulesets
[secrets]
  description = "Custom Secret Detection ruleset"
  [[secrets.passthrough]]
    type = "file"
    target = "gitleaks.toml"
    value = ".gitleaks.toml"
