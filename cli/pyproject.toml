[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weisssrv-lib-cli"
# Tracks the library release tag (see docs/VERSIONING.md); weisssrv_lib_cli
# reads it back at runtime via importlib.metadata rather than duplicating it.
version = "0.7.0"
description = "Render weisssrv copier templates (new-cluster, new-app)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Eric S. Weiss" }]
# No runtime dependencies: the package is stdlib-only, and copier — the one
# thing it drives — is the `cluster` extra below.
dependencies = []

[project.optional-dependencies]
# pyyaml is TEST-ONLY — the test suite reads rendered files back with
# yaml.safe_load; it is never imported by the weisssrv_lib_cli package.
test = ["pytest>=7", "pyyaml>=6", "copier>=9.4,<10"]
# copier is an EXTRA so `--help`, argument validation and the destination guards
# work without pulling jinja2/pydantic/plumbum in.
cluster = ["copier>=9.4,<10"]

[project.scripts]
weisssrv-new-project = "weisssrv_lib_cli.cli:main"

[tool.setuptools]
# The sdist/wheel build from `#subdirectory=cli`, so the repo-root LICENSE is
# outside the artifact — ship the copy that lives here.
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["weisssrv_lib_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
