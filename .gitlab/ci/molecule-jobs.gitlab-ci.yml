---
# Shared molecule job templates for the weisssrv.infra collection, kept OUT of
# .gitlab-ci.yml so the same definitions serve both runners of them: the parent
# pipeline's static full matrix (main + web) and the MR-scoped child pipeline
# scripts/generate-molecule-pipeline.py emits, which `include: local:`s this
# file and extends these templates.
#
# Keep it SELF-CONTAINED: a child pipeline includes only this file, so nothing
# here may `!reference` an anchor from .gitlab-ci.yml, and it must not define
# the static matrix the child emits itself. Every `needs:` below is optional
# for the same reason — those upstream jobs do not exist in a child.
#
# No `.integration-test-job`: this library ships no integration suite, and the
# generator emits no job extending it while `.gitlab-ci.yml` has no
# `integration-tests` matrix. Add both together if a stack lands.

.molecule-base:
  stage: test
  # Set HERE, not inherited: this repo's .gitlab-ci.yml has no `default: tags:`
  # to begin with, and a `default:` would NOT reach a child pipeline that
  # includes only this file anyway — untagged child jobs get grabbed by the
  # shared NON-privileged runner and die instantly (no privileged DinD). Same
  # for interruptible: a newer MR push must still auto-cancel the child's jobs.
  tags: [infrastructure]
  interruptible: true
  # Infra-class retries only. Deliberately NOT script_failure (a failing test
  # must not be masked — transient container start storms are handled by the
  # in-job destroy+jitter loop in scripts/molecule-retry.sh) and NOT
  # stuck_or_timeout_failure (a hung test should fail fast, not burn another
  # full timeout).
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  needs:
    # build-molecule-ci emits a dotenv pinning MOLECULE_CI_IMAGE to the pushed
    # image digest (overriding the :latest fallback below); artifacts:true
    # consumes it.
    - job: build-molecule-ci
      optional: true
      artifacts: true
    # build-molecule-test rebuilds the role container. Optional need so WHEN it
    # runs the matrix waits for the push before pulling by SHA tag — otherwise
    # the SHA pull below misses and falls back to the previous main's :latest (a
    # pull-before-push race when only the test image rebuilt).
    - job: build-molecule-test
      optional: true
    # Gate the expensive privileged-DinD fan-out behind the two fastest
    # correctness lints, so an MR with a syntax/lint error doesn't burn the whole
    # matrix on the scarce privileged runner. optional: both lints are
    # path-gated, so they are absent from pipelines that don't touch their paths.
    - job: ansible-lint
      optional: true
    - job: yaml-lint
      optional: true
  # Pre-built CI runner image (docker-cli + molecule + ansible + collections
  # baked in) — saves ~2 min of apt/pip/galaxy per job vs a bare python image.
  # `image:` only supports single-var expansion ($VAR), not bash defaults, so the
  # :latest fallback lives in the variables block below; the build job's dotenv
  # digest pin (above) overrides it on the hot path (anti-retag race).
  image: $MOLECULE_CI_IMAGE
  services:
    # Digest-pinned (multi-arch index) on the same 27.5.1 line as
    # ci/build/docker-build.yml — this daemon runs privileged.
    #
    # --insecure-registry: the in-cluster pull-through cache is plaintext HTTP,
    # network-fenced to the runner's namespace; every fresh DinD daemon needs the
    # flag to pull from it. Site-specific to this instance's privileged runner —
    # every use below is timeout-bounded with a direct-registry fallback, so a
    # cache that is absent or unreachable only loses the warm hit.
    - name: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      # Explicit: the runner derives an alias from the image name, and a
      # digest-pinned name must still answer at the `docker` host DOCKER_HOST uses.
      alias: docker
      command: ["--insecure-registry=registry-cache.registry-cache.svc.cluster.local:5000"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ANSIBLE_FORCE_COLOR: "1"
    PY_COLORS: "1"
    ANSIBLE_CALLBACKS_ENABLED: junit
    JUNIT_OUTPUT_DIR: "$CI_PROJECT_DIR/junit"
    COLLECTION_DIR: "$CI_PROJECT_DIR/ansible_collections/weisssrv/infra"
    # The repo root IS a valid collections path (it holds ansible_collections/),
    # which is what makes `weisssrv.infra.<name>` resolvable by FQCN. Molecule's
    # own provisioner env (molecule-shared/base.yml) sets the equivalent relative
    # path for the playbook runs; this is the floor for every ansible /
    # ansible-galaxy invocation molecule does not override. Singular spelling
    # ONLY: ansible-compat hard-errors whenever the legacy plural
    # ANSIBLE_COLLECTIONS_PATHS is present, even alongside the singular.
    ANSIBLE_COLLECTIONS_PATH: "$CI_PROJECT_DIR"
    # Every scenario resolves its platform image from MOLECULE_TEST_IMAGE (a
    # FULL ref — tag or digest inside the value, so a pin replaces the whole
    # thing). MOLECULE_IMAGE is the tagless base this job's pull logic works
    # with; the before_script tags this pipeline's SHA build as :latest
    # locally, so the scenarios land on the image this pipeline actually built.
    MOLECULE_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-test"
    MOLECULE_TEST_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-test:latest"
    # In-cluster pull-through registry cache: each molecule job's fresh DinD
    # cold-pulls the molecule-test image; after the first job warms the cache the
    # rest of the fan-out hits the LAN cache instead of the GitLab registry.
    REGISTRY_CACHE: "registry-cache.registry-cache.svc.cluster.local:5000"
    # Fallback when build-molecule-ci is skipped this pipeline; its dotenv
    # artifact (when present) overrides this with the digest pin.
    MOLECULE_CI_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-ci:latest"
  before_script:
    # Wait for the DinD sidecar — with the pre-built CI image the script starts
    # before DinD is ready (no apt/pip delay to absorb its startup).
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "Waiting for DinD... ($i)"
        sleep 1
      done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Cache-first pull, SHA tag before :latest: when build-molecule-test rebuilt
    # the image in THIS pipeline the jobs must use the SHA build, not a stale
    # :latest (the anti-retag race). Every cache pull is timeout-bounded and
    # falls back to the direct registry, so a cache outage can never break or
    # stall CI — it only loses the warm hit.
    - |
      cache_ref() { echo "${REGISTRY_CACHE}/${1#"${CI_REGISTRY}"/}"; }
      pull_via_cache() {  # $1 = full direct ref; tags cache hit back to $1
        local ref="$1" cref
        cref="$(cache_ref "$ref")"
        if timeout 25 docker pull "$cref" 2>/dev/null; then
          docker tag "$cref" "$ref"
          return 0
        fi
        docker pull "$ref" 2>/dev/null
      }
      if pull_via_cache "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}"; then
        docker tag "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${MOLECULE_IMAGE}:latest"
      else
        pull_via_cache "${MOLECULE_IMAGE}:latest" || docker pull "${MOLECULE_IMAGE}:latest"
      fi
    - mkdir -p "$CI_PROJECT_DIR/junit"
  artifacts:
    when: always
    reports:
      junit: junit/*.xml
  # 30m, not 20m: the in-job wrapper retries molecule up to 4 attempts and the
  # heaviest scenarios run ~8-11m per attempt, so 20m could not fit even two full
  # attempts — a first-attempt flake on a heavy role was an automatic timeout.
  timeout: 30m

.molecule-test-job:
  extends: .molecule-base
  script:
    # molecule resolves the scenario's relative paths (galaxy requirements,
    # shared prepare, ANSIBLE_*_PATH) against the ROLE dir — see
    # molecule-shared/README.md; invoking from anywhere else finds galaxy.yml and
    # reports "no scenarios".
    - cd "$COLLECTION_DIR/roles/$ROLE"
    # In-job destroy + jitter retry (see scripts/molecule-retry.sh for the why:
    # container-start storms under a full fan-out). The retry policy (max
    # attempts + jitter window) lives in that ONE script. The default scenarios
    # inherit shared config from molecule-shared/base.yml via -c; the
    # self-contained non-default scenarios (adguard_home/tls, k3s/agent,
    # resolv_conf/empty-search) keep their full molecule.yml, no -c.
    - |
      base_opt=""
      [ "$SCENARIO" = "default" ] && base_opt="-c $COLLECTION_DIR/molecule-shared/base.yml"
      MOL_BASE="$base_opt" MOL_SCEN="-s $SCENARIO" \
        bash "$CI_PROJECT_DIR/scripts/molecule-retry.sh"
    # Runs only when molecule SUCCEEDED (last script step): downgrade the
    # scenario's DECLARED negative-path failures in the junit report so a green
    # job uploads a green report. Undeclared failures stay red; failed jobs never
    # reach this line and keep their raw reports. An absent expectations file is
    # a no-op.
    - python3 "$CI_PROJECT_DIR/scripts/sanitize-junit-expected-failures.py"
      --junit-dir "$CI_PROJECT_DIR/junit"
      --expectations "$COLLECTION_DIR/roles/$ROLE/molecule/$SCENARIO/expected-junit-failures.txt"
