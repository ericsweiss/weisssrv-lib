---
# Shared molecule job templates for weisssrv.infra, extended by the static full
# matrix and the MR-scoped child pipeline. Keep SELF-CONTAINED: a child includes
# only this file. Contract: docs/INCLUDE-CONTRACT.md § molecule.

.molecule-base:
  stage: test
  # Set HERE: a `default:` in .gitlab-ci.yml would not reach a child pipeline
  # that includes only this file, and an untagged child job lands on the shared
  # NON-privileged runner and dies instantly. Same for interruptible.
  tags: [infrastructure]
  interruptible: true
  # Infra-class retries only: container-start storms are handled by the in-job
  # destroy+jitter loop in scripts/molecule-retry.sh.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  needs:
    # build-molecule-ci emits a dotenv pinning MOLECULE_CI_IMAGE to the pushed
    # image digest (overriding the :latest fallback below); artifacts:true
    # consumes it.
    - job: build-molecule-ci
      optional: true
      artifacts: true
    # build-molecule-test rebuilds the role container. Optional need so when it
    # runs the matrix waits for the push before pulling by SHA tag, instead of
    # falling back to the previous main's :latest (pull-before-push race).
    - job: build-molecule-test
      optional: true
    # Gate the privileged-DinD fan-out behind the two fastest lints, so a syntax
    # error does not burn the whole matrix. Optional because both are
    # path-gated and absent from pipelines that do not touch their paths.
    - job: ansible-lint
      optional: true
    - job: yaml-lint
      optional: true
  # Pre-built CI runner image (docker-cli, molecule, ansible, collections baked
  # in). `image:` supports single-var expansion only, so the :latest fallback
  # lives in the variables block and the dotenv digest pin overrides it.
  image: $MOLECULE_CI_IMAGE
  services:
    # Digest-pinned (multi-arch index) on the same 27.5.1 line as
    # ci/build/docker-build.yml; this daemon runs privileged. --insecure-registry
    # reaches the plaintext in-cluster pull-through cache — docs/INCLUDE-CONTRACT.md.
    - name: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      # Explicit: the runner derives an alias from the image name, and a
      # digest-pinned name must still answer at the `docker` host DOCKER_HOST uses.
      alias: docker
      # --mtu: the daemon's bridge inside a pod must not exceed the pod interface
      # MTU (1420 on flannel over WireGuard); 1500 black-holes large TLS frames.
      command:
        - "--insecure-registry=registry-cache.registry-cache.svc.cluster.local:5000"
        - "--mtu=1420"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ANSIBLE_FORCE_COLOR: "1"
    PY_COLORS: "1"
    ANSIBLE_CALLBACKS_ENABLED: junit
    JUNIT_OUTPUT_DIR: "$CI_PROJECT_DIR/junit"
    COLLECTION_DIR: "$CI_PROJECT_DIR/ansible_collections/weisssrv/infra"
    # The repo root is a valid collections path, which makes
    # `weisssrv.infra.<name>` resolvable by FQCN. Singular spelling ONLY:
    # ansible-compat hard-errors if the legacy plural is present alongside it.
    ANSIBLE_COLLECTIONS_PATH: "$CI_PROJECT_DIR"
    # Scenarios resolve their platform image from MOLECULE_TEST_IMAGE, a FULL
    # ref. MOLECULE_IMAGE is the tagless base the pull logic below works with,
    # which tags this pipeline's SHA build as :latest locally.
    MOLECULE_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-test"
    MOLECULE_TEST_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-test:latest"
    # In-cluster pull-through registry cache: each molecule job's fresh DinD
    # cold-pulls the molecule-test image; after the first job warms the cache the
    # rest of the fan-out hits the LAN cache instead of the GitLab registry.
    REGISTRY_CACHE: "registry-cache.registry-cache.svc.cluster.local:5000"
    # Fallback when build-molecule-ci is skipped this pipeline; its dotenv
    # artifact (when present) overrides this with the digest pin.
    MOLECULE_CI_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-ci:latest"
    # Set: molecule-retry.sh writes the attempt count here and the dotenv report
    # below surfaces it. Unset means no dotenv is written.
    MOLECULE_RETRY_DOTENV: "$CI_PROJECT_DIR/molecule-retry.env"
  before_script:
    # Wait for the DinD sidecar — with the pre-built CI image the script starts
    # before DinD is ready (no apt/pip delay to absorb its startup).
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "Waiting for DinD... ($i)"
        sleep 1
      done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Cache-first pull, SHA tag BEFORE :latest: when build-molecule-test rebuilt
    # the image in this pipeline the jobs must use that SHA build, not a stale
    # :latest. Cache pulls are timeout-bounded and fall back to the registry.
    - |
      cache_ref() { echo "${REGISTRY_CACHE}/${1#"${CI_REGISTRY}"/}"; }
      pull_via_cache() {  # $1 = full direct ref; tags cache hit back to $1
        local ref="$1" cref
        cref="$(cache_ref "$ref")"
        if timeout 25 docker pull "$cref" 2>/dev/null; then
          docker tag "$cref" "$ref"
          return 0
        fi
        docker pull "$ref" 2>/dev/null
      }
      if pull_via_cache "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}"; then
        docker tag "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${MOLECULE_IMAGE}:latest"
      else
        pull_via_cache "${MOLECULE_IMAGE}:latest" || docker pull "${MOLECULE_IMAGE}:latest"
      fi
    - mkdir -p "$CI_PROJECT_DIR/junit"
  artifacts:
    when: always
    # The junit report glob does not match the subdirectory, so the preserved
    # failed attempts ride along as plain files instead.
    paths:
      - "junit/failed-attempt-*/"
    reports:
      junit: junit/*.xml
      dotenv: molecule-retry.env
  # 30m, not 20m: the in-job wrapper retries molecule up to 4 attempts and the
  # heaviest scenarios run ~8-11m per attempt, so 20m could not fit even two full
  # attempts — a first-attempt flake on a heavy role was an automatic timeout.
  timeout: 30m

.molecule-test-job:
  extends: .molecule-base
  script:
    # molecule resolves the scenario's relative paths against the ROLE dir
    # (molecule-shared/README.md); invoking it anywhere else finds galaxy.yml
    # and reports "no scenarios".
    - cd "$COLLECTION_DIR/roles/$ROLE"
    # In-job destroy + jitter retry; the policy lives in molecule-retry.sh.
    # Every scenario inherits molecule-shared/base.yml via -c; a scenario's own
    # molecule.yml wins on deep-merge, which is what the non-default ones rely on.
    - |
      MOL_BASE="-c $COLLECTION_DIR/molecule-shared/base.yml" MOL_SCEN="-s $SCENARIO" \
        bash "$CI_PROJECT_DIR/scripts/molecule-retry.sh"
    # Runs only when molecule succeeded: downgrades the scenario's DECLARED
    # negative-path failures so a green job uploads a green report. Undeclared
    # failures stay red; an absent expectations file is a no-op.
    - python3 "$CI_PROJECT_DIR/scripts/sanitize-junit-expected-failures.py"
      --junit-dir "$CI_PROJECT_DIR/junit"
      --expectations "$COLLECTION_DIR/roles/$ROLE/molecule/$SCENARIO/expected-junit-failures.txt"
      --strict
