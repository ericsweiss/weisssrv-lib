# GitLab Secret Detection ruleset for weisssrv-lib itself. The passthrough
# points straight at the shipped allowlist (lint/gitleaks.toml) so the library
# carries no second copy of a config it publishes.
[secrets]
  description = "weisssrv-lib self-applied Secret Detection ruleset"
  [[secrets.passthrough]]
    type = "file"
    target = "gitleaks.toml"
    value = "lint/gitleaks.toml"
