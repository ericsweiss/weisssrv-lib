# GitLab Secret Detection ruleset for weisssrv-lib itself.
#
# Same mechanism the shipped lint/secret-detection-ruleset.toml documents for
# consumers, except the passthrough points STRAIGHT AT the shipped allowlist
# (lint/gitleaks.toml) instead of a vendored root copy — the library must not
# carry a second, drifting fork of a config it publishes.
[secrets]
  description = "weisssrv-lib self-applied Secret Detection ruleset"
  [[secrets.passthrough]]
    type = "file"
    target = "gitleaks.toml"
    value = "lint/gitleaks.toml"
