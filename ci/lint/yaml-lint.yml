spec:
  inputs:
    job_name:
      default: yaml-lint
      description: Name of the generated job.
    stage:
      default: lint
      description: Pipeline stage the job runs in.
    image:
      default: python:3.11-slim
      description: Base image (must have pip).
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    yamllint_version:
      default: "1.38.0"
      description: >-
        yamllint pip pin, held equal to docker/molecule-ci/requirements.txt by
        tests/test_lint_version_parity.py.
    config:
      default: "-d relaxed"
      description: >-
        yamllint config argument: `-d relaxed`, or `-c <path>` to load a config
        file (e.g. `-c lint/yamllint-relaxed.yml`; this library ships the
        profiles in lint/). A repo that also runs ansible-lint must keep that
        file OFF its root: ansible-lint discovers a root `.yamllint` and swaps
        it in for its own yaml[*] rules, losing fix mode.
    require_config:
      type: boolean
      default: true
      description: >-
        Fail the job when `config` is left at its `-d relaxed` default while the
        repo ships a yamllint profile (`lint/yamllint-*.yml`, `.yamllint*`):
        that pairing lints under yamllint's own rules, not the repo's, and
        still reports green. Set false for a repo whose profile exists only for
        other tools.
    targets:
      default: "ansible/ kubernetes/ .gitlab-ci.yml .gitlab/ci/"
      description: >-
        Space-separated paths to lint; each is passed to a separate yamllint
        invocation. A target that does not exist is SKIPPED with a note, so the
        defaults degrade on a repo laid out differently. Tenant repos typically
        pass `.` (the whole tree, with `config: -c lint/yamllint-relaxed.yml`).
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    changes:
      type: array
      default:
        - "ansible/**/*"
        - "kubernetes/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/**/*"
      description: Path list for the MR / default-branch `changes:` rules.
    job_memory_limit:
      default: "512Mi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Sizing policy:
        docs/INCLUDE-CONTRACT.md § Resource inputs.
    job_memory_request:
      default: "128Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
    job_cpu_request:
      default: "100m"
      description: >-
        KUBERNETES_CPU_REQUEST for the job pod (scheduler reservation). Sizing
        policy: docs/INCLUDE-CONTRACT.md § Resource inputs.
---
"$[[ inputs.job_name ]]":
  needs: []
  stage: $[[ inputs.stage ]]
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
    KUBERNETES_CPU_REQUEST: $[[ inputs.job_cpu_request ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  before_script:
    # `--user`: the shared non-root runner cannot write system site-packages.
    # Invoke by absolute user-base path: `python -m yamllint` can import a
    # repo-local yamllint, and bare `yamllint` is off PATH on python:*-slim.
    - pip install --user --quiet "yamllint==$[[ inputs.yamllint_version ]]"
    - YAMLLINT_BIN="$(python -m site --user-base)/bin/yamllint"
  script:
    - |
      set -e
      # CRITICAL: `-d relaxed` is yamllint's own profile, not the repo's. A repo
      # that ships a profile and leaves `config` at the default lints under the
      # wrong rules and still goes green.
      if [ "$[[ inputs.require_config ]]" = "true" ] && [ "$[[ inputs.config ]]" = "-d relaxed" ]; then
        for profile in lint/yamllint-relaxed.yml lint/yamllint-self.yml lint/yamllint.yml .yamllint .yamllint.yml .yamllint.yaml; do
          [ -e "$profile" ] || continue
          echo "ERROR: $profile exists but config is the default '-d relaxed'."
          echo "       Pass config: \"-c $profile\", or require_config: false to lint under yamllint's own profile."
          exit 1
        done
      fi
      # shellcheck disable=SC2043,SC2086  # word-split the space-separated
      # `targets` input into one yamllint invocation per path. A target absent
      # from this tree is skipped, not failed.
      linted=0
      for target in $[[ inputs.targets ]]; do
        if [ ! -e "$target" ]; then
          echo "no such target '$target' — skipping"
          continue
        fi
        echo "$YAMLLINT_BIN $[[ inputs.config ]] $target"
        "$YAMLLINT_BIN" $[[ inputs.config ]] "$target"
        linted=$((linted + 1))
      done
      # A skipped target is a layout difference; ALL of them missing is a
      # misconfigured `targets` input, and a green job that linted nothing is
      # exactly the silent pass this gate exists to prevent.
      [ "$linted" -gt 0 ] || { echo "ERROR: none of the configured targets exist"; exit 1; }
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
