spec:
  inputs:
    job_name:
      default: runbook-anchors
    stage:
      default: lint
    image:
      default: python:3.13-slim
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    script_path:
      default: "scripts/check-runbook-anchors.py"
      description: >-
        Path to the runbook-anchor checker in the CONSUMER repo, vendored from
        this library's scripts/check-runbook-anchors.py (stdlib only, no
        network).
    rules_dir:
      default: "kubernetes/infrastructure/observability"
      description: >-
        Tree scanned for `runbook_url` annotations. The WHOLE tree is walked, so
        a ruler's rule files outside a `rules/` subdirectory are covered too.
    docs_dir:
      default: "docs"
      description: Tree the resolved runbook paths are looked up in.
    base_placeholder:
      default: "${cluster_runbook_base_url}/"
      description: >-
        Substitution prefix every in-repo `runbook_url` must carry. A literal
        path is reported: it would not survive Flux substitution.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    changes:
      type: array
      default:
        - "kubernetes/infrastructure/observability/**/*"
        - "docs/**/*.md"
        - "scripts/check-runbook-anchors.py"
      description: >-
        Path list for the MR / default-branch `changes:` rules. A doc rename
        breaks an anchor without touching a rule file, so the docs tree belongs
        here; a path missing here means no run on that edit.
    job_memory_limit:
      default: "512Mi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Sizing policy:
        docs/INCLUDE-CONTRACT.md § Resource inputs.
    job_memory_request:
      default: "128Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
    job_cpu_request:
      default: "100m"
      description: >-
        KUBERNETES_CPU_REQUEST for the job pod (scheduler reservation). Sizing
        policy: docs/INCLUDE-CONTRACT.md § Resource inputs.
---
"$[[ inputs.job_name ]]":
  needs: []
  stage: $[[ inputs.stage ]]
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
    KUBERNETES_CPU_REQUEST: $[[ inputs.job_cpu_request ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  script:
    - |
      python3 "$[[ inputs.script_path ]]" \
        --rules-dir "$[[ inputs.rules_dir ]]" \
        --docs-dir "$[[ inputs.docs_dir ]]" \
        --base-placeholder '$[[ inputs.base_placeholder ]]'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
