spec:
  inputs:
    job_name:
      default: lint-docs-links
    stage:
      default: lint
    image:
      default: python:3.11
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    script_path:
      default: "scripts/check-doc-links.py"
      description: >-
        Path to the offline link checker in the CONSUMER repo, vendored from
        this library's scripts/check-doc-links.py (stdlib only, no network).
    roots:
      default: ""
      description: >-
        Optional space-separated repo roots to scan. Empty uses the checker's
        default: every git-TRACKED *.md in the repo (falling back to docs/ +
        $CHECK_DOC_LINKS_EXTRA outside a git checkout). A repo with Markdown
        outside `docs/` therefore needs no `roots` — but it does need to widen
        `changes:` to match, or the job never fires on those files. See
        docs/SCRIPTS.md.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    changes:
      type: array
      default:
        - "**/*.md"
        - "scripts/check-doc-links.py"
      description: >-
        Path list for the MR / default-branch `changes:` rules. The default
        mirrors the checker's own roots (every git-tracked *.md). Narrow it only
        to trade coverage for pipeline time: a path missing here means no run on
        that edit.
    job_memory_limit:
      default: "512Mi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Sizing policy:
        docs/INCLUDE-CONTRACT.md § Resource inputs.
    job_memory_request:
      default: "128Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
    job_cpu_request:
      default: "100m"
      description: >-
        KUBERNETES_CPU_REQUEST for the job pod (scheduler reservation). Sizing
        policy: docs/INCLUDE-CONTRACT.md § Resource inputs.
---
"$[[ inputs.job_name ]]":
  needs: []
  stage: $[[ inputs.stage ]]
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
    KUBERNETES_CPU_REQUEST: $[[ inputs.job_cpu_request ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  script:
    # roots is word-split on purpose: it may name several directories.
    - python3 "$[[ inputs.script_path ]]" $[[ inputs.roots ]]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
