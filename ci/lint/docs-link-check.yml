spec:
  inputs:
    job_name:
      default: docs-link-check
    stage:
      default: lint
    image:
      default: python:3.11
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    script_path:
      default: "scripts/check-doc-links.py"
      description: >-
        Path to the offline link checker in the CONSUMER repo, vendored from
        this library's scripts/check-doc-links.py (stdlib only, no network).
    roots:
      default: ""
      description: >-
        Optional space-separated repo roots to scan. Empty uses the checker's
        default: every git-TRACKED *.md in the repo (falling back to docs/ +
        $CHECK_DOC_LINKS_EXTRA outside a git checkout). A repo with Markdown
        outside `docs/` therefore needs no `roots` — but it does need to widen
        `changes:` to match, or the job never fires on those files. See
        docs/SCRIPTS.md.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH`: the value lands
        inside a quoted `rules:if` string, which GitLab does not expand, so the
        comparison would never match and the job would silently stop running
        post-merge.
    changes:
      type: array
      default:
        - "docs/**/*"
        - "README.md"
        - "CLAUDE.md"
        - "scripts/check-doc-links.py"
        - "scripts/test_check_doc_links.py"
      description: >-
        Path list for the MR / default-branch `changes:` rules. A consumer whose
        markdown lives outside these paths passes its own list — the checker
        scans `roots`, and a path missing here just means no run on that edit.
    job_memory_limit:
      default: "512Mi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Right-sized per job class so
        concurrent pipelines pack into the runner namespace's limits.memory
        quota instead of every job costing the runner default; raise it per
        consumer only when the job really needs more (the runner's
        memory_limit_overwrite_max_allowed is the hard ceiling).
    job_memory_request:
      default: "128Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
---
"$[[ inputs.job_name ]]":
  needs: []
  stage: $[[ inputs.stage ]]
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  script:
    # shellcheck disable=SC2086  # intentional word-split of the roots input
    - python3 "$[[ inputs.script_path ]]" $[[ inputs.roots ]]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
