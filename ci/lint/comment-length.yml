spec:
  inputs:
    job_name:
      default: comment-length
    stage:
      default: lint
    image:
      default: python:3.13-slim
      description: Base image (must have pip and python3).
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    script_path:
      default: "scripts/check-comment-length.py"
      description: >-
        Path to the gate in the CONSUMER repo, vendored from this library's
        scripts/check-comment-length.py.
    paths:
      default: "."
      description: >-
        Space-separated files or directories to scan. The default is the whole
        tree; the gate excludes tool caches, scratch trees and third-party trees
        on its own (the full set is docs/INCLUDE-CONTRACT.md §
        ci/lint/comment-length.yml) and skips any suffix it has no comment
        syntax for. Narrowing this trades coverage for nothing much: the scan
        is a few seconds on a large repo.
    config:
      default: ""
      description: >-
        Optional `--config <file>` argument, e.g. `--config .comment-length.yml`.
        The config carries paths, include/exclude globs and the two limits. A
        YAML config needs PyYAML; a JSON one does not.
    pyyaml_version:
      default: "6.0.2"
      description: >-
        PyYAML pin installed before the run, so a YAML `config` parses. Pass an
        empty string to skip the install when the gate needs no config.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    changes:
      type: array
      default: ["**/*"]
      description: >-
        Path list for the MR / default-branch `changes:` rules. The default
        matches every file, because the convention applies to every file: a
        narrowed list lets an over-long comment land in a path it does not
        name.
    job_memory_limit:
      default: "512Mi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Sizing policy:
        docs/INCLUDE-CONTRACT.md § Resource inputs.
    job_memory_request:
      default: "128Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
    job_cpu_request:
      default: "100m"
      description: >-
        KUBERNETES_CPU_REQUEST for the job pod (scheduler reservation). Sizing
        policy: docs/INCLUDE-CONTRACT.md § Resource inputs.
---
"$[[ inputs.job_name ]]":
  needs: []
  stage: $[[ inputs.stage ]]
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
    KUBERNETES_CPU_REQUEST: $[[ inputs.job_cpu_request ]]
    PYYAML_VERSION: "$[[ inputs.pyyaml_version ]]"
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  before_script:
    - |
      set -eu
      if [ -n "$PYYAML_VERSION" ]; then
        pip install --user --quiet "pyyaml==$PYYAML_VERSION"
      fi
  script:
    # paths and config are word-split on purpose: each may carry several arguments.
    - python3 "$[[ inputs.script_path ]]" $[[ inputs.paths ]] $[[ inputs.config ]]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
