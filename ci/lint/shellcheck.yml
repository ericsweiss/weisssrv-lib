spec:
  inputs:
    job_name:
      default: shellcheck
    stage:
      default: lint
    image:
      # Pinned (not :stable) so lint results are reproducible — a moving tag
      # could silently change shellcheck behavior between runs.
      default: koalaman/shellcheck-alpine:v0.11.0
      description: >-
        shellcheck image (pinned digest/tag for reproducibility). Its tag is
        held equal to scripts/ci-fetch-tools.py's shellcheck pin by
        tests/test_pin_parity.py, so both paths lint on one version.
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    severity:
      default: warning
      description: shellcheck --severity level.
    exclude:
      default: "SC1091,SC2034"
      description: Comma-separated shellcheck exclusions.
    direct_globs:
      default: "scripts/*.sh ansible/*.sh"
      description: >-
        Space-separated files/globs shellchecked directly; a glob that matches
        nothing is skipped with a note. A repo with only scripts/ passes
        `scripts/*.sh`.
    find_dir:
      default: "ansible/roles"
      description: >-
        Directory recursively searched for *.sh and *.sh.j2 (the Jinja shell
        templates get the neutralizer treatment). Empty — or a directory this
        repo does not have — skips both find loops with a note.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    changes:
      type: array
      default:
        - "scripts/**/*"
        - "ansible/*.sh"
        - "ansible/roles/**/*.sh"
        - "ansible/roles/**/*.sh.j2"
      description: Path list for the MR / default-branch `changes:` rules.
    job_memory_limit:
      default: "512Mi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Sizing policy:
        docs/INCLUDE-CONTRACT.md § Resource inputs.
    job_memory_request:
      default: "128Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
    job_cpu_request:
      default: "100m"
      description: >-
        KUBERNETES_CPU_REQUEST for the job pod (scheduler reservation). Sizing
        policy: docs/INCLUDE-CONTRACT.md § Resource inputs.
---
"$[[ inputs.job_name ]]":
  needs: []
  stage: $[[ inputs.stage ]]
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
    KUBERNETES_CPU_REQUEST: $[[ inputs.job_cpu_request ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  script:
    - echo "Running ShellCheck..."
    # `linted` and `failed` carry across these blocks (the runner concatenates
    # them into ONE script) and are checked in the last one, so a job that
    # checked nothing cannot pass. No block exits on its own.
    - linted=0
    - failed=0
    - |
      # Direct files/globs, linting only what exists: an unmatched glob stays
      # literal in POSIX sh, so `[ -e ]` separates a real file from a pattern
      # that matched nothing and the tenant is skipped with a note, not failed.
      rc=0
      # word-split + glob-expand direct_globs on purpose (SC2086).
      for f in $[[ inputs.direct_globs ]]; do
        if [ -e "$f" ]; then
          shellcheck --severity=$[[ inputs.severity ]] --exclude=$[[ inputs.exclude ]] "$f" || rc=1
          linted=$((linted + 1))
        else
          echo "no files match '$f' — skipping"
        fi
      done
      [ "$rc" -eq 0 ] || { echo "ShellCheck failed on one or more direct files"; failed=1; }
    - |
      FIND_DIR="$[[ inputs.find_dir ]]"
      # Unset OR absent skips: a set-but-missing dir would make `find` exit
      # non-zero, failing a consumer that simply does not have that tree.
      if [ -z "$FIND_DIR" ]; then
        echo "no find_dir set — skipping role shell + template checks"
      elif [ ! -d "$FIND_DIR" ]; then
        echo "no such find_dir '$FIND_DIR' — skipping role shell + template checks"
      else
        # One walk into a list file: `find | while` would report only the LAST
        # iteration's status, and rc must be CAPTURED because the runner checks
        # only this block's last command. Folded into `failed` so *.sh.j2 runs.
        rc=0
        sh_list=$(mktemp)
        find "$FIND_DIR" -name '*.sh' -type f > "$sh_list"
        if [ -s "$sh_list" ]; then
          xargs shellcheck --severity=$[[ inputs.severity ]] --exclude=$[[ inputs.exclude ]] < "$sh_list" || rc=1
        fi
        linted=$((linted + $(wc -l < "$sh_list")))
        rm -f "$sh_list"
        [ "$rc" -eq 0 ] || { echo "ShellCheck failed on one or more role shell scripts"; failed=1; }
      fi
    - |
      FIND_DIR="$[[ inputs.find_dir ]]"
      if [ -z "$FIND_DIR" ] || [ ! -d "$FIND_DIR" ]; then
        echo "no usable find_dir — skipping *.sh.j2 template checks"
      else
        # Jinja is neutralized before linting *.sh.j2. A {# #} comment-RANGE
        # delete would eat bash ${#arr[@]}, so {% raw %}-wrapped templates drop
        # only FULL-LINE {# ... #} comments; keep out-of-raw headers single-line.
        rendered=$(mktemp)
        tmpl_list=$(mktemp)
        rc=0
        find "$FIND_DIR" -name '*.sh.j2' -type f > "$tmpl_list"
        while read -r tmpl; do
          echo "Checking: $tmpl"
          if grep -Eq '^[[:space:]]*\{%-?[[:space:]]*raw[[:space:]]*-?%\}[[:space:]]*$' "$tmpl"; then
            sed -E \
              -e '/^[[:space:]]*\{#.*#\}[[:space:]]*$/d' \
              -e '/\{%.*%\}/d' \
              -e 's/\{\{"\{"\}\}/{/g' \
              -e 's/\{\{"\}"\}\}/}/g' \
              -e 's/\{\{[^}]*\}\}/JINJA/g' "$tmpl" > "$rendered"
          else
            sed -E \
              -e '/\{#/,/#\}/d' \
              -e '/\{%.*%\}/d' \
              -e 's/\{\{"\{"\}\}/{/g' \
              -e 's/\{\{"\}"\}\}/}/g' \
              -e 's/\{\{[^}]*\}\}/JINJA/g' "$tmpl" > "$rendered"
          fi
          shellcheck --severity=$[[ inputs.severity ]] --exclude=$[[ inputs.exclude ]] "$rendered" || rc=1
          linted=$((linted + 1))
        done < "$tmpl_list"
        rm -f "$rendered" "$tmpl_list"
        [ "$rc" -eq 0 ] || { echo "ShellCheck failed on one or more *.sh.j2 templates"; failed=1; }
      fi
    - |
      # One skip is a layout difference; ALL of them skipping means
      # `direct_globs` and `find_dir` describe a tree this repo does not have,
      # and the job would report "ShellCheck passed" having read nothing.
      [ "$linted" -gt 0 ] || {
        echo "ERROR: shellcheck matched no files — direct_globs and find_dir cover nothing in this repo"
        exit 1
      }
      [ "$failed" -eq 0 ] || {
        echo "ShellCheck FAILED ($linted file(s) checked) — see the block output above"
        exit 1
      }
      echo "ShellCheck passed ($linted file(s) checked)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
