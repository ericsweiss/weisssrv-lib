---
# Canonical copy in weisssrv-lib; vendored as .github/workflows/build-image.yml.
# Builds this service's image, pushing to GHCR on the default branch only.
# Registry swap and GitLab differences: the app template's docs/CI-SHAPES.md.
name: build-image

# CRITICAL: push-only, no workflow_dispatch. This workflow holds
# `packages: write`; other triggers run it from unreviewed code that can drop
# the step-level push guard. The pull-request gate is ci.yml's `docker-build`.
"on":
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR only. Another registry changes these two and the login step's
  # REGISTRY_USER / REGISTRY_TOKEN together; a registry nothing pushes to
  # leaves every consumer's `image:` pointing at a tag that never appears.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — checkout otherwise writes the job's
      # `packages: write` token into .git/config, and the build context is the
      # repository, so a Dockerfile could `COPY .git/config` it into the image.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      # A project running an upstream image has no Dockerfile: skip rather than
      # fail. The skip is ANNOUNCED — this file cannot tell "never builds one"
      # from "the Dockerfile was renamed and main quietly stopped publishing".
      - name: Check for a Dockerfile
        id: dockerfile
        run: |
          set -euo pipefail
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Dockerfile::build-image published nothing — there is no Dockerfile at the repository root. Expected for a project that runs an upstream image; otherwise the file was renamed or deleted and this branch has silently stopped shipping images."
            echo "**build-image skipped** — no \`Dockerfile\` at the repository root, so nothing was built or pushed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve image tags
        if: steps.dockerfile.outputs.present == 'true'
        id: tags
        run: |
          set -euo pipefail
          # Lowercase: a GitHub owner may contain uppercase, an OCI repository
          # name may not.
          base="${REGISTRY}/$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "sha=${base}:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        if: steps.dockerfile.outputs.present == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" \
            -u "$REGISTRY_USER" --password-stdin

      - name: Build
        if: steps.dockerfile.outputs.present == 'true'
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha }}
          BASE: ${{ steps.tags.outputs.base }}
        run: |
          set -euo pipefail
          # Best-effort registry layer cache off the previous :latest. Missing
          # (the first build) is not an error.
          docker pull "${BASE}:latest" || true
          docker build \
            --cache-from "${BASE}:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --tag "$SHA_TAG" \
            --file Dockerfile .

      - name: Push
        if: steps.dockerfile.outputs.present == 'true'
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha }}
          BASE: ${{ steps.tags.outputs.base }}
        run: |
          set -euo pipefail
          docker push "$SHA_TAG"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag "$SHA_TAG" "${BASE}:latest"
            docker push "${BASE}:latest"
          fi
          echo "Pushed ${SHA_TAG} — point deployment.yaml's image: at it."
