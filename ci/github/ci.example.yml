---
# Canonical copy: weisssrv-lib `ci/github/ci.example.yml`. Consumers vendor it
# byte-identically as `.github/workflows/ci.yml` — edit it upstream, then
# re-vendor. Vendoring rather than `uses:` is forced: GitHub has no equivalent
# of GitLab's `include: project:` for a private library. Every path named below
# (`docs/`, `scripts/`, `kubernetes/`) is CONSUMER-relative and resolves in the
# tenant repo, not here.
#
# CI for a cluster tenant repo hosted on GITHUB (`ci_shape: github`).
#
# This reproduces the GATES of the GitLab pipeline in `.gitlab-ci.yml` — the
# checks that make sense off-cluster: YAML lint, `kustomize build` +
# kubeconform of the tenant manifests, shellcheck, the docs link check, and a
# secret scan. The image build lives in its own workflow (build-image.yml).
#
# One repo runs ONE shape, chosen when the template is rendered. The shapes, the
# job-for-job parity table, and what a github.com repo genuinely gives up versus
# self-hosted GitLab are in docs/CI-SHAPES.md in the app template (the doc
# lives there, not in the rendered tenant).
#
# Deploys are NOT here, by design. Flux pulls this repo and reconciles it; a
# workflow that ran `kubectl apply` would fight the reconciler. See
# docs/ONBOARDING.md.
#
# Tool versions are pinned, and every downloaded binary is sha256-verified
# against the value the GitLab library template uses, so both shapes gate on
# byte-identical tools. This file is itself vendored byte-identically from the
# library — registered in its scripts/vendored-paths.yml and gated by its
# scripts/check-vendored-copies.py — so a library bump that moves a pin arrives
# here as a re-vendor, never as a hand edit.
name: ci

# Quoted: unquoted `on` is a YAML 1.1 boolean, which yamllint's truthy rule
# flags. GitHub reads the quoted key identically.
"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The image build asks for `packages: write` separately.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every pin below is held equal to its GitLab-side counterpart by
  # tests/test_pin_parity.py — the two CI shapes gate on identical tools, so
  # bump both sides together.
  # Matches the weisssrv-lib yaml-lint template default.
  YAMLLINT_VERSION: "1.38.0"
  # Matches the weisssrv-lib flux-lint template defaults (version + sha256).
  KUSTOMIZE_VERSION: "5.4.3"
  KUSTOMIZE_SHA256: "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7"
  KUBECONFORM_VERSION: "0.6.7"
  KUBECONFORM_SHA256: "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73"
  # Matches the weisssrv-lib shellcheck template's image tag.
  SHELLCHECK_VERSION: "0.10.0"
  SHELLCHECK_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
  # Matches the weisssrv-lib python-lint template's ruff_version default.
  RUFF_VERSION: "0.16.0"
  # Matches the gitleaks rev pinned in .pre-commit-config.yaml.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # The cluster's Kubernetes minor. A byte-identical copy cannot take a copier
  # answer, so this is the library's own literal: a cluster on a different minor
  # edits this one line by hand. The GitLab shape takes the answer in both
  # places it validates from — docs/CI-SHAPES.md (app template) records the
  # difference.
  K8S_VERSION: "1.36.0"

jobs:
  # --- yaml-lint: lint the whole tree against the repo-local .yamllint -------
  yaml-lint:
    name: yaml-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # No job here pushes; do not persist the token.
          persist-credentials: false
      - name: Install yamllint
        # pipx ships in the GitHub-hosted runner image and puts the console
        # script on PATH. (Ubuntu's system Python is externally managed, so a
        # plain `pip install --user` would refuse.)
        run: pipx install "yamllint==${YAMLLINT_VERSION}"
      - name: Lint
        run: yamllint -c .yamllint .

  # --- flux-lint: kustomize build + kubeconform of the tenant manifests -----
  # The same two commands the GitLab flux-lint job runs in SIMPLE mode
  # (`substitute: false`): a tenant pins literal image tags, so there is no
  # cluster-versions ConfigMap and nothing to envsubst.
  flux-lint:
    name: flux-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # No job here pushes; do not persist the token.
          persist-credentials: false
      - name: Install kustomize + kubeconform (sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          fetch() {  # <url> <sha256> <member>
            curl -fsSL -o "$RUNNER_TEMP/tool.tar.gz" "$1"
            echo "$2  $RUNNER_TEMP/tool.tar.gz" | sha256sum -c -
            tar xzf "$RUNNER_TEMP/tool.tar.gz" -C "$RUNNER_TEMP/bin" "$3"
          }
          fetch \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            "$KUSTOMIZE_SHA256" kustomize
          fetch \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            "$KUBECONFORM_SHA256" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render + validate
        run: |
          set -euo pipefail
          # Platform CRDs (IngressRoute, ServiceMonitor, VPA, ExternalSecret,
          # Certificate) validate against the datreeio catalog; core kinds use
          # kubeconform's bundled schemas. -ignore-missing-schemas keeps a CRD
          # with no published schema from failing the gate.
          CATALOG='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          kustomize build kubernetes/flux > "$RUNNER_TEMP/rendered.yaml"
          kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version "$K8S_VERSION" \
            -schema-location default \
            -schema-location "$CATALOG" \
            -summary "$RUNNER_TEMP/rendered.yaml"

  # --- shellcheck: lint the scripts/ helpers --------------------------------
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # No job here pushes; do not persist the token.
          persist-credentials: false
      - name: Install shellcheck (sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP/bin" \
            --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint scripts/
        run: |
          set -euo pipefail
          # Same severity/exclusions as the GitLab job. An unmatched glob stays
          # literal in POSIX sh, so `[ -e ]` tells a real file from a pattern
          # that matched nothing — a repo with no scripts/ is skipped, not
          # failed.
          rc=0
          for f in scripts/*.sh; do
            if [ -e "$f" ]; then
              shellcheck --severity=warning --exclude=SC1091,SC2034 "$f" || rc=1
            else
              echo "no files match '$f' — skipping"
            fi
          done
          exit "$rc"

  # --- python-lint: ruff over the Python this repo ships --------------------
  # The GitLab twin pins the same ruff version and the same target — `scripts`,
  # the only Python a tenant ships — and both resolve the vendored ./ruff.toml by
  # ruff's own discovery, so the two shapes report identical findings. ruff errors
  # on a path that does not exist, so widen the target list only alongside the
  # directory itself, and in both shapes.
  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # No job here pushes; do not persist the token.
          persist-credentials: false
      - name: Install ruff
        # pipx, for the same reason yaml-lint uses it: Ubuntu's system Python is
        # externally managed (PEP 668), so `pip install` — with or without
        # --user — exits 1 with `error: externally-managed-environment` on
        # ubuntu-latest. pipx ships in the runner image and puts the console
        # script on PATH.
        run: pipx install "ruff==${RUFF_VERSION}"
      - name: Lint scripts/
        run: |
          set -euo pipefail
          ruff check --no-cache --output-format concise scripts

  # --- docs-link-check: relative Markdown cross-links resolve ---------------
  docs-link-check:
    name: docs-link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # This job executes PR-controlled repository content
          # (scripts/check-doc-links.py), and nothing here pushes.
          persist-credentials: false
      - name: Check relative doc links
        # The vendored, stdlib-only checker — no network, no dependencies.
        run: python3 scripts/check-doc-links.py

  # --- secret-detection: gitleaks, tuned by .gitleaks.toml ------------------
  # GitLab's managed Secret-Detection analyzer runs gitleaks under the hood and
  # loads .gitleaks.toml through .gitlab/secret-detection-ruleset.toml. On
  # GitHub there is no analyzer wrapper, so gitleaks is invoked directly with
  # the same config file. Findings FAIL the job in both shapes; what GitHub
  # gives up is the vulnerability report and MR widget — see docs/CI-SHAPES.md
  # in the app template.
  secret-detection:
    name: secret-detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # Full history so the commit-range scan below can see every commit a
          # pull request adds.
          fetch-depth: 0
          # gitleaks only reads the local clone and never pushes, so the token
          # has no business surviving checkout into .git/config.
          persist-credentials: false
      - name: Install gitleaks (sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
      # Pushes are scanned too, not just pull requests: the working-tree scan
      # above cannot see a secret that a multi-commit push adds and then deletes,
      # and a tenant without branch protection can push straight to main.
      - name: Scan the commits this event adds
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        # SHAs come in as environment variables rather than being interpolated
        # into the shell line — the repo's standing rule for any `${{ }}` value
        # that reaches a command.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          # A branch's first push reports an all-zero `before`; there is no range
          # to diff against, so scan everything reachable from the new tip.
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="$HEAD_SHA"
          else
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          fi
          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --platform github --log-opts="$LOG_OPTS"

  # The Dockerfile gate. It lives HERE, not in build-image.yml, because that
  # workflow holds `packages: write` and a pull_request run executes the workflow
  # file FROM THE PR — so a same-repo PR could edit away its step-level push
  # guard and publish before review. build-image.yml is therefore push-only, and
  # this job keeps a broken Dockerfile from reaching main under `contents: read`
  # alone. It builds and throws the image away; nothing here can push.
  #
  # It deliberately runs on push as well as pull_request, which does mean main
  # builds the image twice (here, and in build-image.yml). That is the price of
  # gating the release: the release workflow triggers on `ci` completing, so
  # without this job on push, a tag could be cut for a commit whose image never
  # built. The second build is warm — both pull the same registry layer cache.
  # Drop the `push` half only if you also stop gating releases on `ci`.
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      # A project running an upstream image has no Dockerfile — skip, do not
      # fail. Announced rather than silent for the reason build-image.yml's
      # identical guard spells out: a byte-identical copy cannot tell that case
      # from a Dockerfile someone renamed, and both otherwise read as a green
      # job with every step skipped.
      - name: Check for a Dockerfile
        id: dockerfile
        run: |
          set -euo pipefail
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Dockerfile::docker-build checked nothing — there is no Dockerfile at the repository root. Expected for a project that runs an upstream image; otherwise the file was renamed or deleted."
            echo "**docker-build skipped** — no \`Dockerfile\` at the repository root." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build (no push)
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          set -euo pipefail
          docker build --tag ci-build-check:${GITHUB_SHA::8} --file Dockerfile .
