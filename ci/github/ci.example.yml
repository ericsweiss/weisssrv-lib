---
# Canonical copy in weisssrv-lib; vendored byte-identically as
# .github/workflows/ci.yml. Off-cluster gates for a GitHub-hosted tenant;
# deploys belong to Flux. Shapes and parity: the app template's docs/CI-SHAPES.md.
name: ci

# Quoted: unquoted `on` is a YAML 1.1 boolean, which yamllint's truthy rule
# flags. GitHub reads the quoted key identically.
"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The image build asks for `packages: write` separately.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every pin below is held equal to its counterpart (GitLab template default,
  # or the pre-commit rev for gitleaks) by tests/test_pin_parity.py — bump both
  # sides together.
  YAMLLINT_VERSION: "1.38.0"
  KUSTOMIZE_VERSION: "5.8.2"
  KUSTOMIZE_SHA256: "06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  RUFF_VERSION: "0.16.7"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # The cluster's Kubernetes minor. Set repository variable K8S_VERSION to your
  # own: a byte-identical copy cannot take a copier answer. The fallback is held
  # equal to ci/validate/flux-lint.yml's by tests/test_pin_parity.py.
  K8S_VERSION: ${{ vars.K8S_VERSION || '1.36.0' }}
  # Empty unless the repository variable is set; flux-lint announces the
  # fallback rather than validating against the wrong minor in silence.
  K8S_VERSION_OVERRIDE: ${{ vars.K8S_VERSION }}
  # Directory the manifest gates walk. Repository variable MANIFEST_ROOT
  # overrides it; the fallback is the gates' own default.
  MANIFEST_ROOT: ${{ vars.MANIFEST_ROOT || 'kubernetes/flux' }}
  # Rendered resources kubeconform may validate against NO schema. Repository
  # variable ALLOWED_SKIPS raises it per kind the catalog does not carry; the
  # fallback is held equal to flux-lint.yml's allowed_skips by test_pin_parity.
  ALLOWED_SKIPS: ${{ vars.ALLOWED_SKIPS || '0' }}
  # Held equal to ci/validate/flux-lint.yml's pyyaml_version by
  # tests/test_pin_parity.py.
  PYYAML_VERSION: "6.0.2"
  # Ref of datreeio/CRDs-catalog the kubeconform schema location resolves
  # against, pinned so a catalog rewrite cannot change what this gate accepts.
  # The fallback is held equal to flux-lint.yml's crd_catalog_ref by test_pin_parity.
  CRD_CATALOG_REF: ${{ vars.CRD_CATALOG_REF || 'ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2' }}

jobs:
  # --- yaml-lint: the whole tree against lint/yamllint-relaxed.yml ----------
  yaml-lint:
    name: yaml-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # No job here pushes; do not persist the token.
          persist-credentials: false
      - name: Install yamllint
        # pipx ships in the GitHub-hosted runner image and puts the console
        # script on PATH. (Ubuntu's system Python is externally managed, so a
        # plain `pip install --user` would refuse.)
        run: pipx install "yamllint==${YAMLLINT_VERSION}"
      - name: Lint
        run: yamllint -c lint/yamllint-relaxed.yml .

  # --- flux-lint: kustomize build + kubeconform of the tenant manifests -----
  # The same two commands the GitLab flux-lint job runs in SIMPLE mode: a tenant
  # pins literal image tags, so there is nothing to envsubst.
  flux-lint:
    name: flux-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # No job here pushes; do not persist the token.
          persist-credentials: false
      - name: Install kustomize + kubeconform (sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          fetch() {  # <url> <sha256> <member>
            curl -fsSL -o "$RUNNER_TEMP/tool.tar.gz" "$1"
            echo "$2  $RUNNER_TEMP/tool.tar.gz" | sha256sum -c -
            tar xzf "$RUNNER_TEMP/tool.tar.gz" -C "$RUNNER_TEMP/bin" "$3"
          }
          fetch \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            "$KUSTOMIZE_SHA256" kustomize
          fetch \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            "$KUBECONFORM_SHA256" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render + validate
        run: |
          set -euo pipefail
          # Platform CRDs validate against the datreeio catalog, core kinds
          # against kubeconform's bundled schemas; -ignore-missing-schemas keeps
          # a CRD with no published schema from failing the gate.
          CATALOG="https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_REF}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          if [ -z "$K8S_VERSION_OVERRIDE" ]; then
            echo "::warning title=K8S_VERSION not set::Validating against Kubernetes $K8S_VERSION, the library fallback. Set repository variable K8S_VERSION to this cluster's minor."
          fi
          kustomize build kubernetes/flux > "$RUNNER_TEMP/rendered.yaml"
          # CRITICAL: an emptied `resources:` list renders nothing and both
          # tools exit 0 on it, while a cluster-side Kustomization with
          # `prune: true` then deletes every object this repo applied.
          if ! grep -q '^kind:' "$RUNNER_TEMP/rendered.yaml"; then
            echo "ERROR: kustomize build kubernetes/flux rendered no document — check for an emptied or mistyped resources: list"
            exit 1
          fi
          # 2>&1: per-resource failures go to stderr, which the capture would
          # otherwise swallow on the failing path.
          if ! summary=$(kubeconform -strict -ignore-missing-schemas \
              -kubernetes-version "$K8S_VERSION" \
              -schema-location default \
              -schema-location "$CATALOG" \
              -summary "$RUNNER_TEMP/rendered.yaml" 2>&1); then
            printf '%s\n' "$summary"
            exit 1
          fi
          printf '%s\n' "$summary"
          # CRITICAL: -ignore-missing-schemas exits 0 on a resource it could not
          # schema-validate, so an unreachable catalog degrades the run to core
          # kinds in silence. A summary with no Skipped: field is that signature.
          case "$ALLOWED_SKIPS" in
            ''|*[!0-9]*) echo "ERROR: ALLOWED_SKIPS must be a non-negative integer, got '$ALLOWED_SKIPS'"; exit 1 ;;
          esac
          skipped=$(printf '%s\n' "$summary" | sed -n 's/.*Skipped: \([0-9][0-9]*\).*/\1/p')
          if [ -z "$skipped" ] || [ "$skipped" -gt "$ALLOWED_SKIPS" ]; then
            echo "ERROR: kubeconform validated ${skipped:-?} resource(s) against no schema (ALLOWED_SKIPS=$ALLOWED_SKIPS)"
            echo "The catalog at $CRD_CATALOG_REF moved or was unreachable, or the kind has no published schema."
            echo "Add a -schema-location for it, or raise repository variable ALLOWED_SKIPS."
            exit 1
          fi

  # --- manifest-gates: the repo's own gate scripts over its manifests -------
  # The GitLab shape gives every gate a job template; this is their counterpart.
  # Each gate runs when the repo ships it; a repo shipping none fails.
  manifest-gates:
    name: manifest-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # This job executes PR-controlled repository content (the gate
          # scripts), and nothing here pushes.
          persist-credentials: false
      - name: Install PyYAML
        # The gates import PyYAML as a library, which pipx cannot provide, and
        # ubuntu-latest's system Python is externally managed (PEP 668).
        run: pip install --user --break-system-packages "pyyaml==${PYYAML_VERSION}"
      - name: Run the manifest gates
        run: |
          set -euo pipefail
          ran=0
          run_gate() {  # <script name> [args...]
            script="scripts/$1"
            shift
            if [ ! -f "$script" ]; then
              echo "::warning title=Gate not shipped::$script is absent — skipped."
              return 0
            fi
            echo "=== $script $* ==="
            python3 "$script" "$@"
            ran=$((ran + 1))
          }
          # The egress fence reads consumer policy data when the repo ships it.
          if [ -f scripts/netpol-except.yaml ]; then
            run_gate check-netpol-except-parity.py \
              --config scripts/netpol-except.yaml "$MANIFEST_ROOT"
          else
            run_gate check-netpol-except-parity.py "$MANIFEST_ROOT"
          fi
          # --namespace-from-tree, not --namespace: a byte-identical copy cannot
          # carry a tenant's namespace, and a monitor scoped with matchNames is
          # refused without one.
          run_gate check-scrape-wiring.py --namespace-from-tree "$MANIFEST_ROOT"
          run_gate check-kustomization.py "$MANIFEST_ROOT"
          if [ "$ran" -eq 0 ]; then
            echo "ERROR: no manifest gate ran — scripts/ ships none of them, so this job proves nothing"
            exit 1
          fi

  # --- shellcheck: lint the scripts/ helpers --------------------------------
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # No job here pushes; do not persist the token.
          persist-credentials: false
      - name: Install shellcheck (sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP/bin" \
            --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint scripts/
        run: |
          set -euo pipefail
          # Same severity/exclusions as the GitLab job. An unmatched glob stays
          # literal in POSIX sh, so `[ -e ]` separates a real file from a
          # pattern that matched nothing, and a repo with no scripts/ is skipped.
          rc=0
          for f in scripts/*.sh; do
            if [ -e "$f" ]; then
              shellcheck --severity=warning --exclude=SC1091,SC2034 "$f" || rc=1
            else
              echo "no files match '$f' — skipping"
            fi
          done
          exit "$rc"

  # --- python-lint: ruff over the Python this repo ships --------------------
  # Same ruff version and target as the GitLab twin, resolving ./ruff.toml.
  # ruff errors on a missing path, so widen the target list in both shapes.
  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # No job here pushes; do not persist the token.
          persist-credentials: false
      - name: Install ruff
        # pipx, for the same reason yaml-lint uses it: ubuntu-latest's system
        # Python is externally managed (PEP 668), so `pip install` exits 1.
        run: pipx install "ruff==${RUFF_VERSION}"
      - name: Lint scripts/
        run: |
          set -euo pipefail
          # ruff exits 0 on a path holding no Python file, so the floor is
          # checked here rather than read out of ruff's output.
          if [ ! -d scripts ] || [ -z "$(find scripts -name '*.py' -type f -print -quit)" ]; then
            echo "ERROR: ruff matched no Python file — scripts/ covers nothing in this repo"
            exit 1
          fi
          ruff check --no-cache --output-format concise scripts

  # --- comment-length: the comment convention, over the whole tree ----------
  # The GitLab twin is ci/lint/comment-length.yml. Same vendored gate, same
  # whole-tree scan, and no config, so the stdlib-only run needs no PyYAML.
  comment-length:
    name: comment-length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # This job executes PR-controlled repository content
          # (scripts/check-comment-length.py), and nothing here pushes.
          persist-credentials: false
      - name: Check comment length
        # The gate exits 2 when it found no scannable file, so a repo whose
        # tree stopped resolving fails instead of reporting green.
        run: python3 scripts/check-comment-length.py .

  # --- lint-docs-links: relative Markdown cross-links resolve ---------------
  lint-docs-links:
    name: lint-docs-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # This job executes PR-controlled repository content
          # (scripts/check-doc-links.py), and nothing here pushes.
          persist-credentials: false
      - name: Check relative doc links
        # The vendored, stdlib-only checker — no network, no dependencies.
        run: python3 scripts/check-doc-links.py

  # --- secret-detection: gitleaks, tuned by .gitleaks.toml ------------------
  # GitLab's managed analyzer runs gitleaks too; here it is invoked directly
  # with the same config. Findings fail in both shapes.
  secret-detection:
    name: secret-detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # Full history so the commit-range scan below can see every commit a
          # pull request adds.
          fetch-depth: 0
          # gitleaks only reads the local clone and never pushes, so the token
          # has no business surviving checkout into .git/config.
          persist-credentials: false
      - name: Install gitleaks (sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
      # Pushes are scanned too, not just pull requests: the working-tree scan
      # above cannot see a secret that a multi-commit push adds and then deletes,
      # and a tenant without branch protection can push straight to main.
      - name: Scan the commits this event adds
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        # SHAs come in as environment variables rather than being interpolated
        # into the shell line — the repo's standing rule for any `${{ }}` value
        # that reaches a command.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          # A branch's first push reports an all-zero `before`; there is no range
          # to diff against, so scan everything reachable from the new tip.
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="$HEAD_SHA"
          else
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          fi
          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --platform github --log-opts="$LOG_OPTS"

  # The Dockerfile gate lives here, not in build-image.yml: that workflow holds
  # packages: write and a pull_request run executes the PR's own workflow file.
  # It runs on push too, because the release is gated on `ci`.
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      # A project running an upstream image has no Dockerfile — skip, do not
      # fail, and ANNOUNCE the skip: a byte-identical copy cannot tell that case
      # from a Dockerfile someone renamed.
      - name: Check for a Dockerfile
        id: dockerfile
        run: |
          set -euo pipefail
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Dockerfile::docker-build checked nothing — there is no Dockerfile at the repository root. Expected for a project that runs an upstream image; otherwise the file was renamed or deleted."
            echo "**docker-build skipped** — no \`Dockerfile\` at the repository root." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build (no push)
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          set -euo pipefail
          docker build --tag ci-build-check:${GITHUB_SHA::8} --file Dockerfile .
