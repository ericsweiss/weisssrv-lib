spec:
  inputs:
    api_url:
      default: "${CI_API_V4_URL}"
      description: >-
        GitLab API base the state is hosted on. The default tracks whichever
        instance the pipeline runs on, which is the only value that can be
        right everywhere: TF_HTTP_PASSWORD is `${CI_JOB_TOKEN}`, valid only
        against the instance that issued it, so a hard-coded foreign address
        gets a 401/404 on `terraform init`. Override only to point at a
        DIFFERENT project's state on the same instance.
    state_name:
      default: "cloudflare"
      description: >-
        Terraform state name under the project (weisssrv's default). This sets
        the pipeline's ONE default state: the hidden job's name is fixed, so a
        second include with another `state_name` would collide. A job managing a
        DIFFERENT state overrides the three TF_HTTP_*ADDRESS vars per-job —
        exactly as weisssrv's tailscale-drift-plan / authentik-drift-plan do.
---
# GitLab-managed Terraform HTTP state backend fragment. Defines the hidden
# `.terraform-http-backend` job: TF_HTTP_* env pointing at this project's
# GitLab-hosted state, authenticated with the pipeline's CI_JOB_TOKEN. A
# consumer `extends: .terraform-http-backend`.
#
# Per-job override for a one-off state (no second include):
#
#   variables:
#     TF_HTTP_ADDRESS: "https://.../terraform/state/<name>"
#     TF_HTTP_LOCK_ADDRESS: "https://.../terraform/state/<name>/lock"
#     TF_HTTP_UNLOCK_ADDRESS: "https://.../terraform/state/<name>/lock"
.terraform-http-backend:
  variables:
    TF_HTTP_ADDRESS: "$[[ inputs.api_url ]]/projects/${CI_PROJECT_ID}/terraform/state/$[[ inputs.state_name ]]"
    TF_HTTP_LOCK_ADDRESS: "$[[ inputs.api_url ]]/projects/${CI_PROJECT_ID}/terraform/state/$[[ inputs.state_name ]]/lock"
    TF_HTTP_UNLOCK_ADDRESS: "$[[ inputs.api_url ]]/projects/${CI_PROJECT_ID}/terraform/state/$[[ inputs.state_name ]]/lock"
    TF_HTTP_USERNAME: "gitlab-ci-token"
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_RETRY_WAIT_MIN: "5"
