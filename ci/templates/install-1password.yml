spec:
  inputs:
    min_op_version:
      default: ""
      description: >-
        Minimum acceptable `op --version`, e.g. `2.31.0`. The package comes from
        1Password's `stable` apt/apk suite, which is a moving target and cannot
        be pinned without the pin breaking once upstream prunes that version, so
        a consumer that depends on a feature asserts a FLOOR here instead. Empty
        (the default) accepts whatever the suite serves.
---
# 1Password CLI installer fragments: `.install-1password` (apt) and
# `.install-1password-alpine` (apk). Root-capable runner required — the shared
# tenant runner must use a masked CI variable instead. docs/INCLUDE-CONTRACT.md.
.install-1password:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl gnupg openssh-client
    - |
      # SUPPLY-CHAIN PIN: TLS does not prove the signing key is authentic, so
      # the downloaded key's fingerprint is checked against 1Password's
      # published code-signing key before it is trusted.
      OP_APT_KEY_FPR="3FEF9748469ADBE15DA7CA80AC2D62742012EA22"
      op_key="$(mktemp)"
      curl -sSf https://downloads.1password.com/linux/keys/1password.asc -o "$op_key"
      # EVERY primary (pub) key in the material, not only the first: `gpg
      # --dearmor` trusts the whole file, so a bundle prepending the genuine key
      # before an injected one would pass a first-match check.
      got_fprs="$(gpg --show-keys --with-fingerprint --with-colons "$op_key" \
        | awk -F: '/^pub:/ {p=1; next} /^fpr:/ && p {print $10; p=0}')"
      if [ "$got_fprs" != "$OP_APT_KEY_FPR" ]; then
        echo "ERROR: 1Password apt key material did not verify. Expected exactly:" >&2
        echo "  $OP_APT_KEY_FPR" >&2
        echo "Got:" >&2
        echo "$got_fprs" | sed 's/^/  /' >&2
        rm -f "$op_key"
        exit 1
      fi
      gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg < "$op_key"
      rm -f "$op_key"
      arch="$(dpkg --print-architecture)"
      echo "deb [arch=${arch} signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/${arch} stable main" \
        > /etc/apt/sources.list.d/1password.list
      apt-get update -qq && apt-get install -y -qq 1password-cli
    - |
      op --version
      # Floor assertion: the suite is a moving target, so a consumer that needs
      # a feature states the oldest `op` it works with.
      if [ -n "$[[ inputs.min_op_version ]]" ]; then
        awk -v have="$(op --version)" -v want="$[[ inputs.min_op_version ]]" 'BEGIN {
          n = split(want, w, "."); split(have, h, ".")
          for (i = 1; i <= n; i++) {
            hv = (i in h) ? h[i] + 0 : 0
            if (hv > w[i] + 0) exit 0
            if (hv < w[i] + 0) exit 1
          }
          exit 0
        }' || { echo "ERROR: op $(op --version) is below min_op_version $[[ inputs.min_op_version ]]" >&2; exit 1; }
      fi

.install-1password-alpine:
  before_script:
    - apk add --no-cache curl bash gnupg jq
    - |
      # The apk repo key must land in /etc/apk/keys under its exact filename
      # or apk reports "UNTRUSTED signature". Supply-chain pin: recompute the
      # hash with `curl -sSf <url> | sha256sum` after a rotation.
      OP_APK_KEY_SHA256="0e88171d9f8b7630763f70cbf69f2a01b4ba8ea1d8e79487f59c162db255eb84"
      op_apk_key="/etc/apk/keys/support@1password.com-61ddfc31.rsa.pub"
      op_apk_key_tmp="$(mktemp)"
      curl -sSf https://downloads.1password.com/linux/keys/alpinelinux/support@1password.com-61ddfc31.rsa.pub \
        -o "$op_apk_key_tmp"
      # Verify BEFORE moving into /etc/apk/keys, so unverified key material
      # never sits in the trusted dir and a valid key is not clobbered.
      if ! echo "${OP_APK_KEY_SHA256}  ${op_apk_key_tmp}" | sha256sum -c - ; then
        echo "ERROR: 1Password apk key checksum mismatch (expected $OP_APK_KEY_SHA256)" >&2
        rm -f "$op_apk_key_tmp"
        exit 1
      fi
      install -m 0644 "$op_apk_key_tmp" "$op_apk_key"
      rm -f "$op_apk_key_tmp"
      echo "https://downloads.1password.com/linux/alpinelinux/stable/" >> /etc/apk/repositories
      apk update
      apk add --no-cache 1password-cli
    - |
      op --version
      # Floor assertion: the suite is a moving target, so a consumer that needs
      # a feature states the oldest `op` it works with.
      if [ -n "$[[ inputs.min_op_version ]]" ]; then
        awk -v have="$(op --version)" -v want="$[[ inputs.min_op_version ]]" 'BEGIN {
          n = split(want, w, "."); split(have, h, ".")
          for (i = 1; i <= n; i++) {
            hv = (i in h) ? h[i] + 0 : 0
            if (hv > w[i] + 0) exit 0
            if (hv < w[i] + 0) exit 1
          }
          exit 0
        }' || { echo "ERROR: op $(op --version) is below min_op_version $[[ inputs.min_op_version ]]" >&2; exit 1; }
      fi
