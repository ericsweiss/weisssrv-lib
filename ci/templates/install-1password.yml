---
# 1Password CLI installer fragments. Defines two hidden jobs — `.install-1password`
# (Debian/apt images) and `.install-1password-alpine` (apk images) — that a
# consumer pulls into a job's before_script via `!reference`:
#
#   before_script:
#     - !reference [.install-1password, before_script]
#
# Requires a root-capable runner (writes apt/apk sources, installs a package).
# The shared non-privileged tenant runner CANNOT run these — a job that needs a
# secret on that runner must source it from a masked CI/CD variable instead of
# the op CLI. Extracted verbatim from weisssrv.
.install-1password:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl gnupg openssh-client
    - |
      # Install 1Password CLI
      curl -sS https://downloads.1password.com/linux/keys/1password.asc | \
        gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
      echo "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main" \
        > /etc/apt/sources.list.d/1password.list
      apt-get update -qq && apt-get install -y -qq 1password-cli
    - op --version

.install-1password-alpine:
  before_script:
    - apk add --no-cache curl bash gnupg jq
    - |
      # 1Password's apk repo is signed with their published RSA key; fetch the
      # public key into /etc/apk/keys under its exact filename so apk can verify
      # the index. The older `curl 1password.asc | gpg --dearmor` form broke once
      # 1Password moved to this RSA key — apk reported "UNTRUSTED signature" and
      # 1password-cli became unselectable. See 1password.dev/cli/get-started.
      curl -sSf https://downloads.1password.com/linux/keys/alpinelinux/support@1password.com-61ddfc31.rsa.pub \
        -o /etc/apk/keys/support@1password.com-61ddfc31.rsa.pub
      echo "https://downloads.1password.com/linux/alpinelinux/stable/" >> /etc/apk/repositories
      apk update
      apk add --no-cache 1password-cli
    - op --version
