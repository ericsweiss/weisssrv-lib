---
# 1Password CLI installer fragments. Defines two hidden jobs — `.install-1password`
# (Debian/apt images) and `.install-1password-alpine` (apk images) — that a
# consumer pulls into a job's before_script via `!reference`:
#
#   before_script:
#     - !reference [.install-1password, before_script]
#
# Requires a root-capable runner (writes apt/apk sources, installs a package).
# The shared non-privileged tenant runner CANNOT run these — a job that needs a
# secret on that runner must source it from a masked CI/CD variable instead of
# the op CLI.
.install-1password:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl gnupg openssh-client
    - |
      # Install 1Password CLI.
      #
      # SUPPLY-CHAIN PIN: TLS alone does not prove the signing key is authentic
      # (a compromised/MITM'd endpoint could serve a substituted key that then
      # signs a malicious apt repo). So verify the downloaded key's fingerprint
      # against 1Password's published code-signing key BEFORE trusting it.
      # The fingerprint was obtained with:
      #   curl -sSf https://downloads.1password.com/linux/keys/1password.asc \
      #     | gpg --show-keys --with-fingerprint --with-colons \
      #     | awk -F: '/^fpr:/{print $10; exit}'
      OP_APT_KEY_FPR="3FEF9748469ADBE15DA7CA80AC2D62742012EA22"
      op_key="$(mktemp)"
      curl -sSf https://downloads.1password.com/linux/keys/1password.asc -o "$op_key"
      # Collect the fingerprint of EVERY primary (pub) key in the downloaded
      # material — not only the first — and require the set to be EXACTLY the one
      # expected key. `gpg --dearmor` trusts every key in the file, so a bundle
      # that prepends the genuine 1Password key before an injected primary key
      # would otherwise pass a first-match check and still install the extra key.
      # `--with-colons` also emits fpr: records for SUBKEYS — hence the pub: gate.
      got_fprs="$(gpg --show-keys --with-fingerprint --with-colons "$op_key" \
        | awk -F: '/^pub:/ {p=1; next} /^fpr:/ && p {print $10; p=0}')"
      if [ "$got_fprs" != "$OP_APT_KEY_FPR" ]; then
        echo "ERROR: 1Password apt key material did not verify. Expected exactly:" >&2
        echo "  $OP_APT_KEY_FPR" >&2
        echo "Got:" >&2
        echo "$got_fprs" | sed 's/^/  /' >&2
        rm -f "$op_key"
        exit 1
      fi
      gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg < "$op_key"
      rm -f "$op_key"
      arch="$(dpkg --print-architecture)"
      echo "deb [arch=${arch} signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/${arch} stable main" \
        > /etc/apt/sources.list.d/1password.list
      apt-get update -qq && apt-get install -y -qq 1password-cli
    - op --version

.install-1password-alpine:
  before_script:
    - apk add --no-cache curl bash gnupg jq
    - |
      # 1Password's apk repo is signed with a bare RSA key (NOT the GPG key the
      # apt path uses): fetch it into /etc/apk/keys under its exact filename so
      # apk can verify the index, or apk reports "UNTRUSTED signature" and
      # 1password-cli is unselectable. See 1password.dev/cli/get-started.
      #
      # SUPPLY-CHAIN PIN: TLS alone does not prove the key is authentic, so verify
      # the downloaded RSA public key's SHA-256 checksum against the known-good
      # value BEFORE adding the repo / installing. This apk key is a bare RSA
      # public key (not a GPG key), so we pin its content hash rather than a GPG
      # fingerprint; recompute with `curl -sSf <url> | sha256sum` if 1Password
      # ever rotates it.
      OP_APK_KEY_SHA256="0e88171d9f8b7630763f70cbf69f2a01b4ba8ea1d8e79487f59c162db255eb84"
      op_apk_key="/etc/apk/keys/support@1password.com-61ddfc31.rsa.pub"
      op_apk_key_tmp="$(mktemp)"
      curl -sSf https://downloads.1password.com/linux/keys/alpinelinux/support@1password.com-61ddfc31.rsa.pub \
        -o "$op_apk_key_tmp"
      # Verify BEFORE moving into /etc/apk/keys: never let unverified key material
      # sit in the trusted keys dir, and don't clobber a pre-existing valid key on
      # a mismatched re-download.
      if ! echo "${OP_APK_KEY_SHA256}  ${op_apk_key_tmp}" | sha256sum -c - ; then
        echo "ERROR: 1Password apk key checksum mismatch (expected $OP_APK_KEY_SHA256)" >&2
        rm -f "$op_apk_key_tmp"
        exit 1
      fi
      install -m 0644 "$op_apk_key_tmp" "$op_apk_key"
      rm -f "$op_apk_key_tmp"
      echo "https://downloads.1password.com/linux/alpinelinux/stable/" >> /etc/apk/repositories
      apk update
      apk add --no-cache 1password-cli
    - op --version
