spec:
  inputs:
    fmt_job_name:
      default: terraform-fmt
    validate_job_name:
      default: terraform-validate
    fmt_stage:
      default: lint
    validate_stage:
      default: validate
    image:
      default: "hashicorp/terraform:1.15"
      description: Terraform image (entrypoint cleared for shell scripts).
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    fmt_dir:
      default: "terraform/"
      description: Directory `terraform fmt -check -recursive` runs against.
    module_glob:
      default: "terraform/*/"
      description: >-
        Glob of module dirs `terraform validate` loops over. Each module with a
        versions.tf is `terraform init -backend=false && terraform validate`d.
    test:
      type: boolean
      default: false
      description: >-
        Also run `terraform test` in each module that ships test files
        (`tests/*.tftest.hcl` or `*.tftest.hcl`). Off by default: a consumer
        with no tests would otherwise fail the accounting below. `terraform
        test` needs no credentials as long as every test file declares
        `mock_provider`.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rules of BOTH jobs. NOT `$CI_DEFAULT_BRANCH`: the
        value lands inside a quoted `rules:if` string, which GitLab does not
        expand, so the comparison would never match and the jobs would silently
        stop running post-merge.
    changes:
      type: array
      default: ["terraform/**/*"]
      description: Path list for the MR / default-branch `changes:` rules.
    job_memory_limit:
      default: "1Gi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Right-sized per job class so
        concurrent pipelines pack into the runner namespace's limits.memory
        quota instead of every job costing the runner default; raise it per
        consumer only when the job really needs more (the runner's
        memory_limit_overwrite_max_allowed is the hard ceiling).
    job_memory_request:
      default: "256Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
---
"$[[ inputs.fmt_job_name ]]":
  needs: []
  stage: $[[ inputs.fmt_stage ]]
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  script:
    # Cover every module under the fmt dir, not just one.
    - terraform fmt -check -recursive $[[ inputs.fmt_dir ]]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'

"$[[ inputs.validate_job_name ]]":
  needs: []
  stage: $[[ inputs.validate_stage ]]
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  script:
    # Validate every module under the glob. Each needs its own init (different
    # providers); -backend=false skips state/creds.
    - |
      set -eo pipefail
      validated=0
      tested=0
      for mod in $[[ inputs.module_glob ]]; do
        [ -f "${mod}versions.tf" ] || continue
        echo "=== terraform validate ${mod} ==="
        ( cd "$mod" && terraform init -backend=false && terraform validate )
        validated=$((validated + 1))
        # `terraform validate` evaluates no caller values, so it never runs a
        # variable `validation` block or a `precondition`. `terraform test`
        # does — plan-only runs against a mock_provider, so still no creds.
        if [ "$[[ inputs.test ]]" = "true" ]; then
          # Two probes, not one `ls` over both globs: an unmatched glob is
          # passed through literally and would fail the call for the dir that
          # does have tests.
          if ls "$mod"tests/*.tftest.hcl >/dev/null 2>&1 ||
             ls "$mod"*.tftest.hcl >/dev/null 2>&1; then
            echo "=== terraform test ${mod} ==="
            ( cd "$mod" && terraform test )
            tested=$((tested + 1))
          fi
        fi
      done
      # A green job that validated nothing is the silent pass this gate
      # prevents — the same accounting yaml-lint and shellcheck do.
      [ "$validated" -gt 0 ] || {
        echo "ERROR: module_glob matched no module with a versions.tf"
        exit 1
      }
      echo "terraform validate passed ($validated module(s))"
      if [ "$[[ inputs.test ]]" = "true" ]; then
        [ "$tested" -gt 0 ] || {
          echo "ERROR: test: true but no module under module_glob ships a *.tftest.hcl"
          exit 1
        }
        echo "terraform test passed ($tested module(s))"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
