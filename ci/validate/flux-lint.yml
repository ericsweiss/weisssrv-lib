spec:
  inputs:
    job_name:
      default: flux-lint
    stage:
      default: lint
    image:
      default: python:3.11-slim
      description: >-
        Job image. Must ship BASH and python: the scripts use `set -o pipefail`
        and `${!var+x}` indirect expansion, so an Alpine base (ash) fails in
        before_script. The root path additionally needs apt.
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    substitute:
      type: boolean
      default: true
      description: >-
        true (cluster repo): extract postBuild vars from a cluster-versions
        ConfigMap, envsubst every rendered Kustomization, iterate the cluster
        dir. Needs a ROOT runner (apt install gettext-base). false (tenant):
        render one literal-pinned path and kubeconform it — non-root safe,
        stdlib-only tool download.
    kubeconform_version:
      default: "0.8.0"
    kubeconform_sha256:
      default: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
    kustomize_version:
      default: "5.8.1"
    kustomize_sha256:
      default: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
    helm_version:
      default: "3.22.0"
      description: Only installed in substitute mode (schema-validating HelmRelease values).
    helm_sha256:
      default: "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb"
    pyyaml_version:
      default: "6.0.2"
      description: >-
        (substitute=true) pinned PyYAML for the inline spec.path parser. An
        unpinned floating install would let a breaking release change the
        before_script's behaviour between runs.
    k8s_version:
      default: ""
      description: >-
        kubeconform target k8s version. Empty in substitute mode derives it from
        the ConfigMap's k3s_version; tenants pass a literal (e.g. "1.36.0").
    kustomize_path:
      default: "kubernetes/flux"
      description: >-
        (substitute=false) the ONE directory the simple arm builds. The default
        is the tenant layout the app template renders; a repo laid out
        differently passes the path it actually reconciles, or the gate
        validates a tree it does not own.
    allowed_skips:
      default: "0"
      description: >-
        (substitute=false) how many rendered resources kubeconform may validate
        against NO schema. Above it the job fails, and so does a summary with no
        `Skipped:` field at all, which is what an unreachable catalog looks
        like. Raise it per kind the catalog does not carry. Substitute mode uses
        expected_skipped_file instead.
    cluster_dir:
      default: ""
      description: >-
        (substitute=true) dir of Flux Kustomizations to iterate. REQUIRED in
        substitute mode, which fails when it is empty; a cluster name is site
        data, so there is no real default. The simple arm never reads it.
    require_cluster_root:
      type: boolean
      default: true
      description: >-
        (substitute=true) true (default): always build the cluster root, so a
        bootstrapped consumer that loses its flux-system content fails instead
        of silently passing. false: skip the build while BOTH
        $CLUSTER_DIR/flux-system/gotk-components.yaml and gotk-sync.yaml are
        absent — the genuine pre-bootstrap state. A repo that has never run
        `flux bootstrap` MUST pass false or its first pipeline fails for a
        reason it cannot fix; the job's failure message says so.
    versions_configmap:
      default: "kubernetes/infrastructure/sources/versions-configmap.yaml"
      description: (substitute=true) the cluster-versions ConfigMap.
    flux_render_script:
      default: "scripts/flux-render.sh"
      description: (substitute=true) repo-local copy of the shared render helper.
    skipped_script:
      default: "scripts/kubeconform-skipped.py"
      description: (substitute=true) repo-local copy of the unvalidated-kind tracker.
    crd_catalog_ref:
      default: "ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2"
      description: >-
        Ref of datreeio/CRDs-catalog the kubeconform schema location resolves
        against. Pinned to a commit sha so a catalog rewrite cannot change what
        a gate accepts; point it at an internal mirror ref to self-host.
    expected_skipped_file:
      default: ""
      description: >-
        (substitute=true) repo-local baseline of apiVersion/Kind pairs known to
        have no schema in the catalog, one per line. Set it and a kind skipped
        outside the baseline FAILS the job, so an unreachable catalog can no
        longer degrade the run to core-kinds-only in silence. Empty (the
        default) keeps the tracker informational.
    extra_validation:
      default: ""
      description: >-
        (substitute=true) extra shell injected after the render loop, with
        $RENDER_ALL / $K8S_VER / $FAILED in scope. The supported shape is a
        consumer gate chain listed in scripts/render-gates.conf and run by
        scripts/run-render-gates.sh, so the value stays one line:
        `bash scripts/run-render-gates.sh --flux-env scripts/flux-env.sh`. The
        runner honours the same RENDER_ALL / VERSIONS_CONFIGMAP contract and
        exits non-zero on a failing gate. Any other shell still works.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    changes:
      type: array
      default:
        - "kubernetes/**/*"
        - "ansible/inventories/prod/group_vars/all.yml"
      description: >-
        Path list for the MR / default-branch `changes:` rules. The second entry
        is the inventory file a substitute-mode consumer generates its
        versions-configmap from; drop it when versions live elsewhere.
    job_memory_limit:
      default: "2Gi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Sizing policy:
        docs/INCLUDE-CONTRACT.md § Resource inputs.
    job_memory_request:
      default: "512Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
    job_cpu_request:
      default: "300m"
      description: >-
        KUBERNETES_CPU_REQUEST for the job pod (scheduler reservation). Sizing
        policy: docs/INCLUDE-CONTRACT.md § Resource inputs.
---
"$[[ inputs.job_name ]]":
  needs: []
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  # Cache the pinned lint binaries across runs (substitute mode), keyed on the
  # consumer's .gitlab-ci.yml (where the version inputs live) so a bump busts it.
  # No-op without a runner cache backend.
  cache:
    key:
      prefix: flux-lint
      files:
        - .gitlab-ci.yml
    paths:
      - .cache/flux-lint-tools
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
    KUBERNETES_CPU_REQUEST: $[[ inputs.job_cpu_request ]]
    SUBSTITUTE: "$[[ inputs.substitute ]]"
    KUBECONFORM_VERSION: "$[[ inputs.kubeconform_version ]]"
    KUBECONFORM_SHA256: "$[[ inputs.kubeconform_sha256 ]]"
    KUSTOMIZE_VERSION: "$[[ inputs.kustomize_version ]]"
    KUSTOMIZE_SHA256: "$[[ inputs.kustomize_sha256 ]]"
    HELM_VERSION: "$[[ inputs.helm_version ]]"
    HELM_SHA256: "$[[ inputs.helm_sha256 ]]"
    PYYAML_VERSION: "$[[ inputs.pyyaml_version ]]"
    K8S_VERSION_INPUT: "$[[ inputs.k8s_version ]]"
    KUSTOMIZE_PATH: "$[[ inputs.kustomize_path ]]"
    ALLOWED_SKIPS: "$[[ inputs.allowed_skips ]]"
    CLUSTER_DIR: "$[[ inputs.cluster_dir ]]"
    REQUIRE_CLUSTER_ROOT: "$[[ inputs.require_cluster_root ]]"
    VERSIONS_CONFIGMAP: "$[[ inputs.versions_configmap ]]"
    FLUX_RENDER_SCRIPT: "$[[ inputs.flux_render_script ]]"
    SKIPPED_SCRIPT: "$[[ inputs.skipped_script ]]"
    CRD_CATALOG_REF: "$[[ inputs.crd_catalog_ref ]]"
    EXPECTED_SKIPPED_FILE: "$[[ inputs.expected_skipped_file ]]"
  before_script:
    - |
      set -eo pipefail
      KC_URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
      KZ_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
      if [ "$SUBSTITUTE" = "true" ]; then
        # ROOT path (privileged runner): apt, /usr/local/bin and a verified
        # tarball cache. Every run re-checks each tarball against its pinned
        # sha256 and re-extracts.
        apt-get update -qq && apt-get install -y -qq curl gettext-base
        # `--user` like every other template: the user site dir is on sys.path,
        # so the inline parser imports it without a PATH change.
        pip install --user --quiet "pyyaml==$PYYAML_VERSION"
        TOOLS_CACHE="${CI_PROJECT_DIR}/.cache/flux-lint-tools"
        TOOLS_BIN=/usr/local/bin
        mkdir -p "$TOOLS_CACHE"
        fetch_verified() { # <file> <url> <sha256>
          if ! echo "$3  $TOOLS_CACHE/$1" | sha256sum -c - >/dev/null 2>&1; then
            curl -fsSL -o "$TOOLS_CACHE/$1" "$2"
            echo "$3  $TOOLS_CACHE/$1" | sha256sum -c -
          fi
        }
        fetch_verified kubeconform.tar.gz "$KC_URL" "$KUBECONFORM_SHA256"
        tar xzf "$TOOLS_CACHE/kubeconform.tar.gz" -C "$TOOLS_BIN" kubeconform
        fetch_verified kustomize.tar.gz "$KZ_URL" "$KUSTOMIZE_SHA256"
        tar xzf "$TOOLS_CACHE/kustomize.tar.gz" -C "$TOOLS_BIN" kustomize
        fetch_verified helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" "$HELM_SHA256"
        tar xzf "$TOOLS_CACHE/helm.tar.gz" -C "$TOOLS_BIN" --strip-components=1 linux-amd64/helm
        kubeconform -v && kustomize version && helm version --short && envsubst --version | head -1
      else
        # --- NON-ROOT path (shared tenant runner). No apt, no /usr/local/bin:
        # download with Python stdlib, verify sha256, extract into a workspace
        # bin on PATH. before_script + script share one shell, so PATH carries. ---
        export TOOLS_BIN="$CI_PROJECT_DIR/.bin"
        mkdir -p "$TOOLS_BIN"
        fetch_verified() { # <file> <url> <sha256>
          python -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$2" "/tmp/$1"
          echo "$3  /tmp/$1" | sha256sum -c -
        }
        fetch_verified kubeconform.tar.gz "$KC_URL" "$KUBECONFORM_SHA256"
        tar xzf /tmp/kubeconform.tar.gz -C "$TOOLS_BIN" kubeconform
        fetch_verified kustomize.tar.gz "$KZ_URL" "$KUSTOMIZE_SHA256"
        tar xzf /tmp/kustomize.tar.gz -C "$TOOLS_BIN" kustomize
        export PATH="$TOOLS_BIN:$PATH"
        kubeconform -v && kustomize version
      fi
  script:
    - |
      set -eo pipefail
      FAILED=0
      CATALOG="https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_REF}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

      if [ "$SUBSTITUTE" != "true" ]; then
        # Simple mode (tenant): render one literal-pinned path, validate it.
        # .bin is prepended only here; in substitute mode the verified tools
        # live in /usr/local/bin and a repo-controlled .bin must not shadow them.
        export PATH="$CI_PROJECT_DIR/.bin:$PATH"
        # Held equal to ci/github/ci.example.yml's K8S_VERSION by
        # tests/test_pin_parity.py.
        K8S_VER="${K8S_VERSION_INPUT:-1.36.0}"
        echo "=== kustomize build $KUSTOMIZE_PATH ==="
        kustomize build "$KUSTOMIZE_PATH" > /tmp/rendered.yaml
        # CRITICAL: an emptied or mistyped `resources:` list renders nothing and
        # both tools exit 0 on it, while the cluster-side Kustomization's prune
        # then deletes every object this repo applied.
        if ! grep -q '^kind:' /tmp/rendered.yaml; then
          echo "ERROR: kustomize build $KUSTOMIZE_PATH rendered no document — check for an emptied or mistyped resources: list"
          exit 1
        fi
        echo "=== kubeconform (k8s $K8S_VER) ==="
        # -ignore-missing-schemas lets platform CRDs validate against the
        # datreeio catalog; core kinds validate against the bundled schemas.
        # 2>&1 because per-resource failures go to stderr.
        if ! SUMMARY=$(kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version "$K8S_VER" \
            -schema-location default \
            -schema-location "$CATALOG" \
            -summary /tmp/rendered.yaml 2>&1); then
          printf '%s\n' "$SUMMARY"
          exit 1
        fi
        printf '%s\n' "$SUMMARY"
        # CRITICAL: -ignore-missing-schemas exits 0 on a resource it could not
        # schema-validate, so an unreachable catalog degrades the run to core
        # kinds in silence. A summary with no Skipped: field is that signature.
        case "$ALLOWED_SKIPS" in
          ''|*[!0-9]*) echo "ERROR: allowed_skips must be a non-negative integer, got '$ALLOWED_SKIPS'"; exit 1 ;;
        esac
        SKIPPED=$(printf '%s\n' "$SUMMARY" | sed -n 's/.*Skipped: \([0-9][0-9]*\).*/\1/p')
        if [ -z "$SKIPPED" ] || [ "$SKIPPED" -gt "$ALLOWED_SKIPS" ]; then
          echo "ERROR: kubeconform validated ${SKIPPED:-?} resource(s) against no schema (allowed_skips=$ALLOWED_SKIPS)"
          echo "The catalog at $CRD_CATALOG_REF moved or was unreachable, or the kind has no published schema."
          echo "Add a -schema-location for it, or raise allowed_skips."
          exit 1
        fi
        exit 0
      fi

      [ -n "$CLUSTER_DIR" ] || { echo "ERROR: cluster_dir is required when substitute=true: name the dir of Flux Kustomizations to iterate"; exit 1; }

      # --- Substitute mode: mirror the kustomize-controller postBuild step,
      # then kubeconform every rendered top-level Kustomization. ---
      VARS=$(bash "$FLUX_RENDER_SCRIPT" export-versions "$VERSIONS_CONFIGMAP") \
        || { echo "ERROR: failed to extract version keys from $VERSIONS_CONFIGMAP"; exit 1; }
      eval "$VARS"

      RENDER_ALL=$(mktemp)
      export RENDER_ALL
      trap 'rm -f "$RENDER_ALL"' EXIT

      if [ -n "$K8S_VERSION_INPUT" ]; then
        K8S_VER="$K8S_VERSION_INPUT"
      else
        K8S_VER=$(bash "$FLUX_RENDER_SCRIPT" k8s-version "$VERSIONS_CONFIGMAP")
      fi
      export K8S_VER
      echo "kubeconform -kubernetes-version: $K8S_VER (from versions-configmap k3s_version)"

      for ks in "$CLUSTER_DIR"/*.yaml; do
        [ -f "$ks" ] || continue
        NAME=$(basename "$ks" .yaml)
        [ "$NAME" = "kustomization" ] && continue
        # A cluster dir also holds non-Kustomization documents (GitRepository,
        # Secret); only a Flux Kustomization has a spec.path to build, and the
        # apiVersion tells one apart from a kustomize.config kustomization.yaml.
        if ! META=$(python3 -c '
      import sys

      import yaml

      with open(sys.argv[1]) as f:
          docs = [d for d in yaml.safe_load_all(f) if isinstance(d, dict)]
      flux = [d for d in docs if d.get("kind") == "Kustomization"
              and str(d.get("apiVersion", "")).startswith("kustomize.toolkit")]
      if len(flux) > 1:
          sys.exit("%s holds %d Flux Kustomizations; give each one its own file"
                   % (sys.argv[1], len(flux)))
      if flux:
          doc, label = flux[0], "Kustomization"
      elif docs:
          doc = docs[0]
          label = "%s %s" % (doc.get("apiVersion") or "?", doc.get("kind") or "?")
      else:
          doc, label = {}, "empty document"
      print(label)
      print((doc.get("spec") or {}).get("path") or "")
      ' "$ks"); then
          echo "ERROR: failed to read $ks"
          FAILED=1
          continue
        fi
        KSKIND=$(printf '%s\n' "$META" | sed -n 1p)
        SRCPATH=$(printf '%s\n' "$META" | sed -n 2p)
        if [ "$KSKIND" != "Kustomization" ]; then
          echo "SKIP: $ks is a $KSKIND, not a Flux Kustomization"
          continue
        fi
        if [ -z "$SRCPATH" ]; then
          # Flux reconciles the repository root when spec.path is absent, which
          # this job cannot build; the path is required, not skipped.
          echo "ERROR: $ks is a Flux Kustomization with no spec.path: spell the path it reconciles"
          FAILED=1
          continue
        fi
        SRCPATH="${SRCPATH#./}"
        echo "=== Building + validating $ks (path $SRCPATH) ==="
        if ! RAW=$(kustomize build "$SRCPATH" 2>&1); then
          echo "ERROR: kustomize build failed for $SRCPATH:"
          printf '%s\n' "$RAW"
          FAILED=1
          continue
        fi
        # Rendered manifests are read with printf, never echo: a first line
        # beginning `-n` would be swallowed as an option. Flux's envsubst
        # parse-errors on a malformed `${` and eats `${1}` refs; `$${` escapes.
        MALFORMED=$(printf '%s\n' "$RAW" | sed 's/\$\$[{]/__FLUX_ESCAPED__/g' | grep -nE '\$\{[^A-Za-z_]' || true)
        if [ -n "$MALFORMED" ]; then
          echo "ERROR: $SRCPATH renders a \${ sequence Flux's envsubst mishandles (escape as \$\${ or assemble at runtime):"
          printf '%s\n' "$MALFORMED" | head -5 | sed 's/^/  /'
          FAILED=1
          continue
        fi
        MISSING=""
        # Strip Flux's `$${` escape first: an escaped sequence still contains
        # `${var}` textually, so without the strip an escaped Grafana panel var
        # false-positives as an unknown substitution key.
        for ref in $(printf '%s\n' "$RAW" | sed 's/\$\$[{]/__FLUX_ESCAPED__/g' | grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' | sort -u); do
          varname=${ref#\$\{}
          varname=${varname%\}}
          if [ -z "${!varname+x}" ]; then
            MISSING="$MISSING $varname"
          fi
        done
        MISSING=$(printf '%s\n' "$MISSING" | tr ' ' '\n' | grep -v '^$' | sort -u || true)
        if [ -n "$MISSING" ]; then
          echo "ERROR: placeholders in $SRCPATH reference keys not in versions-configmap:"
          printf '%s\n' "$MISSING" | sed 's/^/  - /'
          FAILED=1
          continue
        fi
        RENDERED=$(printf '%s\n' "$RAW" | envsubst "$FLUX_ENVSUBST_VARS")
        printf '%s\n---\n' "$RENDERED" >> "$RENDER_ALL"
        if ! printf '%s\n' "$RENDERED" | kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version "$K8S_VER" \
            -schema-location default \
            -schema-location "$CATALOG" \
            -summary; then
          FAILED=1
        fi
      done

      # A gate that inspects nothing is not a gate: every check below reads
      # $RENDER_ALL.
      if [ ! -s "$RENDER_ALL" ]; then
        echo "ERROR: no Kustomization under $CLUSTER_DIR rendered any manifest — check cluster_dir and each child's spec.path"
        FAILED=1
      fi

      # Which rendered kinds kubeconform could NOT schema-validate
      # (-ignore-missing-schemas skipped them). With expected_skipped_file set a
      # kind outside that baseline fails the job; without it, informational.
      echo "=== kubeconform unvalidated-kind tracking ==="
      SKIPPED_JSON=$(mktemp)
      kubeconform -verbose -ignore-missing-schemas -kubernetes-version "$K8S_VER" \
        -schema-location default \
        -schema-location "$CATALOG" \
        -output json < "$RENDER_ALL" > "$SKIPPED_JSON" || true
      if [ -n "$EXPECTED_SKIPPED_FILE" ]; then
        python3 "$SKIPPED_SCRIPT" "$EXPECTED_SKIPPED_FILE" < "$SKIPPED_JSON" || FAILED=1
      else
        python3 "$SKIPPED_SCRIPT" < "$SKIPPED_JSON" || true
      fi
      rm -f "$SKIPPED_JSON"

      # Build the cluster root to catch a malformed top-level kustomization.
      # Both gotk files absent is the pre-bootstrap state and skips. `-e || -L`,
      # not `-f`, so a dangling symlink cannot read as pre-bootstrap.
      gotk_components="$CLUSTER_DIR/flux-system/gotk-components.yaml"
      gotk_sync="$CLUSTER_DIR/flux-system/gotk-sync.yaml"
      # CRITICAL: check the shape of the tree first, independent of bootstrap
      # state. The -L tests below inspect only each path's final component, so
      # containment is asserted on the resolved path too. Otherwise an
      # intermediate symlink hands kustomize a tree outside the repo.
      repo_root=$(pwd -P)
      cluster_real=$(readlink -f "$CLUSTER_DIR" 2>/dev/null || echo "")
      case "${cluster_real:-/nonexistent}/" in
        "$repo_root"/*) cluster_contained=1 ;;
        *) cluster_contained=0 ;;
      esac
      if [ "$cluster_contained" != "1" ]; then
        echo "ERROR: $CLUSTER_DIR resolves to ${cluster_real:-nothing}, which is outside the repository at $repo_root (symlinked path component?)"
        FAILED=1
      elif [ ! -d "$CLUSTER_DIR" ] || [ -L "$CLUSTER_DIR" ] \
        || [ ! -d "$CLUSTER_DIR/flux-system" ] \
        || [ -L "$CLUSTER_DIR/flux-system" ] \
        || [ ! -f "$CLUSTER_DIR/kustomization.yaml" ] \
        || [ -L "$CLUSTER_DIR/kustomization.yaml" ] \
        || [ ! -f "$CLUSTER_DIR/flux-system/kustomization.yaml" ] \
        || [ -L "$CLUSTER_DIR/flux-system/kustomization.yaml" ]; then
        echo "ERROR: $CLUSTER_DIR and its flux-system/ must be real directories, and both hand-authored kustomization.yaml files must be regular files (not symlinks)"
        FAILED=1
      elif [ -e "$gotk_components" ] || [ -L "$gotk_components" ] \
        || [ -e "$gotk_sync" ] || [ -L "$gotk_sync" ] \
        || [ "$REQUIRE_CLUSTER_ROOT" = "true" ]; then
        echo "=== Building cluster root $CLUSTER_DIR ==="
        if ! kustomize build "$CLUSTER_DIR" >/dev/null; then
          echo "ERROR: cluster root kustomization failed to build"
          # Name the one cause the consumer cannot deduce: a repo that has never
          # been bootstrapped has no gotk files for its kustomization to resolve,
          # and the fix is an input, not a code change.
          if [ ! -e "$gotk_components" ] && [ ! -L "$gotk_components" ] \
            && [ ! -e "$gotk_sync" ] && [ ! -L "$gotk_sync" ]; then
            echo "HINT: neither flux-system/gotk-components.yaml nor gotk-sync.yaml exists, so this repo has not been bootstrapped yet."
            echo "HINT: pass require_cluster_root: false to this template until \`flux bootstrap\` has run."
          fi
          FAILED=1
        fi
      else
        echo "=== Skipping cluster root $CLUSTER_DIR: neither flux-system/gotk-components.yaml nor gotk-sync.yaml exists (flux bootstrap writes both); set require_cluster_root: true to build anyway ==="
      fi

      # Consumer-injected extra validation (e.g. an HPA/VPA invariant or a
      # helm-values check). Runs with $RENDER_ALL / $K8S_VER / $FAILED in
      # scope; no-op by default, and references consumer-local scripts.
      $[[ inputs.extra_validation ]]

      exit $FAILED
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
