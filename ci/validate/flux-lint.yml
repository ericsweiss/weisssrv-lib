spec:
  inputs:
    job_name:
      default: flux-lint
    stage:
      default: lint
    image:
      default: python:3.14-slim
      description: >-
        Job image. Must ship BASH and python: the scripts use `set -o pipefail`
        and `${!var+x}` indirect expansion, so an Alpine base (ash) fails in
        before_script. The root path additionally needs apt.
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    substitute:
      type: boolean
      default: true
      description: >-
        true (cluster repo): extract postBuild vars from a cluster-versions
        ConfigMap, envsubst every rendered Kustomization, iterate the cluster
        dir. Needs a ROOT runner (apt install gettext-base). false (tenant):
        render one literal-pinned path and kubeconform it — non-root safe,
        stdlib-only tool download.
    kubeconform_version:
      default: "0.8.0"
      description: >-
        Held equal to scripts/ci-fetch-tools.py's pin by
        tests/test_pin_parity.py, so one bump moves every path that installs
        the binary. This job keeps its own version/sha inputs rather than
        calling that script: dropping them is a MAJOR input change.
    kubeconform_sha256:
      default: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
    kustomize_version:
      default: "5.8.2"
      description: >-
        Held equal to scripts/ci-fetch-tools.py's pin by
        tests/test_pin_parity.py, like kubeconform_version above.
    kustomize_sha256:
      default: "06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95"
    helm_version:
      default: "3.22.0"
      description: Only installed in substitute mode (schema-validating HelmRelease values).
    helm_sha256:
      default: "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb"
    flux_version:
      default: "2.9.0"
      description: >-
        (substitute=true) flux CLI whose `envsubst --strict` is the authority on
        what kustomize-controller's post-build accepts. Held equal to the
        versions ConfigMap's `flux_version` by the job itself, which fails on a
        mismatch: the parser must be the release the cluster runs. A ConfigMap
        declaring no `flux_version` gets a printed note instead.
    flux_sha256:
      default: "7aa9779fc7ec6d030e609dab7dbed8c6fc9e3a7f4670834ad02369268aaf341f"
      description: sha256 of the flux_version linux-amd64 tarball; moves with it.
    pyyaml_version:
      default: "6.0.2"
      description: >-
        (substitute=true) pinned PyYAML for flux-lint.sh's ConfigMap and
        spec.path parsers. An unpinned floating install would let a breaking
        release change the job's behaviour between runs.
    k8s_version:
      default: ""
      description: >-
        kubeconform target k8s version. Empty in substitute mode derives it from
        the ConfigMap's k3s_version; tenants pass a literal (e.g. "1.36.0").
    kustomize_path:
      default: "kubernetes/flux"
      description: >-
        (substitute=false) the ONE directory the simple arm builds. The default
        is the tenant layout the app template renders; a repo laid out
        differently passes the path it actually reconciles, or the gate
        validates a tree it does not own.
    allowed_skips:
      default: "0"
      description: >-
        (substitute=false) how many rendered resources kubeconform may validate
        against NO schema. Above it the job fails, and so does a summary with no
        `Skipped:` field at all, which is what an unreachable catalog looks
        like. Raise it per kind the catalog does not carry. Substitute mode uses
        expected_skipped_file instead.
    cluster_dir:
      default: ""
      description: >-
        (substitute=true) dir of Flux Kustomizations to iterate. REQUIRED in
        substitute mode, which fails when it is empty; a cluster name is site
        data, so there is no real default. The simple arm never reads it.
    require_cluster_root:
      type: boolean
      default: true
      description: >-
        (substitute=true) true (default): always build the cluster root, so a
        bootstrapped consumer that loses its flux-system content fails instead
        of silently passing. false: skip the build while BOTH
        $CLUSTER_DIR/flux-system/gotk-components.yaml and gotk-sync.yaml are
        absent — the genuine pre-bootstrap state. A repo that has never run
        `flux bootstrap` MUST pass false or its first pipeline fails for a
        reason it cannot fix; the job's failure message says so.
    versions_configmap:
      default: "kubernetes/infrastructure/sources/versions-configmap.yaml"
      description: (substitute=true) the cluster-versions ConfigMap.
    flux_lint_script:
      default: "scripts/flux-lint.sh"
      description: >-
        Repo-local copy of the render/scan/kubeconform program (weisssrv-lib
        scripts/flux-lint.sh), which this job runs instead of carrying its own.
        A consumer's `flux:lint` task runs the same file, so the strict render
        and every floor below reach local lint and CI together.
    flux_render_script:
      default: "scripts/flux-render.sh"
      description: (substitute=true) repo-local copy of the shared render helper.
    skipped_script:
      default: "scripts/kubeconform-skipped.py"
      description: (substitute=true) repo-local copy of the unvalidated-kind tracker.
    crd_catalog_ref:
      default: "ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2"
      description: >-
        Ref of datreeio/CRDs-catalog the kubeconform schema location resolves
        against. Pinned to a commit sha so a catalog rewrite cannot change what
        a gate accepts; point it at an internal mirror ref to self-host.
    expected_skipped_file:
      default: ""
      description: >-
        (substitute=true) repo-local baseline of apiVersion/Kind pairs known to
        have no schema in the catalog, one per line. Set it and a kind skipped
        outside the baseline FAILS the job, so an unreachable catalog can no
        longer degrade the run to core-kinds-only in silence. Empty (the
        default) keeps the tracker informational.
    extra_validation:
      default: ""
      description: >-
        (substitute=true) extra shell injected after flux-lint.sh, with
        $RENDER_ALL / $K8S_VER / $FAILED and the ConfigMap exports in scope.
        The supported shape is a
        consumer gate chain listed in scripts/render-gates.conf and run by
        scripts/run-render-gates.sh, so the value stays one line:
        `bash scripts/run-render-gates.sh --flux-env scripts/flux-env.sh`. The
        runner honours the same RENDER_ALL / VERSIONS_CONFIGMAP contract and
        exits non-zero on a failing gate. Any other shell still works.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    changes:
      type: array
      default:
        - "kubernetes/**/*"
        - "ansible/inventories/prod/group_vars/all.yml"
      description: >-
        Path list for the MR / default-branch `changes:` rules. The second entry
        is the inventory file a substitute-mode consumer generates its
        versions-configmap from; drop it when versions live elsewhere.
    job_memory_limit:
      default: "2Gi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Sizing policy:
        docs/INCLUDE-CONTRACT.md § Resource inputs.
    job_memory_request:
      default: "512Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
    job_cpu_request:
      default: "300m"
      description: >-
        KUBERNETES_CPU_REQUEST for the job pod (scheduler reservation). Sizing
        policy: docs/INCLUDE-CONTRACT.md § Resource inputs.
---
"$[[ inputs.job_name ]]":
  needs: []
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  # Cache the pinned lint binaries across runs (substitute mode), keyed on the
  # consumer's .gitlab-ci.yml (where the version inputs live) so a bump busts it.
  # No-op without a runner cache backend.
  cache:
    key:
      prefix: flux-lint
      files:
        - .gitlab-ci.yml
    paths:
      - .cache/flux-lint-tools
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
    KUBERNETES_CPU_REQUEST: $[[ inputs.job_cpu_request ]]
    SUBSTITUTE: "$[[ inputs.substitute ]]"
    KUBECONFORM_VERSION: "$[[ inputs.kubeconform_version ]]"
    KUBECONFORM_SHA256: "$[[ inputs.kubeconform_sha256 ]]"
    KUSTOMIZE_VERSION: "$[[ inputs.kustomize_version ]]"
    KUSTOMIZE_SHA256: "$[[ inputs.kustomize_sha256 ]]"
    HELM_VERSION: "$[[ inputs.helm_version ]]"
    HELM_SHA256: "$[[ inputs.helm_sha256 ]]"
    FLUX_VERSION: "$[[ inputs.flux_version ]]"
    FLUX_SHA256: "$[[ inputs.flux_sha256 ]]"
    PYYAML_VERSION: "$[[ inputs.pyyaml_version ]]"
    K8S_VERSION_INPUT: "$[[ inputs.k8s_version ]]"
    KUSTOMIZE_PATH: "$[[ inputs.kustomize_path ]]"
    ALLOWED_SKIPS: "$[[ inputs.allowed_skips ]]"
    CLUSTER_DIR: "$[[ inputs.cluster_dir ]]"
    REQUIRE_CLUSTER_ROOT: "$[[ inputs.require_cluster_root ]]"
    VERSIONS_CONFIGMAP: "$[[ inputs.versions_configmap ]]"
    FLUX_LINT_SCRIPT: "$[[ inputs.flux_lint_script ]]"
    FLUX_RENDER_SCRIPT: "$[[ inputs.flux_render_script ]]"
    SKIPPED_SCRIPT: "$[[ inputs.skipped_script ]]"
    CRD_CATALOG_REF: "$[[ inputs.crd_catalog_ref ]]"
    EXPECTED_SKIPPED_FILE: "$[[ inputs.expected_skipped_file ]]"
  before_script:
    - |
      set -eo pipefail
      KC_URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
      KZ_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
      if [ "$SUBSTITUTE" = "true" ]; then
        # ROOT path (privileged runner): apt, /usr/local/bin and a verified
        # tarball cache. Every run re-checks each tarball against its pinned
        # sha256 and re-extracts.
        apt-get update -qq && apt-get install -y -qq curl gettext-base
        # `--user` like every other template: the user site dir is on sys.path,
        # so the inline parser imports it without a PATH change.
        pip install --user --quiet "pyyaml==$PYYAML_VERSION"
        TOOLS_CACHE="${CI_PROJECT_DIR}/.cache/flux-lint-tools"
        TOOLS_BIN=/usr/local/bin
        mkdir -p "$TOOLS_CACHE"
        fetch_verified() { # <file> <url> <sha256>
          if ! echo "$3  $TOOLS_CACHE/$1" | sha256sum -c - >/dev/null 2>&1; then
            curl -fsSL -o "$TOOLS_CACHE/$1" "$2"
            echo "$3  $TOOLS_CACHE/$1" | sha256sum -c -
          fi
        }
        fetch_verified kubeconform.tar.gz "$KC_URL" "$KUBECONFORM_SHA256"
        tar xzf "$TOOLS_CACHE/kubeconform.tar.gz" -C "$TOOLS_BIN" kubeconform
        fetch_verified kustomize.tar.gz "$KZ_URL" "$KUSTOMIZE_SHA256"
        tar xzf "$TOOLS_CACHE/kustomize.tar.gz" -C "$TOOLS_BIN" kustomize
        fetch_verified helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" "$HELM_SHA256"
        tar xzf "$TOOLS_CACHE/helm.tar.gz" -C "$TOOLS_BIN" --strip-components=1 linux-amd64/helm
        FLUX_URL="https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
        fetch_verified flux.tar.gz "$FLUX_URL" "$FLUX_SHA256"
        tar xzf "$TOOLS_CACHE/flux.tar.gz" -C "$TOOLS_BIN" flux
        kubeconform -v && kustomize version && helm version --short && flux --version \
          && envsubst --version | head -1
      else
        # --- NON-ROOT path (shared tenant runner). No apt, no /usr/local/bin:
        # download with Python stdlib, verify sha256, extract into a workspace
        # bin on PATH. before_script + script share one shell, so PATH carries. ---
        export TOOLS_BIN="$CI_PROJECT_DIR/.bin"
        mkdir -p "$TOOLS_BIN"
        fetch_verified() { # <file> <url> <sha256>
          python -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$2" "/tmp/$1"
          echo "$3  /tmp/$1" | sha256sum -c -
        }
        fetch_verified kubeconform.tar.gz "$KC_URL" "$KUBECONFORM_SHA256"
        tar xzf /tmp/kubeconform.tar.gz -C "$TOOLS_BIN" kubeconform
        fetch_verified kustomize.tar.gz "$KZ_URL" "$KUSTOMIZE_SHA256"
        tar xzf /tmp/kustomize.tar.gz -C "$TOOLS_BIN" kustomize
        export PATH="$TOOLS_BIN:$PATH"
        kubeconform -v && kustomize version
      fi
  script:
    - |
      set -eo pipefail
      FAILED=0
      [ -f "$FLUX_LINT_SCRIPT" ] || { echo "ERROR: $FLUX_LINT_SCRIPT not found — vendor weisssrv-lib's scripts/flux-lint.sh (scripts/vendorable-paths.yml)"; exit 1; }

      if [ "$SUBSTITUTE" != "true" ]; then
        # Simple mode (tenant): render one literal-pinned path, validate it.
        # .bin is prepended only here; in substitute mode the verified tools
        # live in /usr/local/bin and a repo-controlled .bin must not shadow them.
        export PATH="$CI_PROJECT_DIR/.bin:$PATH"
        # The script's own 1.36.0 floor is held equal to
        # ci/github/ci.example.yml's K8S_VERSION by tests/test_pin_parity.py.
        bash "$FLUX_LINT_SCRIPT" --mode simple \
          --kustomize-path "$KUSTOMIZE_PATH" \
          --allowed-skips "$ALLOWED_SKIPS" \
          --k8s-version "$K8S_VERSION_INPUT" \
          --crd-catalog-ref "$CRD_CATALOG_REF"
        exit $?
      fi

      [ -n "$CLUSTER_DIR" ] || { echo "ERROR: cluster_dir is required when substitute=true: name the dir of Flux Kustomizations to iterate"; exit 1; }

      # extra_validation runs in THIS shell, so the corpus, the schema version
      # and the ConfigMap exports are job variables rather than the script's.
      VARS=$(bash "$FLUX_RENDER_SCRIPT" export-versions "$VERSIONS_CONFIGMAP") \
        || { echo "ERROR: failed to extract version keys from $VERSIONS_CONFIGMAP"; exit 1; }
      eval "$VARS"
      K8S_VER="$K8S_VERSION_INPUT"
      [ -n "$K8S_VER" ] || K8S_VER=$(bash "$FLUX_RENDER_SCRIPT" k8s-version "$VERSIONS_CONFIGMAP")
      export K8S_VER
      RENDER_ALL=$(mktemp)
      export RENDER_ALL
      trap 'rm -f "$RENDER_ALL"' EXIT

      bash "$FLUX_LINT_SCRIPT" \
        --cluster-dir "$CLUSTER_DIR" \
        --versions-configmap "$VERSIONS_CONFIGMAP" \
        --render-script "$FLUX_RENDER_SCRIPT" \
        --skipped-script "$SKIPPED_SCRIPT" \
        --expected-skipped "$EXPECTED_SKIPPED_FILE" \
        --require-cluster-root "$REQUIRE_CLUSTER_ROOT" \
        --k8s-version "$K8S_VERSION_INPUT" \
        --crd-catalog-ref "$CRD_CATALOG_REF" \
        --render-all "$RENDER_ALL" || FAILED=1

      # Consumer-injected extra validation (e.g. an HPA/VPA invariant or a
      # helm-values check). Runs with $RENDER_ALL / $K8S_VER / $FAILED in
      # scope; no-op by default, and references consumer-local scripts.
      $[[ inputs.extra_validation ]]

      exit $FAILED
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
