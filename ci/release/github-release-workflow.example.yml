---
# Canonical copy in weisssrv-lib; vendored byte-identically as
# .github/workflows/release.yml. Runs scripts/semantic-release.py on `ci`
# completing, so no tag is cut for a commit whose gates fail.
name: release

# CRITICAL: no workflow_dispatch. A dispatch runs the workflow definition from
# the selected ref, so a branch that deletes the `if:` guard below runs its own
# code with contents:write. To re-run, use GitHub's "Re-run jobs" on the
# previous run, which replays the original workflow_run payload.

# `on` is quoted because unquoted it is a YAML 1.1 boolean; GitHub reads both
# the same.
"on":
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Creating a tag and a Release needs write; nothing else here does.
permissions:
  contents: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Release only from a same-repo push whose ci run succeeded: a fork PR's ci
    # run also matches branches:[main], and this job holds contents:write.
    # Never relax these. Rationale: docs/CI-SHAPES.md (app template).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # Job-scoped, never cancelled: releases serialise, and job scope keeps runs
    # the `if` above skips from evicting a queued eligible run.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # The commit ci.yml actually tested. No `|| github.sha` fallback:
          # that would release the default-branch tip instead of the commit the
          # gates passed on.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history AND tags: the plan is computed from `<last tag>..HEAD`,
          # and the crash-recovery probe needs to see the previous tag at all.
          fetch-depth: 0

      - name: Cut the release
        env:
          # The script reads $GITHUB_TOKEN (override with --token-env). Swap in
          # a fine-grained PAT if a tag-protection rule refuses the built-in
          # token, or if the new tag must trigger other workflows.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          # The branch ci.yml actually ran on. NOT $GITHUB_REF_NAME, which on a
          # workflow_run event is the default branch at trigger time.
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        # The SHA reaches the command through the environment rather than `${{ }}`
        # interpolation — the standing rule for any expression value that lands
        # on a shell line. python3 and git ship in the runner image.
        run: |
          set -euo pipefail

          # Skip a run a later release has overtaken. The concurrency group
          # serialises runs but does not order them; a tag on the release branch
          # this commit cannot reach is exactly that condition.
          git fetch --quiet origin \
            "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
            "refs/tags/*:refs/tags/*"
          newer="$(
            git tag --list --merged "refs/remotes/origin/${RELEASE_BRANCH}" \
                            --no-merged HEAD |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true
          )"
          if [ -n "$newer" ]; then
            echo "Superseded: $newer is already released and is not reachable"
            echo "from this run's commit. Nothing to do."
            exit 0
          fi

          python3 scripts/semantic-release.py \
            --platform github \
            --ref "$RELEASE_SHA" \
            --output release.json

      - name: Publish the outcome
        # `when: always` — a failed run's release.json carries the reason, and
        # that is exactly the run whose artifact someone needs.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-json
          path: release.json
          retention-days: 30
          # A run that ended before the script wrote anything is not an error.
          if-no-files-found: ignore
