---
# Canonical copy: weisssrv-lib `ci/release/github-release-workflow.example.yml`.
# Consumers vendor it byte-identically as `.github/workflows/release.yml` — edit
# it upstream, then re-vendor; a library test compares the two copies. Vendoring
# rather than `uses:` is forced: GitHub has no equivalent of GitLab's
# `include: project:` for a private library.
#
# It is the GitHub Actions counterpart of the library's
# `ci/release/semantic-release.yml` and runs `scripts/semantic-release.py` with
# `--platform github` — the same script that job runs, vendored into every
# consumer. The job-for-job parity table is in docs/CI-SHAPES.md (app template).
#
# What it reproduces from the GitLab job:
#   - runs only on the release branch, never on a schedule;
#   - runs only AFTER the gates pass (GitLab gets this from `stage: release`
#     being last; Actions needs `workflow_run` — see ordering below);
#   - serialises rapid merges (`concurrency`, GitLab's `resource_group`);
#   - full history + tags, so `<last tag>..HEAD` resolves (GitLab's GIT_DEPTH 0);
#   - publishes release.json unconditionally (GitLab's `artifacts: when:always`).
#
# Ordering: this triggers on `ci` COMPLETING successfully rather than on
# `push: main`, so a tag is never cut for a commit whose gates then fail. That
# makes `ci` the aggregate gate and nothing else — a sibling workflow
# (build-image.yml) can still be running or already red when the tag is cut, so
# put anything that must gate the release inside ci.yml as a job. `workflow_run`
# reports `github.sha` as the default-branch tip at trigger time, not the commit
# that was tested, which is why `head_sha` is used in both the checkout and
# `--ref`. If you would rather not reason about that, delete this file and
# append the same step to ci.yml as a job gated on the other jobs and on
# `github.event_name == 'push' && github.ref == 'refs/heads/main'`.
name: release

# No workflow_dispatch. A dispatch runs the workflow definition FROM THE
# SELECTED REF, so any `if:` guard here is one the caller chose — a branch that
# deletes the guard runs its own code with contents:write, past branch
# protection. A `github.ref == main` guard does not help: a dispatch evaluates
# the SELECTED ref's copy of the condition, never main's.
#
# Recovery the script's crash message asks for ("if <tag> is missing its
# Release, re-run this job") is GitHub's "Re-run jobs" on the previous run,
# which replays the original trusted workflow_run payload.
#
# Quoted: unquoted `on` is a YAML 1.1 boolean, which yamllint's truthy rule
# flags. GitHub reads the quoted key identically.
"on":
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Creating a tag and a Release needs write; nothing else here does.
permissions:
  contents: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Three conditions, and the last two are the security ones.
    #
    # `conclusion == success`: workflow_run fires for FAILED runs too, and
    # releasing from one would defeat the ordering above.
    #
    # `event == push` and `head_repository == repository`: workflow_run also
    # fires for ci.yml runs triggered by a FORK's pull_request, and its
    # `branches: [main]` filter matches the FORK's branch name — so a fork whose
    # head branch is called `main` reaches this job. This job then checks out
    # that commit and executes scripts/semantic-release.py from it while holding
    # a contents:write token, which hands the fork the token and the repository.
    # Requiring a same-repo push means only code that already had write access
    # can run here. Do not relax these to "fix" a release that did not fire —
    # a release must never be cut from an untrusted checkout.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # Never cancel a release mid-flight: two merges landing together must compute
    # and cut their tags one after the other, not race. This is the GitLab job's
    # `resource_group`, and it is why cancel-in-progress is false rather than
    # absent.
    #
    # Scoped to the JOB, not the workflow, and the difference is load-bearing.
    # At workflow scope every triggered run joins the group — including the runs
    # whose `if` above will skip them. GitHub keeps only the most recent PENDING
    # run per group, so a later FAILED-ci run evicts a queued SUCCESSFUL-ci run
    # and then skips its own job, and the good commit is never released. Nothing
    # reports that: both runs end green-or-skipped. At job scope the `if` is
    # evaluated first, so ineligible runs never occupy the queue at all.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # The commit ci.yml actually tested (see "ordering" above). No
          # `|| github.sha` fallback: workflow_run is now the only trigger, so
          # head_sha is always set, and falling back would quietly release the
          # default-branch tip instead of the commit the gates passed on.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history AND tags: the plan is computed from `<last tag>..HEAD`,
          # and the crash-recovery probe needs to see the previous tag at all.
          fetch-depth: 0

      - name: Cut the release
        env:
          # GITHUB_REPOSITORY / GITHUB_API_URL / GITHUB_SERVER_URL are injected
          # already; the token is not, and the script reads $GITHUB_TOKEN by
          # default (override the name with --token-env).
          #
          # The built-in token suffices. Swap in a PAT (fine-grained: Contents
          # write) if a tag-protection rule refuses it, or if you need the new
          # tag to trigger OTHER workflows — events raised by GITHUB_TOKEN
          # deliberately do not start workflow runs, so an `on: release` or
          # `on: push: tags:` workflow will not fire for this release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          # The branch ci.yml actually ran on. NOT $GITHUB_REF_NAME: on a
          # workflow_run event that is the DEFAULT branch at trigger time, which
          # is only accidentally the same thing whenever the release branch and
          # the default branch differ.
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        # The SHA reaches the command through the environment rather than `${{ }}`
        # interpolation — the standing rule for any expression value that lands
        # on a shell line. python3 and git ship in the runner image.
        run: |
          set -euo pipefail

          # Skip a run that a later release has already overtaken.
          #
          # The concurrency group serialises these, but it does not ORDER them:
          # a run queued behind another can still execute after a newer commit
          # has been released. semantic-release.py selects the newest tag
          # REACHABLE FROM HEAD, so from this stale checkout the newer tag is
          # invisible — it is a descendant, not an ancestor — and the run would
          # compute a version that already exists and fail creating it, or worse
          # re-cut an older line.
          #
          # A tag on the release branch that this commit cannot reach is exactly
          # that condition, so ask git for one.
          git fetch --quiet origin \
            "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
            "refs/tags/*:refs/tags/*"
          newer="$(
            git tag --list --merged "refs/remotes/origin/${RELEASE_BRANCH}" \
                            --no-merged HEAD |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true
          )"
          if [ -n "$newer" ]; then
            echo "Superseded: $newer is already released and is not reachable"
            echo "from this run's commit. Nothing to do."
            exit 0
          fi

          python3 scripts/semantic-release.py \
            --platform github \
            --ref "$RELEASE_SHA" \
            --output release.json

      - name: Publish the outcome
        # `when: always` — a failed run's release.json carries the reason, and
        # that is exactly the run whose artifact someone needs.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-json
          path: release.json
          retention-days: 30
          # A run that ended before the script wrote anything is not an error.
          if-no-files-found: ignore
