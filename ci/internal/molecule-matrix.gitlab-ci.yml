spec:
  inputs:
    plan_job_name:
      default: molecule-plan
      description: Job that generates the child pipeline YAML.
    trigger_job_name:
      default: molecule-trigger
      description: Bridge job that runs the generated child pipeline.
    stage:
      default: test
      description: Pipeline stage both jobs run in.
    tags:
      type: array
      default: []
      description: >-
        Runner tag(s) for the plan job only. The trigger is a bridge with no
        runner, and the child's jobs take their tags from `jobs_include`. The
        plan job is non-root safe, so it runs on a tag-less runner.
    image:
      default: python:3.14
      description: >-
        Plan-job image. The FULL python image (not -slim) ships git, which the
        MR diff needs — so no apt, and the job stays non-root safe.
    pyyaml_version:
      default: "6.0.3"
      description: PyYAML pip pin for the generator.
    generator:
      default: scripts/generate-molecule-pipeline.py
      description: Path to the generator in the consuming checkout.
    roles_dir:
      default: ansible_collections/weisssrv/infra/roles
      description: >-
        Repo-relative roles dir ($ROLES_DIR). The generator derives its
        collection-root full-matrix triggers (requirements.yml, galaxy.yml,
        meta/, plugins/, molecule-shared/) from its parent. Retargeting it needs
        a matching `changes` edit, which is a static default.
    ci_file:
      default: .gitlab-ci.yml
      description: >-
        Repo-relative file holding the `molecule-tests` parallel:matrix, the
        scenario universe the child is narrowed from.
    jobs_include:
      default: .gitlab/ci/molecule-jobs.gitlab-ci.yml
      description: >-
        Repo-relative file the generated child `include: local:`s for the
        `.molecule-test-job` template. Must be self-contained (a child pipeline
        includes ONLY this file) and must NOT also define the static matrix,
        which the child would then collide with.
    child_file:
      default: molecule-child.yml
      description: Artifact the plan writes and the trigger runs.
    ci_image_job:
      default: build-molecule-ci
      description: >-
        Image-build job whose dotenv digest pin the trigger forwards, so the
        child resolves the exact rebuilt job image instead of a racy `:latest`.
    digest_var:
      default: MOLECULE_CI_IMAGE
      description: >-
        Variable `ci_image_job` writes its digest to (its `digest_dotenv_var`).
        The trigger re-declares it as a yaml variable — dotenv values are not
        forwarded to a child pipeline on their own.
    test_image_job:
      default: build-molecule-test
      description: >-
        Image-build job the trigger waits on when the test image changed, so the
        child's SHA-tag pull cannot race the push.
    changes:
      type: array
      default:
        - "ansible_collections/weisssrv/infra/**/*"
        - "docker/molecule-ci/**/*"
        - "docker/molecule-test/**/*"
        - "scripts/molecule-retry.sh"
        - "scripts/generate-molecule-pipeline.py"
        - "scripts/sanitize-junit-expected-failures.py"
        - ".gitlab/ci/molecule-jobs.gitlab-ci.yml"
        - ".gitlab-ci.yml"
      description: >-
        Union of every path that can affect a scenario. Keep `ci_file` in this
        list — it defines the matrix. RETARGET THIS ALONGSIDE `roles_dir`: a
        spec default is static, so unlike the generator's global triggers the
        role-tree entry here does not follow `roles_dir`, and a `roles_dir`
        override that leaves this at the default gates the plan job on a path
        the repo no longer has — no plan, no child, zero molecule coverage, and
        nothing red. While `ci_file` is `.gitlab-ci.yml`, any CI edit costs a
        full fan-out; moving the matrix to a small dedicated file and pointing
        `ci_file` at it is what buys that back.
---
# MR-targeted molecule child pipeline: runs only the scenarios the diff affects
# (role dirs and their transitive dependents; an unknown role dir fails loudly).
# MR-only; on main the static matrix from `ci_file` runs instead.
"$[[ inputs.plan_job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  needs: []
  interruptible: true
  variables:
    # Full clone: a shallow one may not contain the MR diff base.
    GIT_DEPTH: 0
    CI_FILE: $[[ inputs.ci_file ]]
    ROLES_DIR: $[[ inputs.roles_dir ]]
    MOLECULE_JOBS_INCLUDE: $[[ inputs.jobs_include ]]
  before_script:
    - pip install --user --quiet "pyyaml==$[[ inputs.pyyaml_version ]]"
  script:
    - python3 "$[[ inputs.generator ]]" "$CI_MERGE_REQUEST_DIFF_BASE_SHA" -o "$[[ inputs.child_file ]]"
    # Echo the plan: the child pipeline's job list is otherwise invisible in
    # this job's log, and it is the evidence for what a narrowed run covered.
    - cat "$[[ inputs.child_file ]]"
  artifacts:
    paths:
      - $[[ inputs.child_file ]]
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]

"$[[ inputs.trigger_job_name ]]":
  stage: $[[ inputs.stage ]]
  # No tags/image: a bridge job runs on no runner.
  needs:
    - job: $[[ inputs.plan_job_name ]]
    - job: $[[ inputs.ci_image_job ]]
      optional: true
      artifacts: true
    - job: $[[ inputs.test_image_job ]]
      optional: true
  variables:
    # Re-declare the image-job's dotenv value as a YAML variable: only
    # yaml_variables forward downstream, so without this the child falls back
    # to :latest and ignores the digest this pipeline built.
    $[[ inputs.digest_var ]]: $$[[ inputs.digest_var ]]
  trigger:
    include:
      - artifact: $[[ inputs.child_file ]]
        job: $[[ inputs.plan_job_name ]]
    # depend: a red child reds this pipeline, so the targeted tests gate the MR
    # exactly like the full matrix would.
    strategy: depend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
