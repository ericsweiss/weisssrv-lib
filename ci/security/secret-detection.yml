spec:
  inputs:
    stage:
      default: security
    tags:
      type: array
      default: ["infrastructure"]
      description: >-
        Runner tag(s). Default targets weisssrv's privileged runner; pass `[]`
        for the shared tag-less tenant runner. Set on the override job (an
        overriding job may add keys the managed template's job did not set).
    cpu_selector:
      default: "esweiss.com/cpu=modern"
      description: >-
        KUBERNETES_NODE_SELECTOR_CPU pin. gitleaks' binary needs POPCNT/SSE4.2
        and SIGILLs on older CPUs, so scans are pinned to modern-CPU nodes.
        Both the weisssrv privileged runner and the shared tenant runner
        allowlist this override (node_selector_overwrite_allowed ^esweiss\.com/
        cpu=(modern|legacy)$). Pass "" to drop the pin.
    historic_scan:
      default: "false"
      description: SECRET_DETECTION_HISTORIC_SCAN.
    allow_failure:
      type: boolean
      default: true
      description: >-
        Whether gitleaks findings only warn (true) or fail the job (false).
        Default true matches GitLab's managed template and weisssrv's current
        behavior — weisssrv relies on its local `validation-gate` needing this
        job non-optionally for the hard block. A tenant WITHOUT such a gate that
        wants findings to hard-block a merge (e.g. on a non-Ultimate tier where
        the security report isn't enforced) must pass `allow_failure: false`.
---
# Pulls in GitLab's managed Secret-Detection job (gitleaks under the hood), then
# overrides it. Tune gitleaks via a .gitleaks.toml referenced from
# .gitlab/secret-detection-ruleset.toml (both shipped in this library's lint/).
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: $[[ inputs.stage ]]
  tags: $[[ inputs.tags ]]
  needs: []  # run in parallel with lint/test stages
  allow_failure: $[[ inputs.allow_failure ]]
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "$[[ inputs.historic_scan ]]"
    KUBERNETES_NODE_SELECTOR_CPU: "$[[ inputs.cpu_selector ]]"
  # The bundled GitLab template gates its job on $CI_COMMIT_BRANCH, which is
  # UNSET in merge_request_event pipelines — so without this override the scan
  # runs ONLY post-merge on main. Override so the scan also runs pre-merge: MRs,
  # main, and scheduled scans (catch anything that snuck in via tag/branch
  # merges that didn't trigger a normal pipeline). Note: findings only warn
  # unless `allow_failure: false` is passed AND a gate needs this job (see the
  # allow_failure input) — the default is a warning surface, not a hard block.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
