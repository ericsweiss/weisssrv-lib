spec:
  inputs:
    stage:
      default: security
    tags:
      type: array
      default: ["infrastructure"]
      description: >-
        Runner tag(s). Default targets weisssrv's privileged runner; pass `[]`
        for the shared tag-less tenant runner. Set on the override job (an
        overriding job may add keys the managed template's job did not set).
    cpu_selector:
      description: >-
        REQUIRED — a node label is site data, so this template ships no default.
        KUBERNETES_NODE_SELECTOR_CPU pin: gitleaks needs POPCNT/SSE4.2 and
        SIGILLs on older CPUs, so scans are pinned to modern-CPU nodes. The
        value must satisfy the runner's `node_selector_overwrite_allowed`
        regex; `""` fails that regex and the job errors at pod creation. A
        runner that sets no regex ignores the variable entirely.
    historic_scan:
      default: "false"
      description: SECRET_DETECTION_HISTORIC_SCAN.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    allow_failure:
      type: boolean
      default: false
      description: >-
        Soft mode. `false` (default) = gitleaks findings FAIL the job, which is
        the only thing that actually blocks a merge: an `allow_failure: true`
        job counts as successful for a downstream `needs:`/gate, so a gate that
        needs this job does NOT hard-block on findings. `true` = advisory only
        (GitLab's managed-template behavior): the security report is still
        produced and the job is still red-flagged in the pipeline, but nothing
        blocks. Choose `true` only when findings are triaged out-of-band.
    job_memory_limit:
      default: "2Gi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Sizing policy:
        docs/INCLUDE-CONTRACT.md § Resource inputs.
    job_memory_request:
      default: "512Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
    job_cpu_request:
      default: "300m"
      description: >-
        KUBERNETES_CPU_REQUEST for the job pod (scheduler reservation). Sizing
        policy: docs/INCLUDE-CONTRACT.md § Resource inputs.
---
# Pulls in GitLab's managed Secret-Detection job (gitleaks) and overrides it.
# Tune gitleaks via .gitlab/secret-detection-ruleset.toml -> .gitleaks.toml.
# The managed analyzer moves with the instance, so it carries no `ref:` pin.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: $[[ inputs.stage ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  needs: []  # run in parallel with lint/test stages
  allow_failure: $[[ inputs.allow_failure ]]
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
    KUBERNETES_CPU_REQUEST: $[[ inputs.job_cpu_request ]]
    SECRET_DETECTION_HISTORIC_SCAN: "$[[ inputs.historic_scan ]]"
    KUBERNETES_NODE_SELECTOR_CPU: "$[[ inputs.cpu_selector ]]"
  # The bundled template gates on $CI_COMMIT_BRANCH, unset in MR pipelines, so
  # it would scan only post-merge. These rules add MRs, schedules, and `web` —
  # the source on which ci/build/docker-build.yml offers a manual build.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
