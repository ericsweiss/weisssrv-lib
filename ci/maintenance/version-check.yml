spec:
  inputs:
    job_name:
      default: version-check
    stage:
      default: lint
      description: >-
        Defaults to `lint` — this half is informational and runs alongside the
        MR lint jobs. Its bump-bot counterpart defaults to `maintenance`, so a
        consumer declaring stages needs both.
    image:
      default: python:3.14
    tags:
      type: array
      default: []
      description: >-
        Runner tag(s). Empty runs the job on a tag-less runner.
        A `setup_command` that installs with apt needs root.
    setup_command:
      default: 'true'
      description: >-
        Shell command run before the check, to install whatever `check_command`
        needs. The default is a no-op: the tools are a property of the checker,
        which this template cannot see. PIN what you install. The job is
        soft-fail, so a checker that stops importing after an upstream release
        reports nothing, and "no report" reads as "no updates".
    check_command:
      description: >-
        REQUIRED. Shell command that reports available updates and writes
        `report_path`. It may exit 1 to signal "updates found"; this job is
        soft-fail on every trigger, so that is reported rather than fatal.
    report_path:
      default: "version-report.json"
      description: "Artifact the check writes; published on every outcome."
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    soft_fail_exit_codes:
      type: array
      default: [1]
      description: >-
        Exit codes that do not redden the scheduled sweep or the default-branch
        run. `[1]` is "updates available" from the stock checker, so a checker
        error (rc=2) reds the job; `[1, 2]` soft-fails both. The web and
        merge-request runs are always soft-fail.
    changes:
      type: array
      default: ["**/*"]
      description: >-
        `changes:` filter for the merge-request rule; the default matches every
        merge request. NOT an empty list: `changes` is an OR over the paths it
        lists, so `[]` has nothing to match and the job is simply never created —
        a report that silently stops existing is worse than one that runs too
        often. Pass narrower paths to filter it.
---
# CRITICAL: no credential retrieval here. `setup_command` and `check_command`
# come from the ref under test, so on an MR they are the code under review and
# can read anything this job fetches.

# Reports available updates without changing anything; the rewriting half is
# ci/maintenance/version-bump-bot.yml. Soft-fails by default, so rc=1 ("updates
# available") does not redden a pipeline.
"$[[ inputs.job_name ]]":
  # Starts immediately rather than waiting out a build stage it has no
  # dependency on. Soft-fail everywhere, so an earlier start is free.
  needs: []
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  variables:
    REPORT_PATH: "$[[ inputs.report_path ]]"
  script:
    # Block scalars so a multi-line command works and no shell metacharacter in
    # the value can collide with YAML flow syntax.
    - |
      $[[ inputs.setup_command ]]
    - |
      $[[ inputs.check_command ]]
  artifacts:
    paths:
      - "$[[ inputs.report_path ]]"
    expire_in: 7 days
    when: always
  # Job-level, because only this form can name exit codes. A blanket
  # `allow_failure: true` would report a broken checker (rc=2) as "updates
  # available" (rc=1) on a weekly sweep nobody reads the log of.
  allow_failure:
    exit_codes: $[[ inputs.soft_fail_exit_codes ]]
  rules:
    # Scheduled: the weekly sweep, soft-failed per soft_fail_exit_codes.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Web: manual, and soft-fail on any exit.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    # Merge requests: informational for whoever is already reading the diff.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
      allow_failure: true
    # Default branch: informational, per soft_fail_exit_codes.
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
