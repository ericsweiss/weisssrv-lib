spec:
  inputs:
    job_name:
      default: version-check
    stage:
      default: lint
    image:
      default: python:3.11
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    setup_command:
      default: 'pip install --quiet pyyaml requests'
      description: >-
        Shell command run before the check (tool install). Pin versions here
        rather than floating — a checker that breaks on a new pyyaml reports
        "no updates available", which is the wrong answer delivered quietly.
    check_command:
      description: >-
        REQUIRED. Shell command that reports available updates and writes
        `report_path`. It may exit 1 to signal "updates found"; this job is
        soft-fail on every trigger, so that is reported rather than fatal.
    report_path:
      default: "version-report.json"
      description: "Artifact the check writes; published on every outcome."
    secret_token_command:
      default: ""
      description: >-
        Optional shell command exporting whatever credential the check needs to
        post its MR comment (e.g. an `op read` for a GitLab API token). Left
        empty the check still runs and still publishes its artifact — the
        comment is the part that degrades, not the report.
    changes:
      type: array
      default: ["**/*"]
      description: >-
        `changes:` filter for the merge-request rule; the default matches every
        merge request. NOT an empty list: `changes` is an OR over the paths it
        lists, so `[]` has nothing to match and the job is simply never created —
        a report that silently stops existing is worse than one that runs too
        often. Pass narrower paths to filter it.
---
# Reports dependency/pin updates that are available, WITHOUT changing anything.
#
# This is the read-only half of the pair. ci/maintenance/version-bump-bot.yml is
# the other half: a scheduled job that rewrites pins and raises the MR. A repo
# wants BOTH — this one so an MR author sees drift while they are already
# looking, the bot so drift gets acted on when nobody is looking.
#
# SOFT-FAIL ON EVERY TRIGGER, deliberately. "Updates are available" is rc=1 from
# most checkers, and that is information, not a defect: a scheduled or MR
# pipeline must not go red because upstream shipped a release. The artifact is
# published `when: always` so the report survives whatever the exit code was.
#
# `when: manual` on web pipelines needs its own `allow_failure: true`: a
# rules-based manual job defaults to allow_failure FALSE, which leaves every web
# pipeline sitting "blocked" on a job nobody intended to play.
"$[[ inputs.job_name ]]":
  # Starts immediately rather than waiting out a build stage it has no
  # dependency on. Soft-fail everywhere, so an earlier start is free.
  needs: []
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  variables:
    REPORT_PATH: "$[[ inputs.report_path ]]"
    # Routed through variables rather than interpolated into a script line: a
    # consumer's value carries shell operators ($(...), redirects), and the
    # rendered text would otherwise be parsed by the shell before expansion.
    #
    # BLOCK SCALAR, not a quoted string. These commands routinely contain double
    # quotes — `op read "op://..."` is the obvious case — and interpolating that
    # into a double-quoted YAML scalar produces a parse error at include time,
    # i.e. the consumer's whole pipeline fails to render.
    SECRET_TOKEN_COMMAND: |-
      $[[ inputs.secret_token_command ]]
  script:
    # Block scalars, not bare interpolation — matching version-bump-bot: an
    # unquoted command can otherwise be parsed as a YAML scalar of the wrong
    # type before it ever reaches the shell.
    - |
      $[[ inputs.setup_command ]]
    - |
      set -eo pipefail
      # PROTECTED REFS ONLY. `check_command` is supplied by the .gitlab-ci.yml of
      # the ref being tested, so on a merge-request branch the code that runs
      # here is the code under review. Exporting a credential before it would
      # hand any pushable branch whatever that token can reach — and these
      # tokens are typically broad (a 1Password service account reaches a whole
      # vault). CI_COMMIT_REF_PROTECTED is GitLab's own answer to that question
      # and needs no configuration to be correct.
      #
      # The cost is explicit: on an unprotected ref the check still runs and
      # still publishes its report, but anything needing the credential — an MR
      # comment, typically — does not happen. That is the right way round. If a
      # consumer needs privileged MR comments, the answer is a separate job on a
      # trusted trigger, not a token handed to branch-controlled code.
      #
      # A failed lookup on a protected ref is a WARNING, never fatal: under
      # `set -e` an unguarded eval would end the job before the report it exists
      # to produce. The `!` form is exempt from set -e by being a condition.
      if [ -n "$SECRET_TOKEN_COMMAND" ]; then
        if [ "$CI_COMMIT_REF_PROTECTED" = "true" ]; then
          if ! eval "$SECRET_TOKEN_COMMAND"; then
            printf '%s\n' "warning: credential setup failed; continuing without it" >&2
          fi
        else
          printf '%s\n' "note: unprotected ref — credential setup skipped; report still produced" >&2
        fi
      fi
    - |
      $[[ inputs.check_command ]]
  artifacts:
    paths:
      - "$[[ inputs.report_path ]]"
    expire_in: 7 days
    when: always
  rules:
    # Scheduled: the weekly sweep. Soft-fail — rc=1 only means updates exist.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    # Web: manual, and explicitly soft-fail (see the note above).
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    # Merge requests: informational for whoever is already reading the diff.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
      allow_failure: true
    # main: informational.
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
