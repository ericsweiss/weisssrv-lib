spec:
  inputs:
    job_name:
      default: version-check
    stage:
      default: lint
      description: >-
        Defaults to `lint` — this half is informational and runs alongside the
        MR lint jobs. Its bump-bot counterpart defaults to `maintenance`, so a
        consumer declaring stages needs both.
    image:
      default: python:3.11
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    setup_command:
      default: 'true'
      description: >-
        Shell command run before the check, to install whatever `check_command`
        needs. Defaults to a no-op and deliberately guesses NOTHING: the tools
        required are a property of the checker, which this template cannot see —
        the same reason `check_command` has no default. A guessed default would
        also have to float or rot, and a floating install is the worse of the
        two here: the job is soft-fail, so a checker that stops importing after
        an upstream release reports nothing at all, and "no report" is easy to
        read as "no updates". PIN what you install.
    check_command:
      description: >-
        REQUIRED. Shell command that reports available updates and writes
        `report_path`. It may exit 1 to signal "updates found"; this job is
        soft-fail on every trigger, so that is reported rather than fatal.
    report_path:
      default: "version-report.json"
      description: "Artifact the check writes; published on every outcome."
    github_token:
      default: ""
      description: >-
        OPTIONAL override for the GitHub token the checkers use for API auth
        (unauthenticated release lookups rate-limit at 60/hr and some
        endpoints refuse anonymous access outright). The default is EMPTY —
        no export happens and the job's inherited GH_API_TOKEN /
        GITHUB_TOKEN variables reach the checker with their normal
        precedence untouched. Pass a variable REFERENCE — e.g.
        `github_token: "$MY_RELEASE_LOOKUP_TOKEN"` — not a literal token:
        the reference lands in a bridge job variable unexpanded and resolves
        at runtime, so masked-variable protection still applies, and the
        script then exports it under BOTH names the stock checker reads
        (deliberately overriding any inherited value of either — that is
        what passing the input means). The credential caveat below still
        holds: on an MR this token is readable by the code under review, so
        scope it to public-read.
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH`: the value lands
        inside a quoted `rules:if` string, which GitLab does not expand, so the
        comparison would never match and the job would silently stop running
        post-merge.
    changes:
      type: array
      default: ["**/*"]
      description: >-
        `changes:` filter for the merge-request rule; the default matches every
        merge request. NOT an empty list: `changes` is an OR over the paths it
        lists, so `[]` has nothing to match and the job is simply never created —
        a report that silently stops existing is worse than one that runs too
        often. Pass narrower paths to filter it.
---
# Reports available dependency/pin updates WITHOUT changing anything — the
# read-only half of the pair whose other half (ci/maintenance/version-bump-bot.yml)
# rewrites pins and raises the MR on a schedule.
#
# NO CREDENTIAL RETRIEVAL HERE. `setup_command` and `check_command` come from the
# .gitlab-ci.yml of the ref under test and run in one shell, so on an MR they ARE
# the code under review: anything this job fetches, that code can read, and any
# guard around the fetch is defeatable by the step that runs before it. A consumer
# needing a token passes a masked CI variable scoped to what it would tolerate
# leaking (an MR comment needs only Reporter + `api`); privileged work belongs in
# a separate job triggered from a trusted ref.
#
# SOFT-FAIL ON EVERY TRIGGER: "updates are available" is rc=1 from most checkers,
# which must not redden a pipeline. The artifact is published `when: always`.
# The web rule needs its own `allow_failure: true` — a rules-based manual job
# defaults to allow_failure FALSE and leaves the pipeline "blocked".
"$[[ inputs.job_name ]]":
  # Starts immediately rather than waiting out a build stage it has no
  # dependency on. Soft-fail everywhere, so an earlier start is free.
  needs: []
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  variables:
    REPORT_PATH: "$[[ inputs.report_path ]]"
    VERSION_CHECK_GITHUB_TOKEN: "$[[ inputs.github_token ]]"
  script:
    # The bridge hop: see the github_token input. Both names the stock checker
    # reads are exported, before the consumer commands — but only when the
    # bridge carried a value, so an empty resolution cannot blank a token the
    # job inherited some other way.
    - |
      if [ -n "$VERSION_CHECK_GITHUB_TOKEN" ]; then
        export GH_API_TOKEN="$VERSION_CHECK_GITHUB_TOKEN"
        export GITHUB_TOKEN="$VERSION_CHECK_GITHUB_TOKEN"
      else
        echo "version-check: github_token resolved empty; GitHub lookups use whatever the job inherited (or run anonymous at 60/hr)"
      fi
    # Block scalars so a multi-line command works and no shell metacharacter in
    # the value can collide with YAML flow syntax.
    - |
      $[[ inputs.setup_command ]]
    - |
      $[[ inputs.check_command ]]
  artifacts:
    paths:
      - "$[[ inputs.report_path ]]"
    expire_in: 7 days
    when: always
  rules:
    # Scheduled: the weekly sweep. Soft-fail — rc=1 only means updates exist.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    # Web: manual, and explicitly soft-fail (see the note above).
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    # Merge requests: informational for whoever is already reading the diff.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
      allow_failure: true
    # Default branch: informational.
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      allow_failure: true
