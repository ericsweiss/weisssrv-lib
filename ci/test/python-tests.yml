spec:
  inputs:
    job_name:
      default: python-tests
    stage:
      default: test
    image:
      default: python:3.11-slim
    tags:
      type: array
      default: ["infrastructure"]
      description: Runner tag(s); pass `[]` for the tag-less tenant runner.
    test_dir:
      default: "scripts/"
      description: Directory pytest runs against (test_*.py live next to code).
    pytest_version:
      default: "9.1.1"
    pyyaml_version:
      default: "6.0.2"
    apt_packages:
      default: "git jq"
      description: >-
        Extra apt packages installed before the run (git is needed by tests that
        build throwaway git repos; jq by tests that parse JSON). Installing them
        needs ROOT — on the shared non-privileged tenant runner apt-get fails on
        the lock, so a tenant passes "" and uses an image that already ships
        what its tests need (e.g. the full `python:3.13`, which has git).
    pip_packages:
      default: ""
      description: >-
        Extra pip requirement specs installed alongside pytest/pyyaml, e.g.
        "copier==9.17.0". Word-split; pin every entry. Routed through a
        job variable, so a version-ceiling pin (`<`) is safe here — see the
        PIP_PACKAGES note below.
    setup_command:
      default: "true"
      description: >-
        Single shell command run in before_script AFTER the apt install and
        BEFORE the pip install (default no-op), so it may use anything
        `apt_packages` provides. For setup the package inputs cannot express —
        e.g. cloning a sibling repo that a cross-repo contract test asserts
        against, which needs the default `git`, or
        `python3 scripts/ci-fetch-tools.py jq amtool`, which drops verified
        static binaries into `$CI_PROJECT_DIR/.bin` (already on PATH here).
    default_branch:
      default: "main"
      description: >-
        Consumer's default branch as a LITERAL name (`main`, `master`, `trunk`)
        for the post-merge rule. NOT `$CI_DEFAULT_BRANCH` —
        docs/INCLUDE-CONTRACT.md § default_branch.
    changes:
      type: array
      default: ["scripts/**/*", ".gitlab-ci.yml"]
      description: >-
        Path list for the MR / default-branch `changes:` rules. It must name
        every tree the suites READ, doc trees included: a drift guard whose
        subject is absent here cannot fire on an MR that only touches that
        subject. Trace what the suite opens; do not reason about what it
        "should" read.
    job_memory_limit:
      default: "1500Mi"
      description: >-
        KUBERNETES_MEMORY_LIMIT for the job pod. Sizing policy:
        docs/INCLUDE-CONTRACT.md § Resource inputs.
    job_memory_request:
      default: "512Mi"
      description: KUBERNETES_MEMORY_REQUEST for the job pod (scheduler reservation).
    job_cpu_request:
      default: "300m"
      description: >-
        KUBERNETES_CPU_REQUEST for the job pod (scheduler reservation). Sizing
        policy: docs/INCLUDE-CONTRACT.md § Resource inputs.
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  needs: []  # run in parallel with the lint stage
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  variables:
    KUBERNETES_MEMORY_LIMIT: $[[ inputs.job_memory_limit ]]
    KUBERNETES_MEMORY_REQUEST: $[[ inputs.job_memory_request ]]
    KUBERNETES_CPU_REQUEST: $[[ inputs.job_cpu_request ]]
    # Both package lists reach the shell as VARIABLES, never as interpolated
    # text: a ceiling pin like `black<26.5.0` would otherwise render a literal
    # `<` the shell parses as a redirection before any expansion happens.
    APT_PACKAGES: "$[[ inputs.apt_packages ]]"
    PIP_PACKAGES: "$[[ inputs.pip_packages ]]"
  before_script:
    # `pip install --user` CLIs (ansible-playbook, copier) and the binaries a
    # setup_command drops into the workspace .bin resolve by name in the suite.
    - mkdir -p "$CI_PROJECT_DIR/.bin" && export PATH="$CI_PROJECT_DIR/.bin:$(python -m site --user-base)/bin:$PATH"
    - |
      if [ -n "$APT_PACKAGES" ]; then
        # shellcheck disable=SC2086  # intentional word-split of the package list
        apt-get update -qq && apt-get install -y -qq --no-install-recommends $APT_PACKAGES
      fi
    # Consumer setup hook (default no-op) — e.g. cloning a sibling repo a
    # cross-repo test asserts against. AFTER the apt install, whose default
    # `git jq` is exactly what such a hook needs on the slim default image.
    - $[[ inputs.setup_command ]]
    # `--user` + `python -m pytest`: the shared NON-ROOT runner cannot write
    # system site-packages, and ~/.local/bin is off PATH on python:*-slim.
    # shellcheck disable=SC2086  # intentional word-split of PIP_PACKAGES
    - pip install --user --quiet "pytest==$[[ inputs.pytest_version ]]" "pyyaml==$[[ inputs.pyyaml_version ]]" $PIP_PACKAGES
  script:
    - python -m pytest $[[ inputs.test_dir ]] -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.default_branch ]]"'
      changes: $[[ inputs.changes ]]
    - if: '$CI_PIPELINE_SOURCE == "web"'
