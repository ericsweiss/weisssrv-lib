spec:
  inputs:
    fragment_name:
      default: ".kubectl-setup"
      description: Name of the generated hidden job.
    kubectl_version:
      default: "v1.35.2"
      description: >-
        kubectl release to install. Keep within one minor of the cluster's
        server version; held there against the library's own Kubernetes minor by
        tests/test_pin_parity.py. `kubectl_sha256` must be re-taken when this
        moves.
    kubectl_sha256:
      default: "924eb50779153f20cb668117d141440b95df2f325a64452d78dff9469145e277"
      description: >-
        sha256 of the linux/amd64 binary for `kubectl_version`, from
        `https://dl.k8s.io/release/<version>/bin/linux/amd64/kubectl.sha256`.
    secrets_source:
      default: "1password"
      options: ["1password", "env"]
      description: >-
        How the kubeconfig is resolved. `1password` reads it with `op read` from
        `op_vault`; `env` takes it from `$KUBECONFIG_B64`, a masked CI variable,
        for a consumer on another backend. Either way the value is base64.
    op_vault:
      description: >-
        1Password vault holding the kubeconfig item. REQUIRED — a vault name is
        site data, so this template ships no default. The input has no default,
        so a value must be supplied even when `secrets_source` is `env`, where
        it is otherwise unused.
    kubeconfig_item:
      default: "K3s Kubeconfig"
      description: 1Password item holding the base64-encoded kubeconfig.
    kubeconfig_field:
      default: "kubeconfig"
      description: >-
        Field on `kubeconfig_item`. The value must be base64, so the YAML
        survives storage and retrieval unchanged.
---
# kubectl install (sha256-pinned) + kubeconfig fetch fragment, pulled into a
# job's before_script via !reference on top of a deploy base. Needs a
# root-capable runner. Usage: docs/INCLUDE-CONTRACT.md.
"$[[ inputs.fragment_name ]]":
  before_script:
    - |
      set -eo pipefail
      # jq, which every reader of `kubectl -o json` needs and nothing else in
      # the chain installs. Skipped when the image already ships it.
      if ! command -v jq >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends jq
        else
          apk add --no-cache jq || { echo "ERROR: no jq and neither apt-get nor apk is available — add jq to the job image" >&2; exit 1; }
        fi
      fi
    - |
      set -eo pipefail
      # sha256-pinned: a downloaded binary is verified before it is installed.
      # Per-job download dir: curl writes through a symlink planted at a fixed
      # /tmp path, before sha256sum sees the bytes.
      dl=$(mktemp -d)
      curl -fsSL "https://dl.k8s.io/release/$[[ inputs.kubectl_version ]]/bin/linux/amd64/kubectl" -o "$dl/kubectl"
      echo "$[[ inputs.kubectl_sha256 ]]  $dl/kubectl" | sha256sum -c -
      install -m 0755 "$dl/kubectl" /usr/local/bin/kubectl
      rm -rf "$dl"
    - |
      set -eo pipefail
      mkdir -p ~/.kube
      if [ "$[[ inputs.secrets_source ]]" = "1password" ]; then
        KUBECONFIG_B64=$(op read "op://$[[ inputs.op_vault ]]/$[[ inputs.kubeconfig_item ]]/$[[ inputs.kubeconfig_field ]]")
      fi
      if [ -z "$KUBECONFIG_B64" ]; then
        echo "ERROR: the kubeconfig resolved empty (secrets_source=$[[ inputs.secrets_source ]])" >&2
        exit 1
      fi
      # umask 077 subshell: never create the kubeconfig world-readable.
      (umask 077; echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config)
      # Structural, not just non-empty: catches a field stored un-base64'd or
      # truncated, which otherwise fails later as "connection refused".
      grep -q '^[[:space:]]*server:' ~/.kube/config || { echo "ERROR: the decoded kubeconfig has no server: entry (secrets_source=$[[ inputs.secrets_source ]]); check that the configured item/field holds base64 of a kubeconfig" >&2; exit 1; }
      export KUBECONFIG="$HOME/.kube/config"
      echo "Kubeconfig written ($(wc -c < ~/.kube/config) bytes), KUBECONFIG=$KUBECONFIG"
