---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-pod-volumes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["cronjobs"]
  matchConditions:
    - name: enforce-unless-finalizing-unchanged
      expression: >-
        request.operation != 'UPDATE'
        || !has(object.metadata.deletionTimestamp)
        || object.spec != oldObject.spec
        || (has(object.metadata.annotations) ? object.metadata.annotations : {})
        != (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
  variables:
    - name: volumes
      expression: >-
        request.resource.resource == 'pods'
        ? (has(object.spec) && has(object.spec.volumes) ? object.spec.volumes : [])
        : request.resource.resource == 'cronjobs'
        ? (has(object.spec) && has(object.spec.jobTemplate)
        && has(object.spec.jobTemplate.spec)
        && has(object.spec.jobTemplate.spec.template)
        && has(object.spec.jobTemplate.spec.template.spec)
        && has(object.spec.jobTemplate.spec.template.spec.volumes)
        ? object.spec.jobTemplate.spec.template.spec.volumes : [])
        : (has(object.spec) && has(object.spec.template)
        && has(object.spec.template.spec)
        && has(object.spec.template.spec.volumes)
        ? object.spec.template.spec.volumes : [])
  validations:
    - expression: >-
        variables.volumes.all(v, has(v.configMap) || has(v.csi) || has(v.downwardAPI)
        || has(v.emptyDir) || has(v.ephemeral) || has(v.persistentVolumeClaim)
        || has(v.projected) || has(v.secret))
      message: "tenant pods may use only configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected and secret volumes; nfs and other node-level volume types are platform-owned"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-pod-volumes
spec:
  policyName: tenant-pod-volumes
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: fluxcd.io/tenant
          operator: Exists
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-pvc-storageclasses
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
  matchConditions:
    - name: enforce-unless-finalizing-unchanged
      expression: >-
        request.operation != 'UPDATE'
        || !has(object.metadata.deletionTimestamp)
        || object.spec != oldObject.spec
        || (has(object.metadata.annotations) ? object.metadata.annotations : {})
        != (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
  validations:
    - expression: >-
        has(object.spec.storageClassName)
        && (object.spec.storageClassName == 'tenant-local'
        || (object.spec.storageClassName == ''
        && has(object.spec.volumeName)
        && object.spec.volumeName.startsWith(object.metadata.namespace + '-')))
      message: "tenant claims must use the tenant-local StorageClass, or name a platform-written static volume with storageClassName \"\" and a volumeName of the form <namespace>-<purpose>"
    - expression: >-
        !has(object.metadata.annotations)
        || !('volumeType' in object.metadata.annotations)
      message: "tenant claims may not carry a volumeType annotation; tenant-local volumes are always local"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-pvc-storageclasses
spec:
  policyName: tenant-pvc-storageclasses
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: fluxcd.io/tenant
          operator: Exists
