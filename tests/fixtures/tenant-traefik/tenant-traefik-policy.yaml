        || object.spec != oldObject.spec
        || (has(object.metadata.annotations) ? object.metadata.annotations : {})
        != (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
  validations:
    - expression: "object.metadata.name != 'default'"
      message: "the Traefik default TLSOption/TLSStore is platform-owned"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-traefik-tls-defaults
