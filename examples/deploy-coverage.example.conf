# Config for scripts/check-deploy-coverage.sh (default
# scripts/deploy-coverage.conf, override with $DEPLOY_COVERAGE_CONFIG). Entries
# name assets not wired to a CI deploy job; each needs a trailing `# rationale`.

[settings]
# roles_dir covers repo-local roles only; collection roles never match it.
# roles_dir = ansible/roles
playbooks_dir = ansible/playbooks
inventory_dir = ansible/inventories/prod
ci_file = .gitlab-ci.yml
job_prefix = deploy-
job_stage = deploy

[roles]
# Repo-local roles under roles_dir that no deploy job covers, e.g.:
# site_tuning   # host-local sysctl overrides; applied by hand with `task tune`

[playbooks]
site.yml                         # broad fan-out play; each deploy job lists its own triggers
k3s.yml                          # k3s node lifecycle; `task k3s:deploy`, never CI-driven
k3s-provision-vms.yml            # VM provisioning on Proxmox hosts; `task k3s:provision-vms`
zfs-encryption.yml               # sensitive cold-boot passphrase activation; `task zfs:encrypt`
proxmox-ha.yml                   # HA rules / replication; `task proxmox:ha`
postflight.yml                   # operator-run post-deploy verification helper
bootstrap/storage-bootstrap.yml  # one-shot ZFS pool bootstrap; too destructive for CI
maintenance/update-packages.yml  # wrapped by the maintenance-* jobs, not the deploy stage

[inventory]
hosts.yml           # group membership drives targeting for EVERY deploy; operator picks the jobs
group_vars/k3s.yml  # k3s cluster vars; deploy is manual via `task k3s:deploy`
