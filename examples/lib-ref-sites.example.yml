---
# Every file beyond .gitlab-ci.yml and ansible/requirements.yml that repeats the
# library release tag. Copy to scripts/lib-ref-sites.yml and edit: the paths are
# site data, so the list belongs beside the vendored check-lib-pins.py.

# Each entry is a glob relative to the repo root plus a regex carrying exactly
# ONE capture group — the ref, which must equal the declared one. Every file a
# glob matches must hold a pin, and a glob matching no file FAILS the gate.

# Anchor the capture on the delimiter that closes the pin, with a lookahead so
# only the tag is rewritten: unanchored, `v1.2.3-rc1` captures as `v1.2.3` and
# reads as the declared tag.
sites:
  # Terraform roots calling a library module at a `?ref=` pin.
  - path: terraform/*/main.tf
    pattern: 'weisssrv-lib\.git//terraform/modules/[a-z-]+\?ref=(v\d+\.\d+\.\d+)(?=")'
  # The one doc carrying the CLI install spec, named exactly: a glob over every
  # doc would match pages that hold no pin.
  - path: docs/getting-started.md
    pattern: 'weisssrv-lib\.git@(v\d+\.\d+\.\d+)(?=#subdirectory=cli)'
