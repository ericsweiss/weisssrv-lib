---
# Routing expectations for scripts/check-alertmanager-behaviour.py (--config).
# route_cases: one case per receiver the config should reach. Only the first
# matching receiver delivers, so `receiver` is compared against the first line.
route_cases:
  # A dead-man's-switch alert carries severity=none and must beat a
  # severity=none null route declared after it.
  - receiver: watchdog-heartbeat
    labels: [alertname=Watchdog, severity=none]
  - receiver: "null"
    labels: [alertname=InfoInhibitor, severity=none]
  - receiver: email-and-discord
    labels: [alertname=EtcdQuorumAtRisk, severity=critical]
  - receiver: discord-default
    labels: [alertname=DiskUsageWarning, severity=warning]
  # Fall-through: no child route matches, so the root receiver delivers.
  - receiver: discord-default
    labels: [alertname=SomeUnlabelledAlert]

# synthetic_route_alerts: route-case alertnames that deliberately name no rule.
# Only the fall-through case, whose point is that an alert matching no child
# route still reaches the root receiver.
synthetic_route_alerts:
  - SomeUnlabelledAlert

# upstream_alerts: alertnames a chart's own rule groups ship, which the
# extractor cannot see. An entry claims the name exists upstream and is not
# disabled; verify against the chart, since a typo recreates the blind spot.
upstream_alerts:
  - InfoInhibitor
  - KubeAggregatedAPIDown
  - KubePodNotReady
  - Watchdog

# rule_corpora: extra rule trees the extractor never reads, each a file or
# directory of plain `groups:` documents — a Loki ruler's rules, say — relative
# to --repo-root. Left out here because the path is site-specific.

# escalation_suffixes: the critical half of a sibling's name. A severity=warning
# alert whose name, with one of these appended or swapped in for its warning
# marker, is a severity=critical alert here is a pair needing an inhibit rule.
escalation_suffixes:
  - Prolonged
  - Critical

# escalation_warning_markers: the trailing word a warning alert's own name ends
# in, which a suffix above may replace (DiskUsageWarning -> DiskUsageCritical)
# or sit in front of (HostMemLow -> HostMemCriticalLow).
escalation_warning_markers:
  - Warning
  - Low
  - High

# escalation_equal: label keys the inhibit rule for every pair must share, so
# one instance's critical does not silence another instance's warning.
escalation_equal:
  - instance

# escalation_pairs: pairs whose names share no stem, declared by hand.
escalation_pairs:
  - critical: EtcdQuorumLost
    warning: EtcdQuorumAtRisk
    equal: [cluster]

# escalation_exceptions: pairs deliberately left un-inhibited, both severities
# delivering on purpose.
escalation_exceptions:
  - critical: CertificateExpiredProlonged
    warning: CertificateExpired

# matcher_parity_labels: matcher labels whose `=~`/`!~` regex must be a selector
# the mirrored rule's own expr declares. Leave the list out where no inhibit
# rule reproduces a rule's selector.
matcher_parity_labels:
  - instance
