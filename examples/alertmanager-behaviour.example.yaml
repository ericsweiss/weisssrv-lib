---
# Routing expectations for scripts/check-alertmanager-behaviour.py (--config).
#
# route_cases: one case per receiver the config is supposed to reach, plus any
# ordering the config itself calls load-bearing. `amtool config routes test`
# prints every matching receiver in tree order and only the first delivers, so
# `receiver` is compared against the first line.
route_cases:
  # A dead-man's-switch alert carries severity=none and must beat a
  # severity=none null route declared after it.
  - receiver: watchdog-heartbeat
    labels: [alertname=Watchdog, severity=none]
  - receiver: "null"
    labels: [alertname=InfoInhibitor, severity=none]
  - receiver: email-and-discord
    labels: [alertname=EtcdQuorumAtRisk, severity=critical]
  - receiver: discord-default
    labels: [alertname=DiskUsageWarning, severity=warning]
  # Fall-through: no child route matches, so the root receiver delivers.
  - receiver: discord-default
    labels: [alertname=SomeUnlabelledAlert]

# synthetic_route_alerts: route-case alertnames that deliberately name no rule.
# Only the fall-through case, whose point is that an alert matching no child
# route still reaches the root receiver.
synthetic_route_alerts:
  - SomeUnlabelledAlert

# upstream_alerts: alertnames shipped by a chart's own rule groups. The
# extractor sees only this repo's PrometheusRules, so a chart alertname named in
# an inhibit rule would otherwise read as dead. An entry claims the name exists
# upstream AND is not disabled — verify against the chart before adding one,
# because a typo'd entry recreates the blind spot.
upstream_alerts:
  - InfoInhibitor
  - KubeAggregatedAPIDown
  - KubePodNotReady
  - Watchdog
