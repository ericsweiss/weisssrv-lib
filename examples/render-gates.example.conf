# Config for scripts/run-render-gates.sh (default scripts/render-gates.conf,
# --config to override). One gate per line, in run order: `Label :: command`
# takes the corpus on stdin, `Label ::! command` does not. See docs/SCRIPTS.md.

Adding the tenants tree to the corpus ::! kustomize build kubernetes/clusters/CLUSTER/tenants >> "$RENDER_ALL" && printf "\n---\n" >> "$RENDER_ALL"
# Add --allow-unjudged-vpa-caps where charts render the VPA targets, or pin each
# target's limit in the policy file's vpa_cap_declared_limits.
Checking HPA/VPA invariant :: python3 scripts/check-hpa-vpa-invariant.py --require-chart-native-vpas --policy-config scripts/autoscaling-policy.yaml
Checking scrape/NetworkPolicy invariant :: python3 scripts/check-scrape-netpol.py
Checking ingress default-deny coverage :: python3 scripts/check-default-deny-coverage.py
Checking ClusterSecretStore scoping :: python3 scripts/check-secretstore-scope.py
Checking PVC storageClassName :: python3 scripts/check-pvc-storageclass.py
Checking ephemeral-storage against sized emptyDirs :: python3 scripts/check-ephemeral-storage-cap.py
# Add --allow-backend NAMESPACE/NAME=REASON for a Service a chart renders outside
# this corpus.
Checking route backends and scrape ports :: python3 scripts/check-ingressroute-backends.py
# Add --allow-external NAME=REASON for an issuer a chart installs outside this corpus.
Checking cert-manager issuer references :: python3 scripts/check-issuer-refs.py
# Add --allow-empty only on a cluster with no NFS PersistentVolume; without it an empty result is exit 2.
Checking NFS PersistentVolume TLS :: python3 scripts/check-nfs-tls.py
# Tree gates, not corpus gates: both read the repo, so neither takes stdin.
Checking helm repo parity ::! python3 scripts/check-helm-repo-parity.py
Checking dashboard registration ::! python3 scripts/check-dashboards.py
Schema-validating HelmRelease values blocks ::! python3 scripts/validate-helm-values.py --kubeconform --releases scripts/helm-values-releases.yaml --versions-configmap "$MERGED_CM" --policy-config scripts/autoscaling-policy.yaml
