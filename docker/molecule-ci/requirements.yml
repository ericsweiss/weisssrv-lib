---
# Galaxy collections baked into the molecule-ci image. A consumer whose roles
# need more either rebuilds the image from its own context or installs the
# extras in the job's before_script.

collections:
  # Major-line ranges, not the exact pins requirements.txt uses; docker/README.md
  # says why. tests/test_ansible_collection.py gates them by CONTAINMENT, so the
  # last two entries may be test-only. Bump a shared range in all three at once.
  - name: ansible.posix
    version: ">=2.1.0,<3.0.0"
  - name: community.general
    version: ">=12.2.0,<13.0.0"
  - name: community.crypto
    version: ">=3.1.0,<4.0.0"
  - name: community.docker
    version: ">=4.3.0,<5.0.0"

roles: []
